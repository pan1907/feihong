<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>飞鸿：苏轼的词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#C7D4D1; --land:#EEF0E8; --plateau:#E3E5D8; --coast:rgba(30,40,38,.5); --wash:#9FB3B2; --river:#7E9EAD; --lake:#B7CBCE; --mtn:rgba(70,82,72,.42);
  --ink:#1E2826; --muted:#66736F; --faint:rgba(30,40,38,.16);
  --qing:#2E5E7E; --huang:#B8860B; --panel:#F4F6F2; --rule:rgba(30,40,38,.14);
  --pt:#B0502F;--pt-ink:#FBF4EC;
  --m-da:#5E8F5B; --m-li:#4A78A0; --m-bei:#6A5683; --m-hao:#A9502F; --m-wu:#BE9536;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --zhu:#B3452F;
  --grain-img:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .07 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#0D1416; --land:#1B2421; --plateau:#212B26; --coast:rgba(221,228,224,.42); --wash:#2A3D42; --river:#4D6F7E; --lake:#20343A; --mtn:rgba(190,205,195,.32);
    --ink:#DDE4E0; --muted:#8C9894; --faint:rgba(221,228,224,.14);
    --qing:#82AFCB; --huang:#E3B845; --panel:#131B1D; --rule:rgba(221,228,224,.12);
    --pt:#D47F5F;--pt-ink:#1A1110;
    --m-da:#86B97F; --m-li:#7BA8D0; --m-bei:#A893C4; --m-hao:#D98466; --m-wu:#DDB75E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --sea:#0D1416; --land:#1B2421; --plateau:#212B26; --coast:rgba(221,228,224,.42); --wash:#2A3D42; --river:#4D6F7E; --lake:#20343A; --mtn:rgba(190,205,195,.32);
    --ink:#DDE4E0; --muted:#8C9894; --faint:rgba(221,228,224,.14);
    --qing:#82AFCB; --huang:#E3B845; --panel:#131B1D; --rule:rgba(221,228,224,.12);
    --pt:#D47F5F;--pt-ink:#1A1110;
    --m-da:#86B97F; --m-li:#7BA8D0; --m-bei:#A893C4; --m-hao:#D98466; --m-wu:#DDB75E;
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--panel);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--qing);outline-offset:2px;border-radius:2px}

.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(420px,36vw);grid-template-rows:1fr auto;grid-template-areas:"map panel" "time time"}
.map{grid-area:map;position:relative;background:var(--sea);overflow:hidden;touch-action:none;cursor:grab}
.map.dragging{cursor:grabbing}
.map svg{width:100%;height:100%;display:block}
#cam{transform-origin:0 0;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
#cam.instant{transition:none}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.8;vector-effect:non-scaling-stroke}
.wash{fill:none;stroke:var(--wash);vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wash.w1{stroke-width:14;opacity:.28}.wash.w2{stroke-width:5;opacity:.45}
.plateau{fill:var(--plateau)}
.mtn{fill:url(#peaks);stroke:none}
.glab{pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.glab.mt{fill:var(--mtn);font-weight:600}
.glab.rv{fill:var(--river);stroke:none}
.glab.sea{fill:var(--wash);stroke:none;font-weight:600}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .38  0 0 0 0 .33  0 0 0 .35 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grain{mix-blend-mode:screen;opacity:.18}}
:root[data-theme="dark"] .grain{mix-blend-mode:screen;opacity:.18}
.lake{fill:var(--lake);stroke:none}
.prov{fill:none;stroke:var(--coast);stroke-width:.7;stroke-dasharray:4 2.5 1 2.5;opacity:.55;vector-effect:non-scaling-stroke}
.glab.prov{fill:var(--muted);stroke:var(--land);font-weight:400;opacity:.75}
.river{fill:none;stroke:var(--river);stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.river.major{stroke-width:2}.river.minor{stroke-width:.9;opacity:.85}
.route-all{display:none;fill:none;stroke:var(--faint);opacity:.7;stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.route-done{fill:none;stroke:var(--qing);stroke-width:.9;stroke-linejoin:round;opacity:.28;vector-effect:non-scaling-stroke}
.route-trail{fill:none;stroke:var(--qing);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.85;vector-effect:non-scaling-stroke}
.pl circle{fill:var(--muted);opacity:.35;stroke:none;transition:fill .4s,opacity .4s}
.pl.seen circle{opacity:.95;fill:var(--pt)}
.pl.off{opacity:.15}
.route-hl{fill:none;stroke:var(--huang);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pl.hov circle{stroke:var(--huang);stroke-width:3;vector-effect:non-scaling-stroke}
.grp,.row{transition:background .15s}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--muted);margin:0 0 10px}
.crumbs button{color:var(--qing);padding:2px 0;font-size:13px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--qing) 40%,transparent);text-underline-offset:3px}
.crumbs button[data-c="0"]::before{content:"⌂ ";text-decoration:none}
.crumbs button:hover{text-decoration:underline}
.crumbs span{color:var(--ink)}
.crumbs i{font-style:normal;opacity:.5;margin:0 2px}
.fbar{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--huang);margin:-4px 0 10px;padding:2px 10px;border:1px solid color-mix(in srgb,var(--huang) 45%,transparent);border-radius:11px}
.fbar button{font-size:12.5px;color:var(--huang);text-decoration:underline}
.why{color:var(--muted);font-size:13px;display:block}
.visit{cursor:default;border-radius:3px;padding-left:8px!important;margin-left:-8px}
.visit.on{background:color-mix(in srgb,var(--huang) 10%,transparent)}
.vno{font-weight:600;color:var(--ink)}
.vrole{display:block;font-size:14.5px}
.read h3 .hint{font-weight:400;letter-spacing:0;font-size:12px}
.pl-poems{padding-bottom:0}.pl-poems+.list{padding-top:0}.pl-poems h3{display:flex;align-items:center;gap:10px}.pl-poems .mb{display:flex;flex:1;height:5px;border-radius:2px;overflow:hidden;margin:0}
.star{font-style:normal;color:var(--huang);margin-right:4px;font-size:.85em}
.row.fm .tt{font-weight:600}
.fmtag{display:inline-flex;align-items:center;font-size:13px;color:var(--huang);padding:1px 10px;border:1px solid var(--huang);border-radius:11px;font-weight:600}
.moods .fmb{color:var(--huang);border-color:color-mix(in srgb,var(--huang) 50%,transparent)}
.moods .fmb[aria-pressed="true"]{color:var(--panel);background:var(--huang);border-color:var(--huang)}
.yrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.yrs button{font-size:13px;padding:2px 10px;border:1px solid var(--rule);border-radius:11px;color:var(--muted)}
.yrs button small{font-size:11px;opacity:.6;margin-left:2px}
.yrs button[aria-pressed="true"]{border-color:var(--qing);color:var(--panel);background:var(--qing);font-weight:600}
.pl.on circle{stroke:var(--panel);stroke-width:1.2;vector-effect:non-scaling-stroke}
#arrows path{fill:var(--qing);opacity:.95}
#months .seq rect{fill:var(--pt)}#months .seq text{fill:var(--pt-ink);font-weight:700;font-family:var(--serif)}
#months .seq.first rect{fill:var(--huang)}
.stp{cursor:pointer}.pl:focus,.stp:focus{outline:none}.pl:focus-visible circle,.stp:focus-visible circle{stroke:var(--huang);stroke-width:2.5}.stp circle{fill:var(--panel);stroke:var(--pt);stroke-width:1.2;vector-effect:non-scaling-stroke}
.stp text{fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.pl.seen circle{fill:var(--pt);stroke:none}
.pl{cursor:pointer}
.pl text{fill:var(--muted);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.pl.seen text{fill:var(--ink)}
.pl text .mod{fill:var(--muted);font-weight:400;font-size:.78em}
.pl.sel circle{stroke:var(--huang);stroke-width:2.5}
.here circle.dot{fill:var(--huang)}
.here circle.ring{fill:none;stroke:var(--huang);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:0}
.here.pulse circle.ring{animation:ring 1.6s ease-out 1}
@keyframes ring{0%{opacity:.9;r:var(--r0)}100%{opacity:0;r:var(--r1)}}
.here text{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}

.title{position:absolute;left:14px;top:12px;pointer-events:none;max-width:60%;padding:8px 12px;background:color-mix(in srgb,var(--sea) 82%,transparent);border-radius:3px}
.title h1{font-size:22px;font-weight:900;margin:0;letter-spacing:.3em}
.title{pointer-events:auto}
.trow{display:flex;align-items:center;gap:12px}
#h1{cursor:help;outline:none}
.tip{position:absolute;left:0;top:calc(100% + 10px);z-index:6;width:max-content;max-width:320px;padding:10px 14px;background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);
  font-size:14px;line-height:1.7;color:var(--ink);letter-spacing:.04em;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s}
.tip cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.tip small{display:block;font-size:12px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px solid var(--rule)}
#h1:hover~.tip,#h1:focus~.tip{opacity:1;transform:none}
.title p cite{font-style:normal;font-size:12px;opacity:.75;margin-left:.6em;letter-spacing:0}
.whoname,.whosel summary{font-size:22px;font-weight:900;letter-spacing:.3em;color:var(--ink);padding-left:12px;border-left:1px solid var(--rule);line-height:1.1}
.whosel{position:relative}.whosel summary{cursor:pointer;list-style:none}.whosel summary::after{content:" ▾";color:var(--muted);font-size:12px}
.whosel ul{position:absolute;top:26px;left:0;margin:0;padding:6px 0;list-style:none;background:var(--panel);border:1px solid var(--rule);border-radius:3px;min-width:200px;z-index:5}
.whosel a{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;color:var(--ink);text-decoration:none;font-size:14px}
.whosel a small{color:var(--muted);font-size:12px}
.whosel a[aria-current]{color:var(--qing)}
.epi{margin:12px 0 0;font-size:15px;line-height:1.8;color:var(--ink);padding-left:12px;border-left:2px solid var(--zhu)}
.epi cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.title p{margin:4px 0 0;font-size:13px;color:var(--muted);letter-spacing:.08em}
.mapctl{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.mapctl button{background:var(--panel);border:1px solid var(--rule);font-size:13px;padding:5px 10px;border-radius:3px}
.mapctl button[aria-pressed="true"]{border-color:var(--qing);color:var(--qing)}

.panel{grid-area:panel;display:flex;flex-direction:column;border-left:1px solid var(--rule);background:var(--panel);min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.head{padding:24px 30px 14px}
.era{font-size:44px;font-weight:900;line-height:1.05;letter-spacing:.06em;margin:0}
.where{margin:10px 0 0;font-size:15px;line-height:1.7}
.where b{font-weight:600}
.poem{--fs:20px;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:400;height:clamp(300px,46vh,480px);width:calc(100% - 36px);margin:6px 18px 0;padding:18px 12px 14px;overflow-x:auto;overflow-y:hidden;writing-mode:vertical-rl;text-orientation:mixed;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);scrollbar-width:thin}
.poem.tc{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.poem h2{margin:0 0 0 calc(var(--fs)*.9);font-size:calc(var(--fs)*1.15);font-weight:700;letter-spacing:.12em;font-family:inherit}
.poem h2 small{display:block;font-family:inherit;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:.05em;margin-top:.8em;max-block-size:18em;line-height:1.6}
.poem .ln{font-size:var(--fs);line-height:1.85;letter-spacing:.12em;margin:0}
.poem.horiz{writing-mode:horizontal-tb;height:auto;width:auto;overflow:visible;padding:18px 12px}
.poem.horiz h2{margin:0 0 12px;font-size:21px}
.poem.horiz h2 small{display:inline;margin:0 0 0 .8em}
.poem.horiz .ln{font-size:17px;line-height:1.9;letter-spacing:.06em}
.read{padding:18px 30px 28px;font-size:15px;line-height:1.95}
.read h3{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 4px;letter-spacing:.08em}
.read h3:first-child{margin-top:0}
.read p{margin:0 0 6px}
.read .note{display:block;margin:10px 0 0;padding-left:12px;border-left:2px solid var(--rule)}
.read .note q{quotes:none;font-weight:600}
.read .note q::before,.read .note q::after{content:none}
.evs{list-style:none;margin:6px 0 0;padding:0}
.evs li{padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.75}
.evs li:last-child{border-bottom:0}
.evs li.evsep{border-bottom:0;padding:14px 0 2px;font-size:12px;color:var(--muted);letter-spacing:.1em}
.evh{display:block;font-size:12.5px;color:var(--muted);margin-bottom:1px}
.evs li.this{border-left:3px solid var(--qing);padding-left:10px;margin-left:-13px;background:color-mix(in srgb,var(--qing) 8%,transparent)}
.evs li.this .evh{color:var(--qing);font-weight:600}
.evs li.mark{color:var(--qing);font-weight:600}
.evs li.after{opacity:.55}
.evme{display:block;font-size:12.5px;color:var(--qing);font-weight:600;margin-top:2px}
.more{margin-top:18px}
.more summary{cursor:pointer;font-size:13px;color:var(--qing)}
.tags{margin:18px 0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tags .who{font-size:13.5px;font-weight:600;margin-right:6px;padding-left:9px;border-left:3px solid var(--qing)}
.tags span{font-size:12.5px;padding:1px 9px;border:1px solid var(--qing);color:var(--qing);border-radius:10px}
.read a{color:var(--qing)}
.read .cm{font-size:14px;line-height:1.9;margin:10px 0;text-indent:2em}
.read .fine{font-size:12.5px;color:var(--muted);margin-top:14px}
.ask{margin-top:4px;padding:8px 14px;border:1px solid var(--qing);color:var(--qing);border-radius:3px;font-size:14px}
.ask:disabled{opacity:.5}
.thinking{color:var(--muted)}
.empty{padding:6px 30px 28px;font-size:15px;line-height:1.9;color:var(--muted)}
.empty button{color:var(--qing);border-bottom:1px solid currentColor;margin-top:6px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 18px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);background:var(--panel)}
.pager button{padding:6px 8px;font-size:14px;color:var(--ink)}
.pager button:disabled{opacity:.3;cursor:default}
.pager .mid{display:flex;align-items:center;gap:10px}
.pager .mode{font-size:12.5px;color:var(--qing);padding:4px 6px}
.pager .cs{display:none}
.pager button{white-space:nowrap}
.list{padding:0 0 16px}
.list button{display:flex;width:100%;text-align:left;padding:9px 30px;gap:14px;font-size:15px;line-height:1.5}
.list button:hover{background:var(--faint)}
.list .yr{color:var(--muted);font-size:13px;min-width:3.2em;padding-top:2px}
.back{font-size:13px;color:var(--qing);margin-bottom:8px}
.time{grid-area:time;border-top:1px solid var(--rule);background:var(--panel);padding:8px 18px 12px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
.pctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.pace{font-size:11.5px;color:var(--muted);padding:1px 6px;border:1px solid var(--rule);border-radius:9px}
.play{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;margin-bottom:2px}
.play svg{width:14px;height:14px;fill:var(--ink)}
.track{position:relative;min-width:0}
.stages{display:flex;font-size:12.5px;color:var(--muted);margin-bottom:4px;position:relative;height:18px}
.stages button{position:absolute;white-space:nowrap;font-size:12.5px;color:var(--muted);padding:0 2px;border-left:1px solid var(--rule);padding-left:5px;overflow:hidden;text-overflow:ellipsis}
.stages button.on{color:var(--ink);font-weight:600}
.bars{position:relative;height:46px;display:flex;align-items:flex-end;gap:1px;cursor:pointer;touch-action:none}
.bars i{flex:1;background:var(--faint);min-height:2px;border-radius:1px 1px 0 0;display:flex;flex-direction:column-reverse;overflow:hidden;opacity:.55;position:relative}
.bars i.ci{background:none}
.bars i.past{opacity:1}
.bars i b{display:block;width:100%;transition:opacity .3s}
.bars i b.off{opacity:.12}
.bars i.cur{opacity:1;box-shadow:0 0 0 1.5px var(--ink)}
.bars i.cur::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--huang)}
.moods{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.moods button{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);padding:2px 9px;border:1px solid var(--rule);border-radius:11px;white-space:nowrap}
.moods button i{width:8px;height:8px;border-radius:50%;display:inline-block}
.moods button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.moods .lab{font-size:12.5px;color:var(--muted);padding:3px 2px 0 0;white-space:nowrap}
.pl.dim{opacity:.18}
.tags span{cursor:pointer}
.read .tags span{border-color:var(--c);color:var(--c)}
.famrow{margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.fam{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--c);padding:1px 10px 1px 8px;border:1px solid var(--c);border-radius:11px;opacity:.75}
.fam.main{opacity:1;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent)}
.tags span.sub{font-size:13px;color:var(--muted);border:0;padding:0;border-radius:0;cursor:default}
.fam i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.famnote{font-size:12.5px;color:var(--muted);align-self:center}
.bars i b.hit{position:absolute;left:0;right:0;bottom:0;opacity:1}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:3px}
.src{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}

/* ---- 两种状态：探索（地图为主）/ 阅读（词为主） ---- */
.side{grid-area:side;display:none;overflow-y:auto;border-right:1px solid var(--rule);border-top:1px solid var(--rule);padding:16px 18px 24px;background:var(--panel)}
.side h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;letter-spacing:.08em}
.backmap{display:none;position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--rule);font-size:13px;padding:5px 10px;border-radius:3px;z-index:2}
.cap{display:none;position:absolute;left:16px;bottom:16px;max-width:min(420px,70%);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--rule);border-radius:4px;padding:12px 16px;pointer-events:none}
.cap .ce{font-size:13px;color:var(--muted)}.cap .ct{font-size:19px;font-weight:700;margin:4px 0}.cap .cl{font-size:15px;line-height:1.8}
.app.v-explore.playing .cap{display:block}
.app.v-explore{grid-template-columns:1fr minmax(340px,28vw)}
.app.v-read{grid-template-columns:minmax(260px,22vw) 1fr;grid-template-rows:minmax(200px,36vh) 1fr auto;grid-template-areas:"map panel" "side panel" "time time"}
.app.v-read .side{display:block}
.app.v-read .title,.app.v-read .mapctl,.app.v-read .grain{display:none}
.app.v-read .backmap{display:block}
.app.v-read .map{cursor:grab}
.app.v-read .stages{display:none}
.app.v-read .scroll{overflow:hidden;display:flex;flex-direction:column}
.app.v-read #head,.app.v-read #body{width:100%;max-width:980px;margin:0 auto}
.pref{flex:none;margin:14px 30px 0;font-size:15.5px;line-height:1.9;letter-spacing:.04em;color:color-mix(in srgb,var(--ink) 82%,var(--muted));font-family:var(--serif)}
.pref.tc{font-family:"Noto Serif TC","Songti TC",serif}
.pref b{font-weight:400;font-size:12.5px;letter-spacing:.15em;margin-right:12px;color:var(--muted);vertical-align:1px}
.app.v-read #body{flex:1;min-height:0;display:flex;flex-direction:column}
.app.v-read .poem{flex:none;height:clamp(260px,40vh,460px);width:fit-content;min-width:min(420px,calc(100% - 36px));max-width:calc(100% - 36px);margin:6px auto 0;padding-left:28px;padding-right:28px}
.app.v-read .poem.horiz{width:auto;margin:6px 18px 0}
/* 词作卡片：淡纸色、双线版框、乌丝栏、远山淡墨、印章 */
.poem{position:relative}
.app.v-read .poem{border:0;margin-top:14px;margin-bottom:6px;padding:30px 34px 30px 30px;
  background-color:color-mix(in srgb,var(--panel) 93%,var(--ink) 7%);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 160' preserveAspectRatio='none'><path d='M0 160 L0 118 C40 104 70 80 110 92 C150 104 170 70 215 62 C260 54 280 96 330 100 C380 104 400 74 450 80 C500 86 540 112 600 104 L600 160 Z' fill='%23808a86' opacity='.13'/><path d='M0 160 L0 136 C60 122 100 112 160 124 C220 136 260 118 320 126 C380 134 440 120 500 130 C540 136 570 130 600 132 L600 160 Z' fill='%23808a86' opacity='.12'/></svg>"),var(--grain-img);
  background-repeat:no-repeat,repeat;background-position:left bottom,0 0;background-size:100% 34%,220px;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 22%,transparent),inset 0 0 0 5px color-mix(in srgb,var(--panel) 93%,var(--ink) 7%),inset 0 0 0 6px color-mix(in srgb,var(--ink) 14%,transparent);border-radius:2px}
.app.v-read .poem:not(.horiz) .ln,.app.v-read .poem:not(.horiz) h2{padding:0 .2em;border-left:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
.app.v-read .poem:not(.horiz) h2{margin-left:.4em;border-left-color:color-mix(in srgb,var(--ink) 16%,transparent)}
.seal{position:absolute;left:16px;bottom:16px;writing-mode:vertical-rl;text-orientation:upright;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1;letter-spacing:.05em;
  color:#F6EEE3;background:var(--zhu);padding:5px 4px;border-radius:2px;opacity:.9;box-shadow:inset 0 0 0 1.5px rgba(246,238,227,.55);display:none}
.app.v-read .seal{display:block}
.app.v-read .poem.horiz .seal{writing-mode:horizontal-tb;left:auto;right:16px;bottom:14px;padding:4px 6px}
.app.v-read .poem.horiz{height:auto;max-height:44vh;overflow-y:auto}
.app.v-read .read{flex:1;min-height:0;overflow-y:auto}
.app.v-read .head{padding:18px 30px 10px}
.app.v-read .era{font-size:32px}
.app.v-read .where{margin-top:6px}
.app.v-read .poem h2 small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.app.v-read .poem h2 small.open{display:block;-webkit-line-clamp:unset}
.app.v-read .poem.horiz{max-height:42vh}
.app.v-read .more.yev{display:none}
.app.v-read .empty,.app.v-read #body>.read:only-child{overflow-y:auto}
.intro{margin:10px 0 0;font-size:14px;color:var(--muted);line-height:1.8}
.stg-h{margin:6px 30px 4px;font-size:12.5px;color:var(--muted);letter-spacing:.2em}
.stg-list{position:relative;margin:0 30px 28px 30px}
.stg-list::before{content:"";position:absolute;left:5px;top:18px;bottom:22px;width:1px;background:var(--rule)}
.stg{position:relative;display:block;width:100%;text-align:left;padding:11px 0 13px 24px;border-radius:3px}
.stg::before{content:"";position:absolute;left:1px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1.5px solid var(--muted)}
.stg:hover::before{border-color:var(--pt);background:var(--pt)}
.stg:hover{background:none}.stg:hover .sn{color:var(--pt)}
.stg .sn{font-size:15.5px;font-weight:600}.stg .sy{font-size:12.5px;color:var(--muted);margin-left:8px}
.stg .sp{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.7}
.stg .mb{display:flex;height:3px;margin-top:8px;border-radius:2px;overflow:hidden;background:var(--faint)}
.row{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;width:100%;text-align:left;padding:9px 30px;font-size:15px;line-height:1.5;align-items:baseline}
.row:hover{background:var(--faint)}
.list .row{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;padding:9px 30px}
.list .row.ny{grid-template-columns:1fr auto}
.row .rp{justify-self:end}
.row .yr{color:var(--muted);font-size:13px}
.row .tt small{color:var(--muted);font-size:12.5px;margin-left:6px}
.row .rp{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.row .rp i{width:7px;height:7px;border-radius:50%;display:inline-block}
.row .go{font-weight:400;color:var(--muted);font-size:15px;margin-left:2px}
.row:hover .go{color:var(--qing)}
.lhint{padding:4px 30px 0;font-size:12.5px;color:var(--muted)}
.grp{padding:14px 30px 4px;font-size:13px;color:var(--muted);letter-spacing:.06em}

/* ---- 开场：只画一条线，慢慢走完他的一生，然后进入全局 ---- */
.open-line{fill:none;stroke:var(--huang);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;display:none}
#openLabels text{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .8s}
#openLabels text.on{opacity:1}
#openLabels text tspan{fill:var(--muted);font-weight:400}
#openLabels circle{fill:var(--huang);opacity:0;transition:opacity .6s}
#openLabels .oseg{fill:none;stroke:var(--huang);stroke-linecap:round}
.ocap{position:absolute;z-index:4;display:none;width:min(300px,42%);padding:12px 16px 13px;background:color-mix(in srgb,var(--panel) 92%,transparent);border-left:2px solid var(--huang);border-radius:2px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  opacity:0;transform:translateY(4px);transition:opacity .6s,transform .6s;pointer-events:none}
.app.opening .ocap{display:block}
.ocap.in{opacity:1;transform:none}
.on-place{font-size:22px;font-weight:700;margin:0;letter-spacing:.1em}.on-place span{font-size:13px;font-weight:400;color:var(--muted);margin-left:12px;letter-spacing:.05em}
.on-note{font-size:15px;line-height:1.95;margin:8px 0 0}
#openLabels circle.on{opacity:1}
.open-pane{display:none;flex-direction:column;justify-content:center;height:100%;padding:40px 36px}
.open-pane .on-name{font-size:52px;font-weight:900;letter-spacing:.2em;margin:0}
.open-pane .on-yrs{font-size:15px;color:var(--muted);margin:10px 0 0;letter-spacing:.1em}
.open-pane .on-intro{font-size:14.5px;line-height:2;margin:22px 0 0;max-width:32em;color:var(--muted)}
.open-pane .on-skip{margin-top:40px;align-self:flex-start;font-size:13px;color:var(--muted);border-bottom:1px solid var(--rule)}
.open-pane>*{opacity:0;transform:translateY(6px);transition:opacity 1.2s,transform 1.2s}
.open-pane.show>*{opacity:1;transform:none}
.open-pane.show .on-yrs{transition-delay:.5s}.open-pane.show .on-intro{transition-delay:1.2s}.open-pane.show .on-skip{transition-delay:2.4s}
.app.opening .open-pane{display:flex}
.app.opening .scroll,.app.opening #pagerSlot,.app.opening .mapctl{display:none}
.app.opening .time{display:none}
.app.opening .open-line{display:block}
#openLabels{display:none}.app.opening #openLabels{display:block}
.app.opening #routeAll,.app.opening #routeDone,.app.opening #routeTrail,.app.opening #routeHL,.app.opening #arrows,.app.opening #months,.app.opening #stopsG,.app.opening #here{display:none}
.app.opening .pl{opacity:.22}.app.opening .pl text{display:none}
.app.opening .prov,.app.opening .glab.prov{opacity:.25}
.time{transition:opacity .8s}
.replay{display:inline-flex;align-items:center;gap:7px;margin:14px 0 6px;padding:0;font-size:14px;letter-spacing:.08em;color:var(--muted);transition:color .2s}
.replay svg{width:9px;height:9px;fill:currentColor}
.replay:hover{color:var(--huang)}

@media (max-width:760px){
  .app,.app.v-explore{grid-template-columns:1fr;grid-template-rows:52vh 1fr auto;grid-template-areas:"map" "panel" "time"}
  .app.v-read{grid-template-columns:1fr;grid-template-rows:120px 1fr auto;grid-template-areas:"map" "panel" "time"}
  .app.v-read .side{display:none}
  .app.v-read .more.yev{display:block}
  .app.v-read .poem{height:260px}
  .app.v-read .scroll{overflow-y:auto;display:block}
  .app.v-read #body{display:block}
  .app.v-read .read{overflow:visible}
  .app.v-read .poem.horiz{max-height:none}
  .app.v-read .moods{display:none}
  .app.v-read .era{font-size:26px}
  .stg,.row{padding-left:18px;padding-right:18px}
  .panel{border-left:0;border-top:1px solid var(--rule)}
  .head{padding:14px 18px 10px}
  .era{font-size:30px}
  .where{font-size:14px;margin-top:6px}
  .pager .cl{display:none}.pager .cs{display:inline}.pager{padding:6px 10px}
  .poem{height:300px;width:calc(100% - 20px);margin:4px 10px 0}
  .read{padding:14px 18px 22px}
  .title{left:8px;top:8px;padding:6px 9px}.title h1{font-size:16px}.title p{font-size:12px}
  .stages{display:none}
  .time{padding:8px 12px 10px}
  .src{display:none}
}
@media (prefers-reduced-motion:reduce){#cam{transition:none}.here.pulse circle.ring{animation:none}}

》","l":["玉人家在凤凰山。","水云间。","掩门闲。","门外行人，立马看弓弯，十里春风谁指似，斜日映，绣帘斑。","多情好事与君还。","悯新鳏。","拭馀潸。","明月空江，香雾著云鬟。","陌上花开看尽也，闻旧曲，破朱颜。"],"lt":["玉人家在鳳凰山。","水雲間。","掩門閒。","門外行人，立馬看弓彎，十里春風誰指似，斜日映，繡簾斑。","多情好事與君還。","憫新鰥。","拭餘潸。","明月空江，香霧著雲鬟。","陌上花開看盡也，聞舊曲，破朱顏。"],"nc":0},{"id":"351980","y":1073,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"江神子","ti":"江神子 湖上与张先同赋时闻弹筝","tit":"江神子 湖上與張先同賦時聞彈箏","ev":"在钱塘，为杭州通判。湖上，苏轼与张先同赋《江神子》","l":["凤凰山下雨初晴。","水风清。","晚霞明。","一朵芙蕖，开过尚盈盈。","何处飞来双白鹭，如有意，慕娉婷。","忽闻江上弄哀筝。","苦含情。","遣谁听。","烟敛云收，依约是湘灵。","欲待曲终寻问取，人不见，数峰青。"],"lt":["鳳凰山下雨初晴。","水風清。","晚霞明。","一朵芙蕖，開過尚盈盈。","何處飛來雙白鷺，如有意，慕娉婷。","忽聞江上弄哀箏。","苦含情。","遣誰聽。","煙斂雲收，依約是湘靈。","欲待曲終尋問取，人不見，數峯青。"],"nc":1},{"id":"352278","y":1073,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"占春芳","ti":"占春芳","tit":"佔春芳","ev":"在钱塘，为杭州通判。暮春，苏轼有《占春芳》词。（红杏了）","l":["红杏了，夭桃尽，独自占春芳。","不比人间兰麝，自然透骨生香。","对酒莫相忘。","似佳人、兼合明光。","只忧长笛吹花落，除是宁王。"],"lt":["紅杏了，夭桃盡，獨自佔春芳。","不比人間蘭麝，自然透骨生香。","對酒莫相忘。","似佳人、兼合明光。","只憂長笛吹花落，除是寧王。"],"nc":0},{"id":"351973","y":1074,"m":1,"pl":"丹阳","an":null,"sn":"丹阳","sf":"润州丹阳","pv":"江苏","lat":32.015388,"lng":119.613436,"tu":"行香子","ti":"行香子 丹阳寄述古","tit":"行香子 丹陽寄述古","ev":"在丹阳，为杭州通判。正月初二日，立春，苏轼寄诗鲁有开（元翰）。赋《行香子》寄陈襄（述古）","l":["携手江村。","梅雪飘裙。","情何限、处处消魂。","故人不见，旧曲重闻。","向望湖楼，孤山寺，涌金门。","寻常行处，题诗千首，绣罗衫、与拂红尘。","别来相忆，知是何人。","有湖中月，江边柳，陇头云。"],"lt":["攜手江村。","梅雪飄裙。","情何限、處處消魂。","故人不見，舊曲重聞。","向望湖樓，孤山寺，湧金門。","尋常行處，題詩千首，繡羅衫、與拂紅塵。","別來相憶，知是何人。","有湖中月，江邊柳，隴頭雲。"],"nc":1},{"id":"352259","y":1074,"m":1,"pl":"丹阳","an":null,"sn":"丹阳","sf":"润州丹阳","pv":"江苏","lat":32.015388,"lng":119.613436,"tu":"减字木兰花","ti":"减字木兰花 得书","tit":"減字木蘭花 得書","ev":"在丹阳，为杭州通判。正月初一日，苏轼赋《减字木兰花·得书》","l":["晓来风细。","不会鹊声来报喜。","却羡寒梅。","先觉春风一夜来。","香笺一纸。","写尽回纹机上意。","欲卷重开。","读遍千回与万回。"],"lt":["曉來風細。","不會鵲聲來報喜。","卻羨寒梅。","先覺春風一夜來。","香箋一紙。","寫盡回紋機上意。","欲卷重開。","讀遍千回與萬回。"],"nc":0},{"id":"352196","y":1074,"m":3,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"ln y":1074,"m":11,"pl":"连云港","an":"朐山","sn":"海州","sf":"淮南东路海州","pv":"江苏","lat":34.602342,"lng":119.229571,"tu":"沁园春","ti":"沁园春 赴密州早行马上寄子由","tit":"沁園春 赴密州早行馬上寄子由","ev":"赴密州知州任途中，苏轼与周邠（开祖）简，贺其得知乐清。屡与单锡（君贶）简。濒海行，赋《沁园春》寄弟辙。","l":["孤馆灯青，野店鸡号，旅枕梦残。","渐月华收练，晨霜耿耿，云山摛锦，朝露漙漙。","世路无穷，劳生有限，似此区区长鲜欢。","微吟罢，凭征鞍无语，往事千端。","当时共客长安。","似二陆初来俱少年。","有笔头千字，胸中万卷，致君尧舜，此事何难。","用舍由时，行藏在我，袖手何妨闲处看。","身长健，但优游卒岁，且斗尊前。"],"lt":["孤館燈青，野店雞號，旅枕夢殘。","漸月華收練，晨霜耿耿，雲山摛錦，朝露漙漙。","世路無窮，勞生有限，似此區區長鮮歡。","微吟罷，憑徵鞍無語，往事千端。","當時共客長安。","似二陸初來俱少年。","有筆頭千字，胸中萬卷，致君堯舜，此事何難。","用舍由時，行藏在我，袖手何妨閒處看。","身長健，但優遊卒歲，且鬥尊前。"],"nc":1},{"id":"352016","y":1074,"m":11,"pl":"连云港","an":"朐山","sn":"海州","sf":"淮南东路海州","pv":"江苏","lat":34.602342,"lng":119.229571,"tu":"永遇乐","ti":"永遇乐 孙巨源以八月十五日离海州。坐别于景疏楼上。既而与余会于润州。至楚州乃别。余以十一月十五日至海州。与太守会于景疏楼上。作此词以寄巨源","tit":"永遇樂 孫巨源以八月十五日離海州。坐別於景疏樓上。既而與餘會於潤州。至楚州乃別。餘以十一月十五日至海州。與太守會於景疏樓上。作此詞以寄巨源","ev":"赴密州知州任途中。十一月十五日，苏轼至海州。与陈海州会于景疏楼，赋《永遇乐》寄孙洙（巨源）。作《二疏图赞》。次韵陈书怀、乘槎亭。","l":["长忆别时，景疏楼下，明月如水。","美酒清歌，留连不住，月随人千里。","别来三度，孤光又满，冷落共谁同醉。","卷珠帘，凄然顾影，共伊到明无寐。","今朝有客，来从淮上，能道使君深意。","凭仗清淮，分明到海，中有相思泪。","而今何在，西垣清禁，夜永露华侵被。","此时看，回廊晓月，也应暗记。"],"lt":["長憶別時，景疏樓下，明月如水。","美酒清歌，留連不住，月隨人千里。","別來三度，孤光又滿，冷落共誰同醉。","卷珠簾，悽然顧影，共伊到明無寐。","今朝有客，來從淮上，能道使君深意。","憑仗清淮，分明到海，中有相思淚。","而今何在，西垣清禁，夜永露華侵被。","此時看，迴廊曉月，也應暗記。"],"nc":1},{"id":"351974","y":1074,"m":null,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"昭君怨","ti":"昭君怨 金山送柳子玉","tit":"昭君怨 金山送柳子玉","ev":"在丹徒，为杭州通判。苏轼与柳瑾、刁约游金山。瑾赴舒州灵仙观，有送行诗、词。","l":["谁作桓伊三弄。","惊破绿窗幽梦。","新月与愁烟。","满江天。","欲去又还不去。","明日落花飞絮。","飞絮送行舟。","水东流。"],"lt":["誰作桓伊三弄。","驚破綠窗幽夢。","新月與愁煙。","滿江天。","欲去又還不去。","明日落花飛絮。","飛絮送行舟。","水東流。"],"nc":1},{"id":"351975","y":1074,"m":null,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"醉落魄","ti":"醉落魄 离京口作","tit":"醉落魄 離京口作","ev":"为杭州通判。离京口，苏轼赋《醉落魄·述怀》—。","l":["轻云微月。","二更酒醒船初发。","孤城回望苍烟合。","公子佳人，不记归时节。","巾偏扇坠藤床滑。","觉来幽梦无人说。","此生飘荡何时歇。","家在西南，长作东南别。"],"lt":["輕雲微月。","二更酒醒船初發。","孤城回望蒼煙合。","公子佳人，不記歸時節。","巾偏扇墜藤牀滑。","覺來幽夢無人說。","此生飄蕩何時歇。","家在西南，長作東南別。"],"nc":1},{"id":"351976","y":1074,"m":null,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"蝶恋花","ti":"蝶恋花 京口得乡书","tit":"蝶戀花 京口得鄉書","ev":"在丹徒，为杭州通判。苏轼得乡书，赋《蝶恋花》。赋《画堂春》寄弟辙。","l":["雨过春容清更丽。","只有离人，幽恨终难洗。","北固山前三面水。","碧琼梳拥青螺髻。","一纸乡书来万里。","问我何年，真个成归计。","白首送春拚一醉。","东风吹破千行泪。"],"lt":["雨過春容清更麗。","只有離人，幽恨終難洗。","北固山前三面水。","碧瓊梳擁青螺髻。","一紙鄉書來萬里。","問我何年，真個成歸計。","白首送春拚一醉。","東風吹破千行淚。"],"nc":0},{"id":"351977","y":1074,"m":null,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"少年游","ti":"少年游 润州作，代人寄远","tit":"少年遊 潤州作，代人寄遠","ev":"在丹徒，为杭州通判。苏轼赋《少年行》感行役。","l":["去年相送，馀杭门外，飞雪似杨花。","今年春尽，杨花似雪，犹不见还家。","对酒卷帘邀明月，风露透窗纱。","恰似姮娥怜双燕，分明照、画梁斜。"],"lt":["去年相送，餘杭門外，飛雪似楊花。","今年春盡，楊花似雪，猶不見還家。","對酒捲簾邀明月，風露透窗紗。","恰似姮娥憐雙燕，分明照、畫梁斜。"],"nc":2,"fm":1},{"id":"351978","y":1074,"m":null,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"卜算子","ti":"卜算子 自京口还钱塘道中寄述古太守","tit":"卜算子 自京口還錢塘道中寄述古太守","ev":"在丹徒，为杭州通判。苏轼怀钱塘，寄诗陈襄（述古），襄有和。赋《卜算子》寄襄。","l":["蜀客到江南，长忆吴山好。","吴蜀风流自古同，归去应须早。","还与去年人，共藉西湖草。","莫惜尊前仔细看，应是容颜老。"],"lt":["蜀客到江南，長憶吳山好。","吳蜀風流自古同，歸去應須早。","還與去年人，共藉西湖草。","莫惜尊前仔細看，應是容顏老。"],"nc":0},{"id":"351981","y":1074,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"虞美人","ti":"虞美人 有美堂赠述古","tit":"虞美人 有美堂贈述古","ev":"在钱塘，为杭州通判。陈襄将罢任，宴僚佐有美堂，苏轼应襄命赋《虞美人》","l":["湖山信是东南美。","一望弥千里。","使君能得几回来。","便使尊前醉倒、且徘徊。","沙河塘里灯初上。","水调谁家唱。","夜阑风静欲归时。","惟有一江明月、碧琉璃。"],"lt":["湖山信是東南美。","一望彌千里。","使君能得幾回來。","便使尊前醉倒、且徘徊。","沙河塘裏燈初上。","水調誰家唱。","夜闌風靜欲歸時。","惟有一江明月、碧琉璃。"],"nc":1},{"id":"351982","y":1074,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"诉衷情","ti":"诉衷情 送述古迓元素","tit":"訴衷情 送述古迓元素","ev":"在钱塘，为杭州通判。杭妓往苏州，迓新守杨绘（元素），苏轼赋《菩萨蛮》寄苏守王诲（规甫）。赋《诉衷情》送陈襄，迎杨绘。","l":["钱塘风景古来奇。","太守例能诗。","先驱负弩何在，心已浙江西。","花尽后，叶飞时。","雨凄凄。","若为情绪，更问新官，向旧官啼。"],"lt":["錢塘風景古來奇。","太守例能詩。","先驅負弩何在，心已浙江西。","花盡後，葉飛時。","雨悽 叙、段绎唱和《除夕》韵。","l":["十年生死两茫茫。","不思量。","自难忘。","千里孤坟，无处话凄凉。","纵使相逢应不识，尘满面，鬓如霜。","夜来幽梦忽还乡。","小轩窗。","正梳妆。","相顾无言，惟有泪千行。","料得年年断肠处，明月夜，短松冈。"],"lt":["十年生死兩茫茫。","不思量。","自難忘。","千里孤墳，無處話淒涼。","縱使相逢應不識，塵滿面，鬢如霜。","夜來幽夢忽還鄉。","小軒窗。","正梳妝。","相顧無言，惟有淚千行。","料得年年斷腸處，明月夜，短松岡。"],"nc":2,"fm":1},{"id":"352019","y":1075,"m":9,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"雨中花慢","ti":"雨中花慢 初至密州。以累年旱蝗。斋素累月。方春牡丹盛开。遂不获一赏。至九月。忽开千叶一颛。雨中特为置酒。遂作","tit":"雨中花慢 初至密州。以累年旱蝗。齋素累月。方春牡丹盛開。遂不獲一賞。至九月。忽開千葉一顓。雨中特爲置酒。遂作","ev":"在诸城，任密州知州。苏州通长老专使来密州，苏轼简谢。","l":["今岁花时深院，尽日东风，荡飏茶烟。","但有绿苔芳草，柳絮榆钱。","闻道城西，长廊古寺，甲第名园。","有国艳带酒，天香染袂，为我留连。","清明过了，残红无处，对此泪洒尊前。","秋向晚，一枝何事，向我依然。","高会聊追短景，清商不暇馀妍。","不如留取，十分春态，付与明年。"],"lt":["今歲花時深院，盡日東風，蕩颺茶煙。","但有綠苔芳草，柳絮榆錢。","聞道城西，長廊古寺，甲第名園。","有國豔帶酒，天香染袂，爲我留連。","清明過了，殘紅無處，對此淚灑尊前。","秋向晚，一枝何事，向我依然。","高會聊追短景，清商不暇餘妍。","不如留取，十分春態，付與明年。"],"nc":0},{"id":"352020","y":1075,"m":10,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"江神子","ti":"江神子 密州出猎","tit":"江神子 密州出獵","ev":"在诸城，任密州知州。祭常山回小猎，会猎铁沟，赋诗。并赋《江神子》；自谓虽无柳永风味，然自是一家，并令壮士歌之。","l":["老夫聊发少年狂。","左牵黄。","右擎苍。","锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张。","鬓微霜。","又何妨。","持节云中，何日遣冯唐。","会挽雕弓如满月，西北望，射天狼。"],"lt":["老夫聊發少年狂。","左牽黃。","右擎蒼。","錦帽貂裘，千騎卷平岡。","爲報傾城隨太守，親射虎，看孫郎。","酒酣胸膽尚開張。","鬢微霜。","又何妨。","持節雲中，何日遣馮唐。","會挽雕弓如滿月，西北望，射天狼。"],"nc":2,"fm":1},{"id":"352022","y":1075,"m":null,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"减字木兰花","ti":"减字木兰花 送东武令赵昶失官归海州","tit":"減字木蘭花 送東武令趙昶失官歸海州","ev":"在诸城，任密州知州。赵昶（晦之）罢诸城令，回海州，苏轼作诗与词送之。","l":["贤哉令尹。","三仕已之无喜愠。","我独何人。","犹把虚名玷搢绅。","不如归去，二顷良田无觅处，归去来兮。","待有良田是几时。"],"lt":["賢哉令尹。","三仕已之無喜慍。","我獨何人。","猶把虛名玷搢紳。","不如歸去，二頃良田無覓處，歸去來兮。","待有良田是幾時。"],"nc":0},{"id":"352203","y":1075,"m":null,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"减字木兰花","ti":"减字木兰花 送赵令晦之","tit":"減字木蘭花 送趙令晦之","ev":"在诸城，任密州知州。赵昶（晦之）罢诸城令，回海州，苏轼作诗与词送之。","l":["春光亭下。","流水如今何在也。","岁月如梭。","白首相看拟奈何。","故人重见。","世事年来千万变。","官况阑珊。","惭愧青松守岁寒。"],"lt":["春光亭下。","流水如今何在也。","歲月如梭。","白首相看擬奈何。","故人重見。","世事年來千萬變。","官況闌珊。","慚愧青松守歲寒。"],"nc":0},{"id":"352024","y":1076,"m":1,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"满江红","ti":"满江红 正月十三日。雪中送文安国还朝","tit":"滿江紅 正月十三日。雪中送文安國還朝","ev":"在诸城，任密州知州。正月十三日，苏轼雪中送文勋（安国）还朝，赋《满江红》。轼尝于文勋席上赋《蝶恋花》","l":["天岂无情，天也解、多情留客。","春向暖、朝来底事，尚飘轻雪。","君过春来纡组绶，我应归去耽泉石。","恐异时、杯酒忽相思，云山隔。","浮世事，俱难必。","人纵健、头应白。","何辞更一醉，此欢难觅。","欲向佳人诉离恨，泪珠先已凝双睫。","但莫遣、新燕却来时，音书绝。"],"lt":["天豈無情，天也解、多情留客。","春向暖、朝來底事，尚飄輕雪。","君過春來紆組綬，我應歸去耽泉石。","恐異時、杯酒忽相思，雲山隔。","浮世事，俱難必。","人縱健、頭應白。","何辭更一醉，此歡難覓。","欲向佳人訴離恨，淚珠先已凝雙睫。","但莫遣、新燕卻來時，音書絕。"],"nc":0},{"id":"352025","y":1076,"m":1,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"殢人娇","ti":"𣨼人娇 戏邦直","tit":"殢人嬌 戲邦直","ev":"在诸城，任密州知州。提点京东西路刑狱李清臣（邦直）自徐州行部至密州，登超然台，作赋，苏轼刻之石并跋。轼尝写《超然台记》寄清臣。清臣与轼畅叙情怀。","l":["别驾来时，灯火荧煌无数。","向青琐、隙中偷觑。","元来便是，共彩鸾仙侣。","方见了、管须低声说与。","百子流苏，千枝宝炬。","人间有、洞房烟雾。","春来何事，故抛人别处。","坐望断，楼中远山归路。"],"lt":["別駕來時，燈火熒煌無數。","向青瑣、隙中偷覷。","元來便是，共綵鸞仙侶。","方見了、管須低聲說與。","百子流蘇，千枝寶炬。","人間有、洞房煙霧。","春來何事，故拋人別處。","坐望斷，樓中遠山歸路。"],"nc":0},{"id":"352029","y":1076,"m":3,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"满江红","ti":"满江红 东武会流杯亭。上巳日作。城南有坡。土色如丹。其下有堤。壅邞淇水入城","tit":"滿江紅 東武會流杯亭。上巳日作。城南有坡。土色如丹。其下有堤。壅邞淇水入城","ev":"在诸城，任密州知州。寒食后，登超然台，苏轼赋《望江南》","l":["东武南城，新堤固、涟漪初溢。","隐隐遍、长林高阜，卧红堆碧。","枝上残花吹尽也，与君试向江头觅。","问向前、犹有几多春，三之一。","官里事，何时毕。","风雨外，无多日。","相将泛曲水，满城争出。","君不见、兰亭修禊事，当时座上皆豪逸。","到如今、修竹满山阴，空陈迹。"],"lt":["東武南城，新堤固、漣漪初溢。","隱隱遍、長林高阜，臥紅堆碧。","枝上殘花吹盡也，與君試向江頭覓。","問向前、猶有幾多春，三之一。","官裏事，何時畢。","風雨外，無多日。","相將泛曲水，滿城爭出。","君不見、蘭亭修禊事，當時座上皆豪逸。","到如今、修竹滿山陰，空陳跡。"],"nc":0},{"id":"352222","y":1076,"m":4,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"临江仙","ti":"临江仙 惠州改前韵","tit":"臨江仙 惠州改前韻","ev":"在诸城，任密州知州。苏轼答李清臣（邦直）诗，盼清臣再来密。","l":["九十日春都过了，贪忙何处追游。","三分春色一分愁。","雨翻榆荚阵，风转柳花毬。","我与使君皆白首，休夸少年风流。","佳人斜倚合江楼，水光都眼净，山色总眉愁。"],"lt":["九十日春都過了，貪忙何處追遊。","三分春色一分愁。","雨翻榆莢陣，風轉柳花毬。","我與使君皆白首，休誇少年風流。","佳人斜倚合江樓，水光都眼淨，山色總眉愁。"],"nc":0},{"id":"352030","y":1076,"m":8,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"水调歌头","ti":"水调歌头 丙辰中秋，欢饮达旦，大醉。作此篇，兼怀子由","tit":"水調歌頭 丙辰中秋，歡飲達旦，大醉。作此篇，兼懷子由","ev":"在诸城，任密州知州。七月五日，苏轼登超然台，赋诗。赵庾有和，赋诗戏答之。","l":["明月几时有，把酒问青天。","不知天上宫阙，今夕是何年。","我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","起舞弄清影，何似在人间。","转朱阁，低绮户，照无眠。","不应有恨，何事长向别时圆。","人有悲欢离合，月有阴晴圆缺，此事古难全。","但愿人长久，千里共婵娟。"],"lt":["明月幾時有，把酒問青天。","不知天上宮闕，今夕是何年。","我欲乘風歸去，又恐瓊樓玉宇，高處不勝寒。","起舞弄清影，何似在人間。","轉朱閣，低綺戶，照無眠。","不應有恨，何事長向別時圓。","人有悲歡離合，月有陰晴圓缺，此事古難全。","但願人長久，千里共嬋娟。"],"nc":11,"fm":1},{"id":"352032","y":1076,"m":10,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"江城子","ti":"江城子","tit":"江城子","ev":"在诸城，任密州知州。登超然台望月，苏轼赋《江城子》第九册（词集）第173页此词校注[一]之考证。）","l":["前瞻马耳九仙山。","碧连天。","晚云间。","城上高台，真个是超然。","莫使匆匆云雨散，今夜里，月婵娟。","小溪鸥鹭静联拳。","去翩翩。","点轻烟。","人事凄凉，回首便他年。","莫忘使君歌笑处，垂柳下，矮槐前。"],"lt":["前瞻馬耳九仙山。","碧連天。","晚雲間。","城上高臺，真個是超然。","莫使匆匆雲雨散，今夜裏，月嬋娟。","小溪鷗鷺靜聯拳。","去翩翩。","點輕煙。","人事淒涼，回首便他年。","莫忘使君歌笑處，垂柳下，矮槐前。"],"nc":0},{"id":"352033","y":1076,"m":12,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"江神子","ti":"江神子 东武雪中送客","tit":"江神子 東武雪中送客","ev":"在诸城，将赴知河中府。十二月，苏轼赋《江神子》，送章传（传道）","l":["相逢不觉又初寒。","对尊前。","惜流年。","风紧离亭，冰结泪珠圆。","雪意留君君不住，从此去，少清欢。","转头山上转头看。","路漫漫。","玉花翻。","云海光宽，何处是超然。","知道故人相念否，携翠袖，倚朱阑。"],"lt":["相逢不覺又初寒。","對尊前。","惜流年。","風緊離亭，冰結淚珠圓。","雪意留君君不住，從此去，少清歡。","轉頭山上轉頭看。","路漫漫。","玉花翻。","雲海光寬，何處是超然。","知道故人相念否，攜翠袖，倚朱闌。"],"nc":0},{"id":"352002","y":1076,"m":null,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"河满子","ti":"河满子 湖州寄南守冯当世","tit":"河滿子 湖州寄南守馮當世","ev":"在诸城，任密州知州。四月戊申（二十三日），冯京（当世）知成都。京在任中，妥善解决民族纠纷，苏轼赋《河满子》为贺。","l":["见说岷峨凄怆，旋闻江汉澄清。","但觉秋来归梦好，西南自有长城。","东府三人最少，西山八国初平。","莫负花溪纵赏，何妨药市微行。","试问当垆人在否，空教是处闻名。","唱著子渊新曲，应须分外含情。"],"lt":["見說岷峨悽愴，旋聞江漢澄清。","但覺秋來歸夢好，西南自有長城。","東府三人最少，西山八國初平。","莫負花溪縱賞，何妨藥市微行。","試問當壚人在否，空教是處聞名。","唱著子淵新曲，應須分外含情。"],"nc":1},{"id":"352023","y":1076,"m":null,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"蝶恋花","ti":"蝶恋花 微雪，客有善吹笛击鼓者，方醉中，有人送苦寒诗求和，遂以此答之","tit":"蝶戀花 微雪，客有善吹笛擊鼓者，方醉中，有人送苦寒詩求和，遂以此答之","ev":"在诸城，任密州知州。正月十三日，苏轼雪中送文勋（安国）还朝，赋《满江红》。轼尝于文勋席上赋《蝶恋花》","l":["帘外东风交雨霰。","帘里佳人，笑语如莺燕。","深惜今年正月暖。","灯光酒色摇金盏。","掺鼓渔阳挝未遍。","舞褪琼钗，汗湿香罗软。","今夜何人吟古怨。","清诗未就冰生砚。"],"lt":["簾外東風交雨霰。","簾裏佳人，笑語如鶯燕。","深惜今年正月暖。","燈光酒色搖金盞。","摻鼓漁陽撾未遍。","舞褪瓊釵，汗溼香羅軟。","今夜何人吟古怨。","清詩未就冰生硯。"],"nc":0},{"id":"352026","y":1076,"m":null,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"望江南","ti":"望江南 超然台作","tit":"望江南 超然臺作","ev":"在诸城，任密州知州。寒食后，登超然台，苏轼赋《望江南》","l":["春未老，风细柳斜斜。","试上超然台上看，半壕春水一城花。","烟雨暗千家。","寒食后，酒醒却咨嗟。","休对故人思故国，且将新火试新茶。","诗酒趁年华。"],"lt":["春未老，風細柳斜斜。","試上超然臺上看，半壕春水一城花。","煙雨暗千家。","寒食後，酒醒卻諮嗟。","休對故人思故國，且將新火試新茶。","詩酒趁年華。"],"nc":1,"fm":1},{"id":"352027","y":1076,"m":null,"pl":"诸城","an":null,"sn":"密州","sf":"京东东路密州","pv":"山东","lat":36.00214,"lng":119.42,"tu":"望江南","ti":"望江南 暮春","tit":"望江南 暮春","ev":"在诸城，任密州知州。苏轼赋《望江南》","l":["春已老，春服几时成。","曲水浪低蕉叶稳，舞雩风软纻罗轻。","酣咏乐升平。","微雨过，何处不催耕。","百舌无言桃李尽，柘林深处鹁鸪鸣。","春色属芜菁。"],"lt":["春已老，春服幾時成。","曲水浪低蕉葉穩，舞雩風軟紵羅輕。","酣詠樂昇平。","微雨過，何處不催耕。","百舌無言桃李盡，柘林深處鵓鴣鳴。","春色屬蕪菁。"],"nc":0},{"id":"352035","y":1077,"m":1,"pl":"济南","an":"历城","sn":"齐州","sf":"京东东路齐州","pv":"山东","lat":36.671627,"lng":117.001319,"tu":"阳关曲","ti":"阳关曲 答李公择","tit":"陽關曲 答李公擇","ev":"赴知河中府途中。苏轼至济南，李常（公择）以诗来迎，答诗。侄迟、适、远出迎。与常游，常出甥黄庭坚诗文以观。","l":["济南春好雪初晴，行到龙山马足轻。","使君莫忘霅溪女，时作阳关肠断声。"],"lt":["濟南春好雪初晴，行到龍山馬足輕。","使君莫忘霅溪女，時作陽關腸斷聲。"],"nc":0},{"id":"352038","y":1077,"m":3,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"殢人娇","ti":"𣨼人娇 小王都尉席上赠侍人","tit":"殢人嬌 小王都尉席上贈侍人","ev":"在开封，将赴徐州知州任。孔舜亮（君亮）赠诗，苏轼和答。","l":["满院桃花，尽是刘郎未见。","于中更、一枝纤软。","仙家日月，笑人间春晚。","浓睡起、惊飞乱红千片。","密意难传，羞容易变。","平白地、为伊肠断。","问君终日，怎安排心眼。","须信道、司空自来见惯。"],"lt":["滿院桃花，盡是劉郎未見。","於中更、一枝纖軟。","仙家日月，笑人間春晚。","濃睡起、驚飛亂紅千片。","密意難傳，羞容易變。","平白地、爲伊腸斷。","問君終日，怎安排心眼。","須信道、司空自來見慣。"],"nc":0},{"id":"352039","y":1077,"m":3,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"洞仙歌","ti":"洞仙歌 咏柳","tit":"洞仙歌 詠柳","ev":"在开封，将赴徐州知州任。孔舜亮（君亮）赠诗，苏轼和答。","l":["江南腊尽，早梅花开后。","分付新春与垂柳。","细腰肢、自有入格风流，仍更是、骨体清英雅秀。","永丰坊那畔，尽日无人，惟见金丝弄晴昼。","断肠是，飞絮时，绿叶成阴，无个事、一成消瘦。","又莫是、东风逐君来，便吹散眉间，一点春皱。"],"lt":["江南臘盡，早梅花開後。","分付新春與垂柳。","細腰肢、自有入格風流，仍更是、骨體清英雅秀。","永豐坊那畔，盡日無人，惟見金絲弄晴晝。","斷腸是，飛絮時，綠葉成陰，無個事、一成消瘦。","又莫是、東風逐君來，便吹散眉間，一點春皺。"],"nc":1},{"id":"352040","y":1077,"m":8,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"阳关曲","ti":"阳关曲 中秋月","tit":"陽關曲 中秋月","ev":"在彭城，任徐州知州。八月十五日，中秋，苏轼赋《阳关曲·中秋作》词。（暮云收尽溢清寒）","l":["暮云收尽溢清寒，银汉无声转玉盘。","此生此夜不长好，明月明年何处看。"],"lt":["暮雲收盡溢清寒，銀漢無聲轉玉盤。","此生此夜不長好，明月明年何處看。"],"nc":0,"fm":1},{"id":"352041","y":1077,"m":8,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"水调歌头","ti":"水调歌头 余去岁在东武，作水调歌头以寄子由。今年子由相从彭门百馀日，过中秋而去，作此曲以别。余以其语过悲，乃为和之。其意以不早退为戒，以退而相从之乐为慰云","tit":"水調歌頭 餘去歲在東武，作水調歌頭以寄子由。今年子由相從彭門百餘日，過中秋而去，作此曲以別。餘以其語過悲，乃爲和之。其意以不早退爲戒，以退而相從之樂爲慰雲","ev":"在彭城，任徐州知州。八月十五日，中秋，苏辙赋《水调歌头》，轼次韵。轼、辙同观月，有诗。（安石在东海）","l":["安石在东海，从事鬓惊秋。","中年亲友难别，丝竹缓离愁。","一旦功成名遂，准拟东还海道，扶病入西州。","雅志困轩冕，遗恨寄沧洲。","岁云暮，须早计，要褐裘。","故乡归去千里，佳处辄迟留。","我醉歌时君和，醉倒须君扶我，惟酒可忘忧。","一任刘玄德，相对卧高楼。"],"lt":["安石在東海，從事鬢驚秋。","中年親友難別，絲竹緩離愁。","一旦功成名遂，準擬東還海道，扶病入西州。","雅志困軒冕，遺恨寄滄洲。","歲雲暮，須早計，要褐裘。","故鄉歸去千里，佳處輒遲留。","我醉歌時君和，醉倒須君扶我，惟酒可忘憂。","一任劉玄德，相對臥高樓。"],"nc":0},{"id":"352050","y":1077,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"浣溪沙","ti":"浣溪沙 送颜复梁吉","tit":"浣溪沙 送顏復梁吉","ev":"在彭城，任徐州知州。苏轼赋《浣溪沙》送颜复（长道）、梁先（吉老）。复赴阙。（缥缈红妆照浅溪）","l":["缥缈红妆照浅溪。","薄云疏雨不成泥。","送君何处古台西。","废沼夜来秋水满，茂林深处晚莺啼。","行人肠断草凄迷。"],"lt":["縹緲紅妝照淺溪。","薄雲疏雨不成泥。","送君何處古臺西。","廢沼夜來秋水滿，茂林深處晚鶯啼。","行人腸斷草悽迷。"],"nc":0},{"id":"352163","y":1077,"m":null,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"满庭芳","ti":"满庭芳","tit":"滿庭芳","ev":"在开封，将赴徐州知州任。苏轼与孙洙（巨源）会于王诜（晋卿）园中。苏轼尝赋《满庭芳》","l":["香叆雕盘，寒生冰箸，画堂别是风光。","主人情重，开宴出红妆。","腻玉圆搓素颈，藕丝嫩、新织仙裳。","双歌罢，虚檐转月，馀韵尚悠飏。","人间，何处有，司空见惯，应谓寻常。","坐中有狂客，恼乱愁肠。","报道金钗坠也，十指露、春笋纤长。","亲曾见，全胜宋玉，想像赋高唐。"],"lt":["香靉雕盤，寒生冰箸，畫堂別是風光。","主人情重，開宴出紅妝。","膩玉圓搓素頸，藕絲嫩、新織仙裳。","雙歌罷，虛檐轉月，餘韻尚悠颺。","人間，何處有，司空見慣，應謂尋常。","坐中有狂客，惱亂愁腸。","報道金釵墜也，十指露、春筍纖長。","親曾見，全勝宋玉，想像賦高唐。"],"nc":0},{"id":"352171","y":1077,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"临江仙","ti":"临江仙 送王箴","tit":"臨江仙 送王箴","ev":"在彭城，任徐州知州。王缄回蜀，苏轼赋《临江仙》送之。","l":["忘却成都来十载，因君未免思量。","凭将清泪洒江阳。","故山知好在，孤客自悲凉。","坐上别愁君未见，归来欲断无肠。","殷勤且更尽离觞。","此身如传舍，何处是吾乡。"],"lt":["忘卻成都來十載，因君未免思量。","憑將清淚灑江陽。","故山知好在，孤客自悲涼。","坐上別愁君未見，歸來欲斷無腸。","殷勤且更盡離觴。","此身如傳舍，何處是吾鄉。"],"nc":1},{"id":"352239","y":1077,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"临江仙","ti":"临江仙 赠王友道","tit":"臨江仙 贈王友道","ev":"在彭城，任徐州知州。苏轼赋《临江仙·赠王友道》","l":["谁道东阳都瘦损，凝然点漆精神。","瑶林终自隔风尘。","试看披鹤氅，仍是谪仙人。","省可清言挥玉麈，真须保器全真。","风流何似道家纯。","不应同蜀客，惟爱卓文君。"],"lt":["誰道東陽都瘦損，凝然點漆精神。","瑤林終自隔風塵。","試看披鶴氅，仍是謫仙人。","省可清言揮玉麈，真須保器全真。","風流何似道家純。","不應同蜀客，惟愛卓文君。"],"nc":0},{"id":"352249","y":1077,"m":null,"pl":"东平","an":"须城","sn":"郓州","sf":"京东西路郓州","pv":"山东","lat":35.94278,"lng":116.476836,"tu":"浣溪沙","ti":"浣溪沙 有感","tit":"浣溪沙 有感","ev":"苏轼至郓州，鲜于侁（子骏）留饮新堂，以吴道玄画佛为赠。▪赴知河中府途中。在郓州，苏轼赋《浣溪沙》","l":["傅粉郎君又粉奴。","莫教施粉与施朱。","自然冰玉照香酥。","有客能为神女赋，凭君送与雪儿书。","梦魂东去觅桑榆。"],"lt":["傅粉郎君又粉奴。","莫教施粉與施朱。","自然冰玉照香酥。","有客能爲神女賦，憑君送與雪兒書。","夢魂東去覓桑榆。"],"nc":0},{"id":"352052","y":1078,"m":9,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"千秋岁","ti":"千秋岁 徐州重阳作","tit":"千秋歲 徐州重陽作","ev":"在彭城，任徐州知州。苏轼复赋《蝶恋花》送郑仅（彦能）","l":["浅霜侵绿。","发少仍新沐。","冠直缝，巾横幅。","美人怜我老，玉手簪金菊。","秋露重，真珠落袖沾馀馥。","坐上人如玉。","花映花奴肉。","蜂蝶乱，飞相逐。","明年人纵健，此会应难复。","须细看，晚来明月和银烛。"],"lt":["淺霜侵綠。","發少仍新沐。","冠直縫，巾橫幅。","美人憐我老，玉手簪金菊。","秋露重，真珠落袖沾餘馥。","坐上人如玉。","花映花奴肉。","蜂蝶亂，飛相逐。","明年人縱健，此會應難復。","須細看，晚來明月和銀燭。"],"nc":0},{"id":"352051","y":1078,"m":10,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"永遇乐","ti":"永遇乐 徐州夜梦觉。北登燕子楼作","tit":"永遇樂 徐州夜夢覺。北登燕子樓作","ev":"在彭城，任徐州知州。苏轼有与李常（公择）简，叙及弟辙嫁长女事。","l":["明月如霜，好风如水，清景无限。","曲港跳鱼，圆荷泻露，寂寞无人见。","𬘘如三鼓，铿然一叶，黯黯梦云惊断。","夜茫茫，重寻无处，觉来小园行遍。","天涯倦客，山中归路，望断故园心眼。","燕子楼空，佳人何在，空锁楼中燕。","古今如梦，何曾梦觉，但有旧欢新怨。","异时对、黄楼夜景，为余浩叹。"],"lt":["明月如霜，好風如水，清景無限。","曲港跳魚，圓荷瀉露，寂寞無人見。","紞如三鼓，鏗然一葉，黯黯夢雲驚斷。","夜茫茫，重尋無處，覺來小園行遍。","天涯倦客，山中歸路，望斷故園心眼。","燕子樓空，佳人何在，空鎖樓中燕。","古今如夢，何曾夢覺，但有舊歡新怨。","異時對、黃樓夜景，爲餘浩嘆。"],"nc":1,"fm":1},{"id":"351994","y":1078,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"南乡子","ti":"南乡子 和杨元素","tit":"南鄉子 和楊元素","ev":"在彭城，任徐州知州。苏轼赋《南乡子》","l":["凉簟碧纱厨。","一枕清风昼睡馀。","睡听晚衙无个事，徐徐。","读尽床头几卷书。","搔首赋归欤。","自觉功名懒更疏。","若问使君才与气，何如。","占得人间一味愚。"],"lt":["涼簟碧紗廚。","一枕清風晝睡餘。","睡聽晚衙無個事，徐徐。","讀盡牀頭幾卷書。","搔首賦歸歟。","自覺功名懶更疏。","若問使君才與氣，何如。","佔得人間一味愚。"],"nc":0},{"id":"352037","y":1078,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"蝶恋花","ti":"蝶恋花 暮春别李公择","tit":"蝶戀花 暮春別李公擇","ev":"在彭城，任徐州知州。李常（公择）离徐，苏轼赋《蝶恋花》及诗送行。常在徐，游宴甚乐。尝约常饮，坐上赋戴花诗；尝从过云龙张山人。","l":["簌簌无风花自堕。","寂寞园林，柳老樱桃过。","落日多情还照座。","山青一点横云破。","路尽河回千转柁。","系缆渔村，月暗孤灯火。","凭仗飞魂招楚些。","我思君处君思我。"],"lt":["簌簌無風花自墮。","寂寞園林，柳老櫻桃過。","落日多情還照座。","山青一點橫雲破。","路盡河回千轉柁。","繫纜漁村，月暗孤燈火。","憑仗飛魂招楚些。","我思君處君思我。"],"nc":1},{"id":"352042","y":1078,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"浣溪沙","ti":"浣溪沙 赠闾丘朝议，时还徐州","tit":"浣溪沙 贈閭丘朝議，時還徐州","ev":"在彭城，任徐州知州。闾丘孝终过徐州，苏轼赋《浣溪沙》以赠。（一别姑苏已四年）","l":["一别姑苏已四年。","秋风南浦送归船。","画帘重见水中仙。","霜鬓不须催我老，杏丹依旧驻君颜。","夜阑相对梦魂间。"],"lt":["一別姑蘇已四年。","秋風南浦送歸船。","畫簾重見水中仙。","霜鬢不須催我老，杏丹依舊駐君顏。","夜闌相對夢魂間。"],"nc":0},{"id":"352043","y":1078,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"临江仙","ti":"临江仙 送李公恕","tit":"臨江仙 送李公恕","ev":"在彭城，任徐州知州。京东西路转运判官李察（公恕）召赴阙，苏轼赋诗、词送行。","l":["自古相从休务日，何妨低唱微吟。","天垂云重作春阴。","坐中人半醉，帘外雪将深。","闻道分司狂御史，紫云无路追寻。","凄风寒雨更骎骎。","问囚长损气，见鹤忽惊心。"],"lt":["自古相從休務日，何妨低唱微吟。","天垂雲重作春陰。","坐中人半醉，簾外雪將深 "江苏","lat":34.210143,"lng":117.29235,"tu":"减字木兰花","ti":"减字木兰花 彭门留别","tit":"減字木蘭花 彭門留別","ev":"在彭城，将赴湖州知州任。苏轼留别田叔通、寇昌朝（元弼）、石夷庚（坦夫）。作《江城子》、《减字木兰花》别徐州。","l":["玉觞无味，中有佳人千点泪，学道忘忧，一念还成不自由。","如今未见，归去东园花似霰，一语相开，匹似当初本不来。"],"lt":["玉觴無味，中有佳人千點淚，學道忘憂，一念還成不自由。","如今未見，歸去東園花似霰，一語相開，匹似當初本不來。"],"nc":0},{"id":"352152","y":1079,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"南乡子","ti":"南乡子 用前韵赠田叔通家舞鬟","tit":"南鄉子 用前韻贈田叔通家舞鬟","ev":"在彭城，任徐州知州。苏轼次韵田叔通韵多首。至叔通家，赋《南乡子》赠其舞鬟。","l":["绣鞅玉镮游。","灯晃帘疏笑却收。","久立香车催欲上，还留。","更且檀唇点杏油。","花遍六么毬。","面旋回风带雪流。","春入腰肢金缕细，轻柔。","种柳应须柳柳州。"],"lt":["繡鞅玉鐶遊。","燈晃簾疏笑卻收。","久立香車催欲上，還留。","更且檀脣點杏油。","花遍六麼毬。","面旋迴風帶雪流。","春入腰肢金縷細，輕柔。","種柳應須柳柳州。"],"nc":0},{"id":"352153","y":1079,"m":null,"pl":"徐州","an":null,"sn":"徐州","sf":"京东西路徐州（彭城）","pv":"江苏","lat":34.210143,"lng":117.29235,"tu":"南乡子","ti":"南乡子 用韵和道辅","tit":"南鄉子 用韻和道輔","ev":"在彭城，任徐州知州。苏轼赋《南乡子》和黄儒（道辅）","l":["未倦长卿游。","漫舞夭歌烂不收。","不是使君能矫世，谁留。","教有琼梳脱麝油。","香粉缕金毬。","花艳红笺笔欲流。","从此丹唇并皓齿，清柔。","唱遍山东一百州。"],"lt":["未倦長卿遊。","漫舞夭歌爛不收。","不是使君能矯世，誰留。","教有瓊梳脫麝油。","香粉縷金毬。","花豔紅箋筆欲流。","從此丹脣並皓齒，清柔。","唱遍山東一百州。"],"nc":0},{"id":"352234","y":1079,"m":null,"pl":"商丘","an":"宋城","sn":"南京","sf":"南京应天府","pv":"河南","lat":34.420378,"lng":115.662798,"tu":"木兰花令","ti":"木兰花令","tit":"木蘭花令","ev":"在宋城，赴湖州知州任途中。苏轼赋《木兰花令》","l":["经旬未识东君信。","一夕薰风来解愠。","红绡衣薄麦秋寒，绿绮韵低梅雨润。","瓜头绿染山光嫩。","弄色金桃新傅粉。","日高慵卷水晶帘，犹带春醪红玉困。"],"lt":["經旬未識東君信。","一夕薰風來解慍。","紅綃衣薄麥秋寒，綠綺韻低梅雨潤。","瓜頭綠染山光嫩。","弄色金桃新傅粉。","日高慵卷水晶簾，猶帶春醪紅玉困。"],"nc":0},{"id":"352161","y":1080,"m":6,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"水调歌头","ti":"水调歌头 公旧序云：欧阳文忠公尝问余：琴诗何者最善？答以退之听颖师琴诗。公曰：此诗固奇丽，然非听琴，乃听琵琶诗也。余深然之。建安章质夫家善琵琶者乞为歌词。余久不作，特取退之词，稍加檃括，使就声律以遗之云","tit":"水調歌頭 公舊序雲：歐陽文忠公嘗問餘：琴詩何者最善？答以退之聽穎師琴詩。公曰：此詩固奇麗，然非聽琴，乃聽琵琶詩也。餘深然之。建安章質夫家善琵琶者乞爲歌詞。餘久不作，特取退之詞，稍加檃括，使就聲律以遺之雲","ev":"在黄冈，任黄州团练副使。黄冈县令何长官作诗，苏轼次其韵。","l":["昵昵儿女语，灯火夜微明。","恩冤尔汝来去，弹指泪和声。","忽变轩昂勇士，一鼓填然作气，千里不留行。","回首暮云远，飞絮搅青冥。","众禽里，真彩凤，独不鸣。","跻攀寸步千险，一落百寻轻。","烦子指间风雨，置我肠中冰炭，起坐不能平。","推手从归去，无泪与君倾。"],"lt":["暱暱兒女語，燈火夜微明。","恩冤爾汝來去，彈指淚和聲。","忽變軒昂勇士，一鼓填然作氣，千里不留行。","回首暮雲遠，飛絮攪青冥。","衆禽裏，真綵鳳，獨不鳴。","躋攀寸步千險，一落百尋輕。","煩子指間風雨，置我腸中冰炭，起坐不能平。","推手從歸去，無淚與君傾。"],"nc":1},{"id":"352070","y":1080,"m":7,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮","tit":"菩薩蠻","ev":"在黄冈，任黄州团练副使。黄冈县令何长官作诗，苏轼次其韵。","l":["画檐初挂弯弯月。","孤光未满先忧缺。","遥认玉帘钩。","天孙梳洗楼。","佳人言语好。","不愿求新巧。","此恨固应知。","愿人无别离。"],"lt":["畫檐初掛彎彎月。","孤光未滿先憂缺。","遙認玉簾鉤。","天孫梳洗樓。","佳人言語好。","不願求新巧。","此恨固應知。","願人無別離。"],"nc":0},{"id":"352071","y":1080,"m":7,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮","tit":"菩薩蠻","ev":"在黄冈，任黄州团练副使。黄冈县令何长官作诗，苏轼次其韵。","l":["风回仙驭云开扇。","更阑月堕星河转。","枕上梦魂惊。","晓来疏雨零。","相逢虽草草。","长共天难老。","终不羡人间。","人间日似年。"],"lt":["風回仙馭雲開扇。","更闌月墮星河轉。","枕上夢魂驚。","曉來疏雨零。","相逢雖草草。","長共天難老。","終不羨人間。","人間日似年。"],"nc":0},{"id":"352021","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"水龙吟","ti":"水龙吟 咏笛材，时太守闾丘公显已致仕，居姑苏。后房懿卿者，甚有才色，因赋此诗","tit":"水龍吟 詠笛材，時太守閭丘公顯已致仕，居姑蘇。後房懿卿者，甚有才色，因賦此詩","ev":"在黄冈，任黄州团练副使。赵昶（晦之）知藤州。轼简昶忧南方兵事。昶在藤馈丹砂，报以蕲笛，赋《水龙吟》赠昶侍儿。","l":["楚山修竹如云，异材秀出千林表。","龙须半剪，凤膺微涨，玉肌匀绕。","木落淮南，雨晴云梦，月明风袅。","自中郎不见，桓伊去后，知孤负、秋多少。","闻道岭南太守，后堂深、绿珠娇小。","绮窗学弄，梁州初遍，霓裳未了。","嚼征含宫，泛商流羽，一声云杪。","为使君洗尽，蛮风瘴雨，作霜天晓。"],"lt":["楚山修竹如雲，異材秀出千林表。","龍鬚半剪，鳳膺微漲，玉肌勻繞。","木落淮南，雨晴雲夢，月明風嫋。","自中郎不見，桓伊去後，知孤負、秋多少。","聞道嶺南太守，後堂深、綠珠嬌小。","綺窗學弄，梁州初遍，霓裳未了。","嚼徵含宮，泛商流羽，一聲雲杪。","爲使君洗盡，蠻風瘴雨，作霜天曉。"],"nc":0},{"id":"352068","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"临江仙","ti":"临江仙 龙丘子自洛之蜀，戴二侍女，戎装骏马。至溪山佳处，辄留数日，见者以为异人。其后十年，筑室黄冈之北，号曰静安居士。作此词赠之","tit":"臨江仙 龍丘子自洛之蜀，戴二侍女，戎裝駿馬。至溪山佳處，輒留數日，見者以爲異人。其後十年，築室黃岡之北，號曰靜安居士。作此詞贈之","ev":"在黄冈，任黄州团练副使。约于到黄州之初，苏轼赠陈慥《临江仙》","l":["细马远驮双侍女，青巾玉带红靴。","溪山好处便为家。","谁知巴峡路，却见洛城花。","面旋落英飞玉蕊，人间春日初斜。","十年不见紫云车。","龙丘新洞府，铅鼎养丹砂。"],"lt":["細馬遠馱雙侍女，青巾玉帶紅靴。","溪山好處便爲家。","誰知巴峽路，卻見洛城花。","面旋落英飛玉蕊，人間春日初斜。","十年不見紫雲車。","龍丘新洞府，鉛鼎養丹砂。"],"nc":0},{"id":"352114","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"卜算子","ti":"卜算子 黄州定慧院寓居作","tit":"卜算子 黃州定慧院寓居作","ev":"在黄冈，任黄州团练副使。苏轼作《卜算子》，张耒、黄庭坚尝题其后。（缺月挂疏桐）","l":["缺月挂疏桐，漏断人初静。","谁见幽人独往来，缥缈孤鸿影。","惊起却回头，有恨无人省。","拣尽寒枝不肯栖，寂寞沙洲冷。"],"lt":["缺月掛疏桐，漏斷人初靜。","誰見幽人獨往來，縹緲孤鴻影。","驚起卻回頭，有恨無人省。","揀盡寒枝不肯棲，寂寞沙洲冷。"],"nc":1,"fm":1},{"id":"352257","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"南歌子","ti":"南歌子 感旧","tit":"南歌子 感舊","ev":"在黄冈，任黄州团练副使。苏轼赋《南歌子》","l":["寸恨谁云短，绵绵岂易裁。","半年眉绿未曾开。","明月好风闲处、是人猜。","春雨消残冻，温风到冷灰。","尊前一曲为谁哉。","留取曲终一拍、待君来。"],"lt":["寸恨誰雲短，綿綿豈易裁。","半年眉綠未曾開。","明月好風閒處、是人猜。","春雨消殘凍，溫風到冷灰。","尊前一曲爲誰哉。","留取曲終一拍、待君來。"],"nc":0},{"id":"352273","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"好事近","ti":"好事近","tit":"好事近","ev":"在黄冈，任黄州团练副使。苏轼赋《好事近》，送别友人李常（公择）（烟外倚危楼）","l":["烟外倚危楼，初见远灯明灭。","却跨玉虹归去、看洞天星月。","当时张范风流在，况一尊浮雪。","莫问世间何事、与剑头微吷。"],"lt":["煙外倚危樓，初見遠燈明滅。","卻跨玉虹歸去、看洞天星月。","當時張範風流在，況一尊浮雪。","莫問世間何事、與劍頭微吷。"],"nc":0},{"id":"352317","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮 回文四时闺怨","tit":"菩薩蠻 迴文四時閨怨","ev":"在黄冈，任黄州团练副使。苏轼赋《菩萨蛮》回文四时闺怨四首，效刘攽（贡父、十五）体。先是攽创此体见寄，至是效之，以寄李常（公择）","l":["翠鬟斜幔云垂耳。","耳垂云幔斜鬟翠。","春晚睡昏昏。","昏昏睡晚春。","细花梨雪坠。","坠雪梨花细。","颦浅念谁人。","人谁念浅颦。"],"lt":["翠鬟斜幔雲垂耳。","耳垂雲幔斜鬟翠。","春晚睡昏昏。","昏昏睡晚春。","細花梨雪墜。","墜雪梨花細。","顰淺念誰人。","人誰念淺顰。"],"nc":0},{"id":"352318","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮 回文四时闺怨","tit":"菩薩蠻 迴文四時閨怨","ev":"在黄冈，任黄州团练副使。苏轼赋《菩萨蛮》回文四时闺怨四首，效刘攽（贡父、十五）体。先是攽创此体见寄，至是效之，以寄李常（公择）","l":["柳庭风静人眠昼。","昼眠人静风庭柳。","香汗薄衫凉。","凉衫薄汗香。","手红冰碗藕。","藕碗冰红手。","郎笑藕丝长。","长丝藕笑郎。"],"lt":["柳庭風靜人眠晝。","晝眠人靜風庭柳。","香汗薄衫涼。","涼衫薄汗香。","手紅冰碗藕。","藕碗冰紅手。","郎笑藕絲長。","長絲藕笑郎。"],"nc":1},{"id":"352319","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮 回文四时闺怨","tit":"菩薩蠻 迴文四時閨怨","ev":"在黄冈，任黄州团练副使。苏轼赋《菩萨蛮》回文四时闺怨四首，效刘攽（贡父、十五）体。先是攽创此体见寄，至是效之，以寄李常（公择）","l":["井桐双照新妆冷。","冷妆新照双桐井。","羞对井花愁。","愁花井对羞。","影孤怜夜永。","永夜怜孤影。","楼上不宜秋，秋宜不上楼。"],"lt":["井桐雙照新妝冷。","冷妝新照雙桐井。","羞對井花愁。","愁花井對羞。","影孤憐夜永。","永夜憐孤影。","樓上不宜秋，秋宜不上樓。"],"nc":0},{"id":"352320","y":1080,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮 回文四时闺怨","tit":"菩薩蠻 迴文四時閨怨","ev":"在黄冈，任黄州团练副使。苏轼赋《菩萨蛮》回文四时闺怨四首，效刘攽（贡父、十五）体。先是攽创此体见寄，至是效之，以寄李常（公择）","l":["雪花飞暖融香颊。","颊香融暖飞花雪。","欺雪任单衣。","衣单任雪欺。","别时梅子结。","结子梅时别。","归不恨开迟。","迟开恨不归。"],"lt":["雪花飛暖融香頰。","頰香融暖飛花雪。","欺雪任單衣。","衣單任雪欺。","別時梅子結。","結子梅時別。","歸不恨開遲。","遲開恨不歸。"],"nc":0},{"id":"352074","y":1081,"m":1,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"少年游","ti":"少年游 黄之侨人郭氏每岁正月迎紫姑神，以箕为腹，箸为口，画灰盘中为诗。敏捷立成。余往观之。神请余作少年游，乃以此戏之","tit":"少年遊 黃之僑人郭氏每歲正月迎紫姑神，以箕爲腹，箸爲口，畫灰盤中爲詩。敏捷立成。餘往觀之。神請餘作少年遊，乃以此戲之","ev":"在黄冈，任黄州团练副使。苏轼题凤山诗后。","l":["玉肌铅粉傲秋霜。","准拟凤呼凰。","伶伦不见，清香未吐，且糠秕吹扬。","到处成双君独只，空无数、烂文章。","一点香檀，谁能借箸，无复似张良。"],"lt":["玉肌鉛粉傲秋霜。","準擬鳳呼凰。","伶倫不見，清香未吐，且糠秕吹揚。","到處成雙君獨只，空無數、爛文章。","一點香檀，誰能借箸，無復似張良。"],"nc":0},{"id":"352089","y":1081,"m":1,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"水龙吟","ti":"水龙吟 闾秋大夫孝终公显尝守黄州，作栖霞楼，为郡中绝胜。元丰五年，余谪居黄。正月十七日梦扁舟渡江，中流回望，楼中歌乐杂作。舟中人言：公显方会客也。觉而异之，乃作此曲。盖越调鼓笛慢。公显时已致仕。在苏州","tit":"水龍吟 閭秋大夫孝終公顯嘗守黃州，作棲霞樓，爲郡中絕勝。元豐五年，餘謫居黃。正月十七日夢扁舟渡江，中流回望，樓中歌樂雜作。舟中人言：公顯方會客也。覺而異之，乃作此曲。蓋越調鼓笛慢。公顯時已致仕。在蘇州","ev":"在黄冈，任黄州团练副使。苏轼题凤山诗后。","l":["小舟横截春江，卧看翠壁红楼起。","云间笑语，使君高会，佳人半醉。","危柱哀弦，艳歌馀响，绕云萦水。","念故人老大，风流未减，空回首、烟波里。","推枕惘然不见，但空江、月明千里。","五湖闻道，扁舟归去，仍携西子。","云梦南州，武昌东岸，昔游应记。","料多情梦里，端来见我，也参差是。"],"lt":["小舟橫截春江，臥看翠壁紅樓起。","雲間笑語，使君高會，佳人半醉。","危柱哀弦，豔歌餘響，繞雲縈水。","念故人老大，風流未減，空回首、煙波裏。","推枕惘然不見，但空江、月明千里。","五湖聞道，扁舟歸去，仍攜西子。","雲夢南州，武昌東岸，昔遊應記。","料多情夢裏，端來見我，也參差是。"],"nc":0},{"id":"352075","y":1081,"m":5,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422," 12","y":1081,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮 赠徐君猷笙妓","tit":"菩薩蠻 贈徐君猷笙妓","ev":"在黄冈，任黄州团练副使。苏轼题赠徐大受（君猷）侍人阎姬。又尝赋《西江月》赠大受宠姬胜之；又作《减字木兰花》赠之。又尝有词赠大受其他侍人。","l":["碧纱微露纤掺玉。","朱唇渐煖参差竹。","越调变新声。","龙吟彻骨清。","夜阑残酒醒。","惟觉霜袍冷，不见敛眉人。","胭脂觅旧痕。"],"lt":["碧紗微露纖摻玉。","朱脣漸煖參差竹。","越調變新聲。","龍吟徹骨清。","夜闌殘酒醒。","惟覺霜袍冷，不見斂眉人。","胭脂覓舊痕。"],"nc":0},{"id":"352162","y":1081,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"水龙吟","ti":"水龙吟 次韵章质夫杨花词","tit":"水龍吟 次韻章質夫楊花詞","ev":"在黄冈，任黄州团练副使。章楶（质夫）赋《水龙吟》，约为本年事。苏轼次韵，并寄《菩萨蛮》七夕词二首（“画檐初挂弯弯月”、“风回仙驭云开扇”）与楶。","l":["似花还似非花，也无人惜从教坠。","抛家傍路，思量却是，无情有思。","萦损柔肠，困酣娇眼，欲开还闭。","梦随风万里，寻郎去处，又还被、莺呼起。","不恨此花飞尽，恨西园、落红难缀。","晓来雨过，遗踪何在，一池萍碎。","春色三分，二分尘土，一分流水。","细看来，不是杨花。","点点是、离人泪。"],"lt":["似花還似非花，也無人惜從教墜。","拋家傍路，思量卻是，無情有思。","縈損柔腸，困酣嬌眼，欲開還閉。","夢隨風萬里，尋郎去處，又還被、鶯呼起。","不恨此花飛盡，恨西園、落紅難綴。","曉來雨過，遺蹤何在，一池萍碎。","春色三分，二分塵土，一分流水。","細看來，不是楊花。","點點是、離人淚。"],"nc":2,"fm":1},{"id":"352227","y":1081,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"虞美人","ti":"虞美人 琵琶","tit":"虞美人 琵琶","ev":"在黄冈，任黄州团练副使。苏轼赋《虞美人》","l":["定场贺老今何在。","几度新声改。","新声坐使旧声阑。","俗耳只知繁手、不须弹。","断弦试问谁能晓。","七岁文姬小。","试教弹作辊雷声。","应有开元遗老、泪纵横。"],"lt":["定場賀老今何在。","幾度新聲改。","新聲坐使舊聲闌。","俗耳只知繁手、不須彈。","斷絃試問誰能曉。","七歲文姬小。","試教彈作輥雷聲。","應有開元遺老、淚縱橫。"],"nc":0},{"id":"352093","y":1082,"m":3,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"定风波","ti":"定风波 三月七日沙湖道中遇雨。雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此","tit":"定風波 三月七日沙湖道中遇雨。雨具先去，同行皆狼狽，餘獨不覺。已而遂晴，故作此","ev":"在黄冈，任黄州团练副使。苏轼复李昭玘书；以先得黄庭坚、晁补之、秦观、张耒为乐，亦以昭玘欲从游为乐，勉昭玘有所至。","l":["莫听穿林打叶声。","何妨吟啸且徐行。","竹杖芒鞋轻胜马。","谁怕。","一蓑烟雨任平生。","料峭春风吹酒醒。","微冷。","山头斜照却相迎。","回首向来潇瑟处。","归去。","也无风雨也无晴。"],"lt":["莫聽穿林打葉聲。","何妨吟嘯且徐行。","竹杖芒鞋輕勝馬。","誰怕。","一蓑煙雨任平生。","料峭春風吹酒醒。","微冷。","山頭斜照卻相迎。","回首向來瀟瑟處。","歸去。","也無風雨也無晴。"],"nc":1,"fm":1},{"id":"352097","y":1082,"m":3,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"满江红","ti":"满江红 董毅夫名钺，自梓漕得罪。罢官东川。归鄱阳，遇东坡于齐安。怪其丰暇自得。余问之。曰：吾再娶柳氏，三日而去官。吾固不戚戚，而忧柳氏不能忘怀于进退也。已而欣然。同忧患若处富贵，吾是以益安焉。命其侍儿歌其所作满江红。嗟叹之不足，乃次其韵","tit":"滿江紅 董毅夫名鉞，自梓漕得罪。罷官東川。歸鄱陽，遇東坡於齊安。怪其豐暇自得。餘問之。曰：吾再娶柳氏，三日而去官。吾固不慼慼，而憂柳氏不能忘懷於進退也。已而欣然。同憂患若處富貴，吾是以益安焉。命其侍兒歌其所作滿江紅。嗟嘆之不足，乃次其韻","ev":"在黄冈，任黄州团练副使。董钺归鄱阳途中来访，苏轼次钺所作《满江红》韵。（忧喜相寻）第九册（词集）第368页此词校注[一]之考证。）","l":["忧喜相寻，风雨过、一江春绿。","巫峡梦、至今空有，乱山屏簇。","何似伯鸾携德耀，箪瓢未足清欢足。","渐粲然、光彩照阶庭，生兰玉。","幽梦里，传心曲。","肠断处。","凭他续。","文君婿知否，笑君卑辱。","君不见、周南歌汉广，天教夫子休乔木。","便相将、左手抱琴书，云间宿。"],"lt":["憂喜相尋，風雨過、一江春綠。","巫峽夢、至今空有，亂山屏簇。","何似伯鸞攜德耀，簞瓢未足清歡足。","漸粲然、光彩照階庭，生蘭玉。","幽夢裏，傳心曲。","腸斷處。","憑他續。","文君婿知否，笑君卑辱。","君不見、周南歌漢廣，天教夫子休喬木。","便相將、左手抱琴書，雲間宿。"],"nc":0},{"id":"352132","y":1082,"m":3,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"浣溪沙","ti":"浣溪沙 玄真子渔父词极清丽。恨其曲度不传。故加数语。令以浣溪沙歌之","tit":"浣溪沙 玄真子漁父詞極清麗。恨其曲度不傳。故加數語。令以浣溪沙歌之","ev":"在黄冈，任黄州团练副使。苏轼作《南歌子》、（雨暗初疑夜）、（带酒冲山雨）","l":["西塞山边白鹭飞。","散花洲外片帆微。","桃花流水鳜鱼肥。","自庇一身青箬笠，相随到处绿蓑衣。","斜风细雨不须归。"],"lt":["西塞山邊白鷺飛。","散花洲外片帆微。","桃花流水鱖魚肥。","自庇一身青箬笠，相隨到處綠蓑衣。","斜風細雨不須歸。"],"nc":0},{"id":"352098","y":1082,"m":4,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"哨遍","ti":"哨遍 陶渊明赋归去来，有其词而无其声。余既治东坡，筑雪堂于上，人俱笑其陋。独鄱阳董毅夫过而悦之，有卜邻之意。乃取归去来词，稍加檃括，使就声律，以遗毅夫。使家僮歌之。时相从于东坡，释耒而和之，扣牛角而为之节，不亦乐乎","tit":"哨遍 陶淵明賦歸去來，有其詞而無其聲。餘既治東坡，築雪堂於上，人俱笑其陋。獨鄱陽董毅夫過而悅之，有卜鄰之意。乃取歸去來詞，稍加檃括，使就聲律，以遺毅夫。使家僮歌之。時相從於東坡，釋耒而和之，扣牛角而爲之節，不亦樂乎","ev":"在黄冈，任黄州团练副使。董钺（义夫、毅夫）归去，苏轼作《哨遍》以送，志思归之意。并寄朱寿昌（康叔）。黄与苏轼甚相得。（为米折腰）第九册（词集）第379页此词校注[一]之考证。）《与朱康叔二十首》","l":["为米折腰，因酒弃家，口体交相累。","归去来，谁不遣君归。","觉从前、皆非今是。","露未晞。","征夫指予归路，门前笑语喧童稚。","嗟旧菊都荒，新松暗老，吾年今已如此。","但小窗、容膝闭柴扉。","策杖看、孤云暮鸿飞。","云出无心，鸟倦知还，本非有意。","噫。","归去来兮。","我今忘我兼忘世。","亲戚无浪语，琴书中、有真味。","步翠麓崎岖，泛溪窈窕，涓涓暗谷流春水。","观草木欣荣，幽人自感，吾生行且休矣。","念寓形、宇内复几时。","不自觉、皇皇欲何之。","委吾心、去留谁计。","神仙知在何处，富贵非吾志。","但知临水登山啸咏，自引壶觞自醉。","此生天命更何疑。","且乘流、遇坎还止。"],"lt":["爲米折腰，因酒棄家，口體交相累。","歸去來，誰不遣君歸。","覺從前、皆非今是。","露未晞。","征夫指予歸路，門前笑語喧童稚。","嗟舊菊都荒，新松暗老，吾年今已如此。","但小窗、容膝閉柴扉。","策杖看、孤雲暮鴻飛。","雲出無心，鳥倦知還，本非有意。","噫。","歸去來兮。","我今忘我兼忘世。","親戚無浪語，琴書中、有真味。","步翠麓崎嶇，泛溪窈窕，涓涓暗谷流春水。","觀草木欣榮，幽人自感，吾生行且休矣。","念寓形、宇內復幾時。","不自覺、皇皇欲何之。","委吾心、去留誰計。","神仙知在何處，富貴非吾志。","但知臨水登山嘯詠，自引壺觴自醉。","此生天命更何疑。","且乘流、遇坎還止。"],"nc":0},{"id":"352083","y":1082,"m":6,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"满江红","ti":"满江红 寄鄂州朱使君寿昌","tit":"滿江紅 寄鄂州朱使君壽昌","ev":"在黄冈，任黄州团练副使。苏轼与朱寿昌（康叔）简，求学服朱砂法。","l":["江汉西来，高楼下、蒲萄深碧。","犹自带、岷峨云浪，锦江春色。","君是南山遗爱守，我为剑外思归客。","对此间、风物岂无情，殷勤说。","江表传，君休读。","狂处士，真堪惜。","空洲对鹦鹉，苇花萧瑟。","不独笑、书生争底事，曹公黄祖俱飘忽。","愿使君、还赋谪仙诗，追黄鹤。"],"lt":["江漢西來，高樓下、蒲萄深碧。","猶自帶、岷峨雲浪，錦江春色。","君是南山遺愛守，我爲劍外思歸客。","對此間、風物豈無情，殷勤說。","江表傳，君休讀。","狂處士，真堪惜。","空洲對鸚鵡，葦花蕭瑟。","不獨笑、書生爭底事，曹公黃祖俱飄忽。","願使君、還賦謫仙詩，追黃鶴。"],"nc":1},{"id":"352102","y":1082,"m":7,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"念奴娇","ti":"念奴娇 赤壁怀古","tit":"念奴嬌 赤壁懷古","ev":"在黄冈，任黄州团练副使。苏轼与堂兄不危（子安）简。","l":["大江东去，浪淘尽、千古风流人物。","故垒西边，人道是，三国周郎赤壁。","乱石穿空，惊涛拍岸，卷起千堆雪。","江山如画，一时多少豪杰。","遥想公瑾当年，小乔初嫁了，雄姿英发。","羽扇纶巾，谈笑间，樯橹灰飞烟灭。","故国神游，多情应笑我，早生华发。","人间如梦，一樽还酹江月。"],"lt":["大江東去，浪淘盡、千古風流人物。","故壘西邊，人道是，三國周郎赤壁。","亂石穿空，驚濤拍岸，捲起千堆雪。","江山如畫，一時多少豪傑。","遙想公瑾當年，小喬初嫁了，雄姿英發。","羽扇綸巾，談笑間，檣櫓灰飛煙滅。","故國神遊，多情應笑我，早生華髮。","人間如夢，一樽還酹江月。"],"nc":2,"fm":1},{"id":"352103","y":1082,"m":8,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"念奴娇","ti":"念奴娇 中秋","tit":"念奴嬌 中秋","ev":"在黄冈，任黄州团练副使。苏轼与蔡承禧（景繁）简。","l":["凭高眺远，见长空万里，云无留迹。","桂魄飞来光射处，冷浸一天秋碧。","玉宇琼楼，乘鸾来去，人在清凉国。","江山如画，望中烟树历历。","我醉拍手狂歌，举杯邀月，对影成三客。","起舞徘徊风露下，今夕不知何夕。","便欲乘风，翻然归去，何用骑鹏翼。","水晶宫里，一声吹断横笛。"],"lt":["憑高眺遠，見長空萬里，雲無留跡。","桂魄飛來光射處，冷浸一天秋碧。","玉宇瓊樓，乘鸞來去，人在清涼國。","江山如畫，望中煙樹歷歷。","我醉拍手狂歌，舉杯邀月，對影成三客。","起舞徘徊風露下，今夕不知何夕。","便欲乘風，翻然歸去，何用騎鵬翼。","水晶宮裏，一聲吹斷橫笛。"],"nc":0},{"id":"352118","y":1082,"m":9,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"醉蓬莱","ti":"醉蓬莱 余谪居黄州。三见重九。每岁与太守徐君猷会于栖霞楼。今年公将去。乞郡湖南。念此惘然。故作是词","tit":"醉蓬萊 餘謫居黃州。三見重九。每歲與太守徐君猷會於棲霞樓。今年公將去。乞郡湖南。念此惘然。故作是詞","ev":"在黄冈，任黄州团练副使。九月八日，苏轼与孔平仲（毅父）简。","l":["笑劳生一梦，羁旅三年，又还重九。","华发萧萧，对荒园搔首。","赖有多情，好饮无事，似古人贤守。","岁岁登高，年年落帽，物华依旧。","此会应须烂醉，仍把紫菊茱萸，细看重嗅。","摇落霜风，有手栽双柳。","来岁今朝，为我西顾，酹羽觞江口。","会与州人，饮公遗爱，一江醇酎。"],"lt":["笑勞生一夢，羈旅三年，又還重九。","華髮蕭蕭，對荒園搔首。","賴有多情，好飲無事，似古人賢守。","歲歲登高，年年落帽，物華依舊。","此會應須爛醉，仍把紫菊茱萸，細看重嗅。","搖落霜風，有手栽雙柳。","來歲今朝，爲我西顧，酹羽觴江口。","會與州人，飲公遺愛，一江醇酎。"],"nc":0},{"id":"352242","y":1082,"m":9,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"定风波","ti":"定风波 重阳括杜牧之诗","tit":"定風波 重陽括杜牧之詩","ev":"在黄冈，任黄州团练副使。九月八日，苏轼与孔平仲（毅父）简。","l":["与客携壶上翠微。","江涵秋影雁初飞。","尘世难逢开口笑。","年少。","菊花须插满头归。","酩酊但酬佳节了。","云峤。","登临不用怨斜晖。","古往今来谁不老。","多少。","牛山何必更沾衣。"],"lt":["與客攜壺上翠微。","江涵秋影雁初飛。","塵世難逢開口笑。","年少。","菊花須插滿頭歸。","酩酊但酬佳節了。","雲嶠。","登臨不用怨斜暉。","古往今來誰不老。","多少。","牛山何必更沾衣。"],"nc":0},{"id":"352063","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"南歌子","ti":"南歌子 送行甫赴馀姚","tit":"南歌子 送行甫赴餘姚","ev":"在黄冈，任黄州团练副使。苏轼作《南歌子》、（雨暗初疑夜）、（带酒冲山雨）","l":["日出西山雨，无晴又有晴。","乱山深处过清明。","不见䌽绳花板、细腰轻。","尽日行桑野，无人与目成，且将新句琢琼英。","我是世间闲客、此闲行。"],"lt":["日出西山雨，無晴又有晴。","亂山深處過清明。","不見綵繩花板、細腰輕。","盡日行桑野，無人與目成，且將新句琢瓊英。","我是世間閒客、此閒行。"],"nc":0},{"id":"352064","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"南歌子","ti":"南歌子 寓意","tit":"南歌子 寓意","ev":"在黄冈，任黄州团练副使。苏轼作《南歌子》、（雨暗初疑夜）、（带酒冲山雨）","l":["雨暗初疑夜，风回便报晴。","淡云斜照著山明。","细草软沙溪路、马蹄轻。","卯酒醒还困，仙材梦不成。","蓝桥何处觅云英。","只有多情流水、伴人行。"],"lt":["雨暗初疑夜，風回便報晴。","淡雲斜照著山明。","細草軟沙溪路、馬蹄輕。","卯酒醒還困，仙材夢不成。","藍橋何處覓雲英。","只有多情流水、伴人行。"],"nc":1},{"id":"352065","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"南歌子","ti":"南歌子 再用前韵","tit":"南歌子 再用前韻","ev":"在黄冈，任黄州团练副使。苏轼作《南歌子》、（雨暗初疑夜）、（带酒冲山雨）","l":["带酒冲山雨，和衣睡晚晴。","不知钟鼓报天明。","梦里栩然蝴蝶、一身轻。","老去才都尽，归来计未成。","求田问舍笑豪英。","自爱湖边沙路、免泥行。"],"lt":["帶酒衝山雨，和衣睡晚晴。","不知鐘鼓報天明。","夢裏栩然蝴蝶、一身輕。","老去才都盡，歸來計未成。","求田問舍笑豪英。","自愛湖邊沙路、免泥行。"],"nc":0},{"id":"352082","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"定风波","ti":"定风波 咏红梅","tit":"定風波 詠紅梅","ev":"在黄冈，任黄州团练副使。苏轼赋《红梅三首》。并赋《定风波》咏红梅。","l":["好睡慵开莫厌迟。","自怜冰脸不宜时。","偶作小桃红杏色，闲雅，尚馀孤瘦雪霜姿。","休把闲心随物态，何事，酒生微晕沁瑶肌。","诗老不知梅格在，吟咏，更看绿叶与青枝。"],"lt":["好睡慵開莫厭遲。","自憐冰臉不宜時。","偶作小桃紅杏色，閒雅，尚餘孤瘦雪霜姿。","休把閒心隨物態，何事，酒生微暈沁瑤肌。","詩老不知梅格在，吟詠，更看綠葉與青枝。"],"nc":1},{"id":"352091","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"江城子","ti":"江城子 陶渊明已正月五日游斜川，临流班坐，顾瞻南阜，爱曾城之独秀，乃作斜川诗，至今使人想见其处。元丰壬戌之春、余躬耕于东坡，筑雪堂居之。南挹四望亭之后丘，西控北山之微泉，慨然而叹，此亦斜川之游也。乃作长短句，以江城子歌之","tit":"江城子 陶淵明已正月五日遊斜川，臨流班坐，顧瞻南阜，愛曾城之獨秀，乃作斜川詩，至今使人想見其處。元豐壬戌之春、餘躬耕於東坡，築雪堂居之。南挹四望亭之後丘，西控北山之微泉，慨然而嘆，此亦斜川之遊也。乃作長短句，以江城子歌之","ev":"在黄冈，任黄州团练副使。春，苏轼赋《江神子》—。","l":["梦中了了醉中醒。","只渊明。","是前生。","走遍人间，依旧却躬耕。","昨夜东坡春雨足，乌鹊喜，报新晴。","雪堂西畔暗泉鸣。","北山倾。","小溪横。","南望亭丘，孤秀耸曾城。","都是斜川当日境，吾老矣，寄馀龄。"],"lt":["夢中了了醉中醒。","只淵明。","是前生。","走遍人間，依舊卻躬耕。","昨夜東坡春雨足，烏鵲喜，報新晴。","雪堂西畔暗泉鳴。","北山傾。","小溪橫。","南望亭丘，孤秀聳曾城。","都是斜川當日境，吾老矣，寄餘齡。"],"nc":1},{"id":"352094","y":1082,"m":null,"pl":"浠水","an":"蕲水","sn":"蕲水","sf":"蕲州蕲水","pv":"湖北","lat":30.457503,"lng":115.272078,"tu":"浣溪沙","ti":"浣溪沙 游蕲水清泉寺。寺临兰溪，溪水西流","tit":"浣溪沙 遊蘄水清泉寺。寺臨蘭溪，溪水西流","ev":"任黄州团练副使。赴蕲水。苏轼山行夜饮，中夜起行，醉卧小桥畔，题《西江月》于桥柱上。（照野瀰瀰浅浪）▪任黄州团练副使。苏轼至蕲水。徐禧（德占）来访。与庞安时游清泉寺，赋《浣溪沙》。欲访吴瑛（德仁），未果。回黄州。（山下兰芽短浸溪）","l":["山下兰芽短浸溪。","松间沙路净无泥。","萧萧暮雨子规啼。","谁道人生无再少，门前流水尚能西。","休将白发唱黄鸡。"],"lt":["山下蘭芽短浸溪。","松間沙路淨無泥。","蕭蕭暮雨子規啼。","誰道人生無再少，門前流水尚能西。","休將白髮唱黃雞。"],"nc":2,"fm":1},{"id":"352095","y":1082,"m":null,"pl":"浠水","an":"蕲水","sn":"蕲水","sf":"蕲州蕲水","pv":"湖北","lat":30.457503,"lng":115.272078,"tu":"西江月","ti":"西江月 春夜行蕲水山中。过酒家饮。酒醉，乘月至一溪桥上，解鞍曲肱。醉卧少休。及觉已晓。乱山攒拥，流水锵然，疑非尘世也。书此词桥柱上","tit":"西江月 春夜行蘄水山中。過酒家飲。酒醉，乘月至一溪橋上，解鞍曲肱。醉臥少休。及覺已曉。亂山攢擁，流水鏘然，疑非塵世也。書此詞橋柱上","ev":"任黄州团练副使。赴蕲水。苏轼山行夜饮，中夜起行，醉卧小桥畔，题《西江月》于桥柱上。（照野瀰瀰浅浪）▪任黄州团练副使。苏轼至蕲水。徐禧（德占）来访。与庞安时游清泉寺，赋《浣溪沙》。欲访吴瑛（德仁），未果。回黄州。（山下兰芽短浸溪）","l":["照野㳽㳽浅浪，横空暧暧微霄。","障泥未解玉骢骄。","我欲醉眠芳草。","可惜一溪明月，莫教踏碎琼瑶。","解鞍攲枕绿杨桥。","杜宇一声春晓。"],"lt":["照野瀰瀰淺浪，橫空曖曖微霄。","障泥未解玉驄驕。","我欲醉眠芳草。","可惜一溪明月，莫教踏碎瓊瑤。","解鞍攲枕綠楊橋。","杜宇一聲春曉。"],"nc":1,"fm":1},{"id":"352096","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"满庭芳","ti":"满庭芳","tit":"滿庭芳","ev":"在黄冈，任黄州团练副使。在黄州，苏轼赋《满庭芳》，旨在警世，亦在娱生。（蜗角虚名）第九册（词集）第413页此词校注[一]之考证。）—1082-。","l":["蜗角虚名，蝇头微利，算来著甚干忙。","事皆前定，谁弱又谁强。","且趁闲身未老，须放我、些子疏狂。","百年里，浑教是醉，三万六千场。","思量。","能几许，忧愁风雨，一半相妨。","又何须，抵死说短论长。","幸对清风皓月，苔茵展、云幕高张。","江南好，千钟美酒，一曲满庭芳。"],"lt":["蝸角虛名，蠅頭微利，算來著甚幹忙。","事皆前定，誰弱又誰強。","且趁閒身未老，須放我、些子疏狂。","百年裏，渾教是醉，三萬六千場。","思量。","能幾許，憂愁風雨，一半相妨。","又何須，抵死說短論長。","幸對清風皓月，苔茵展、雲幕高張。","江南好，千鍾美酒，一曲滿庭芳。"],"nc":1,"fm":1},{"id":"352099","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"渔家傲","ti":"渔家傲 赠曹光州","tit":"漁家傲 贈曹光州","ev":"在黄冈，任黄州团练副使。曹焕自光州赴筠州，道过黄冈。苏轼有《渔家傲》赠其父光州守曹九章。","l":["些小白须何用染。","几人得见星星点。","作郡浮光虽似箭。","君莫厌。","也应胜我三年贬。","我欲自嗟还不敢，向来三郡宁非忝。","婚嫁事稀年冉冉。","知有渐。","千钧重担从头减。"],"lt":["些小白鬚何用染。","幾人得見星星點。","作郡浮光雖似箭。","君莫厭。","也應勝我三年貶。","我欲自嗟還不敢，向來三郡寧非忝。","婚嫁事稀年冉冉。","知有漸。","千鈞重擔從頭減。"],"nc":0},{"id":"352101","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"洞仙歌","ti":"洞仙歌 余七岁时。见眉山老尼。姓朱，忘其名，年九十岁，自言尝随其师入蜀主孟昶宫中。一日大热，蜀主与花蕊夫人夜纳凉摩诃池上，作一词。朱具能记之。今四十年，朱已死久矣，人无知此词者。但记其首两句，暇日寻味，岂洞仙歌令乎，乃为足之云","tit":"洞仙歌 餘七歲時。見眉山老尼。姓朱，忘其名，年九十歲，自言嘗隨其師入蜀主孟昶宮中。一日大熱，蜀主與花蕊夫人夜納涼摩訶池上，作一詞。朱具能記之。今四十年，朱已死久矣，人無知此詞者。但記其首兩句，暇日尋味，豈洞仙歌令乎，乃爲足之雲","ev":"在黄冈，任黄州团练副使。苏轼续蜀主孟昶所作《洞仙歌令》首二句为《洞仙歌》","l":["冰肌玉骨，自清凉无汗。","水殿风来暗香满。","绣帘开、一点明月窥人，人未寝，攲枕钗横鬓乱。","起来携素手，庭户无声，时见疏星渡河汉。","试问夜如何，夜已三更，金波淡、玉绳低转。","但屈指、西风几时来，又不道流年、暗中偷换。"],"lt":["冰肌玉骨，自清涼無汗。","水殿風來暗香滿。","繡簾開、一點明月窺人，人未寢，攲枕釵橫鬢亂。","起來攜素手，庭戶無聲，時見疏星渡河漢。","試問夜如何，夜已三更，金波淡、玉繩低轉。","但屈指、西風幾時來，又不道流年、暗中偷換。"],"nc":1,"fm":1},{"id":"352113","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"醉翁操","ti":"醉翁操","tit":"醉翁操","ev":"在黄冈，任黄州团练副使。崔闲来黄，闲善琴，轼与游甚密。为闲作《醉翁操》","l":["琅然。","清圜。","谁弹。","响空山。","无言。","惟翁醉中知其天。","月明风露娟娟。","人未眠。","荷蒉过山前。","曰有心也哉此贤。","醉翁啸咏，声和流泉。","醉翁去后，空有朝吟夜怨。","山有时而童巅。","水有时而回川。","思翁无岁年。","翁今为飞仙。","此意在人间。","试听徽外三两弦。"],"lt":["琅然。","清圜。","誰彈。","響空山。","無言。","惟翁醉中知其天。","月明風露娟娟。","人未眠。","荷蕢過山前。","曰有心也哉此賢。","醉翁嘯詠，聲和流泉。","醉翁去後，空有朝吟夜怨。","山有時而童巔。","水有時而回川。","思翁無歲年。","翁今爲飛仙。","此意在人間。","試聽徽外三兩弦。"],"nc":1},{"id":"352125","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"临江仙","ti":"临江仙 赠送","tit":"臨江仙 贈送","ev":"在黄冈，任黄州团练副使。苏轼赋《临江仙》赠来访道过之友。","l":["诗句端来磨我钝，钝锥不解生铓。","欢颜为我解冰霜。","酒阑清梦觉，春草满池塘。","应念雪堂坡下老，昔年共采芸香。","功成名遂早还乡。","回车来过我，乔木拥千章。"],"lt":["詩句端來磨我鈍，鈍錐不解生鋩。","歡顏爲我解冰霜。","酒闌清夢覺，春草滿池塘。","應念雪堂坡下老，昔年共採芸香。","功成名遂早還鄉。","回車來過我，喬木擁千章。"],"nc":0},{"id":"352126","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"渔父","ti":"渔父","tit":"漁父","ev":"在黄冈，任黄州团练副使。苏轼作《渔父》四首。（渔父饮）《渔父》《渔父》《渔父》","l":["渔父饮，谁家去，鱼蟹一时分付。","酒无多少醉为期，彼此不论钱数。"],"lt":["漁父飲，誰家去，魚蟹一時分付。","酒無多少醉爲期，彼此不論錢數。"],"nc":0},{"id":"352127","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"渔父","ti":"渔父","tit":"漁父","ev":"在黄冈，任黄州团练副使。苏轼作《渔父》四首。（渔父饮）《渔父》《渔父》《渔父》","l":["渔父醉，蓑衣舞，醉里却寻归路。","轻舟短棹任斜横，醒后不知何处。"],"lt":["漁父醉，蓑衣舞，醉裏卻尋歸路。","輕舟短棹任斜橫，醒後不知何處。"],"nc":0},{"id":"352128","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"渔父","ti":"渔父","tit":"漁父","ev":"在黄冈，任黄州团练副使。苏轼作《渔父》四首。（渔父饮）《渔父》《渔父》《渔父》","l":["渔父醒，春江午，梦断落花飞絮。","酒醒还醉醉还醒，一笑人间今古。"],"lt":["漁父醒，春江午，夢斷落花飛絮。","酒醒還醉醉還醒，一笑人間今古。"],"nc":0},{"id":"352129","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"渔父","ti":"渔父","tit":"漁父","ev":"在黄冈，任黄州团练副使。苏轼作《渔父》四首。（渔父饮）《渔父》《渔父》《渔父》","l":["渔父笑，轻鸥举，漠漠一江风雨。","江边骑马是官人，借我孤舟南渡。"],"lt":["漁父笑，輕鷗舉，漠漠一江風雨。","江邊騎馬是官人，借我孤舟南渡。"],"nc":0},{"id":"352130","y":1082,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"调笑令","ti":"调笑令","tit":"調笑令","ev":"在黄冈，任黄州团练副使。苏轼作《调笑令》二首。","l":["渔父。","渔父。","江上微风细雨。","青蓑黄箬裳衣。","红酒白鱼暮归。","归暮。","归暮。","长笛一声何处。"],"lt":["漁父。","漁父。","江上微風細雨。","青蓑黃箬裳衣。","紅酒白魚暮歸。","歸暮。","歸暮。","長笛一聲何處。"],"nc":0},{"id":"352116","y":1083,"m":6,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"水调歌头","ti":"水调歌头 黄州快哉亭赠张偓佺","tit":"水調歌頭 黃州快哉亭贈張偓佺","ev":"在黄冈，任黄州团练副使。武昌主簿吴亮（君采）携其友人沈君十二琴之说与高斋先生赵抃之文来见苏轼。闰六月，轼题沈君琴。又尝有简与亮。","l":["落日绣帘卷，亭下水连空。","知君为我，新作窗户湿青红。","长记平山堂上，攲枕江南烟雨，渺渺没孤鸿。","认得醉翁语，山色有无中。","一千顷，都镜净，倒碧峰。","忽然浪起，掀舞一叶白头翁。","堪笑兰台公子，未解庄生天籁，刚道有雌雄。","一点浩然气，千里快哉风。"],"lt":["落日繡簾卷，亭下水連空。","知君爲我，新作窗戶溼青紅。","長記平山堂上，攲枕江南煙雨，渺渺沒孤鴻。","認得醉翁語，山色有無中。","一千頃，都鏡淨，倒碧峯。","忽然浪起，掀舞一葉白頭翁。","堪笑蘭臺公子，未解莊生天籟，剛道有雌雄。","一點浩然氣，千里快哉風。"],"nc":1},{"id":"352122","y":1083,"m":6,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"鹧鸪天","ti":"鹧鸪天","tit":"鷓鴣天","ev":"在黄冈，任黄州团练副使。苏轼与张商英（天觉）简。","l":["林断山明竹隐墙。","乱蝉衰草小池塘。","翻空白鸟时时见，照水红蕖细细香。","村舍外，古城旁。","杖藜徐步转斜阳。","殷勤昨夜三更雨，又得浮生一日凉。"],"lt":["林斷山明竹隱牆。","亂蟬衰草小池塘。","翻空白鳥時時見，照水紅蕖細細香。","村舍外，古城旁。","杖藜徐步轉斜陽。","殷勤昨夜三更雨，又得浮生一日涼。"],"nc":1,"fm":1},{"id":"352100","y":1083,"m":7,"pl":"鄂城","an":"武昌","sn":"武昌","sf":"鄂州武昌县","pv":"湖北","lat":30.406262,"lng":114.898309,"tu":"定风波","ti":"定风波 元丰五年七月六日王文甫家饮酿白酒，大醉。集古句作墨竹词","tit":"定風波 元豐五年七月六日王文甫家飲釀白酒，大醉。集古句作墨竹詞","ev":"在武昌，任黄州团练副使。七月六日，苏轼饮王齐愈家，醉后画墨竹，赋《定风波》—。","l":["雨洗娟娟嫩叶光。","风吹细细绿筠香。","秀色乱侵书帙晚。","帘卷。","清阴微过酒尊凉。","人画竹身肥拥肿。","何用。","先生落笔胜萧郎。","记得小轩岑寂夜。","廊下。","月和疏影上东墙。"],"lt":["雨洗娟娟嫩葉光。","風吹細細綠筠香。","秀色亂侵書帙晚。","簾卷。","清陰微過酒尊涼。","人畫竹身肥擁腫。","何用。","先生落筆勝蕭郎。","記得小軒岑寂夜。","廊下。","月和疏影上東牆。"],"nc":0},{"id":"352119","y":1083,"m":8,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"好事近","ti":"好事近 黄州送君猷","tit":"好事近 黃州送君猷","ev":"在黄冈，任黄州团练副使。八月二十五日，江西提举铸钱朝请大夫钱昌武致仕。苏轼尝从昌武处得治臂痛不能举之方，与李之仪简中及之。","l":["红粉莫悲啼，俯仰半年离别。","看取雪堂坡下，老农夫凄切。","明年春水漾桃花，柳岸隘舟楫。","从此满城歌吹，看黄州阗咽。"],"lt":["紅粉莫悲啼，俯仰半年離別。","看取雪堂坡下，老農夫悽切。","明年春水漾桃花，柳岸隘舟楫。","從此滿城歌吹，看黃州闐咽。"],"nc":0},{"id":"352120","y":1083,"m":9,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"西江月","ti":"西江月 重阳栖霞楼作","tit":"西江月 重陽棲霞樓作","ev":"在黄冈，任黄州团练副使。乐京以承议郎致仕。屡来访，苏轼卧疾未能晤，以简致歉。","l":["点点楼头细雨。","重重江外平湖。","当年戏马会东徐。","今日凄凉南浦。","莫恨黄花未吐。","且教红粉相扶。","酒阑不必看茱萸。","俯仰人间今古。"],"lt":["點點樓頭細雨。","重重江外平湖。","當年戲馬會東徐。","今日淒涼南浦。","莫恨黃花未吐。","且教紅粉相扶。","酒闌不必看茱萸。","俯仰人間今古。"],"nc":0},{"id":"352124","y":1083,"m":12,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"南歌子","ti":"南歌子 黄州腊八日饮怀民小阁","tit":"南歌子 黃州臘八日飲懷民小閣","ev":"在黄冈，任黄州团练副使。十二月八日，饮张怀民小阁，苏轼赋《南歌子》","l":["卫霍元勋后，韦平外族贤。","吹笙只合在缑山。","闲驾䌽鸾归去、趁新年。","烘暖烧香阁，轻寒浴佛天。","他时一醉画堂前。","莫忘故人憔悴、老江边。"],"lt":["衛霍元勳後，韋平外族賢。","吹笙只合在緱山。","閒駕綵鸞歸去、趁新年。","烘暖燒香閣，輕寒浴佛天。","他時一醉畫堂前。","莫忘故人憔悴、老江邊。"],"nc":0},{"id":"352115","y":1083,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"满庭芳","ti":"满庭芳 有王长官者，弃官黄州三十三年，黄人谓之黄先生。因送陈慥来过余，因为赋此","tit":"滿庭芳 有王長官者，棄官黃州三十三年，黃人謂之黃先生。因送陳慥來過餘，因爲賦此","ev":"在黄冈，任黄州团练副使。王先生送陈慥（季常）往江南，因访苏轼，轼赋《满庭芳》第九册（词集）第437-438页此词校注[一]之考证。）","l":["三十三年，今谁存者，算只君与长江。","凛然苍桧，霜干苦难双。","闻道司州古县，云溪上、竹坞松窗。","江南岸，不因送子，宁肯过吾邦。","𪭢𪭢。","疏雨过，风林舞破，烟盖云幢。","愿持此邀君，一饮空缸。","居士先生老矣，真梦里、相对残釭。","歌舞断，行人未起，船鼓已逄逄。"],"lt":["三十三年，今誰存者，算只君與長江。","凜然蒼檜，霜幹苦難雙。","聞道司州古縣，云溪上、竹塢松窗。","江南岸，不因送子，寧肯過吾邦。","摐摐。","疏雨過，風林舞破，煙蓋雲幢。","願持此邀君，一飲空缸。","居士先生老矣，真夢裏、相對殘釭。","歌舞斷，行人未起，船鼓已逄逄。"],"nc":1},{"id":"352123","y":1083,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"十拍子","ti":"十拍子 暮秋","tit":"十拍子 暮秋","ev":"在黄冈，任黄州团练副使。《十拍子》苏轼赋于去年或今年暮秋。","l":["白酒新开九酝，黄花已过重阳。","身外傥来都似梦，醉里无何即是乡。","东坡日月长。","玉粉旋烹茶乳，金齑新捣橙香。","强染霜髭扶翠袖，莫道狂夫不解狂。","狂夫老更狂。"],"lt":["白酒新開九醞，黃花已過重陽。","身外儻來都似夢，醉裏無何即是鄉。","東坡日月長。","玉粉旋烹茶乳，金齏新搗橙香。","強染霜髭扶翠袖，莫道狂夫不解狂。","狂夫老更狂。"],"nc":0},{"id":"352266","y":1083,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"皂罗特髻","ti":"皂罗特髻 采菱拾翠","tit":"皁羅特髻 採菱拾翠","ev":"在黄冈，任黄州团练副使。苏轼赋《皂罗特髻》，怀采菱、拾翠。（采菱拾翠）","l":["采菱拾翠，算似此佳名，阿谁消得。","采菱拾翠，称使君知客。","千金买、采菱拾翠，更罗裙、满把真珠结。","采菱拾翠，正髻鬟初合。","真个、采菱拾翠，但深怜轻拍。","一双手、采菱拾翠，绣衾下、抱著俱香滑。","采菱拾翠，待到京寻觅。"],"lt":["採菱拾翠，算似此佳名，阿誰消得。","採菱拾翠，稱使君知客。","千金買、採菱拾翠，更羅裙、滿把真珠結。","採菱拾翠，正髻鬟初合。","真個、採菱拾翠，但深憐輕拍。","一雙手、採菱拾翠，繡衾下、抱著俱香滑。","採菱拾翠，待到京尋覓。"],"nc":0},{"id":"352135","y":1084,"m":3,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"减字木兰花","ti":"减字木兰花 琴","tit":"減字木蘭花 琴","ev":"在黄冈，任黄州团练副使。苏轼有《书裙带绝句》诗。","l":["神闲意定。","万籁收声天地静。","玉指冰弦。","未动宫商意已传。","悲风流水，写出寥寥千古意。","归去无眠。","一夜馀音在耳边。"],"lt":["神閒意定。","萬籟收聲天地靜。","玉指冰弦。","未動宮商意已傳。","悲風流水，寫出寥寥千古意。","歸去無眠。","一夜餘音在耳邊。"],"nc":0},{"id":"352252","y":1084,"m":3,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"浣溪沙","ti":"浣溪沙 感旧","tit":"浣溪沙 感舊","ev":"在黄冈，任黄州团练副使。三月，苏轼赋《浣溪沙》","l":["徐邈能中酒圣贤。","刘伶席地幕青天。","潘郎白璧为谁连。","无可奈何新白发，不如归去旧青山。","恨无人借买山钱。"],"lt":["徐邈能中酒聖賢。","劉伶席地幕青天。","潘郎白璧爲誰連。","無可奈何新白髮，不如歸去舊青山。","恨無人借買山錢。"],"nc":0},{"id":"352137","y":1084,"m":4,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"满庭芳","ti":"满庭芳 元丰七年四月一日，余将去黄移汝，留别雪堂邻里二三君子。会李仲览自江东来别，遂书以遗之","tit":"滿庭芳 元豐七年四月一日，餘將去黃移汝，留別雪堂鄰里二三君子。會李仲覽自江東來別，遂書以遺之","ev":"在黄冈，将赴汝州团练副使任。苏轼将离黄州，与李廷评简。","l":["归去来兮，吾归何处，万里家在岷峨。","百年强半，来日苦无多。","坐见黄州再闰，儿童尽、楚语吴歌。","山中友，鸡豚社酒，相劝老东坡。","云何。","当此去，人生底事，来往如梭。","待闲看，秋风洛水清波。","好在堂前细柳，应念我、莫剪柔柯。","仍传语，江南父老，时与晒渔蓑。"],"lt":["歸去來兮，吾歸何處，萬里家在岷峨。","百年強半，來日苦無多。","坐見黃州再閏，兒童盡、楚語吳歌。","山中友，雞豚社酒，相勸老東坡。","云何。","當此去，人生底事，來往如梭。","待閒看，秋風洛水清波。","好在堂前細柳，應念我、莫剪柔柯。","仍傳語，江南父老，時與曬漁蓑。"],"nc":1,"fm":1},{"id":"352330","y":1084,"m":9,"pl":"宜兴","an":null,"sn":"宜兴","sf":"常州宜兴（阳羡）","pv":"江苏","lat":31.346071,"lng":119.830069,"tu":"踏莎行","ti":"踏莎行","tit":"踏莎行","ev":"在宜兴，赴汝州团练副使任途中。九月，苏轼赋《踏莎行》","l":["山秀芙蓉，溪明罨画。","真游洞穴沧波下。","临风慨想斩蛟灵。","长桥千载犹横跨。","解佩投簪，求田问舍。","黄鸡白酒渔樵社。","元龙非复少时豪，耳根洗尽功名话。"],"lt":["山秀芙蓉，溪明罨畫。","真遊洞穴滄波下。","臨風慨想斬蛟靈。","長橋千載猶橫跨。","解佩投簪，求田問舍。","黃雞白酒漁樵社。","元龍非復少時豪，耳根洗盡功名話。"],"nc":1},{"id":"352140","y":1084,"m":11,"pl":"淮安","an":"淮阴","sn":"楚州","sf":"淮南东路楚州","pv":"江苏","lat":33.616272,"lng":119.022429,"tu":"浣溪沙","ti":"浣溪沙 赠席上楚守田待问小鬟","tit":"浣溪沙
