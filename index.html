点出朝云的名字。夸她像神女下凡，也是在回应秦观的赠词。"},{"line":"莫翻红袖过帘栊","note":"叮嘱她跳舞时红袖别甩出帘外。字面上怕她被外人看见，其实是主人家半开玩笑的爱惜。"},{"line":"怕被杨花勾引、嫁东风","note":"把杨花、东风说成会勾引人的轻薄角色，假装担心朝云被引走。用玩笑收尾，可能也顺带打趣了写词夸她的秦观。"}],"moods":["艳情"],"caveat":"这首词的作年和赠答关系依据校注的考证。词中没有直接写出朝云的名字，主要是根据“彩云”“巫峰”的暗指和秦观的原词推定。另外，所附“这两年的其他事”都是杭州任上的事，和这首词没有直接关系。"},"352331":{"background":"元祐年间苏轼任杭州知州，一州的刑狱也归他管。据宋人笔记《绿窗新话》等记载，灵隐寺僧人了然迷上了娼妓李秀奴，钱财耗尽后被她拒之门外，他酒醉后找上门去，把她打死了。案子交到苏轼手上，审明以后，他用这首词写成判词，判了然死罪。所以这首词不是抒发自己的情怀，而是一位地方官在公堂上用词的形式写的判决书。","mood":"这首词里看不到苏轼常有的身世感慨，基调是讥讽，也带着冷峻：开头嘲笑僧人守戒有名无实，接着写他沉迷烟花以致潦倒，最后落到杀人偿命。苏轼平日爱和僧人往来，也爱说笑，这里故意把佛家“色空”的道理反过来用。字面上是玩笑，底下是对一条人命的严肃态度。杭州任上他忙着赈灾、治理西湖，这首词最能看出他作为地方官断案的一面。","lines":[{"line":"云山顶上空持戒。","note":"讥讽他住在深山寺院里，名义上在修行，戒律却形同虚设。一个“空”字，定下了全篇的嘲讽调子。"},{"line":"空空色色今何在。","note":"借佛家“色即是空”反问他：参不透色与空，如今人死了，罪也定了，色和空都落了空，修行更是一场空。"},{"line":"臂间刺道苦相思，这回还了相思债。","note":"据记载，了然曾在手臂上刺下相思的句子。苏轼就拿这件事收尾，判他用性命偿还这笔“相思债”，话里带刺，判决却毫不含糊。"}],"moods":["艳情","禅悟"],"caveat":"这首词和判案的故事最早见于宋人笔记小说，苏轼文集的早期版本没有收录，学界多认为是后人附会而托名苏轼；加上苏轼在元祐六年三月已奉召离开杭州，系于1091年的编年也只是依据这个故事推定的。"},"352201":{"background":"元祐六年秋，苏轼求外任，出知颍州，到这时约半年。聚星堂是欧阳修当年知颍州时在州署建的堂。赵德麟即宗室赵令畤，时任颍州签判，和苏轼往来很密。据赵令畤《侯鲭录》，一个梅花盛开、月色明净的春夜，苏轼的妻子王闰之说春月比秋月让人心情舒畅，不如请赵德麟他们来花下喝酒。苏轼称赞这话有诗意，便请客小饮，并用她的意思写成这首词。","mood":"这首词的情绪轻松愉快，在苏轼词里不算多见。前一年他在朝中屡受攻击，自己请求外放到颍州，给王巩的信里还感叹亲友之间处处是陷阱。到颍州后，他远离朝争，身边有旧友相伴，心情暂时放松下来。末尾说秋月照离人，主要是借妻子的话作对比，衬出这一夜的快乐。前一年秋天他刚和弟弟苏辙分别，这几句也许带着一点余味，但词中并没有明说。","lines":[{"line":"摇荡香醪光欲舞。","note":"月光映在酒杯里，酒一晃，光影也像在跳舞。写的是微醺时的好兴致，人和眼前景物一起活泼起来。"},{"line":"总是少年行乐处。","note":"淡云薄雾、梅香月色，本是年轻人游乐的好时光。这话出自年近六十的苏轼之口，有兴致，也隐约有年华已过的自觉。"},{"line":"只与离人照断肠。","note":"化用妻子春月可喜、秋月惹愁的说法，用秋夜照着离人的凄清，反衬今夜团聚小饮的温暖。"}],"moods":["闲适"],"caveat":"词题作二月十五日，《侯鲭录》记此事在正月。参考赏析说出自《后山诗话》，而通常引用的出处是《侯鲭录》。词题也有作“花”的版本，具体日期和出处说法不一。"},"352202":{"background":"元祐年间党争激烈，苏轼几次请求外任。元祐七年初，他在颍州知州任上，即将改任扬州。弟弟苏辙此时在京城任执政，兄弟二人各在一处。临行前他写下这首词寄给子由。颍水对两人有特别的意义：熙宁四年苏轼出京赴杭州，子由一路送他到颍州，兄弟俩在这里分手，苏轼当时写有《颍州初别子由》。二十年后他又站在颍水边，又要远行，自然想起了弟弟。","mood":"这首词的主调是怀念弟弟，后半转为盼望重逢。年轻时兄弟约好将来一起退隐，在雨夜里对床而眠，可做官几十年，两人一直分居各地，这个约定始终没能兑现，词里有自责，也有对宦途的厌倦。下片他设想兄弟在黄河边重逢、把酒长谈，语气明显轻快起来。当时朝中可能召他回京，他心里有了些盼头，但旧日的伤痛并没有因此消失。","lines":[{"line":"辜负当年林下意，对床夜雨听萧瑟。","note":"兄弟年轻时读到韦应物的“对床夜雨”诗，约好早日一同退隐。如今年近六十，这个约定落空了，苏轼觉得自己对不起弟弟。"},{"line":"恨此生、长向别离中，添华发。","note":"回头看半生的仕途，大部分时间都在和亲人分别。白发多了，分别还没有结束，他心里的遗憾直接写了出来。"},{"line":"衣上旧痕馀苦泪，眉间喜气添黄色。","note":"衣服上还留着当年别离时的泪痕，眉间却已经现出吉兆。旧日的伤心和眼前重逢的希望写在一起，两种心情都是真的。"}],"moods":["怀人","悲慨"],"caveat":"本篇系年依傅藻《东坡纪年录》等编年，定在元祐七年颍州；也有学者对具体年份有不同看法。“眉间喜气”具体指什么喜事，词中没有明说，本文的解释只是推测。"},"352204":{"background":"元祐七年（1092）春，苏轼由颍州改任扬州知州，三月中旬途经泗州。年谱记载，他在泗州为久旱到僧伽塔祈雨、写祝文，还写信给弓允（明父）表示感谢。这首词写的是一次登城宴饮。词中说园林是“使君家”，使君指当地长官，可见苏轼是被款待的过路客人。主人是谁、宴会在哪一天，现有材料都无法确定，只能推断是地方官招待途经的苏轼时，他在席间或席后写下的。","mood":"上片写春光、园中桃李、城上醉客，下片写歌声和酒宴，热闹一层层往上推。到“饮散”一转，人散了，他独自倚着栏杆，眼里只剩云、草、山和落日。这种热闹过后的冷落，正合他此时的状况：这几年他在杭州、汴京、颍州、扬州之间不断调动，常年在路上，宴席是别人设的，自己只是暂留的客人。远望“玉关”可以理解为对远方乃至朝局的牵挂，但词里没有点明，不宜坐实。","lines":[{"line":"园中桃李使君家，城上亭台游客醉。","note":"满园桃李属于主人，醉在亭台上的是游客。苏轼以过客身份入席，主客分得很清楚，透出旅途中暂住的意味。"},{"line":"饮散凭阑无限意。","note":"这是全词的转折。酒散人去，他一个人倚着栏杆，“无限意”没有说破，交给后面两句的景色去承接。"},{"line":"云深不见玉关遥，草细山重残照里。","note":"玉关借指极远的地方，云太深，望不见。落日下细草连着重重山峦，说不出的怅惘化成一片苍茫远景。"}],"moods":["羁旅"],"caveat":"把这首词系于元祐七年泗州，主要是根据行迹推定的，词中并无泗州地名或人名；“雄垒”“玉关”带有边地色彩，具体作于何时何地仍可商榷。"},"352205":{"background":"元祐七年（1092）春，苏轼从颍州调任扬州知州，到任时已近春末。扬州芍药向来有名，这时正开着，樱桃也刚熟。有人在一座名园设宴，请宾客赏花送春，苏轼在席上写了这首词。词题写的是“徐州藏春阁”，但词中明说“广陵”，年谱据此把它归在扬州。园主是谁、同席有哪些人，现有材料都查不到。","mood":"这是宴席上应酬的小词，语气轻快，写花也写人，还带点玩笑。苏轼这年五十七岁，几年里在杭州、颍州、扬州之间轮流做地方官，对朝中人事也很戒备，曾写信给王巩，感叹亲友之间动不动就是陷阱。席上的轻松正是他应对困境的一贯态度。他到扬州后还停办了劳民伤财的“万花会”，可见他欣赏花，却不赞成为赏花花费过度。","lines":[{"line":"洛阳初夏广陵春。","note":"洛阳牡丹在初夏盛开，扬州芍药开在春末。这句把两地名花放在一起，称赞眼前扬州的花不比洛阳的差，也透出主人的得意。"},{"line":"红玉半开菩萨面","note":"半开的花像红玉，又像菩萨端庄的脸。用庄重的形象比艳丽的花，是酒席上随口想出的巧妙比喻，见出他兴致不错。"},{"line":"尊前还有个中人。","note":"花以外，酒杯前还有懂得其中情趣的人，一般认为指陪酒的歌女。最后一句从花转到人，口气带着玩笑和亲近。"}],"moods":["闲适","咏物"],"caveat":"词题作“徐州藏春阁园中”，与词中“广陵春”对不上。年谱根据词意把它定在元祐七年扬州任上，但题目和地点的矛盾还没有定论。"},"352206":{"background":"元祐七年（1092）三月，苏轼从颍州改任扬州知州。这几年他在杭州、汴京、颍州之间来回调动，朝中党争一直没有停。这时他的学生晁补之（字无咎）正好在扬州任通判，师生成了上下级同僚。五月二十四日天气正热，苏轼和几位客人到晁补之的书斋“随斋”聚会。主人打来井水倒满一只大盆，在水里泡上白荷花，满座的人都觉得凉快下来。这首词就是苏轼在席上记下这一刻，也算是对主人的答谢。","mood":"词里没有议论，也没有感慨身世，只是一层层写凉意：晚风吹着，竹影晃动，泉水清冷，白荷浸在水里。这样轻松的笔调，在苏轼这一时期的作品里并不多见。前一年他得知外放颍州时，还在给王巩的信里感叹亲友之间动不动就成了陷阱。如今在自己信得过的学生家里喝酒、小睡、看水，他能暂时放下这些顾虑。词里的清凉不只来自泉水，也有几分是心里松快了。","lines":[{"line":"入袖寒泉不湿衣。","note":"凉气像泉水一样钻进袖子，衣服却没有湿。写的是凉快在身上的感觉，透出主客之间不拘礼数、各自自在的气氛。"},{"line":"梦回酒醒。","note":"喝了酒，打了个盹，醒来时还在朋友家里。短短四个字，能看出他此刻完全放松，没有官场上需要提防的心事。"},{"line":"散落佳人白玉肌。","note":"水花溅起，落在洁白的肌肤上。可能是写席间佳人，也可能是借美人比白荷，结尾留在一幅清凉明净的画面里。"}],"moods":["闲适"],"caveat":"题目只写了月日，没写年份；系于元祐七年，是根据苏轼知扬州、晁补之任扬州通判的时间重合推定的。末句的“佳人”是实指席上的人，还是比喻水中的白荷，注家理解不一。"},"352207":{"background":"元祐七年（1092年）八月，苏轼在扬州知州任上，朝廷召他回京任兵部尚书。他上表推辞，请求继续在外地做官，没有获准，只能准备北上。苏伯固就是苏坚，曾在杭州做苏轼的僚属，协助他疏浚西湖，两人交情很深。这首词是在扬州与苏坚分手时写的，词题明说是“送”他。苏坚大概是南归杭州一带，苏轼则即将离开淮南入京。两人这一别，各自朝不同的方向走。","mood":"词里的情绪以伤感为主，没有苏轼常见的自我宽解。他快到六十岁了，连年在京城和地方之间调来调去，朝中的人事纠纷又让他心里发怵。这一次被召回京城并不是他自己想要的，偏偏又赶上和老朋友分别。所以“老”和“别”两种感受叠在一起，他直接写胡须全白、流泪、梦里跟着朋友回去，只想留在共同度过的杭州岁月里。","lines":[{"line":"三度别君来，此别真迟暮。","note":"算起来已经和你分别了三次，这一次两人都老了，以后能不能再见很难说，所以这次分别格外沉重。"},{"line":"白尽老髭须，明日淮南去。","note":"胡须全白了，明天就要离开淮南。年纪老大和身不由己的奔波连在一起写，语气很平淡，心里却很无奈。"},{"line":"后夜逐君还，梦绕湖边路。","note":"人不能同行，只能在梦里跟着朋友回去，绕着西湖边的小路走。那是两人一起治湖、来往相处的地方。"}],"moods":["送别","怀人"],"caveat":"这首词的编年有不同说法，这里按元祐七年扬州所作来理解。“明日淮南去”说的是苏轼自己离开淮南还是苏坚动身，注家理解不一致。“湖边路”指杭州西湖，也是推测，并没有确证。"},"352059":{"background":"元祐七年春，苏轼由颍州改任扬州知州，乘船南下，途经楚州。一路上他常让随行兵卒退下，亲自去问百姓的疾苦。到楚州后，知州周豫设宴招待，席间让家中舞女出来献舞。苏轼看完，写了两首《南歌子》送给周豫，这是其中一首。这是一首宴席上的应酬词，写给主人，也写给跳舞的少女。","mood":"词里的情绪轻快明亮，看不到愁苦。离京赴颍州前，苏轼刚在给王巩的信里感叹，亲友之间动不动就成了陷阱。朝中的倾轧让他宁愿在外做官。旅途中遇到热情的同僚，看了一场好舞，又赶上满眼春色，他乐得放松一会儿，用风雅又带点玩笑的笔墨回报主人。这份轻松是真的，但也只是赶路途中短暂的歇脚。","lines":[{"line":"叠鼓忽催花拍、斗精神。","note":"鼓点忽然加紧，舞步跟着变快，少女越跳越有精神。苏轼抓住了节奏突变的那一刻，可见他看得入了神。"},{"line":"空阔轻红歇，风和约柳春。","note":"舞罢红衣停下，场上一下子空了，只剩和风吹着柳条的春意。热闹过后的安静，留有余味。"},{"line":"胜似缠头千锦、共藏珍。","note":"缠头是赏给艺人的锦帛。苏轼说这首词胜过上千匹锦缎，请主人和舞女一起收藏，是席间半开玩笑的客气话。"}],"moods":["艳情","闲适"],"caveat":"“蓬山才调”指谁，说法不一：可以理解为称赞舞女的技艺不像凡间所有，也可能是恭维主人，或者是苏轼说自己的文才。周豫的生平资料很少，这里不下定论。"},"352299":{"background":"元祐七年（1092）春，苏轼从颍州改任扬州知州，这首词大约写在他到扬州后不久。词没有题目，也没有小序，年谱只记了“赋《江城子》”，并没有交代是谁设的宴、席上有谁、陪酒唱歌的女子是谁，这些都无从考证。从词里看，这是一个雨后放晴的傍晚，在西楼上设宴，有歌女劝酒，词是写给当晚的酒席，也写给远在江南的旧友看的。","mood":"整首词写的是一场宴饮的快乐：雨停了，夕阳照进帘内，花还开着，酒刚滤好，美人笑着举杯。不过“吹散一春愁”说明他心里本来是有愁的。这几年他在杭州、汴京、颍州、扬州之间来回调动，给王巩的信里还说过亲友之间动不动就成了陷阱。这一晚的尽兴，多半是他有意让自己从这些烦忧里暂时脱身。末句向江南旧友夸口，带着几分自得，也有一点自我安慰。","lines":[{"line":"柳外残阳，回照动帘钩。","note":"雨过之后，夕阳从柳树外斜照回来，帘钩随光影晃动。天色一转晴，人的心情也跟着轻快起来，宴会就要开始了。"},{"line":"歌扇萦风，吹散一春愁。","note":"歌女的扇子带起轻风，好像把一整个春天积下的愁闷都吹走了。可见他本来心里有郁结，这一晚才算暂时放开。"},{"line":"试问江南诸伴侣，谁似我，醉扬州。","note":"他问江南的老朋友们，谁能像我这样醉在扬州。口气带着得意和玩笑，也透出对杭州旧友的惦念。"}],"moods":["闲适","艳情"],"caveat":"这首词没有题序，编在元祐七年扬州任上，主要是根据末句“醉扬州”推断的；宴会的主人、在座的人和那位歌女都没有记载，无法确指。"},"352060":{"background":"元祐七年（1092），苏轼由颍州改任扬州知州，赴任途中乘船经过楚州。楚州知州周豫设宴招待他，席间让自家的舞女出来跳舞助兴。苏轼当场写了两首《南歌子》送给这位舞女，这是其中一首。这首词是宴席上的应酬之作，既写给舞女，也是对主人款待的回礼。同一段路上，他常把随行兵卒打发开，去民间询问百姓的困苦，在楚州还写了《淮阴侯庙碑》，心思并不全在宴乐上。","mood":"整首词语调轻快，先夸舞女衣饰华贵、身姿轻盈，再写满座宾客专心看舞。末句借“周郎”切合主人的姓，开了一个分寸得当的玩笑，宾主之间的融洽由此可见。此时苏轼已经五十七岁，几年里在杭州、汴京、颍州、扬州之间来回调任，前一年还在给王巩的信里感叹亲友之间动不动就成了陷阱。这些忧虑在词里看不出来。它更像旅途中一次放松的应酬，硬要说里面有什么寄托，证据并不充分。","lines":[{"line":"只应飞燕是前身。","note":"说舞女身轻善舞，前世应当就是汉代的赵飞燕。这是宴席上常见也最讨喜的夸法，语气轻松，有逗趣的意思。"},{"line":"共看剥葱纤手、舞凝神。","note":"满座客人一起看着她白嫩纤细的手，看她专心起舞。这一句写出了宴席上的现场感，诗人自己也是看客之一。"},{"line":"但得周郎一顾、胜珠珍。","note":"化用周瑜精通音律、“曲有误，周郎顾”的典故，暗指主人周豫：舞女能得到主人的青睐，比珠宝还珍贵。一句话既夸了舞女，也恭维了主人。"}],"moods":["艳情","闲适"],"caveat":"年谱记苏轼当时写了两首，这是其中一首。舞女的姓名已经无从查考。把“周郎”理解为双关主人周豫的姓，是通行的解释。"},"352208":{"background":"元祐八年（1093）春，苏轼在汴京任礼部尚书。友人苏坚（字伯固）要回吴中（今苏州一带）的老家，苏轼写这首词为他送行。苏坚是他在杭州任上的僚属，曾协助他疏浚西湖。前一年在扬州分别时，苏轼还写过一首《生查子》赠他。这首词用的是贺铸（字方回）《青玉案》的原韵，属于文人之间的唱和。名义上是送朋友回乡，写着写着却成了他自己对江南的怀念。","mood":"词里几乎没有离别的伤感，读来更像是羡慕和向往。他说要派一条黄犬跟着朋友回去，又叮嘱水边的鸥鹭别受惊，因为那一带的桥都是他走过的地方。此时他官位很高，看上去十分显达，但朝中党争没有停过，他自己也一再请求外放。朋友能回江南，他只能说一句“归期天已许”来安慰自己。那件淋过西湖雨的春衫，留住的是回不去的杭州岁月。","lines":[{"line":"三年枕上吴中路。","note":"离开杭州前后算来已有三年，江南的路只能在梦里走。开头一句先说自己的思念，然后才说到送别。"},{"line":"莫惊鸥鹭，四桥尽是，老子经行处。","note":"他嘱咐水鸟不要惊飞，因为这里的桥都是自己从前常走的地方。语气亲切随意，把江南当成了自家的旧地。"},{"line":"春衫犹是，小蛮针线，曾湿西湖雨。","note":"身上的春衫还是家中女眷缝的，当年在西湖淋过雨。借一件旧衣把对杭州的怀念说得很具体，也很克制。"}],"moods":["送别","思乡"],"caveat":"这首词的编年有不同说法，也有人认为作于元祐七年的扬州；另有记载把末三句或全词归在姚志道（又作姚进道）名下，通行的看法仍认为是苏轼所作；“小蛮”具体指谁，也没有定论。"},"352241":{"background":"这首词没有题序，写给谁、为了什么事、在什么场合写的，现存材料都没有交代。按这里的编年，它作于元祐八年秋，苏轼当时在汴京任礼部尚书。这一年八月，妻子王闰之病逝；九月初，主政多年的高太后去世，哲宗亲政，朝局眼看要变，苏轼不久就被派去知定州。词里写他傍晚骑马沿水边回来，听笛、饮酒，身佩金鱼袋，有仪仗簇拥，像是一场公务或宴饮结束后独自静下来的时刻。他借眼前这份显贵，回头审视自己。","mood":"上片写回程的所见所闻：秋云低沉，远山的雪色透着寒意，心绪是被这些景物一点点勾起来的。下片问“谁与共”，说明身边没有可以说心里话的人。结尾把金鱼袋、旌旆这些官场荣耀，看作只是给一场浮生大梦添的点缀。此时他官至尚书，表面上很风光，可是刚刚丧妻，又隐约感到政局要翻转。词里这种看透了却仍然落寞的口气，和他当时的处境正好对得上。","lines":[{"line":"归来转觉情怀动。","note":"在外面骑马时还没觉得什么，回到住处反倒心绪翻涌。可见心里压着事，一安静下来就被触动了。"},{"line":"美酒一杯谁与共。","note":"席前虽有歌舞，却找不到一个能对饮谈心的人，热闹反而显出孤单。联系当年丧妻，这一问更显沉重。"},{"line":"将何用，只堪妆点浮生梦。","note":"他自问：高官的佩饰和仪仗有什么用？答案是只能给虚幻的人生添点装饰。这是在冷眼看待仕途上的荣华。"}],"moods":["自嘲","悲慨"],"caveat":"这首词没有题序，各家编年说法不一，写作对象和具体场合都已无法考证。词中写到“秋阴”和“西山雪”，是否就是九月在汴京时的景物，也难以确定。"},"352214":{"background":"元祐八年九月，高太后去世，哲宗亲政，苏轼离开朝廷，出任定州知州。据他的幕僚李之仪在跋文中的记载，这首词写于定州的一次宴席：席间宾客谈起周穆王西游、与西王母相会的传说，歌伎恰好唱着柳永创制的长调《戚氏》，有人请苏轼按这个调子写一首。他边喝酒边写，随写随唱，一气写成。它不是为某个人写的，是酒席上应宾客之请的即兴之作。","mood":"全词大半在铺写仙境的华丽和宴乐的尽兴，心情轻快，也有在宾客面前一展笔力的兴致。到结尾，天色将明，穆王起了归心，回头望向人间，望向长安。苏轼此时刚被排挤出京，朝局正在转向，有人把“回首尘寰”“望长安路”读成他对朝廷的牵挂。这种读法说得通，但词本是游戏之作，不宜坐实。","lines":[{"line":"当时穆满巡狩，翠华曾到海西边。","note":"点明题材：周穆王西巡到西王母住处的传说。这正是席间宾客谈到的故事，词由此展开。"},{"line":"动归思、回首尘寰。","note":"仙宴散场，转向人间。热闹过后的一点怅惘，或许也带着他自己离京之后的心事。"},{"line":"望长安路，依稀柳色，翠点春妍。","note":"以回京路上的春色收尾，语气明快。长安代指京城，是否寄托他对朝廷的眷念，只能推测。"}],"moods":["闲适","感时"],"caveat":"写作背景主要依据李之仪的跋文，只能确定作于定州任上（元祐八年秋至绍圣元年春），具体月份无法考定；结尾是否寓有政治寄托，学界看法不一。"},"352265":{"background":"按这里的编年，此词作于元祐八年九月，地点在汴京。苏轼前一年从扬州被召回，这时在朝任礼部尚书。这一年八月初一，妻子王闰之病逝；九月初三，一向信任、保护他的太皇太后高氏去世，朝中局势眼看就要变化，不久他便出京任定州知州。题作“病起小集”，可知是一场病刚好之后，和几个人小聚时写的。同席有谁、生的什么病，现有材料都没有记载。","mood":"词从秋风先吹进梧桐写起，很快转到自己衰老的病容，想躲也躲不开。“书空”用的是殷浩被罢官后整天用手在空中写字的典故，说明他心里有话说不出。醉、病、懒交替出现，大概就是他这些天的真实状态。最后把万事交给酒杯，看上去是放下了，其实是没有办法。刚失去妻子，朝中的依靠也没了，自己年近六十又多病，这份疲惫和他当时的处境正好对得上。","lines":[{"line":"浑无处、回避衰容。","note":"秋气一到，满眼都是衰败的样子，镜子里自己病后的老态也躲不过去，说的是景，更是自己的身体。"},{"line":"问公何事，不语书空。","note":"别人问他怎么了，他不回答，只用手指在空中比画。借殷浩失意的典故，说心里的郁结讲不出口。"},{"line":"都将万事，付与千钟。","note":"索性把所有心事都交给酒，不再去想。话说得洒脱，背后其实是无力和厌倦。"}],"moods":["悲慨","自嘲"],"caveat":"这首词在有的版本里题作“秋兴”。系于元祐八年九月只是一种说法，也有学者把它列为未编年或系于别的年份，所以它和丧妻、太后去世之间的联系只是推测。"},"352306":{"background":"元祐八年（1093）八月，妻子王闰之病逝。九月，一直支持旧党的高太后去世，哲宗亲政，朝中风向转变。苏轼这时以礼部尚书的身份请求外任，出知定州。临行前他请求当面辞别，哲宗没有准许。这首词题为“寓意”，看不出是为谁而写，更像是给自己写的。他把这些年的仕途从头想了一遍，借古人古事表明自己的心迹，并没有具体的唱和对象或宴饮场合。","mood":"开头写自己几次入朝、几次身居高位，说得很平淡，紧接着却问：一个读书人，这些究竟算荣耀还是屈辱？接下来把凭门第得官的贵胄子弟，同甘守寂寞的严君平、郑子真放在一起比，冷热对照很分明。末尾归到佛家的“无念”“无名”。这种心境，和他刚刚经历丧妻、政局转向、被冷淡送出京城直接相关。语气是看透了，底下仍有不平。","lines":[{"line":"问儒生、何辱何荣。","note":"多次入朝、官至尚书之后，他反过来问一个读书人在官场里的荣辱究竟有什么意义。语气平静，心里已经倦了。"},{"line":"成都卜肆，寂寞君平。","note":"严君平在成都卖卜，不肯做官。苏轼拿他和前面靠门第显贵的人对照，表示自己更认同安于寂寞的人。"},{"line":"寒灰炙手，人重人轻。","note":"失势的人像冷灰，得势的人热得烫手。旁人看重谁、轻视谁，全跟着权势转。这里带着他对人情冷暖的切身体会。"}],"moods":["自嘲","禅悟"],"caveat":"这首词按年谱系于元祐八年在定州，但它究竟作于离京之前还是到定州之后，各家说法不一；“三入”“四至”具体对应哪几次任命，也没有定论。"},"352264":{"background":"这首词题为“述怀”，不是写给别人的，也没有留下写作场合的记载，像是苏轼月夜独自喝酒时写给自己的。年谱把它系于元祐八年（1093）知定州时。这一年他接连受挫：八月，妻子王闰之病逝；九月，一向倚重他的高太后去世，哲宗亲政，朝局眼看要变。他出知定州，临行前请求当面辞别，皇帝也没有召见。放在这一年读，词里的倦意和退意就不难理解。","mood":"上片说追逐名利只是白白劳神，人生短促，像缝隙里一闪而过的马影、石头敲出的火星、一场梦。下片说自己满腹文章，却找不到能说心里话的人。这不是年轻人的伤感，而是年近六十、几度进出朝廷、屡遭攻击之后的疲惫。不过他没有就此消沉，而是劝自己暂且喝酒取乐，盼着有一天能退下来，只守着琴、酒和溪上的云。灰心和自我宽慰，在这首词里是同时存在的。","lines":[{"line":"浮名浮利，虚苦劳神。","note":"把半生追逐的名位看作虚浮的东西，费尽心力，到头来一场空。这是久经官场起落后的厌倦，不是空泛的说教。"},{"line":"虽抱文章，开口谁亲。","note":"身怀才学，却没有可以推心置腹的人。元祐年间他屡遭台谏攻击，朝中能说话的人越来越少，这一句最见孤独。"},{"line":"几时归去，作个闲人。","note":"想退隐，却说不准哪天才能走。“几时”二字透出身不由己，结尾的琴、酒、云是他心里向往的另一种活法。"}],"moods":["旷达","闲适"],"caveat":"编年有分歧：年谱系于元祐八年定州，参考赏析只说是元祐年间，词中也没有可以确证的本事。这里的背景按年谱来写，只供参照。"},"352310":{"background":"这首词为什么写、为谁写，现存史料都没有记载。编年把它放在绍圣元年（1094）九月：苏轼因党争被贬惠州，南下途经南雄，翻越大庾岭。可是年谱这一条只记了他在龙泉钟上题诗，跟这首词没有直接关系。词通篇用女子口吻写离别相思，看不出赠给谁、在什么场合写成。它更可能是替人代言或供歌女演唱的作品，不宜当成苏轼本人的自述。","mood":"词写一位女子分别后的煎熬。她本来就清瘦，分开以后更憔悴。白天盼着天黑，到了黄昏反而更难熬。她怨对方明知相思苦还要走，又说自己不怕山高路远，只怕这一别再难相见。如果这首词真写在南迁途中，“过关山”“见郎难”容易让人想到苏轼远赴岭南、前途难料的处境。但这只是读者的联想，词里找不到证据。","lines":[{"line":"及至黄昏时候、转销魂。","note":"白天盼黄昏，以为天黑了就好过些。真到了黄昏，孤单反而更重。写的是等来等去落了空的心理。"},{"line":"怎忍抛奴去。","note":"直接质问对方：你明明知道相思苦，怎么忍心丢下我走了？口气像民间情歌，又怨又舍不得。"},{"line":"只恐别郎容易、见郎难。","note":"她不怕路远，只怕分开容易，再见却难。把离别后最深的不安说得很直白。"}],"moods":["怀人","艳情"],"caveat":"这首词的作者归属历来有疑问，有的版本把它列为苏轼名下的存疑之作。系于1094年南雄也缺乏直接依据。另外，所附“其他事”记的是元祐八年（1093）苏轼在开封、准备赴定州任前后的事，和这首词无关。"},"352028":{"background":"按这份年谱，这首词写于绍圣元年（1094）暮春。这一年哲宗亲政，新党重新得势，苏轼从定州知州任上被贬到英州，四月动身南下，路上又被一再加贬，最后被安置到惠州。词没有题赠对象，看不出是写给谁的。它更像是赶路时看到暮春景色，经过一户人家墙外，偶然听见墙里的笑声，就随手写下了这点感触。这一年他五十九岁，正被一路赶往岭南，眼前的落花和柳絮才格外触动他。","mood":"词里有两层情绪。一层是惋惜：看着花谢、柳絮飘散，春天一点点过去。另一层是自我宽慰：天涯到处都有芳草，走到哪里都能过下去。下半首写路过的行人被墙里的笑声勾动了心思，笑声却渐渐听不见了，只剩他白白动情，带着几分自嘲。放到南贬路上来读，这样一会儿伤感、一会儿自我开解，正像一个年近六十的人被迫远行时真实的心情。","lines":[{"line":"枝上柳绵吹又少。","note":"柳絮一阵阵被吹走，枝头越来越空。“又”字说明他不止看了一回，流逝的既是春光，也是自己的岁月。"},{"line":"天涯何处无芳草。","note":"他马上宽慰自己：哪里会没有芳草？就算被赶到天涯，也照样有春色。话说得开阔，底下却压着远行的无奈。"},{"line":"多情却被无情恼。","note":"墙里人笑够了就走开，并不知道墙外有人在听。行人白白动了心，只好自嘲，也透出一片真心没人理会的怅惘。"}],"moods":["羁旅","旷达"],"caveat":"这首词的写作年份没有定论，有熙宁年间写于密州或杭州、绍圣初年南贬途中、谪居惠州时等几种说法。本文按年谱定在绍圣元年，并没有确证；朝云在惠州唱这首词时落泪的故事出自宋人笔记，只是传闻。"},"352216":{"background":"绍圣元年，新党重新执政，苏轼被一贬再贬，最后被发往惠州安置。南下途中，他在夏秋之交经过江州，在庐山脚下遇到老朋友苏坚（字伯固）。苏坚当年在杭州与他共事，两人交情很深，这时也正要离开，往西去澧阳一带。两人一起游览了几天。苏坚先写了作品，苏轼在分别前夕和了这首词，为他送行。","mood":"上片把梦里的太湖和眼前的庐山写得又开阔又明亮，紧接着却落到“此生长接淅”：五十九岁的人刚被赶出朝廷，还要去更远的岭南，不知道哪里才是尽头。他把自己和苏坚看成一样漂泊的人，难过是真的。下片他没有再诉自己的苦，而是用屈原、刘禹锡的旧事勉励朋友。自己身在贬谪路上，心里惦记的还是朋友的才华和以后的写作。","lines":[{"line":"此生长接淅","note":"借孔子匆忙离开齐国的典故，说自己这辈子总在仓促赶路。如今又被贬去惠州，这话是从眼前的处境里说出来的。"},{"line":"明日西风还挂席。唱我新词泪沾臆。","note":"明天你就要挂帆西去。我把新写的词唱给你听，眼泪湿透了前襟。分别在即，又各自前途难料，所以忍不住落泪。"},{"line":"竹枝词，莫徭新唱，谁谓古今隔。","note":"盼望朋友到了偏远地方，能像刘禹锡写《竹枝词》那样写出新歌，不必觉得古今相隔。这是在失意中给朋友的鼓励。"}],"moods":["送别","悲慨"],"caveat":"写作月份有七月、八月两种说法；苏坚这次的去向主要是根据词中的“澧阳”“武陵”推断的，他具体去做什么，史料记载不清楚。"},"352221":{"background":"绍圣元年，新党重新执政，苏轼一路被贬，十月初才到惠州。他挂着宁远军节度副使的空衔在这里安置，不能过问公事。到惠州大约三周后，程乡县令侯晋叔和归善县主簿谭汲陪他去城外的大云寺游玩。几个人没有摆酒宴、请歌妓，只在松树下坐着喝酒，煮了松花粉做汤，又带上苏轼刚酿好、取名“万家春”的酒。这首词就是在这次野饮时写的，记的是那天的情形。","mood":"开头两句先写这次聚会缺了什么：没有洛神那样的美人，也没有李白那样穿锦袍的名士，场面相当简朴。第三句转过来说，带一壶酒坐在草地上也有真趣。后面写松黄汤和自己酿的酒，语气里带点得意。一个刚被赶到岭南的老人，词里没有怨气，而是在简朴的场面里自得其乐，这正是他初到惠州时安顿自己的方式。不过他特意强调“亦天真”，也说明处境确实冷清。","lines":[{"line":"锦袍不见谪仙人","note":"李白曾穿着宫锦袍泛舟。苏轼不久前还是翰林学士、朝廷重臣，这句既说座中没有名流，也可以读出他对自己今昔身份的自嘲。"},{"line":"携壶藉草亦天真","note":"“亦”字带出转折：虽然没有排场，只带一壶酒坐在草地上，也有本真的快乐。这是他落难后给自己找到的立足点。"},{"line":"醉归江路野梅新","note":"喝醉后沿着江边小路回去，看见野梅刚开。岭南冬天暖，梅花开得早，给刚到这里的贬官添了一点新鲜和安慰，结尾轻快，没有悲音。"}],"moods":["旷达","闲适"],"caveat":"注释所引的本子题作“大口寺”，寺名有异文；材料里“这两年的其他事”写的是元祐八年苏轼在汴京、定州的经历，和这首词的写作没有直接关系；题中日期是农历。"},"352218":{"background":"绍圣元年，哲宗亲政，旧党失势。苏轼先被贬英州，半路上又改为惠州安置。这年秋天，他沿赣江南下岭南，船夜泊万安县造口时下起雨来。他被雨声惊醒，再也睡不着，便写了这首词，寄给弟弟苏辙和友人张庭坚（字才叔）。子由这一年也接连被贬，兄弟俩此前在汝州匆匆见过一面，之后各奔贬所。这首词是途中寄回去的一封报平安的信。","mood":"词的情绪从惊醒开始：雨打梧桐，梦断了，再也找不回来。枕席生凉，蟋蟀叫个不停，像在催人赶路。梦里却清清楚楚地回到了来时的路，还有江亭上饮酒歌舞的场面。往日的热闹和眼前孤舟夜雨放在一起，落差不言自明。结尾他没有诉苦，只托弟弟和朋友替他转告近况。年近六十，远贬岭南，前途难料，他把许多话收着不说，只留给最亲近的人去体会。","lines":[{"line":"梧桐叶上三更雨。惊破梦魂无觅处。","note":"半夜雨声把人惊醒，梦一断就再也接不上。贬途中夜不安眠、心里没有着落的状态，从开头就写出来了。"},{"line":"梦中历历来时路。犹在江亭醉歌舞。","note":"梦里回到一路走来的地方，和亲友在江亭饮酒歌舞，样样清楚。越清楚，醒来后对着夜雨孤舟就越觉冷清。"},{"line":"尊前必有问君人，为道别来心与绪。","note":"料想席间会有人问起他，就托子由和才叔代为转达别后的心情。没说好也没说坏，把牵挂和难言的处境都留给对方去体会。"}],"moods":["怀人","羁旅"],"caveat":"词中“江亭醉歌舞”指哪一次聚会，张庭坚当时身在何处，史料都不详，这里不作推定；“造口”有的版本写作“皂口”。另外，材料中“这两年的其他事”所列都是元祐八年（1093）在汴京、定州的事，和这首词没有直接关系。"},"352219":{"background":"绍圣元年，苏轼被贬往惠州，秋天经过广州。这首词写的是南方的柑橘。从“一经题品”“嚼句”这些字眼看，当时大概有人写诗称赞这种果子，也许还送了果子来，苏轼边吃边读，写词应和。不过送果、作诗的是谁，现存材料说不清楚。年谱里记的拜访何德顺一事，和这首词看不出关联。对一个刚被贬到岭南的北方人来说，这是在路上遇到的一件小乐事。","mood":"词写得轻快，带着点打趣，一路落在“喜”和“香”上，看不出贬谪路上的愁苦。苏轼一生几次被贬，每到一地都爱找当地的好吃的，用吃来安顿自己。这次被贬，他已年近六十，又是去岭南，路途很远。他却以“北客”自居，把第一次吃到南方柑橘当成新鲜事来写。这份兴致不是装出来的，靠着这点兴致，他才能面对前路。","lines":[{"line":"北客有来初未识，南金无价喜新尝。","note":"他自称从北方来的客人，从前没见过这种果子，现在头一回吃到，觉得比南方的贵重物产还珍贵。高兴里也透出自己是远道贬来的人。"},{"line":"含滋嚼句齿牙香。","note":"嘴里含着果汁，也在细读朋友的诗句，果子和诗一样满口留香。这是在困顿中找到的一点实实在在的愉快。"},{"line":"一经题品便生光。","note":"柑橘本来和山楂、梨子一样寻常，经人写诗一夸就有了光彩。他是在称赞对方的诗写得好，语气亲切。"}],"moods":["咏物","旷达"],"caveat":"这首词定在绍圣元年过广州时，主要是根据“北客初未识”等词句推断的，也有人认为可能作于惠州。题咏柑橘的诗作者、送果的人是谁，都已无从查考。"},"352220":{"background":"这首词没有小序，也没写赠给谁，题目只有“咏橘”两个字，所以看不出是为谁、在什么场合写的。现有编年把它放在绍圣元年（1094），即苏轼贬往惠州、路过广州的时候。可这一年谱里记的是他拜访道士何德顺、听讲女仙故事，跟橘子没有关系。词里写一夜霜后的橘林，又说到“吴姬”，看上去更像江南吴地的景物。究竟何时何地所写，现在没法确定，最好不要硬和贬谪路上的遭遇连在一起。","mood":"整首词只写橘子：霜后满林的新橘，篱笆茅屋间露出青青黄黄的果实，剥开时溅出香雾，入口是清凉的汁水，最后说手上的香气三天还在。语气轻快，没有愁苦，也没有牢骚。假如这首词真写在南贬途中，可以读出他在奔波里仍有兴致细尝一只橘子。但编年本身不可靠，这只能算一种读法。比较稳妥的看法是：这是一首调动视觉、嗅觉、味觉来细致描摹橘子的小词，看得出苏轼对日常滋味很敏感，也很喜爱。","lines":[{"line":"竹篱茅舍出青黄","note":"寻常人家的竹篱茅屋之间，挂满青黄相间的橘子。一个“出”字写出果实累累，是一幅平和、丰足的乡间小景。"},{"line":"香雾噀人惊半破","note":"橘皮刚剥开一半，带香的汁雾就溅到脸上，让人吓了一跳。写的是一瞬间的感觉，很生动，透着轻松的兴味。"},{"line":"吴姬三日手犹香","note":"借吴地女子剥橘后手上留香三天，夸张地写橘子的香气。也点出橘子产自吴地，收尾俏皮，余味很长。"}],"moods":["咏物","闲适"],"caveat":"此词没有小序，编年说法不一。系于绍圣元年广州缺少直接证据，从“吴姬”等字看，也可能写于苏轼在江南吴地的时期，本文不下定论。"},"352269":{"background":"绍圣元年（1094）新党重新执政，苏轼一贬再贬，十月到惠州安置。年谱把这首词系在这一年，按此推算，应是初到惠州那个冬天写的。那年冬天他还写了几首松风亭下梅花的诗。词的开头借用林逋咏梅的成句，结尾用了陆凯折梅寄友和杜甫“江东日暮云”怀李白的典故，可见是看到梅花想起了远方的人。词里没说想的是谁，史料也没有记载。有人联想到同年被贬、住在江南筠州的弟弟苏辙，这只是推测。","mood":"上片把梅花写成一个关着门过日子的女子。春风去了西邻，她照样闭门，自己开花。这很像一个刚到贬所、少与人来往的人的样子，但词里没有诉苦，只有一种清冷。下片写她肌肤如雪、脂粉还没抹匀，是不加修饰的本来面目。最后想折一枝寄给远方的人，眼前却只有江南方向的暮云，路远，寄不寄得到都难说。想念是真切的，语气却很克制。","lines":[{"line":"儿家常闭门","note":"梅花像一个常年关门的女子，春风去了邻家，她也不去凑热闹。暗合贬居的人远离喧闹、守住本色的处境。"},{"line":"折花欲寄岭头人","note":"用陆凯折梅寄友的典故。自己身在岭南，想把这枝梅寄给岭外的亲友，看到梅花，先想到的是远方的人。"},{"line":"江南日暮云","note":"化用杜甫怀念李白的“江东日暮云”。想念的人远在江南，中间隔着暮云，梅花寄不出去，只能望着云。"}],"moods":["怀人","咏物"],"caveat":"作于惠州主要依据年谱，词前没有小序可以印证，有的校注本不予编年；所怀的人是谁也没有定论。另外，所附“这两年的其他事”大多是元祐八年（1093）赴定州前后的事，不是本年。"},"352280":{"background":"绍圣元年（1094），苏轼因政局翻覆被贬，十月到惠州，寓居归善。这是他到岭南后的第一个冬天，当年十一月他还在松风亭下看梅，写了几首梅花诗，这首词大约也写于这段时间。史料里没有记载它是为谁写的、在什么场合写的。从体式看，这是一首回文词，下片把上片逐字倒过来读。它更像一个文人在闲居中做的文字游戏，而不是因为某件具体的事有感而发。","mood":"这首词的心绪比较淡，写的是月色、烟沙、清波和马上闻到的梅香，看不出明显的悲愤或感伤。刚到贬所，苏轼并没有把满腹委屈写进词里，而是用回文这种很费心思的形式去写眼前的南国梅花，让自己专注在文字和景物上。这种从容可以看作他应对困境的一种方式。不过这首词本身篇幅短、游戏性强，不宜从中读出太多深意。","lines":[{"line":"马趁香微路远，沙笼月淡烟斜。","note":"骑马走在远路上，跟着若有若无的梅香走。月色淡，烟气斜斜地罩着沙地，是一幅清冷安静的岭南冬夜行路图。"},{"line":"倒绿枝寒凤挂。","note":"\"倒挂\"\"绿毛么凤\"是岭南的一种小鸟，苏轼在惠州的另一首梅词里也写到过。用这种当地才有的鸟，点明梅花开在贬所南方。"},{"line":"远路微香趁马。","note":"这是把首句倒过来读，意思差不多，但收在\"马\"字上，像是人还在路上。在全词的游戏感之外，留下一点行旅漂泊的余味。"}],"moods":["咏物","闲适"],"caveat":"编年依据年谱定在惠州，词里写到岭南的倒挂鸟可以作旁证，但写作的具体时间、对象和场合都没有记载；所列\"这两年的其他事\"其实是元祐八年（1093）赴定州前后的事，和这首词没有直接关系。"},"352142":{"background":"绍圣元年，苏轼因“讥讪先朝”的罪名一再被贬，当年秋天到惠州。他的名义是宁远军节度副使，实际上是被安置，不能过问公事。侍妾王朝云随他南下。据年谱，绍圣二年五月四日，也就是端午前一天，他写了《殢人娇》和一首《浣溪沙》送给朝云。不过通常认为送朝云的是“轻汗微微透碧纨”那一首。这首“入袂轻风”是不是当天所写，没有确证。","mood":"上片写过节的热闹：轻风吹进衣袖，路上不起尘土，女子插着玉簪、戴着犀角饰物，在佳节里喝得尽兴，接着问这番打扮是为谁。下片转到往事和离别，酒散后的滋味像春天将尽。如果这首词真是在惠州写的，可以看出六十岁的苏轼在节日的热闹里，想到的是人生聚散难料。但这首词写的更像一般的离别之情，和他贬居惠州的处境不宜硬对在一起。","lines":[{"line":"一番红粉为谁新","note":"女子为过节重新打扮，词人却问这番心思是为了谁。热闹之中透出一点茫然，为下片写离别埋下伏笔。"},{"line":"柳丝那解系行人","note":"古人折柳送别，可柳丝留不住要走的人。这句说离别没法挽留，人的去留由不得自己。"},{"line":"酒阑滋味似残春","note":"酒席散了，心里的滋味像春天快要过去。节日的欢乐很短，剩下的是说不清的怅惘。"}],"moods":["怀人","送别"],"caveat":"年谱记五月四日有一首《浣溪沙》送朝云，但一般认为指的是“轻汗微微透碧纨”。这首“入袂轻风不破尘”的写作年份和送给谁都有疑问，词中写离别，也不太像写给一路随行的朝云。"},"352224":{"background":"绍圣元年，苏轼被一路贬到惠州，十月到达。第二年五月初四，也就是端午前一天，他写下这首小词，送给侍妾王朝云。朝云是钱塘人，十二岁进苏家。苏轼南迁时，家里几位侍妾先后离开，只有她跟着到了岭南。年谱说同一天他还写了一首《殢人娇》给她。端午是平常节日，苏轼借这个节令给身边唯一相伴的人写词，有逗她高兴的意思，也有感激。","mood":"字面上很轻快：初夏微微出汗，用兰汤沐浴，缠彩线，戴小符，写的都是节日里女子的装扮，看不出贬谪的愁苦。可这时苏轼已经六十岁，在瘴疠之地，前途难料，身边只剩朝云。这份轻快就不只是兴致，也是在困境里守着一点日常的温情。末句说要相见一千年，把心里的祝愿都放在了这里。朝云第二年七月就病逝于惠州，后人再读这句，难免心酸。","lines":[{"line":"明朝端午浴芳兰。","note":"古人端午用兰草煮水洗浴，说能祛除不祥。苏轼从节俗写起，口气很家常，像在提醒身边的人明天要过节了。"},{"line":"䌽线轻缠红玉臂，小符斜挂绿云鬟。","note":"端午臂上缠五色丝，又叫长命缕，头上斜插小符，都是驱病求平安的。写朝云的装扮，也含着盼她平安长寿的心意。"},{"line":"佳人相见一千年。","note":"由长命缕的寓意引出祝愿：盼两人长久相守。六十岁远谪岭南时说“一千年”，半是玩笑，半是真心。"}],"moods":["艳情","闲适"],"caveat":"词题本身只作“端午”，没写赠给谁。说它赠朝云、写于绍圣二年五月四日，主要依据年谱编年和词意推定。"},"351968":{"background":"绍圣元年，新党重新掌权，苏轼一再被贬，当年秋冬到达惠州，以宁远军节度副使的闲职被安置在归善。第二年他六十岁。大部分家人没有跟来，侍妾王朝云坚持随他南下，照料他的起居。据年谱，这首词是写给朝云的：词里独守深院的女子，还有那枝不和春花争艳、晚开的石榴，都可以看作他眼中的朝云。至于这首词具体在什么场合、因为什么事情写成，现有材料都没有交代。","mood":"上片写一个寂静的午后：女子独自睡着，梦被风吹竹子的声音惊醒，原来并没有人来。下片写一枝晚开的石榴，担心秋风一起就只剩绿叶，最后人和花一起落泪。全词反复落在“孤”和“独”上，写的是盼望落空、好时光留不住。放回惠州的处境里读，一个六十岁的贬官远离朝廷和亲友，不知道以后还会怎样，身边只剩很少的人。他写女子的寂寞和对年华老去的担忧，也是在写自己。对朝云一路相伴，他心里既有感激，也有怜惜。","lines":[{"line":"待浮花、浪蕊都尽，伴君幽独。","note":"春天的繁花都谢了，石榴才开，来陪伴孤独的人。说的是不跟众人争宠的品格，也像是在说愿意在冷落时留下来的那个人。"},{"line":"又恐被、秋风惊绿。","note":"刚开的花就担心秋风把它吹落，只剩绿叶。这里有对容颜老去的担忧，也让人联想到自己晚年被贬，难保还会再受打击。"},{"line":"共粉泪，两簌簌。","note":"花瓣和眼泪一起落下，人和花互相怜惜。两个处境相近的生命彼此作伴，没有别的安慰。"}],"moods":["咏物","悲慨"],"caveat":"这首词的写作年代和赠送对象都有争议。年谱定在惠州、说是赠给朝云，但旧时词话里有苏轼在杭州宴席上为官妓秀兰解围而作的说法，前人多认为这是附会；也有注本把它定在杭州任上，或认为它只是借物抒怀，并没有具体对象。"},"352179":{"background":"绍圣元年（1094）苏轼又一次被贬，十月到惠州，挂宁远军节度副使的空衔安置。惠州出产荔枝，他到这里后第一次吃到新鲜荔枝，此后写了好几首荔枝诗。这首词题作“西湖食荔支”，惠州丰湖当时也叫西湖，年谱因此把它系在绍圣二年。词里没有提到赠给谁，也没有记下是什么场合，大概是他吃荔枝时随手写成的。词从荔枝的产地和进贡往事写起，写到它的颜色、口感和香气。","mood":"词里几乎不提自己的遭遇，只是兴致很高地写一盘荔枝：这种果子从前是远道进贡、摆在宫廷金盘里的稀罕物，现在一个贬官就能随手剥开来吃。六十岁的人被贬到被视为瘴疠之地的岭南，却把心思放在眼前的鲜果上，用享受日常的小乐趣来安顿自己。语气轻快，比喻里还带点俏皮，读不出愁苦。不过他通篇只写吃，也可以看出他有意避开自己的处境。","lines":[{"line":"不贡奇葩四百年","note":"这样的珍果早已不再进贡宫廷，如今落到一个贬官手里。语气里有一点调侃，对当年为进贡而劳民伤财也不以为然。"},{"line":"轻红软白","note":"四个字写尽荔枝：外壳淡红而薄，果肉柔软洁白。写得很具体，好像荔枝刚剥开就在眼前，看得出他吃得很开心。"},{"line":"恰是当年十八娘","note":"十八娘是福建荔枝的名品，相传得名于五代闽王的一个女儿。结尾把果子比作少女，带着玩笑口吻，收得轻松。"}],"moods":["咏物","闲适"],"caveat":"年谱把这首词系于绍圣二年惠州，但词中写的是福建荔枝从海上运来，按内容看放在杭州西湖似乎也说得通，作于何时何地还有不同看法；“四百年”从哪一年算起也没有定论。"},"352244":{"background":"绍圣元年（1094）苏轼被贬，第二年住在惠州，挂着宁远军节度副使的空衔。岭南出产荔枝，这年四月正是荔枝初熟的时候，苏轼在诗里也写过自己第一次吃到荔枝时的惊喜。这首词写的是“双荔支”，也就是一根枝上并排长着两颗果子。从“华堂”“绮席歌筵”这些字眼看，他可能是在宴席上看到这种果子，随手写了这首咏物小词。具体是哪一场宴会、写给谁，史料里没有记载。","mood":"词的表面是一首轻巧的咏物词，把两颗荔枝写成一对从小相伴、形影不离的人，带点歌筵上的戏谑口吻。最后两句写它们被人掰开，盼着再成一对，调子转成了惋惜。苏轼六十岁被远贬岭南，和弟弟苏辙天各一方，家人也离散了。“分拆”和“似旧时”这样的字眼，很难说跟他当时的处境完全无关。不过这只是读者能感到的一层余味，词里并没有明说有什么寄托。","lines":[{"line":"两个心肠一片儿。","note":"两颗果子长在一起，好像两个人共用一副心肠。这里用拟人的写法，把并蒂的样子写成亲密无间，语气亲昵，又带点玩笑。"},{"line":"苦恨人人分拆破，东西。","note":"宴席上的人把这对果子摘下来掰开，一个在东一个在西。轻松的调子到这里转成怨恨，写的是被外力拆散的无奈。"},{"line":"怎得成双似旧时。","note":"结尾问怎样才能像从前一样成双，表面上是替荔枝惋惜。放在苏轼与亲人分离、远居岭南的处境里读，也有对团聚的期盼。"}],"moods":["咏物","怀人"],"caveat":"写作时间依据年谱定在绍圣二年四月，但写于什么场合、为谁而写都没有明确记载。至于词里是否寄托了兄弟或亲人离散之情，只是一种推测性的读法。"},"352288":{"background":"绍圣元年，苏轼被一贬再贬，最后安置到惠州，挂着宁远军节度副使的空衔，住在归善。家里的侍妾大多散去，只有朝云一路跟到岭南。年谱说这首词是写给朝云的。词里提到庭前红叶落尽，可知写在秋天。看内容，朝云生了几天病，一直没露面。这天她勉强起身，陪苏轼饮酒。苏轼见她消瘦，半是怜惜、半是逗她开心，写下了这首词。","mood":"整首词语气亲昵，看得出体贴，也夹着玩笑。苏轼先夸她美，又心疼她病后懒怠、话没出口先哽咽。接着拿佛经故事打趣，想让她笑一笑，可她低头不答，唱出一句带着怨意的曲子。年近六十的人，在瘴疠之地，身边只剩这一个人。他劝她趁年轻好好惜取眼前，这话背后藏着对衰老和离散的担忧。","lines":[{"line":"数日不来，落尽一庭红叶。","note":"朝云病了几天没出房门，庭院里的红叶已经落光。用景物写时间过去，也写出苏轼这几天的冷清和挂念。"},{"line":"何事散花却病，维摩无疾。","note":"朝云信佛，苏轼借维摩诘和散花天女的故事打趣：经里本是维摩称病，现在倒成了散花的人病了，维摩自己好好的。是在逗病人开心。"},{"line":"却低眉、惨然不答。","note":"玩笑没能让她笑出来，她低着头，神色黯然，什么也不说。病中的委屈，还有跟着贬官远走他乡的辛酸，都在这片沉默里。"}],"moods":["艳情","怀人"],"caveat":"说这首词是写给朝云、作于绍圣二年惠州，依据的是年谱和旧注的推定，词里没有直接点名。有的编年本把它列为未编年作品，结论应当留有余地。"},"352287":{"background":"这首词被系在绍圣三年秋，依据是这一年七月，跟随苏轼南迁惠州的侍妾王朝云病逝。九月，他写信给章楶（质夫）报丧，章楶来信慰问，他又回了信。把这首词和朝云之死联系起来，是编年者的推测。词里写一个女子忽然离世，男子对着她的画像和衣袖上残留的香气追悔不已，但没有点名，也没有交代在什么场合写成。能确定的只是，它和朝云去世在时间上对得上。","mood":"全词是悼念加上愧疚。先问她为什么像行云一样一去不回，再回想刚在一起时的欢好，接着惊叹好日子被一夜风霜打断，最后落在“算应负你”。如果确实是为朝云而写，这份愧疚就有了着落：她跟着一个六十岁的贬官远走岭南，没过上安稳日子，就病死在异乡。不过词的口气更像写一段短暂的新欢，和朝云陪伴苏轼二十多年的经历不太相合，读的时候要留几分保留。","lines":[{"line":"又岂料、正好三春桃李，一夜风霜。","note":"她正在最好的年纪，像春天盛开的桃李，却突然遭了一夜风霜。这里写的是死别来得太快、毫无防备的震惊。"},{"line":"襟袖上，犹存残黛，渐减馀香。","note":"衣襟袖口还留着她蹭上的眉黛，香气却一天天淡下去。用很小的痕迹写人走后的空，也暗示记忆终究会慢慢褪去。"},{"line":"一自醉中忘了，奈何酒后思量。","note":"想靠喝醉暂时忘掉她，酒醒以后反倒想得更厉害。说的是悲痛躲不开，借酒逃避只换来更深的思念。"}],"moods":["伤逝","怀人"],"caveat":"编年和所写对象都没有确证：系于朝云去世这一年只是推测，而“乍谐云雨”“三春桃李”写的像是一位相处不久的年轻女子，和朝云的经历不符；东坡集中这类艳情词的作者归属本来就常有争议，这首是否确为苏轼所作也难以断定。"},"352260":{"background":"这是一首在宴席上写的应酬小词。某位主人家里新买了一个十一二岁的小丫鬟，学弹琵琶，主人在席间让她出来演奏，苏轼就写词送给她。主人是谁，史料里没有记载。如果按年谱放在惠州，苏轼这时以贬官身份住在归善，正在白鹤峰盖新居，平日和当地官员、邻居往来饮酒，这首词应当是这类聚会上的即兴之作，并不是有所寄托而写。","mood":"整首词语气轻松，带着长辈的打趣。苏轼先夸孩子弹得好，又说她年纪太小，还不会把心事放进琴声里，最后笑着劝主人别着急。如果编年没错，这时他已经年过六十，被贬到岭南，身边也经历过丧亲之痛，却还能在酒席上开这样的玩笑。这和他在惠州努力过好眼前日子的态度是一致的：不在应酬场合流露苦闷。","lines":[{"line":"年纪都来十一二。","note":"“都来”的意思是“算起来不过”。一面夸她技艺出众，一面点出她年纪太小，惊讶里带着怜爱。"},{"line":"未解将心指下传。","note":"手指已经很熟练，但还不懂得借琴声传达心事。这是懂音乐的人一针见血的评点，也暗示她还不懂人情。"},{"line":"且更从容等待他。","note":"既然人已经是你家的了，就慢慢等她长大，琴艺和心思都会成熟。这是席间对主人善意的调侃。"}],"moods":["闲适"],"caveat":"这首词的编年和赠送对象都没有可靠的旁证，放在绍圣四年二月的惠州只是年谱的一种系年。而且所列“其他事”中朝云去世是在绍圣三年，同年四月苏轼又被贬往儋州，所以具体写作时间和场合都应当存疑。"},"352226":{"background":"绍圣元年苏轼被贬到惠州，侍妾王朝云一路随行。绍圣三年七月，朝云在惠州病逝，年仅三十四岁，葬在西湖边栖禅寺旁。这首词大约写在她去世后梅花开的时候。苏轼表面上写岭南的梅花，实际是写朝云：惠州瘴气重，地方偏远，她却陪他在这里住了两年。宋人笔记《冷斋夜话》等都说这首词是为朝云写的，后来的人大多相信这个说法。","mood":"这首词表面写梅，底下是丧亡的悲痛。上片写梅花不怕瘴气，暗指朝云愿意跟他到偏远的地方，话里有敬重，也有感激。下片写她不施脂粉的本来样子，直到结尾才说出人已不在。苏轼这时六十一岁，远贬岭南，回北方的希望很渺茫，最亲近的人又死了。他没有直接哭诉，而是把哀思放进梅花清冷的样子里，写得很克制，但很深。","lines":[{"line":"玉骨那愁瘴雾","note":"梅花不怕岭南的瘴气，也是说朝云不嫌惠州偏远湿热，甘愿跟着他吃苦。苏轼对她的感激和敬重，都在这一句里。"},{"line":"素面常嫌粉涴","note":"写梅花天生洁白，不需要脂粉，借指朝云朴素自然，不爱浮华。这是苏轼记忆里她平日的样子。"},{"line":"高情已逐晓云空","note":"这是全词的转折。“晓云”和“朝云”意思相近，暗含她的名字。美好的情意随着早晨的云散去了，人也再见不到了。"}],"moods":["伤逝","咏物"],"caveat":"说这首词悼念朝云，依据的是宋人笔记，多数学者接受，但也有人认为只是单纯咏岭南梅花。具体写在朝云死后的哪个月份，也无法确定。"},"352072":{"background":"按年谱，这首词作于绍圣四年（1097）中秋，苏轼刚到海南儋州一个多月。这年春天，他从惠州再贬琼州别驾、昌化军安置。南下途中，他在藤州遇上同样被贬的弟弟苏辙，两人结伴走到雷州。六月在海边分手后，苏轼渡海南去，苏辙留在雷州。此后兄弟二人再没见过面。中秋夜，苏轼隔着海峡想念弟弟，写下了这首词。","mood":"上片是一种疲惫的看破：回头看世事，像是做了一场梦；秋风吹响了廊下的落叶，再照照镜子，眉头鬓角都老了。他这年六十二岁，被放逐到海岛，前一年又失去了朝云，身边只有幼子苏过。下片写眼前的冷清：有酒却没有客人，有月亮却总被云遮住。到了团圆的节日，只能端着酒杯朝北望。全词情绪低沉，很少见到他平时那种自我宽解。","lines":[{"line":"世事一场大梦，人生几度秋凉。","note":"一生的起落到老来回看，像是一场梦。年过六十，还能再过几个秋天？话说得平淡，分量却很重。"},{"line":"酒贱常愁客少，月明多被云妨。","note":"酒不缺，缺的是能一起喝的人；月亮虽亮，却常被云遮住。有人读出政治上的寓意，但首先写的是眼前实景和孤单。"},{"line":"把盏凄然北望。","note":"举杯朝北望去，北边隔海是雷州的子由，再往北是回不去的中原。“凄然”二字，他直接说了出来。"}],"moods":["怀人","悲慨"],"caveat":"编年有争议：通行本题作“黄州中秋”，不少选本（包括所附赏析）据此系于元丰三年（1080）前后的黄州时期。本文依年谱，系于绍圣四年儋州、怀念苏辙。另外，“秋凉”一作“新凉”。"},"352250":{"background":"这首词的具体写作缘由已经查不到。词里没有人名、地名，也没有写给谁，只写一个春天贪睡的少女，属于宋人在宴席上交给歌女演唱的那类闺情小词。年谱在绍圣四年（1097）记了苏轼作《浣溪沙》，那时他六十出头，贬居惠州，前一年夏天朝云刚刚病逝。但年谱没有说明就是这一首，词里也看不出惠州的痕迹，难以据此断定。","mood":"词的情绪很轻。作者像一个含笑的旁观者，故意问少女早上起来发髻为什么歪了，又替她找了个理由，说是清明前天气让人犯困。词里没有对自己命运的感叹，也看不到贬谪的影子。如果它真写于惠州、朝云去世之后，这份轻快就和处境反差很大，但这只是推测。更稳妥的读法是把它当作给歌女演唱而写的词，看苏轼写少男少女情态时的幽默和分寸。","lines":[{"line":"朝来何事绿鬟倾。","note":"作者明知故问：早上起来头发都睡歪了，是怎么回事？只问不答，少女的心事留给读者去猜，语气里带着笑意。"},{"line":"䌽索身轻长趁燕，红窗睡重不闻莺。","note":"白天荡秋千，身子轻得像在追燕子；早上却睡得很沉，窗外黄莺叫也听不见。一动一静，写出她贪玩又贪睡的孩子气。"},{"line":"困人天气近清明。","note":"最后一句替她开脱：快到清明了，天气本来就让人犯困。可能有的春情被轻轻带过，结尾含蓄又有趣。"}],"moods":["艳情"],"caveat":"年谱只记这一年苏轼作过《浣溪沙》，未必就是这首。不少编年本没有给此词系年，作于惠州的说法证据不足。另外，首句有的版本作“道字娇讹苦未成”。"},"352251":{"background":"年谱这一年只记“苏轼赋《浣溪沙》”，没有说是哪一首，也没有交代为谁而写、在什么场合。所以无法确定就是这首“春情”。单从词面看，是一次春日出游：车停在开满桃李的溪边，在鹧鸪啼声中喝酒，身边有女子相伴，一直待到日落月出、该回去的时候。具体是哪一次宴游、同行的是谁，现有材料都说不清，这里不作推测。","mood":"词里有春游的欢快，但很快被“近黄昏”带出一层好景不长的感觉，到结尾变成舍不得离开的惆怅。如果确实写在晚年贬居岭南的时候，这种对美好时光留不住的敏感，和一个六十岁左右、远谪南方、前途难料的人的心境是合得上的；但这层联系只能当作一种可能的读法，不能当成定论。","lines":[{"line":"夕阳虽好近黄昏","note":"化用李商隐“夕阳无限好，只是近黄昏”。眼前的欢聚正好，却已经感到它快要结束，喜悦里掺着不安。"},{"line":"水连芳草月连云","note":"天色由黄昏转入夜晚，溪水接着青草，月亮接着云层，景色绵延不断，留恋的心情也跟着延续下去。"},{"line":"几时归去不销魂","note":"不管什么时候动身回去，都免不了黯然神伤。说的是离别难受，也说明这一天的欢乐让人难以割舍。"}],"moods":["怀人","感时"],"caveat":"这首词编年有疑问。年谱只记这一年写了《浣溪沙》，没说是哪一首，各家校注对这首“春情”的写作年代、是否苏轼所作也有不同意见。另外，所附“其他事”里朝云去世、方子容到任惠州等事，通常系于绍圣三年（1096）；绍圣四年四月苏轼已被贬往儋州，所以“1097年在惠州”这一编年也需要谨慎看待。"},"352270":{"background":"绍圣四年（1097）四月，苏轼在惠州接到新的贬令，以琼州别驾的身份到昌化军安置，七月渡海到了儋州，治所在宜伦。家眷留在惠州，只有幼子苏过跟着他。前一年七月，侍妾朝云在惠州病逝。这首词既没写给谁，也没写哪件具体的事，只写一个秋夜睡不着、一直熬到天亮的经过。如果编年可信，这应当是他在海南过的第一个秋天。","mood":"整首词没有一句直接说愁，只写人怎样熬过一夜：听漏声，觉得枕头发凉，看窗纸一点点变白，听鸡叫个不停。睡不着的原因，词里没有交代。放到他当时的处境里看，六十多岁被贬到海岛，前一年刚失去朝云，家人又分在两地，这份清醒和孤单就容易理解了。苏轼惯常用来自我开解的豁达话，这里一句都没有，留下的只是长夜和耳边不断的声音。","lines":[{"line":"长漏伴人无寐。","note":"漏是计时的漏壶，整夜滴个不停，陪着他的只有这一点声音。一个“伴”字，反倒写出身边没有别人。"},{"line":"低玉枕凉轻绣被。","note":"枕头发凉，被子显得单薄。这是秋夜身体上的感觉，也透出无人相伴的冷清。"},{"line":"已明声未已。","note":"天已经亮了，鸡还在叫。一夜终于熬过去，心里的事却没有随着天亮了结。"}],"moods":["羁旅","伤逝"],"caveat":"词里没有地名和具体事件，编在绍圣四年的儋州只是一种推测。这首词是否出自苏轼之手，也有本子列为存疑。“伤逝”是结合朝云去世作的推断，词中并没有明说。"},"352271":{"background":"绍圣四年（1097）春，苏轼在惠州刚盖好白鹤峰新居，又被贬为琼州别驾、昌化军安置。他只带幼子苏过渡海，七月到了儋州。这首词作于初到儋州的秋天。词里没有写给谁，也没有记某件事或某个场合，看来是秋天早晨独自看景、随手写下的自我排遣。年谱只记录了作词这件事，具体的起因没有留下记载。","mood":"上片写秋晨的风、带霜的树叶和受惊的鸦鹊，景色清冷，但叶子还没有枯，也没有被吹落，透出几分不甘凋零的意思。下片转向自己：笑自己把名声看得淡，和世人疏远，只剩一颗懒心、一双懒脚，正好安放在闲处。年过六十，又被贬到天涯海角，他没有直说怨恨，而是把被弃置说成自己本来就懒、本来就适合闲着。这份闲适里带着自嘲，也有无可奈何。","lines":[{"line":"霜叶未衰吹未落","note":"经霜的叶子还没枯，风也没把它吹落。借景写自己：年老又遭远贬，却还没被打垮。"},{"line":"自笑浮名情薄","note":"笑自己把虚名看得淡。半是真心看开，半是自我宽解：名声已经给他招来太多祸患。"},{"line":"一片懒心双懒脚。好教闲处著","note":"心懒脚也懒，正适合放在闲处。被朝廷闲置到海南，他偏说是自己本来就该闲着，话说得轻松，底下有苦涩。"}],"moods":["自嘲","闲适"],"caveat":"这里按年谱把这首词定在儋州。不过霜叶、池阁这些景物和海南的气候风土不太相合，这首词的作年、作地以及是否确为苏轼所作，学界都有不同看法，目前还难以确定。"},"352272":{"background":"绍圣四年（1097），六十二岁的苏轼从惠州再次被贬，任琼州别驾，安置在儋州。按年谱系年，这首词作于他在海南的第一个秋天。这一年夏天渡海之前，他在雷州和弟弟苏辙分别；前一年，侍妾朝云已病死在惠州。词没有题赠对象，也看不出具体事由，更像是他在秋雨夜里独自坐着、听着潮声写下的自言自语。","mood":"一场夜雨冲走了残留的暑气，季节一换，时间流逝就格外分明，人却被困在海角动弹不得。“何处去”问的不只是明天去哪，也是他对自己前途做不了主的茫然。有酒却没心思喝，又问明年今夜能不能月圆，透出想和亲人团聚、却不敢指望的心情。最后酒醒独语，身边没有能说话的人。这和他晚年远谪、亲人离散、北归无望的处境吻合。他常有的自我宽解，在这首词里几乎没有出现。","lines":[{"line":"明朝何处去。","note":"听着潮水来去，想到自己是被流放的人，去留全由朝廷决定，连明天的落脚处都说不准。"},{"line":"来岁今宵圆否。","note":"今夜下雨看不到月亮，于是问明年此夜能否月圆，暗里盼望团聚，又没有把握。"},{"line":"夜阑还独语。","note":"酒醒梦断，夜已很深，身边没有人可以说话，只能自言自语，孤独写得很直白。"}],"moods":["羁旅","怀人"],"caveat":"词中没有地名、人名可以确证写作时间，系于儋州是依据年谱，别的编年本可能有不同说法；词题也有“秋感”“秋愁”两种。"},"352228":{"background":"绍圣四年（1097）苏轼六十多岁时被贬，渡海到儋州安置。到词题中“己卯”年的立春，他已在岛上住了一年多。其间官府收回了他借住的官舍，他只好在城南自己搭茅屋，和儿子苏过住在一起，缺吃少药。这首词题为“春词”，写的是儋州立春日迎春的风俗：土牛、春杖、彩幡、剪胜。它不是为某个人写的，而是他看着岛上百姓过节，随手记下的节令词。","mood":"词里几乎不见愁苦，写的都是春风、桃花和酒意。苏轼并非不清楚自己的处境：当时人把海南看作天涯绝地，他自己也已经打算老死岛上。所以“不似天涯”四个字才有分量。他是在节日里主动把这里当成能过日子的地方，和当地人一起迎春喝酒，借眼前的热闹冲淡流放者的孤独。这份轻快的底子，是一位老人对命运的接受。","lines":[{"line":"无限春风来海上","note":"大海原本把他和中原隔开，这里却成了春风吹来的地方。眼界一下子开阔了，也能看出他看待这片海的心态变了。"},{"line":"一阵春风吹酒醒","note":"迎春宴上喝到微醺，被风吹醒。字面上是节日的痛快，酒醒那一刻或许也隐约想到了自己身在何处。"},{"line":"不似天涯","note":"南方早春，杨花被风卷起，像北方的雪，让他恍惚觉得回到了中原。明知身在天涯，偏说不像天涯，这是他给自己的宽解。"}],"moods":["旷达"],"caveat":"词题“己卯”指元符二年（1099），所给编年却写作元符元年（1098），所列同期事件又多是绍圣四年（1097）南迁渡海的事，三者对不上。一般依据词题，把这首词系于1099年立春。"},"352229":{"background":"这是苏轼贬居儋州的第三年。侄孙苏元老在京城，托往来海南的赵梦得（也有说是赵的儿子）捎信过海，同时带来了秦观的《千秋岁》和孔平仲的和作。秦观原词写于贬谪途中，满纸伤春和失意。此时秦观本人已被编管雷州，和苏轼只隔一道海峡。苏轼读后按原韵写了这首，既是回应门生，也借此表明自己的态度。","mood":"秦观的原作一路低沉。苏轼和词的前半也有泪、有心碎，坦白承认被抛到天涯的痛苦和对朝廷的牵挂。后半却一句比一句硬：罪名可以认，臣子的节操还在，平生所学不改，最后借孔子“乘桴浮于海”收尾。他已年过六十，困在海岛，北归无望。这首词不是在劝秦观看开，而是说明自己不会为了求宽恕而改变立场。","lines":[{"line":"罪大天能盖","note":"字面上是认罪，说罪再大，天也能包容。语气里带着自嘲和反讽，也藏着一点盼望宽赦的心思，但并不低声下气。"},{"line":"旧学终难改","note":"就算还能盼来新的恩典，自己一生的学问和政治主张也改不了。这是对贬谪处境最直接的回答。"},{"line":"乘桴且恁浮于海","note":"化用《论语》中孔子“道不行，乘桴浮于海”。主张既然行不通，那就在海上漂着吧，有无奈，更有自我坚守。"}],"moods":["悲慨","旷达"],"caveat":"多数研究将此词定于元符二年作于儋州，也有学者认为作于元符三年北归途中与秦观在海康相见时；秦观原词的写作地点也有处州、衡州等不同说法。"},"352327":{"background":"这首词的写作缘由没有可靠记载。年谱把它系在元符二年（1099）春，当时苏轼贬居儋州，挂着琼州别驾的空衔。词里看不出是写给谁的，也没有记下具体的场合或事情。上片写的是汴京清明前后的景象：禁苑池边长满芳草，御道上车马和灯火连成一片，游春的女子衣饰华美。下片转到眼前的“今困天涯”。系年大概就是根据这种今昔对照推出来的。","mood":"上片的热闹全是回忆，下片一句“今困天涯”就把人拉回海南。他想起的京城旧日，并不只是游春，也连着自己在朝廷的那段经历。如今京城对他来说就像蓬莱仙山，望不见，也回不去。全词没有激烈的怨愤，更多是一种怅惘：旧梦一夜就过去了，醒来已是天亮。这和他晚年远在海外、北归无望的处境是相合的。","lines":[{"line":"今困天涯，何限旧情相恼。","note":"全词从这里由回忆转到现实。“困”字写出被困在海角的处境，过去越美好，现在想起来越让人烦乱。"},{"line":"任刘郎、目断蓬山难到。","note":"借刘郎和蓬山的典故，把京城比作到不了的仙境。“任”字带着几分无可奈何，只能任由自己望穿也到不了。"},{"line":"良宵又过了。楼台万家清晓。","note":"一夜的梦和回想结束，天亮后眼前是万家楼台。语气平淡，失落却留在里面，没有说破。"}],"moods":["感时","羁旅"],"caveat":"这首词是不是苏轼所作，历来有人怀疑，有些苏词校注本把它列为存疑或互见之作；系于儋州元符二年，看来是根据“今困天涯”等词句推定的，没有直接证据；首句缺了一个字，原文无法确定。"},"352230":{"background":"这是一首在酒席上写的劝酒词。词题说明了场合：苏轼拿一只大琉璃杯，劝一位叫王仲翁的老人喝酒。王仲翁是谁，现在已经很难考清。词中称他“绛州王老”，可见他祖籍在今山西一带，年纪很大，可能是流寓海南、和苏轼有往来的长者。苏轼当时贬居儋州，身份是琼州别驾。这年四月，昌化军使张中因为照顾他被贬到雷州，朝中对他的监视并没有放松。这首词并不针对时事，只是一次小聚时随口写来，为老人添些兴致。","mood":"全词语气轻快，带着玩笑。前半夸杯子，说它是从昆仑山上讨来的仙家器物，故意说得很夸张；后半夸人，说老人百岁仍然硬朗，张口就把一大杯酒灌了下去。苏轼这时六十五岁，身在海岛，熟人刚因他受了牵连，前途也看不清。他却能拿一只杯子、一位老人逗乐，把穷困的日子过出几分热闹。这份轻松不是没心没肺，是他多年贬谪下来练成的处世办法：眼前能得一乐，就先乐一乐。","lines":[{"line":"乞得山头玉女盆。","note":"说杯子是从仙山讨来的玉女盆，夸张到近乎胡扯。劝酒时这样说，是先把器物捧高，给酒席添些趣味。"},{"line":"绛州王老，百岁痴顽推不倒。","note":"“痴顽”是亲昵的调侃，说老人憨实倔强，年纪再大也推不倒。这是祝寿式的夸赞，也透着苏轼对老年硬朗的羡慕。"},{"line":"一派黄流已电奔。","note":"“黄流”指酒。话音还没落，老人已经一口喝干，场面很热闹。苏轼在这里享受的是眼前和人同乐的痛快。"}],"moods":["旷达","豪放"],"caveat":"王仲翁的身份不详。所给年谱没有直接记载这首词，系在元符三年四月是按儋州时期推定的，具体年月还有不同意见。"},"352231":{"background":"元符三年（1100），宋徽宗即位，苏轼遇赦离开海南北归，途中经过韶州曲江。当地人陈缜（字公密）招待了他：苏轼给陈家祖辈隐居先生留下的文字写了跋，给陈缜儿子的石砚写了铭，又到陈家喝酒。席上，陈缜让侍女素娘唱《紫玉箫》曲，并向他劝酒。苏轼把酒喝完，当场写了这首词答谢。题目已经把场合交代清楚：这是宴席上的即兴应酬之作，写给主人和歌女。","mood":"词的大部分篇幅在夸素娘的容貌和歌舞，属于宴席上常见的艳词，语气轻松，带点玩笑。值得注意的是题目里他自称“老人”，结尾又想到酒醒以后各奔东西。这时他刚在岭南、海南贬居多年后活着回来，年老体衰，前路也说不准。热闹的筵席和明天的分别放在一起，透出一点聚散无常的怅惘。不过不宜读得太重，它首先是一首应景的轻快小词。","lines":[{"line":"扬州十里最妖饶。","note":"化用杜牧“春风十里扬州路”，把素娘说成繁华扬州最出众的美人。这是酒席上对歌女的恭维，语气轻快。"},{"line":"刘郎几度欲魂消。","note":"苏轼以“刘郎”自比风流客，半开玩笑地说自己被歌舞打动。若这里暗用刘禹锡被贬多年后归来的典故，就恰好与他自己的处境相合。"},{"line":"明朝酒醒知何处，肠断云间紫玉箫。","note":"转到席散以后：明天酒醒，自己又要上路，今夜的箫声只能在远处回想。轻快的词到这里收在一点离愁上。"}],"moods":["艳情","羁旅"],"caveat":"年谱把此词系于元符三年北归经过韶州时，具体月日不明；“刘郎”指天台遇仙的刘晨还是刘禹锡，理解不一。"}},"poets":[{"slug":"sushi","name":"苏轼","hao":"东坡","born":1036,"died":1101}]};

  const ps=yp(y);
  if(ps&&ps.length){const p=ps[Math.min(S.idx,ps.length-1)];return{n:p.sn||p.pl,xy:prj(p.lat,p.lng)}}

$('btnAll').onclick=()=>{S.follow=false;$('btnFollow').setAttribute('aria-pressed','false');viewAll()};

// pan / zoom
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function manual(){if(S.follow){S.follow=false;$('btnFollow').setAttribute('aria-pressed','false')}}
let drag=null;const pts=new Map();
svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,svgPt(e));if(pts.size===1){drag={p:svgPt(e),x:S.cam.x,y:S.cam.y,moved:false}}svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);const now=svgPt(e);
  if(pts.size===2){const [a,b]=[...pts.values()];const other=a===prev?b:a;
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y),d1=Math.hypot(now.x-other.x,now.y-other.y);
    if(d0>0)zoomAt((now.x+other.x)/2,(now.y+other.y)/2,d1/d0);pts.set(e.pointerId,now);return}
  if(!drag)return;const dx=now.x-drag.p.x,dy=now.y-drag.p.y;
  if(!drag.moved&&Math.hypot(dx,dy)<4)return;drag.moved=true;manual();$('map').classList.add('dragging');
  S.cam.x=drag.x+dx;S.cam.y=drag.y+dy;applyCam(true)});
function endPt(e){const d=drag;pts.delete(e.pointerId);if(pts.size===0){drag=null;$('map').classList.remove('dragging');
  // 没有拖动的一次点按：看手指/鼠标下面是不是一个地点（指针捕获会让 click 落到整张图上，所以这里自己找）
  if(e.type==='pointerup'&&d&&!d.moved){const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest&&el.closest('.pl,.stp');if(g&&g.dataset.n)openPlace(g.dataset.n)}}}
svg.addEventListener('pointerup',endPt);svg.addEventListener('pointercancel',endPt);
function zoomAt(x,y,f){manual();const s=Math.max(.8,Math.min(14,S.cam.s*f));const k=s/S.cam.s;S.cam.x=x-(x-S.cam.x)*k;S.cam.y=y-(y-S.cam.y)*k;S.cam.s=s;applyCam(true)}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(e);const k=e.ctrlKey?.012:(e.deltaMode===1?.12:.0035);zoomAt(p.x,p.y,Math.exp(-Math.max(-120,Math.min(120,e.deltaY))*k))},{passive:false});

document.addEventListener('wheel',e=>{const el=e.target.closest&&e.target.closest('.poem');if(!el||el.classList.contains('horiz'))return;if(el.scrollWidth<=el.clientWidth+1)return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft-=e.deltaY;e.preventDefault()}},{passive:false});
window.addEventListener('resize',()=>{if(S.view==='read')fitPoem()});
// ---------- 开场 ----------
// 第一次打开：一条线从眉州慢慢画到常州，沿途依次亮出几个地方；画完停一会儿，自动进入全局。看过一次以后直接进全局，可以在全局底部"重看开场"。
function smoothSegs(pts){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    out.push(`M${p1[0].toFixed(1)},${p1[1].toFixed(1)}C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`)}return out}
let openTimers=[];
function endOpening(){if(!$('app').classList.contains('opening'))return;openTimers.forEach(clearTimeout);openTimers=[];
  try{localStorage.setItem('opening_seen','1')}catch(e){}
  $('app').classList.remove('opening');$('openPane').classList.remove('show');goOverview()}
function playOpening(){
  // 开场：一段一段地画，每到一个关键地点停下来，右边写一句那时的人生；最后一站是落幕。
  const want=META.opening_places||[];
  const rs=want.map(w=>{const [n,yy,note]=Array.isArray(w)?w:[w,Y0,''];const i=DATA.stops.findIndex(s=>s.n===n&&s.y>=yy);return i<0?null:{...DATA.stops[i],fi:i,note}}).filter(Boolean).sort((a,b)=>a.fi-b.fi);
  if(rs.length<2){endOpening();return}
  $('app').classList.add('opening');S.picked=false;S.mode='year';viewAll();sizeMarks();
  $('openPane').innerHTML=`<p class="on-name">${esc(META.name)}</p><p class="on-yrs">${Y0}–${Y1}　${esc(META.hao?'号'+META.hao:'')}</p><p class="on-intro">${esc(META.intro||'')}</p><button class="on-skip" id="skipOpen">跳过，直接看全图 ›</button>`;
  requestAnimationFrame(()=>$('openPane').classList.add('show'));$('skipOpen').onclick=endOpening;
  const r=svg.getBoundingClientRect();const k=Math.max(r.width/W,r.height/H)||1;const u=1/(S.cam.s*k);
  const g=$('openLabels');g.innerHTML='';
  const segs=smoothSegs(rs.map(s=>s.xy));
  // 线宽按地图坐标给（不用 non-scaling-stroke），虚线动画的长度才和路径长度一致，不会出现多余的线段
  g.insertAdjacentHTML('afterbegin',segs.map((d,i)=>`<path class="oseg" data-s="${i}" d="${d}" stroke-width="${2.4*u}"/>`).join(''));
  rs.forEach((s,i)=>g.insertAdjacentHTML('beforeend',`<circle cx="${s.xy[0]}" cy="${s.xy[1]}" r="${4.2*u}" data-i="${i}"/><text x="${s.xy[0]+7*u}" y="${s.xy[1]+5*u}" font-size="${15*u}" data-i="${i}">${esc(s.lab)}<tspan font-size="${11*u}" dx="${4*u}">${s.y}</tspan></text>`));
  g.querySelectorAll('.oseg').forEach(p=>{const L=p.getTotalLength()+1;p.style.strokeDasharray=`${L} ${L}`;p.style.strokeDashoffset=L});
  // 到站时，在地图上这个点旁边浮出一张小卡：地名、年份岁数、一句人生。卡片放在点的右侧，放不下就放左侧，上下夹在地图范围内
  const now=$('ocap'),mapEl=$('map');
  const arrive=i=>{g.querySelectorAll(`[data-i="${i}"]`).forEach(x=>x.classList.add('on'));const s=rs[i];
    now.classList.remove('in');
    now.innerHTML=`<p class="on-place">${esc(s.lab)}<span>${s.y}　${cn(s.y-AGE0)}岁</span></p><p class="on-note">${esc(s.note||'')}</p>`;
    const c=g.querySelector(`circle[data-i="${i}"]`).getBoundingClientRect(),m=mapEl.getBoundingClientRect();
    const cx=c.x+c.width/2-m.x,cy=c.y+c.height/2-m.y,w=now.offsetWidth,h=now.offsetHeight;
    let x=cx+26;if(x+w>m.width-12)x=cx-26-w;x=Math.max(12,Math.min(m.width-w-12,x));
    const y=Math.max(90,Math.min(m.height-h-16,cy+18));
    now.style.left=x+'px';now.style.top=y+'px';void now.offsetWidth;now.classList.add('in')};
  const DRAW=1500,HOLD=2800;let tt=1600;
  openTimers.push(setTimeout(()=>arrive(0),900));
  for(let i=0;i<segs.length;i++){const p=g.querySelector(`.oseg[data-s="${i}"]`);
    tt+=HOLD-1200;const t0=tt;openTimers.push(setTimeout(()=>{p.style.transition=`stroke-dashoffset ${DRAW}ms ease-in-out`;p.style.strokeDashoffset=0},t0));
    tt+=DRAW;const t1=tt;openTimers.push(setTimeout(()=>arrive(i+1),t1))}
  openTimers.push(setTimeout(endOpening,tt+HOLD+1600));
}
$('map').addEventListener('click',()=>{if($('app').classList.contains('opening'))endOpening()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('app').classList.contains('opening'))endOpening()});

// start：先决定要不要放开场，再画第一帧，免得全局的路线先闪一下
S.year=Y0;
let seen=false;try{seen=localStorage.getItem('opening_seen')==='1'}catch(e){}
const doOpen=!seen&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(doOpen)$('app').classList.add('opening');
viewAll();
render({move:false});
if(doOpen)playOpening();
</script>
</body>
</html>
