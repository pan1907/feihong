:"元丰三年起，苏轼因乌台诗案贬居黄州，任团练副使，不能参与公事。当时的黄州知州徐大受，字君猷，没有把他当罪臣看，经常请他喝酒同游。宴席上主人让家里的侍女出来唱歌跳舞、劝酒，再请客人为她们写词，这是当时士大夫常有的做法。这首词就是在这样的场合，写给徐家一位叫懿懿的侍女。苏轼还给徐家的胜之等人写过词。","mood":"这首词里没有贬谪的愁苦，只是轻松地写一个女子的性情、名字、歌舞和打扮，带着宴席上说笑的气氛。这种轻松本身就值得留意：苏轼刚到黄州时处处小心，连给老朋友写信都很谨慎，是徐君猷的善待让他能在酒席上暂时放松下来。给主人的侍女写词，一半是应酬，一半是回应这份照顾，谈不上深情，但能看出他又开始和人来往了。","lines":[{"line":"雅称佳名呼懿懿。","note":"说她叫懿懿，名字和她温和的性子正好相配。“懿”是美好的意思，叠着叫出来，带着酒席上的亲近和玩笑。"},{"line":"淡淡梳妆新绾髻。","note":"妆化得淡，发髻是新挽的。“新绾髻”可能暗示她刚到能梳髻的年纪，还是个少女。苏轼观察得细，下笔却很节制。"},{"line":"春著花枝百态生。","note":"把她比作春天里的花枝，举手投足都有各样姿态。结尾落在一片春意上，是宴席上轻快的赞美。"}],"moods":["艳情","闲适"],"caveat":"年谱把这首词系在元丰四年，但各家编年不完全一致；词中的懿懿是不是年谱提到的阎姬，目前不能确定；题中“君猷”在有的本子里写作“君献”。"},"352111":{"background":"苏轼因乌台诗案贬到黄州，任团练副使。黄州知州徐君猷（名大受）对他很照顾，两人常在一起宴饮。这首词写给徐家侍妾胜之。题中说她聪慧美丽，还自称出身名门。苏轼把建溪名茶、双井茶和庐山谷帘泉水送给她，附上这首词。词借夸茶的产地和来历，跟她自称的高贵出身开了个玩笑。","mood":"整首词轻松俏皮，是饭局和朋友之间的应酬玩笑，没有寄托什么身世感慨。苏轼当时是戴罪之身，处境拮据，好在地方长官待他宽厚，他也愿意在这样的交往里找些乐趣。他以名茶比美人，借茶的“出身”逗胜之，能看出他初到黄州后心情渐渐放松，还有兴致讲究品茶的雅趣。","lines":[{"line":"苗裔来从北苑","note":"表面上说这茶是北苑贡茶一脉的后代，其实是回应胜之自称出身贵族，语带双关，是善意的玩笑。"},{"line":"人间谁敢更争妍","note":"夸茶汤色白、乳花圆润，世上没有东西比得上它的美，为下一句把茶和美人相比做铺垫。"},{"line":"斗取红窗粉面","note":"“斗取”就是“对着”。说只有窗前这张美丽的脸能和茶比个高下，最后点明这是写给胜之的。"}],"moods":["咏物","闲适"],"caveat":"年谱把这首词系在元丰四年，也有人认为写在元丰五年前后，没有定论；各本题目和字句也有出入，有的只题作“茶词”。另外，双井茶产自洪州，而题中写作“建溪双井”，具体怎么理解还有不同看法。"},"352112":{"background":"元丰三年初，苏轼因乌台诗案贬到黄州，任团练副使，只是个闲职。当时的黄州知州徐大受（字君猷）并不因为他是罪臣而疏远他，常请他饮酒游宴，两人往来很密。徐家养着几位侍妓，苏轼在席间给她们写过好几首词。这一首送给其中一位吹笙的女子，大约写在一次夜宴散场以后，属于宾主应酬、即席助兴的作品。","mood":"上片写宴席上的情景：女子吹笙，乐声清亮，人就在眼前，场面热闹，他也听得专注。下片转到深夜酒醒，人已散去，只觉得身上的衣袍发凉，他还去找她留下的胭脂痕迹。散席后的冷清是这类应酬词常用的写法，不一定每句都有深意。不过苏轼刚到贬所，身边知心的人很少，一边受主人厚待，一边在散场后独自冷清，这两样确实都是他当时的生活。","lines":[{"line":"朱唇渐煖参差竹。","note":"笙管长短不一，吹的时间久了，竹管被嘴唇焐暖了。可见他看得仔细，这支曲子吹了很久，他也一直在听。"},{"line":"惟觉霜袍冷，不见敛眉人。","note":"酒醒后只觉得白袍发凉，刚才低着眉吹笙的人已经不在了。冷既是夜里的寒气，也是曲终人散后的空落。"},{"line":"胭脂觅旧痕。","note":"他还去找她留下的胭脂印，大概在笙嘴或酒杯上。全词用这个小动作收尾，有留恋，但没有说出来。"}],"moods":["艳情"],"caveat":"年谱把这首词系于元丰四年，但具体日期不清楚；年谱提到苏轼题赠过徐家侍人阎姬，词中这位吹笙的女子是不是阎姬，现有材料无法确定。"},"352227":{"background":"年谱只记元丰四年（1081）苏轼在黄州作此词，没有写为谁而作、在什么场合，这里不作猜测。苏轼因乌台诗案贬到黄州，任团练副使这个闲职。从词本身看，起因像是听人弹琵琶：先感叹盛唐琵琶名手贺怀智那样的人已经没有了，曲调一变再变；再说一个年纪很小、懂音律的女孩，盼她能弹出旧时的雄浑声调。弹琵琶的人是谁，现存材料没有交代。","mood":"这首词主要是在惋惜：老调被新声挤掉，听的人只爱繁复花巧的指法，不懂真正的好音乐。苏轼刚从诗案里脱身，贬居黄州，自己也像过时的旧声，无人理会。词里借开元遗老落泪，写的是对一个逝去时代的怀念，也有知音难找的寂寞。不过词中是否暗指新法取代旧制，只能说有这种可能，不宜说死。","lines":[{"line":"新声坐使旧声阑。","note":"新流行的曲调一来，旧的雅正之声就冷落下去了。语气平静，背后是对风气变化的无奈。"},{"line":"俗耳只知繁手、不须弹。","note":"一般听众只爱繁复炫技的指法，那样的曲子不弹也罢。话说得很冲，透出不愿迎合流俗的脾气。"},{"line":"应有开元遗老、泪纵横。","note":"如果真能弹出旧日雄浑的声音，经历过盛世的老人听了一定会落泪。怀旧当中带着深沉的伤感。"}],"moods":["感时","悲慨"],"caveat":"此词编年各家不尽一致，年谱系于元丰四年黄州，但没有写明创作场合和听琴对象。词中'七岁文姬'用蔡文姬幼年辨识断弦的典故，史书记作六岁，苏轼可能是随手借用；以新声暗指新法的说法属于推测。"},"352162":{"background":"这是一首和作。友人章质夫写了一首咏杨花的《水龙吟》，当时很受称道。苏轼在给他的信里说，原作太好，本不敢接着写；但想到章质夫正赶在柳絮纷飞的时节外出巡视公务，家中的人只能关起门来发愁，于是替她们写出这份心思，依原韵和了一首寄去，并叮嘱不要拿给别人看。此时他因乌台诗案贬居黄州，下笔格外小心。","mood":"表面上，这首词替闺中人写离愁。杨花离开枝头四处飘荡，就像有人在梦里追寻远行的人，却又被惊醒；最后杨花落进水里、混进尘土，都化成了眼泪。苏轼这时到黄州才一年多，自己也远离故土，处境冷落。“抛家傍路”“无人惜”这些话，读来未必只是在说杨花，但他没有明说，把自身的落寞藏在替别人诉说的离情里。这和他贬官后谨慎、不愿把作品示人的心态是一致的。","lines":[{"line":"也无人惜从教坠。","note":"杨花算不上正经的花，落下来也没人心疼，只能任它飘坠。这种被冷落的感觉，可能也带着贬居者对自身的感慨。"},{"line":"梦随风万里，寻郎去处，又还被、莺呼起。","note":"杨花随风远飘，像闺中人在梦里到千里之外寻找丈夫，刚要找到又被黄莺叫醒。这正对应章质夫出门在外、家人空等的情形。"},{"line":"点点是、离人泪。","note":"结尾把满眼飞絮直接看成离别之人的眼泪，前面对杨花的种种拟人描写到这里才点破，离愁有了着落。"}],"moods":["咏物","怀人"],"caveat":"年谱说这首词“约”作于元丰四年，学界依据苏轼写给章质夫的信推定年份，具体是哪一年还有不同看法；信中“坐想四子”的“四子”指谁，也有不同理解。"},"352093":{"background":"元丰三年初，苏轼因乌台诗案贬到黄州，此时已是他在这里的第三个春天。俸禄微薄，家口又多，他已在东坡开荒种地，还想在城东南三十里的沙湖买田安家。据《东坡志林》记载，他这次去沙湖就是为了看田。回来路上遇雨，带雨具的人先走了，同行的人都很狼狈，只有他照常走路。不久天就晴了，他便写下这首词。词不是写给别人的，更像写给自己。","mood":"这首词里没有悲苦，也不是勉强撑出来的豪气，更像淋过一场雨之后的放松和想通。苏轼刚从死罪边上被放过，在黄州名义上是官，其实受人管束，前途由不得自己。风雨他挡不住，他能决定的只是自己怎么走。所谓“也无风雨也无晴”，并不是说世事都无所谓，而是不再让天晴天雨左右自己的心情。","lines":[{"line":"竹杖芒鞋轻胜马","note":"拄着竹杖、穿着草鞋的贬官，走起路来反倒比当年骑马做官时轻快。这是自我宽解，也带一点对过去仕途的自嘲。"},{"line":"一蓑烟雨任平生","note":"由眼前这场雨想到一辈子：披一件蓑衣在风雨里过日子也无妨。此时他正打算买田务农，这句话也是他安顿下来的心意。"},{"line":"也无风雨也无晴","note":"回头看刚才淋雨的地方，风雨和晴天都已过去，哪一样都不必放在心上。仕途上的得失荣辱，也可以这样看待。"}],"moods":["旷达","禅悟"],"caveat":"去沙湖是为了看田，这一点出自《东坡志林》，词序本身没有说；末句“潇瑟”在通行本中多作“萧瑟”。"},"352097":{"background":"元丰五年（1082）三月，苏轼因乌台诗案贬居黄州已两年多。这时董钺来访。他原在梓州路做转运官，因事获罪，罢官后正回鄱阳老家。他娶柳氏才三天就丢了官。苏轼见他从容自得，觉得奇怪，一问才知道：董钺自己并不发愁，只怕新婚妻子想不开，没想到柳氏处之泰然，他也就更安心了。席间，董钺让侍儿唱他写的《满江红》，苏轼感叹不已，按原韵和了这首。","mood":"这首词写的不是替人不平，而是道贺。丢官好比一场风雨，夫妻同心才是雨后的春色。苏轼拿梁鸿、孟光比董氏夫妇，劝他们干脆不再惦记官场，带上琴和书一起去隐居。这些话也有几分是在说自己：他同样从高位跌落，在黄州靠家人陪伴、耕种东坡过日子，所以对“同忧患若处富贵”这句话格外有感触。","lines":[{"line":"忧喜相寻，风雨过、一江春绿。","note":"开头就点明，丢官和新婚接连到来，悲喜交替。风雨过后满江春绿，既安慰董钺，也赞叹柳氏能和他共度难关。"},{"line":"何似伯鸾携德耀，箪瓢未足清欢足。","note":"梁鸿（字伯鸾）和孟光（字德耀）是东汉一对安贫乐道的夫妻。意思是吃穿虽然清苦，夫妻相得的快乐却很充足，直接回应小序里柳氏的豁达。"},{"line":"便相将、左手抱琴书，云间宿。","note":"前面借《诗经·汉广》“南有乔木，不可休思”，说老天不让你在官场歇脚。这里顺势劝夫妻俩带着琴书远离尘世，语气轻松，没有怨气。"}],"moods":["旷达","怀人"],"caveat":"编年依据年谱考证定在元丰五年三月。董钺具体因什么事获罪，小序没有说明，史料也不详。“文君婿知否，笑君卑辱”一句用司马相如的典故，具体指什么，各家注释理解不一。"},"352132":{"background":"元丰五年春，苏轼贬居黄州已是第三年。这首词不是写给某个人的，起因是读书。唐人张志和（号玄真子）写过一首《渔父》词，苏轼很喜欢，可惜原来的曲调已经失传，没法再唱。他就在原词上添了几句，凑成《浣溪沙》的格式，让它重新能唱。他还把黄州附近江边的散花洲写了进去，西塞山离这里也不远。这样一来，唐人笔下渔父隐居的风景，就成了他每天在黄州看到的江景。","mood":"词中的景物大多沿用原作，苏轼自己添的是“自庇一身”“相随到处”这几处。经历乌台诗案后，他在黄州挂着闲职，不能签署公事，言行处处小心。渔父只靠一顶斗笠、一身蓑衣遮住自己，别的不去过问，这种低调又自足的样子，正是他当时想过的日子。全词语气闲淡，但这份安闲是被迫退下来之后才有的，读的时候可以体会到这一层。","lines":[{"line":"散花洲外片帆微。","note":"这句是苏轼新加的，把黄州一带的地名放进唐人的词里。远处一片小小的帆，就是他自己眼前看到的江面。"},{"line":"自庇一身青箬笠，","note":"原词只写“青箬笠”，他加上“自庇一身”，意思是只求护住自己。这里能看出祸后求安、不再多事的心思。"},{"line":"斜风细雨不须归。","note":"这句照用原句，但出自贬居的人之口，“不须归”多了一层意思：不急着回到官场的风雨里去，在江上待着就好。"}],"moods":["闲适","旷达"],"caveat":"这首词的具体写作年份各家说法不一，年谱所记的这一年作品中没有列出它，定为元丰五年三月只是一种推定。"},"352098":{"background":"元丰五年春，苏轼在黄州已住了两年多。他在城东的旧营地开荒种地，自号东坡，又在坡上盖了雪堂。旁人多笑屋子简陋，只有鄱阳人董钺（字毅夫）来访时很喜欢，想在附近安家做邻居。年谱说，董钺不久要离开，苏轼就把陶渊明的《归去来兮辞》改写成合《哨遍》曲调的词送他，让家僮唱，农活间隙大家一起敲着牛角打拍子唱和。这首词还抄寄给了鄂州知州朱寿昌。","mood":"陶渊明是自己辞官回乡，苏轼却是戴罪贬谪，想回也回不去。他借陶的话说觉今是而昨非，说忘我忘世、琴书里有真味，一半是在田间劳作中确实找到了安顿，一半是在给自己宽心。结尾没有用陶原文的乐天知命，而是换成顺水而行、遇坎就停，等于承认进退由不得自己，只能随遇而安。这份旷达里带着无奈。","lines":[{"line":"觉从前、皆非今是。","note":"借陶渊明的话反省半生仕途。对因诗文入狱、被贬到黄州的苏轼来说，这话既是醒悟，也是自我开解。"},{"line":"我今忘我兼忘世。","note":"在东坡种地、住雪堂的日子里，他想把自身得失和朝廷是非都放下。这是他向往的境界，未必是已经做到的状态。"},{"line":"且乘流、遇坎还止。","note":"化用贾谊“乘流则逝，得坻则止”的意思：顺势而行，遇到阻碍就停。前途不能自主，只好随遇而安。"}],"moods":["旷达","闲适"],"caveat":"词序只说董毅夫喜欢雪堂、有意卜邻，没有提送别；“董钺归去时作词相送”和“兼寄朱寿昌”出自年谱的考证。具体月份也是年谱的推定，未必确切。"},"352083":{"background":"元丰五年（1082），苏轼因乌台诗案贬居黄州已经两年多。朱寿昌字康叔，当时任鄂州知州，鄂州就在黄州上游不远。两人这几年书信往来不断，年谱记载苏轼这一年还写信向他请教服食朱砂的方法。这首词是寄给他的，借鄂州的江水和当地古迹，与朋友谈乡愁、论古人，也说说自己的心事。至于具体由哪件事引起，词里没有交代，史料也没有明确记载。","mood":"上片是乡愁。长江从四川流下来，苏轼看着江水，想到了家乡的岷山、峨眉山和锦江，称自己是“剑外思归客”。可他是戴罪之身，回不去。下片借祢衡的事说读书人因言语惹祸。苏轼刚因为诗文下过狱，读者很容易把两件事联系起来，不过这是推测，词里没有点明。接着他说，杀害祢衡的曹操、黄祖也早已不在了，借此把郁愤放下，最后转回去劝朋友写诗。词里悲慨与自我宽解交织在一起。","lines":[{"line":"犹自带、岷峨云浪，锦江春色。","note":"他从眼前的江水想到上游的四川老家。家乡在想象里离得很近，现实里却回不去，乡愁就在这层落差里。"},{"line":"空洲对鹦鹉，苇花萧瑟。","note":"祢衡有才气、性子狂，最后死在黄祖手里，只剩一片荒洲和芦花。苏轼惋惜的是他，也隐约照见自己因文字获罪的遭遇。"},{"line":"不独笑、书生争底事，曹公黄祖俱飘忽。","note":"他先笑书生何苦去争，又说当年得势的曹操、黄祖也都消逝了。这是在宽慰自己，口气旷达，底下仍有不平。"}],"moods":["思乡","悲慨"],"caveat":"这首词的编年另有元丰四年一说。“南山遗爱守”指的是朱寿昌以前哪一任官职，注家说法不一。“岷峨云浪”有的版本作“雪浪”。"},"352102":{"background":"元丰三年起，苏轼因乌台诗案贬到黄州，挂着团练副使的空衔，不能过问公事。到写这首词时，他在黄州已是第三年，生活清苦，常到城外江边走走。黄州城外有一处红色石崖，当地人叫赤鼻矶，传说是三国赤壁之战的地方。这首词就是他游到这里时写下的。现存材料没有说它为谁而作，也没有提到写于哪次宴集，看来是他一个人游览时有感而写，写给自己的。","mood":"上片看着江涛，想到古往今来的人物都被时间冲走。下片集中写周瑜：年纪轻轻，新婚得意，谈笑之间就立下大功。周瑜破曹时三十出头，苏轼此时四十七岁，戴罪闲居，头发已经花白，想做事也没有机会。两相对照，难免失落。但他没有一路消沉下去，而是先自嘲一句，再把酒洒向江月，把个人的得失放到更长的时间里去看，心里也就放下了。","lines":[{"line":"故垒西边，人道是，三国周郎赤壁。","note":"“人道是”表明他只是听当地人这样说，并不认定这里就是古战场。他借着传说抒发感慨，下笔很有分寸。"},{"line":"多情应笑我，早生华发。","note":"意思是该笑我自己太多情、想得太多，头发早早就白了。拿周瑜的少年得志对照自己的贬谪处境，用自嘲化开心里的苦涩。"},{"line":"人间如梦，一樽还酹江月。","note":"古代英雄和自己的一生都像一场梦，不如举杯把酒洒给江上的月亮。这是失意后的自我开解，并不是真的看破了一切。"}],"moods":["悲慨","旷达"],"caveat":"写作时间通常定为元丰五年七月，但没有确证；黄州赤鼻矶并不是赤壁之战的实地，苏轼自己也只说“人道是”；各版本文字有出入，如“穿空”有作“崩云”，“樯橹”有作“强虏”。"},"352103":{"background":"元丰五年（1082）中秋，苏轼因乌台诗案贬居黄州快满三年。他挂着团练副使的虚衔，不能参与公事。这首词没有题序，为谁而写、和谁一起过节，都没有记载。从“对影成三客”看，那晚很可能是他一个人喝酒赏月。这年七月他刚游过赤壁，写了前《赤壁赋》。六年前在密州过中秋，他写《水调歌头》怀念弟弟苏辙；这一首却没有提到任何人。","mood":"上片写月光又冷又亮，眼前的江山好像变成了月宫一般的“清凉国”。下片他喝醉了，拍手唱歌，起身跳舞，想乘着风回到天上去。密州那首词里还有“高处不胜寒”的犹豫，这里却说走就走，连大鹏的翅膀都不用借。贬居中的人借着醉意和想象挣脱束缚，看起来洒脱，底子里仍是没人陪着喝酒的孤单。","lines":[{"line":"玉宇琼楼，乘鸾来去，人在清凉国。","note":"月光把人间照得像月宫，他觉得自己也身在那个清凉世界里，暂时离开了贬所的局促和烦热。"},{"line":"我醉拍手狂歌，举杯邀月，对影成三客。","note":"化用李白《月下独酌》。热闹的是动作，实际上只有月亮和影子作伴，写出贬居中过节时的冷清。"},{"line":"便欲乘风，翻然归去，何用骑鹏翼。","note":"醉意中想一下子回到天上，不用借助外物。这是想摆脱现实困境的念头，比密州那首词去意更坚决。"}],"moods":["旷达","豪放"],"caveat":"此词没有题序，系年于元丰五年中秋是依据后人的编年笺注；当晚的具体场合和是否有人同饮，都无从考证。"},"352118":{"background":"元丰五年重阳，苏轼贬居黄州已近三年。知州徐君猷（名大受）待他宽厚，没有把他当罪臣防着，每年重九都约他到城中的栖霞楼登高饮酒。这一年，徐君猷已经上书请求调往湖南。这次聚会，很可能是两人在黄州共度的最后一个重阳。苏轼想到照应自己的人就要离开，心里怅然，便写了这首词送给他。","mood":"词一开头，苏轼自嘲半生奔波像一场梦，又写自己对着荒园挠白头，透出贬居的冷落。但全词的重心是感激徐君猷：正因为有这位爱喝酒、不多事的太守，三年的重阳才过得有人情味。人要走了，他说要喝个烂醉，又把菊花和茱萸看了又闻，想把这一刻留住。结尾他设想明年这一天两地遥遥举杯，把离别的伤感化成了祝愿。","lines":[{"line":"华发萧萧，对荒园搔首。","note":"四十七岁，头发已经稀疏斑白，对着荒凉的园子挠头。一个罪臣闲居无事、前途茫然的样子，一下子就显出来了。"},{"line":"此会应须烂醉，仍把紫菊茱萸，细看重嗅。","note":"他知道这样的聚会以后难再有，所以要醉个痛快，又把重阳的菊花、茱萸拿在手里看了又闻，舍不得放下。"},{"line":"来岁今朝，为我西顾，酹羽觞江口。","note":"请对方明年今天回头望望黄州，在江边洒一杯酒。分别后的想念被提前约好，话说得含蓄，情意很深。"}],"moods":["送别","羁旅"],"caveat":"徐君猷后来什么时候离开黄州、有没有真的到湖南任职，各家说法不完全一致。这里只按词序所说的“乞郡湖南”来理解。"},"352242":{"background":"这是一首檃括词。苏轼把杜牧《九日齐山登高》这首七律拆开重排，填进《定风波》的词调，又补上“年少”“云峤”“多少”几处短句。杜牧的原诗作于池州，写的是重阳节和诗人张祜同登齐山，两人当时都不得志。苏轼此时以罪官身份安置在黄州，已经快三年了。重阳登高，他借前人这首诗说自己的话。同行的“客”是谁、登的是哪座山，词里都没有交代，无法确指。","mood":"杜牧原诗本来就是失意的人在节日里强打精神，苏轼接过了这层意思，又把“古往今来只如此”改成“古往今来谁不老”，让感慨直接落在人人都逃不掉的衰老上。他这时四十七岁，是戴罪之身，前途难料。这份凉意他没有回避，只是说既然谁都会老，就不必像齐景公那样对着山流泪。先承认伤感，再把它放下，这是他在黄州常有的心态。","lines":[{"line":"尘世难逢开口笑。","note":"这句照搬杜牧原句。对贬居黄州、说话处处小心的苏轼来说，难得开怀是实情，所以重阳这一天更要喝个痛快。"},{"line":"古往今来谁不老。","note":"这是全词改动最明显的一句。把“只如此”换成“谁不老”，直说衰老是所有人的命运，用来宽解客人，也宽解自己。"},{"line":"牛山何必更沾衣。","note":"这里用了齐景公登牛山、想到人终有一死而落泪的典故。“何必”是在劝客，也是在劝自己：伤感过了，就不要再沉在里面。"}],"moods":["旷达","悲慨"],"caveat":"年谱把这首词系于元丰五年九月，但词里没有能确定年份的线索，各家编年不完全一致；同游的“客”是谁，也没有记载。"},"352063":{"background":"元丰五年（1082），苏轼因乌台诗案贬居黄州已近三年，名义上是团练副使，实际上不能过问公事。这首词写他清明时节独自走在山野里的所见所感。题目说是送行甫去馀姚，但词里看不出送别的内容，行甫是谁也没有可靠记载，所以题和词原本是否相配，现在难下定论。能确定的是，写词的人在荒僻的山里过节，身边没有同伴，只能靠琢磨诗句打发时间。","mood":"字面上轻松，自称“闲客”，可这份闲是被贬以后被迫的闲：挂着官名，却没有事可做，行动也不自由。清明本来是出门游春、热闹的时候，他却在乱山桑田里走了一整天，没有荡秋千的女子，也遇不到能对上眼神的人。结尾一句连用两个“闲”字，有自嘲，也有接受处境后的平静。同一年他写《寒食雨》二首，语气沉重得多；这首把同样的寂寞说得轻一些。","lines":[{"line":"乱山深处过清明。","note":"别人在城里踏青游乐，他在偏僻山里过节。“乱山深处”既写地方，也写出贬居生活和热闹人世隔得很远。"},{"line":"尽日行桑野，无人与目成，且将新句琢琼英。","note":"“目成”出自《九歌》，指眉目传情。走了一天也碰不到一个相知的人，只好把心思用在推敲诗句上。"},{"line":"我是世间闲客、此闲行。","note":"自称世上的闲人，这次也只是闲走。语气洒脱，背后是没有官事可做、只能闲着的无奈。"}],"moods":["自嘲","闲适"],"caveat":"题目“送行甫赴馀姚”和词的内容对不上，行甫是谁不明，版本之间的题目也可能有错乱；把这首词编在元丰五年清明、作于黄州，依据的是年谱，并非没有疑问。"},"352064":{"background":"元丰五年（1082），苏轼仍以团练副使的身份安置在黄州，没有实际职权，生活也受限制。年谱把这首词和同调的“带酒冲山雨”系在同一年，两首都写雨中或雨后骑马走山路，应当作于黄州附近的一次出行途中。词题只有“寓意”二字，没有赠送对象，看不出是为谁写的。它更像路上一时的感触：借眼前的景色和一个唐人遇仙的故事，说一点不便直说的心事。","mood":"上片很轻快：雨停天晴，山色明亮，马走在软沙路上，有一种走出阴雨的松快感。这和他在黄州渐渐安顿下来的状态相合。下片转向：早上喝的酒醒了，人还是困；想做个遇仙的梦，也做不成。“云英”可以理解为心中所求的人，也可以是理想或出路，词里没有点破。结尾只有流水相伴，失落里带着一点自我宽慰，并不沉重。","lines":[{"line":"细草软沙溪路、马蹄轻","note":"雨后草软沙平，马蹄也显得轻快。写的是路，也透出他此刻难得的轻松心情。"},{"line":"蓝桥何处觅云英","note":"借裴航在蓝桥遇仙女云英的故事，问自己想要的东西去哪里找。答案明知是找不到的。"},{"line":"只有多情流水、伴人行","note":"人求不到，仙也遇不上，只有溪水一路跟着。把无情的流水说成多情，是孤单中的自我安慰。"}],"moods":["羁旅","自嘲"],"caveat":"编年有分歧：年谱系于元丰五年黄州，而有赏析定为元丰二年湖州任上，两说都缺少确证；另外“便报晴”有作“忽报晴”，“仙材”有作“仙村”。"},"352065":{"background":"元丰五年，苏轼贬居黄州已是第三年，挂着团练副使的虚衔，不能过问公事。题中“再用前韵”，说明这首是接着同调“雨暗初疑夜”一首、沿用原韵写的。两首都写醉后冒雨出行、雨后转晴，没有题赠对象，更像是写给自己的。词里说到“求田问舍”，和他这时在黄州找地买田、打算长住的事对得上。这年三月他去沙湖看田，路上遇雨，不过这首词是不是就写于那一趟，没有确证。","mood":"上片写他带着酒意冒雨赶路，回来和衣倒头就睡，醒来不知天已大亮，梦里像庄子化蝶一样身子轻快，是暂时放下心事的松弛。下片他回过头看自己：人老了，才气也耗尽了，想回故乡又办不到，只能在贬所买田安顿。他借刘备笑话许汜的典故拿自己开玩笑。结尾说庆幸湖边是沙路，走起来不沾泥，把失意落到眼前一件小小的称心事上。这是他在黄州安顿自己的常用办法。","lines":[{"line":"老去才都尽，归来计未成。","note":"他说自己老了，才气也用完了，回蜀中老家的打算也没有着落。贬官的去留由不得自己，话说得平淡，底下有隐痛。"},{"line":"求田问舍笑豪英。","note":"三国时刘备讥笑许汜只顾买田置屋。苏轼反过来用这个典故，承认自己正在做英雄看不起的事，带着自嘲。"},{"line":"自爱湖边沙路、免泥行。","note":"雨后沙路不积泥，走着舒服。他把注意力放在这点实在的好处上，用一点小满足压住前面的感慨。"}],"moods":["自嘲","旷达"],"caveat":"这首词一般系于元丰五年黄州，但写于哪个月、和三月沙湖看田有没有关系，都没法确定。"},"352082":{"background":"元丰五年，苏轼因乌台诗案贬到黄州已是第三年。他挂着团练副使的空衔，不能过问公事。这一年他写了《红梅三首》，这首《定风波》基本是把第一首诗改成了词，不少句子几乎原样搬过来。没有材料说明它是为谁写的，或是在哪次宴会上写的，更像是他自己对着红梅想到的。直接的起因，是他不同意前辈诗人石延年的看法：石延年写红梅，只凭有没有绿叶、青枝来分辨梅花和桃杏。苏轼想说清楚，梅花之所以是梅花，到底在哪里。","mood":"这首词既有自嘲，也有自守。红梅开得晚，脸色清冷，不合时令，于是偶尔染上一点桃杏的红色。这很容易让人想到苏轼此时的样子：在黄州种地、喝酒、交朋友，看上去随和，和普通人没有两样。但他反复强调，这层红只是酒意，骨子里仍是那副清瘦、耐霜雪的样子。可以把这看作一个因为文字获罪的人，在退让和坚持之间给自己找的分寸。","lines":[{"line":"自怜冰脸不宜时。","note":"红梅知道自己面色清冷，不讨时人喜欢，有点自怜。也可以读作苏轼自嘲“不合时宜”，这是他一生常被人说的毛病。"},{"line":"偶作小桃红杏色，闲雅，尚馀孤瘦雪霜姿。","note":"偶尔也随俗染一点桃杏的红，但耐寒的清瘦本色还在。外表可以随和一些，根底不改，这正是他贬居时的处世分寸。"},{"line":"诗老不知梅格在，吟咏，更看绿叶与青枝。","note":"批评石延年只拿枝叶来分辨梅花，不懂梅花的品格在精神，不在外形。也能读出他不认同只看表面去评判人。"}],"moods":["咏物","自嘲"],"caveat":"“诗老”一般认为指石延年，他的原句是“认桃无绿叶，辨杏有青枝”；参考赏析把“寒心未肯随春态，酒晕无端上玉肌”算作石延年的诗，这不准确，这两句出自苏轼自己的《红梅》第一首；另外，“不宜时”和“不时宜”、“小桃红杏”和“小红桃杏”，各个版本的文字不一致。"},"352091":{"background":"元丰三年，苏轼因乌台诗案贬到黄州。第二年，老友马正卿替他向官府申请到城东一块废弃的旧营地，他带着家人开荒种地，自号“东坡居士”。元丰五年春，他又在坡上盖起几间屋，取名雪堂。这首词不是写给谁的，也不是应酬之作。新居落成后，他站在附近四下看，觉得南面的山丘、西面的泉水，很像陶渊明当年正月初五游斜川时见到的景色，于是借陶渊明的事写了这首词。词前小序把这个联想交代得很清楚。","mood":"词里有两种心情。一种是安顿下来的欣喜：春雨下透了，喜鹊叫着天晴，田里的庄稼有了指望，屋旁有泉水，有小溪，他乐意把自己看成陶渊明转世。另一种藏在“走遍人间”和“吾老矣”里：陶渊明是自己辞官回乡，他却是戴罪之身，被安置在这里种地；四十七岁了，看不到回朝的希望，于是想到可能就在这里过完余生。喜悦是真的，无可奈何也是真的。","lines":[{"line":"走遍人间，依旧却躬耕。","note":"在仕途上奔走二十多年，到头来又回到田里种地。话说得平淡，里面有自嘲，也有说不出的辛酸。"},{"line":"昨夜东坡春雨足，乌鹊喜，报新晴。","note":"这是种地的人才有的高兴：一夜春雨把地浇透了，天又放晴。苏轼此时真的靠这块地吃饭。"},{"line":"都是斜川当日境，吾老矣，寄馀龄。","note":"眼前的景色和陶渊明当年所见相合，他由此想到自己也老了，大概就在这里度过余生，语气平静又有些沉重。"}],"moods":["闲适","旷达"],"caveat":"陶渊明《游斜川》诗序记的年份，各本有“辛丑”“辛酉”之别，所以他游斜川时多少岁，学界说法不一；雪堂落成的具体月份，一般据苏轼《雪堂记》定在元丰五年二月前后。"},"352094":{"background":"元丰五年春，苏轼贬居黄州已近三年。他去黄州东南的沙湖看田，打算买地长住，途中生了病。听说蕲水麻桥有位名医庞安时，便前去求治。庞安时耳聋，两人靠写字交谈，很合得来。病好以后，苏轼和他同游城外的清泉寺，看见寺前兰溪向西流，就在这一天写下这首词。据他自己记载，两人当天还痛饮了一场才回去。","mood":"上片的暮雨和杜鹃啼声有些清冷。杜鹃的叫声向来被听作“不如归去”，这对回不了家的贬官来说并不陌生。他刚病了一场，又在为长住异乡买田，看到溪水西流，便借这反常的景象给自己打气：人不一定只能一路老下去。词里的振作并不是没有感伤，而是他不肯让感伤占上风。","lines":[{"line":"萧萧暮雨子规啼。","note":"傍晚细雨中杜鹃一声声叫着。病刚好，人又在贬所，这一句透出淡淡的寂寞，也为下片的转折做了铺垫。"},{"line":"门前流水尚能西。","note":"中国地势西高东低，江河大多东流，常用来比喻时光一去不回。兰溪偏偏向西流，苏轼借眼前的实景反问：时光未必只能往一个方向走。"},{"line":"休将白发唱黄鸡。","note":"白居易曾借黄鸡报晓、白日西沉感叹人老得快。苏轼说不必学这种悲叹，这是四十七岁、大病初愈的他在给自己鼓劲。"}],"moods":["旷达"],"caveat":"看田得病、求医同游的经过见于苏轼自己的《东坡志林》，月份通常定在三月，主要依据年谱和词中的暮春景物。另外，“唱黄鸡”一般认为出自白居易《醉歌》，不是注释所引的李白诗。"},"352095":{"background":"元丰五年（1082）春，苏轼因乌台诗案贬居黄州，已是第三年。据他自己的笔记，这年春天他去沙湖看田时生了病，听说蕲水名医庞安时医术好，就前去求治，病好后两人还一起游了清泉寺。这首词写于蕲水一带的山行途中：夜里在酒家喝醉，骑马到溪桥上卸鞍躺下，一觉睡到天亮。醒来见群山围拢、溪水作响，觉得不像人间，于是把词题在桥柱上。这首词不是写给谁的，也不是应酬之作，是写给他自己的。","mood":"词里几乎看不到贬谪的痕迹，只有醉意、月光和一夜好睡。此时的苏轼是个领微薄俸禄的闲官，因诗文获罪，言行处处小心。这一夜没有公务，也没人盯着，他可以醉倒在野外，只顾珍惜月色。醒来后他觉得“疑非尘世”，反过来说明他平日所处的世界并不轻松。这一夜只是暂时脱身，心情是松弛和愉快的，但并不等于他已经放下了一切。","lines":[{"line":"我欲醉眠芳草。","note":"醉到等不及卸下马鞍，就想倒在草地上睡。这时既不讲体面，也没人管束，在贬居生活中很少有这样随性的时刻。"},{"line":"可惜一溪明月，莫教踏碎琼瑶。","note":"“可惜”在这里是可爱的意思。他舍不得让马蹄踩碎水里的月影，人虽然醉了，心思却细，也很安静。"},{"line":"杜宇一声春晓。","note":"一声杜鹃把他从夜里叫醒，天已经亮了。杜鹃在诗词里常和思归联系在一起，但这里是否有乡愁，从字面上不好断定。"}],"moods":["闲适","旷达"],"caveat":"作于元丰五年春、在蕲水一带，这一点大体没有争议；具体是哪一天、和求医是不是同一趟行程，史料没有明确记载。词句流传有不同版本，如“弥弥”与“㳽㳽”、“层霄”与“微霄”、“风月”与“明月”。"},"352096":{"background":"元丰二年乌台诗案后，苏轼被贬为黄州团练副使，有官名而无实权。年谱据校注把这首词系于元丰五年，这是他在黄州的第三年。词前没有序，史料也没有记载它是为谁、在什么场合写的，看起来更像是写给自己的一番开解。年谱说它“旨在警世，亦在娱生”。他刚因诗文获罪、险些送命，此时回头看朝中的名利之争，心里自然有许多话要说。","mood":"上片冷眼看名利，下片转向清风明月和美酒，表面放达，底下压着不少愤懑。“谁弱又谁强”“说短论长”这些话，很容易让人联想到他在党争中被人罗织罪名、因言获罪的经历。所谓“闲身”，其实是被迫闲置，他把无奈说成自在，用醉酒和自然来化解。既不甘心，又想放下，这种拉扯在他黄州时期的作品里常能见到。","lines":[{"line":"事皆前定，谁弱又谁强。","note":"得失仿佛早已注定，争赢的未必真强，失势的也未必真弱。这是对朝中你争我夺的冷淡回应，也是对自己的安慰。"},{"line":"且趁闲身未老，须放我、些子疏狂。","note":"“闲身”是贬官无事可做的委婉说法。他干脆要求放纵一点，把被闲置当成可以自在的理由，口气里带着几分自嘲。"},{"line":"又何须，抵死说短论长。","note":"何必拼命争论是非长短。他刚因诗文惹祸，这话既是在劝世人，也像是在提醒自己少开口。"}],"moods":["旷达","悲慨"],"caveat":"编年依据年谱所引校注定为元丰五年，但词中没有确切的时间地点线索，也有论者只笼统地说作于贬黄州之后；写作对象和场合都没有记载。"},"352099":{"background":"元丰五年，苏轼贬居黄州已是第三年。光州知州曹九章的儿子曹焕从光州去筠州（苏辙当时贬在那里），路过黄冈时来看望苏轼。苏轼写了这首词托他带给父亲。从词意看，曹九章大概对白发渐多、在小郡任职的日子有过抱怨，这首词就是回应这番抱怨，用玩笑的口吻宽慰老朋友。","mood":"这首词是写给朋友的宽慰话，办法是拿自己开玩笑：你嫌在光州做知州日子不好过，总比我被贬三年强；我想叹口气都不敢，过去做过三个州的长官本就算侥幸。轻松的语气底下，有贬官说话时的小心和一点委屈。到结尾，儿女婚事办完了，年纪也大了，担子在一点点卸下。这是在劝曹九章，也说出了苏轼在黄州慢慢找到的那份安顿。","lines":[{"line":"也应胜我三年贬。","note":"劝曹九章别嫌做知州辛苦，再怎么样也比我在黄州贬了三年强。拿自己的处境垫底，安慰人也自嘲。"},{"line":"我欲自嗟还不敢，向来三郡宁非忝。","note":"苏轼此前做过密州、徐州、湖州的长官。连叹气都不敢，说当年做太守本就不配，是罪臣的谨慎，也带着苦笑。"},{"line":"千钧重担从头减。","note":"儿女婚嫁大多办完，人生的负担正一样样卸下。这句是劝对方，也是苏轼对晚景的一种看开。"}],"moods":["自嘲","旷达"],"caveat":"曹焕去筠州的具体缘由（一般认为与曹苏两家的姻亲往来有关），以及“浮光似箭”具体指什么，各家理解不完全一致，这里只取大意。"},"352101":{"background":"苏轼因乌台诗案贬居黄州，挂着团练副使的闲职。这首词的缘由写在小序里：他七岁时在眉山见过一位九十岁的朱姓老尼。老尼说年轻时随师父进过后蜀孟昶的宫中，记得孟昶与花蕊夫人夏夜在摩诃池纳凉时作的一首词。四十年后老尼早已去世，这首词再没人知道。苏轼只记得开头两句，闲时反复琢磨，认定是《洞仙歌令》的调子，就替它补全了。这首词不是赠人或应酬之作，是童年记忆引出的一次补写。","mood":"词的大半写想象中的宫中夏夜：水殿清凉，月光照进帘内，两人起身携手看星，笔调安静轻柔。到了结尾，人还在盼秋凉早来，却没留意年华已经悄悄换掉，情绪就此沉了下来。这份感慨不只属于花蕊夫人。孟昶的蜀国早已亡了，讲故事的老尼也去世了，苏轼自己从眉山的孩子变成了贬在黄州、年近五十的人。一首残词把这几层时间叠在一起，失落写得含蓄，没有直接说到他自己。","lines":[{"line":"起来携素手，庭户无声，时见疏星渡河汉。","note":"两人起身到院中携手散步，四周一片寂静，只见稀疏的星慢慢移过银河。静中已暗含时间在走。"},{"line":"试问夜如何，夜已三更，金波淡、玉绳低转。","note":"随口一问夜有多深，才知已到三更，月色转淡，星斗西斜。欢聚中不知不觉，夜已过了大半。"},{"line":"但屈指、西风几时来，又不道流年、暗中偷换。","note":"人怕热，扳着指头盼秋风，却没想到盼来的也是年华的流逝。苏轼回望四十年往事时的感触也在这里。"}],"moods":["伤逝"],"caveat":"编年是按小序“今四十年”从七岁往后推算的，并无确切记载。另有一首署名孟昶的《玉楼春》（冰肌玉骨清无汗），一般认为是后人据苏词改写的伪作。注释里引作“洞仙歌·咏柳”，与本词内容不符，应是误题。"},"352113":{"background":"元丰五年，苏轼贬居黄州已近三年。精通琴艺的庐山玉涧道人崔闲来到黄州，两人往来密切。琴曲《醉翁操》是沈遵游滁州琅琊山时，按欧阳修喜欢聆听的山泉声写成的，只有曲调，没有歌词。欧阳修本人写过的歌辞又与琴声不合。崔闲觉得可惜，便记下曲谱，请苏轼补写词句。这时欧阳修已去世十年，苏轼是他当年一手提携的门生。","mood":"这首词写的是泉声和琴声，底下藏着对老师的怀念。“醉翁去后”几句说知音不在，山泉只能空自鸣响，也透出苏轼失去恩师后的落寞。欧阳修当年也是被贬到滁州，苏轼此刻贬在黄州，境遇相近，对老师醉中自得其乐的心境应当更能体会，不过这只是推想。结尾没有停在哀伤上，而是说这份意趣还留在琴弦之间，借传承来安慰自己，语气平静。","lines":[{"line":"惟翁醉中知其天。","note":"满山泉声，只有欧阳修在醉中听出了它天然的妙处。这一句既称赞老师，也说明真正的知音很难遇到。"},{"line":"醉翁去后，空有朝吟夜怨。","note":"老师离开后，泉水依旧早晚鸣响，却像在吟叹、在抱怨。苏轼借山泉没了听众，写自己失去恩师的空落。"},{"line":"此意在人间。","note":"欧阳修已经成了仙人，但他留下的情趣还在人间。苏轼从怀念转到传承，伤感中带着自我宽慰。"}],"moods":["伤逝","旷达"],"caveat":"作于元丰五年是依据年谱，苏轼的词序本身没有写明年份；另外“清圜”“童巅”在一些版本中作“清圆”“童颠”。"},"352125":{"background":"元丰五年，苏轼贬居黄州已是第三年，挂着团练副使的闲职。这年二月，东坡雪堂刚刚建成。一位旧友路过黄州，特地来看他，两人饮酒谈诗，分别时苏轼写了这首词送他。词里说“昔年共采芸香”，芸香是古人放在书中防虫的香草，据此可以推知这位朋友当年和苏轼一同在京城馆阁任职，是旧日同僚。至于他叫什么名字，现存材料没有记载。","mood":"上片说，友人带来的诗和他的笑脸，让苏轼冷了很久的心重新暖了起来。“冰霜”两个字，透出他贬居时的孤单和小心翼翼。下片他自称“雪堂坡下老”，有几分自嘲。对朋友，他祝对方功成名就以后早些回乡，回去的路上再来看他。一个前程还在，一个困在江边，苏轼没有诉苦，只把期待放在下一次见面上。","lines":[{"line":"诗句端来磨我钝，钝锥不解生铓。","note":"友人拿诗句来磨他的迟钝，他却说自己是把钝锥子，怎么磨也磨不出锋芒。这是客气话，也许还藏着诗案之后不敢再露锋芒的心情。"},{"line":"欢颜为我解冰霜。","note":"友人的笑脸化开了他心里的冰霜。贬居两年多，来往的人少了，世情也冷淡，这份热情让他格外感激。"},{"line":"应念雪堂坡下老，昔年共采芸香。","note":"叮嘱朋友记得雪堂坡下这个老头，当年两人曾一起在馆阁校书。当年同僚，如今一个罪臣一个官员，落差不用明说。"}],"moods":["送别","自嘲"],"caveat":"受赠的人是谁不清楚，年谱只说是“来访道过之友”；说他是馆阁旧同僚，是根据“芸香”这个典故推断的；这首词写于哪个月也很难确定。"},"352126":{"background":"元丰五年，苏轼因乌台诗案贬到黄州，已经快三年了。他住在长江边的临皋亭，常和渔夫、樵夫来往。他在给友人李之仪的信里说，自己混在这些人中间，被醉汉推搡也不在意，反而庆幸渐渐没人认得他了。《渔父》四首是一组连章小词，依次写渔父的饮、醉、醒、笑，这是第一首。年谱没有记下它为谁、在什么场合写成，看不出有赠送对象，更像是他把江上见闻写下来，也借此说说自己。","mood":"词里的渔父拿鱼蟹去随便哪家换酒，喝醉就算，谁也不提钱。苏轼此时只是个没有实权的闲官，收入微薄，靠开垦东坡贴补家用。人情往来退回到最简单的交换，他觉得这样反倒干净。他刚经历过被人逐字挑罪名的诗案，对官场上的算计感受很深，所以格外看重这种不问身份、不计较得失的痛快。词的语气轻松，底下是一个失意的人有意让自己放下。","lines":[{"line":"鱼蟹一时分付","note":"打来的鱼蟹一次全拿出去换酒，不留后手，也不挑人家，随手送出的样子正合苏轼想要的那种不经营、不打算的活法。"},{"line":"酒无多少醉为期","note":"喝多少不管，喝醉就够了。这里看重的是尽兴本身，不是讲究，也带着贬居中借酒消解烦闷的意思。"},{"line":"彼此不论钱数","note":"渔父和店家都不算账，交情就是一个“信”字。苏轼经历过被人罗织罪名的诗案，所以格外向往这种不设防的人际往来。"}],"moods":["闲适","旷达"],"caveat":"年谱把这组词定在元丰五年的黄州，但原作没有题序，也有学者认为作年难以确定，这里的编年仅供参考。"},"352127":{"background":"元丰五年，苏轼因乌台诗案贬到黄州已经第三年，挂着团练副使的空衔，没有实权，也不能随意离开。年谱记他这一年写了《渔父》四首，分别写渔父饮、醉、醒、笑，这是第二首。现存材料没有提到这组词是写给谁的，也没有记下具体在什么场合写成，更像是他在江边看渔人、想自己时写下的组词。这一年他常去岐亭看陈慥，也和过路的贬官张商英见过面，日子在闲散和寂寞之间。","mood":"词里的渔父喝醉了，披着蓑衣摇摇晃晃，还想着找回家的路；船随它横着斜着漂，醒来连自己在哪里都不知道。这个醉态有放松的一面，也带着几分自嘲。苏轼此时前途未卜，回不了朝，也没法自己决定去处，“不知何处”的茫然和他的处境是对得上的。不过他并不显得惊慌，而是任船漂流，把迷失当成一种暂时的自在。","lines":[{"line":"醉里却寻归路","note":"醉成这样，心里还惦记着回去的路。对贬居的苏轼来说，“归”既指回家，也隐约指仕途和人生的去向。"},{"line":"轻舟短棹任斜横","note":"小船短桨，横着斜着都随它去。不去用力，也不去挣扎，透出他在黄州学着顺其自然的心态。"},{"line":"醒后不知何处","note":"醒来发现不知身在何处，有点好笑，也有点茫然，像是他对自己前路无从把握的一种轻描淡写。"}],"moods":["旷达","自嘲"],"caveat":"《渔父》四首的编年各家说法不完全一致，这里按年谱系于元丰五年黄州；这组词是否有特定的写作对象或场合，现存材料中没有记载。"},"352128":{"background":"元丰五年，苏轼因乌台诗案贬到黄州已经第三年。他挂着团练副使的空衔，不能过问公事。《渔父》是一组四首，依次写渔父饮酒、醉倒、醒来、发笑，这是第三首。词里没有题赠的人，也看不出写于什么场合，更像是借江上渔父来写自己。黄州临江，他常坐船喝酒，渔父是他常见、也愿意拿来自比的人。是什么具体事情促使他写这组词，史料没有记载。","mood":"这首词写醉后醒来的那一刻：春天的江上，正当中午，梦刚断，眼前只有落花和柳絮在飘。醒了再醉，醉了又醒，他不去分辨哪一边才算真，干脆把古往今来的事一笑放下。这份洒脱并不轻松。他被贬后仕途无望，说话写诗都得小心。把自己放进渔父的身份里，是在给自己找个安身之处，也带着几分自嘲。","lines":[{"line":"梦断落花飞絮。","note":"一觉醒来，梦里的事已经断了，眼前只剩花絮乱飞。往日的功名，大概也像这场梦一样散了。"},{"line":"酒醒还醉醉还醒，","note":"醉和醒反复轮转，他也不想分清。借酒躲开清醒时的烦恼，同时也坦白承认自己是在躲。"},{"line":"一笑人间今古。","note":"全词落在这一句。古今兴亡、个人得失，都化作一笑，透出想通之后的松弛，也有些无可奈何。"}],"moods":["旷达","自嘲"],"caveat":"这组《渔父》词本身没有纪年，这里按年谱系于元丰五年黄州，也有注本另作系年，确切写作时间难以定论。"},"352129":{"background":"元丰五年，苏轼因“乌台诗案”贬居黄州已近三年，挂着团练副使的虚衔，不能签署公事，日子多半在江边、田间和朋友往来中度过。这一首是《渔父》组词四首中的最后一首，前三首依次写渔父的饮、醉、醒。年谱没有记下它为谁而作、因何事而写，看不出是赠人或应酬的作品，更像是他借渔父这个传统形象写自己的心事。","mood":"词里的渔父面对风雨毫不慌张，反倒笑看岸上要过江的官人。此时的苏轼处境尴尬：名义上仍是官员，实际上被看管、被闲置，所以他既是岸上的“官人”，又向往做船上的渔父。这一笑里有超脱，也有自嘲：仕途上的奔忙和得失，从江上看过去显得有些可笑，而他自己恰恰刚从这种奔忙里跌落下来。","lines":[{"line":"渔父笑，轻鸥举，漠漠一江风雨。","note":"满江风雨，渔父却笑了，鸥鸟照样轻快地飞起。风雨在他眼里算不上危险，这份从容正是贬居中的苏轼想要的。"},{"line":"江边骑马是官人，借我孤舟南渡。","note":"骑马的官人到了江边也过不去，只好来借渔父的小船。身份高低在这里倒了过来，苏轼也拿自己这个半官半民的身份开了玩笑。"}],"moods":["旷达","自嘲"],"caveat":"这组《渔父》词的具体写作年份，各家编年并不一致。本篇按年谱放在黄州时期，但没有确切的本事可以佐证，词中的“官人”也没有具体所指。"},"352130":{"background":"元丰五年，苏轼因乌台诗案贬居黄州，已经是第三年。年谱只记他这一年写了两首《调笑令》，没有说是写给谁的，也没有说在什么场合写的。这几年他常在江边、田间往来，在书信里说自己和渔夫樵夫混在一起，渐渐没人认得他了。江上的渔父他天天看得见，又是唐人张志和以来诗词里常写的人物。他借这个题材，写出自己向往的一种日子。","mood":"词里看不到苏轼自己，只写一个渔父冒着细雨晚归，有酒有鱼，最后传来一声笛。这样不靠别人、不问得失的生活，正是一个没有实权、行动受人管束的贬官羡慕的。与其说他在描写渔父，不如说他在学着安于眼前，把一天的风雨和一顿晚饭当作全部。末句笛声不知从哪里来，又留下一点说不清的怅惘。","lines":[{"line":"江上微风细雨。","note":"风雨不大，渔父照常出江。贬居中的苏轼也在学着这样对待生活里的风雨，不躲开也不惊慌。"},{"line":"红酒白鱼暮归。","note":"一天的收获就是酒和鱼，天黑了就回家。简单而自足，正是苏轼在黄州想要的日子。"},{"line":"长笛一声何处。","note":"笛声远远传来，却找不到吹笛的人。闲适的画面到这里变得空远，隐约带出一点孤独和若有所失。"}],"moods":["闲适","旷达"],"caveat":"年谱只记苏轼本年作《调笑令》二首，没有具体月份、场合或赠送对象，词中的渔父是不是实有其人也无从查考。"},"352116":{"background":"元丰六年（1083），苏轼因乌台诗案贬居黄州，已是第四年。同样被贬到黄州的张偓佺，在住处西南临江的地方新建了一座亭子。苏轼给它取名“快哉亭”，名字出自宋玉《风赋》里楚王说的“快哉此风”。苏辙后来又写了《黄州快哉亭记》。这首词是苏轼在新亭上看过江景后写给亭主的，既为新亭题咏，也是在回应一位同样身处逆境的朋友。","mood":"上片写登亭的欣喜。江天开阔，又让他想起当年在扬州平山堂读恩师欧阳修词句的情景，带着一点追怀。下片风浪突然掀起，一位白发老人驾着小舟在浪中起落，很像苏轼在诗案风波之后对自己的写照。他批评宋玉把风分成贵贱，意思是人能不能感到畅快，不看地位高低，要看自己胸中的气度。这既是他在贬居中给自己找到的安顿，也有与张偓佺互相勉励的意思。","lines":[{"line":"知君为我，新作窗户湿青红。","note":"他开玩笑说朋友这座亭子是专为自己修的，连窗上油漆没干都写进去，看得出两个贬官之间亲近随意的交情。"},{"line":"忽然浪起，掀舞一叶白头翁。","note":"平静的江面上忽然起了风浪，白发老人驾着小船随浪起落，却并不慌张。这里多半寄托着苏轼自己经历宦海风波后的样子。"},{"line":"一点浩然气，千里快哉风。","note":"把亭名“快哉”落到人身上：只要心中有一股正气，被贬的人照样能享受千里长风，这是自勉，也是赠给朋友的话。"}],"moods":["旷达","豪放"],"caveat":"写作月份难以确定，编年资料定为元丰六年六月，但苏辙《黄州快哉亭记》作于同年十一月，所以这首词究竟写于亭子刚建成时还是稍后，并不清楚。张偓佺即张梦得（字怀民）是通行说法，但也有学者提出不同意见。"},"352100":{"background":"苏轼贬居黄州时，常渡江到对岸的武昌，去蜀人王齐愈（字文甫）兄弟家做客。这一天他在王家喝自酿的白酒，喝得大醉，趁着酒兴画了一幅墨竹，又从杜甫、白居易等人的诗里摘句拼成这首词，题在画上，当作赠给主人的画和题跋。这首词不为送别或怀人，只记下朋友家一次随兴的酒席和挥毫。","mood":"整首词轻松愉快，带着醉后的得意和玩笑。苏轼借现成的古诗句写竹子的清新、竹荫的凉意，又拿唐代画竹名家来比自己，是酒桌上的自夸和自娱。此时他的贬谪身份并没有改变，但在黄州住了几年，已经有几位可以随意往来的朋友。这首词看不到愁苦，看得到他在困境中把日子过得有滋有味的能力。","lines":[{"line":"人画竹身肥拥肿。","note":"借白居易的诗句，说一般人画竹，竹竿画得又粗又笨，没有竹子的清瘦挺拔。这是为下一句自夸作铺垫。"},{"line":"先生落笔胜萧郎。","note":"萧郎指唐代以画竹出名的萧悦。说自己下笔比萧悦还好，醉后的得意中带几分玩笑，也是对主人的一句逗趣。"},{"line":"月和疏影上东墙。","note":"结尾转回记忆：某个安静的夜晚，月光把竹影投到东墙上。画竹的灵感来自平日的细心观看，语气也从热闹转为清静。"}],"moods":["闲适","咏物"],"caveat":"词题自署“元丰五年”（1082），所给年谱却系于元丰六年（1083），两说不一，这里暂按年谱所系；结句“月和疏影上东墙”出自哪首古诗，我不能确定。"},"352122":{"background":"元丰六年夏，苏轼因乌台诗案贬居黄州已是第四年。他挂着团练副使的虚衔，不能过问公事，一家人靠开垦东坡过活。这首词没有题赠对象，也看不出是哪次聚会上写的，更像是一夜大雨之后，他傍晚独自拄杖到村舍、古城一带散步，随手记下的所见所感。这年春天他病了很久，外面甚至传出他已经病故的消息，所以到了夏天还能这样慢慢走一圈，对他来说也不算小事。","mood":"词里的心绪是安静的知足。蝉声乱、草已衰，他并不嫌弃，荷花淡淡的香气也注意得到。结尾说昨夜的雨“殷勤”，好像老天特意照顾他。但“浮生”和“又得一日”透出另一层意思：日子是一天一天过下来的，前途由不得自己，能拿到手的只是一点凉意。贬居几年后，他学会从眼前的小事里找安慰，这份闲适里有满足，也有说不出的无奈。","lines":[{"line":"乱蝉衰草小池塘","note":"写的不是精心挑过的好景致，而是乡间随处可见的嘈杂和衰败，他照样平心静气地看在眼里。"},{"line":"杖藜徐步转斜阳","note":"拄着藜杖，慢慢走到夕阳西斜。没有公务，也没有要赶去的地方，这是贬官难得的清闲，也带着几分寂寥。"},{"line":"殷勤昨夜三更雨，又得浮生一日凉","note":"把夜雨当成殷勤待他的人，心怀感激。说“又得一日”，可见他已经不求长远，只珍惜眼前这一天的舒服。"}],"moods":["闲适","旷达"],"caveat":"这首词没有题序，词里也找不到能确定年月的证据，系于元丰六年夏主要是根据黄州乡居的景物推定的，各家编年略有出入；年谱同期所记的与张商英通信等事，和这首词没有已知的关联。"},"352120":{"background":"苏轼因乌台诗案贬到黄州，已是第四年。这年重阳，他登上黄州的栖霞楼饮酒过节，当天下着小雨。栖霞楼在城南江边，是前任知州闾丘孝终所建。登楼过节让他想起五年前在徐州的重阳：那年他刚领着全城抗住洪水，又建成黄楼，重九大宴宾客，非常热闹。这首词就把当年的盛会和眼前的冷清放在一起写。同席有哪些人，史料没有明确记载。","mood":"开头说凄凉，后面转为自我宽解。从徐州知州到戴罪的团练副使，处境差得很远。词里不回避这一层，但没有停在里面：菊花没开就不必遗憾，有人劝酒就喝，也不必像杜甫那样拿着茱萸担心明年还在不在。最后把个人的得失放进古往今来里看，一抬头一低头之间就成了往事。这种由失落转向放下的过程，正是他在黄州几年里慢慢磨出来的心态。","lines":[{"line":"当年戏马会东徐。今日凄凉南浦。","note":"拿元丰元年徐州的重阳盛会，对比今天贬居江边的冷清。两句并排放着，不加评论，落差自己就显出来了。"},{"line":"莫恨黄花未吐。且教红粉相扶。","note":"节令到了，菊花却还没开。他劝自己别为这个遗憾，有歌女劝酒就先喝下去，这是有意给自己找点宽慰。"},{"line":"酒阑不必看茱萸。俯仰人间今古。","note":"化用杜甫“醉把茱萸仔细看”，意思是不必去担心明年还在不在。古今的盛衰也就是一俯一仰之间，个人的荣辱更不值得挂念。"}],"moods":["感时","旷达"],"caveat":"本词编年有元丰五年（1082）和元丰六年（1083）两说，这里按六年写。同游的人不详。年谱本年所记乐京来访一事与这首词无关。"},"352119":{"background":"君猷是徐大受的字，当时任黄州知州。苏轼因诗案贬到黄州，是受监管的罪官，徐君猷却待他宽厚，常请他饮酒游宴，几年间是他在黄州最重要的照应者和朋友。徐君猷任期将满，要离开黄州，苏轼在饯别的酒席上写了这首词相送。词从席上哭泣的女子写起，看得出是宴席上当场写成的。","mood":"词面上很热闹：劝人不要哭，又预想明年春天江边船多、满城笙歌。真正的心事在中间两句，苏轼称自己是雪堂坡下的老农，说最难过的其实是他。一个贬谪之人失去了地方长官的照拂，往后怎样还不知道，这份凄切不是客套话。他却用轻松、略带自嘲的口气说出来，这是他在黄州时常用的应对方式。","lines":[{"line":"红粉莫悲啼，俯仰半年离别。","note":"劝席上的女子不要哭，转眼就要分别了。“半年”多理解为离别前剩下的时日，也有人认为指相聚的时间短。"},{"line":"看取雪堂坡下，老农夫凄切。","note":"苏轼自称东坡下种地的老农，说比起你们，我才最伤心。贬官躬耕的身份和对徐君猷的依恋，都在这一句里。"},{"line":"从此满城歌吹，看黄州阗咽。","note":"想象送行那天全城歌乐喧闹，写出徐君猷在黄州很得人心，也暗示人走以后的冷清。"}],"moods":["送别","自嘲"],"caveat":"年谱把这首词系在元丰六年八月，但词中“半年”“明年春水”所说的离别时间不太好对应，徐君猷具体哪一年离开黄州也有不同说法。"},"352124":{"background":"元丰六年腊月初八，苏轼在黄州贬所，到张怀民的小阁饮酒。张怀民这年也被贬到黄州，两人往来频繁，十月的承天寺夜游就是同他一起。上片称颂一位将门、相门之后，说他像王子乔一样本该在仙界，将要乘鸾归去、赶上新年。看来席上有人即将离开黄州回朝，这首词是在节日酒席上为他作的饯别兼应酬之作。","mood":"前面大半是客气的颂扬，又写小阁里香暖、腊八天微寒，气氛热闹安适。到最后一句才说到自己：将来你在华堂上喝醉时，别忘了江边那个憔悴老去的旧友。苏轼贬居黄州快满四年，回朝没有指望，眼看别人能走，羡慕和自伤都有。他说得很克制，只托付一句“莫忘”。","lines":[{"line":"闲驾䌽鸾归去、趁新年","note":"把对方离开黄州说成仙人从容乘鸾而去，还正好赶上新年。说得轻快，衬出自己走不了。"},{"line":"烘暖烧香阁，轻寒浴佛天","note":"实写当天情景：阁里焚香取暖，外面是腊八浴佛节的微寒。酒席上这片刻的温暖安闲很真切。"},{"line":"莫忘故人憔悴、老江边","note":"从颂扬别人转回自身，“憔悴”“老”是苏轼对自己贬居处境的直白自况，带着请求对方别忘了他的意思。"}],"moods":["送别","羁旅"],"caveat":"题目说饮于张怀民小阁，但张怀民此后仍留在黄州，上片所颂、将要“归去”的人是否就是他，还是席上另一位出身显贵的客人，学界说法不一，具体是谁难以确定。"},"352115":{"background":"元丰六年（1083），苏轼贬居黄州已是第四年。黄陂有位姓王的前官员，三十三年前就弃官隐居，当地人称他“黄先生”。这次他陪苏轼的老友陈慥（季常）往江南去，顺路到苏轼住处来访。三人饮酒谈到天亮，分别时苏轼写了这首词。词主要写给王先生，陈慥是促成这次见面的人。","mood":"苏轼是获罪被贬的人，名义上还挂着官职。面对一位主动弃官、在乡间住了三十多年的老人，他的敬重里带着几分惭愧和向往，所以拿长江、经霜的老桧来比他。下片写眼前：雨过林动，酒要喝干，灯快灭了，人也老了，天一亮船鼓就催人上路。这样的相聚难得又短，惜别之情和衰老之叹，都和他困在黄州、少有人来往的处境分不开。","lines":[{"line":"三十三年，今谁存者，算只君与长江。","note":"三十多年人事变换，在苏轼看来，始终守住本色的只有王先生和眼前的长江。这是很重的推许，也含着对世事无常的感慨。"},{"line":"居士先生老矣，真梦里、相对残釭。","note":"“居士”是苏轼自称，“先生”指王长官。两个老人整夜对着快灭的灯，相逢恍如梦中，高兴里也有伤感。"},{"line":"歌舞断，行人未起，船鼓已逄逄。","note":"酒席刚散，赶路的人还没起身，开船的鼓声已经响了。话没说完就得分手，惜别之意全在这一句。"}],"moods":["送别","旷达"],"caveat":"年谱只把此词定在元丰六年，参考赏析所说的“五月”找不到别的依据；王长官的名字和生平都不清楚，“江南岸”一句指的是谁的所在，各家理解也不一致。"},"352123":{"background":"元丰三年，苏轼因乌台诗案被贬到黄州，挂着团练副使的空衔，不能过问公事。这首词作于元丰五年或六年的暮秋，具体是哪一年还定不下来。当时重阳刚过，新酒开坛，他在东坡开荒种地已有一两年，日子清闲，手头也紧。词里没说是为谁写的。从“扶翠袖”看，可能是有歌女劝酒的小型酒宴，但同席有谁、为什么聚会，现有材料都没有记载。","mood":"表面上是醉后的放达：功名得失像一场梦，醉中就是故乡，在东坡的日子过得悠长。不过把官位看作“傥来”之物、当成梦，是经历诗案、差点丢了性命的人才说得出的话。“日月长”有悠闲的一面，也有被闲置、不知何时能回去的漫长。结尾染黑白胡子硬充年轻，自称狂夫，还说越老越狂，既是自嘲，也是不愿被处境压垮的倔强。","lines":[{"line":"身外傥来都似梦，醉里无何即是乡。","note":"“傥来”出自《庄子》，指偶然得来的身外之物。官职得失好比一场梦，醉中那片虚无之地倒成了归宿，可见诗案之后他对仕途看淡了。"},{"line":"东坡日月长。","note":"东坡是他开垦耕种的那片荒地，他也拿它做了自己的号。日子漫长，一半是闲适，一半是贬官无事可做、归期无望的滋味。"},{"line":"强染霜髭扶翠袖，莫道狂夫不解狂。","note":"把花白胡子染黑，扶着劝酒的歌女。一个“强”字露了底：老态遮不住，这份狂放里带着自嘲。"}],"moods":["旷达","自嘲"],"caveat":"这首词作于元丰五年还是六年的暮秋，目前没有定论；词是写给谁的、在什么酒宴上写的，也没有记载可查。"},"352266":{"background":"元丰六年，苏轼在黄州贬所已住到第四年。年谱只说这首词是为了“怀采菱、拾翠”。从词意看，采菱、拾翠应是两个女子的名字，多半是某位“使君”（州郡长官）家中待客的歌伎，苏轼大概在宴席上见过她们，事后写词戏赠或追忆。至于是哪一家的歌伎、在哪次宴会上相识，现有材料都没有记载，无法确指。","mood":"这是一首游戏性质的艳词：每句都嵌进“采菱拾翠”四字，夸她们名字好、模样新，说到亲昵处毫不避讳，调子轻快。黄州的日子清苦，苏轼一边躬耕东坡，一边也与地方官员往来宴饮。这类酒边逢场的作品，看得出他在困顿中仍有余裕说笑。不过它只是应酬性的轻松文字，不宜读出太多身世寄托。","lines":[{"line":"采菱拾翠，算似此佳名，阿谁消得。","note":"开头先拿名字做文章：这样好听的名字，谁配得上？用夸名字的办法夸人，口气是席间开玩笑的口气。"},{"line":"采菱拾翠，称使君知客。","note":"说她们正衬得起主人好客。这里点出她们是“使君”家里出来待客的人，可见词是在宴会上或宴会之后写的。"},{"line":"采菱拾翠，待到京寻觅。","note":"结尾说等到了京城再去找她们。对一个戴罪贬居、不能随意离开的人来说，这话更像随口的戏言，也透出几分对远方的念想。"}],"moods":["艳情","怀人"],"caveat":"苏轼当时以罪臣身份安置在黄州，不能随意进京，“待到京寻觅”一句和这个处境对不上，所以系于元丰六年未必可靠，采菱、拾翠是谁家的歌伎也无从考定。"},"352135":{"background":"词题是“琴”，写的是一次听琴。谁在弹、在什么场合，词里没有说，年谱和苏轼文集中也找不到对应的记载，不宜猜测。按这里的编年，此词作于元丰七年春，这时苏轼贬居黄州已是第五年。一般认为这年春天他接到移官汝州的命令，四月离开黄州，但没有证据表明这首词与此事有关。能确定的只有一点：他在静夜里听人弹琴，回去后久久不能入睡，于是写下了这番感受。","mood":"整首词的心绪安静而深沉。开头先写听琴的人心神安定，四周也随之寂静，琴声这才能真正听进心里。接着说琴音传出一种寥落而悠远的古意，最后写余音整夜不散。黄州这几年，苏轼常借山水、佛道和琴书来安顿自己，词中这种向内收敛、细细体会的状态和他当时的生活相合。“寥寥”二字带一点孤寂，也有心意相通的慰藉，但不宜直接读成对身世的感叹。","lines":[{"line":"未动宫商意已传。","note":"手指还没拨出音调，意思已经传过来了。说的是弹琴人和听琴人心意相通，看重的是琴声之外的意味，而不是指法技巧。"},{"line":"悲风流水，写出寥寥千古意。","note":"“悲风”“流水”可以看作琴曲名，也可以看作对琴声的形容，“流水”还暗含伯牙、子期的知音故事。琴声写出的是一种寂寥而久远的情怀。"},{"line":"一夜馀音在耳边。","note":"回去后一夜没睡，琴声好像还在耳边。可见这次听琴触动很深，也透出他夜里独自回味时的安静心境。"}],"moods":["咏物","闲适"],"caveat":"这首词的编年各家说法不一，弹琴的人和当时的场合都没有记载，作于元丰七年春的说法只能作参考。"},"352252":{"background":"元丰七年三月，苏轼贬居黄州已是第五年，身份仍是不能过问公事的团练副使。词题叫“感旧”，但没说怀念的是谁、是哪件旧事。年谱只记了写作月份，具体对象和场合已经无从确知。可以参照的是，这年春天朝廷下令把他移往汝州安置，他四月便离开黄州。这首词很可能写在这段去留未定、又要搬迁的日子里。","mood":"上片连用三个魏晋人物的典故。徐邈、刘伶借酒放达；潘岳和夏侯湛当年并称“连璧”，如今却不知道和谁并肩，透出老朋友四散的寂寞。下片转回自己：白发新添，想回故乡的青山，却连买山隐居的钱都没有。这种牢骚里带着自嘲，和他在黄州开荒种地、家用拮据，又将被迁往他处的处境正好对得上。","lines":[{"line":"潘郎白璧为谁连","note":"潘岳与夏侯湛常一同出游，时人称为“连璧”。问“为谁连”，是说当年并肩的朋友早已分散，自己独自留在贬所。"},{"line":"无可奈何新白发","note":"将近五十岁，白发一根根新添，挡也挡不住。“无可奈何”说得直白，是对年华在贬谪中耗掉的无力。"},{"line":"恨无人借买山钱","note":"用支遁想买山隐居的典故。想归隐却没钱置地是实情，他后来请求改居常州，理由之一正是汝州没有田产。"}],"moods":["自嘲","怀人"],"caveat":"“感旧”指的是哪些人、哪些事，各家理解不一；本词与移汝州之命的关联只是推测，年谱中没有明确记载。"},"352137":{"background":"苏轼因乌台诗案贬居黄州已有五年。元丰七年，朝廷下令把他调到离京城较近的汝州，但他的身份仍是团练副使，不能参与公事，处境并没有真正好转。四月一日临行前，他与雪堂附近交往多年的几位邻居告别。正好李仲览从江东赶来送行，他就写下这首词，留给这些朋友。","mood":"词里有两层心绪。一层是年近五十、故乡远在四川却回不去的无奈：他开口就说要“归去”，紧接着却问自己能回到哪里。另一层是舍不得黄州。五年来他在这里开荒种地、结交乡邻，早把这里当成了半个家。去汝州并不是他自己选的，他只能说到了那里“闲看”洛水，用随遇而安的态度消解身不由己的苦处。","lines":[{"line":"百年强半，来日苦无多。","note":"他这年四十九岁，人生已过大半。这时又被一纸调令推着上路，感叹的是余下的日子不多，却仍然做不了自己的主。"},{"line":"山中友，鸡豚社酒，相劝老东坡。","note":"乡邻用自家的鸡、猪和社日的酒招待他，劝他干脆在东坡住到老。这是贬居岁月里最实在的温暖，也让离开变得更难。"},{"line":"好在堂前细柳，应念我、莫剪柔柯。","note":"他托邻居别剪雪堂前的柳枝，像出远门的人交代家事，话里藏着还想回来的念头。只是能不能回来，并不由他决定。"}],"moods":["送别","旷达"],"caveat":"词序中的李仲览生平不详，年谱所记的“李廷评”是不是同一个人，目前无法确定。"},"352330":{"background":"元丰七年，苏轼离开住了四年多的黄州，奉命改任汝州团练副使，身份仍是贬官。他沿长江东下，九月到了宜兴，古称阳羡。他早就想在这一带养老，这次在宜兴买了田。不久又上表，请求不去汝州，改在常州居住。这首词没有明确的赠送对象，看来是他游览当地山水古迹时写给自己的，借景说出想在这里安家的打算。","mood":"上片写山水、仙洞，又想起在这里斩蛟除害的周处。长桥还在，人早已不在。下片转到自己：想辞官买田，和渔夫樵夫喝酒过日子。结尾借陈登看不起“求田问舍”的典故，反过来说自己，承认少年意气已经磨掉了。经过乌台诗案和黄州几年，他对仕途确实累了。但这几句带着自嘲，并不全是消沉，有无奈，也有终于能落脚的安心。","lines":[{"line":"临风慨想斩蛟灵","note":"站在周处斩蛟的长桥边，想起前人少年改过、为乡里除害，对照自己半生起落，心中感慨。"},{"line":"求田问舍","note":"不只是说说而已，苏轼此行确实在宜兴置了田产，打算远离官场，在这里终老。"},{"line":"元龙非复少时豪","note":"陈登当年鄙视只顾买田置屋的人，苏轼却说自己已不是那样的豪士，自嘲里带着倦意。"}],"moods":["自嘲","悲慨"],"caveat":"这首词的作者有争议，不少词集把它归在贺铸名下，参考赏析也是按贺铸来解读的；各本文字也有出入，比如“真游”有的作“直游”，“洗尽”有的作“清净”。本文依年谱，系于苏轼元丰七年的宜兴之行，读者不妨存疑。"},"352140":{"background":"元丰七年（1084），苏轼结束四年多的黄州贬居，奉命改任汝州团练副使，沿长江东下，再经运河北上。十一月冬至前后，他路过楚州，知州田待问设宴招待。席上，田家一名年少的侍女唱曲、跳舞助兴。苏轼先和了田待问赠给他的诗，又写下这首词送给这个小姑娘。这是宴会上应酬主人的作品。","mood":"这首词写得轻快，从少女的年纪、笑容一直写到她的歌舞，几乎看不到贬谪的阴影。这和他此时的处境有关：去汝州仍是闲职，但能离开黄州，说明处境已经开始松动；沿途又常有地方官和旧友接待，心情比前几年舒展。不过，这一年夏天他的幼子苏遯刚在金陵夭折。“莫唱短因缘”一句是否带着他自己对聚散的感触，只能推测，不宜坐实。","lines":[{"line":"阳城下蔡困嫣然。","note":"化用宋玉赋中“嫣然一笑，惑阳城，迷下蔡”，夸小鬟笑起来能倾倒满座。这是客人当着主人称赞他家侍女的场面话。"},{"line":"凭君莫唱短因缘。","note":"请她别唱缘分短、离别苦的曲子。宴席正欢，他又只是匆匆路过，这句半带玩笑，也透出对相聚短暂的在意。"},{"line":"曲终红袖落双缠。","note":"一曲舞罢，红袖垂落，露出一双缠足。写歌舞收场的那一刻，有欣赏，也带着宴席快散时的余味。"}],"moods":["艳情","闲适"],"caveat":"题目中的主人名，各本写法不同，也有作“田待制”的，一般认为指楚州知州田待问（字仲宣）；“短因缘”具体指什么，学界没有定论。"},"352141":{"background":"元丰七年，苏轼在黄州贬居四年多以后，朝廷将他量移为汝州团练副使。名义上调得离京城近了一些，实际仍是不得签书公事的罪官身份。他沿运河北上，冬至前后经过楚州。知州田待问以诗相赠，并设宴款待。席间田待问让家中一名年少侍女出来侑酒，苏轼先填了一首《浣溪沙》赠给她，又用同一韵脚写了这首，回应主人的好意。","mood":"开头一句把在江湖漂泊的五年说成一场梦，语气轻淡，但五年的委屈都在里面。接着写旧地风物没变，人却经历了乌台诗案和贬谪。他把这次相逢归于“前缘”，又自称“迁客”，坦然承认罪人身份，还拿自己的愁闷开玩笑。离开黄州时他刚失去幼子，前程仍不明朗，这份轻松多半是勉力撑起来的，也是对主人体贴的回应。","lines":[{"line":"一梦江湖费五年。","note":"从元丰三年初到黄州算起，前后约五年。一个“费”字带出耗掉的岁月，“一梦”又把这段经历轻轻放下，惋惜和看开都在其中。"},{"line":"迁客不应常眊氉，使君为出小婵娟。","note":"他直接称自己是“迁客”，说被贬的人不该老是愁眉不展，所以主人特意叫侍女出来劝酒。这是自嘲，也是在谢主人的照顾。"},{"line":"翠鬟聊著小诗缠。","note":"按当时的风气，席上要给歌女送缠头礼。苏轼身为贬官，手头拮据，只能送一首小诗缠在她的发鬟上，权当谢礼，语气诙谐，又有点寒酸。"}],"moods":["自嘲","旷达"],"caveat":"有的编年把这首词系在元丰七年十二月；“归来”具体指哪一次旧游，也难以确考。"},"352058":{"background":"元丰七年，苏轼离开住了四年多的黄州，奉命改任汝州团练副使。他沿长江东下，经过金陵、真州一带，年底北上到泗州，住处就在淮河边。他不想去离家人和田产都很远的汝州，这时已在宜兴置了田，正上表请求准许在常州居住。这首词是他在泗州登上淮山楼时写在楼上的，词中没有提到赠送的对象，抒发的是他自己向北赶路时回望江南的心情。","mood":"词里没有激烈的悲叹，主要是一种牵挂和依依不舍。他一边向北赶路，一边心里还想着江南。他刚刚摆脱贬居的拘束，前途还不明朗：能不能回到吴中安家，要等朝廷批准。所以他向吴地的云作揖，像在向想要安家的地方告别，又像是和它约定。最后一句想象两天后松江上的满月，说明他人虽然往北走，心还留在南方。","lines":[{"line":"举手揖吴云，人与暮天俱远。","note":"在楼上朝东南方向拱手，向江南的云告别。黄昏的天越来越远，自己离那里也越来越远，写出了他北上时一步步离开江南的感觉。"},{"line":"魂断。","note":"两次重复，语气很急。他舍不得的是刚看中、准备安家的吴中，又不知道请求能不能被批准，所以心里格外怅惘。"},{"line":"后夜松江月满。","note":"他想象过两天的夜里，松江上会有一轮满月。他自己已经看不到了，只能想一想。这样收尾，舍不得的心情就留在了想象的景色里。"}],"moods":["羁旅","思乡"],"caveat":"年谱这一条没有直接记录这首词。把它系在元丰七年年底的泗州，是根据词中的淮河、汴水、吴云推断出来的，有的注本对写作的具体时间看法不同。“后夜”是不是指两天后的月圆、松江一句是否暗指某位朋友，目前也难以确定。"},"352145":{"background":"元丰七年（1084）苏轼奉命由黄州移汝州，离开黄州后一路东行。途中幼子苏遯在金陵夭折，他手头拮据，正上表请求改在常州居住。年底停在泗州，等候朝廷答复。据词前小序，十二月十八日他在泗州雍熙塔下洗澡，一时兴起写了两首《如梦令》，这是第一首。词不是写给哪个人的，是在澡堂里对着替他搓背的人开的玩笑。","mood":"词写得轻松，是浴中逗趣，底子是佛家“不垢不净”的道理：水和污垢都没有实在的本性，人本来也无所谓脏。这一年他刚从五年贬居中脱身，前途仍未落定，又遭丧子之痛。他不说苦，而是拿搓背这样的小事打趣自己，借佛理把身外的狼狈看轻。这份自嘲里有他排解苦闷的老办法。","lines":[{"line":"细看两俱无有。","note":"仔细想来，水和垢都是空的，无所谓谁洗净谁。这是用佛理看寻常洗浴，语气半认真半玩笑。"},{"line":"寄语揩背人，尽日劳君挥肘。","note":"转身对搓背的人说：辛苦你一直挥着胳膊。客气里带着调侃，仿佛这番力气其实用不着。"},{"line":"居士本来无垢。","note":"东坡居士本来就没有污垢。表面是浴室里的笑话，也可以读出经历风波后对自身清白的坦然。"}],"moods":["禅悟","自嘲"],"caveat":"首句有“水垢”“垢水”两种写法；作于十二月十八日浴于雍熙塔下，依据的是通行本小序。末句是否暗指乌台诗案后自证清白，属于读者的引申，并无确证。"},"352148":{"background":"元丰七年，苏轼离开住了四年多的黄州，奉命改迁汝州，仍是不能管事的闲职。他沿江东下，年底到了泗州，淮河水浅结冰，船走不了，只好在城里滞留。一般认为他也是在这里上表，请求改到常州居住。腊月最后一天，他和眉山旧友刘仲达同游南山。两人十七岁时就有来往，隔了三十三年在异乡重逢，谈起旧事很是感慨，于是写了这首词。","mood":"词里带着自嘲，也有对老友的反问：我本来就性子疏放，和世道合不来，落到今天这样不奇怪；你又何苦在尘世里奔波？三十多年的漂泊和仕途挫折，他只用“憔悴老青衫”一句轻轻带过。岁末船被冻住，去汝州的前途也说不准，这年夏天幼子又在金陵夭折。所以游山时虽然有说有笑，结尾被问到“家何在”，心思还是落回了故乡。","lines":[{"line":"故人惊怪，憔悴老青衫。","note":"老友见他又老又憔悴，年近五十还穿着低级官员的青衫，吃了一惊。苏轼借别人的眼光看自己，话说得平淡，其实很酸楚。"},{"line":"我自疏狂异趣，君何事、奔走尘凡。","note":"他把自己的遭遇归到性情不合时宜上，算是自嘲；转头又问老友为什么也在世上奔波，同情里带着同病相怜。"},{"line":"家何在，因君问我，归梦绕松杉。","note":"老友问起家在哪里，他答不上实在的去处，只说梦里常回到长着松杉的故乡。这里的松杉也可能暗指家乡的祖坟。"}],"moods":["羁旅","思乡"],"caveat":"刘仲达的生平除词序外所知很少；“笑挽攕攕”中“攕攕”（纤纤）指同游女子的手还是别有所指，注家理解不一，这里不作定论。"},"352147":{"background":"元丰七年春，苏轼奉诏从黄州改迁汝州，职务仍是没有实权的团练副使。这一路很不顺：七月在金陵，不满周岁的幼子苏遯夭折；家里人口多，路费紧，汝州又远，他一边慢慢走，一边上表请求改到常州居住。年底他滞留在泗州。腊月二十四日，当地人刘倩叔陪他游南山，他用这首词记下这一天的游历和山中的午茶小食。刘倩叔的生平已经无从考证。","mood":"词里没有一句怨言，写的只是雨后转晴、一盏好茶、一盘野菜带来的满足。放回当时的处境看，这份平静来得并不容易：幼子刚死，去向还没定，又要在旅途中过年。正因为别的指望都靠不住，他才格外珍惜眼前这点清淡的快乐。这是黄州几年里慢慢养成的过日子的办法：愁并非没有，只是不让它占满每一天。","lines":[{"line":"细雨斜风作小寒","note":"腊月岁末，风雨里带着寒气，他只淡淡说一句“作小寒”，寒意写得很轻。一路奔波的人，已经不太把这点冷放在心上。"},{"line":"入淮清洛渐漫漫","note":"清澈的洛水流进淮河，渐渐融成一片茫茫。洛水离泗州较远，这句多半是看着淮水想到上游。有人从中读出前路漫长的意思，但这只是推测。"},{"line":"人间有味是清欢","note":"茶和野菜都是寻常东西，他却说人间真正的滋味就在这种清淡的欢喜里。这句话总结了这一天，也是他在困顿中给自己的回答。"}],"moods":["闲适","旷达"],"caveat":"泗州在宋代治所为临淮（旧城已没入洪泽湖，在今江苏盱眙一带），有的注本说是今安徽泗县；“清洛”具体指哪条水，各家说法不一；首句“小寒”有的版本作“晓寒”。"},"352133":{"background":"元丰七年春，神宗亲自下令，把苏轼从黄州调往汝州。他的身份仍是团练副使，照旧不能参与公事，只是离京城近了一些。他在黄州住了四年多，这次是真要走了。年谱把这首词系在他离开黄州的时候，看作一首告别之作。词里写夜里在江边亭子饮酒谈话，席上有女子跳京城新流行的舞，看来是送别宴上的情景。至于主人和在座的人是谁，词里没有说，现有史料也查不清。","mood":"上片借江南女子的口问“何年归得去”，下片又说“今朝始是归”，一问一答，前后呼应。调往汝州并不等于被朝廷重新起用，苏轼自己明白这一点。可他毕竟离京城近了一步，眼前又是京城样式的舞，就姑且把这一晚当作“归来”。词里有压了多年之后的一点宽慰，也有几分自我解嘲：一个被贬的人，看了一场京城的舞，就算是回家了。","lines":[{"line":"问我何年归得去","note":"女子随口一问，却碰到苏轼多年的心事。被贬黄州以后，什么时候能回去全由朝廷决定，他自己做不了主。"},{"line":"喜见京华新样舞","note":"京城流行的新舞传到江边，让离开朝廷多年的人觉得又和京城有了联系。这个“喜”字是真心的。"},{"line":"迁客今朝始是归","note":"他自称“迁客”，说今天才算回来了。其实只是调往汝州，仍在贬谪之中，这句话一半是欣慰，一半是自嘲。"}],"moods":["自嘲","羁旅"],"caveat":"作年有不同看法：年谱定为元丰七年离开黄州时所作，但“今朝始是归”也像是贬谪结束后的口气，所以也有人认为作年、作地还难以确定。"},"352149":{"background":"元丰七年，苏轼离开住了四年多的黄州，奉命改到汝州，身份仍是团练副使。这年七月，不满周岁的幼子苏遯在金陵夭折。他一路上书，请求改到常州居住，年底停留在泗州一带。在临淮，他遇到号“湛然先生”的梁姓道人。此人看上去只有二三十岁，却有人说自己小时候就见过他；他还善吹铁笛，笛声高亢，像能穿透云层、震裂山石。苏轼由此想到唐代道士司马子微和李白相遇的旧事，写成这首词，按梁公的曲调来唱。","mood":"上片写司马子微修道成仙，下片写他和李白一见相知，约好同去远游。苏轼借古人写眼前的事：梁公好比子微，他自己隐隐以同样被贬的“谪仙”李白自比。这时他刚离开贬所，往后去哪里还没有着落，又刚失去孩子，对奔波的人世已经有些厌倦。词里对成仙远游的向往，多半是在给自己解闷。语气潇洒，底下有漂泊无依的疲惫。","lines":[{"line":"行尽九州四海，笑纷纷、落花飞絮。","note":"表面写仙人走遍天下，看人间纷扰就像落花飞絮。其中也有苏轼自己的影子：多年奔走宦途，起起落落，到这时多少能一笑置之了。"},{"line":"临江一见，谪仙风采，无言心许。","note":"写子微在江陵初见李白，不用多说就互相认可。苏轼借此写自己和梁公相遇时的投缘，“谪仙”二字也暗合他自己被贬的身份。"},{"line":"待垂天赋就，骑鲸路稳，约相将去。","note":"等文章写成、成仙的路走稳了，就相约一起离开人间。这是对超脱的向往，也透露出他眼下前路未定、想从现实中抽身的心情。"}],"moods":["旷达"],"caveat":"注释所引词典说“赤城居士”指宋人罗适，但按词序，这里应当是写司马子微，并借他来比梁公。各版本文字也有出入，如“蓬山”有的作“道山”，“风驭”有的作“凤驭”。湛然先生梁公的生平不详。"},"352139":{"background":"元丰七年，苏轼结束四年多的黄州贬居，奉命改任汝州团练副使，赴任途中经过江宁。恰好王益柔（字胜之，题中称“龙图”，指他带龙图阁的职名）新任江宁知府，据词题说只到任一天，就又接到调令改知南都。两人此前同游蒋山，有诗唱和。苏轼在赏心亭为他饯行，写了这首词送他，还题在白鹭亭的柱子上。","mood":"上片从金陵这座六朝旧都写起，凭吊兴亡，境界开阔；下片转成玩笑，把王胜之写成乘鸾驾雾的仙人，连白鹭洲的白鹭也留不住他。称赞里带着诙谐，送别却不伤感。这份轻松或许和苏轼当时的处境有关：他刚离开黄州，下一站还没有着落，自己也是路过江宁的人，看朋友来去匆匆，更容易用一笑来体谅对方，也宽慰自己。","lines":[{"line":"从公一吊兴亡处","note":"跟着王胜之登高凭吊六朝兴亡。两个匆匆过客面对千年旧都，一时感慨，也暗含人事无常。"},{"line":"江南父老留公住","note":"写当地百姓挽留新到的长官。他上任才一天就要走，这句既是客气的称颂，也带着惋惜。"},{"line":"非吾侣，翩然欲下还飞去","note":"借白鹭说话，白鹭刚要落下又飞走了，好像在说“这里不是我的同伴”。用玩笑点出王胜之留不住，语气轻快。"}],"moods":["送别","旷达"],"caveat":"词题作“移南郡”，年谱作“移南都”，通常认为指南京应天府（今河南商丘），“南郡”可能是版本差异；“视事一日”出自词题自述，没有其他史料可以核实具体日期。"},"352143":{"background":"元丰七年，苏轼在黄州贬居四年多后，奉诏改迁汝州，于是沿长江东下，再转入运河北上。好友秦观从高邮一路陪送二百多里，到淮河边才分手。两人上一次同游是元丰二年在湖州一带，不久苏轼就因乌台诗案入狱，此后五年未能见面。这时秦观几次应考都没有考中，仍是布衣。这首词是两人在淮上分别后，苏轼在船中写给秦观的。","mood":"词里最显眼的是离别的愁苦，但心事不只这一层。苏轼刚离开贬所，往后如何仍不清楚；西行要去的汝州是朝廷指定的地方，不是他自己想去的。久别的知己相聚没几天，又要各走各的路。末两句把这份烦恼怪到识人的眼光上，表面是埋怨，其实是看重两人的相知，也替秦观有才却还没被任用感到不平。","lines":[{"line":"只载一船离恨、向西州。","note":"汴水向东流去，他的船却逆水往西走。离愁被说成装满一船的货物，写出他独自去汝州、离老朋友越来越远的孤单。"},{"line":"酒味多于泪。","note":"回想当年在湖州一带同游，喝酒的欢乐多过伤感。如今经过诗案和贬谪才重逢，转眼又要分开，言外之意是今天泪比酒多。"},{"line":"谁教风鉴在尘埃。","note":"像是怪自己当初偏偏在尘埃中认出秦观，结下这份交情，才有今天分别的苦。是反话，底下是珍惜，也惋惜他还没得志。"}],"moods":["送别","怀人"],"caveat":"“西州”旧注有说是扬州的，多数研究者认为只是泛指苏轼西行的目的地；“风鉴在尘埃”指的是苏轼自己还是秦观，理解也不一致；分别的地点，年谱记在楚州，也有只说“淮上”的。"},"352157":{"background":"元丰七年（1084）春，苏轼在黄州贬居四年多后，奉命改任汝州团练副使。名义上从黄州移到离京城更近的汝州，实际上仍是没有实权、受人管束的闲职。他离开黄州一路东行，秋天到了宜兴，在善卷洞附近买下一片田庄，由蒋公裕代为张罗。此前他想在建康买田、佛印想替他在京口买田，都没有办成。他早年就和宜兴籍的同年进士蒋之奇说好以后要住在这里，这次终于买成，于是写词记下这件事，也表明自己的打算。","mood":"这首词没有贬谪诗词常见的悲愤，口气轻松，像在宣布一个早就想好的决定。经过乌台诗案和黄州几年，他对仕途已经不抱太大指望，汝州之行前途也不清楚，有一块属于自己的田地就成了实实在在的退路。词里说“只为溪山好”，又说自己懒得著书，听上去有点自我调侃，背后是想摆脱宦海漂泊、给自己安顿晚年的愿望。不久后他上书请求住在常州，可见这些话是认真的。","lines":[{"line":"买田阳羡吾将老。","note":"开头就把话说定：在宜兴买了田，打算在这里终老。对一个漂泊多年、身份仍是罪官的人来说，这是在给自己找落脚的地方。"},{"line":"来往一虚舟。","note":"“虚舟”是空船，随水漂荡、不和人相撞，出自《庄子》。他用来比喻自己：往来无心，不再计较得失。这也是他在黄州几年琢磨出来的处世态度。"},{"line":"要须风雨时。","note":"体力还够写诗，只是要等风雨天。一般认为这里暗指他和弟弟苏辙早年约好的“夜雨对床”，盼望将来兄弟俩一起归隐，但词里并没有明说。"}],"moods":["闲适","旷达"],"caveat":"有人认为在宜兴买田是熙宁七年（1074）的事，年谱认为这种说法没有根据，现在一般系于元丰七年。“风雨”指兄弟对床之约，是常见的解读，不是词中明文。"},"352144":{"background":"元丰七年，苏轼奉诏从黄州改迁汝州，仍是团练副使。这一路走得辛苦，幼子在途中夭折，盘缠也越来越紧。到年底他滞留泗州，正上表请求改到常州居住。泗州知州刘士彦款待这位过路的贬官，陪他到城外南山游玩，傍晚才回城。苏轼写下这首词记这一天的游历，也是写给主人的答谢。","mood":"上片写登山寻春、喝到半醉、在云间说笑，轻松热闹。下片天色暗下来，他把自己写成一个闲坐空山、无事可做的人，远远看着知州在灯火簇拥下过桥回城。一边清闲，一边忙碌，这里有点自嘲，也看得出他已经放下了许多。黄州四年刚结束，前路还没有定下来，他能在路上享受这半天的快乐，说明心境比初到黄州时从容多了。","lines":[{"line":"正酒酣时，人语笑，白云间","note":"山高酒酣，笑声好像飘在云里。这是长途跋涉、家中遭丧之后难得的轻松时刻，写的是眼前的快乐。"},{"line":"何人无事，宴坐空山","note":"“无事”的人就是他自己：挂着虚衔，没有公务可办。说得平淡，里面有自嘲，也带着几分闲适自得。"},{"line":"望长桥上，灯火乱，使君还","note":"知州归城，随从的灯火在桥上晃动。据宋人笔记记载，泗州禁止夜里过长桥，刘士彦读到这句怕被追究，请苏轼不要外传。"}],"moods":["闲适","自嘲"],"caveat":"年谱把这首词系于元丰七年十二月，但词中写的是“寻春”，所以也有人认为作于元丰八年正月初；刘士彦怕夜禁之事只见于宋人笔记，可以当参考。"},"352232":{"background":"元丰七年（1084）春，神宗下令把苏轼从黄州调到汝州，仍然是团练副使这样的闲职，只是离京城近了一些。苏轼四月离开黄州，沿长江东下，七月前后到江宁（今南京）。在江宁，他与退居此地的王安石见面，幼子苏遯也在这里夭折。这首咏雁词据编年作于在江宁期间，词中写到的“石头城”就在江宁。年谱没有记载这首词是为谁写的，也没有提到具体由什么事引起，所以不能确定它是赠人之作。从内容看，更像是苏轼借秋雁写自己。","mood":"整首词写一只离群的孤雁：深秋夜里，寒气很重，它独自飞过，想落到田里，刚要落下就又被风惊得飞起来。苏轼在黄州住了四年多，好不容易得到调动，到汝州仍是闲职，前途还是看不清楚，路上又失去了幼子。这时的他和那只找不到落脚处的雁很像。下片写到捣衣的女子和寄不到的书信，又加进了思念远人和羁旅的凄凉。","lines":[{"line":"乍望极平田，徘徊欲下，依前被、风惊起。","note":"雁想落到平地上歇一歇，却又被风惊起。这正像苏轼离开黄州后的处境：没有安定下来，心里还带着当年受惊吓后的余悸。"},{"line":"须信衡阳万里，有谁家、锦书遥寄。","note":"大雁飞到衡阳为止，路途遥远，谁家的书信能托它带到呢？这里有远离亲友、音信难通的孤寂。"},{"line":"仙掌月明，石头城下，影摇寒水。","note":"“仙掌”暗指京城，“石头城”就是他所在的江宁。月光下雁影在冷水中摇晃，一边望着朝廷，一边是眼前的漂泊。"}],"moods":["咏物","羁旅"],"caveat":"这首词的作者和编年历来有不同看法，有的本子不收或归入存疑作品，系于元丰七年江宁只是一种说法；词中寄托了什么，也只能推测，没有确证。"},"352217":{"background":"元丰七年，苏轼结束四年多的黄州贬居，奉命改迁汝州，身份仍是没有实权的团练副使。他沿长江东下，幼子苏遯途中在金陵夭折。此后他上表请求改在常州居住，在真州一带停留，等候朝廷答复。时值深秋，他听人说东园景色好，便去登览，写下这首词。词中看不出是写给谁的，更像是自遣。东园很可能是欧阳修写过记的真州东园。","mood":"词里有两层心绪。一层是客居他乡的漂泊感：借王粲登楼的典故，说这里风景再好，也不是自己的家。另一层是对年华流逝的惋惜：红枫、残菊让年近五十的他想到自己鬓发已白。离开黄州本来是处境转好，但去向还没定，又刚失去幼子，所以这首词并不轻快，只在结尾用一个心愿勉强宽解自己。","lines":[{"line":"虽非吾土且登楼。","note":"化用王粲《登楼赋》，明知这里不是故乡，还是姑且登高远望，透出一种无可奈何的随遇而安。"},{"line":"行尽江南南岸、此淹留。","note":"沿长江南岸一路走到这里，又被迫停下等候，既写路途漫长，也流露出前途未定、只能等待的滞闷。"},{"line":"凭仗挽回潘鬓、莫教秋。","note":"潘岳三十多岁见白发而作《秋兴赋》。苏轼想借东园美景留住黑发，别跟着秋天一起老去，明知做不到，只是自我宽慰。"}],"moods":["羁旅","感时"],"caveat":"此词系于元丰七年途经真州时，主要依据宋人所编年谱；东园是否就是真州东园，具体作于哪一天，都没有确证。"},"352248":{"background":"这首词的写作缘由，现存材料说不清。年谱只记元丰七年苏轼在黄州作《菩萨蛮》，没有说寄给谁、因为什么事。从词意看，是写给一位友人，夸他的妻子：丈夫长期不得志，她仍然守着妇德，应当得到朝廷封号。这位友人和他妻子是谁，没有可靠记载，不能硬指。苏轼这时以团练副使的身份贬居黄州，已经第五年。","mood":"整首词语气庄重而温厚，满篇是对一位女子品德的敬重，也替她的丈夫抱不平。苏轼自己困在黄州多年，身边的家人、朋友也跟着清苦，所以“先生那久困”这样的话，他说来格外有体会。夸别人的妻子贤惠，也带着他对患难中互相扶持的看重。不过字面上没有直接写自己，不宜说得太实。","lines":[{"line":"谁识蔡姬贤。","note":"借古代贤德女子作比，感叹她的好处少有人知道。语气里有替她不平，也有敬重。"},{"line":"先生那久困。","note":"说她的丈夫怎么会一直困顿下去，算是宽慰朋友。苏轼自己正在贬所，这话说来也有切身的体会。"},{"line":"汤沐须名郡。","note":"“汤沐”指朝廷封给命妇的封号和食邑。这句盼着她日后被封为郡夫人，是祝愿，也是对她品德的肯定。"}],"moods":["怀人"],"caveat":"这首词寄给谁、为什么事而作，都没有可靠记载，编年只依据年谱的笼统记录；“蔡姬”“顾彦先”具体指谁，注家也有不同理解。"},"352268":{"background":"元丰七年四月，苏轼奉命由黄州改迁汝州，结束了四年多的谪居。赴任途中，他在兴国军停留，与知军杨绘及友人陈慥、道潜等往来，这首词一般系在这段初夏旅途中。不过年谱只记他在当地「赋诗、词」，没有说这首写给谁、作于哪次聚会。词写的是闺阁中一位女子的初夏午后，看不出具体的赠答对象，可能是应景或代言之作。","mood":"词里没有贬谪的愁苦，也没有离别的感伤，只是安静地看：午睡被棋声惊醒，雨后荷叶翻动，榴花红得像要烧起来，女子用手拨弄清水。他刚离开黄州，前途还不明朗，把这种从容和当时的处境放在一起看，或许可以理解为长期谪居之后心境有所松弛。但词中没有一句直接自述，这层联系只能是推测，不宜说得太实。","lines":[{"line":"棋声惊昼眠。","note":"午后极静，连落子的声音都能把人从午睡中惊醒。写的是闲，也是静，没有需要操心的事，日子才会慢到这种程度。"},{"line":"榴花开欲然。","note":"雨后的石榴花红得像要燃起来。初夏万物正旺，词人专注地看着这份鲜亮，笔下没有一点萧索。"},{"line":"琼珠碎却圆。","note":"水珠溅散后又聚成圆珠。「玉盆」有指荷叶和指瓷盆两种说法，不管哪种，写的都是对眼前细小动静的玩味，情绪轻快。"}],"moods":["闲适"],"caveat":"此词的作年和作地都没有确证，系于元丰七年兴国军只是一种编年意见；为谁而写、在什么场合写，也没有文献可考。"},"352290":{"background":"元丰七年，神宗下诏，把苏轼从黄州改调汝州。他离开住了四年多的黄州，沿长江东下，夏秋之间到了江宁（今南京）一带。这首词写某天夜里渡江，停宿的地方望去像是秦淮河。词里说有一位“王谢女”追随他过了江，两人却没能在一起。这位女子是谁，是真遇到的人还是梦里的人，史料都没有记载，只能从词句里看出是一段短暂又落空的相遇。","mood":"整首词贯穿着一种恍惚：自己在哪里不能确定，笛声听着哀伤，心里想的事又办不成。苏轼刚结束贬居，前面的去处也说不上安稳，正在江上漂着。这时候碰上一段来不及开始就结束的缘分，那种身不由己、好事难成的失落，和他眼下被公事推着赶路的处境正好合在一起。","lines":[{"line":"昨夜渡江何处宿，望中疑是秦淮。","note":"夜里过江，连住在哪儿都说不清楚，只觉得像是秦淮河边。开头就带出一路漂泊、看什么都不太真切的感觉。"},{"line":"云雨未成还又散，思量好事难谐。","note":"刚有了一点情意，就已经要分开。他回头细想，承认美好的事本来就难以如愿，语气里有怅惘，也有几分认命。"},{"line":"想伊归去后，应似我情怀。","note":"不说自己有多难受，而是去想对方回去以后，大概也和自己一样惦记着。把心事放到对方身上，显得更加含蓄。"}],"moods":["艳情","羁旅"],"caveat":"这首词编在元丰七年途经江宁时，依据的是后世学者的编年，并没有确切的本证。词中女子的身份，以及这次相遇是实有其事还是借桃叶渡的典故虚写，都已无从考证。"},"352151":{"background":"元丰七年，苏轼结束五年黄州贬居，改任汝州团练副使，一路北上。他已在宜兴买了田，上表请求改在常州居住，到这年元宵还没有得到答复，只能继续往北走。正月十五，他路过宿州（年谱推测在州治符离），正赶上当地上元节，官府出游、张灯，他也被拉去饮酒观灯，写下这首即兴的节日词。陪他同游的主人是谁，现存材料说不清。","mood":"词写得热闹轻快：春雨刚停，酒好灯明，歌女多情。底下却藏着一个想留下的人。他自称“江东归老客”，心思早已放在常州的田园，北上汝州并非本意。宿州这一夜的温暖让他想停一停，而“冷”字透露，前面的路在他看来是冷的。词里的欢乐是途中暂时得到的安慰，去留还没有定。","lines":[{"line":"能使江东归老客，迟留。","note":"“江东归老客”说的是他自己，一心想回江南养老。宿州的节日景象好到能让这样的人放慢脚步，可见他本来就不愿北行。"},{"line":"不似白云乡外冷，温柔。","note":"拿宿州的温情和外面的冷清对比。“白云乡”具体指什么，注家说法不一，但宿州的暖和前路的冷，意思是清楚的。"},{"line":"此去淮南第一州。","note":"宿州在淮南路的北端，从北边来是淮南的第一州，往北走就离开了淮南。这句称赞当地，也带着要离开江淮的不舍。"}],"moods":["羁旅","闲适"],"caveat":"年谱只说“或在符离”，行程和地点是推定的；“白云乡”和“淮南第一州”的确切含义，注家说法也不完全一致。"},"352138":{"background":"元丰七年苏轼离开黄州，此后一路辗转，请求在常州居住。途中他在南都依托老友张方平。胜之原是黄州知州徐君猷的侍姬。苏轼贬居黄州时，徐君猷待他很厚，后来徐君猷离任，不久病故，胜之归了张方平的儿子张恕。苏轼在张家再次见到她，旧主已不在，于是沿用前一首《西江月》的韵脚写了这首词。","mood":"词面上写胜之容貌的美和歌声的清亮，底下却是对亡友徐君猷的怀念，以及对人事变迁的感慨。苏轼刚结束黄州的贬居，前途还没有着落，自称“臞仙”，带着几分自嘲。对胜之的新归宿，他借张敞画眉的典故轻轻打趣，语气故作轻松，但开头的“泪巾”一句说明，他对黄州的旧情其实放不下。","lines":[{"line":"泪巾犹裛香泉","note":"黄州的旧梦已经随流水而去，当年擦泪的巾帕却好像还是湿的。再见到故人的侍姬，自然想起已经去世的徐君猷，悲伤又被勾了起来。"},{"line":"相如依旧是臞仙","note":"一般理解为苏轼借司马相如自比：经过几年贬谪，自己还是那副清瘦落拓的样子。话说得轻巧，却带着自嘲和沧桑。"},{"line":"走马归来便面","note":"这里用了汉代张敞的典故：张敞曾骑马过章台街，用便面拍马，又以替妻子画眉出名。正好切合新主人姓张，是在善意地调侃胜之有了新归宿。"}],"moods":["怀人","伤逝"],"caveat":"词题写的是“姑熟”（今安徽当涂），年谱却把它系在南都见张恕的时候，而且只说“或赋”，所以写作的地点和时间还有出入；胜之的身世主要出自宋人笔记，“前韵”指的是哪一首也不能确定。"},"352150":{"background":"元丰七年（1084年），苏轼结束在黄州五年的贬居，奉命改任汝州团练副使。离京城近了些，但仍是没有实权、不得自由的罪官。一路舟车劳顿，年幼的儿子在金陵夭折，家中用度也难以维持。他在常州宜兴（古称阳羡）置有田产，就上表请求到那里居住。元丰八年初走到南都时，请求得到批准。他借用离开黄州时那首《满庭芳》的开头，又写了这一篇，记下这次“放归”。","mood":"整首词的底子是放下重担后的高兴：终于能在自己选的地方安家，所以一开口就借陶渊明的话说“归去来兮”。不过高兴里还有别的东西。他快五十岁了，事业没有成就，“君恩未报”是感激，也是惭愧。回头看这些年在官场里的起落，又有隔了一辈子的感觉。最后他把自己写成衣衫破旧、被仙人取笑的渔翁，用自嘲把心里的辛酸轻轻带过去。","lines":[{"line":"老去君恩未报，空回首、弹铗悲歌。","note":"刚得到准许归田，他先想到的却是人已老了，还没报答朝廷。从前像冯谖弹剑那样发牢骚，现在回头看，只觉得白费。"},{"line":"问何事人间，久戏风波。","note":"借天上仙人的口问自己：为什么一直在人间的风浪里打转？说的是乌台诗案以来官场上的种种波折。"},{"line":"青衫破，群仙笑我，千缕挂烟蓑。","note":"青衫是低级官员的衣服，已经穿破了。他换上蓑衣做个江湖上的人，任凭仙人笑话，自嘲里透着解脱。"}],"moods":["旷达","自嘲"],"caveat":"题序写作“南郡”，年谱写作南都（今河南商丘），应以南都为准；朝廷批准的确切日期各家记载稍有出入，这里按年谱定为元丰八年正月。"},"352158":{"background":"元丰八年，苏轼结束黄州贬居后，好不容易获准在常州居住，又在宜兴买了田，打算就此安顿下来。这年三月神宗去世，朝局随之变化，苏轼很快被起用为登州知州。按年谱，这首词作于他接到任命、准备从常州动身的时候。词里没有赠送对象，是写给自己的：借溪边老人的几句私语，说出去与留之间的犹豫。","mood":"上片写月夜溪山，清静得没有一点尘埃；下片让一位乡间老人发问：何必非去做官不可？这其实是苏轼在问自己。他刚从多年贬谪中脱身，在常州有田有酒，本想退居；朝廷一召，又不得不重回仕途。词里有对闲居生活的不舍，也有身不由己的无奈。语气平和，带着几分自嘲，并没有怨气。","lines":[{"line":"更无一点尘来处。","note":"月下沙滩，白鹭安睡，四下没有一点尘俗。这是他向往的安静之地，也是他马上就要离开的地方。"},{"line":"底事区区，苦要为官去。","note":"借老人之口问：为了什么这样劳碌，非要去做官？表面上是旁人在私下议论，实际是他自己心里放不下的疑问。"},{"line":"归来分得闲中趣。","note":"有酒有田，回来就能分享闲居的乐趣。这像是老人的劝告，也像苏轼给自己留的退路，盼着将来还能回来。"}],"moods":["闲适","自嘲"],"caveat":"年谱把这首词系于元丰八年赴登州任时，但写于常州还是宜兴，“溪叟”是否真有其人，都难以确定。"},"352160":{"background":"元丰八年（1085），神宗去世后政局变化，结束黄州贬谪的苏轼被起用为登州知州，从常州一带北上赴任，途经涟水军（今江苏涟水），写下这首词赠给赵昶（字晦之）。赵晦之当时在当地做什么官，现有材料说不清楚。末句用了王乔做县令时鞋子化作双凫飞行的典故，可见对方是地方官，两人在路上匆匆见面又分别。这是一首应酬赠别的词，写在旅途中。","mood":"上片称赞涟水风物，拿它与湖州相比，显出客人对主人家乡的好意。“倦客”二字透露出连年奔波的疲惫，他想用寒泉洗掉一身风尘。下片写夜潮、月光、孤舟，热闹的鱼市和清冷的江夜放在一起。他与赵晦之相逢不久就要分手，只能大醉一场，醉后各自远去。整首词情感克制，赠别中带着漂泊的倦意。这和他经过黄州五年后重新起用、仍在路上奔走的处境相符。","lines":[{"line":"倦客尘埃何处洗。","note":"苏轼称自己是疲倦的过客。经过贬谪和多年迁徙，他满身风尘，盼着有个地方让身心清净一下。"},{"line":"倾盖相逢拚一醉。","note":"“倾盖”指路上相遇，一见如故。两人交往虽短，情意却真，所以干脆放开喝个痛快。"},{"line":"双凫飞去人千里。","note":"借王乔“双凫”的典故点出对方的地方官身份。酒醒以后两人各奔前程，相隔千里，分别的惆怅很淡，却留在心里。"}],"moods":["送别","羁旅"],"caveat":"这首词的编年有争议：这里依年谱定在元丰八年赴登州途中，另有注本定在熙宁七年（1074）由杭州赴密州途中；赵晦之当时任什么官职也不能确定。"},"352302":{"background":"元丰八年三月，宋神宗去世，朝政随之转向。此前苏轼刚获准在常州居住，又在宜兴置了田，打算就此安顿下来。到了夏天，朝廷却任命他去做登州知州，他只得带着家人北上，取道扬州、楚州，往山东海边赶路。据年谱，这首词写于楚州途中，时间正是秋天。词里写到客舍夜寒，也写到收到一封来信，但写信的是谁、为了什么事，现存材料都没有交代，只能从词意去推想。","mood":"词中是一个旅人在秋夜客舍里睡不着、想念远方的人：风冷，夜长，梦醒后满枕是泪，读了来信人又消瘦了几分。这和苏轼当时的处境对得上。他在黄州住了四年多，好不容易盼到能在常州安家，转眼又被派往千里之外的登州，刚定下的归计又落了空。前途看似在好转，词里却看不出喜色，更多的是漂泊不定带来的疲惫和牵挂。","lines":[{"line":"有客抱衾愁不寐。","note":"这里的“客”就是作者自己。他抱着被子坐在那里睡不着，客居在外的孤冷和压在心上的事都写在这一个动作里。"},{"line":"羁舍留连归计未。","note":"人困在客舍里，回去的打算还没有着落。苏轼刚想在常州、宜兴安家，转身又被派往登州，这一句说的是他眼前的实情。"},{"line":"新书报我添憔悴。","note":"新收到的信没有带来宽慰，反倒让人更憔悴。信里写了什么，词中没有说明，大概是远方亲友的近况或思念。"}],"moods":["羁旅","怀人"],"caveat":"年谱把这首词定在元丰八年秋、赴登州途中的楚州，但词中没有点明具体人事，思念的对象和写信人都不清楚，也不能排除是一首泛写相思的作品。"},"352121":{"background":"元丰二年乌台诗案，王巩（字定国）受苏轼牵连，被贬到岭南宾州监盐酒税，是受牵连的人里处罚最重的。据苏轼《王定国诗集叙》，他有一个儿子死在贬所。歌女柔奴跟着他去了岭南。几年后王巩北归，在王家的宴席上，柔奴出来唱歌劝酒。苏轼问她岭南是不是很苦，她答：“此心安处，便是吾乡。”苏轼就为这句话写了这首词送给她。","mood":"这首词表面上是夸一位歌女，底下是苏轼对王巩的愧疚和宽慰。王巩因为他吃了大苦，现在平安回来了。柔奴一句轻轻的回答，替这段苦难卸下了分量，苏轼也因此释然。苏轼自己刚从黄州贬所回到朝中，那几年也是靠随遇而安撑过来的，所以这句话他听着格外亲切，好像有人替他说出了心里的体会。","lines":[{"line":"万里归来年愈少","note":"从万里外的贬所回来，人反倒显得更年轻。苏轼故意反着常理写，既是夸柔奴，也是庆幸这一家熬过来了，语气里有如释重负的意思。"},{"line":"笑时犹带岭梅香","note":"北归要翻过大庾岭，岭上的梅花耐寒。说她笑起来还带着梅香，是把岭南的苦写成一段有香气的记忆，也暗中称赞她经得起风霜。"},{"line":"此心安处是吾乡","note":"这是柔奴的原话，苏轼几乎照录。白居易写过意思相近的句子，但出自陪人受贬的女子之口，又说给刚走出贬谪的苏轼听，分量就不同了。"}],"moods":["旷达"],"caveat":"写作年代有分歧：有人根据王巩北归的时间定在元丰六年（1083），但那时苏轼还在黄州，所以较多学者依年谱定在元祐元年（1086）的汴京。歌女的名字，词序作柔奴，有的版本词题作寓娘。字句也有异文，如“常/长羡”“年/颜愈少”“笑时/时时”。"},"352164":{"background":"元丰年间，苏轼因“乌台诗案”贬居黄州四年多，在城东一片坡地上开荒种田，并以“东坡”为号。元祐元年他回到朝廷，同年九月升任翰林学士，负责为皇帝起草诏令。据年谱和宋人傅干的注本，这首词和另一首《如梦令》一起寄给黄州知州杨寀。苏轼人在京城翰林院，借给黄州地方官写信，请对方替他向东坡那片地“带句话”，把对黄州的惦念寄回去。","mood":"词里有一种隔着远路的牵挂。他先想象自己走后东坡无人照看，大雪压住小桥，连路也断了；接着连说两声“归去”，心思已经飞到春雨后犁田的江边。这时他刚从贬官升到朝廷要职，算是翻了身，心里念着的却是种地的日子。不久朝中各派互相攻讦，他也多次请求外放。不过他终究没有回黄州，所以这声“归去”更像是对一段简朴自在生活的怀念，不一定是真打算辞官。","lines":[{"line":"人在玉堂深处。","note":"玉堂指翰林院。他身在朝廷最清贵的官署，“深处”二字也透出几分被困在里面、离田野太远的感觉。"},{"line":"别后有谁来，雪压小桥无路。","note":"他设想自己离开后东坡冷冷清清，无人来往。担心的是那块地，其实也是舍不得那段日子。"},{"line":"江上一犁春雨。","note":"春雨下透了，正好犁田。这是他在黄州亲身干过的农活，用来说明“归去”的理由，语气轻快，带着向往。"}],"moods":["思乡"],"caveat":"年谱把这首词系于元祐元年。依傅干注，只能推定作于元祐元年九月到四年三月之间苏轼任翰林学士时，具体年份不能确定。"},"352165":{"background":"元祐元年，苏轼结束黄州贬居后不久回到京城，升任翰林学士、知制诰，替朝廷起草诏令，地位从罪臣变成近臣。据年谱，这首词是他寄给黄州知州杨寀的两首《如梦令》之一，借托老朋友带话给黄州旧地。他在黄州住了四年多，亲手开荒种树，那里的田地、草堂和邻里一直让他惦记。这首词就是写给远方故人、也写给那段日子的一封短信。","mood":"词里没有直接抱怨官场，只写想象中黄州的树已成荫、结了果，自己却被鸟叫惊醒，然后连唤两声“居士”，提醒自己别忘了小桥流水。身在京城高位，事务繁重，党争已现端倪，他反而怀念贬居时清贫却自在的生活。这种怀念带着对眼前处境的疏离，也是在给自己留一条退路。","lines":[{"line":"手种堂前桃李。无限绿阴青子。","note":"想起黄州亲手种的桃李，算来如今该枝叶繁茂、挂满青果了。人不在那里，树照样长，惦念中带着时光流逝的感慨。"},{"line":"帘外百舌儿，惊起五更春睡。","note":"天没亮就被鸟叫吵醒，可能是京城早朝前的实景，也可能是梦回黄州被打断。一个“惊”字，透出睡不安稳的心境。"},{"line":"居士。居士。莫忘小桥流水。","note":"“居士”是他在黄州自号的东坡居士。连叫两遍，是自己叮嘱自己：做了大官，也别丢掉那份田园的心。"}],"moods":["怀人","闲适"],"caveat":"这组词的具体写作年份有元祐元年、二年等不同说法；“春思”这个题目可能是后人所加；“堂”具体指黄州哪处居所，也没有定论。"},"352167":{"background":"元祐二年，苏轼在汴京做翰林学士兼侍读，是皇帝身边的近臣。宋代皇帝常把建州进贡的团茶赐给近臣，“密云龙”是其中极名贵的一种。这首词写的是一次宴饮散席后，主人当众拆开御赐的茶饼，与座客分饮。词题只作“茶词”，没写为谁而作；同席有哪些人、宴会由谁做东，史料没有记载，无法确指。","mood":"上片写酒后品茶的兴奋与得意，下片转向清静：先让歌女暂留，后来连笙歌也散了，只剩庭院安静。那一年苏轼在朝中屡次封还词头，又不肯在青苗钱札子上签名，公务繁忙，人事纷争也多。词里没有提这些，只写散席后难得的一刻松快。末尾“略从容”三个字，读得出他平时并不从容。","lines":[{"line":"共夸君赐。","note":"在座的人一起称赞这是皇上赐的茶，带着身为近臣的荣耀，也是宴席上真实的欢快气氛。"},{"line":"觉凉生、两腋清风。","note":"借用卢仝饮茶诗的典故，写喝完茶后酒意退去、通身清爽，热闹之后头脑重新清醒。"},{"line":"放笙歌散。","note":"主动让乐声散去，从喧闹回到安静，可见他真正想要的是散场之后那点自在。"}],"moods":["闲适"],"caveat":"本词系年依据所给年谱定在元祐二年，也有本子编年不同；宴会主人和同席的人都不可考。"},"352322":{"background":"宋神宗于元丰八年（1085）去世，哲宗年幼即位，高太后听政，新法随即被废改，苏轼也因此回到朝中。此后朝廷把神宗的御容（画像）送往西京洛阳的会圣宫应天禅院供奉，护送的仪仗一路要奏导引乐曲。苏轼当时任翰林学士，为朝廷起草这类礼仪文字是他的本职。这首词就是为这次护送写的歌词，属于公事之作，不是私人抒怀。","mood":"全词以颂扬为主：称神宗在位十九年文武并举，在西北开边的威名还在，又借汉代旧事说今天的安定仍是先帝打下的根基，这是礼仪文字该有的口气。不过对苏轼来说，神宗是他当年反对过的变法之君，也是在乌台诗案后保全他性命、后来又把他从黄州改迁汝州的人。写这样一篇颂词，他心里或许不只是例行公事，但词中并没有直接表露，这一层只能推想。","lines":[{"line":"经文纬武，十有九年中。","note":"总括神宗在位十九年（1067—1085）的文治武功。开头用的是朝廷对先帝的标准评价，个人立场一概不露。"},{"line":"渭桥夹道千君长，犹是建元功。","note":"用汉宣帝在渭桥接受匈奴单于朝见、各族首领夹道迎候的旧事，说这份荣耀其实来自汉武帝的基业，借此暗指当今的局面靠的是神宗留下的根基。"},{"line":"人间俛仰成今古，流泽自无穷。","note":"一俯一仰之间，神宗已成了古人；人世变化得很快，他留下的恩泽却不会断绝。这是颂词的收尾，也带着几分对时光流逝的感慨。"}],"moods":["伤逝","感时"],"caveat":"神宗御容奉安会圣宫的确切时间，各家记载不完全一致；年谱此条只记了十月初一遣人到永裕陵酌献，这首词是否作于同时，目前还不能确定。"},"352233":{"background":"现存材料没有记载这首词的写作缘由，既不知道为谁而写，也没有题序交代场合。年谱把它放在元祐三年春。当时苏轼在汴京任翰林学士，官位清贵，却正被台谏官员攻击：这年正月，傅尧俞、王岩叟等人还在上书论他，朝廷一度想把相关的几个人一起调离，经执政劝阻才作罢。从内容看，这首词写的是春日在园林里带着歌伎饮酒听曲，很可能是宴席上供人演唱的应酬之作。","mood":"上片写春景，笔触细腻，心情悠闲；中段写歌舞，场面热闹，宾主尽兴；结尾忽然退开一步，说人生不过三万六千日，不如在醉中顺着自己的心意过。在繁华中抽身自省，是苏轼常有的念头。放到元祐三年看，他身居高位却屡遭弹劾、几次请求外放，“适情”二字或许带着对官场纷争的厌倦。不过这只是推测，词里没有一句直接提到朝政。","lines":[{"line":"昼永人闲，独立斜阳，晚来情味。","note":"前面写了一大段明媚春景，这里转到一个人站在夕阳下。白天漫长，人闲无事，情绪从赏景转为淡淡的寂寞，后面才转去寻欢。"},{"line":"这些百岁，光阴几日，三万六千而已。","note":"化用李白“百年三万六千日”，把一生折算成有限的天数，说得轻描淡写。全词从欢宴转入人生感慨，就在这一句。"},{"line":"醉乡路稳不妨行，但人生、要适情耳。","note":"醉乡的路走得安稳，不妨去走走；人生要紧的是合乎本心。联系他当时屡遭攻击的处境，可以读出几分想避开纷争的意思。"}],"moods":["闲适","旷达"],"caveat":"这首词的作年缺少直接证据，有的注本把它列为未编年作品。系于元祐三年只是年谱的一种处理，写作对象和场合都已无从查考。"},"352166":{"background":"元祐三年九月，苏轼在汴京任翰林学士、知制诰兼侍读。老友钱勰（字穆父，当时带待制衔）离京去做越州知州，苏轼在饯别的酒席上写了这首词，同时还写了送行诗、送了礼物。钱勰为什么离京，一般认为和他在京城任职时受到论劾有关，不过具体情形这里不作展开。这一年正月，苏轼自己也刚被台谏官员连章攻击。所以这首词既是送朋友走，也是两个处境相近的人在席间互相宽解。","mood":"这首词是劝慰朋友，心里却并不轻松。开头劝对方不要为不被赏识而感叹，又说离开时不妨走得慢一些，话里带着依依不舍。中间转到年华老去、人生无常，最后用劝酒和玩笑收住。苏轼这时在朝中官位显赫，处境却并不安稳，送别朋友时也像在看自己，所以字面上旷达，底下藏着感慨。","lines":[{"line":"与君各记少年时。","note":"两人都已年过半百，此时一起回想年轻时的样子。说的是旧日交情，也透出对年华消逝的感慨。"},{"line":"须信人生如寄。","note":"人活一世就像暂时寄住在世上，外放或留京都算不上长久。这是在开解朋友，也是苏轼在开解自己。"},{"line":"我已为君德醉。","note":"借《诗经》里“既醉以酒，既饱以德”的意思，说我不必喝酒，已经被你的人品打动得醉了。用玩笑话表达敬重和不舍。"}],"moods":["送别","旷达"],"caveat":"这首词编在元祐三年送钱勰赴越州时，是依照年谱的通行说法；钱勰这次外放的具体原因，史料记载比较简略。另外苏轼后来在杭州写的《临江仙·送钱穆父》是另一次送别，不要和这首混为一谈。"},"351972":{"background":"题目“代人赠别”说明这首词是替别人写的，写给一位将要分别的年轻女子。词中用白居易家伎樊素作比，又说她“学画鸦儿犹未就”，她大概是一位年纪很小的歌伎或侍女。替谁写、在什么场合写，史料没有记载。年谱把它放在元祐三年，当时苏轼在汴京任翰林学士，起草诏令事务繁忙，年初还受到台谏官员的弹劾。这类代言小词通常是应朋友之请写的，多半作于宴席之间。","mood":"词写的是一段离别。女子年少天真，却已经懂得愁和思念。她不看重钱财，只盼两人能长久在一起；末尾两句担心日后再相逢时人已经不在，或者已经属于别人，缠绵中带着不安。因为是代人立言，这份情感首先属于词中的两个人，不宜直接当作苏轼自己的心事。放到他此时的处境里，最多只能说：朝中党争正紧，他仍会替朋友写这样轻柔的赠别小词，这也是他在京城应酬往来的一部分。","lines":[{"line":"不爱黄金，只爱人长久。","note":"借女子之口说出临别的心愿：不贪图钱财，只希望能与对方长久相守。话说得直白，正合一个少女的单纯。"},{"line":"学画鸦儿犹未就。眉尖已作伤春皱。","note":"额上的妆还没学会画，眉头却已经因为伤春皱起来。用年纪小与愁思早的对比，写她初次尝到离别的滋味。"},{"line":"章台折尽青青柳。","note":"化用韩翃与柳氏“章台柳”的故事：柳枝被人折尽，暗指别后她可能落入他人之手，也呼应折柳送别的风俗，留下担忧。"}],"moods":["送别","艳情"],"caveat":"年谱所记为《蝶恋花·佳人》，与本篇题目不同，是否指这一首、能否确定写于元祐三年都难以断定；代谁而作、赠给哪位女子也已无从查考。"},"352169":{"background":"元祐四年（1089）春，苏轼在朝中屡遭台谏攻击，自请外任，七月到杭州任知州。这年重阳，他和苏坚（字伯固）一同过节。苏坚当时在杭州任职，与苏轼往来很密，后来还协助他疏浚西湖。苏坚先作了一首重九词，苏轼按同一词调相和，写下这首。苏坚的原作今天似已不传，当天宴席的具体情形也没有更多记载。","mood":"词的开头借古人重阳雅集自比，说自己是重情的“我辈”，带着几分名士的兴致。转到眼前，是佳人在旁，筝声渐远，秋天已过大半，最后落在一个“愁”字上。苏轼刚离开朝中纷争，在杭州得了些从容。但他已年过五十，经历过乌台诗案和黄州贬居，热闹的宴席上仍会触动年华流逝、聚散无常的感慨。这份愁并不沉重，更像节令里自然生出的怅惘。","lines":[{"line":"我辈情钟，古来谁似龙山宴。","note":"化用王戎“情之所钟，正在我辈”，又借东晋孟嘉在龙山重阳宴上落帽的故事，说我们这些重情的人今天相聚，不输古人的雅集，口气自得。"},{"line":"顾谓佳人，不觉秋强半。","note":"宴席间回头和歌女说话，才发觉秋天已过去大半。看似随口一句，透出对时光流逝的惊觉。"},{"line":"愁入参差雁。","note":"筝声远了，愁绪像是随着高低不齐的雁阵飞向远方。秋雁常带离别、思归之意，结尾含蓄，不把愁说破。"}],"moods":["感时"],"caveat":"苏坚的原唱未见流传；“而今楚甸，戏马馀飞观”一句，是借彭城戏马台的典故泛写重阳，还是暗含苏轼早年任徐州知州时的回忆，注家理解不一；“鬓云撩乱”另有版本作“鬓云吹乱”。"},"352198":{"background":"按所给编年，这首词作于元祐四年（1089）秋。苏轼因在朝中屡遭攻击而请求外任，此时到杭州任知州不久。从词意看，这是一次饯别：一位乘坐“朱轓”（太守一级官员所乘、车耳涂红的车）的官员要离开杭州，日子在重阳节前。大家拉住他的车，多留他半天，提前过节送行。被送的是谁，词中没有写，现有材料也无法确定。","mood":"整首词带着一种强撑起来的热闹。席上有歌有舞，眼前有山有湖，可秋寒、离别和节令未到，都让这份热闹显得有些勉强。苏轼刚从汴京的是非中脱身，到了熟悉的杭州，本该轻松些，但人来人往、聚散无常的感受依然很深。结尾问菊花明天为谁而开，其实是在感叹人一走，好景就没人一起看了。","lines":[{"line":"山城歌舞助凄凉。","note":"歌舞本来是助兴的，因为是送别，反而让人更觉得冷清。用热闹来写悲凉，奠定了全词的基调。"},{"line":"强揉青蕊作重阳。","note":"菊花还是青色的花苞，没有开，大家硬是把它当作重阳的花来赏，提前过节。一个“强”字，写出了想留住对方的心意，也写出了几分无奈。"},{"line":"不知明日为谁黄。","note":"客人明天就走了，菊花开了又是给谁看呢？借花问人，把舍不得的心情轻轻带出来，结束全篇。"}],"moods":["送别","感时"],"caveat":"本篇按所给年谱系于元祐四年，但多种编年本把它放在熙宁七年（1074）苏轼任杭州通判时，认为是送知州陈襄离任之作，从“朱轓”指太守来看这一说法更顺。被送对象和写作年份都还有争议，词前原本是否有题序，我也无法确认。"},"352199":{"background":"元祐四年，苏轼在朝中屡遭台谏攻击，自请外任，七月到杭州做知州。这首词写在到任后的秋天，从拒霜花（木芙蓉）、管弦、佳人斟酒这些细节看，场合应是一次地方宴集。席上有人奏起凄切的边地曲调，苏轼借酒劝慰同座，也劝慰自己。词题和同席是谁，现存材料没有明确记载，无法确指。","mood":"词里有两层情绪。一层是自觉老去，鬓发已白，又刚从朝中风波里退出来；另一层是有意把哀伤压下去，劝大家趁眼前尽兴。他用孔融留客饮酒的典故，又说不要像向秀那样听笛思旧，说明心里确有怀念故人的伤感，只是不肯任它蔓延。这种克制和他这一年先被排挤、后得以外放的处境正相吻合。","lines":[{"line":"霜鬓真堪插拒霜。","note":"白发人插上名为“拒霜”的芙蓉花，花名和衰老互相映照，带着自嘲：人已经老了，还要簪花赴宴。"},{"line":"暂时流转为风光。","note":"承认人生流转不定，此身此地都是暂时的，那就把眼前当作一段好时光来过。语气淡，底下有无奈。"},{"line":"未遣清尊空北海，莫因长笛赋山阳。","note":"劝主客别让酒杯空着，也别因为笛声就像向秀那样追念故人。越是叮嘱“莫”，越能看出他心里确有旧友之思。"}],"moods":["旷达","自嘲"],"caveat":"此词各本编年不一，也有人系于其他年份在杭州时；词中的宴会主人、同席者和“山阳”所怀的是谁都无确证，以上只是根据词意和当年处境推断。"},"352289":{"background":"元祐四年初，苏轼在朝中不断受到台谏攻击，王觌等人上奏说他不宜久留朝廷，他自己也一再请求外任。这年三月，朝廷任命他为杭州知州。十五年前他在杭州做过通判，这次是回到旧地。题作“寄远”，大约写在将要动身的时候，是托人给杭州的老朋友捎话：我要回来了。词中没有交代收信人是谁，现在已经很难考定。","mood":"全词口气轻快，像朋友之间开玩笑。他说自己急着走，是因为西湖有美人等着；又挨个问起旧人，谁记性好，谁还在写诗；最后惦记着鲈鱼脍，还叮嘱别让晚辈知道。玩笑底下也有疲惫，“白发倍当时”一句，说的是这些年的消磨。能离开纷争不断的朝廷，回到熟悉的杭州，他是真的高兴，玩笑里带着一种如释重负。","lines":[{"line":"莫怪归心甚速，西湖自有蛾眉","note":"他把出任杭州说成“归”，像是回家。拿西湖美人当借口自我打趣，把离开朝廷的无奈轻轻带过了。"},{"line":"若见故人须细说，白发倍当时","note":"他请对方转告杭州旧友：我比当年老多了。十五年间经历了乌台诗案和黄州贬居，这句玩笑里说的是实情。"},{"line":"更有鲈鱼堪切脍，儿辈莫教知","note":"借张翰思念鲈鱼、辞官回乡的典故，暗暗流露出退隐的念头。末句似乎化用了王羲之“恐儿辈觉”的话，故作神秘，把向往江南的心事说得很俏皮。"}],"moods":["怀人","自嘲"],"caveat":"写作时间是在京城将要动身时还是已在途中，难以确定；“寄远”的收信人，以及“小郑”“二南”指的是谁，也都没有定论。"},"352170":{"background":"元祐四年，苏轼因朝中党争请求外放，出任杭州知州。这首词的题目已经交代了缘由：大病初愈后，他登上西湖边的望湖楼，写了这首词送给一位“项长官”。项长官是谁、官居何职，现有材料都查不到，年谱里也没有记载这次登楼。生的是什么病同样不清楚。能确定的只是：病刚好，春夜在楼上，写给一位同僚或朋友。","mood":"这首词的基调是病后的虚弱和夜里的冷清。开头拿自己消瘦的身体自我调侃，接着写楼上的春风、花香和箫声，景色很好。可他自己酒醒梦断，躺在床上听漏声一点点滴下去，身边少了能一起赏月的人。五十多岁，身在外任，又刚生过病，这时的寂寞比平常更难排遣。写给朋友，也带几分半开玩笑的诉苦。","lines":[{"line":"多病休文都瘦损，不堪金带垂腰。","note":"拿南朝沈约病后腰围消瘦的典故比自己，说身上官带都松垮挂不住了，是对病后衰弱的自嘲。"},{"line":"酒醒梦回清漏永，隐床无限更潮。","note":"酒意散了，梦也断了，只觉得夜长漏声不止，躺在床上难以入睡。热闹过后，孤单格外分明。"},{"line":"徘徊花上月，空度可怜宵。","note":"月光在花上来回移动，这么好的夜晚却没有人一起分享，只好白白过去。惋惜之中带着孤寂。"}],"moods":["自嘲","怀人"],"caveat":"这首词的写作年份说法不一，也有人认为作于苏轼早年任杭州通判的时候；“项长官”的身份无从考证；“更潮”二字的具体含义也还不能确定。"},"352173":{"background":"苏轼元祐四年七月出任杭州知州。那时西湖被葑草大片侵占，湖面淤塞将近一半，城里的饮水井和运河都靠湖水供给。元祐五年四月，他上书请求疏浚西湖，随后招募民工挖除葑田，用挖出的泥草筑起横贯湖面的长堤，就是后来的苏堤。这首词作于治湖期间，写新渠刚通水时的湖景。词题只作“湖景”，看不出是赠给谁的，应当是他写自己的所见所想。","mood":"上片的情绪是做成一件实事以后的踏实和期待。旧湖岸边的葑田挖开了，新渠里流着碧水，他想到将来全城人家都能得到这片湖光的好处。下片转回自身：节令赶上连绵梅雨，他说余生不如交给一叶小舟。他这年五十五岁，刚从朝中的纷争里抽身出来，在杭州能为百姓办事，心里又在打算退隐。这首词里两种心思同时都有。","lines":[{"line":"会看光满万家楼。","note":"他预想湖水疏通以后，水光映满城中千家万户。这既写湖景，也写他对这项工程惠及百姓的期待。"},{"line":"记取他年扶病、入西州。","note":"这里用了东晋谢安晚年带病回京、从西州门入城的旧事。可以理解为提醒自己别像谢安那样归隐不成，也有人理解为约定年老后再回这片湖。"},{"line":"只将菱角与鸡头。","note":"他治湖时打算让百姓种菱，防止葑草重新长起来，鸡头就是芡实。这句写的是治湖的实际办法，也暗含将来泛舟湖上、只和菱芡作伴的清淡日子。"}],"moods":["闲适","旷达"],"caveat":"年谱附列的“其他事”大多是元祐四年赴杭以前的事，与这首词无关。本词按治湖时间和“佳节连梅雨”推定作于元祐五年四五月间，确切月份不能确定。“扶病入西州”一句怎么理解，历来也有不同说法。"},"352174":{"background":"元祐年间苏轼第二次到杭州，这回是做知州。西湖边有位擅长作诗的僧人清顺，住处叫藏春坞。门前两棵老松上爬满凌霄花，清顺常在树下睡午觉。一天，苏轼没带随从，独自去看他，正赶上松风吹过，花瓣往下落。清顺指着落花，请他用这个题目作词，苏轼当场写了这首。可见这是朋友间即兴应答的作品，并不是为什么大事而写。","mood":"整首词很轻松，带着点羡慕。苏轼这时正为杭州的饥荒、疫病和疏浚西湖操劳。“屏骑从”三个字说明，他是有意放下知州的排场，来僧人这里歇口气。词里看到的是古松、花香、湖风和鸟叫，主角是一个能安心睡长觉的“幽人”。苏轼身在公务里，向往的正是这份不受打扰的清闲。不过词里没有抱怨，也没有借题发泄，只是安静地欣赏。","lines":[{"line":"下有幽人昼梦长","note":"写清顺在松下午睡。“长”字里有羡慕：知州整天忙于政务，僧人却能一觉睡到天晚。"},{"line":"双鹊飞来争噪晚","note":"傍晚两只喜鹊吵个不停，四周反而更显得安静。人间的热闹，好像怎么也吵不醒树下睡觉的人。"},{"line":"时上凌霄百尺英","note":"回到清顺的题目：凌霄花攀在高高的松枝上，风一来，花朵轻轻颤动、飘落。用眼前的景色交了卷，没有多发议论。"}],"moods":["闲适","禅悟"],"caveat":"小序里的“时余为郡”可以确定这首词写于苏轼任杭州知州期间（1089—1091），但具体是哪一年哪一月没有直接证据，系于元祐五年只是一种推定。"},"352172":{"background":"元祐四年（1089），苏轼在朝中屡遭攻击，主动请求外任，七月第二次到杭州，这次做的是知州。这首词写于第二年（1090）的端午。十三楼在钱塘门外的西湖边，宋人记载苏轼在杭州做官时常在这里办公。端午这天，他和同游的人登楼饮酒，有歌伎唱曲，就在席上写下眼前的景色和热闹。词里没有交代写给谁，同游的人是谁也无从查考。这年春天，他正在筹划疏浚西湖，公务繁忙，这次登楼算是忙里偷闲。","mood":"整首词几乎没有一句写愁，满眼都是山色、水光、歌声和酒。这份轻松和他当时的处境有关：他离开了汴京的党争，回到十几年前就熟悉、喜爱的杭州，这次又是一州的长官，能为地方实实在在做些事。他拿杜牧笔下的扬州作比，说自己“不羡”，话里带着对杭州的得意。结尾写歌声把晚云留住，是兴致正浓、舍不得散场的心情。","lines":[{"line":"山与歌眉敛，波同醉眼流。","note":"把席上歌伎的眉黛比作远山，把饮者的醉眼比作湖波，人和山水连成一片，写的是节日里微醺放松的状态。"},{"line":"不羡竹西歌吹、古扬州。","note":"杜牧写过扬州竹西路上的歌吹之盛，苏轼却说不必羡慕，透出他对杭州、也对眼下这段日子的满足。"},{"line":"声绕碧山飞去、晚云留。","note":"不知谁家唱起《水调》，歌声远去，晚云却停着不走，好像天色已晚，众人仍舍不得离席。"}],"moods":["闲适"],"caveat":"这首词另有一个版本题作《游赏》。系于元祐五年端午，依据主要是“杭州端午”这个题目和十三楼的记载，并没有确证，所以不能完全排除它写于熙宁年间苏轼任杭州通判的时候。"},"352175":{"background":"元祐四年，苏轼因朝中党争请求外任，出任杭州知州。这首词作于七夕，是和苏坚的作品。苏坚字伯固，当时在杭州做官，是苏轼的下属，也是常和他互相赠诗作词的同姓朋友，后来还协助他疏浚西湖。从词题和“与君各赋一篇诗”“还将旧曲，重赓新韵”看，应是苏坚先写了七夕词，苏轼用同一词调和作。苏坚的原作似未流传下来，两人在什么场合唱和也没有记载。","mood":"开头用张骞乘木筏上天河、回来后到成都问严君平的传说。提到成都，就引出了万里之外的家乡蜀地，有一点思乡。但他很快把话题转开，说两人各写一首诗，留在织女的织机上，又说自己这些人生性自由，不受拘束。末句把七夕乞巧的热闹看作儿戏，也把人生起落一起看淡。他刚离开京城的纷争，到杭州做些实事，心情比较轻松。不过轻松之中，仍有离乡漂泊的感觉。","lines":[{"line":"乘槎归去，成都何在，万里江沱汉漾。","note":"借乘木筏上天河的传说，回来的地方却是成都。江、沱、汉、漾都是家乡一带的水，故乡远在万里之外，思乡之情很含蓄。"},{"line":"还将旧曲，重赓新韵，须信吾侪天放。","note":"意思是用旧词调来接朋友的新作，并说我们这些人天性自由，不受拘束。这既是劝朋友，也是说给自己听。"},{"line":"人生何处不儿嬉，看乞巧、朱楼䌽舫。","note":"人生到处都像小孩游戏，不如去看楼上船中女子们乞巧。把一切看作游戏，是在宽慰自己，也显出他的豁达。"}],"moods":["旷达","思乡"],"caveat":"苏轼元祐四年七月初到杭州，六年春离开。这首词一般定在元祐五年七夕，也有人定在别的年份。苏坚当时担任什么官职，各书说法略有不同。"},"351963":{"background":"元祐四年，苏轼因在朝中屡遭攻击，主动请求外任，以龙图阁学士的身份出任杭州知州。这是他第二次到杭州做官。钱塘江潮在八月十八日前后最盛，江边观潮是杭州每年的大事，这首词就是这一天观潮时写的。词题只写了日期和事由，没写同行的人，也没写要赠给谁。年谱里也没有关于这首词的具体记载，所以它是不是在观潮宴席上写成的，现在已经说不清了。","mood":"上片把同来观潮的人想成乘木筏上天的仙侣，说他们不必炼丹也能成仙。下片写潮声像雷，浪头像云，结尾希望有伯牙那样的琴师把潮的余音记下来。全篇写得轻快，想象很奇特，几乎看不到愁苦。这时他刚离开朝中的派系纷争，在杭州主持一州政务，事情很多。借观潮放开胸怀，词中那些远离尘世的想象，或许也透出他暂时离开是非之地的轻松。","lines":[{"line":"飞升元不用丹砂。","note":"说眼前的同伴本来就是仙人，用不着吃丹药求成仙。站在大潮面前，人好像已经离开了尘世。这句话带点玩笑，也写出了他的自在。"},{"line":"雷辊夫差国，云翻海若家。","note":"潮声像雷一样滚过当年吴王夫差的国土，浪头像云一样从海神的住处翻涌出来。他把眼前的壮观放进历史和神话里去写，眼界一下子开阔了。"},{"line":"写取馀声、归向水仙夸。","note":"这里借用伯牙随老师成连到海上学琴的传说，想请琴师把潮的余音谱成曲子，带回去向水仙炫耀。兴致很高，还带点孩子气。"}],"moods":["豪放","旷达"],"caveat":"这首词按所给资料编在元祐五年杭州知州任上，但附带的年谱条目没有直接提到它。苏轼在熙宁年间任杭州通判时也写过观潮诗，各家对这首词的写作年份可能看法不同；同游的人是谁也查不到。"},"352176":{"background":"元祐五年（1090）重阳，苏轼在杭州任知州。他前一年因朝中党争、受人攻讦，自己请求外任离京。这一年他在杭州忙着救灾、疏浚西湖等政务，年谱里也记着他与友人书信讨论官吏阻挠上报灾情的事。这首词是重阳节宴饮时写的。从题目只看得出节令，看不出是为谁写的。词中借汉武帝横渡汾河的典故，把思绪从眼前的杭州引向远在汴京的朝廷。","mood":"开头故作宽解：别悲秋，今年身体还好，还能参加节日宴会。接着用佛家的“空花”看待眼前的江村海景，像是看破了。下片一转到汉武帝《秋风辞》里的楼船、兰菊和白云，心思落在遥远的朝廷和过去在京城的日子上。最后只剩年年南飞的大雁，透出想念和身不由己。这种先宽慰自己、后忍不住惆怅的写法，正合他自请外放、离开权力中心又放不下的处境。","lines":[{"line":"不用悲秋，今年身健还高宴。","note":"重阳登高宴饮，先拿身体还好来宽慰自己。年过五十、身在外任，这话说得轻松，底下其实藏着对年老和漂泊的感触。"},{"line":"总作空花观。","note":"“空花”是佛经里病眼看到的虚幻花影。他把眼前江村海边的景色和热闹都看成虚幻，有意用禅理压下心里的波动。"},{"line":"空有年年雁。","note":"大雁每年按时来去，人却回不到想念的地方。一个“空”字，把前面强作的达观收成了一声无可奈何。"}],"moods":["旷达","感时"],"caveat":"作品编于1090年在杭州，依据主要是题中的“庚午”；“横汾”“楼船”是不是专指怀念朝廷和君主，学者理解不完全一致，这次宴会的同席者也没有可靠记载。"},"351990":{"background":"元祐四年（1089），苏轼在朝中受党争攻击，自请外任，出知杭州。这首词标明“再用前韵”，是接着前一首同调《南歌子》写钱塘观潮之后，沿用原韵又写的一首。时间在中秋刚过，正是钱塘江潮最大、杭州人争相观潮的时候。从内容看，这不是应酬赠人的词，而是他看过潮后借同一组韵写自己：年纪大了，去留由不得自己，自己和世道也总是合不到一处。","mood":"这首词有两层心思。一层是看淡：鬓发已经花白，人在世上不过是一粒尘沙，不如笑着看潮水涨落，就这样过完一生。另一层是清醒：他知道自己和时势一向合不拢，所以宁愿去做寻仙的方士或打鱼的渔人，或者像骑鲸的诗人那样放笔写大文章。这和他刚从朝中纷争里抽身、到地方做实事的处境正相吻合。他不再急着辩白，但也没有灰心认输。","lines":[{"line":"寓身化世一尘沙。","note":"自己寄身在这个世界上，渺小得像一粒尘沙。这句话放低了自己，也放下了对得失的执着。"},{"line":"笑看潮来潮去、了生涯。","note":"借眼前的钱塘潮说人生，起落都笑着看过去，把仕途的进退当作潮水的涨落。"},{"line":"早知身世两聱牙。","note":"“聱牙”指别扭、不顺。他坦白承认自己和世道向来合不拢，带着自嘲，也是对自己的清醒认识。"}],"moods":["旷达","自嘲"],"caveat":"编年依据“中秋过”和观潮推定。苏轼在杭州任知州时经历过元祐四年、五年两个秋天，早年任杭州通判时也多次观潮，所以具体年份难以完全确定。前一首的唱和对象也不明。“骑鲸公子”一般理解为指李白，但这只是通行解释。"},"352178":{"background":"元祐四年，苏轼因朝中党争不断，自请出任杭州知州。这是他第二次在杭州做官。这首词不是写给谁的，也查不到对应的具体事件。从内容看，是某个秋夜雨后，他在西湖上喝了酒，独自划船回去时写下的。元祐五年他正忙着疏浚西湖、修筑长堤，常在湖上往来。这首小词记下的，是公务之外一个人的片刻。","mood":"词里有两层心绪。一层是他低头看见水中自己的白发。十多年前他在杭州做通判时还是壮年，中间经历了乌台诗案和黄州贬谪，如今重来已年过半百，难免触动。另一层是醉后的放松，头巾被风吹落也不管，小船随波晃荡也不管。他没有在衰老上多停留，而是把自己交给湖水和夜色，这和他远离朝争、在地方做事的心境是一致的。","lines":[{"line":"朱槛俯窥寒鉴，照衰颜华发。","note":"倚着栏杆往下看，秋水清冷如镜，照出的是一张老去的脸和花白的头发。重回杭州，岁月的变化一下子摆在眼前。"},{"line":"醉中吹堕白纶巾，溪风漾流月。","note":"喝醉了，头巾被风吹落也不去管，只看风吹动水面，月影跟着晃。这是放下身份、不拘礼节的随意。"},{"line":"独棹小舟归去，任烟波摇兀。","note":"一个人划船回去，任凭烟雾中的水波摇晃小船。“任”字说明他不想掌控什么，只想顺着走，独处中带着一点自在。"}],"moods":["闲适","旷达"],"caveat":"此词没有确切的纪事可以参证，系于元祐五年知杭州时，主要是根据词中“衰颜华发”和西湖题材推定的，具体月份难以坐实。"},"352177":{"background":"元祐五年，苏轼以龙图阁学士任杭州知州，这一年他正忙于救灾和疏浚西湖。这年重九，他在杭州宴集时作了一首《点绛唇》，随后又用同一组韵脚连和两首；一般认为这首是第三首，专为送钱公永而作。钱公永的生平现已难考，只能从词里看出：他是席间一位有风度的年轻客人，宴会一散就要乘船远行。苏轼借宴席上的和韵，给这场送别写了一首词。","mood":"开头一句“莫唱阳关”就把离愁放到了一边。苏轼不愿把分别弄得凄凄切切，而是把目光放到远处的山川和落日上，写得开阔、克制。等到孤帆远去、雁向西飞，留恋的心情才露出来。他这时五十五岁，刚离开党争激烈的朝廷，回到自己喜欢的杭州，心境比较平和。所以送人时伤感不多，更多的是对朋友的看重，也带着一点人到中年后惯于离别的淡定。","lines":[{"line":"莫唱阳关，风流公子方终宴。","note":"宴会刚散，就劝大家别唱《阳关》那样的离歌，意思是不必伤感，让这次送别保持宴席上的潇洒。"},{"line":"北望平原，落日山衔半。","note":"送行的人站在高处远望，落日已被山遮住一半。时间一点点过去，行人快要出发，景色辽阔，心里却有些不舍。"},{"line":"我歌君乱。","note":"“乱”是歌曲末尾的收束段。这里是说我唱歌、你来收尾，两人一唱一和，可见彼此投合、交情亲近。"}],"moods":["送别","旷达"],"caveat":"钱公永的身份和生平已无法确考；“秦山禹甸”具体指哪里（是杭州、越州一带的山川，还是泛指中国大地），说法也不一致；这首词编在元祐五年重九前后，依据是它与重九两首《点绛唇》用的是同一组韵脚。"},"351991":{"background":"苏轼因与朝中议论不合，请求外任，元祐四年起任杭州知州。据宋人笔记记载，杭州有位大通禅师，戒律很严，来访的人不先斋戒沐浴，不敢进他的禅堂。苏轼有一天带着官妓去拜访，禅师当场露出不快。苏轼随即写了这首词，让同去的妓女唱出来，禅师听完也笑了。这首词就是为化解这次尴尬而写的应酬玩笑。","mood":"整首词是开玩笑的语气，借用禅宗问答的套语反过来考禅师，又说自己只是“逢场作戏”，用一句玩笑把冒犯说成游戏。当时苏轼刚离开汴京的党争，在杭州做地方官，与僧人来往多，对禅理也熟。他敢拿禅门规矩说笑，一来因为熟悉，二来是想避开官场紧张后的一点放松。玩笑里也带着一层意思：执着于戒相，也是一种执着。","lines":[{"line":"师唱谁家曲，宗风嗣阿谁。","note":"套用禅门见面时盘问师承的问话，反过来问禅师传的是哪一家，一开口就把场面从拘谨引向说笑。"},{"line":"我也逢场作戏、莫相疑。","note":"“逢场作戏”本是禅家语，意思是随缘应物、不必当真。苏轼拿来替自己辩解：带歌妓来只是随缘游戏，请师父别多心。"},{"line":"却愁弥勒下生迟。不见老婆三五、少年时。","note":"弥勒下生在极远的将来，到那时眼前的少女早已老去。这句是在逗禅师，也带出容颜易老、色相无常的意思，具体所指历来说法不一。"}],"moods":["自嘲","禅悟"],"caveat":"本事见于宋人笔记，未必完全可靠。笔记说“守钱塘”，但苏轼两次在杭州任职，一次是熙宁年间任通判，一次是元祐年间任知州，所以有学者认为此词也可能作于第一次。年谱定为元祐五年，只是大致推定。末两句的解释也有分歧。"},"352092":{"background":"苏轼因朝中党争不断，自请外任，元祐四年七月到杭州做知州。到任后，杭州旱灾、饥荒和疫病接连发生，他忙着赈济灾民、设病坊，后来又筹划疏浚西湖。这首词没有题序，看不出是为谁写的。从“使君高会”一句看，大概是清明前后一次宴集上随手写成，写的是雨后郊外的春景和寒食刚过时的节令饮食。","mood":"词里的高兴很淡：太阳不烈，风也柔和，麦子长得好，夜里的小雨把郊外洗得干干净净。做地方官的人刚经历过灾年，看见麦浪起伏，心里先踏实了，这份高兴不需要明说。结尾说这种快乐没有声音、没有滋味，叫不出名目。离开汴京的是非，在地方上做些实事，日子过得清淡安稳，这似乎正合他此时的心意。","lines":[{"line":"风和麦浪轻","note":"麦子是一年收成的指望。知州看到麦田在风里起伏，比看花更安心，这份欢喜里有地方官对农事的挂念。"},{"line":"已改煎茶火，犹调入粥饧。","note":"寒食节禁火刚过，新火已经拿来煎茶，寒食吃的饧粥却还没吃完。写的是节令交替时的家常小事，口气轻松。"},{"line":"此乐无声无味、最难名。","note":"这种快乐不靠音乐和美味，平淡得说不出名目。淡中自足，看得出他此时对清简日子的认同。"}],"moods":["闲适"],"caveat":"此词没有题序，编在元祐五年杭州是依据年谱，没有直接证据；“使君”可能是苏轼自称，也可能指同席的别位官员，现在说不清。"},"352134":{"background":"元祐四年苏轼因朝中党争不安，请求外任，出知杭州。第二年秋天，新任杭州通判袁毂到任。通判是知州的副手，旧时雅称“别乘”。袁毂能写诗，常和苏轼唱和，这首词就是写给他的。苏轼借东晋庾亮在武昌南楼月夜坐胡床、与僚属谈笑的典故，比拟自己和这位新同僚在杭州登楼赏景的情形。","mood":"上片写他以前独自倚着胡床看山，身边只有明月、清风和自己，透出几分孤单，也带着自得。下片笔调一转，说来了个通判，有诗就得和，连风月都要分走一半，嘴上像在抱怨，其实是高兴有了能谈诗的伙伴。这时他离开京城的纷争已有一年，在杭州政事之外有闲情，心情比较轻松，所以能拿同僚开这样的玩笑。","lines":[{"line":"与谁同坐。明月清风我。","note":"自问自答：陪我坐的只有明月、清风和我自己。写的是袁毂到来以前独处的清静，也有一点没人说话的寂寞。"},{"line":"别乘一来，有唱应须和。","note":"通判一到，他写了诗我就得应和。“须”字像是叫苦，其实写出了两人诗来诗往、彼此投合。"},{"line":"自从添个。风月平分破。","note":"多了一个人，原来归我一人的风月得分他一半。用打趣的口气欢迎新同伴，亲近里带着幽默。"}],"moods":["闲适","自嘲"],"caveat":"此词的写作时间和赠送对象依据本册校注考证，定为元祐五年秋赠袁毂。袁毂到杭州任通判的具体时间，各家记载略有出入。"},"352256":{"background":"元祐四年，苏轼因朝中党争不断，自请外任，以龙图阁学士出知杭州。这是他第二次来杭州做官。元祐五年他在任上忙着救灾、疏浚西湖，公务很重。这首词写的是暮春出城游赏归来后，在凉席上设酒小饮的情景。“云髻”指在座的女子，可能是侑酒的歌妓。不过词前没有小序，同游的是谁、宴饮在什么地方、因为什么事，都没有记载，只能从字面看出是一次春末夏初的寻常游宴。","mood":"上片写城里人都说看花回来了，作者却只看到一枝刚开的石榴。春花已经谢尽，夏花才刚开头，他像是来晚了一步，有点怅惘。下片转到凉席和美酒，最后劝绿叶和青果不要催促，想让满枝红花多留些时候。这时他五十五岁，刚离开纷扰的朝廷，在熟悉的杭州得到片刻清闲。他也明白季节和年华都留不住，所以这份挽留说得很轻，只是一点温和的惜时之情，并不沉痛。","lines":[{"line":"无人不道看花回","note":"满城人都赏完春花回来了，热闹已经过去。这一句写出作者姗姗来迟、春光已尽的感觉。"},{"line":"惟见石榴新蕊、一枝开","note":"百花落尽，只剩一枝石榴刚开。作者不写遗憾，只拿一点新红作补偿，看得出他随遇而安的眼光。"},{"line":"绿阴青子莫相催，留取红巾千点、照池台","note":"叶子浓密了，果子也结了，花期就要过去。他劝它们慢些，想让红花再照一照池台，是对美好时光温和的挽留。"}],"moods":["闲适","感时"],"caveat":"词无题序，写作场合与同游者均无记载。系于元祐五年杭州，是据年谱推定。题中说“暮春”，词里却写到石榴和冰簟，更像初夏景物，所以具体时令也只能大致判断。"},"352183":{"background":"元祐四年起，苏轼以龙图阁学士出知杭州。元祐六年（辛未）正月十五上元节，他在一座寺院里设宴，长老法惠在座。席间有人献上剪彩做成的花，做得很精巧，大家觉得已有初春的意思。苏轼因此写了两首《浣溪沙》，寄给没来赴会的友人袁公济，这是其中一首。词写的是节日的一场小聚，用意是把席上的热闹和玩笑告诉一位缺席的朋友。","mood":"整首词轻松，带着玩笑。东风还冷，可酒菜、剪花和月色都让他想多留一会儿。他在杭州已近两年，治水、救灾事务繁重，这样的节日聚会算是难得的放松。几个月后他就被召回朝廷，写词时未必已经知道。词里没有贬谪时那种沉重，更像老朋友之间的打趣：席上缺了袁公济，就用词把他拉进这场热闹。","lines":[{"line":"云何不饮对公荣","note":"借晋人刘公荣的典故打趣：哪有对着朋友不喝酒的道理。这是劝酒的话，也是在惦记不在席上的袁公济。"},{"line":"花影莫孤三夜月，朱颜未称五年兄","note":"上元前后有三夜灯月，别白白辜负了。下句拿年纪开玩笑，似乎在说两人相差几岁，脸色却不显老。具体指谁年长，已难确考。"},{"line":"翰林子墨主人卿","note":"化用扬雄《长杨赋》里虚设的“翰林主人”和“子墨客卿”，把自己和朋友比作宾主，在文字游戏中带出彼此的交情。"}],"moods":["闲适","怀人"],"caveat":"袁公济一般认为是袁縠，他当时的具体职任，以及“五年兄”说的是谁比谁年长，都没有定论；词序“剪袈花彩”一般认为应作“剪彩花”，原文可能有讹误。"},"352184":{"background":"元祐五、六年之交，苏轼在杭州任知州，同在两浙为官的叶温叟（字淳老）要离开杭州，苏轼写这首小词为他送行。前人一般认为叶淳老当时是两浙路的转运官员，这次离任大概是调往别处或回朝，但具体去向说法不一。两人共事一段时间，又都已年过半百，所以送别时说的不是功名前程，而是将来同在江南买田归老的打算。","mood":"这是一首轻松中带着依恋的送别词。苏轼不愿把场面弄得太伤感，所以开头先说退休买田、后会有期，又劝席上先别唱离歌。可是越说以后还能做伴，越看得出眼前分别让他不舍。他此时身在地方，朝中又有人请求召他回京，去留由不得自己。把希望放在归隐江南，是在宦途起落之后为自己找一个安顿处。","lines":[{"line":"阳羡姑苏已买田。","note":"苏轼早年在阳羡（今宜兴）买过田，一心想在那里终老。这里说两人都在江南置了产业，以后归隐可以互相来往，先用这层打算冲淡离别。"},{"line":"莫教便唱水如天。","note":"“水如天”应是当时宴席上常唱的离歌。苏轼劝大家先别急着唱，想把分别的时刻往后拖一拖。语气轻松，舍不得的意思也在里面。"},{"line":"我作洞霄君作守，白头相对故依然。","note":"提举洞霄宫是安排给年老官员的闲职。苏轼设想自己领了这种闲差，对方去做太守，两人白发相对，交情还和现在一样，是自嘲，也是真心的期望。"}],"moods":["送别","旷达"],"caveat":"叶淳老就是叶温叟这一点说法较通行。但他当时任什么官、离杭后去哪里、“同年”是否指两人同榜中进士，都没有确证；题下所附年谱条目记的是钱勰的事，和这首词无关。写作时间一般定在元祐五年末到六年初，也有其他说法。"},"352215":{"background":"元祐六年正月，苏轼已在杭州知州任上近两年。前一年他疏浚西湖、赈济饥荒，年底除夕时州狱里没有一个囚犯。这首词写元宵节的官府宴饮：城里百姓登台赏灯，官员在席间说笑劝酒。词中没有点明主人和客人是谁。年谱在同月记有钱勰与钱自然道士饮酒、苏轼送酒赋诗一事，但二者是否相关，无法确定。几个月后，他就被召回朝廷。","mood":"整首词轻松自得。开头说元宵本来就适合游乐，更何况官府清闲、诉讼稀少，看得出一个地方官对自己治下的满意。他把自己当作好客的主人，席间随和亲近，也乐意看客人放开喝酒。此时他远离京城的党争，在熟悉的杭州做些实事，心境比在朝时舒展。这份安闲，在他一生的宦途中也不多见。","lines":[{"line":"何况公庭民讼少。","note":"知州最看重地方安定。诉讼少了，官府清闲，他才能心安理得地和百姓一起过节，语气里带着几分自得。"},{"line":"平原不似高阳傲。","note":"借平原君好客、郦食其自称高阳酒徒的典故，说主人谦和待客、不摆架子，席上的气氛因此亲近融洽。"},{"line":"不惜玉山拚醉倒。","note":"玉山倾倒原本形容嵇康的醉态。这里笑写座中一位多情的客人豁出去痛饮，是席间的打趣，也写出宾主尽欢。"}],"moods":["闲适"],"caveat":"此词原本无题，具体作年和宴席主客，各家说法不一；它与年谱所记钱勰饮酒、苏轼送酒一事是否有关，也没有确证。"},"352225":{"background":"这首词是为妻子王闰之祝寿写的。题中的“同君”应是“同安君”的省称，王闰之当时受封同安郡君。按词中“初破五”一句，她的生日在正月初五。寿辰这天，家里依照《金光明经》中流水长者子救鱼的故事放生。王闰之信佛，用放生代替宴饮，大概合她的心意。苏轼当时任杭州知州，这一年春天就将奉召回京。这是他在杭州度过的最后一个新年，写的是家里过生日的情景。","mood":"全词的心绪轻快温和。王闰之出身眉州青神，与苏轼同乡，嫁过来二十多年，经历了乌台诗案和黄州的困顿。如今苏轼在杭州做事顺手，朝中也有人举荐他回京，家里正是安稳团圆的时候，所以词里只有喜气，没有感伤。结尾写放鱼，把对妻子的祝福和护生的善念放在一起，带一点佛家的宽厚，也是夫妻两人共同的寄托。","lines":[{"line":"当年江上生奇女。","note":"“江上”应指岷江边的青神，那是王闰之的故乡，也离苏轼家很近。称她“奇女”，既是祝寿的好话，也有对同乡妻子的亲切和敬重。"},{"line":"三个明珠，膝上王文度。","note":"三个儿子苏迈、苏迨、苏过都在身边。苏迈是前妻王弗所生，由闰之抚养长大。王文度是东晋的王坦之，成年后父亲仍把他抱在膝上。这里借用典故，写母亲对儿子们的疼爱。"},{"line":"放尽穷鳞看圉圉。","note":"把困住的鱼都放回水里，看它们起初还游得拘束不舒展。用放生代替寿宴，表达对妻子的祝福，也合她信佛的心意。"}],"moods":["闲适","禅悟"],"caveat":"有两处不能完全确定：题中“同君”一般认为是“同安君”的脱误或省称；正月初五是王闰之生日，是从词句推出来的，也有人把这首词系于元祐五年正月，但写于杭州任上这一点没有疑问。"},"352180":{"background":"元祐六年初春，苏轼做杭州知州快满两年。朝廷召他回京任翰林学士承旨，他自己也正准备动身。这时友人梅庭老要离开江南，北上上党（今山西长治一带）去当州学学官。学官是清闲、俸禄微薄的冷职，上党又在太行山上，比起富庶的三吴，这一趟难免让人觉得委屈。苏轼写这首词为他送行，既是安慰，也是打气。梅庭老的生平，现存材料很少。","mood":"词里没有哭哭啼啼的离愁，口气爽快，像老朋友拍着肩膀叮嘱：别嫌官小，别嫌地方远，你本来就是有学问的人，要去的地方也不寻常。末句承认太平年月用不上奇才，又带出一点无奈。苏轼多年在各地辗转做官，清楚冷官的滋味。同一年他还向朝廷举荐州学教授何去非，没有得到答复。可见他对屈居下位的读书人，是真有同情的。","lines":[{"line":"不应弹铗为无鱼。","note":"用冯谖弹剑抱怨饭里没鱼的典故，劝梅庭老别为官职清冷、待遇菲薄而不平。话说得直，心意却很体贴。"},{"line":"先生元是古之儒。","note":"称赞梅庭老本是古风的读书人，当学官正合他的身份，不必看轻自己。这是替远行的人撑起底气。"},{"line":"时平不用鲁连书。","note":"上党是古代赵国的地方，鲁仲连曾在那里替赵国解围。如今天下太平，奇谋无处可用，宽慰里带着替朋友的惋惜。"}],"moods":["送别","旷达"],"caveat":"本词系于元祐六年初的杭州，是依据年谱和通行的编年，但梅庭老是谁、此行从哪里出发，史料都不详，写作年份也有学者另作推定，不能完全确定。"},"352185":{"background":"元祐六年早春，苏轼第二次任杭州知州将满两年。朝廷召他回京任吏部尚书，他正在交接公务、准备启程。宝云山真觉院以瑞香花出名，这首词是他和同游的人在院中赏花饮酒时写的。苏轼另有与曹辅（子方）唱和真觉院瑞香的诗。词里的“公子”大概是同席的年轻人，具体是谁，现存材料无法确定。","mood":"整首词口气轻松。他自称“老夫”，笑自己眼力不如年轻人，鼻子倒先闻到了花香，带着对年纪的自嘲。他又以“谪仙”自比，说自己的春梦被香风惊醒。此时他即将离开喜爱的杭州，回到党争激烈的朝廷，而此前他一再请求外任。词里看不到忧虑，只在末句“何人心动”留下一点余味，好像把离别前的复杂心情轻轻压了下去。","lines":[{"line":"公子眼花乱发，老夫鼻观先通。","note":"年轻人对着满眼繁花看花了眼，我这老头子倒是鼻子先闻到了香。“鼻观”借用佛家语，是拿自己的年纪开玩笑。"},{"line":"惊起谪仙春梦。","note":"“谪仙”本来指李白，这里多半是苏轼自比：一个被贬过的人，春日酣睡时被花香惊醒。语气戏谑，也隐约带着身世之感。"},{"line":"把酒何人心动。","note":"举杯的人里，是谁被这花打动了？他只问不答。离杭在即，这一问也许含着对杭州的不舍，但词中没有点破。"}],"moods":["咏物","自嘲"],"caveat":"词本身没有写明年月，编年依据的是年谱。它和苏轼与曹辅唱和瑞香的诗是不是同一次所作，“公子”指的是谁，都没有确证。"},"352186":{"background":"这首词写在杭州一次夜宴上，按编年是元祐六年（1091）初，苏轼知杭州将满，朝廷正召他回京。题目交代了缘起：苏轼先在席上写过一首《西江月》，同座的客人照原韵和了一首，他又按同一韵脚再写，所以是酒席上你来我往的唱和之作。在座是哪些客人，前一首是哪篇，现有材料都说不清。","mood":"全词写一场夜宴从入夜到将散的情景：庭院、鼓声、微月、劝酒、簪花、谈笑，都很轻快，看不出愁绪。此时苏轼在杭州治水、救荒，有不少实绩，又将还朝，处境比黄州时宽松得多。词里的从容，可以看作这段相对顺遂日子的一个侧面；不过它本来是即席应酬之作，不宜从中读出太深的寄托。","lines":[{"line":"重城画鼓三通。","note":"城里的鼓已经敲过三通，说明夜已深了。宴会还没有散，主客兴致正浓。"},{"line":"皂罗半插斜红。","note":"男宾黑纱帽上斜插着红花，样子有点歪斜，是酒喝到一半的放松和随意，带一点自嘲式的诙谐。"},{"line":"灯花零落酒花秾。","note":"灯芯结的花一朵朵落下，杯里酒沫正浓。灯越点越暗，酒兴却正高，见出夜深人未倦。"}],"moods":["闲适"],"caveat":"作年依据年谱系统的编年。此词原唱是哪一首、席上的“坐客”是谁，题中和现有材料都没有交代，不同的编年本可能有出入。"},"352182":{"background":"元祐年间苏轼因政见不合离开朝廷，此时以知州身份在杭州任上。这首词编在元祐五年冬、六年初之交。“剪䌽”是立春日剪彩胜、戴春幡的习俗，所以一般认为是立春前后的一次宴集上写给同席友人的，带着劝酒和说笑的意思。年谱这段时间记有他送酒给钱勰和钱道士并作诗的事，但没有材料证明那件事和这首词有关。词中“张丈”“殷兄”指的是谁，也无从确考。","mood":"苏轼这时五十六岁，胡须已经全白。他说自己并不为此吃惊，还照样戴上彩胜去应春景，只是还没喝醉脸就先红了，有些不好意思。这里面有对衰老的自觉，但他选择拿它开玩笑，不往伤感里去。几经起落之后，外任杭州的日子相对安稳，他把精力放在政事和朋友身上，这首词就是那种从容心态的一个片段。","lines":[{"line":"雪颔霜髯不自惊。更将剪䌽发春荣。","note":"下巴和两鬓的胡须都白了，自己却不觉得意外，照样戴上彩胜过立春，有点老来不服老的味道。"},{"line":"莫唱黄鸡并白发，且呼张丈唤殷兄。","note":"白居易写过黄鸡催晓、白发催年的感叹。苏轼劝大家别唱这种调子，还是互相招呼着喝酒。"},{"line":"有人归去欲卿卿。","note":"借《世说新语》里王戎夫人“卿卿”的故事，取笑席上有人急着回家去和妻子亲热，是朋友间的玩笑话。"}],"moods":["旷达","自嘲"],"caveat":"这首词只能从“剪䌽”推断写于立春时节，具体日期和宴席上的人都没有确证。年谱所记送酒给钱勰一事是否与这首词有关，也不能确定。"},"352187":{"background":"元祐六年（1091）春，苏轼在杭州知州任上，朝廷已召他回京，离杭就在眼前。此前他在寺院赏瑞香，作过《西江月》，这首依原韵再作。起因是一桩席间小争执：座中友人曹子方（一般认为是曹辅）说瑞香其实是紫丁香，苏轼不同意，就写这首词跟他辩，还拿他开玩笑。这首词是写给熟朋友的，场合是赏花饮酒的聚会。","mood":"通篇都是朋友间的打趣：替瑞香叫屈，说曹子方醉中认错了花，又给他找台阶，说他是怕被花香勾动情思才故意贬它。语气轻松，没有牢骚。苏轼在杭州这两年治水救荒，政事上有作为，和当地朋友往来也多，心情比较舒展。临走前还有心思为一种花较真，可见他和这里的友人很亲近，这段日子也过得从容。","lines":[{"line":"怪此花枝怨泣，托君诗句名通。","note":"开头就把花写成受了委屈：被你叫错了名字，它在哭诉，只好盼着借你的诗把真名传出去。是半认真半玩笑的责怪。"},{"line":"点笔袖沾醉墨，谤花面有惭红。","note":"笑曹子方喝醉了提笔，袖子上沾满墨迹，把花的名字说错，脸上该带点愧色。拿朋友的醉态和失误打趣，亲近而不刻薄。"},{"line":"知君却是为情秾。怕见此花撩动。","note":"结尾替对方开脱：你其实是多情的人，怕被这花撩动心思，才硬说它是别的花。玩笑收尾，给朋友留了面子。"}],"moods":["自嘲","咏物"],"caveat":"所附年谱条目记的是苏轼托钱勰向米芾借砚，跟这首词没有直接关系；这首词编在元祐六年春只是大致推定，也有人把它和前面的瑞香词一起系于元祐五、六年间。曹子方指曹辅，是通行说法，他当时任什么官职不能确定。"},"352261":{"background":"这首词作于元祐六年（1091）早春，当时苏轼在杭州任知州。旧党执政后，他因与朝中意见不合，自请外任。这年正月，范祖禹上书请求早日召他回京。不久朝廷任命他为吏部尚书，他就要离开杭州。词前没有小序，没写为谁而作，也没写在什么场合。从“陪俊少”一句看，很可能是下雪天他和一些年轻的同僚、文士聚会时即兴写的，但具体是哪些人，已经无从查考。","mood":"词的基调是轻快的，带一点自我打趣。苏轼这年五十六岁，经历过乌台诗案和黄州的贬谪，回朝后又卷入党争，所以对再次被召回京城，心情并不全是高兴。可是在这首词里，他没有去写这些担忧，而是说自己还没老，还能跟年轻人一起赏雪作诗，又劝自己别去招惹闲愁，不如折一枝梅花上楼。这种用眼前的兴致把心事压下去的写法，是他中晚年常见的处世态度。","lines":[{"line":"欲学杨花更耐寒","note":"雪花纷飞，像是在模仿杨花，却比杨花更经得起寒冷。这句是在写雪，读来也像暗指自己，几经风霜依然挺得住。"},{"line":"相如未老。梁苑犹能陪俊少","note":"这里用了典故：梁王在兔园赏雪时请司马相如作赋。苏轼以相如自比，说自己年纪虽大，还能陪年轻才俊们一起赏雪作诗，带着几分自嘲，也有几分自得。"},{"line":"莫惹闲愁。且折江梅上小楼","note":"他把可能冒出来的愁绪轻轻挡开，转而去做眼前一件有意思的事。苏轼排遣烦恼，常常就是这样把心思转到当下的情趣上。"}],"moods":["旷达","咏物"],"caveat":"这首词没有题序，作于元祐六年杭州是后世编年者根据内容推断的，有的版本把它列为编年不详，同席的人是谁也没有记载可查。"},"352189":{"background":"1091年春，苏轼在杭州知州任上奉召回京，任翰林学士承旨。临行前，两浙同僚马瑊（字中玉）、刘季孙等人在西湖为他饯行，马瑊作词赠别，苏轼一一唱和，这首词就作于这段时间。不过，词里写的全是儿子回家侍奉父母：用了老莱子穿彩衣、陆绩藏橘、王述盼儿子王坦之回家等典故。所以它更像是在送一位急着回家看望父亲的晚辈，并不是写苏轼自己离开杭州。","mood":"上片替对方设想回家的急切和欢喜，语气温和，带着长辈式的体贴。下片转到自己，说修禅以后已经放下了世间的种种牵挂，只剩下老朋友之间的交情还放不下。苏轼这时五十六岁，经历过贬谪，又要回到朝廷的是非里，对人情看得比较淡，但对故交仍然看重，还拿彼此的亲戚关系说笑。整首词是送别，也是在讲友情和家世。","lines":[{"line":"归心正似三春草","note":"借孟郊“寸草春晖”的意思，说对方想回家侍奉父母的心像春草一样一天天长起来，赞许他的孝心。"},{"line":"禅心已断人间爱","note":"转到自己：说自己修禅以后，对世间的爱憎得失已经看淡，这里有历经宦海后的疲倦，也有自我开解。"},{"line":"只有平交在","note":"什么都放下了，只有老朋友的交情还放不下。这一句显出苏轼看重故人，也是这次送别里最真挚的话。"}],"moods":["送别","禅悟"],"caveat":"这首词有的版本题作“述怀”（注释所引即是）；题作“送马中玉”时，词中“归家省亲”的内容与年谱记载的“马瑊等饯苏轼离杭”不完全对得上。受赠者是谁、马氏是否正要归省父亲，“瓜葛”具体指什么亲戚关系，现有材料都不能确定。"},"352190":{"background":"元祐六年春，苏轼任杭州知州快满两年，朝廷已召他回京任翰林学士承旨，他自己也在准备动身。这时老友钱勰（字穆父）从越州知州改任瀛州，北上途中路过杭州。两人元祐初年同在朝中做官，交情很深。元祐三年钱穆父出京去越州时，苏轼曾在京城为他送行。隔了三年在杭州重逢，没聚几天又要分别，苏轼便在饯行的酒席上写了这首词送他。","mood":"词的基调是劝慰，劝朋友，也在宽慰自己。两人这几年都在外地来回调任，夸朋友心如古井、节如秋竹，也是在说自己的操守。结尾说人生像住旅店，“我也是过客”，并不只是讲道理：苏轼自己不久也要离开杭州回京，那边党争正激烈，前途难料。那份旷达里，藏着对仕途起落的疲惫和惆怅。","lines":[{"line":"依然一笑作春温。","note":"三年里奔走各地，再见面时朋友还是笑得那样温和。苏轼看重的是故人性情没有被宦海磨掉。"},{"line":"无波真古井，有节是秋筠。","note":"化用白居易赠元稹的诗句，称赞朋友心境平静、不随外物起伏，又有秋竹一样的节操。这也是苏轼对自己的期许。"},{"line":"人生如逆旅，我亦是行人。","note":"既然人人都是天地间的过客，就不必为这次分别伤心。这时他自己也将离开杭州，这句话也是在说眼前的实情。"}],"moods":["送别","旷达"],"caveat":"多数注本说钱穆父这次是由越州移知瀛州，但他当初出知越州的具体原因，各家说法不尽一致。"},"352191":{"background":"元祐六年三月，苏轼任杭州知州还不满两年，朝廷召他回京任翰林学士承旨。临走前后，杭州友人设宴送行，彼此有不少诗词唱和。这首词则是专门写给诗僧参寥（道潜）的。参寥是苏轼多年的方外好友，苏轼在徐州、黄州时，他都远道前去相访。苏轼到杭州后，他也来到杭州，住在智果院，两人常一起游江、游湖。这次分别，苏轼心里放不下，就写下这首词，和老友约定将来一定回来。","mood":"上片从潮来潮去想到人世的聚散，苏轼自称已经“白首忘机”，语气放达。下片转为郑重的叮嘱，和老友约定日后一同归隐。旷达底下藏着不安：他当初是为了避开朝中纷争才求外任来到杭州，如今又被召回朝廷，前途难料。所以他借谢安未能东归的旧事反着说，既是宽慰参寥，也是给自己定下心意。后来他一再被贬到更远的地方，这个约定终究没有实现。","lines":[{"line":"有情风、万里卷潮来，无情送潮归。","note":"风把潮水送来，又把它送走，就像人和人相聚又分开。苏轼即将离开杭州，开头就把离别之情寄托在江潮上。"},{"line":"算诗人相得，如我与君稀。","note":"从徐州、黄州到杭州，参寥一次次远道相随。苏轼数来数去，觉得像他们这样心意相通的诗友实在不多。"},{"line":"西州路，不应回首，为我沾衣。","note":"借羊昙痛哭谢安的旧事，说自己不会像谢安那样死在任上，老友将来不必为他流泪。话是宽慰，底下也有对前途的担心。"}],"moods":["怀人","旷达"],"caveat":"一般认为这首词作于元祐六年三月离开杭州的时候。年谱记载的西湖饯行，是苏轼与马瑊、刘季孙等人的唱和；这首词是否作于同一场合，是临行前写成还是上路后寄出，现在难以确定。"},"352193":{"background":"元祐六年春，苏轼在杭州知州任上被召回京城，任翰林学士承旨。他北上途中到了润州，也就是京口，在这里遇到接任杭州知州的林希（字子中），并在酒席上写了这首词送给他。题中的“交代”，指前后任官员办交接。苏轼在杭州两年，疏浚西湖、修筑长堤，花了很多心力。现在要把这片湖山交给别人，他就借酒席上的玩笑，把交接说成移交一桩“公案”。","mood":"这首词口气轻松，借公文用语开玩笑，底下有两层心思。一层是放不下西湖，托新任好好照看，也盼他写诗替湖山“结案”。另一层是对回京并不热心。他深知朝中党争激烈，曾上表推辞这次召命，回京几个月后就又出知颍州。至于林希，绍圣年间正是他起草了贬斥苏轼兄弟的制词。这时席上的客气话，后来读起来就多了一层意味。","lines":[{"line":"旧官何物对新官","note":"按惯例，旧官交接时要把钱粮簿册移交给新官。苏轼故意问自己能拿什么交出去，摆出一副两手空空的样子，自嘲里透着轻松。"},{"line":"只有湖山公案","note":"他要交的只有西湖山水这桩“案子”。表面在说笑，其实是把自己在杭州最用心的事郑重托付出去，难舍之情藏在玩笑里。"},{"line":"与把新诗判断","note":"接着用断案的说法，请林希用新写的诗给湖山下定论。这是称赞对方的才华，也是放手的姿态：西湖往后归你照管了。"}],"moods":["旷达","自嘲"],"caveat":"年谱把这次相晤记在润州，题目却作“杭州交代”，指的是林希接任杭州。林希当时由何处赴任、酒席由谁所设，细节还不能完全确定。"},"352195":{"background":"元祐六年（1091）春，苏轼被召回朝廷，出任翰林学士承旨，于是离开做了将近两年知州的杭州北上。途经润州时，他见了几位旧交，临别写下这首词送给张弼（字秉道）。张弼的生平记载很少，词里叫他“髯张”，看得出两人相熟，说话可以随意。苏轼对这次回京本来有顾虑，曾上状请求辞免。这首词表面上是劝朋友看淡进退，其实也在说他自己的心事。","mood":"词一开头就劝人归隐，口气轻松，像老朋友之间的玩笑。“何处不堪行”既是宽慰张弼，也是苏轼在安慰自己：刚离开过得舒心的杭州，前面是党争还没有平息的京城。下片惦记吴越的收成，因为前一年当地闹灾，他刚为赈济奔走过。他心里对去留有牵挂，只是用旷达的语气说出来，不愿显得沉重。","lines":[{"line":"江南与塞北，何处不堪行。","note":"不管被派到南方还是北方，哪里都能待得下去。这是劝朋友，也是他对自己即将回京、前途难料的一种开解。"},{"line":"俎豆庚桑真过矣，凭君说与南荣。","note":"借《庄子》里庚桑楚不愿被百姓供奉的故事，大约是说杭州人对自己的感激和推崇太过了，请张弼代为转告，透出谦让和不安。"},{"line":"愿闻吴越报丰登。","note":"人已经离开，心里还挂着杭州一带的年成。前一年当地有灾荒，他主持过赈济，这句是地方官对百姓真心的惦念。"}],"moods":["送别","旷达"],"caveat":"张弼生平不详；末句“结袜赖王生”用的是汉代王生让张释之替他结袜的典故，词中谁比作王生、谁比作张释之，注家的理解不一致。"},"352168":{"background":"元祐六年，苏轼结束杭州知州任期，奉召回京任翰林学士承旨，北上途中经过湖州。熙宁七年（1074），他曾在这里和张先、刘述、李常、陈舜俞、杨绘聚会。那时八十多岁的张先写了《六客词》，用“老人星”比喻自己。十几年后重到旧地，五位旧友都已去世。这次同席的是湖州知州张询，还有同行的曹辅、刘季孙、苏坚、张弼，正好又是六个人。张询请他仿照旧例作一首“后六客词”，于是有了这首词。","mood":"这首词写在宴席上，主调是热闹的唱和，底下却压着一层很深的孤独。当年六客里他最年轻，如今只剩他一人，自己也成了席上的老者。这些年他经历过乌台诗案和黄州贬谪，刚回朝又身处党争的旋涡，回看往事确实像一场梦。不过他没有沉在伤感里，转头和满座新朋友一起饮酒说笑，把对亡友的怀念放进眼前的相聚。这种收得住的态度，正是他中年以后的常态。","lines":[{"line":"十五年间真梦里。","note":"从当年的六客之会到今天，老友一个个离世，自己也几经起落。回头再看，这些年真实得不像真的，只像做了一场梦。"},{"line":"长庚对月独凄凉。","note":"长庚就是金星，常在月亮旁边独自发亮。他用它比自己：旧日同游的人都已不在，只剩自己对着同一轮月亮，格外孤单。"},{"line":"绿鬓苍颜同一醉。","note":"满座有黑发的年轻人，也有像他这样面容苍老的人，此刻都一起喝醉。他有意把伤感收住，回到眼前这场欢聚。"}],"moods":["伤逝","旷达"],"caveat":"年谱把这首词系在九月，但苏轼元祐六年三月已离开杭州北上，八月又出知颍州，所以一般认为这首词作于三月途经湖州时。另外，从熙宁七年到元祐六年实际相隔约十七年，序中的“十五年”应是约数。"},"352181":{"background":"元祐六年（1091）正月，苏轼在杭州做知州，已是第二次到杭州任职。友人江公著（字晦叔）在朝中任郎中，这时出京去做吉州知州，途经杭州。正月初七，两人还和钱勰等人一起去龙井拜访辩才法师，并题了名。江公著离杭时，苏轼写了诗和这首词送他。词写的是送别当晚回到住处之后，他一边想着江公著第二天怎样渡钱塘江，一边写下嘱托。","mood":"词的前半写夜里回来、灯火已灭，独自看着西楼上带晕的淡月，惦记着明天的潮水，心思细，也透着冷清。后半转为宽慰和叮嘱：盼他一路顺风，又劝他别学那些看不起久处困境之人的势利风气，要常来信。苏轼当时外任在杭，正有朋友上书请求召他回朝，去留未定。所以“久困”的说法里，多少也带着他对自己处境的感慨。","lines":[{"line":"送客归来灯火尽。","note":"送走朋友回来，夜已深，灯都灭了。只写眼前所见，散席后的冷清和独处的失落都在里面。"},{"line":"明日潮来无定准。","note":"钱塘江潮涨落难料，他担心朋友明天渡江是否顺利，牵挂之情很具体。下一句随即自我宽慰说潮水会平稳。"},{"line":"莫学时流轻久困。","note":"劝朋友不要学世俗那样冷落长期失意的人，要常来信问候。这是对友情的期许，也像在说自己仕途多次起落、身在外任的处境。"}],"moods":["送别","怀人"],"caveat":"词题有的版本作“送台守”，有的作“送吉守”。年谱记载江公著去的是吉州，“台”可能是传刻错误。另外，“久困”说的是江公著还是苏轼自己，没有定论。"},"352159":{"background":"元祐六年（1091）春，苏轼在杭州知州任上被召回朝廷，任翰林学士承旨。他一再上状请辞，朝廷都没有准，只好动身北上。途中他乘小船连夜渡过长江到了扬州，当地的旧识设宴招待，他在酒席上写了这首词。词里没写主人和同席的人是谁。年谱只提到他在扬州期间可能和王存谈过灾情，没法据此确定席上有谁，只能看出是和他分别多年、一直挂念他的老朋友。","mood":"上片借杜甫思念李白的诗意，说对方这些年在远处一直惦记着身在江南的自己，离别的愁绪积了很多层。下片写见面的情形：大家先吃惊于他老了这么多，接着都笑了，他一开口还带着吴地口音。他刚离开做出不少实事的杭州，又要回到党争激烈的朝廷，本来就不想去。这次重逢让他高兴，同时也感到自己老了，对前路放心不下，所以深夜对着酒杯，还觉得像在做梦。","lines":[{"line":"尊酒何人怀李白，草堂遥指江东。","note":"把主人比作杜甫，把自己比作身在江东的李白，说对方多年来一直遥念着自己，用这个说法表达彼此交情深厚。"},{"line":"轻舸渡江连夜到，一时惊笑衰容。","note":"他坐小船连夜赶到。老友见他头发白了、面容老了，先是一惊，随后笑起来。重逢的高兴里带着岁月不饶人的感慨。"},{"line":"夜阑对酒，依旧梦魂中。","note":"夜深了还在对饮，却总觉得不像真的。久别重逢的恍惚里，也夹着他对回朝以后前途的不安。"}],"moods":["怀人"],"caveat":"宴席主人是谁没有定论。“语音犹自带吴侬”说的是苏轼自己刚从杭州来、带着吴地口音，还是席上有吴地口音的人，各家解释不同。"},"352188":{"background":"元祐六年春，苏轼第二次在杭州任职已近两年，朝廷召他回京任翰林学士承旨。临行前，两浙同僚马瑊（字中玉）和刘季孙等人在西湖为他设宴送行。马瑊当场填了一首《木兰花令》赠别，苏轼按原韵和了这一首。所以这首词是写给马瑊的回赠，写在饯行的酒席上，席间有歌女侍宴。","mood":"这首词写离别，语气却轻松，还带几分调笑。开头称赞朋友超脱寒暑，说相识再久也只像一朝一夕，把别离看得很淡。下片写到落花、啼莺，伤感才慢慢浮上来。苏轼从前在杭州做过通判，这次又做了知州，前后住了好几年，对这里有很深的感情。回京升了官，可前途未必顺遂。他用玩笑把不舍盖住，到最后一句才露出来。","lines":[{"line":"故将别语恼佳人，欲看梨花枝上雨。","note":"席上故意说些离别的话，惹侍宴的歌女落泪，好看她梨花带雨的样子。这是酒宴上的戏语，也是用玩笑掩饰自己的离愁。"},{"line":"花本无心莺自诉。","note":"花落本来无心，是黄莺自己在啼叫诉说。言外之意是：伤别的不是西湖景物，是人自己的心。"},{"line":"明朝归路下塘西，不见莺啼花落处。","note":"明天踏上回京的路，就再也看不到这里莺啼花落的春景了。这一句才把对杭州的不舍说了出来。"}],"moods":["送别","旷达"],"caveat":"马瑊的字在文献中写作中玉、忠玉、仲玉，不尽一致；“塘西”具体指哪里，是钱塘以西还是某处堤岸，说法不一，这里不作坐实。"},"352192":{"background":"元祐六年（1091）春，苏轼接到朝廷召命，要离开杭州回京任翰林学士承旨。这是他第二次在杭州做官：熙宁年间他做过三年通判，过了十五六年又以知州身份回来，前后两年。这首词写在临行的饯别酒席上。从“劝酒人”一句看，词是写给席间劝酒的人的，可能是相熟的友人或歌妓，但具体是谁，现存材料没有交代。","mood":"词里有三层意思。第一层是舍不得走。第二层是对去留不由自己的无奈：用刘郎的典故，说自己来了又走。第三层是怕再也回不来。苏轼此时五十六岁，前几年在朝中受人攻击，自己请求外放，杭州让他过得比较安心。这次奉召回京，前途难料。他嘴上说“刘郎未老”，还盼着重来，接着又担心拖延下去，眼前的人就见不到了。这种担心和他的年纪、宦途的漂泊都有关。","lines":[{"line":"应恨刘郎来又去。","note":"刘郎原指传说中在天台山遇仙的刘晨，也带着刘禹锡“前度刘郎今又来”的意思。苏轼借来说自己：两次到杭州，两次又离开。"},{"line":"忍听阳关第四声。","note":"阳关曲唱到第四声，正是“劝君更尽一杯酒”那一句。苏轼自己考证过这首曲子的唱法，这里是说离别近在眼前，那一句实在不忍心听。"},{"line":"只恐因循。不见而今劝酒人。","note":"前面刚说还想回来，这里马上转为担心：人事一拖再拖，等真能回来，今天在席上劝酒的人恐怕已经不在了。"}],"moods":["送别","怀人"],"caveat":"年谱定为元祐六年离杭时所作，这是常见说法，但也有版本把词题和对象另作他解。“劝酒人”具体是谁，无法确定。"},"352197":{"background":"元祐六年，苏轼在朝中受到攻击，自请外任，秋天到颍州做知州。颍州是欧阳修做过知州、晚年退居的地方，西湖也是他整治过的。二十年前，苏轼去杭州任通判，途中和苏辙到这里拜见退休的欧公，第二年欧公就去世了。如今苏轼自己做了这里的长官，游西湖时听见歌女还在唱欧公的词，就用欧公《木兰花令》的原韵写了这首词怀念他。陈师道也和了一首。","mood":"词里没有激烈的哀哭，更多是低沉的怅惘。秋天河水浅了，露珠很快会干，月亮圆了就开始缺，几处都在说时间带走一切。苏轼这时已经五十多岁，官场起落多年，刚从朝廷的是非中脱身，站在恩师待过的湖边，怀念欧公和感叹自己的岁月就连在了一起。末句说只有湖月还认得欧公，也透出旧日师友大多已经不在的孤单。","lines":[{"line":"空听潺潺清颍咽","note":"秋天颍水浅了，流水声听来像在低声哭。“空听”二字说明心里的人已经不在，只能独自听水声。"},{"line":"佳人犹唱醉翁词，四十三年如电抹","note":"歌女还在唱欧公的词，可见颍州人没忘记他；可从欧公来颍州到现在，四十多年一晃就过去了。"},{"line":"与余同是识翁人，惟有西湖波底月","note":"当年认识欧公的人大多不在了，还认得他的只剩自己和湖里的月影，怀念里带着孤单。"}],"moods":["怀人","伤逝"],"caveat":"欧阳修皇祐元年（1049）知颍州，到这年实隔四十二年，词说“四十三年”应是连头带尾算；“三五盈盈还二八”通常解作十五、十六的月亮，也有人认为是指十五六岁的歌女；作词的具体月日，年谱没有记载。"},"352200":{"background":"元祐六年春，苏轼从杭州被召回朝廷，几个月里屡遭言官攻击，便自请外任，秋天到了颍州。这首词写的是一次夜宴听琵琶：词中的“湖风”应指颍州西湖，“霜”“寒”说明是在秋冬之际。弹琵琶的是谁、宴会由谁做东、词是不是写给某个具体的人，现有材料都没有记载，只能看出是一首即席写下、描摹琴声的词。","mood":"全词几乎都在写声音：一会儿清脆细碎，一会儿急促迸发，后来又像春水流过、霜气逼人。词人原本带着醉意半睡半醒，被琴声惊醒，才觉出湖风的凉意。夜已经深了，他还要请人再弹一曲。刚从朝中纷争里抽身的苏轼，在这里流露出的不是怨气，而是借音乐暂时忘掉烦扰的那份沉醉，底子里也透着一点清冷。","lines":[{"line":"醉梦尊前。惊起湖风入坐寒。","note":"他在酒席上醉得迷迷糊糊，被一阵急弦惊醒，这才觉得湖上的风吹进座中，带着凉意。"},{"line":"春水流弦霜入拨。","note":"琴声时而柔和流畅，像春水淌过；时而冷峻锋利，像霜气凝在拨子上。这一柔一冷，大概也是此时心境的写照。"},{"line":"月堕更阑。更请宫高奏独弹。","note":"月亮已经西沉，夜深了，他仍不想散席，还请弹奏者单独再来一曲，可见听得入迷，不愿就此离去。"}],"moods":["闲适","咏物"],"caveat":"这首词的编年主要依据词中“湖风”与颍州西湖相合，并没有确证；听琵琶的场合和弹奏者都不可考。“转关镬索”一般认为是琵琶曲调或指法的名称，“宫高”指什么也有不同理解（可能指宫调调高，也有可能是人名），这里不作定论。"},"352237":{"background":"元祐六年春，苏轼从杭州知州任上被召回汴京，任翰林学士承旨，初夏到京。这是很高的职位，但他一回朝就遭到台谏攻击，屡次上书请求外放，入秋便出知颍州。这首词写的是他在京这个夏天的一场消暑游戏：雨后放晴，天气闷热，座中人玩“选仙图”。这是一种掷骰子的棋戏，按点数从低位的仙人一级级往上升。词是对这场游戏的即席描写，一起玩的人是谁，词里没有说。","mood":"词的表面很轻松：天热，雨后有些凉意，众人围着酒杯掷骰子取乐，笑问谁离青天最近。可这个游戏本身就像在模拟升官，掷得好一步登天，到了高位也可能一把输光。苏轼这时刚升到翰林学士里最高的职位，又正被人弹劾，看这一盘升仙的输赢，很难说心里没有一点对官场的旁观和自嘲。不过这层意思他写得很淡，主调还是消暑的闲趣。","lines":[{"line":"笑指尊前、谁向青霄近。","note":"举着酒杯笑问座中谁离青天最近。游戏里说的是升仙，也容易让人想到仕途上的高升，语气是开玩笑的。"},{"line":"凤驾鸾车，谁敢争先进。","note":"到了棋盘上乘凤驾鸾的高位，人人都想抢先。写的是游戏里的争胜，也带着对争着往上爬的人的一点调侃。"},{"line":"纵有碧油，到了输堂印。","note":"即使已经坐上碧油车这样的显赫位置，最后还是可能被一把“堂印”赢走。大意是高位并不稳当，有几分看透的意味。"}],"moods":["闲适","自嘲"],"caveat":"选仙图的具体玩法，以及“重五”“碧油”“堂印”这些术语的确切含义，现在已经难以考实，这里只取大意；这首词系于元祐六年，是根据年谱和词中的暑天景物推定的，并没有作者自己的题记作证。"},"352258":{"background":"元祐六年（1091）春，苏轼从杭州知州任上被召回汴京，任翰林学士承旨，在京只待了几个月，同年八月出知颍州。据校注考证，当时在京任职的门生秦观写了一首《南柯子》（“霭霭迷春态”）送给苏轼的侍妾朝云，苏轼用同一词牌写了这首词作答。这是师生之间的唱和，写朝云在筵席上唱歌跳舞的样子。","mood":"这首词没有发牢骚，语气轻松，还带点玩笑。上片夸朝云的打扮，下片写她的舞姿，最后假装担心她被春风勾走，像是在接秦观的玩笑。苏轼这次回京后很快又遭人攻击，不久就请求外放，这首词的轻快和这样的处境不太一样。但词里没有提到这些事，最好不要往政治上联想。","lines":[{"line":"一朵彩云何事、下巫峰","note":"借宋玉笔下巫山神女“旦为朝云”的说法，暗暗
