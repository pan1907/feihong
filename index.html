是实际的处境。"},{"line":"茱萸仔细更重看","note":"重阳有佩戴茱萸的习俗。他叫人把茱萸再仔细看一遍，其实是想把这次聚会和眼前的人好好记住。"}],"moods":["送别","怀人"],"caveat":"受赠的“君”是谁没有定论；年谱记载他九月八日因病没有参加陈襄的重九宴，所以这首词具体写于哪一次聚会，还不能确定。"},"351998":{"background":"熙宁七年九月，苏轼在杭州通判任满，改任密州知州，正好知州杨绘（字元素）也被召回朝廷，两人结伴北上。到了吴江松江，张先（字子野）、陈舜俞、李常、刘述等人也在，大家夜里在垂虹亭摆酒。席间沈强辅拿出一把用带花纹的犀角和美玉装饰的胡琴，苏轼和张先就以这把琴为题各写了一首，算是给杨绘送行，也为酒席添些兴致。","mood":"这首词通篇是酒席上的游戏之作。上片拿犀角的各种传说开玩笑，下片干脆把自己想成琴拨，口气轻快、带点调笑，并不寄托什么深意。苏轼刚结束三年杭州任期，眼前这群老友马上要各奔南北，他却没在词里写离愁，而是用说笑把场面撑热闹。离别的意思只在题目“送元素还朝”里露了一下。","lines":[{"line":"一点灵犀必暗通。","note":"古人说犀角中间有一道白纹贯通两头。苏轼借这个说法，说这把琴和懂它的人心意相通，也顺带打趣在座朋友之间的默契。"},{"line":"愿作龙香双凤拨，轻拢。","note":"借杨贵妃弹琵琶用龙香柏做拨子的典故。苏轼说自己情愿变成那枚刻着双凤的拨子，被人轻轻拢着，是故意说的痴话。"},{"line":"长在环儿白雪胸。","note":"弹琴时把琴抱在胸前，拨子便常贴着弹琴人的胸口。“环儿”借用杨玉环的名字，属于席间调笑，语气轻佻。"}],"moods":["咏物","艳情"],"caveat":"题中“雯上”一般理解为沈强辅名雯，但“上”字的断句和异文还有分歧；“环儿”是指席上弹琴的歌妓，还是单纯借用杨玉环的典故，甚至兼带拿杨绘的姓开玩笑，说法也不一致。"},"352005":{"background":"熙宁七年秋，苏轼在杭州通判任上任满，改任密州知州，北上赴任时经过苏州。照词题说，这一年里他已经第三次路过这里，前两次大概与此前到常州、润州一带办理公务有关。苏州知州王诲设宴为他送行，席上一位歌女神情凄然地问他：这回走了，还会再来吗？王诲很欣赏她的这份情意，就请苏轼当场为她写一首词。","mood":"歌女这一问，问到了苏轼自己也答不上来的地方。密州在山东，远离江南，什么时候能回来没有把握，这几年在江南结交的朋友、看过的山水，都要留在身后了。他当时才三十九岁，却说“老先催”，有几分是酒席上的玩笑，也有几分是真心觉得自己被官职调动推着走，做不了主。所以他索性自嘲人生可笑，又拿刘禹锡的旧事来比自己，把离别的伤感说得轻一些。","lines":[{"line":"这回来不来。","note":"歌女的原话几乎照搬进了词里，没有修饰，是口语。她的不舍和对再见的没把握，就在这句平常话里。"},{"line":"人生真可咍。","note":"“咍”是嘲笑的意思。情意还没尽，人已经被岁月和官差催着上路，他只好笑自己的人生可笑，借这一笑挡住心里的伤感。"},{"line":"刘郎双鬓衰。","note":"借用刘禹锡被贬多年后重游玄都观、自称“前度刘郎”的旧事，设想就算日后真能回来，自己也已两鬓斑白，眼前的人和事都变了。"}],"moods":["自嘲","羁旅"],"caveat":"词题作“王规父”，年谱作“王诲（规甫）”，写法不同，一般认为是同一个人；“一年三过”具体指哪三次，现有记载说不清楚。"},"352007":{"background":"熙宁七年秋，苏轼杭州通判任满，改知密州，北上赴任。杨绘（字元素）这年刚到杭州做知州，不久又被召回朝廷，两人于是结伴北行，一路同游，到润州分手：杨绘往北去京城，苏轼转往东北去密州。临别的酒宴上，杨绘先作了一首《菩萨蛮》，苏轼依原调相和，就是这首。词是写给杨绘的，也是当场应答的作品。","mood":"这首词以伤别为主，底下还压着一层失落。杨绘回京，苏轼却离京城越来越远，从繁华的杭州去偏僻的密州。他既舍不得刚结下交情的朋友，也明白自己在朝中难有立足之地。词中说心留人不留，又说长安远得像天，惜别里夹着对前途的无奈。他没有直说怨言，借宴席上的乐声、歌曲和将来重逢的想象把情绪带出来。","lines":[{"line":"心留人不留。","note":"心里想留下来，人却身不由己，各自要赶赴新任。这是宦游中人人都有的无奈，说得直白，所以更觉沉重。"},{"line":"他年京国酒。堕泪攀枯柳。","note":"设想将来在京城重聚饮酒，那时人已老去，见到旧柳也会流泪。眼下还没分开，已经预先为日后的衰老和物是人非伤心。"},{"line":"长安远似天。","note":"长安指京城。杨绘此去正是回京，苏轼却越走越远。这句既说友人此后难再相见，也透出自己远离朝廷的失意。"}],"moods":["送别","怀人"],"caveat":"杨绘的原唱今天似乎没有流传下来，所以两首词怎样一唱一和已经说不清楚。至于两人结伴同行、在润州分手的经过，各家年谱在细节上略有出入。"},"352008":{"background":"这首词是酒席上的应酬之作。熙宁七年前后，苏轼还在杭州通判任上，因公事往来润州，受到知州许遵（字仲涂）的款待。据宋人笔记记载，席间有两名官妓郑容、高莹，想请求脱离乐籍、从良嫁人，于是托苏轼帮忙说情。苏轼没有直接替她们开口，而是写了这首藏头词：八句的第一个字连起来，正是“郑容落籍，高莹从良”。请求就这样藏在词里，交给许遵定夺。","mood":"整首词轻松风趣。苏轼这几年因为不赞同新法，离京做地方官，奔走各州，心里未必没有郁结，但这首词里看不到失意。前半阕夸主人好客、有文名，说自己喝得帽子都掉了，带点自我打趣；后半阕称赞女子容貌不老，结尾描画南徐的月夜湖光，祝她们从此过上安稳日子。他用文字游戏替身份低微的人办成一件实事，可见他待人宽厚，也很会在应酬场合里周旋。","lines":[{"line":"容我尊前先堕帻。","note":"自称在主人席前先喝醉，头巾都掉了。用这句自我打趣把气氛调得轻松，后面替人求情就不显得唐突。"},{"line":"籍籍声名不负公。","note":"恭维许遵名声很大、名副其实。表面是客套，其实也在暗示：成全这件好事，正配得上您的名声。"},{"line":"良夜清风月满湖。","note":"想象两名女子脱籍以后，在南徐过着清风明月的平静日子。这是对她们的祝福，也替许遵描绘了答应以后的好结果。"}],"moods":["闲适","自嘲"],"caveat":"郑容、高莹托苏轼求情的事出自宋人笔记，属于轶事，是否真有其事难以确证；写作时间有熙宁七年春赈灾途经润州和同年秋赴密州途经润州两种说法，这里暂从年谱所系。"},"352009":{"background":"熙宁七年秋，苏轼在杭州通判任上任满，改任密州知州。他从杭州北上赴任，十月经过润州。润州知州许遵（字仲途）设宴为他送行，这首词是在宴上或宴后写给许遵的留别之作。苏轼此前因为赈济灾民到过常州、润州一带，和当地官员已有往来。这一次他是真正离开江南，第二天就要渡江北去，于是借这场宴会，向主人和同席的人告别。","mood":"词里没有激烈的感慨，写的是宴席散后的冷清和对离别的不舍。在杭州的三年就此结束，他要去的密州在山东，远比江南偏僻。他自称“北客”，是说自己本来就是从北方来到江南的客人，如今又要回北方去，可偏偏这时大雁正往南飞，人和雁走的方向相反，更让人觉得身不由己。结尾不写自己，只写落花芳草，把对江南的留恋托付给眼前的景物。","lines":[{"line":"酒阑人散月侵廊。","note":"酒喝完了，客人散了，月光一点点移上回廊。热闹变成冷清，离别的感觉在这一刻才真正落到心上。"},{"line":"北客明朝归去、雁南翔。","note":"自己明天一早就要北上，大雁却正往南飞。人和雁方向相反，透出不能不走、也由不得自己的无奈。"},{"line":"惟有落花芳草、断人肠。","note":"席上的人很快就要各自散去，留下的只有江南的花草。最难割舍的，其实是这段日子和这片水乡。"}],"moods":["送别","羁旅"],"caveat":"题中“许仲途”就是润州知州许遵，“途”有的版本写作“涂”；“高明玉”“郑季庄”一般认为是席上歌妓的名字，具体是谁已经难以考证；“月旦堂”大概是借东汉许劭“月旦评”的典故，切合主人姓许，是不是真有一座叫这个名字的堂，并不确定。"},"352010":{"background":"熙宁七年秋，苏轼杭州通判任满，改任密州知州，北上途中于这年冬初到了润州。他在北固山甘露寺的多景楼上与孙洙（字巨源）、王存（字正仲）相聚饮酒，席间有一位叫胡琴的歌妓弹奏助兴。酒宴快散时，江面正映着晚霞。孙巨源说，这样的景色只有大手笔才写得尽，请苏轼当场填词，于是有了这首小令。同一场合，他还写了《弹筝》诗。","mood":"这是一首应邀在酒席上写的词，场面本来很热闹：好友、美景、乐声难得凑在一起。苏轼开头却先说自己情多、感触多、病也多。年谱记载，这年九月他还因病没去重九宴会。他刚离开住了三年的杭州，要去更偏远的密州，眼前的相聚越好，越觉得留不住。这层意思他没有明说，最后只写了一抹残阳。","lines":[{"line":"多情多感仍多病","note":"在热闹的席上先说自己情多、感多、病多，带点自我打趣，也透出旅途中身心都疲惫。"},{"line":"乐事回头一笑空","note":"眼前的欢聚确实难得，可他已经想到明天又要各奔东西，一回头，这一切就只剩一笑。"},{"line":"斜照江天一抹红","note":"写的是孙巨源请他描绘的晚霞，也和歌妓的醉颜相映。一天将尽、宴席将散，他不舍的心情都放在这抹红色里。"}],"moods":["羁旅","自嘲"],"caveat":"词序写作“甲寅仲冬”（农历十一月），年谱则记为十月，具体月份有出入；“胡琴”是歌妓的名字还是指弹胡琴的人，历来说法不一，而词里写的乐器又是琵琶。"},"352011":{"background":"熙宁七年（1074）秋，苏轼在杭州通判任满，北上赴密州途中经过润州。年谱记载他这时游过甘露寺。这首词写在一次宴席上，席间有人弹银筝，词中的“公”应是在座的主人或友人。苏轼另有《润州甘露寺弹筝》诗，可见这几天他确实在寺中听过弹筝。不过这首词具体写给谁，原词没有题注可以证明。","mood":"筝声让他觉得心头一松，压了十五年的愁绪仿佛被冲淡了。他在酒席上起身跳舞、向主人敬酒，兴致很高。结尾借江上风浪说自己心里安定。他从踏入仕途起就一路漂泊，因为不赞成新法离开京城，眼下又要去更偏远的密州。这份“闲”带着自我宽慰，也是他真心在找的一种平静。","lines":[{"line":"一洗闲愁十五年","note":"筝曲的巧妙心思像泉水一样，把多年积下的愁闷一下冲掉了。十五年大致对应他出仕以来的宦游岁月。"},{"line":"起舞属公公莫起","note":"我起身跳舞，向您敬酒，您坐着别动。这是席间的热情和客气，看得出他和主人很亲近，兴致也高。"},{"line":"摆撼鱼龙我自闲","note":"润州在长江边，江风卷起像银山一样的浪，鱼龙都被摇撼，他却安然不动。这是借江景说自己不被外界的风波扰乱。"}],"moods":["旷达","闲适"],"caveat":"这首词原本没有题序，编年依据的是年谱。词中的“公”是谁、“十五年”从哪一年算起，学界都没有定论。有人认为“公”是当时的润州知州许遵，这只是推测。"},"352312":{"background":"熙宁七年秋，苏轼杭州通判任满，改任密州知州，北上途中经过润州。年谱只记了他在甘露寺请工匠摹拓陆探微画的狮子板，没有提到这首词。词没有题序，从内容看，应当是在宴席上为一位叫小莲的琵琶女子写的。地方官或友人设宴，请歌伎弹唱助兴，席间填一首小词相赠，是当时常见的应酬。但谁做东、小莲是什么人，都没有记载。","mood":"整首词写的是听曲和看人。先惊叹琵琶声的清亮，再从曲子里听出闺中女子的心事，最后在月光下写她的容貌。调子轻快明丽，属于宋人宴饮中常见的赠伎小词，看不出苏轼明显的个人感慨。他刚离开住了三年的杭州，往更偏远的北方去。席间的热闹也许能稍稍冲淡旅途的冷清，但这只是推测，词里并没有写到他自己。","lines":[{"line":"弹破碧云天","note":"小莲刚开始弹，声音就清亮激越，好像能把碧蓝的天空划开。这里是用夸张写听者猛然一惊的感受。"},{"line":"分明绣阁幽恨，都向曲中传","note":"苏轼从琴声里听出了深闺女子说不出口的心事。这是对演奏者的体贴和赞许，也是赠伎词里常见的写法。"},{"line":"素蛾今夜，故故随人，似斗婵娟","note":"月亮好像故意跟着她，要和她比美。这是用调笑的口吻夸她容貌出众，席间的气氛比较轻松。"}],"moods":["艳情"],"caveat":"这首词没有题序，也没有本事记载。系于熙宁七年十月润州，是根据苏轼的行踪推定的，没有直接证据。小莲的身份也无从考证。"},"351995":{"background":"熙宁七年（1074）秋，苏轼任满杭州通判，调任密州知州，离开杭州北上，十一月前后到了润州。杨元素（杨绘）这一年刚接替陈襄出任杭州知州，两人一见如故，诗词唱和很多。这首词题为“和杨元素”，是应和杨元素的咏梅之作。词中写的是梅下饮酒赋诗的聚会，看来是二人在离别途中相聚的一个片段。离任、赶路、与新朋友分手，这首词就写在这样的时候。","mood":"整首词的调子轻快热闹，雀儿争着上枝，花瓣掉进酒杯，客人喝醉了也不觉得冷，看不出一个刚被调离的人该有的愁闷。苏轼外放已经好几年，这次又要远去北方，前途难料。但他写的是眼前的乐趣和朋友的才情。结尾一转，由梅花想到枝头将要结出的酸果，提醒人好时光转眼就过去。这一点淡淡的惜别之意，留在了最后一句里。","lines":[{"line":"忽见客来花下坐，惊飞。","note":"雀儿看花看得入迷，人坐到树下才惊觉飞走。苏轼借雀儿写自己赏梅入神，对这次相聚兴致很高。"},{"line":"坐客无毡醉不知。","note":"借杜甫诗里“坐客寒无毡”的话，说客人寒酸也好，天冷也好，喝到酣处都不在意了。自嘲里带着和朋友相处的痛快。"},{"line":"一点微酸已著枝。","note":"花落酒散，枝上已有青梅的一点酸味。欢聚终会结束，季节和人事都在变，惜别的心思不明说，只藏在这一点“酸”里。"}],"moods":["闲适","咏物"],"caveat":"参考赏析把这首词定在熙宁七年初春的杭州，说杨元素当时是知州，但那年春天杭州知州还是陈襄，杨元素秋天才到任，所以这里依年谱定在十一月的润州；至于这次聚会具体在哪里、是不是二人当面同席，现有材料还不能确定。"},"352013":{"background":"熙宁七年（1074）秋，苏轼杭州通判任满，改知密州，北上途中经过润州。“元素”是杨绘的字。杨绘这年接替陈襄做杭州知州，不久也被召回京城，两人大致同路北行。杨绘是汉州绵竹人，和苏轼同属蜀地，又都因为对新法有异议吃过亏。这首词是两人在润州的酒席上，苏轼当面写给杨绘的，看语气是分手前的饯别。","mood":"上片说人生像浮萍，聚一次散一次，自己多病多愁，现在才看清这是一向的错。下片劝对方别推辞这杯酒，又说两人同是离乡漂泊的人，回蜀中的旧约到现在没能兑现。苏轼这时将近四十，从杭州转到更偏远的密州，前途看不清，家乡又越来越远。他对杨绘说的话，也是说给自己听：劝人宽心，自己的心并没有放宽。","lines":[{"line":"偶然相聚还离索","note":"两人在异乡碰巧聚到一起，没几天又要各奔东西。“还”字写出一种无可奈何：聚散由不得自己。"},{"line":"天涯同是伤沦落","note":"化用白居易“同是天涯沦落人”。两个蜀人都在外地做官，宦途不顺，这里是在说彼此同病相怜。"},{"line":"西望峨嵋，长羡归飞鹤","note":"峨眉山代指两人共同的家乡。看着往西飞回去的鹤只能羡慕，说明归乡的念头一直有，却做不到。"}],"moods":["送别","思乡"],"caveat":"这首词一般系于熙宁七年冬的润州（京口），但具体在哪次宴席上写、两人是在这里分手还是另有一次分别，各家说法不一；“分携如昨”指的是哪一次离别，也说不准。"},"352015":{"background":"熙宁七年秋，苏轼杭州通判任满。弟弟苏辙这时在齐州（今济南）任掌书记。兄弟俩自熙宁四年在颍州分别后，已有三年没见面。苏轼因此请求调到离齐州近一些的地方，朝廷派他去做密州知州。这首词写于北上赴任途中，年谱记作他沿海经过海州一带的时候。那天他天不亮就骑马上路，把一路的冷清和心里翻起的旧事写成这首词，寄给苏辙。","mood":"上片写赶早路的疲惫和孤单，由此生出“路走不完，人生有限”的倦意。下片回想兄弟俩少年时一起进京，以为辅佐君王不是难事，再看如今两人都因政见不合离开了朝廷，失意很明显。不过他没有停在抱怨上，而是用“用舍由时，行藏在我”来宽慰，这话既说给弟弟听，也说给自己听。这份放达里还带着不甘。","lines":[{"line":"世路无穷，劳生有限，似此区区长鲜欢。","note":"前面的路走不完，人生却有限，为一个小小官职这样奔波，很少有开心的时候。这是早行时最直接的倦意。"},{"line":"有笔头千字，胸中万卷，致君尧舜，此事何难。","note":"回想嘉祐初年兄弟俩一同考中进士时的自信，觉得凭才学辅佐君王并不难。拿来和现在对照，带着一点自嘲。"},{"line":"用舍由时，行藏在我，袖手何妨闲处看。","note":"用不用自己由时势决定，进退的分寸却在自己手里。“袖手闲看”是自我宽慰，也透出不愿卷进当时朝局的态度。"}],"moods":["怀人","旷达"],"caveat":"写作时间有不同说法：参考赏析说是熙宁七年七月，但苏轼当年秋后才离开杭州，年谱记在十一月经过海州时，更可信；具体写于途中哪一站，现在难以确定。"},"352016":{"background":"熙宁七年秋，苏轼杭州通判任满，改知密州，北上途中经过海州。前任海州知州孙洙（字巨源）八月十五日在景疏楼上饮酒作别，奉召回京。他在润州与苏轼相会，两人同行到楚州才分手。三个月后的十一月十五日，苏轼到了海州，现任太守又在这座景疏楼上请他喝酒，又是月圆之夜。在朋友刚离开的地方看着同一轮月亮，他写下这首词，寄给远在京城的巨源。","mood":"这首词写的是想念，却很少直接说自己。上片设想巨源那晚离开海州后，月亮一路跟着他；三个月里每到月圆，他都没人一起喝酒，对着自己的影子坐到天亮。下片又设想他在京城宫中值夜，看见晓月会想起旧事。苏轼这时自己也在路上，刚离开住了三年的杭州，要去更偏远的密州，身边没有知交。他把孤独放到朋友身上来写，写的其实也是自己。","lines":[{"line":"月随人千里","note":"作别那晚的月亮好像不肯留下，跟着巨源一路远去。借月写人走以后，大家的留恋也跟着他走了。"},{"line":"凭仗清淮，分明到海，中有相思泪。","note":"淮水东流入海，海州正在海边。苏轼说水里带着巨源的眼泪，既是说朋友在想他，也是说他读懂了这份情意。"},{"line":"此时看，回廊晓月，也应暗记。","note":"设想巨源在宫中值宿到天亮，看见廊下的残月，应该会默默想起景疏楼那一夜。这是猜测，也是盼望。"}],"moods":["怀人","羁旅"],"caveat":"上片写的是巨源一方的感受，还是苏轼借月抒写自己，读法不完全一致；词中“西垣清禁”指巨源回京后在宫中任职，他当时具体担任什么官职，我不能确定。"},"351974":{"background":"苏轼因与新法意见不合，自请外任，这时在杭州做通判。熙宁六年冬，他奉命到常州、润州一带赈济饥民，第二年仍在润州。柳瑾字子玉，是润州丹徒人，与苏轼既是亲戚，也是诗友。这时柳瑾要去舒州灵仙观任职，苏轼和他、刁约同游江中的金山。分手时苏轼写了这首词送他，同时还写了送行诗。","mood":"词里没有大声的哀叹，只有一层层的舍不得。夜里笛声惊醒了梦，月色和烟波铺满江面，要走的人迟迟没有动身。苏轼这时在外地任职，又为赈灾四处奔走，身边能一起作诗谈心的亲友本来就少。柳瑾这一去，管的大概是道观的闲差，送行的和远行的都算不上得意。所以这份惜别里，还带着一点各自漂泊、身不由己的怅惘。","lines":[{"line":"惊破绿窗幽梦。","note":"夜深时不知谁吹起笛子，把人从梦里惊醒。别离就在眼前，心里本来就不安稳，一点声音就睡不着了。"},{"line":"欲去又还不去。","note":"要走的人一再停下，话说了一遍又一遍，船还没开。几个字写尽了亲友分手前那段拖延和不舍。"},{"line":"飞絮送行舟。","note":"设想明天船开以后，送行的人追不上，只剩柳絮还跟着船飘。这是把自己想跟去的心意交给了柳絮。"}],"moods":["送别","怀人"],"caveat":"年谱只写了这首词作于熙宁七年，参考赏析把月份定在二月；柳瑾的去处，年谱记作舒州灵仙观，参考赏析的写法有出入，这里依年谱。"},"351975":{"background":"熙宁六年冬，苏轼以杭州通判的身份奉命去常州、润州一带赈济灾荒，在外奔走了好几个月，连除夕都是在常州城外的船上过的。这首词写他坐船离开京口（今镇江）的那一夜。从“公子佳人”“酒醒”来看，临行前当地应有一场饯别酒宴，有朋友，也有歌妓，他喝醉后上船，半夜才醒。词不是写给哪个具体的人，是一次公务途中酒散人别后的自述。","mood":"苏轼因政见不合离京外任，到这时已近三年，年近四十，又被派在外，始终没有安定的住处。酒宴上的热闹一散，回头只看到一座被烟雾遮住的城，这种落差让他想到故乡远在西南的眉山，自己却一直在东南各地跟人分别。词里没有激烈的愤懑，更多是倦意和茫然：他问“何时歇”，自己也答不上来。","lines":[{"line":"孤城回望苍烟合。","note":"刚才还灯火喧闹的京口城，回头一看只剩一团烟雾。人刚走，那边的热闹好像就和自己无关了。"},{"line":"觉来幽梦无人说。","note":"醒来想起刚做的梦，身边却没有能说的人。一船独行，席上那些朋友已经留在岸上了。"},{"line":"家在西南，长作东南别。","note":"家在四川，人却常年在江浙一带迎来送往。一次次告别都不是回家，这是全词最沉的一句。"}],"moods":["羁旅","思乡"],"caveat":"编年有出入：参考赏析定在熙宁六年（1073）冬，年谱定在熙宁七年（1074）。苏轼这趟公务跨了两个年头，离开京口的具体月份难以确定；这首词的题目也有作《述怀》的版本。"},"351976":{"background":"熙宁六年冬到七年春，苏轼以杭州通判的身份奉命到常州、润州一带赈济灾民。除夕他宿在常州城外，开春后到了润州，也就是京口。暮春时节，他在这里收到一封从四川老家寄来的信，信里问他到底哪一年才真的回乡。熙宁元年他离开四川，此后一直没有回去过。读完信，他写下这首词。同一时期，他还写了《画堂春》寄给弟弟苏辙。","mood":"上片先写雨后的春景，山水格外清新，接着笔锋一转，说离家人的愁怨怎么也洗不掉。下片由一封家书引出归期的追问。“真个”二字透出一种愧疚：回乡的话他大概说过不止一次，却一直没有做到。他离开四川已经六年，在地方任职，为公务奔走，回乡仍然遥遥无期。三十九岁就自称“白首”，是夸张，也是疲倦。他只能借酒送走春天，任眼泪在东风里流下。","lines":[{"line":"只有离人，幽恨终难洗。","note":"一场雨把山色洗得更鲜亮，却洗不掉客居他乡的人心里的愁怨。景色越好，他越觉得孤单。"},{"line":"问我何年，真个成归计。","note":"这是家书里的追问。“真个”像是家里人早听他说过要回去，这次要他给句实话，他却答不上来。"},{"line":"白首送春拚一醉。","note":"三十九岁称“白首”，夸张里带着年华白白流走的感慨。春天快过去了，归期还没有着落，只好豁出去喝个大醉。"}],"moods":["思乡","羁旅"],"caveat":"家书由谁寄出、信里具体写了什么，史料没有记载，只能从词句推测。"},"351977":{"background":"熙宁六年（1073）十一月，杭州通判苏轼奉命离开杭州，到常州、润州一带赈济灾荒。原以为不久就能回去，到第二年暮春，他仍留在润州，公务没有办完，归期也定不下来。题下注“代人寄远”，意思是借家中亲人的口吻，写给在外的自己。他设想杭州家里的人怎样数着日子等他回去。一般认为这位亲人是妻子王闰之。他没有直接诉说想家，而是写家人在想他，这样更含蓄。","mood":"这首词里是一种不张扬的思念和孤单。这时的苏轼没有被贬，只是因公出差，处境上没有大的起落。但他从冬天到春末一直在几个州之间奔波，眼看杨花都快落完了，自己还是回不了家。他不写自己的辛苦，反过来写家人独自对着月亮、看梁上燕子成双成对，借对方的寂寞写出自己在外的劳顿和牵挂。这种从对方那边写起的办法，让情绪显得克制，又很绵长。","lines":[{"line":"今年春尽，杨花似雪，犹不见还家。","note":"出门时下着雪，如今已是杨花飘飞的春末。用两种相似的白色标出时间，盼归的人等了一整个季节，还是没有等到。"},{"line":"对酒卷帘邀明月，风露透窗纱。","note":"家里人夜里独自饮酒，卷起帘子把月亮当作伴。等来的却是透过窗纱的夜风和凉露，冷清的感觉一下子显了出来。"},{"line":"恰似姮娥怜双燕，分明照、画梁斜。","note":"月光斜照在梁上成双的燕子身上，好像嫦娥羡慕它们相伴。燕子成双，人却独处，词人对家人的歉疚和自己的思念都在这一句里。"}],"moods":["怀人","羁旅"],"caveat":"题中只说“代人”，没有写明代的是谁，多数注本认为是妻子王闰之，也有人认为只是泛写思妇。写作时间一般定在熙宁七年三四月间，具体日子已无法确定。"},"351978":{"background":"熙宁六年冬，在杭州任通判的苏轼奉命到常州、润州一带赈济灾荒，离开杭州已有好几个月。次年他在润州（京口）准备沿运河回杭州，在路上写了这首词，寄给杭州知州陈襄（字述古）。陈襄是他的上司，也是他在杭州一起游湖、写诗互相应和的朋友。年谱记载苏轼这时想念钱塘，先寄诗给陈襄，陈襄也写了和诗。这首词写的是同样的心意。","mood":"这首词最主要的情绪是盼着回去。苏轼是四川人，杭州只是他做官的地方，他却把杭州当成要早点回去的家，可见在杭州两年多，他对那里已经有了真感情。他在灾区奔波了几个月，公务很辛苦，于是把重聚的期待放在一位老朋友身上，想着回去以后和陈襄在西湖边坐在草地上喝酒。最后说自己大概变老了，有点自嘲，也透出常年在外做官的疲惫。","lines":[{"line":"蜀客到江南，长忆吴山好","note":"他自称“蜀客”，承认自己是外乡人，却在离开杭州时一直想着那里的山，说明杭州已经成了他心里的归处。"},{"line":"还与去年人，共藉西湖草","note":"“去年人”指陈襄。他想象回去以后，像去年那样和老朋友坐在湖边草地上，盼的是一位具体的朋友。"},{"line":"莫惜尊前仔细看，应是容颜老","note":"他请朋友在酒席上好好看看自己，料想自己已经变老了。这是在说几个月奔波的辛苦，语气半开玩笑，也有点感慨。"}],"moods":["怀人","羁旅"],"caveat":"题目说“自京口还钱塘道中”，年谱记作于润州，这首词可能是在动身回杭州时写的；有的版本题作“感旧”，写作的具体月份没有确切记载。"},"351981":{"background":"熙宁七年，苏轼在杭州任通判，是知州陈襄（字述古）的副手。两人都不赞成新法，先后离开朝廷来到杭州，在这里共事两年多，一起治蝗、赈济饥民、疏浚钱塘六井，交情很深。这年陈襄调离杭州，临走前在吴山顶上的有美堂宴请属官，并请苏轼作词。苏轼在席上写成这首《虞美人》，题目写明是赠给述古的。","mood":"这首词既有不舍，又有分寸。上片替陈襄说出心里话：湖山这样好，太守走后不知还能回来几次，不如趁今晚喝醉，再多待一会儿。惜别的意思说得很直白。下片不再提离别，只写天黑后城里的灯火、远处的歌声，最后写到风停后满江的月光。苏轼自己也是外放在杭州，现在志同道合的上司又要走了。他没有诉苦，把情绪交给安静的江月，写得清澈而克制。","lines":[{"line":"使君能得几回来","note":"“使君”指陈襄。这一走路远任重，杭州的湖山以后未必能再来看几次，惜别之情借这一问说了出来。"},{"line":"水调谁家唱","note":"“水调”是声调偏悲的老曲子，杜牧有“谁家唱水调”的诗句。夜里不知谁家在唱，送别席上的人听了更添离愁。"},{"line":"惟有一江明月、碧琉璃","note":"宴席快散、人要回去的时候，只剩下钱塘江上的月光，江水碧绿得像琉璃。热闹过去，情绪也慢慢沉静下来。"}],"moods":["送别"],"caveat":"年谱只记在熙宁七年，没有写月份；参考赏析说是七月，但年谱又记九月苏轼因病没去陈襄的重九宴，可见陈襄九月还在杭州，具体月份不能确定。另外，“且徘徊”有的版本作“更徘徊”。"},"351982":{"background":"熙宁七年秋，苏轼在杭州任通判。知州陈襄（字述古）调任他处，朝廷派杨绘（字元素）来接任。按照惯例，杭州派出官妓到苏州去迎接新知州，同时城里还在为陈襄送行。这首词就写在一送一迎的交接当口，题目里“送述古迓元素”就是这个意思。陈襄是苏轼在杭州共事最久、来往最密的上司，这首词应该是送别宴上写给他看的。","mood":"这首词半是玩笑半是伤感。苏轼拿接驾的人打趣：人还没到，心已经飞去迎新官了。玩笑后面是对陈襄离开的不舍，又借深秋的冷雨衬出来。他身为通判，长官说换就换，自己只能留在原地送走一个、迎来一个。这种身不由己，他没有直说，用调侃轻轻带过了。","lines":[{"line":"先驱负弩何在，心已浙江西。","note":"古时迎接长官，有人背着弓弩在前面开路。苏轼打趣说，迎接的人早已动身，心思也跟着去了浙西，迎新的事早就安排好了。"},{"line":"花尽后，叶飞时。雨凄凄。","note":"花已谢尽，落叶纷飞，冷雨不停。点出送别是在深秋，也把不舍之情放进景色里，不用直接说出来。"},{"line":"若为情绪，更问新官，向旧官啼。","note":"意思是：这叫人怎么受得了？一边要去迎接新官，一边又对着旧官落泪。他用调侃的口气，说出一迎一送之间进退两难的心情。"}],"moods":["送别","怀人"],"caveat":"陈襄离杭的具体月份，以及末句是写官妓、写送行的众人还是苏轼自己，各家说法不一。“先驱负弩”指的是谁，也没有定论。"},"351983":{"background":"熙宁七年秋，苏轼在杭州任通判。原知州陈襄调走，朝廷派杨绘（字元素）接任。按当时风气，杭州的官妓要出城远迎新长官，这一回一直迎到苏州。苏州知州王诲（字规甫）是苏轼的朋友。苏轼借这件事写了这首小词寄给王诲：一面打趣迎接的阵势，一面半开玩笑地拜托他照看这些从杭州来的姑娘。","mood":"整首词语气轻松，是同僚之间的玩笑，用神仙典故把迎接新太守写成仙女下凡迎接仙人。不过“洞天冷落秋萧瑟”一句也透出些冷清：旧长官刚走，新长官还没到，自己身在其中，能感到人事在变动。这一年苏轼也在等候调任，不久就去了密州。这首词把这点不定的感觉藏在了戏谑后面。","lines":[{"line":"洞天冷落秋萧瑟。","note":"把杭州比作神仙洞府。人都出城去迎新官了，城里正值秋天，显得冷清，里面带着一点人事交替的空落。"},{"line":"借与韦郎看。","note":"韦郎借指曾任苏州刺史的韦应物，这里代指王诲。意思是姑娘们途经苏州，暂且借给你看看，是朋友间的玩笑话。"},{"line":"扁舟下五湖。","note":"用范蠡带着西施泛舟五湖的典故，假装担心王诲把人留下带走，用夸张的说法提醒朋友，开玩笑的意味很明显。"}],"moods":["闲适"],"caveat":"年谱定为熙宁七年秋，王规甫即王诲；末两句“莫便过姑苏，扁舟下五湖”在说谁、劝什么，各家理解不一，这里取戏劝王诲的说法。"},"351985":{"background":"熙宁七年，苏轼在杭州任通判，他的上司、杭州知州陈襄（字述古）调往南都应天府。两人共事两年多，政见相近，常在一起饮酒、游湖、写诗。陈襄临行前，西湖上设宴饯别，按当时的风气，席间有官妓劝酒唱曲。这首词不是用苏轼自己的口吻写的，而是替席上的歌妓们写，借她们的不舍来送这位上司兼朋友。陈襄离任时，苏轼前后写了好几首送别词，这是其中一首。","mood":"词面写歌妓的离愁：夜深月落，她们弹琵琶，梦里落泪，醒来眉间的妆已经花了，最后宴散人去。替别人说话，感情可以说得含蓄又得体，但里面也有苏轼自己的不舍。陈襄是他在杭州最合得来的长官，这次一走，西湖宴游的老朋友们就散了。苏轼自己不久也要离开杭州，所以聚散无常的感受格外清楚。","lines":[{"line":"相思拨断琵琶索","note":"借歌妓弹琵琶，写离别前心事难平。弹得用力，把弦都拨断了，相思有多重，不用明说也看得出来。"},{"line":"华堂堆烛泪","note":"饯别宴一直开到深夜，蜡烛烧残，烛泪堆积，正对着人的眼泪，写出宴席将散时的冷清和伤感。"},{"line":"应思陈孟公","note":"汉代陈遵字孟公，好客，会想办法留住客人。这里借这位同姓古人指陈襄，说大家散了以后会想念这位热情的主人，用称赞收尾。"}],"moods":["送别","怀人"],"caveat":"“长笛吹新水”里的“新水”，有人解作曲名（如《新水令》），有人解作新谱的曲子，说法不统一。"},"351986":{"background":"熙宁七年（1074），苏轼任杭州通判已近三年。知州陈襄（字述古）政见与他相近，两人共事融洽，常一起游湖写诗。这一年陈襄调任应天府，也就是北宋的南京。同僚在孤山竹阁为他设宴饯行，竹阁是白居易留下的旧迹，旁边的柏堂刚建成不久。席间有官妓劝酒唱曲，苏轼便用她的口吻写了这首词。同一时期，他还为陈襄写了《菩萨蛮》《清平乐》等几首送别词。","mood":"词面上写的是歌妓含泪劝酒，苏轼自己的不舍也藏在里面。前一年春天，他和陈襄带着歌舞游遍西湖；如今新堂刚落成，主人却要走了，热闹很快就成了往事。苏轼外放做通判，难得遇上一位意气相投的上司，送走陈襄，也就送走了一段愉快的日子。这一年稍晚，他自己也离开杭州，去密州任知州，所以对聚散不定体会更深。借女子的口吻来写，伤感说得含蓄，读来不觉沉重。","lines":[{"line":"漫道帝城天样远，天易见，见君难。","note":"别说京城远在天边，天抬头就能看见，往后想再见您却难了。用这种反常的比较来挽留，说得直接，分量很重。"},{"line":"飞絮落花，春色属明年。","note":"眼前花絮纷飞，明年春光照样会来，可那时陪着游湖的人已经不在了。景色还会重来，人却散了。"},{"line":"欲棹小舟寻旧事，无处问，水连天。","note":"想划船回去找当年同游的痕迹，眼前只有茫茫湖水，没处可问。往事说没就没了，结尾不说破，只留下空落落的感觉。"}],"moods":["送别","怀人"],"caveat":"这首词是代歌妓立言，哪些话属于歌妓、哪些是苏轼本人的感受，很难截然分开；年谱也没有记下饯别的具体月份，词中“飞絮落花”可能是眼前实景，也可能只是设想明年的春天，不宜据此断定时节。"},"351987":{"background":"熙宁七年，苏轼在杭州任通判，是知州陈襄（字述古）的副手。两人共事近两年，常一起游湖、题名、作诗唱和，交情很深。这年陈襄调任南都（应天府），临行前在西湖设宴告别。苏轼前后写了《江神子》《清平乐》和两首《菩萨蛮》为他送行，这是其中一首，写的就是湖上饯别席间的情景。","mood":"词里的不舍说得很直白：明知留不住，还想再留一天，又预先想到人走以后的冷清。苏轼没有写自己落泪，而是借席上歌女的眼泪和路人的哭声来写，由此看出陈襄在杭州很得人心，惜别里也带着对他为官的称许。这一年苏轼自己的通判任期也快满了，不久也要离开杭州，送别陈襄时，难免也感到同僚终究要各自离散。","lines":[{"line":"使君欲去还留住。","note":"使君指陈襄。湖上秋雨中，他本来已经要动身，又被众人留了下来。一走一留之间，可见同僚和百姓都舍不得他。"},{"line":"明朝愁杀人。","note":"今天勉强留住，也只是把分别往后推。到了明天人真的走了，那份愁苦更难承受，写的是对离别之后的预感。"},{"line":"路人啼更多。","note":"劝歌女不必皱眉流泪，因为路上的百姓哭得更厉害。借旁人的悲伤，从侧面写出陈襄在杭州的好名声。"}],"moods":["送别"],"caveat":"陈襄离开杭州的具体月份，各家说法略有不同，一般认为在熙宁七年秋。词中的“佳人”通常理解为饯别席上的歌妓。"},"351988":{"background":"熙宁七年，苏轼在杭州任通判，这时他因与新法不合离京外任已近三年。他的上司、杭州知州陈襄（字述古）调任应天府，也就是北宋的南京（今河南商丘）。两人共事约两年，常一起游览、唱和，交情很深。陈襄离任时，苏轼接连写了好几首词送他，这首《清平乐》是其中之一。词里没有写离席上的情景，写的是陈襄一路北去会看到的地方，以及他到任以后的样子。","mood":"这首词的离愁写得很淡，大半篇幅在替朋友设想路程和到任后的景物：淮水、汴河、深秋的梁园。这种设想本身就是牵挂。末两句借商丘的古人古事来称许陈襄，说忠义的风气还在，超然不问世事的傲吏却已没有了，语气里带一点感慨。苏轼和陈襄都与新法有分歧，同在外地做官，彼此惺惺相惜。他送陈襄远去，也难免想到自己的处境。","lines":[{"line":"红旆到时黄叶乱。","note":"苏轼设想陈襄的仪仗到南都时，正赶上深秋落叶纷飞。到任本是体面的事，配上这样的秋景，就带出了几分萧瑟和惜别。"},{"line":"停骖访古踟蹰。","note":"他料想陈襄到了这片古地，会停下车马寻访遗迹，迟迟不肯离去。这是在写朋友的性情，也透出苏轼自己对他的挂念。"},{"line":"双庙遗风尚在，漆园傲吏应无。","note":"双庙祭的是唐代死守睢阳的张巡、许远；漆园吏指庄子，相传他是这一带人。这句称赞陈襄担当实事、为官尽责。也有人读出一层言外之意：如今的世道已经容不下超然自处的人。"}],"moods":["送别","怀人"],"caveat":"陈襄离开杭州的具体月份，各家说法不完全一致，年谱也记有九月他还在杭州办重九宴集。“漆园傲吏应无”一句是单纯称颂，还是暗含对时局的感慨，学界理解不一。"},"351989":{"background":"陈襄字述古，熙宁五年起任杭州知州，是苏轼的上司，也是一位政见相近的前辈。两人共事两年多，一起主持疏浚钱塘六井，公余也常同游唱和。熙宁七年，陈襄调任南都（应天府，今河南商丘），苏轼前后为他写了好几首送别词。他一路追送到临平才分手，这首词写的就是分手后独自回程那一晚。","mood":"这首词没有劝慰，也不说前程，只写人走以后的空落：回头望城望不见人，夜里枕上睡不着，雨停了眼泪还停不下来。苏轼因与新法不合外放到杭州，陈襄是他在这里难得的知己和依靠。这年稍后，他自己也要离开杭州去密州。聚散由不得人，这种滋味在这次送别里格外真切。","lines":[{"line":"不见居人只见城。","note":"走出很远再回头，只望得见城的轮廓，人已经看不清了。能送到这么远、望这么久，可见舍不得。"},{"line":"迎客西来送客行。","note":"临平山上的塔当年看着陈襄从西边来，如今又看着他走，始终不动声色。人做不到这样，两年的交情这时都成了离愁。"},{"line":"秋雨晴时泪不晴。","note":"夜里对着残灯睡不着，外面的秋雨已经停了，心里的伤感却止不住。用天晴和泪不晴来对比，写的是平常人送别后的真实感受。"}],"moods":["送别","怀人"],"caveat":"参考赏析说陈襄七月离杭，但年谱九月八日还记有陈襄的重九之会，词中也写到“初寒”“秋雨”，所以确切的离别月份还难以断定。"},"351992":{"background":"熙宁七年秋，苏轼三年杭州通判任满，即将北上任密州知州。杨绘（字元素）这一年接替陈襄任杭州知州，到任不过数月，又被召回朝廷。两人都要离开杭州，于是与老词人张先一起在流杯亭饮酒话别。杨绘自己作了新调《劝金船》，苏轼依调和了这一首。词中“玉堂金阙”指朝廷，所以这首词主要是送杨绘入京。","mood":"词的前半写酒宴，轻松风趣，把流杯亭的曲水传杯比作兰亭雅集；后半写歌女唱到离别时声音哽咽，转入伤感。苏轼此时因与新法不合在地方任职，送别的却是要回朝廷的同僚。他祝愿对方前程顺利，又想到下次相见可能已经头发花白。这些年他总在迎来送往，所以这份惆怅里有真情，也带着自知前途难料的清醒。","lines":[{"line":"无情流水多情客。劝我如曾识。","note":"流水本来无情，却把酒杯送到我面前，好像早就认识我。借传杯的游戏说宾主相得，开头语气轻快。"},{"line":"尊前莫怪歌声咽。又还是轻别。","note":"别怪歌声哽咽，又一次这样轻易地分别了。“又”字说明这一年送别太多，苏轼自己也正要离开。"},{"line":"欲问再来何岁，应有华发。","note":"想问哪一年才能再聚，到那时恐怕两人都已白发。在祝贺对方入京的场合，坦白地流露出对时光和聚散的感慨。"}],"moods":["送别","感时"],"caveat":"年谱记的调名是《劝金船》，词题作《泛金船》，各本不同；“此去翱翔”一般解作送杨绘回朝，但杨绘召还的具体月份和官职，各家说法略有出入。"},"351993":{"background":"熙宁七年秋，苏轼在杭州通判任上三年期满，改任密州知州。这年新到杭州任知州的是杨绘（字元素）。他也是因为和新法意见不合离开朝廷的，和苏轼同在杭州共事只有几个月，两人却很投合。苏轼临走前，杨绘请他在西湖上喝酒，先写了一首《南乡子》，苏轼用同一词调和了这一首。所以这首词是在送别酒席上回答朋友的，话专门是对杨绘说的。","mood":"上片苏轼先设想自己到了密州，回头望杭州，两地隔得远，以后的事也说不准，再见面只能寄望于“功成还乡”这个遥远的念头。下片劝朋友别说伤别的话，最后一句却点破：送行的人自己先流了泪。他外放快三年了，现在又要离开繁华的杭州，去更偏远的北方。不舍和对前途的茫然他没有直说，而是藏在劝酒和玩笑里。","lines":[{"line":"云海天涯两渺茫。","note":"密州在北，杭州在南，中间隔着云和海。“两渺茫”既指两地互相望不见，也指各自前途难料，此后能不能重聚，谁也说不准。"},{"line":"醉笑陪公三万场。","note":"三万场大约相当于人一辈子的天数，意思是愿意陪你喝一辈子的酒。话说得这么满，恰恰是因为眼下马上要分开。"},{"line":"堕泪羊公却姓杨。","note":"西晋羊祜镇守襄阳，深得民心，他死后百姓看见他的碑就落泪。苏轼借“羊”“杨”同音打趣，说今晚掉泪的是这位杨公，用一句玩笑把伤感收住。"}],"moods":["送别","怀人"],"caveat":"苏轼离开杭州、这次湖上饮酒的确切日子没有定论，一般定在熙宁七年秋，大约九月。"},"351999":{"background":"年谱把这首词系于熙宁七年苏轼离杭赴密州前，说是赠给杨绘。但词的内容不太像送一位转任文官的知州：上片写朝廷下诏、战船齐发，有人弃文从军；下片转到家中女子的眼泪和盼信；结尾用的马援、绿珠，又都和岭南有关。受赠者更像一位随军南行的人。具体送的是谁、因为什么事，现有材料说不清，能确定的只是：这是一首送人远行、带着玩笑口吻的赠别词。","mood":"上片苏轼自称“迂儒”，在佩刀出征的人面前承认书生无用，这是自嘲，也是对行人的抬举。下片替留在家中的女子说话，写眼泪、报喜的蜘蛛、明珠，语气轻快，把离别的分量化进了调侃。这几年他在杭州不断送走同僚，自己也将调任，聚散成了常事。用说笑来写离情，正是他应付这种处境的办法。","lines":[{"line":"投笔将军因笑我，迂儒。","note":"对方投笔从戎，反过来笑我只会读书。苏轼拿自己开玩笑，衬出行人的英武，也带着几分书生的无奈。"},{"line":"喜子垂窗报捷书。","note":"喜子即蟢子，一种小蜘蛛，旧时看作喜兆。家人盼着窗前垂下蟢子，盼来的是平安和捷报。"},{"line":"一斛明珠换绿珠。","note":"石崇曾用明珠换得绿珠，绿珠是岭南人。这里大概是打趣行人：去了南方，可别也带个绿珠回来。"}],"moods":["送别","自嘲"],"caveat":"年谱定为熙宁七年赠杨绘，但楼船出征、伏波、绿珠等内容和杨绘的行迹对不上，从典故看可能与南方战事有关，编年和受赠者都难以确定。"},"352000":{"background":"“元素”是杨绘的字。杨绘因批评新法被调出朝廷，熙宁七年到杭州接替陈襄做知州。他在任只有几个月，就被召回京城。这时苏轼也接到了调任密州的命令，两人都要离开杭州。这首词作于临行前的送别宴席上。当时八十多岁的词人张先也在座，随后依原韵和了一首。这既是同僚之间的饯别，也是两个即将分开的人在互相道别。","mood":"这首词以惋惜和留恋为主，没有郑重的劝勉。一位投缘的长官刚来就走，留下的只有让人难忘的风度。苏轼用阮籍到东平没住几天就离开的典故跟杨绘开玩笑，口气轻松，底下却有失落。他自己也身不由己，马上要去别处，所以送别杨绘也像是在送别自己。结尾提前想到明年西湖上的惆怅，既是替杭州人留恋杨绘，也是替自己留恋杭州。","lines":[{"line":"千里远来还不住","note":"杨绘从远方赶来，还没住熟就被调走。这句接着阮籍的典故，半开玩笑地怪他来去匆匆，其实是舍不得。"},{"line":"红粉尊前添懊恼","note":"席上的歌女劝着酒，离别的烦恼反而更重了。热闹的场面和心里的不舍放在一起，更显出惜别之情。"},{"line":"西湖总是断肠声","note":"设想明年柳絮纷飞时，人们在西湖泛舟听到的歌声都会让人伤心。说的是杨绘走后，杭州人会想念他，苏轼自己同样有这份留恋。"}],"moods":["送别","怀人"],"caveat":"这首词的各种版本文字有出入，例如“添懊恼”有的版本作“深懊恼”。杨绘离开杭州和苏轼离开杭州的具体月份，各家年谱的记载也略有不同。"},"352003":{"background":"熙宁七年秋，苏轼杭州通判任满，改任密州知州，北上途中经过吴江。杨绘、张先、陈舜俞、李常、刘述等人一路同行或赶来相送，夜里众人在松江边的垂虹亭摆酒，月亮正圆，有人拉胡琴，苏轼先作了一首《南乡子》。陈舜俞（字令举）在席上填了词，苏轼当场依他的韵和了这一首。陈舜俞因反对青苗法被贬官，这时正在秀州乡下闲居。","mood":"这首词是写给陈舜俞的。表面上是席间劝酒、夸景色，底下是安慰朋友：有才的人迟迟得不到重用，只能闲着喝酒。苏轼替老天找了个说法：晚些给你高官，是为了让你独占这一江秋月。把失意说成福气，也是他宽慰自己。他同样因政见不合离开京城，现在又要去更偏远的密州。结尾盼朋友早日被召回，也带出聚少离多、来去匆忙的意思。","lines":[{"line":"天怜豪俊腰金晚。","note":"说陈舜俞这样的人才到这个年纪还没做到高官。“天怜”二字替朋友抱不平，也带着劝慰，口气是半开玩笑的。"},{"line":"身闲惟有酒。","note":"闲下来只剩喝酒，写的是陈舜俞罢官闲居，也是眼前酒席的实景。话说得轻松，底下有不得志的无奈。"},{"line":"帝梦已遥思。","note":"大概用了商王武丁梦见贤臣傅说的典故，意思是皇帝终会想起你、召你回朝。这是席上的祝愿，不一定是当时的实情。"}],"moods":["旷达","送别"],"caveat":"年谱这一条的夹注文字有错乱（混进了“裙带石榴红”等字样），“帝梦”一句具体指什么，各家注释的说法也不完全一致。"},"352012":{"background":"熙宁七年秋，苏轼杭州通判任满，改任密州知州，北上赴任。好友孙洙（字巨源）也因与新法不合而在外任职，这时刚卸任海州知州，被召回京城。两人在润州相会，同行到楚州才分手，苏轼在这里写了这首词送他。孙洙从海州来，所以上片写的是海州的山水和当地的古人；他这一去是回朝廷，苏轼却要继续北上，去更偏远的密州。一个回京，一个远走，这是这次分别的底色。","mood":"上片是对老友的敬重。海州是西汉疏广、疏受叔侄的故乡，二人辞官回乡，受人敬仰，苏轼拿他们来比孙洙，说他在任上添了白发，也留下了深厚的人情。下片转为不舍：传说海上的浮槎每年八月按时往来，人一走却没有回来的日子。孙洙入朝，前程看好，苏轼自己却离京城越来越远。称赞之中，可以读出一点他自己的落寞，但写得很克制，最后只落在“不归”两个字上。","lines":[{"line":"新白发，旧黄金。","note":"借二疏辞官、皇帝赐金送行的故事，说孙洙在海州任上添了白发，离开时州人殷勤相送，称赞他做官得人心。"},{"line":"槎有信，赴秋期。","note":"传说海上浮槎每年八月按时到来，孙洙也正是秋天离开海州。苏轼借这个典故写他应召进京，好比乘槎上天河。"},{"line":"使君行不归。","note":"浮槎年年还会回来，这位使君走了，却不会再回海州，两人也难再同行。不舍的心情全在“不归”二字里，话说得平淡，分量却很重。"}],"moods":["送别","怀人"],"caveat":"年谱只记在楚州作别，没有写月份。参考赏析定为十月；另据苏轼《永遇乐》词序，孙洙八月十五日离开海州，两人在润州相会，到楚州才分别，确切日期难以断定。"},"352014":{"background":"熙宁七年秋，苏轼杭州通判任满，改知密州，北上途中经过海州。当时海州的知州姓陈，早年做过眉山县令，在当地口碑很好。眉山是苏轼的家乡，苏轼年少时就见过这位父母官。多年后在异乡碰到故乡的旧县令，两人都已不再年轻。苏轼写这首词送给他，一是追忆往事，二是替家乡人表达感念。","mood":"这首词以感慨为主，基调并不悲凉。苏轼刚离开杭州，又要到一个陌生的州郡去，对人生聚散、宦海起落正有切身体会。看到陈知州的白发，他想到的也是自己这些年的奔波。所以下片劝对方，也像在劝自己：仕途进退不必多想。最后落到“终不忘”上，说明有些情分并不随官职变动而消散。","lines":[{"line":"长记鸣琴子贱堂。","note":"把陈知州比作古代弹琴就能治好单父的宓子贱，称赞他当年治理眉山清简有方，苏轼至今记得。"},{"line":"如今秋鬓数茎霜。","note":"当年他还是红颜黑发，如今鬓角已经斑白。这句写的是对方，苏轼对自身年华的感触也在里面。"},{"line":"仲卿终不忘桐乡。","note":"汉代朱邑做过桐乡小吏，临终要求葬在桐乡。这里借他说陈知州心里一直记着眉山，眉山百姓也记着他。"}],"moods":["怀人","旷达"],"caveat":"词题只称“陈海州”，这位知州的名字和生平，现有材料难以确定，本文没有指认具体是谁。"},"352031":{"background":"熙宁六年冬到七年春，苏轼以杭州通判的身份奉命到常州、润州一带赈济灾民，长时间在外奔走。这首词写于润州丹徒，年谱把它和同期得乡书、作《蝶恋花》记在一起。当时弟弟苏辙在齐州（今济南）任掌书记。兄弟俩自熙宁四年在颍州分别后，已经三年没有见面。他在公务间隙游湖，看到春景，想起弟弟，就把这首词寄给了子由。","mood":"上片写暮春郊野和湖上的热闹：麦浪起伏，小船飞快，众人齐声唱歌。下片到傍晚，平野上水汽浮动，天气晴暖，他的视线却转向北方的济南。景色越明快，他一个人在外的孤单和对弟弟的牵挂就越明显。这一年他接连收到乡书、作词寄弟，可见思亲之情很浓。同年秋天，他请求调任离弟弟较近的北方州郡，后来改知密州。这首词里的愁，和这个决定是相通的。","lines":[{"line":"晚湖净鉴新磨。","note":"傍晚湖面平静，像刚磨好的铜镜。他这时心境还算平和，暂时放下奔走赈灾的劳累。"},{"line":"济南何在暮云多。","note":"他向北望苏辙所在的济南，只见暮云层层，看不到那边。兄弟分隔太远，心里放不下。"},{"line":"归去奈愁何。","note":"游兴结束，就要回去了，愁绪却没法排遣。热闹散去以后，思念弟弟的心情反而更重。"}],"moods":["怀人","羁旅"],"caveat":"年谱把这首词系于熙宁七年的润州丹徒，学界一般采用这个说法。不过词里写的是哪一处湖面，现在无法确定。"},"352034":{"background":"熙宁七年秋，苏轼杭州通判任满，改任密州知州，北上途中经过湖州。湖州知州李常（字公择）是他的老朋友，政见相近，都不赞成新法。苏轼在湖州为李常新得儿子写了贺词，又在李常设的酒席上写下这首劝酒词。湖州的前一任知州孙觉也是两人的好友，两年前苏轼来湖州时由孙觉接待。这次旧地重来，主人换成了李常，词就从这件事写起。","mood":"字面上是席间的玩笑：拿孙觉的胡子、李常的个头打趣，夸新主人比旧主人还强。底下却有一层感慨。朋友们一个个外放，在各州之间调来调去；苏轼自己也刚离开住了三年的杭州，去更偏远的北方。秋色渐衰，眼前只剩菊花映着酒杯。结尾借刘禹锡的典故说春天的桃花都是“刘郎去后”才栽的，话说得轻松，其实是对人事更替、朝中换人的一声冷笑。","lines":[{"line":"旧日髯孙何处去，重来。","note":"上回来湖州，接待他的是留着大胡子的孙觉，如今孙觉已调走。重来故地，先想起不在场的老友。"},{"line":"秋色渐摧颓。","note":"写眼前的深秋景色，也暗合他此时的处境：朋友星散，自己又要远行，心里有些萧索。"},{"line":"尽是刘郎去后栽。","note":"借用刘禹锡被贬后重游玄都观的诗意：来年满树争开的桃花，都是旧人走后才栽的。半开玩笑，半带讥刺。"}],"moods":["怀人","感时"],"caveat":"“谢公台”具体指哪处古迹，注家说法不一；末句是否确指朝中新进之人，属于后人的解读，词中没有明说。"},"352154":{"background":"熙宁七年（1074）秋冬，苏轼以杭州通判身份到常州、润州一带赈济灾荒，年底留在常州（晋陵）。年谱说他在这里先写了《浣溪沙》“炙手无人傍屋头”，又“复赋”这一首，两首押同一组韵脚（头、楸、裘、求、秋），可见是接连写成。词里说和人“倾盖相逢”，说明席间有一位新结识、很投缘的朋友，但此人是谁，现有材料说不清。从内容看，他此时已经动了在常州一带安家终老的念头。","mood":"上片写的是落脚。故乡眉山的祖坟只能在梦里去看，归期遥遥，他干脆认定心能安下的地方就是养老之处。下片说要卖剑买牛、做个农人，有一点满足就够了，还盼着和眼前这位朋友结邻往来。这种心绪说是旷达，底子里却有无奈：苏轼在朝中不得志，回乡又没有指望，只好在异乡给自己找个安身的地方。","lines":[{"line":"故山空复梦松楸。","note":"松楸指眉山的祖坟。“空”和“复”两个字说明他一次次梦到回乡，醒来却无路可回，对故乡的思念里带着无力。"},{"line":"此心安处是菟裘。","note":"菟裘出自《左传》，指退隐养老的地方。他不再执意要回故乡，心能安下的地方就是归宿，等于为长久留在江南找了一个说法。"},{"line":"卖剑买牛吾欲老，乞浆得酒更何求。","note":"借西汉龚遂劝百姓卖剑买牛、回去种田的典故，表示自己愿意放下仕途、在乡野终老。讨水喝却得到酒，比喻所得已经超出期望，不再多求。"}],"moods":["旷达","思乡"],"caveat":"词中“倾盖相逢”的对象不详；“自适”这个题目和具体写作月份各家版本说法不一，这里按年谱系于熙宁七年冬，作于常州。"},"352155":{"background":"熙宁年间苏轼因与新法不合，自请外任，此时以杭州通判身份奉命到常州一带公干。年谱只记他在晋陵“复赋”此词。“复”字说明在这之前他已写过同调的词，但前作是哪一首，没有明确记载。词题“寓意”表明这首词别有所托，词中的“君”也是实有其人，可惜现存材料没有交代此人是谁、因什么事而写，只能从词句推想：大概是写给一位同样不得志、却不肯屈节的朋友。","mood":"上片写冷落。门前没有趋附的人，晚雨把梧桐、楸树的叶子打落，又借苏秦落魄归乡的典故自比，透出仕途受挫后的寂寞和清贫。下片笔锋一转，承认自己在当世已没有什么指望，却把对方比作古人，最后用岁寒松柏自许、也许人：外境越冷，越看得出操守。消沉里带着倔强，这正是他外放多年、和朝局格格不入时的心态。","lines":[{"line":"炙手无人傍屋头。","note":"反用“炙手可热”：没有权势的人来靠近，家门冷清。说的是失势后人情疏远，语气平静，却分明有感触。"},{"line":"顾我已无当世望，似君须向古人求。","note":"自认在今世已无前途，转而称赞对方的品格只有古人能比。一句自贬，一句敬人，把彼此放在同一处境里互相慰勉。"},{"line":"岁寒松柏肯惊秋。","note":"用《论语》岁寒松柏的典故：松柏哪会因秋寒而惊慌。表示越是逆境，越要守住节操，是全词落脚的地方。"}],"moods":["悲慨","自嘲"],"caveat":"词中“君”是谁、前作是哪一首都无可考。词里写的是秋景，与年谱把这首词系在常州、通常认为苏轼在当地的时间（冬春之间）不太吻合，编年可能有疑问。"},"351964":{"background":"熙宁七年年底，苏轼由杭州通判改任密州知州，到任才一两个月。密州土地贫瘠，当时又遭旱灾和蝗灾，公务繁重，和杭州的繁华差别很大。这首词不是写给谁的，也不是在宴席上应酬所作。题目已经说明了缘由：新年前后他生了一场病，病稍好能起身时，北方迟来的早春刚开始露头，他就记下了这几天对天气和身体的感受。他得的是什么病、病了多久，现有材料没有记载。","mood":"上片写夜里醒来，被子比前些日子容易焐热，钟鼓声也听得圆润了。病体在回暖，所以对春意格外敏感，透着欣喜。下片写别人忙着出城看花，他却说自己又病又懒，只想睡到太阳老高。四十岁就自称“衰病”，有病后的乏力，也有初到偏远州郡时提不起兴致、索性随它去的心态。同月他还写了梦见亡妻王弗的《江城子》，可见这段日子的心绪并不轻松。","lines":[{"line":"东风有信无人见，露微意、柳际花边。","note":"北方春天来得晚，春意只在柳梢花旁透出一点，旁人还没察觉，闲卧在床的病人倒先感觉到了。"},{"line":"寒夜纵长，孤衾易暖，钟鼓渐清圆。","note":"夜还长，一个人睡，被子却容易暖了，报时的钟鼓也听着清亮。这是身体渐好、心情跟着松动的直接感受。"},{"line":"疏慵自放，惟爱日高眠。","note":"前面写别人出城寻芳，这里一转，说自己又病又懒，只想睡到太阳老高。既是病后乏力，也有几分自嘲和自我放任。"}],"moods":["闲适","自嘲"],"caveat":"系年依据年谱定在熙宁八年初春、密州任上，但词题只写“初春病起”，没有注明年份和地点，系年属于推定；另外“少情”有的版本作“少悰”，“含山”有的版本作“衔山”。"},"352017":{"background":"熙宁七年秋，苏轼在杭州通判任满。因弟弟苏辙在齐州做官，他请求调到北方，改任密州知州，年底到任。这首词作于他在密州过的第一个元宵节，没有写给哪一个人，是节日当晚的抒怀。此前他在杭州连过了三个灯火繁盛的元宵，而密州地方贫瘠，又连年旱蝗，节日格外冷清。两地的落差在这一夜一齐涌上心头。","mood":"上片写回忆中的杭州，下片写眼前的密州，中间只靠“寂寞山城人老也”一句转过来。四十岁就说“老”，与年龄关系不大，更多是从江南繁华之地来到困穷小州，又离朝廷越来越远，心里生出的落寞。不过他并没有一味自伤：看到乡民击鼓吹箫祭社，他也走了进去；结尾阴云欲雪，景色凄冷，却也可能含着地方官盼雪润田的心思。","lines":[{"line":"灯火钱塘三五夜。","note":"人在密州过节，开篇却先写杭州的元宵。他心里最先浮现的是刚刚离开的繁华，这是回忆，也是暗中的对比。"},{"line":"寂寞山城人老也。","note":"全词的转折处。“寂寞”既指密州节日冷清，也指他自己的心境；四十岁说“老”，是处境变化带来的疲惫。"},{"line":"昏昏雪意云垂野。","note":"夜深人散，阴云低低压在原野上，眼看要下雪。景象压抑，但在旱灾之地，一场雪也关系着来年收成，或许藏着一点期望。"}],"moods":["感时","羁旅"],"caveat":"年谱所记“1月”应指农历正月；末句是否含有盼雪兆丰年的意思，属于后人的解读，并无定论。"},"352018":{"background":"熙宁八年正月二十日夜，苏轼到密州做知州才两三个月。这天夜里他梦见亡妻王弗，醒来后写下这首词。王弗十六岁嫁给他，陪他离开四川、步入仕途。治平二年（1065）她在汴京病逝，年仅二十七岁，第二年归葬眉山老家。到写词时，她去世已整十年。此时苏轼远在山东，离她的坟有几千里，想去坟前说几句话也做不到。这首词不是写给别人看的应酬之作，记的是一个人的私梦。","mood":"词里的哀伤压了十年，并不激烈：平时不刻意去想，却始终没有放下。苏轼这时四十岁，因为和朝廷推行的新法意见不合而离京外任。密州又是个穷地方，刚上任就遇到旱灾和蝗灾，公务繁重。“尘满面，鬓如霜”说的就是他眼下的样子。他怕妻子认不出被奔波磨老的自己。所以这首词在怀念亡妻的同时，也夹着他对自己这十年辛苦的回顾。","lines":[{"line":"千里孤坟，无处话凄凉。","note":"妻子葬在眉山，自己却在千里外的密州做官。连到坟前说几句心里话都不可能，满腹凄凉无人可诉。"},{"line":"纵使相逢应不识，尘满面，鬓如霜。","note":"他假设两人重逢，想到的却是妻子未必认得出自己。十年仕途奔波，四十岁已经满面风尘、两鬓斑白。"},{"line":"相顾无言，惟有泪千行。","note":"梦里终于见到了，却一句话也说不出来，只是相对流泪。十年里的生死离别和各自的苦楚，不知道该从哪里说起。"}],"moods":["伤逝","怀人"],"caveat":"王弗死于治平二年五月，正月二十日并不是她的忌日，有的赏析称“十年忌辰”不准确，这只是一次偶然的梦；“短松冈”一般理解为眉山王弗墓所在的山冈，具体地点难以确指。"},"352019":{"background":"熙宁七年年底，苏轼从杭州通判调任密州知州。到任时，当地已经连着几年闹旱灾和蝗灾。作为地方长官，他要主持祈雨、捕蝗，按惯例斋戒吃素，一连好几个月。第二年春天牡丹盛开，他没能去看一眼。到了熙宁八年九月，一株千叶牡丹意外开了一朵。那天正下着雨，他特地摆酒对着这朵花，写下这首词。从小序看，这首词没有赠给谁，是对这朵迟开的花说话，也是对自己说话。","mood":"上片回想春天。苏轼守在深院里，身边只有茶烟、青苔和飘落的柳絮榆钱。城西名园的牡丹，他只是听人说起。这份遗憾背后，是刚到一个贫苦州郡、一心忙着救灾的辛劳。秋天这朵晚开的花让他很受触动，好像花还记挂着他。不过他没有一直伤感下去。结尾说秋光短暂，不必强留花的余艳，把完整的春色留到明年。这里有惜花之情，大概也寄托着他对来年年景好转的盼望。","lines":[{"line":"闻道城西，长廊古寺，甲第名园","note":"满城牡丹最好的时候，他只能“听说”。斋戒救灾让他与春天隔开了，句子平淡，失落藏在里面。"},{"line":"秋向晚，一枝何事，向我依然","note":"他问这朵花为什么偏偏在深秋为他开放，把花当作有情的知己，心里又惊又感激。"},{"line":"不如留取，十分春态，付与明年","note":"他不强求眼前这点余艳，把希望交给明年。这是他自我宽解的方式，也暗含对灾后年景的期待。"}],"moods":["咏物","感时"],"caveat":"这首词编在熙宁八年秋，大体没有争议。小序中“一颛”的意思不好解，可能有传写错误，原字不能确定。"},"352020":{"background":"熙宁七年底，苏轼从杭州调任密州知州，到写这首词时已在任约一年。密州连年受旱灾和蝗灾。这年冬天，他到常山祭祀（一般认为与求雨有关），回程时和同僚梅户曹在铁沟一带打了一场猎，城里很多人跟出来看。这首词就是打猎后乘兴写成的。它不是写给某个人的，而是为这场热闹而作。他在给友人鲜于侁的信里说，自己让当地壮士拍手跺脚、吹笛打鼓地唱这首词，口气很得意。","mood":"词里的豪兴是真的，但也有不甘心。他才四十岁，却自称“老夫”，又说两鬓已经花白，这既是玩笑，也透着焦虑。他在地方上忙着救灾，一身抱负却没有机会施展。借打猎的兴头，他喊出自己还能上阵，盼着朝廷有一天重新起用他。热闹的场面下面，是一个被搁在边郡的人想证明自己还有用。","lines":[{"line":"老夫聊发少年狂。","note":"“聊”字是说姑且放纵一回。四十岁就自称老夫，带点自嘲，也说明这股兴致在平日里并不常有。"},{"line":"持节云中，何日遣冯唐。","note":"用汉文帝派冯唐持节赦免魏尚的典故，问朝廷哪天也能派人来重新起用自己，盼望中带着等待的焦虑。"},{"line":"会挽雕弓如满月，西北望，射天狼。","note":"把打猎的劲头转到边防上。当时宋和西夏在西北交战，他表示自己愿意为国出力，不只是在郊外射些野兽。"}],"moods":["豪放","感时"],"caveat":"冯唐一典中，苏轼是自比冯唐还是自比等待赦免的魏尚，各家说法不一；“天狼”多数认为指西夏，也有人认为兼指辽。"},"352022":{"background":"熙宁七年末，苏轼因与新法不合，从杭州调任密州知州。东武就是诸城，是密州的治所，县令赵昶（字晦之）是他身边的下属。熙宁八年，赵昶被罢去县令，要回海州，苏轼写了诗，又写了这首词为他送行。赵昶为什么丢官，现存材料没有交代。苏轼没有替他鸣不平，而是从朋友离开写到自己还得留下，借送别说出自己的心事。","mood":"这首词里既有敬重，也有惭愧。苏轼称赞赵昶丢了官也不动声色，接着说自己只有空名，却还待在官员行列里，并不相称。四十岁的他在新法之下做地方官，处处受牵制，想走又走不了。刚说完“不如归去”，马上承认自己并没有可以养家的田产。最后一句问哪天才能有田，是带着苦笑的自嘲：归隐只是心愿，眼下还得留在任上。","lines":[{"line":"三仕已之无喜愠。","note":"用《论语》中令尹子文三次做官、三次罢官都不露喜怒的典故，称赞赵昶丢官后很平静，也是在安慰他。"},{"line":"犹把虚名玷搢绅。","note":"笔锋转到自己：说自己只有空名，还留在士大夫行列里，辱没了官员的身份。话说得重，既是自谦，也透出对处境的不满。"},{"line":"待有良田是几时。","note":"前面借苏秦“负郭田二顷”的话和陶渊明《归去来兮辞》说想回乡，这里反问什么时候才有田，等于承认归隐遥遥无期。"}],"moods":["送别","自嘲"],"caveat":"赵昶被罢官的具体原因，史料没有记载；这首词一般编在熙宁八年，个别注本的系年可能稍有不同。"},"352203":{"background":"熙宁八年前后，苏轼因与新法主张不合，自请外放，在密州当知州。诸城县令赵昶（字晦之）任满离职，要回海州。诸城是密州的州治所在，赵昶等于是苏轼身边的同僚。他走的时候，苏轼除了写诗相送，还写了这首小词。词里说“故人重见”，看来两人在密州之前就认识，这次在此共事是重逢。只是他们早先在哪里结识，现有材料说不清楚。","mood":"这首词以送别开头，写着写着却转到了苏轼自己身上。他刚到四十岁，在密州过得清苦，地方上有蝗灾旱灾，他自己的俸禄也很微薄，仕途看不到起色。见到老朋友，他先感叹的是自己老了、世事变了，然后坦白说自己做官已经提不起劲。最后一句称赞朋友像青松一样耐得住寒冬，又说自己有愧，这里面有对朋友的敬重，也有几分自嘲。","lines":[{"line":"白首相看拟奈何。","note":"两人对面一看，头发都白了，又能怎么办呢。苏轼说得很直白，相见的高兴里带着无可奈何。"},{"line":"官况阑珊。","note":"意思是做官的处境窘迫，人也没了心气。这既说赵昶罢任回乡，更是苏轼在密州的真实感受。"},{"line":"惭愧青松守岁寒。","note":"用青松耐寒比喻朋友在困境中守得住节操，自己比不上，所以说“惭愧”。语气谦和，带点自嘲。"}],"moods":["送别","自嘲"],"caveat":"这首词编在熙宁八年，也有人认为应在熙宁九年。“春光亭”在哪里，苏、赵两人最初在哪里认识，现有材料都无法确定。"},"352024":{"background":"熙宁九年正月，苏轼在密州知州任上已过了一年多。文勋，字安国，以擅长篆书出名，这段时间正在密州，常和苏轼一起饮酒，苏轼还在他的酒席上作过一首《蝶恋花》。正月十三日文勋要回京城，那天早春天气却下起了小雪，苏轼冒雪为他饯行，写了这首词。对方回朝做官，前程可期；苏轼自己还留在偏远的州郡，送别的同时，也想到了自己将来的去处。","mood":"词里先是舍不得朋友走，接着是对自己的感伤。对方回去要升官佩印，苏轼却说自己大概该回乡过隐居日子。这话有几分客气，也有几分真心：外放几年，朝中局势没有好转的迹象，他年过四十，已经觉得头发要白了。所以他一再劝酒，还没分手就担心以后连书信都断了。这份怕被遗忘的心情，和他远离朝廷的处境是连在一起的。","lines":[{"line":"天岂无情，天也解、多情留客。","note":"把早春飘雪说成老天也懂得挽留客人，借天意说出自己想留住朋友的心思，开头就点明是送别。"},{"line":"君过春来纡组绶，我应归去耽泉石。","note":"一个回朝升迁，一个想着归隐山水，两人前途对照着写。祝贺朋友的话里，带着苏轼对自己处境的失落。"},{"line":"但莫遣、新燕却来时，音书绝。","note":"春燕飞回来的时候，别让书信断了。人还在眼前，就先怕将来被疏远，这是身在外地的人特有的牵挂。"}],"moods":["送别","悲慨"],"caveat":"文勋这时为什么在密州、担任什么差事，回朝以后做什么官，现有材料都说不清楚，这里不作推断。"},"352025":{"background":"熙宁九年初，苏轼任密州知州。李清臣（字邦直）当时任京东路提点刑狱，巡察到密州。两人一起登上苏轼刚修好的超然台，李清臣写了赋，苏轼把它刻在石上。两人谈得很投机。在这样熟络、轻松的场合，苏轼写了这首题为“戏邦直”的小词。他借一位女子的口吻，想象李清臣家中有人在思念他。词是写来逗朋友的，大概是在宴席上当场送给他的。","mood":"整首词的基调是玩笑。上片写女子从门缝里偷看，认出来人正是自己的意中人；下片写婚房里的旖旎，最后转成春天独守、望着归路的埋怨。苏轼借女子的口吻怪李清臣为公务四处奔走，把家人丢在一边。这时苏轼在密州生活清苦，又刚在上元节和正月二十日接连写下怀念杭州、悼念亡妻的作品。有老友来访，他能放下心事开个玩笑，也看得出他很珍惜这份交情。","lines":[{"line":"向青琐、隙中偷觑。","note":"女子隔着雕花门缝偷看来人，又害羞又好奇。苏轼故意把朋友写成被人偷偷看中的人，用来打趣他。"},{"line":"元来便是，共彩鸾仙侣。","note":"“彩鸾”借用仙女吴彩鸾与书生文箫结为夫妇的传说，意思是来人正是她命中注定的伴侣，拿神仙眷侣来恭维朋友，又带着调侃。"},{"line":"春来何事，故抛人别处。","note":"转成女子的埋怨：春天到了，为什么偏要把我丢在别处？暗指李清臣为巡察奔波在外，是朋友之间善意的挖苦。"}],"moods":["艳情","怀人"],"caveat":"年谱把这首词系于熙宁九年正月李清臣巡察密州时，但具体月份各家说法不一。“别驾”指谁、词中女子是不是影射李清臣的妻子，都只是推测，没有确证。"},"352222":{"background":"题目“惠州改前韵”和词中的合江楼都指向惠州，所以这首词应当作于绍圣元年至三年（1094—1096）苏轼贬居惠州期间，春末的可能性大。“前韵”指他早年写的一首《临江仙》。到惠州后，他拿旧作的韵和句子改成新篇，把惠州的合江楼和眼前景物写了进去。合江楼是他初到惠州时暂住的地方。词中的“使君”应是当时的惠州地方官，一般认为是知州詹范，但缺少直接的文献证明。这应该是一首和地方官往来应酬时写的词。","mood":"整首词惋惜春天过去，但并不沉重。三分春色里只掺了一分愁，可见愁是有的，却没有压倒其他心情。苏轼这时年近六十，又被贬到岭南。他把旧作改了重写，说自己和使君都白了头，不必再夸年轻时的风流，口气里有自嘲，也有接受现实的平静。结尾转到楼头佳人和山水的明净，愁绪被眼前景色冲淡了。这和他在惠州努力随遇而安的状态是一致的。","lines":[{"line":"三分春色一分愁。","note":"春光里只带着一分愁。愁并非没有，但苏轼有意把它压得很轻，不让伤春的情绪占了上风。"},{"line":"我与使君皆白首，休夸少年风流。","note":"他对同席的地方官说，我们都已白头，年轻时的风流就不提了。语气像老朋友之间的玩笑，暗中也有对自己老去和被贬的自嘲。"},{"line":"佳人斜倚合江楼，水光都眼净，山色总眉愁。","note":"结尾落在惠州的合江楼。水光明净，像佳人的眼睛；远山发暗，像她微皱的眉。前面那点愁意，就寄托在这淡淡的山色里了。"}],"moods":["感时","自嘲"],"caveat":"题目和合江楼都表明此词作于惠州时期（约1094—1096）。所给的1076年密州编年，大概对应的是被改写的那首旧作，与本篇不符。旧作写于何时何地、“使君”究竟是谁，学界都没有定论。"},"352029":{"background":"熙宁九年三月初三是上巳节，在密州知州任上的苏轼和同僚、宾客在城南的流杯亭聚会。照古俗，这一天人们要到水边洗濯，祓除不祥；文人则仿效曲水流觞，在水边饮酒作诗。小序交代了地点：城南有一道新修的堤，把河水引进城里，堤下的水边正好办这场雅集。词里的“君”是一同出游的人，具体是谁，没有记载可查。这首词是在聚会上为应节、记游而写的。","mood":"词从新堤涨满的春水、满山的落花写起，很快算到春天只剩三分之一，又冒出一句“官里事，何时毕”。苏轼到密州已一年多，先后遇上蝗灾和旱灾，公务繁重，又远离朝廷，心里常有倦意。所以他劝大家趁风雨还没来，赶紧出城游玩。结尾想到兰亭当年的名士如今只剩满山竹子，热闹之中带着对人生短促的清醒。","lines":[{"line":"问向前、犹有几多春，三之一。","note":"春天共三个月，到了三月初三，只剩最后一个月。他像算账一样数着剩下的春光，惜春的心思很急切。"},{"line":"官里事，何时毕。","note":"难得出来过节，却还是想起没完没了的公务。一句短短的抱怨，透出他在地方任上的疲惫和厌倦。"},{"line":"到如今、修竹满山阴，空陈迹。","note":"王羲之等人在兰亭修禊的盛会早已过去，只剩竹林和遗迹。眼前的欢聚将来也一样，所以更该珍惜。"}],"moods":["感时","旷达"],"caveat":"小序中“邞淇水”一名，各个版本文字不一，具体指哪条河不能确定；词中同游的“君”是谁，也已无从查考。"},"352032":{"background":"熙宁九年（1076）秋，苏轼在密州知州任上已近两年。超然台是他到任后修整的旧台，弟弟苏辙为它取名“超然”。这一晚，他和同僚、宾客在台上饮酒赏月，南望马耳山、九仙山，写下这首词。这年年底，朝廷调他改任河中府，不久他就离开了密州。词中写“回首便他年”，又嘱咐旁人“莫忘使君”，看起来他当时已经想到自己在这里待不久了。","mood":"上片写登台所见：远山、晚云、明月，又劝在座的人别急着散去，兴致很高。下片看到溪上的鸥鹭飞散，心情转向伤感。地方官任满就要调走，眼前的热闹转眼会变成回忆，所以他请人记住他在柳树、槐树下饮酒说笑的样子。密州偏僻，年成也不好，他却在这里安下了心。这份留恋里有知足，也夹着对聚散无常的感慨。","lines":[{"line":"城上高台，真个是超然。","note":"呼应台名“超然”。登高远望，暂时放下官场上的烦扰，他是真觉得轻松自在，说得也很直白。"},{"line":"人事凄凉，回首便他年。","note":"情绪在这里转折：今晚的欢聚很快会成为往事。也许他已经料到自己快要离任，所以提前生出离别的伤感。"},{"line":"莫忘使君歌笑处，垂柳下，矮槐前。","note":"“使君”指他自己。他请密州的友人记住他在柳下槐前说笑的情景，留恋之情落在具体的景物上，显得亲切。"}],"moods":["旷达","感时"],"caveat":"年谱定在熙宁九年十月。不过苏轼接到调任河中府的命令在这年年底，写这首词时他是否已经知道要离开密州，目前无法确定。"},"352030":{"background":"熙宁九年中秋，苏轼在密州知州任上，此前他因与新法不合，已离京外任多年。这天晚上他和人通宵喝酒，大醉之后写下这首词，题目里点明“兼怀子由”。子由是他的弟弟苏辙，当时在齐州（今济南）做官。苏轼当初请求调到密州，一个原因就是想离弟弟近一些。可他到任已近两年，兄弟俩还是没能见上一面；从熙宁四年在颍州分别算起，已经五年没有相聚。中秋本是团圆的日子，他就借着月亮，把这份挂念写了出来。","mood":"上片他想乘风飞上月宫，又怕那里太冷清，最后还是在人间对着影子起舞。这种想走又舍不得走的矛盾，多少带着他多年外放、仕途不顺时的心境：有过避开尘世的念头，最终还是留恋人间。下片从月光照着睡不着的人，转到埋怨月亮偏在人分别时圆，随后又自己劝自己：聚散本来就是常事。惆怅是真实的，但他最后把它化成了宽慰和祝愿。","lines":[{"line":"我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","note":"醉后想离开尘世飞到月宫去，转念又怕那里孤高清冷。想逃开又不忍真走，正是他此时进退两难的心情。"},{"line":"不应有恨，何事长向别时圆。","note":"月亮本该无怨无恨，为什么偏在人分离的时候圆？表面上是责怪月亮，其实是和弟弟多年不能团聚的怨叹。"},{"line":"但愿人长久，千里共婵娟。","note":"既然见不了面，就盼彼此平安长久，隔着千里同看一轮明月。把对子由的思念变成了一句祝愿。"}],"moods":["怀人","旷达"],"caveat":"有一种说法认为上片的“琼楼玉宇”暗指朝廷，寄托了苏轼对宋神宗的眷恋。这种说法出自后人笔记，学界看法不一，这里不作定论。"},"352033":{"background":"熙宁九年冬，苏轼在密州知州任上已近两年，朝廷调他改知河中府，他自己也快要离开了。就在这时，友人章传（字传道）先一步离开密州。初冬下着大雪，苏轼出城为他送行，写了这首词。题中的“东武”是诸城的古称。章传的生平记载很少，两人怎么相识、交情有多深，现在已经很难查清。从词意看，他们这一年在密州常有往来，相聚的时间不算短。","mood":"开头一句先叹时间：相聚不知不觉已近一年，又到了初寒时节。下雪像是有意挽留，客人却还是要走，苏轼只说今后“少清欢”，也就是少了一起过清淡日子、说说话的人。下片写客人越走越远，满眼雪花和云气，连超然台也找不到了。超然台是他在密州修起来、常和朋友登临的地方。这时他自己也将离任，所以这场送别里还带着他对整段密州生活快要结束的不舍。","lines":[{"line":"雪意留君君不住，从此去，少清欢。","note":"大雪像在替主人留客，可还是留不住。他不说如何悲伤，只说以后少了能一起享受清淡乐趣的同伴。"},{"line":"云海光宽，何处是超然。","note":"回头望去，雪光和云气连成一片，看不见超然台在哪里。超然台承载着他们在密州的相聚，也承载着苏轼想要的那种超然心境。"},{"line":"知道故人相念否，携翠袖，倚朱阑。","note":"想象客人走后，自己仍会带着歌伎登台、倚着栏杆远望。他问远去的朋友：你可知道我还在这里想念你？"}],"moods":["送别","怀人"],"caveat":"章传的生平事迹没有详细记载；“转头山”是实有的山名，还是随行途中景色写下的说法，历来没有定论。"},"352002":{"background":"熙宁九年四月，冯京（字当世）出任成都知府。他做过参知政事，对新法有所保留，政见和苏轼相近。当时成都西北的茂州一带，蕃部与汉人起了冲突。冯京到任后以安抚为主，局面很快平定。苏轼自己因与新法不合而外任，这时在密州做知州。消息传来，他写这首词寄给冯京，祝贺他稳住了西南。成都在苏轼的故乡蜀地，所以他对这件事格外关心。","mood":"全词以欣慰和称许为主，底下有一层思乡。苏轼离开四川已多年，这时又在离家很远的山东做官。听说家乡由可靠的人镇守，他连做梦回乡都觉得安稳。下片劝冯京去浣花溪、药市和百姓同游，口气轻松，像老朋友之间的叮嘱。两人都是在新法格局下离开朝廷的人，苏轼希望对方能在地方上做出实绩，这份期许里也有同道之间的惺惺相惜。","lines":[{"line":"见说岷峨凄怆，旋闻江汉澄清。","note":"刚听说故乡山川一带不太平，转眼又传来已经安定的消息，宽慰之中透着苏轼对蜀地的牵挂。"},{"line":"但觉秋来归梦好，西南自有长城。","note":"家乡有可靠的人守着，苏轼梦里回乡也睡得安稳。这一句既写思乡，也称冯京是国家倚重的屏障。"},{"line":"莫负花溪纵赏，何妨药市微行。","note":"苏轼劝冯京公务之余去成都百姓聚集的游赏盛会，与民同乐，熟悉家乡风俗的亲切感也在其中。"}],"moods":["思乡","怀人"],"caveat":"题目写作“湖州寄”，但熙宁九年苏轼在密州，到湖州任职是元丰二年的事。参考赏析说此词作于他“由湖州调任密州”时，这和苏轼的已知行迹不符。所以题中“湖州”二字和“南守”的确切含义都存疑，这里按年谱定于密州时期。"},"352023":{"background":"熙宁九年正月，苏轼在密州做知州。这里地方贫瘠，生活远不如在杭州时宽裕。据词题，那天下着小雪，席上有擅长吹笛、击鼓的客人，苏轼已经喝到半醉。这时有人送来一首写严寒的诗，请他唱和。他没有按惯例依韵作诗，而是填了这首词作答，把酒席上的热闹写给那位在冷屋里写诗的人看。送诗的人是谁，词题没有交代。","mood":"整首词是酒酣耳热时的轻快：帘外雨雪交加，帘内有笑语、灯火、鼓声，舞罢的人衣衫被汗湿透。末两句才转向那位写苦寒诗的人，是朋友之间的打趣。这份热闹背后有底色：同一个正月，他写词追忆杭州上元节的繁华，又写《江神子》悼念亡妻王弗。在密州清冷的日子里尽兴喝一场，也可以看作给自己找一点暖意。","lines":[{"line":"深惜今年正月暖。","note":"窗外明明在下雪，席上的人却珍惜这个正月的暖。暖不在天气，在酒、灯火和满座的人情。"},{"line":"掺鼓渔阳挝未遍。","note":"借祢衡击奏《渔阳掺挝》的典故，只取鼓声激越的意思，写客人击鼓正起劲，一曲还没打完，兴致正浓。"},{"line":"清诗未就冰生砚。","note":"回应那首苦寒诗：砚台里的墨都冻住了，诗还没写成，和帘内的热闹形成对照。语气是调侃。也可以理解为苏轼自嘲写不出和诗，干脆用词来答。"}],"moods":["闲适","自嘲"],"caveat":"年谱说苏轼曾在文勋席上写过一首《蝶恋花》，但那是不是这一首、是不是正月十三送文勋还朝的那次宴席，现有材料定不下来；送苦寒诗的人也查不出是谁。"},"352026":{"background":"熙宁七年秋，苏轼因与新法不合，自请由杭州调往密州，想离在齐州做官的弟弟苏辙近一些。密州地方贫瘠，他到任后又碰上旱灾和蝗灾，日子过得清苦。熙宁八年，他修整了城北一座旧台，苏辙为它取名“超然”，苏轼自己也写了《超然台记》，说人能把心放在得失之外，到哪里都能快乐。第二年暮春，寒食刚过，他登上这座台眺望全城，写下这首小词。词没有题赠对象，是他登高时写给自己的。","mood":"上片写景，看得开阔，心情也舒展。下片陡然一转：酒醒之后，人反而叹起气来。寒食清明本是回乡扫墓的时节，父母葬在四川眉山，他却远在山东做地方官，什么时候能回去说不准，和弟弟也已多年没有见面。“休”和“且”两个字是在劝自己别再往下想，先把眼前的茶和酒过好。所谓超然，是他压住思念和失意，有意给自己找的出路，并不是真的心无挂碍。","lines":[{"line":"半壕春水一城花。","note":"站在台上看，城壕里涨了半壕春水，满城都开着花。这是密州难得的好光景，他看得很投入。"},{"line":"寒食后，酒醒却咨嗟。","note":"寒食过后照例要回乡扫墓，他却回不去。喝酒时还能忘掉，酒一醒，思乡的愁绪就冒了出来，忍不住叹气。"},{"line":"休对故人思故国，且将新火试新茶。","note":"寒食禁火过后重新生火，他拿新火煮新茶，劝自己别在老朋友面前念叨故乡，先顾好眼下。这是在自我宽解。"}],"moods":["思乡","旷达"],"caveat":"作于熙宁九年暮春是通行说法；“故国”一般解作故乡眉山，也有人认为暗指京城朝廷，两说可以并存。"},"352035":{"background":"熙宁九年底，苏轼在密州任满，改任河中府知府。次年正月西行，路过齐州（今济南）。当时齐州知州是老朋友李常（字公择）。李常先写诗来迎接他，苏轼就写了这首作答。几年前李常任湖州知州，苏轼在杭州做通判，曾到湖州和他宴饮游乐。这次在济南重逢，苏轼就借这首小词翻出湖州的旧日交情。在济南期间，弟弟苏辙的几个儿子也出城迎接，李常还拿出外甥黄庭坚的诗文给他看。","mood":"前两句写得轻快。雪后放晴，春意已到，马蹄也变轻了，这是一路向西、快见到老友时的心情。后两句提到湖州的歌女，笑问李常还记不记得当年的欢宴，带着老朋友之间的玩笑。他在密州过了两年荒凉的日子，现在又要调往外地，见到故人当然高兴。可聚会总要散，《阳关》本来就是送别的曲子，所以欢喜里也带着一点对聚散无常的感慨。","lines":[{"line":"行到龙山马足轻","note":"苏轼从东边过来，龙山离济南已经很近。马蹄变轻，其实是人心里轻快，因为马上就能见到李常。"},{"line":"使君莫忘霅溪女","note":"使君指李常。霅溪代指湖州。苏轼用当年湖州宴席上的歌女和他开玩笑，也就是提醒他别忘了两人在湖州的交情。"},{"line":"时作阳关肠断声","note":"《阳关》是送别的曲子。写歌女常唱这种让人断肠的曲调，表面是取笑李常，底下也透出相聚不久、终要分别的伤感。"}],"moods":["怀人"],"caveat":"大多数年谱把这首词定在熙宁十年正月苏轼路过齐州时，但霅溪女具体指湖州哪次宴会、哪位歌女，没有确切记载，只能推测。"},"352027":{"background":"苏轼因与新法意见不合而请求外任，此时在密州做知州已到第三年。这首词没有题序，年谱也只记了“赋《望江南》”，看不出为谁而写，也看不出是在哪次聚会上作的，更像一位地方官在暮春时节看到眼前景色随手写下的。密州前两年先旱后蝗，苏轼为灭蝗、求雨四处奔走，所以格外留意雨水和农时。这年年底他就调离密州，这是他在当地过的最后一个春天。","mood":"上片借用《论语》里曾点“浴乎沂，风乎舞雩，咏而归”的话，又加上曲水流觞的旧俗，写人们换上轻薄的春衣，喝酒吟诗，是读书人心目中的太平景象。下片目光转到田野：小雨过后，到处都在催人下地，桃李已经谢尽，鸟叫声也换成了鹁鸪，春色落到了菜花上。心思从游玩转到农事，符合他作为州官、刚熬过灾年的处境。语气平和，有几分放心。","lines":[{"line":"酣咏乐升平。","note":"借曾点“咏而归”的意思，写喝到尽兴、吟诗为乐的太平光景。对刚熬过旱灾蝗灾的州官来说，这份太平里多少带着庆幸。"},{"line":"微雨过，何处不催耕。","note":"一场小雨过后，到处都在催人下田。苏轼在密州多次为求雨奔走，看到雨后春耕，他对农事的关心和欣慰都写在这一句里。"},{"line":"春色属芜菁。","note":"桃李落尽，春天只剩下田里的芜菁花。芜菁是百姓常吃的菜，把春色交给它，说明他的眼光落在了农家的日子上。"}],"moods":["闲适"],"caveat":"这首词没有题序，通行的编年本把它系于熙宁九年暮春，但具体月份和写作场合都没有记载；有人把“桃李尽”“属芜菁”理解为暗指人事变迁，不过缺乏确证。"},"352038":{"background":"熙宁十年春，苏轼从密州任上回到汴京附近，改任徐州知州。按通常说法，他这次没能进城，在城外暂住了一段时间。题中的“小王都尉”一般认为是驸马都尉王诜（字晋卿），他是苏轼的好友，喜欢书画，家里养着歌姬。这首词是在王诜家的宴席上写的，赠给席间一位侍女。词里写她的美貌，也拿主人开玩笑，是朋友之间的应酬游戏之作。","mood":"这首词的基调轻松，带着调笑。苏轼借刘晨、刘禹锡的典故，说这里的佳人是自己没见过的，又笑主人天天对着这样的人，不知道怎么安放心思。轻快的语气底下也有一点感慨：他离开京城快六年，刘禹锡回长安时写过“前度刘郎今又来”，苏轼用“刘郎”自比，暗含京城人事已变、自己仍要外任的意思。两年后乌台诗案，王诜因为和苏轼往来受到牵连，这段交往也被翻出来追究。","lines":[{"line":"满院桃花，尽是刘郎未见。","note":"表面是夸王家姬妾众多、自己从没见过；也借刘禹锡重回京城的典故，暗写自己久别汴京，眼前一切都是新的。"},{"line":"问君终日，怎安排心眼。","note":"转过来调侃主人王诜：这样的美人天天在跟前，你的心思和眼睛该往哪里放？这是朋友间不拘礼数的玩笑。"},{"line":"须信道、司空自来见惯。","note":"用“司空见惯”的典故收尾，替主人回答：在你这里不过是平常事，只有我这个外来客才会看得心动神摇，语气里带点自嘲。"}],"moods":["艳情","自嘲"],"caveat":"年谱这一条只记了孔舜亮赠诗的事，没有记这次宴会。“小王都尉”是不是王诜，以及这首词是不是写于熙宁十年汴京，都是按通行的注本推定的，学界对编年还有不同意见。"},"352039":{"background":"熙宁十年（1077）春，苏轼刚卸任密州知州，原定改知河中府，走到京城附近又改派徐州，没有获准进城，暂住在城外。这首词编在这个时候，但年谱只记了他和答孔舜亮赠诗，没有记这首词为谁、因何事而作。词里的柳有人的影子，末句又直接称“君”，看来有具体的对象，但这个人是谁，没有可靠的记载。","mood":"上片称赞柳的风姿和骨相，下片写它长在无人经过的角落，到了飞絮、成荫的时节只会一天天瘦下去。用心最多的是“有才貌却没人赏识”这一层。这时苏轼外放已经好几年，连京城都没能进去。把柳中人的寂寞看成他对自己处境的投影，说得通，但这只是推测，词里没有明说。结尾盼东风替柳舒展眉头，在怜惜之外留了一点暖意。","lines":[{"line":"仍更是、骨体清英雅秀。","note":"夸柳不停在腰肢好看，而是落到骨相清朗秀雅，看重的是品格，不只是容貌。"},{"line":"永丰坊那畔，尽日无人，惟见金丝弄晴昼。","note":"借用白居易永丰柳的诗意：天气晴好、柳丝金亮，却整天没人来看。美而被冷落，是全词的核心。"},{"line":"又莫是、东风逐君来，便吹散眉间，一点春皱。","note":"用猜测的口气盼东风随“君”到来，抚平柳叶般微皱的眉头，在惋惜中留一点宽慰。"}],"moods":["咏物","怀人"],"caveat":"这首词编在熙宁十年春，只是一说，并无确证。开头“江南腊尽”和人在汴京附近的处境不太对得上，所写的对象究竟是谁也无从考定，所以写作时间、地点和缘由都还存疑。"},"352040":{"background":"熙宁十年（1077）春，苏轼由密州改任徐州知州。弟弟苏辙（子由）这时要去南京（应天府）任职，便先陪哥哥到徐州，住了一百多天。兄弟俩自熙宁四年分手后，已经七年没在一起过中秋。这一年八月十五，两人终于在徐州同赏中秋月，而苏辙不久就要动身离开。这首小词就写在这个晚上，是写给团聚中的弟弟，也是写给自己。","mood":"上一年中秋，苏轼在密州独自写下“但愿人长久”，盼着和弟弟团聚；这一年愿望实现了，他心里却并不只有高兴。月亮越圆满，他越清楚这样的夜晚难得，也留不住。他做地方官，任期一满就要调走，弟弟马上也要远行，明年各在哪里谁也说不准。眼前的欢聚和预想中的分离叠在一起，这首词写的就是这种又珍惜又不安的心情。","lines":[{"line":"银汉无声转玉盘","note":"银河静静无声，圆月慢慢移过夜空。写的是夜色清朗，也让人觉出时间在一刻不停地流走，好夜晚正在过去。"},{"line":"此生此夜不长好","note":"一生之中，像今晚这样兄弟团聚、月色正好的时候不会常有。这是在欢聚当中，坦白说出对好景难留的感触。"},{"line":"明月明年何处看","note":"明年中秋还会有月亮，可兄弟俩会在哪里、还能不能一起看，都说不准。他用一个问句收尾，并不给出答案，留下的是怅惘。"}],"moods":["怀人","感时"],"caveat":"这首作品原是苏轼的七言绝句（集中题作《中秋作》），后来按《阳关曲》的曲调歌唱，所以也收进词集。词中没有点明为苏辙而写，说它作于兄弟同过中秋之时，是根据苏辙同年所作《水调歌头·徐州中秋》等材料推断出来的，学界普遍采信。"},"352041":{"background":"熙宁十年（1077）苏轼刚由密州改任徐州知州。弟弟苏辙去南京（应天府）赴任，顺路在徐州陪了他一百多天，两人一起过了中秋。兄弟分开多年，这是难得的团聚。中秋后苏辙要走，作《水调歌头》留别，写得十分伤感。苏轼觉得弟弟太悲，就和了这一首。词里一面劝弟弟，也劝自己，及早抽身退隐，一面用将来兄弟同归的快乐来安慰他。","mood":"上片讲谢安：他本有隐居的心愿，被官职拖住没能实现，最后带病回到西州。苏轼借这件事说明，退得太晚会留下终身遗憾，既是告诫弟弟，也是提醒自己。下片语气转软，设想日后兄弟一起回乡，一路上醉了唱歌、互相搀扶。这时他仕途还没有大的挫折，但对官场的厌倦，加上兄弟总是聚少离多，让他把退隐看成真正可以盼望的事。","lines":[{"line":"一旦功成名遂，准拟东还海道，扶病入西州。","note":"谢安原想功成后走海路东归隐居，结果带病回到西州就死了。苏轼借这件憾事说明，退隐一拖再拖，可能就永远退不成。"},{"line":"岁云暮，须早计，要褐裘。","note":"一年将尽，人也不年轻了，该早做打算，备好布衣准备回乡。四十出头的苏轼把退隐说得这样急，是在提醒弟弟，也在提醒自己。"},{"line":"我醉歌时君和，醉倒须君扶我，惟酒可忘忧。","note":"他想象退隐后兄弟天天在一起，你唱我和，醉了互相扶着，口气亲近，用将来的团聚冲淡眼前的离别。"}],"moods":["送别","旷达"],"caveat":"末两句用《三国志·陈登传》里刘备“卧百尺楼上”的典故，苏轼是自比“求田问舍”的人、任刘备去嘲笑，还是另有用意，历来注家理解不完全一致。"},"352050":{"background":"熙宁十年春，苏轼由密州改任徐州知州，到彭城才几个月。这年秋天，本地士人颜复（字长道）奉召入京，苏轼为他饯行，同时送别梁先（字吉老），写了这首词。颜复是彭城人，在当地有学问名声；梁先的生平留下的记载很少。年谱只记颜复赴阙，梁先是否与他同行、要去哪里，都不清楚。送别地点在一座“古台”的西边，词中没有说是哪座台。","mood":"这首词写景多，说情少。浅溪、薄云、废沼、深林，秋天的气息清冷，却不显得衰败，直到末句才落到“肠断”二字。苏轼初到徐州，刚和当地士人有了往来，颜复等人又要离开。他自己几年来从杭州到密州再到徐州，一路调动，对送人远行的滋味体会很深。不过全词语气克制，把伤感留在迷茫的草色里，没有说尽。","lines":[{"line":"送君何处古台西。","note":"用问句引出送别地点。古台年代久远，人事却一再离散，平平说出的地点里带着不舍。"},{"line":"废沼夜来秋水满，茂林深处晚莺啼。","note":"荒废的池塘一夜之间涨满秋水，深林里传来傍晚的莺声。眼前景物清寂，天色渐晚，分手的时刻已经近了。"},{"line":"行人肠断草凄迷。","note":"远行的人伤心到了极点，前路被迷蒙的草色遮住。离别的痛楚借草色写出来，不再多加议论。"}],"moods":["送别"],"caveat":"年谱把此词系于熙宁十年，但没有记载月份，从“秋水”推断应在秋季，是否在当年八月徐州大水之前无法确定；“古台”有人猜是徐州戏马台，没有确证；题中“梁吉”即梁先（吉老），依照的是年谱的说法。"},"352163":{"background":"熙宁十年春，苏轼从密州卸任，原定改知河中府，途中又改派徐州，于是在京城一带停留了一段时间。据年谱，他和老友孙洙（字巨源）在驸马都尉王诜（字晋卿）的园中相会。王诜好客，设宴时让家中歌女出来唱曲劝酒。这首词就是在席上即兴写成的，写宴席陈设、歌女的容貌和歌声。它是一首应酬之作，写给主人看，也写给同座的朋友看。","mood":"整首词轻快，带着酒酣时的玩笑。苏轼自称“狂客”，说心肠被歌女搅乱了，又说亲眼所见胜过宋玉凭空的想象。这份轻松有它的底色：他离开朝廷已有多年，这次回京仍要外放，前途并不明朗。能和王诜、孙洙这样的知交聚在一起，他暂时把这些放下了。两年后乌台诗案发，王诜也因为和他往来受了牵连，回头看这一夜的欢聚，就更显得难得。","lines":[{"line":"主人情重，开宴出红妆","note":"感谢王诜的厚意：主人特地设宴，还请家中歌女出来唱曲。宾主交情亲密，这首词正是应主人之情而作。"},{"line":"坐中有狂客，恼乱愁肠","note":"借用“狂客”的说法，半开玩笑地说席上有人被歌女扰乱了心绪。这是熟朋友之间的打趣，“狂客”很可能是他在自嘲。"},{"line":"亲曾见，全胜宋玉，想像赋高唐","note":"宋玉写《高唐赋》，神女只存在于想象里；他却说自己亲眼见到的胜过宋玉，以此称赞歌女，也恭维了主人。"}],"moods":["艳情","闲适"],"caveat":"此词编年依据年谱所记的王诜园中之会。苏轼这年初到京城时据说未获准入城，宴会的具体地点和日期难以确定；“狂客”是自指还是指座中别人，也没有定论。"},"352171":{"background":"熙宁十年（1077年），苏轼在徐州任知州。依年谱，此时王缄要回四川，苏轼写这首词为他送行。王缄是苏轼亡妻王弗的弟弟。王弗在治平二年（1065年）病逝，归葬眉州故里。来人既是妻家亲人，又是从家乡来、要回家乡去的人，所以这次送别同时牵动了两份心事：一份是对故乡的思念，一份是对亡妻的记挂。","mood":"词中的悲伤，比一般送别要沉重。苏轼离开四川已近十年，一直在各地做地方官，前一年才从密州调任，居处总是不定。他说自己平日已经尽量不去想家，可亲人来了又要走，压下去的思念重新涌上来。词的末尾说自己就像驿站里的过客，说不出哪里才是家，听来像是想开了，其实是无处可归的苦楚。","lines":[{"line":"忘却成都来十载，因君未免思量。","note":"离开蜀地快十年，本想把家乡和旧事放下。你一来，就忍不住又想起来了。“忘却”是有意压着，并不是真的忘了。"},{"line":"故山知好在，孤客自悲凉。","note":"从你口中知道家乡一切都好，心里稍感安慰。可我仍是一个人漂在外头，家乡越好，自己越觉得冷清。"},{"line":"此身如传舍，何处是吾乡。","note":"人就像驿站，过客来来去去，这身子也只是暂时寄住。家乡回不去，眼下的地方也不是家，这是在问自己究竟属于哪里。"}],"moods":["送别","思乡"],"caveat":"有两处说法不一：一是编年，年谱定在熙宁十年徐州，参考赏析则认为作于杭州通判任上，把“十载”算作王弗归葬后的十年；二是送别的人，词题写作王箴，年谱写作王缄。暂从年谱。"},"352239":{"background":"熙宁十年（1077年）苏轼四十二岁，刚从密州调任徐州知州。年谱只记了他在徐州写下这首赠王友道的词，没有写王友道是谁，也没有写赠词的场合。王友道的生平现在已难查清。从词意看，这是位清瘦而有风度的朋友，大概正经历一场消瘦或病后的恢复。他爱谈玄理，也有些风流情事。苏轼借赠词的机会，夸他风度不减，又劝他保养身心。","mood":"上片是夸赞，下片是规劝，语气亲近，还带几分玩笑。词里用的多是王姓前人的典故，比如王衍谈玄、王恭披鹤氅，大概是拿对方的姓氏开玩笑。苏轼这几年辗转外任，心思渐渐转向养生、保全本真。劝朋友少些清谈和风流、多守住自己，也像是在提醒自己。至于“蜀客”一句，苏轼自己也是蜀人，读来像是连自己也一起调侃了。","lines":[{"line":"试看披鹤氅，仍是谪仙人。","note":"借王恭披鹤氅、李白被称谪仙的典故，说朋友虽然清瘦，一披上鹤氅，照样有出尘的风度。这是朋友间真心的赞赏。"},{"line":"省可清言挥玉麈，真须保器全真。","note":"劝他少学魏晋名士挥着麈尾空谈，要紧的是爱惜身体，守住本性。语气由夸转为认真的叮嘱。"},{"line":"不应同蜀客，惟爱卓文君。","note":"借司马相如迷恋卓文君的故事，提醒他别耽于情事。司马相如是蜀人，苏轼也是，所以这句劝人的话里也带着自嘲。"}],"moods":["旷达","自嘲"],"caveat":"王友道的生平和赠词的具体缘由，现有材料都说不清；这首词编在熙宁十年徐州任上，依据的是年谱，词中没有直接的内证。"},"352249":{"background":"熙宁十年初，苏轼卸任密州知州，奉命改知河中府，赴任途中经过郓州。老友鲜于侁在新堂设宴款待他，还送了一幅吴道子画的佛像。年谱把这首《浣溪沙》系在郓州，很可能作于这类宴饮场合，写的是席间的一位歌女。不过词题只作“有感”，究竟为谁而写、是否就作于鲜于侁的席上，现存材料都没有明说，只能推测。","mood":"上片夸一位女子天生白净，不必涂脂抹粉，语气轻快，带点调笑。下片说席上有人能为她写赋，自己也愿把词交给她唱，仍是宴席上应酬的口吻。到末句忽然一转，说梦魂要往东去寻“桑榆”。桑榆常用来比喻晚年。此时他四十二岁，刚离开一州，又要远赴新的任所，热闹的酒席之外，隐约流露出对年华流逝和人生归宿的挂念。","lines":[{"line":"莫教施粉与施朱。","note":"劝她别再搽粉抹红，本来的样子就好。这是酒席上对歌女的称赞，也合乎苏轼一向偏爱天然、不喜雕饰的趣味。"},{"line":"凭君送与雪儿书。","note":"借李密爱姬雪儿的典故，意思是把文字交给歌女去唱。由此可见，这首词本来就是在席上佐酒、应景而作。"},{"line":"梦魂东去觅桑榆。","note":"全词唯一转向自己的一句。桑榆暗指晚年时光，梦魂向东寻觅，或许是挂念东边刚离开的旧地与故人。具体指什么，注家说法不一。"}],"moods":["艳情","感时"],"caveat":"年谱虽然把此词系于熙宁十年郓州，但是否作于鲜于侁的席上、所写女子是谁，以及“粉奴”和末句“东去”具体指什么，都缺乏确证。"},"352052":{"background":"元丰元年（1078）秋，苏轼在徐州知州任上已近两年。前一年秋天黄河决口，洪水围城，他带领军民守住了城。这年秋天，纪念治水的黄楼建成，重阳节那天他在楼上大宴宾客，另写有《九日黄楼作》诗。这首词写的是重阳宴席上的情景，席上有歌女侑酒。词中没有写明为谁而作，也没有交代是不是那场黄楼宴会。","mood":"上片是自嘲。头发少了，鬓边已经见白，美人却偏要给他簪上菊花。下片写满座年轻人和花间蜂蝶的热闹，正在高兴时，忽然想到明年这样的聚会恐怕难有了。这不只是中年人对岁月敏感。地方官三年一任，去留由朝廷安排，他在徐州的日子不会太长。果然第二年春天他就调往湖州，不久便遭遇乌台诗案。","lines":[{"line":"美人怜我老，玉手簪金菊。","note":"四十出头就自称老。美人给他插菊花，他一面享受，一面笑自己。重阳簪菊本是节俗，到他这里添了几分岁月之感。"},{"line":"明年人纵健，此会应难复。","note":"全词在这里转折。就算明年身体还好，官职调动、人事聚散也很难再凑齐这一席，正热闹时就想到了散场。"},{"line":"须细看，晚来明月和银烛。","note":"既然难再相聚，就趁今晚把月色和烛光看仔细。这是珍惜眼前，并不一味伤感，收得平静。"}],"moods":["感时","自嘲"],"caveat":"有的版本题作“湖州暂来徐州重阳作”，但苏轼离开徐州到湖州以后，再没有重阳回徐州的可能（元丰二年重阳他正关在御史台狱中），所以一般系于元丰元年徐州重阳；是否作于黄楼宴会，没有确证。"},"352051":{"background":"元丰元年秋，苏轼到徐州做知州已经一年多。前一年黄河决口，洪水围城，他住在城上指挥防守。水退后，他在城东修了黄楼，这年秋天刚刚建成。城里的燕子楼是唐代旧迹，传说张尚书的爱妾盼盼在主人死后独自在楼里住了十多年。某天夜里苏轼从梦中醒来，在小园里走了一遍，又登上燕子楼，写下这首词。词不是写给哪个人的，是他深夜独处时对自己说的话。","mood":"上片的夜景很清静，可惜没有人看，醒着的只有他一个。下片直接说累了。他离开家乡眉山快十年，从杭州、密州一路调到徐州，回家的日子看不到头。从盼盼的故事，他想到古往今来的人都被过去的欢喜和眼前的怨恨缠着，自己也一样。他又想到刚建好的黄楼，将来也会成为后人凭吊的旧迹。这种感慨不是消沉。正是在做出一番事业的时候，他看清了这些终究都会过去。","lines":[{"line":"天涯倦客，山中归路，望断故园心眼。","note":"自称在外漂泊、已经疲倦的人。他想走回山中故乡，心里眼里一直望着家乡，却望不到。"},{"line":"古今如梦，何曾梦觉，但有旧欢新怨。","note":"刚从梦里醒来，他想到人这一生本身就是一场没醒的梦。盼盼和他自己都困在旧日的欢喜和新生的怨恨里。"},{"line":"异时对、黄楼夜景，为余浩叹。","note":"黄楼是他抗洪后亲手修起来的。他料想后人夜里看着黄楼感叹他，就像今晚他看着燕子楼感叹盼盼一样。"}],"moods":["禅悟","思乡"],"caveat":"词题各本不同，常见本子作“彭城夜宿燕子楼，梦盼盼，因作此词”，他究竟是宿在楼中梦见盼盼，还是梦醒后才登楼，说法不一；盼盼是张建封的妾还是他儿子张愔的妾，也有两种说法。"},"351994":{"background":"按年谱，这首词写于元丰元年（1078），苏轼四十三岁，正在徐州做知州。他因与新法不合而在地方上辗转任职，前一年秋天刚带领徐州军民抗过一场大水。词题“和杨元素”，说明这是答杨绘（字元素）的唱和之作。两人在杭州时已有交往，彼此常用《南乡子》往来唱和。杨绘的原作今天看不到，所以无法确知苏轼具体在回应什么。从词意看，他是在向老朋友讲述自己夏日里闲散的日常。","mood":"整首词写夏天午睡、听衙、读书，看上去悠闲，底下藏着倦意。治水的紧张过去之后，州里公务清简。他自己说功名心越来越淡，想到“归去”，又笑自己笨拙。这种自嘲是写给老友看的。他用轻松的口气，说出了久任外官、施展不开的无奈，也说出了对官场的疏离。话不说重，正是他在逆境中常用的自处办法。","lines":[{"line":"睡听晚衙无个事，徐徐。","note":"躺着听傍晚衙门议事，发现并没有要紧的事，可以慢慢来。这里写公务清闲，也透出一点闲得无聊的意味。"},{"line":"搔首赋归欤。","note":"借孔子“归与归与”的话，说自己挠着头想回去。辞官的念头半真半假，是他对仕途的倦怠。"},{"line":"占得人间一味愚。","note":"老友问起太守的才气，他回答说自己只占了一个“愚”字。这是自嘲，也暗暗表示自己不愿随世俗机巧。"}],"moods":["闲适","自嘲"],"caveat":"杨绘原唱已经失传。这首词的编年各家说法不一，有的版本把它和苏轼在杭州时与杨绘的其他唱和词放在一起。本文依照年谱，定为徐州时期的作品。"},"352042":{"background":"元丰元年（1078），苏轼在徐州任知州。旧友闾丘孝终（字公显，题中“朝议”指他的朝议大夫官衔）路过徐州，两人重逢。分手时，苏轼在水边送他乘船离开，写了这首词相赠。四年前，也就是熙宁七年，苏轼从杭州调往密州，途经苏州，曾与闾丘孝终相聚。开头“一别姑苏已四年”说的就是那次见面。这首词是为这次短暂的重逢和送别写的应酬之作，但写得有真情。","mood":"全词以重逢的喜悦为底色，也夹着对年华流逝的感慨。这四年里，苏轼从杭州到密州再到徐州，一直在地方上奔走，自觉两鬓已白。见到老友气色不减当年，他把“老”揽到自己身上，把“驻颜”让给对方，既体贴朋友，也带点自嘲。结尾写夜深相对，恍惚像在梦里，这是久别重逢、转眼又要分手时的真实感受，聚散不定的意识隐约可见。","lines":[{"line":"一别姑苏已四年。","note":"开门见山算时间。四年间苏轼换了几处任所，一句平常话里有世事匆匆的感慨。"},{"line":"霜鬓不须催我老，杏丹依旧驻君颜。","note":"拿自己的白发和友人不改的容颜对照：说的是我老了，祝的是你没变。语气轻松，又透出岁月催人的无奈。"},{"line":"夜阑相对梦魂间。","note":"夜深了两人还对坐着，反倒觉得不像真的。重逢来得突然，离别又近在眼前，只好说恍如梦中。"}],"moods":["怀人","送别"],"caveat":"题中“时还徐州”具体指什么，“画帘重见水中仙”写的是人（有人认为是席间歌伎）还是景，以及“杏丹”一本作“杏花”，各家理解和版本不尽一致。"},"352037":{"background":"元丰元年暮春，苏轼任徐州知州已快一年。他和老友李常（字公择）都因不赞同新法而在外地做官。这一年李常来到徐州，住了一段时间。据年谱，两人这段时间常常一起游玩宴饮：苏轼约李常喝酒，在席上写了戴花诗；两人还一起去云龙山拜访隐士张天骥（即年谱中的“张山人”）。李常离开徐州时，苏轼写了这首词，另外还作诗送行。李常这次离开后去哪里上任，这里不作推断。","mood":"上片写的是送别时的园子：没有风，花自己往下落，柳树已老，樱桃花期已过。热闹的日子已经过去，就像这次相聚也到了要散的时候。下片想象朋友当晚独自在船上，最后落到两人互相思念。此时苏轼在徐州的公务做得有成绩，心情并不低落。词里的寂寞，主要是因为难得见面的老友又要走了。也有人说词中暗含盼望回朝的意思，这只是一种解读。","lines":[{"line":"簌簌无风花自堕。","note":"没有风，花也一片片自己落下来。春天到头本来就是这样，相聚也总有散的时候。语气平静，又带着一点无可奈何。"},{"line":"系缆渔村，月暗孤灯火。","note":"朋友还没走远，苏轼已经在想他今晚把船拴在荒僻的渔村，月色昏暗，只有一盏灯陪着他。分手还没到，牵挂已经先来了。"},{"line":"我思君处君思我。","note":"我想你的时候，你也正在想我。前后两半句互相呼应，把一个人的惦念写成两人同样的心意，可见他对这份交情很有把握。"}],"moods":["送别","怀人"],"caveat":"年谱定此词作于元丰元年，地点徐州，一般没有异议。各本文字略有不同，如“照座”有作“照坐”，“千转柁”有作“人转舵”。至于“凭仗飞魂招楚些”是否寄托盼望回朝之意，只是后人的推测。"},"352044":{"background":"元丰元年，苏轼到徐州任知州已近一年。前一年秋天黄河决口，他刚带着军民守住城池；这年春天又遇大旱，庄稼收成堪忧。按地方官的惯例，他到城东石潭求雨，并写了祷文。雨真的下了，他又亲自去石潭答谢。往返途中经过乡村，他把沿途所见写成《浣溪沙》五首，这是第一首。这首词不是写给某个人的，是一位知州记下百姓得雨后的样子。","mood":"整首词透着一种松了口气的高兴。旱情关系到一州的收成，求雨能不能应验，一直是压在知州心上的事。现在雨来了，潭水清了，村里的树绿了，老人孩子都跑出来看热闹，他看什么都觉得顺眼。他因政见不合离京到地方任职，几年来在治水、抗旱这些实事里找到了做官的意义。这种和百姓一起高兴的心情，比在朝中争论时单纯得多。","lines":[{"line":"照日深红暖见鱼","note":"夕阳把潭水映红，鱼游到水面来晒暖。旱时潭水浑浊，现在清得能看见鱼。这个细节写出了雨后的变化，也看得出他心里的担子已经放下。"},{"line":"黄童白叟聚睢盱","note":"孩子和老人都围过来，睁大眼睛，满脸喜色。他们在看来谢雨的知州，他在看百姓的高兴，双方的喜悦是相通的。"},{"line":"归家说与采桑姑","note":"他设想这些看热闹的人回家以后，会把今天的见闻讲给在家采桑的妇女听。这一句带着笑意，把眼前的热闹延伸到了画面之外。"}],"moods":["闲适"],"caveat":"下片“麋鹿”“猿猱”两句理解不一：有人认为是借来比喻拘谨的老人和活泼的孩子，也有人认为只是实写山间的动物。另外，这组词写于这一年的哪一月哪一天，目前没有确切记载。"},"352043":{"background":"元丰元年，苏轼在徐州任知州，外放地方已经多年。京东西路转运判官李察（字公恕）这时奉召入京，苏轼为他写了送行诗，又填了这首词。从词句看，饯别是在官府放假的日子，一场人不多的酒席上：初春天色阴沉，帘外雪越下越大，座中客人已半醉。这首词是席间写给即将回朝的同僚的，也写到了留在原地的自己。","mood":"上片是酒席上难得的轻松：放假了，不妨低声唱几句。下片转向冷清。词中借杜牧任分司御史、在洛阳宴席上讨要歌妓紫云的旧事，感叹那样的狂放风流再也追不回来。末两句最直白：做知州要常年审案问囚，很耗心力；忽然看见一只鹤，心头一惊，鹤所代表的闲散自在，正是他此时没有的。送别同僚回朝，映出的是自己困在地方公务里的疲惫。","lines":[{"line":"自古相从休务日，何妨低唱微吟。","note":"开头先替这场酒宴找个理由：休假日朋友相聚，自古就是这样，轻声唱几句又何妨。语气轻快，像是从平日公务的拘束里暂时松开。"},{"line":"闻道分司狂御史，紫云无路追寻。","note":"用杜牧洛阳席上讨要紫云的典故，说那种不拘礼法的风流已经没处可寻。里面有惜别的意思，也有对眼下处处受拘束的感叹。"},{"line":"问囚长损气，见鹤忽惊心。","note":"知州要审理狱讼，常年问囚很伤元气；偶然看见闲逸的鹤，猛然惊觉自己身心疲惫、不得自由，是全词最见真情的一句。"}],"moods":["送别"],"caveat":"此词另有题作《冬日即事》的版本（注释所引即此题），与“送李公恕”的题目和词中“春阴”的时令不完全吻合；“狂御史”一句是苏轼自比还是指李察，也有不同理解。"},"352045":{"background":"元丰元年（1078）春天，徐州大旱。知州苏轼按当时的惯例，到城东二十里的石潭求雨。下雨以后，他又亲自去石潭谢神，把一路上看到的乡村景象写成《浣溪沙》五首，这是第二首。这首词不是写给哪个人的，是一位地方官在公务途中随手记下的见闻。前一年秋天，他刚带着全城抗过黄河决口的洪水，这次旱情解除，麦子能收了，他心里是实实在在地松了口气。","mood":"全词几乎都是白描：村里的姑娘匆匆打扮出门看知州，挤在篱门口把裙子都踩破了；老老少少赶去赛神；路边还躺着一个喝醉的老汉。苏轼带着笑意看这些热闹和失态，心情轻松，没有居高临下的架子。他因为与新法不合才出京做地方官，但在徐州能给百姓办实事，水灾旱灾都挺过来了。正是这份踏实，让他乐意和乡民一起高兴。","lines":[{"line":"旋抹红妆看使君。","note":"听说知州来了，村里的姑娘赶紧抹上胭脂跑出来看。“旋”字写出那股匆忙，苏轼看在眼里，觉得好笑，也觉得亲切。"},{"line":"相挨踏破茜罗裙。","note":"人挤着人，连红罗裙都被踩破了。写的是农家女子的好奇和热闹，也看得出官和民之间并不生分。"},{"line":"道逢醉叟卧黄昏。","note":"黄昏回去的路上，碰见一个醉倒在路边的老人。雨下了，麦子收了，人才喝得起酒、醉得安心，这一笔把全村的欢喜收住了。"}],"moods":["闲适"],"caveat":"本词第三句通行本作“相挨”，有的本子作“相排”。五首谢雨词具体写于哪个月，各家说法略有不同，一般认为在初夏麦收前后。"},"352047":{"background":"元丰元年，苏轼任徐州知州。前一年秋天，他刚带领军民守住被黄河洪水围困的徐州城；这年春天又遇大旱。作为地方长官，他到城东约二十里的石潭求雨，并写了祷文。雨下了以后，他按照礼俗再去石潭答谢。往返途中，他把沿途村落的见闻写成五首《浣溪沙》，这是第四首。这首词不是写给某个人的，记的是一位知州雨后下乡时路上的所见所感。","mood":"词里没有写官场上的心事，写的只是一个走累了的人：喝了酒发困，路又长；太阳升高了口渴，就去敲农家的门讨茶。这份轻松是有来由的：旱情解除，家家缲车在响，瓜也上了市，说明农家的日子能过下去。苏轼刚经历过洪水，又为旱灾忧心了一春，这些寻常的声响对他是很实在的宽慰。他也没有摆太守的身份，像普通路人一样上门求茶。","lines":[{"line":"村南村北响缲车","note":"从村南到村北，到处都是缫丝车的声音。蚕事照常进行，说明旱后生计还在。他在路上听到这些声响，心里踏实了。"},{"line":"酒困路长惟欲睡，日高人渴漫思茶","note":"谢雨时喝了酒，回程又长，困得只想睡；日头高了，口渴想喝茶。直写身体的疲乏，不加修饰，事情办完后的松弛也在其中。"},{"line":"敲门试问野人家","note":"他走到一户农家门前，敲门试着问能不能讨碗茶。“试问”二字带着客气和试探，是以路人而不是长官的身份去叩门。"}],"moods":["闲适"],"caveat":"第三句另有版本作“牛衣古柳卖黄瓜”，“簌簌”一作“蔌蔌”；谢雨的具体月份年谱没有记载，根据枣花、缲车推测在初夏。"},"352048":{"background":"元丰元年，苏轼任徐州知州的第二年。前一年秋天黄河决口，洪水围城，他亲自上城督守。这年又遇到大旱，他按地方官的惯例，到城东约二十里的石潭求雨。雨下来以后，他再去石潭谢神，把来回路上所见写成五首《浣溪沙》，这是最后一首。这首词不是写给哪个人的，写的是一位知州旱情刚解、骑马回城时的感想。","mood":"这首词的底色是松快。连着经历了水灾和旱灾，如今雨水来得正是时候，路上干净，庄稼长得好，他悬着的心落了下来。心情一放松，就冒出了“几时回乡种地”的念头。这个念头一半出于真心喜欢田园，一半带着对官场的倦意：他因政见不合离京外任已有多年，归田的话在这几年的诗文里常常出现。结尾说自己本来就是乡下人，语气亲近，没有牢骚。","lines":[{"line":"何时收拾耦耕身","note":"骑马走在雨后的乡路上，他忽然自问哪天才能脱下官服去种田，羡慕之中带着几分说不出口的疲倦。"},{"line":"日暖桑麻光似泼，风来蒿艾气如薰","note":"阳光照在桑麻上亮得晃眼，风里带着蒿艾的气味。这是旱情解除后才有的生机，知州看在眼里，心里也跟着踏实了。"},{"line":"使君元是此中人","note":"“使君”是他自称知州的身份。他说自己本来就属于这片田野，拉近了与农人的距离，也替上片想回乡种地的念头找到了根由。"}],"moods":["闲适"],"caveat":"年谱记作春旱后谢雨，但这组词的其他几首写到枣花、缫丝，季节更像暮春到初夏之间，谢雨的具体月日已无法确定。"},"352049":{"background":"这是苏轼到徐州的第二年。前一年秋天黄河决口，洪水围住徐州城，他亲自上城督率防守。这年春天又遇到干旱，他曾到城东石潭求雨，下雨后又去谢雨，还写了一组《浣溪沙》。这首词也是为麦子丰收而高兴。题目说写于藏春阁园中，大约是初夏麦熟时在园里饮酒赏花时随手写下的。藏春阁是什么样的地方、当时和谁同游，现有材料都没有说明。","mood":"开头的“惭愧”意思是庆幸、难得，不是羞愧。先遭水灾，又遇旱灾，身为知州，苏轼最放心不下的是这一年的收成。麦子丰收，他才算真正松了一口气。后面的醉态和玩笑都由这份轻松而来：他把自己比作喝醉后倒骑马回家的山简，由着街上的孩子拍手取笑。一个地方官做事有了着落之后的自得和放松，都写在里面。这是他在外地做官期间少有的轻快时刻。","lines":[{"line":"惭愧今年二麦丰。","note":"“惭愧”是多谢、侥幸的意思。连着经历水灾和旱灾，麦子居然丰收了，这是一州长官最直接的庆幸。"},{"line":"千畦细浪舞晴空。","note":"晴天下，成片的麦田被风吹起层层细浪。他看的不只是风景，也是全州百姓一年的口粮，所以看得格外高兴。"},{"line":"归去山公应倒载，阑街拍手笑儿童。","note":"这里借用晋代山简醉后倒骑马、被儿童拍手取笑的典故，自嘲喝醉了。可见他心情宽松，也和当地百姓一样高兴。"}],"moods":["闲适","旷达"],"caveat":"题目在各个版本中不一样。“藏春阁”指哪里、这首词具体写于哪个月，都没有找到可靠记载。“细浪”有的版本作“翠浪”。末句“锦薰笼”的意思也有不同理解。"},"352053":{"background":"元丰元年前后，苏轼在徐州做知州。他早年因为和新法意见不合离开朝廷，到地方上任职。张继愿的生平史料很少，从词意推测，他是一名在北方边地带过兵的武官，后来回到徐州一带。阳关曲本来是送别时唱的曲子，苏轼大概是在宴席或送行的场合为他填了这首词，借曲调赠人。至于具体是为什么事，史料里没有记载，不好妄断。","mood":"整首词口气爽快，带着朋友间的打趣：你这样一位英武的将军，怎么没把契丹首领的头砍下来，就穿着金甲、打着牙旗回乡了？玩笑底下有一层惋惜。宋辽订立澶渊之盟以后，北方多年没有大仗，武人难有机会立功。苏轼在徐州留心边防和地方守备，对国家积弱看得清楚。他替对方抱憾，也透露出自己在外任上空有抱负、施展有限的感慨。","lines":[{"line":"受降城下紫髯郎","note":"受降城是北方边塞的象征，紫髯形容英武。苏轼先写张继愿在边地的经历，把他当作一位真正打过仗的将军来称赞。"},{"line":"戏马台南旧战场","note":"戏马台在徐州，相传是项羽检阅兵马的地方。边塞和古战场接在一起写，眼前的人物显得更有分量，也点明了如今相聚的地方。"},{"line":"恨君不取契丹首","note":"表面上是责怪朋友，其实是替他惋惜：在和议的局面下，武人没有建功的机会。语气半开玩笑，背后藏着对时局的不平。"}],"moods":["豪放","感时"],"caveat":"张继愿的生平难以考证。这首词与另外两首徐州阳关曲同属一组，有人把它系在熙宁十年，也有人系在元丰元年，具体年份和写作缘由都还没有定论。"},"352054":{"background":"元丰元年（1078），苏轼在徐州任知州。左藏库使梁交接到诏命，改任莫州知州。莫州在河北，紧靠宋辽边界，是军务吃紧的地方。苏轼为他写诗送行，也写了这首词。这是一首送同僚赴任的应酬之作，送行的席上大概有歌妓陪侍。梁交在徐州担任什么职务、两人交情多深，现存材料说得不清楚。","mood":"这首词基本没有离愁。苏轼先拿相术里“眉间黄气主喜事”的说法向梁交道贺，再设想他进京面圣、议论兵事、带着御香回来，笔调轻快，带着恭维。苏轼自己因为和朝政不合留在地方，平时又很关心西北边防，这时送一位武官去边地，鼓励和期许的意思比感伤多。至于其中是否也有自己不能参与边事的感慨，词里没有明说，不宜多加推测。","lines":[{"line":"惟见眉间一点黄。","note":"相术认为眉间现出黄气是升迁、喜事的征兆。开头就是道贺，把这次调任说成好事，定下了全词轻快的调子。"},{"line":"诏书催发羽书忙。","note":"朝廷催他上路，边地的军情文书也来得很急。这一句点出莫州是要紧的边防之地，也写出了这次调任的分量。"},{"line":"论兵齿颊带风霜。","note":"设想梁交在皇帝面前谈论边事，言辞果断有力。这是对一位武官最合适的称许，也透出苏轼本人对边防的关心。"}],"moods":["送别","豪放"],"caveat":"年谱把这首词系在元丰元年，与梁交改知莫州的时间相合；年谱提到的“继任者或为欧育”本身就不确定，而且所指不明，这里没有采用。"},"352286":{"background":"元丰元年（1078），苏轼四十三岁，在徐州做知州。他是因为和朝廷新法意见不合才请求外任的。年谱把这首词列在这一年，但没有记下写给谁、因为什么事、在什么场合写的，词里也没有能和徐州的具体人事对上的线索。看内容，这是一首写男女私情的词，可能是应歌、代言之类的作品，未必写的是苏轼自己的经历。读的时候宜当作一首拟写恋情的词来看。","mood":"词里写的是一段不能公开的感情：两人隔着深院重帘，相见要防人猜疑，欢爱短暂，留下的却是很长的凄凉。结尾又带点调侃，说正因为有阻隔，偷偷尝到的才格外香甜。这种半认真半戏谑的口吻，在宋代应歌词里很常见。至于它和苏轼当时在徐州的处境有什么关系，现有材料说明不了，不能硬把词中的情绪当成他本人的心境。","lines":[{"line":"今夜何人，吹笙北岭，待月西厢。","note":"“待月西厢”借用唐代《莺莺传》里约会的诗句。这里写恋人在夜里暗中等着相会，心里又期待又不安。"},{"line":"谁信道，些儿恩爱，无限凄凉。","note":"一点点恩爱换来的是很长的冷落和凄凉，得到的和付出的不对等。这是全词情绪最重的一句。"},{"line":"一般滋味，就中香美，除是偷尝。","note":"结尾转为调侃：同样的滋味，偷偷尝到的才最香甜。用玩笑的口气化解了前面的愁苦。"}],"moods":["艳情"],"caveat":"这首词写给谁、在什么场合写的，都没有记载。作者是不是苏轼、是不是写于徐州时期，学界也有不同看法，有的注本把它列为未编年或存疑之作。"},"352285":{"background":"这首词的写作对象和时间说法不一。按年谱，元丰元年（1078）苏轼在徐州做知州，又写了一首《蝶恋花》送郑仅（字彦能）。可通行的题目写的是“送潘大临”，而潘大临是苏轼后来贬居黄州时结交的当地青年。从词意看，对象是一位刚成亲不久、正要动身去京城的年轻人。苏轼在饯行的酒席上写下这首词，用调侃代替叮嘱，送他上路。","mood":"整首词轻松带笑，没有一般送别词的伤感。上片拿新郎打趣，劝他别忘了新婚的妻子；下片转而拿自己开玩笑，说自己当年在京城如何风流，口气夸张，明显是戏言。年过四十的人，在酒席上跟后辈说笑，回想起年轻时在京城的日子，有点自得，也有点感慨时光已远，但他并不把这份感慨说破。","lines":[{"line":"记取钗头新利市。莫将分付东邻子。","note":"叮嘱对方记住新婚妻子钗头上的喜气，别到了京城就把心思交给别家的漂亮姑娘。这是长辈带笑的提醒。"},{"line":"三十年前，我是风流帅。","note":"自称当年京城风月场里的头一号人物。“三十年前”和苏轼实际进京的年份对不上，应当是酒席上的夸口，自嘲多于实录。"},{"line":"花枝缺处馀名字。","note":"说你要是去打听旧事，花丛稀疏的地方还能找到我的名字。用玩笑收尾，玩笑里也有一点人已老去的意味。"}],"moods":["送别","自嘲"],"caveat":"年谱把这首词系于元丰元年徐州、送郑仅，题目却作“送潘大临”，而潘大临与苏轼相识于黄州时期，对象和编年都有疑问；词中的“三十年前”也和苏轼的生平对不上，当是夸张的说法。"},"352061":{"background":"元丰二年三月，苏轼由徐州改任湖州知州，四月南下经过扬州，第三次来到平山堂。这座堂是他的老师欧阳修任扬州知州时建的。前两次经过，一次是熙宁四年去杭州上任，一次是熙宁七年由杭州调往密州。熙宁四年赴杭途中，他在颍州见了欧阳修，那是师生最后一面，第二年欧阳修就去世了。这次重来，堂中墙上还留着老师的笔迹。他为怀念老师写下这首词。","mood":"全词以怀念亡师为主。苏轼这年四十四岁，离开京城在外做官已经八九年。“半生弹指”是在算自己的年岁，也在感叹老师已经不在。年谱记他四月十二日为欧阳修的家书写过跋，可见这些天他常想起老师。下片里，堂前的人照样唱着老师写的“杨柳春风”，可写词的人已经不在了。他由此想到，不必等到事过境迁才说一切皆空，人活着的时候本就像在梦里。这是从伤感中生出的看破，也是他宽慰自己的办法。","lines":[{"line":"三过平山堂下，半生弹指声中。","note":"三次经过同一个地方，中间隔了八年。仕途奔波，老师去世，半辈子好像弹一下手指就过去了。"},{"line":"十年不见老仙翁。","note":"颍州一别，至今将近九年，这里取整数说十年。称老师为“仙翁”，透着亲近，也暗指老师已经不在人世。"},{"line":"未转头时皆梦。","note":"化用白居易“万事转头空”，又往前推了一步：不必等到身后才觉得一切成空，活着的时候也如在梦中。这是借看破来安顿哀伤。"}],"moods":["伤逝","禅悟"],"caveat":"“十年”是约数，实际相隔约八年。墙上所留究竟是欧阳修哪件手迹，一般认为是他的《朝中措》，但缺少确证。末句另有版本作“未转头时是梦”。"},"352298":{"background":"元丰元年，苏轼在徐州任知州。关于这首词为什么写，现存材料几乎没有交代：题目只有“有感”二字，没有小序，也没有记下是为谁、因为什么事而写。从内容看，词写的是一个人夜里摸黑走进西厢去会情人，天快亮时离开。“西厢”很可能借用了唐代《莺莺传》里“待月西厢下”的故事。这首词写的是真事、梦境，还是借传奇故事写着玩，现在已经无法判断，不宜当作苏轼本人的经历来读。","mood":"词里先是紧张和期待，后来变成怅惘。上片写摸黑前行时处处小心，下片写深夜帐中的清凉安静，结尾说能带回去的只有残妆，欢会转眼就成了空。苏轼在徐州公务很忙，前一年秋天刚带人抗过洪水，这一年又修筑黄楼。这首词更像他公务之余用传奇笔法写的游戏之作。同一年他还写了《永遇乐》，记夜宿燕子楼梦见盼盼。可见这段时间他对旧日情事、梦境和人生空幻之感有所触动，但这两首词之间是否有关联，没有证据。","lines":[{"line":"笑怕蔷薇罥，行忧宝瑟僵","note":"写潜行时的提心吊胆：怕笑出声，怕衣裳被蔷薇刺钩住，又怕走路碰倒瑟发出声响。动作写得很细，人物的紧张也就看得出来。"},{"line":"只恐暗中迷路、认馀香","note":"黑暗中认不清路，只能循着她留下的香气找过去。这里有急切，也有一点不确定，好像随时会走错。"},{"line":"何物与侬归去、有残妆","note":"离开时带走的只有她留下的一点残妆。欢会的痕迹淡而短暂，结尾留下的是空落落的感觉。"}],"moods":["艳情"],"caveat":"本词无序，本事不详，写给谁也无从考证；系于元丰元年徐州是依照年谱，但这首词本身没有可以直接证明写作年份的内证，各家编年并不完全一致。"},"352062":{"background":"元丰二年四月，苏轼从徐州调任湖州知州，到任还不到一个月。友人刘撝（字行甫）从长兴经过湖州，要去余姚，苏轼先写了诗为他送行。五月十三日，苏轼又在城里的钱氏园设宴给他饯行，在席上写了这首《南歌子》送给他。词题只写“湖州作”，送给谁、在什么场合写的，是靠年谱考订出来的。","mood":"上片写饯别当晚：山雨刚过，溪风清凉，园亭靠着水边，月光下船已经停在门外。景色清爽安静，没有刻意渲染离愁。下片替友人设想一路的水程，最后落在回头找不到湖州城上，惜别之情藏在这一望里，写得很克制。这时苏轼刚到江南水乡，心情比较舒展。两个多月后他就在湖州被捕，但那是后来的事，词里看不出预感。","lines":[{"line":"门外月华如水、䌽舟横。","note":"宴席快散了，月光很亮，载友人远行的彩船已经横在门外。画面很平静，但离别已经近在眼前。"},{"line":"两山遥指海门青。","note":"想象友人的船越走越远，两岸青山一路指向东边的入海口，也就是他要去的方向。眼界一下子打开了。"},{"line":"回首水云何处、觅孤城。","note":"替远行的人回头看：水天茫茫，湖州城已经找不到了。“孤城”写城远城小，也带出送行人留在原地的冷清。"}],"moods":["送别"],"caveat":"送刘撝之说出自年谱考订，词题本身没有写明。刘撝的生平、为什么去余姚，现存资料很少，说不清楚。“霜花”“雪阵”是五月的景物，按注释一般理解为比喻（“雪阵”指浪花），具体指什么还有不同理解。"},"352067":{"background":"元丰二年（1079）四月，苏轼由徐州改知湖州，到七夕时上任约三个月。词题只写“七夕”，开头借牛郎织女隔河相望的传说，结尾“清光长送人归去”又像在送一位要回去的人，所以很可能写于七夕的宴饮或送客场合。不过现存材料没有记下送的是谁、为什么离开，不能坐实。还有一点值得知道：二十来天后，七月二十八日，朝廷派来的人在湖州逮捕了苏轼，“乌台诗案”由此开始。","mood":"上片写隔绝：牛郎织女隔着水相望，说不上话，望到天黑也找不到对方；梦醒时想起的，是春天水边分手的情景。下片转到眼前晚夏的水乡：鸟飞散了，残花纷纷落下，苹草也老了，好时光正在过去。结尾没有一直沉在离愁里，而是把明月当作有情的伙伴，让月光一路陪人回去，伤感但有节制。这和他初到湖州时比较安稳的生活相合，词里看不出他对即将到来的灾祸有什么预感。","lines":[{"line":"盈盈临水无由语。","note":"牛郎织女隔着一道清浅的水，彼此看得见，却没有办法说话。写的是天上的传说，也暗暗写出人间相聚难、话说不尽的遗憾。"},{"line":"梦回芳草生春浦。","note":"七夕已是初秋，梦里却回到春天长满青草的水边。“春浦”让人想起江淹《别赋》里南浦送别的写法，暗示心里记着的是一次离别。"},{"line":"清光长送人归去。","note":"离别没法挽回，只好把月光收拢起来，让它一路送对方回去。语气温和，把不舍化成了一份体贴的祝愿。"}],"moods":["送别","怀人"],"caveat":"这首词编在元丰二年七夕、作于湖州，是按年谱推定的，没有直接的文献记载；词中送别的对象和具体场合也不清楚，也有人只把它看作一般的七夕词。"},"352006":{"background":"这首词作于苏州城西的阊门。苏轼路过苏州，临走时有一位女子在城门外的离亭为他饯行、唱歌送别，他写下这首词回赠。一般认为她是当地在宴席上唱曲的歌妓，但姓名和身份都没有记载。真正让他动笔的，是一冷一热的对比：老朋友和朝中新得势的人都不再来信，只有她还专门来送。至于这是哪一年、他从哪里去往哪里，有两种说法，见文末说明。","mood":"苏轼因为和新法意见不合，只能在地方上调来调去，自己做不了主。上片写他自觉已经老了，回乡隐居的打算却一直定不下来，又感到人情冷淡，语气里有倦意，也有些辛酸。下片写离别的场面，结尾却换成一句带点玩笑的嘱咐，既安慰对方，也安慰自己。他的伤感没有一直往下沉，而是用一点温情把它托住了。","lines":[{"line":"故山归计何时决","note":"故山指家乡眉山。他一直想辞官回乡，却始终下不了决心，也由不得自己。这句问话其实是在问自己，透出对官场奔波的厌倦。"},{"line":"旧交新贵音书绝","note":"从前的朋友和新近得势的人都断了联系。他在政治上失意，别人便有意疏远，一句话写出了世态冷暖，也为下文的“惟有佳人”做了铺垫。"},{"line":"弹在罗衣，图得见时说","note":"他劝对方别用手帕擦泪，就让泪水落在衣服上，等下次见面拿出来作证。这话近乎玩笑，用来冲淡离别的难过，也透出一点再见的盼望。"}],"moods":["送别","思乡"],"caveat":"所给年谱把这首词系于元丰二年（1079），由徐州赴湖州任途中；但不少注本（包括所附赏析）系于熙宁七年（1074）九月，由杭州通判任满赴密州途中。两说并存，目前难以确定。词中“佳人”是歌妓也只是通常的理解，原文没有明说。"},"352056":{"background":"元丰二年（1079）三月，苏轼在徐州做了约两年知州，奉命改任湖州知州。这两年他和徐州的关系很深：到任当年秋天黄河决口，洪水围城，他亲自上城防守，水退后又修筑了黄楼。临行前，他与田叔通、寇昌朝、石夷庚等友人告别，写下这首词，同时还写了一首《减字木兰花》。词中的“佳人”具体是谁，史料没有记载。","mood":"开头“天涯流落”四个字，是他多年外任、频繁调动的总感受：从杭州到密州再到徐州，刚和一个地方处出感情就得离开。这首词的伤感，主要是舍不得徐州的人和事。暮春花落，他往南走，北归的大雁却往北飞，方向相反，更显得身不由己。他此时还不知道，到湖州才三个月就会因“乌台诗案”被捕下狱。","lines":[{"line":"天涯流落思无穷。","note":"一开头就把自己看作漂泊在外的人。做外官多年，调来调去，在徐州刚住熟又要走，这句是对自己整个处境的叹息。"},{"line":"为问东风馀几许，春纵在，与谁同。","note":"花已凋残，他问春天还剩多少；又说就算春光还在，离开了徐州的朋友，也没人一起看了。惋惜春天和舍不得朋友，在这里说成了一回事。"},{"line":"欲寄相思千点泪，流不到，楚江东。","note":"他想让眼泪顺着泗水、淮河的流水寄回去，转念又说流不到。水路虽然相通，人却回不了头，这是对这次离别无可奈何的承认。"}],"moods":["怀人","羁旅"],"caveat":"“佳人”指谁已无从考证；“楚江东”的具体所指，注家说法不一，有人认为指泗水，也有人理解为词人将要前往的东南方向。"},"352057":{"background":"元丰二年（1079）春，苏轼在徐州做了将近两年知州，接到调任湖州的命令。在徐州期间，他带领军民抗过洪水，修过黄楼，和当地官员、文士来往很多。临行前，朋友们设宴为他送行，席间有歌女劝酒。年谱记他这时与田叔通、寇昌朝、石夷庚等人话别，并写了《江城子》和这首词，两首都是告别徐州之作。","mood":"这首词写的是一面舍不得走，一面又劝自己放下。苏轼外放以来先后在杭州、密州、徐州任职，每处只待两三年就要调走，所以早就学着用佛道的道理宽慰自己。可真坐到饯别的酒席上，看见有人落泪，他还是放不下。结尾那句宽解带着几分无可奈何的自嘲。他当时并不知道，到湖州仅三个月就会因诗文获罪被捕。","lines":[{"line":"玉觞无味，中有佳人千点泪","note":"饯行的酒喝着没有滋味，因为席上的歌女在为离别落泪。他借别人的眼泪写自己的不舍，没有直说。"},{"line":"学道忘忧，一念还成不自由","note":"本想靠修道学会忘掉烦忧，可心里一起留恋的念头，人又被感情牵住了。这是对自己修养不够的坦白，有点自责，也有点无奈。"},{"line":"一语相开，匹似当初本不来","note":"最后用一句话开解自己：就当当初没来过徐州，自然也就谈不上失去。这样宽解，恰恰说明他很难割舍。"}],"moods":["送别","自嘲"],"caveat":"年谱只说他此时作词告别徐州，没有说明这首词具体写给谁。词是写给席间歌女还是写给友人，“东园”指哪里，“如今未见”一句该怎么理解，注家说法不一。"},"352152":{"background":"苏轼此时在徐州任知州，公务之余常和当地友人诗酒往来。田叔通是他这一时期反复次韵唱和的朋友，生平今天已经难以详考。有一次苏轼到田家做客，主人家里蓄养的舞女出来表演，他就沿用自己前一首《南乡子》的韵脚，当场写了这首词送给舞女。这是宴席上的应酬之作，用意是称赞舞者、答谢主人，没有什么深重的寄托。","mood":"词里是轻松的欣赏和善意的调笑。前半写舞女登车前迟迟不走、又补一遍唇妆，后半写她起舞时旋转轻盈，结尾借柳宗元的典故开了个玩笑。徐州任上，苏轼抗洪、祈雨都做出了实绩，和僚友往来也多，心境比较从容，这份闲适在词里看得出来。按年谱，这年春天他就调往湖州，几个月后遭遇乌台诗案，但词中看不出任何预兆，不宜强加联系。","lines":[{"line":"久立香车催欲上，还留。","note":"车已备好，旁人一再催她上车，她却站了许久还舍不得走。“还留”两字单独成句，写出那份迟疑，也带出主客尽欢、不忍散席的气氛。"},{"line":"面旋回风带雪流。","note":"写舞到急处，舞女转身像回旋的风卷着雪花飘过。苏轼用眼前所见的轻快意象称赞她的舞艺，是宴席上真心的欣赏。"},{"line":"种柳应须柳柳州。","note":"用柳宗元任柳州刺史时种柳的典故，拿舞女纤细如柳的腰身开玩笑，说栽培这样的“柳”得有合适的人。语气诙谐，是写给主人看的玩笑话。"}],"moods":["艳情","闲适"],"caveat":"年谱把此词系于元丰二年（1079）徐州，但苏轼当年三月已离开徐州赴湖州，所以应当作于这年早春或更早（也有人系于元丰元年）；“前韵”具体指哪一首，各家看法不一，题目和个别字句也有异文（如“笑却收”一作“笑欲收”）。"},"352234":{"background":"1079年春，苏轼结束徐州任期，改任湖州知州，南下途中经过南京宋城（今河南商丘），年谱记下他在这里写了这首词。至于为谁而写、因什么事、在什么场合，年谱没有交代，词里也找不到具体的人名和事件。从内容看，它写初夏的景物和一个醉后倦起的人，很可能是途中宴饮时应景之作，但这只是推测。","mood":"这首词心绪轻松，几乎看不出愁怨。等了十来天不见春意，一阵南风吹来就解了烦闷。接着写衣裳、琴声、瓜田、桃色，最后停在宿醉未醒、懒得卷帘的倦态上。苏轼刚从徐州的繁重政务中脱身，正在赴任途中，心情相对闲散。几个月后他就在湖州被捕，卷入乌台诗案，这时候显然还毫无预感。","lines":[{"line":"一夕薰风来解愠。","note":"借古歌“南风之薰兮，可以解吾民之愠兮”，说一夜南风吹散了多日的郁闷，基调由此转为舒展。"},{"line":"红绡衣薄麦秋寒，绿绮韵低梅雨润。","note":"麦熟、梅雨是初夏的时令。薄衣还觉微凉，琴声被湿气压低，写的是季节交替时人身上细微的感受。"},{"line":"日高慵卷水晶帘，犹带春醪红玉困。","note":"太阳升高了还懒得卷帘，脸上带着春酒的红晕和倦意，是一种不急不忙、略带慵懒的闲适。"}],"moods":["闲适"],"caveat":"本篇编年依据年谱，但词中写麦秋、梅雨，像是四五月的景物，和苏轼三月前后经过南京的时间未必完全吻合；写作对象和场合也没有可靠记载，不能确定。"},"352153":{"background":"这是一首酬答词。黄儒字道辅，建州人，进士出身，以精通茶事知名，苏轼曾为他的《品茶要录》写过跋。道辅先写了一首《南乡子》，苏轼依原韵相和。苏轼此时因与新法不合在外任职，正做徐州知州。从词意看，唱和的场合是州府的一次宴饮，席上有歌女歌舞助兴，宾主把新填的词写在红笺上交给她们演唱。道辅为什么来徐州、当时任什么官职，现有材料说不清楚。","mood":"全词轻松热闹，看不出牢骚。苏轼把道辅比作游历四方的司马相如，称自己为“使君”，半开玩笑地夸自己不拘俗礼、留得住客。徐州任上，他治理黄河水患有成效，与朋友往来频繁，心情相对舒展，酒席上互相唱和是那段日子的常事。不久他调任湖州，随即因乌台诗案下狱。回头看，这种无拘无束的酒边小词，正是那场风波之前的寻常生活。","lines":[{"line":"不是使君能矫世，谁留。","note":"“使君”是苏轼自称。意思是要不是我这个知州不守常规、肯放下官架子，谁能留住你这位客人。语气得意又带着玩笑。"},{"line":"花艳红笺笔欲流。","note":"席间在红笺上写词，文思畅快，像要从笔端流出来。写的是宴会上即兴填词的兴致，也在称赞道辅的才情。"},{"line":"唱遍山东一百州。","note":"预言这些新词将由歌女传唱到整个东方各州。这是夸张的说法，用来恭维友人的作品，也透出宾主尽欢的快意。"}],"moods":["艳情","闲适"],"caveat":"苏轼在元丰二年三月就离开徐州去了湖州，如果按年谱系于本年，这首词应作于年初；也有注本把它系于元丰元年，确切时间难以断定。"},"352161":{"background":"元丰二年乌台诗案之后，苏轼被贬为黄州团练副使。这首词是应朋友章质夫（章楶，建安人）家中一位擅长琵琶的歌伎之请而写。苏轼在序里先讲了一件旧事：欧阳修曾问他，写琴的诗哪一首最好，他举了韩愈的《听颖师弹琴》；欧阳修却说，这首诗写的更像琵琶。于是他把韩诗稍加改编，配成合乎声律的歌词送给对方。序中说自己“久不作”，可能和诗祸之后下笔谨慎有关，但这只是推测。","mood":"全词大半在写乐声：先是低声细语，再转为勇士冲锋，又像暮云飞絮、孤凤不鸣，最后是艰难攀登和骤然坠落，起伏很大。这些比喻本来出自韩愈，可是由一个刚经历下狱、贬谪的人重新写出“寸步千险”“一落百寻”，读者很难不联想到他自己仕途的起落。结尾不写泪水沾衣，只说“无泪与君倾”，比韩诗收敛得多，像是把情绪压在了心里。他借旧诗、讲旧事来应酬，不直接谈自己，或许也是这一时期的一种自处方式。不过这层寄托是读者的推想，词里没有明说。","lines":[{"line":"跻攀寸步千险，一落百寻轻。","note":"本意是写琴音先艰涩地往上走，再陡然落下；放在贬谪之后读，很像仕途中向上难、跌落易的切身体会。"},{"line":"烦子指间风雨，置我肠中冰炭，起坐不能平。","note":"弹奏者指下风雨交加，听的人心里冷热交替、坐立不安。音乐挑起的，是他本来就难以平静的心绪。"},{"line":"推手从归去，无泪与君倾。","note":"曲子终了，各自散去，他说已经没有眼泪可以向你倾洒了。这一句比原诗含蓄，带着一种哭过之后的疲惫和克制。"}],"moods":["悲慨","咏物"],"caveat":"编年有分歧：这里按黄州时期（约1080—1081年）系年，也有学者认为是元祐年间（约1087年）在汴京任翰林学士时所作；如果是后者，结合贬谪去读这首词的说法就不成立。"},"352070":{"background":"乌台诗案后，苏轼在元丰三年二月贬到黄州。这年五月底，苏辙把哥哥的家眷护送到黄州。一家人在他入狱、生死难料之后终于重新团聚，苏辙随即又去了筠州。词里“天孙梳洗楼”点明是七夕夜。这一夜，民间女子要向织女乞巧。苏轼借这个节令写身边一位“佳人”的心愿：不求巧，只求不分离。这位佳人是谁，词中没有说。","mood":"上片写初七的月亮只有半轮，还没圆就先担心它缺。这是经历过大变故的人才有的敏感：好事刚开头，先想到会失去。下片从月转到人。乞巧本是求变得更好，这位佳人却什么都不求，只愿不再分离。苏轼刚出狱，与家人分开又团聚，兄弟又各在一方。这个愿望很朴素，却正是他此时最看重的。","lines":[{"line":"孤光未满先忧缺。","note":"七夕是初七，月亮只有半轮。还没圆就怕它缺，写的是月，也是刚与家人团聚的人怕再次失去的心理。"},{"line":"不愿求新巧。","note":"七夕这晚女子照例向织女求手巧，她偏偏不求。不再贪求更多，只想守住眼前，这和苏轼劫后的心境相通。"},{"line":"愿人无别离。","note":"牛郎织女一年只见一次，最懂离别的苦。全词收在这一句，说得直白，也是乌台诗案后这一家人最真实的愿望。"}],"moods":["咏物","怀人"],"caveat":"把这首词定在元丰三年七夕、作于黄州，是根据节令和处境推断的，没有确证；年谱所记次韵何县令诗与这首词没有直接关系，词中“佳人”指谁也无法确定。"},"352071":{"background":"元丰三年二月，苏轼因乌台诗案贬到黄州，这年七月是他在黄州过的第一个七夕。这首词写的是牛郎织女相会。词里看不出赠给谁，也看不出是和别人唱和的作品，更像节日夜里有感而写。年谱这个月记的是苏轼和何县令诗的韵，和这首词没有直接关系。苏轼刚出狱半年，死里逃生，在这时候写天上神仙一年只见一次面，很容易把自己对人间日子的感受带进去。","mood":"词是从天上看的：牛郎织女虽然相聚匆匆，却能和天一样长久不老，所以犯不着羡慕人间。结尾一转，说人间过一天就像熬一年。这话放在刚出狱、名义上是团练副使、实际上被安置看管、不能过问公事的苏轼身上，很像他自己的心境：贬居没事可做，前途看不清，日子显得格外长。不过他没有明说，只借着神话轻轻带了一笔。","lines":[{"line":"晓来疏雨零","note":"天亮时下起零星小雨，七夕的雨常被说成离别的眼泪。一夜相会结束，喜事就此转成淡淡的伤感。"},{"line":"相逢虽草草。","note":"承认牛郎织女见面太短太仓促，接下来却说他们能和天同寿。先认缺憾，再说长久，以此宽解。"},{"line":"人间日似年。","note":"全词最重的一句。神仙的一年过得像一天，人间的一天却像一年。这可以读作贬居黄州时日子难熬的真实感受。"}],"moods":["悲慨","羁旅"],"caveat":"这首词编在元丰三年七夕，依据的是后人的编年，苏轼本人没有留下自注作证；'人间日似年'是否寄托贬谪之苦，只是一种合理的读法，不能算定论。"},"352021":{"background":"元丰三年，苏轼经过乌台诗案，贬到黄州任团练副使。他的朋友赵昶（字晦之）这时在岭南任藤州知州。苏轼曾写信给赵昶，担心南方边境的兵事。赵昶从藤州寄来丹砂，苏轼回赠一支蕲州竹笛；黄州紧挨蕲州，那里的竹子向来以做笛出名。苏轼听说赵家有一位会吹笛的侍女，就写了这首词，和笛子一起寄去，算是送给她的。","mood":"这首词主要写笛子和吹笛的人，语气轻快，是朋友之间来往应答的作品。但有两处流露出别的心思。一处说好竹子没人赏识，白白错过了许多秋天，读者很容易想到刚出狱、在黄州闲着没有公事可办的苏轼本人。另一处在结尾，他希望笛声把南方的瘴气吹散，这是在挂念远在边地的朋友。他自己处境艰难，却还在替别人担心。","lines":[{"line":"自中郎不见，桓伊去后，知孤负、秋多少。","note":"蔡邕、桓伊都是古代懂笛的人。他们不在了，好竹子没人认得，白白空过许多年。这里或许也有苏轼对自己处境的感慨。"},{"line":"闻道岭南太守，后堂深、绿珠娇小。","note":"“闻道”说明这位侍女苏轼没有见过，只是听说。他借善吹笛的绿珠来比她，语气是朋友间的玩笑和客气话。"},{"line":"为使君洗尽，蛮风瘴雨，作霜天晓。","note":"盼着笛声替赵昶扫掉岭南的湿热瘴气，换来秋天清爽的早晨。这和他信里担心南方兵事是同一份牵挂。"}],"moods":["咏物","怀人"],"caveat":"题下这段小序（闾丘公显、懿卿）其实属于苏轼另一首《水龙吟》（小舟横截春江），放在这里是错的；按年谱和注释所引，这首的题目应是《赠赵晦之吹笛侍儿》。具体写作年份，各家说法也不完全一致。"},"352068":{"background":"元丰三年初，苏轼因乌台诗案出狱，被贬为黄州团练副使。赴黄州途中，他在岐亭遇到旧识陈慥（字季常，自号龙丘子）。陈慥是苏轼早年在凤翔任职时的上司陈希亮的儿子，年轻时任侠好游，后来放弃功名，隐居在黄州以北。这首词就是写给他的。小序记下他当年带着戎装侍女骑马游山、被人当作奇人的旧事，词的下片写他如今筑室炼丹的隐居生活。","mood":"这首词写的是朋友，语气轻快，有欣赏，也有几分打趣：当年招摇过市的豪侠，如今成了守着丹炉的居士。苏轼刚从死里逃生，前途难料，在偏远的地方遇到一位自愿远离功名、活得自在的老友，自然有所触动。他看陈慥，也像在看另一种活法。此后两人来往频繁，陈慥成了他在黄州最亲近的朋友之一。","lines":[{"line":"溪山好处便为家。","note":"写陈慥当年随遇而安，走到哪里喜欢就住几天。刚被迫离开故地的苏轼，写这种不把哪里当家的洒脱，也有自我宽解的意思。"},{"line":"谁知巴峡路，却见洛城花。","note":"在入蜀的偏僻山路上，竟然遇见洛阳那样的风流人物。惊奇里带着赞叹，写出陈慥一行当年的出众和不同寻常。"},{"line":"十年不见紫云车。","note":"十年过去，当年那样张扬的车马已经看不到了，豪侠收了心去隐居。语气平静，也暗含对岁月变迁和人生转向的感慨。"}],"moods":["旷达","闲适"],"caveat":"年谱把此词系于苏轼初到黄州时，也有人认为作于元丰四五年间两人交往渐密之后，目前没有定论；小序中的“十年”也只是约数。"},"352114":{"background":"元丰二年因“乌台诗案”入御史台狱，关了一百多天，险些丧命。年底获释，贬为黄州团练副使，不得签书公事，实际上是被看管起来的闲人。元丰三年二月，他到了黄州，家眷还没跟来，身边只有长子苏迈，暂时借住在定慧院，随着僧人吃饭。这首词就写于寄居寺院的这段日子。它没有明确的赠送对象，看起来是一个夜深人静时独自出门走动的人写给自己的。","mood":"词里的情绪，是刚经历大难之后的孤独和戒备。“惊起却回头”，像一个刚出牢狱的人，有一点风吹草动就心惊。“有恨无人省”，是满腹委屈既没人懂，也不敢多说。他后来在给友人的信里提到，获罪以后亲友大多不再来信，可以和这句对照着读。不过孤鸿宁愿落在冷清的沙洲上，也不肯随便找一根树枝栖身，说明他再狼狈也不愿改变本心。这时候还谈不上他后来在黄州的旷达。","lines":[{"line":"谁见幽人独往来，缥缈孤鸿影","note":"深夜里独自走动的人没人看见，只有一只孤雁的影子若隐若现，人和雁其实是同一种处境。"},{"line":"惊起却回头，有恨无人省","note":"受惊飞起后仍忍不住回头，心里有怨恨却无人理解。这是诗案之后心有余悸、无处诉说的真实心理。"},{"line":"拣尽寒枝不肯栖，寂寞沙洲冷","note":"挑遍了树枝也不肯落脚，宁愿忍受沙洲的寂寞寒冷。这是失意中仍不肯降格迁就的自我坚持。"}],"moods":["悲慨","咏物"],"caveat":"多数学者把这首词系于元丰三年（1080）二月至五月寓居定慧院期间，也有元丰五年、六年等说法，但那时苏轼早已移居临皋亭，与题中“定慧院寓居”不太相合；宋人笔记中说它为一位倾慕苏轼的温姓女子而作，属于附会，不足为据；另外，“谁见”一句在不同版本中也作“惟见”“时见”。"},"352257":{"background":"元丰二年，苏轼因“乌台诗案”下狱，次年二月被贬到黄州，任团练副使，不得过问公事。年谱只记他这一年写过《南歌子》，没有说明是哪一首，也没有说写给谁。这首词题作“感旧”，写一个人愁闷了半年，唱曲时特意留下最后一拍，等“君”到来，像是借思念者的口吻怀念旧人。这个“君”是谁，因什么事而写，现有材料都说不清，不宜强行坐实。","mood":"开头是压了很久的愁怨，眉头半年没有舒展；中间写春雨化开残冰、暖风吹到冷灰，情绪开始回暖；结尾留下一拍等人来，是带着希望的等待。如果按黄州时期来读，从下狱到贬居前后约半年，“冷灰”重新变暖也容易让人想到他劫后余生、慢慢缓过来的心境。不过这只是一种读法，从字面看，这首词仍是在写怀念一个人。","lines":[{"line":"半年眉绿未曾开。","note":"眉头紧锁了整整半年，愁闷积了很久。有人把这半年和他从下狱到贬居的经历对应起来，但没有确证。"},{"line":"春雨消残冻，温风到冷灰。","note":"冰冻消融，冷灰回暖，写的是春天来了，也透出心里有所松动。“冷灰”会让人想到“死灰复燃”的说法。"},{"line":"留取曲终一拍、待君来。","note":"一支曲子不唱完，特意留下最后一拍等对方来。思念化成耐心的守候，语气温和，并不绝望。"}],"moods":["怀人"],"caveat":"苏轼写过多首《南歌子》，年谱所记的未必就是这一首；这首词的写作年份和所怀念的人学界说法不一，系于元丰三年黄州只是其中一说。"},"352273":{"background":"元丰二年乌台诗案结案后，苏轼以黄州团练副使的闲职安置在黄州，不得过问公事。据年谱，这首词是为送别老朋友李常（字公择）而写。诗案牵连了不少亲友，这时还愿意和这位获罪之人往来、相聚的，情分格外难得。从词意看，场合是夜里登高楼饮酒，目送友人离去。两人这次相会的具体经过，史料记载不详。","mood":"上片写夜色和远处闪烁的灯火，友人像踏着虹桥的仙人一样归去，画面清冷开阔，离愁写得很淡。下片转到交情，用东汉张劭、范式守约的旧事，说两人的情谊经得住时间。结尾劝友人别问世事，那些不过是剑柄小孔里吹出的一声轻响。刚从诗祸中脱身的苏轼，在这里既是真想看开，也有不愿再谈朝政的谨慎。","lines":[{"line":"却跨玉虹归去、看洞天星月。","note":"“玉虹”一般解作长桥或虹影。词人想象友人像仙人踏虹而去，回到星月清朗的洞天，把送别写得开阔，不显悲伤。"},{"line":"当时张范风流在，况一尊浮雪。","note":"借张劭、范式千里赴约的旧事比两人的友情，说古人的情义今天还在，何况眼前还有一杯泛着白沫的酒。"},{"line":"莫问世间何事、与剑头微吷。","note":"典出《庄子·则阳》，往剑柄小孔里吹，只有细细一声。劝友人别问世事，荣辱是非都不值一提，也是诗案后的自我宽解。"}],"moods":["送别","旷达"],"caveat":"这首词在各个版本里的题目和序不一致，系在元丰三年、作为送李常之作，依据的是本年谱，学界看法不完全一致；李常这一年是否亲自到过黄州，也有待考证。"},"352317":{"background":"元丰三年，苏轼因乌台诗案出狱后贬到黄州，任团练副使，不准签书公事。据年谱，朋友刘攽（字贡父）先创作了一组回文词寄给他，每句倒过来读，正好是下一句。苏轼照这种体式，按春夏秋冬写了四首闺怨，寄给好友李常（字公择）。这一首写春天。这组词是朋友之间以文字往来、互相应和的产物，并不是为某件具体的事、某个具体的人而作。","mood":"词面上写的是暮春时节，一个女子困倦、慵懒，眉头微皱，好像在想念某个人。这是闺怨词的老题材，回文体式又限制了用字，个人情感很难放进去。它和苏轼处境的关系主要在写作行为本身：刚经历文字狱，他在黄州不敢随便议论时事，就借这种讲究技巧、近乎游戏的文字和远方的朋友保持往来。至于女子的怨思是否寄托了他自己的心事，词里没有明证，不宜深究。","lines":[{"line":"春晚睡昏昏。","note":"暮春时节，人困得昏昏沉沉。倒过来读成为下一句“昏昏睡晚春”，字一样，意思几乎不变，靠语序的回环写出慵懒的倦意。"},{"line":"细花梨雪坠。","note":"细小的梨花像雪片一样往下落。梨花一凋谢，春天就快结束了，暗暗把时光流逝和女子的寂寞连在一起。"},{"line":"颦浅念谁人。","note":"眉头微微皱着，在想谁呢？用一个问句收住，不说出想念的是谁。倒读为“人谁念浅颦”，变成了：有谁会怜惜她的愁容。"}],"moods":["艳情"],"caveat":"这组回文词的具体写作年份，各家编年说法不一，本文按所给年谱定在元丰三年的黄州；有的版本题作《回文春闺怨》。"},"352318":{"background":"元丰二年乌台诗案后，苏轼被贬到黄州，任团练副使。据年谱，这组四季回文《菩萨蛮》缘起于朋友间的通信：刘攽（字贡父）先发明了这种两句一组、下句把上句倒过来读的写法，填了词寄给苏轼。苏轼到黄州后照这个体式写了春夏秋冬四首，寄给老友李常（字公择），这一首写夏天。它不是为某个具体的人或某件事而作，是朋友之间比试技巧、互相逗乐的游戏文字。","mood":"词写一位女子夏日午睡，醒来吃冰镇藕，又和情郎斗嘴。情绪轻快，题目里的“怨”也只是一点娇嗔。这和苏轼刚出狱、被贬的处境好像对不上，但值得留意：他刚因诗文获罪，给朋友写信时挑了一种只讲技巧、不碰时事的写法，既维持了交往，又不惹是非。词里看不出他真实的愁苦，不宜硬往身世上套。","lines":[{"line":"柳庭风静人眠昼","note":"庭院无风，柳枝不动，人在白天睡着了。写的是闷热夏日的慵懒，节奏放得很慢，像随手勾出的一个场景。"},{"line":"郎笑藕丝长","note":"情郎指着藕丝开玩笑。民歌里常用“丝”谐音“思”，他话里带着调情的意思。"},{"line":"长丝藕笑郎","note":"倒过来读，变成女子回嘴笑他：你的情意哪有藕丝长？“闺怨”到这里才点出来，语气是撒娇，并不哀怨。"}],"moods":["艳情","闲适"],"caveat":"年谱把这组词系于元丰三年的黄州，但这种游戏之作本身没有标明写作日期，确切作年还有不同说法；苏轼名下回文词各本收录的数目和编排也不完全一致。"},"352319":{"background":"元丰二年乌台诗案后，苏轼被贬为黄州团练副使，没有实际职权。据年谱，好友刘攽先自创回文《菩萨蛮》寄给他。苏轼到黄州后仿照这种体式，写了春夏秋冬四首闺怨，寄给另一位老友李常，这一首写的是秋天。这组词首先是朋友之间比拼文字技巧的往来之作。刚因诗文获罪的人，挑一种不碰时事的文字游戏来写，也在情理之中，不过这是推测，没有明确记载。","mood":"词里写的是一位女子在秋天的孤单和愁闷：对井梳妆，越看越冷清；看着井边的花，自己先害羞发愁；夜里只有影子陪着自己。这是传统的闺怨题材，并不是苏轼直接写自己。回文要求每句倒过来读也通顺，感情只能在这个框子里表达，重点在技巧。苏轼刚到黄州，闲居无事，读者看到“影孤”“夜永”这些字，联想到他自己的寂寞，也说得通，但不宜坐实。","lines":[{"line":"井桐双照新妆冷。","note":"井边两株梧桐，倒影映在水里，女子刚化好妆，却无人来看，只觉得冷清。梧桐点明是秋天。"},{"line":"影孤怜夜永。","note":"秋夜很长，身边只有自己的影子，只能自己可怜自己。这一句的孤寂最真切，倒读成“永夜怜孤影”，意思不变，愁绪更重。"},{"line":"楼上不宜秋，秋宜不上楼。","note":"秋天最不该上楼远望，一望就更愁，所以干脆不上楼。这是想躲开愁绪的自我开解，回文的巧思也落在这里。"}],"moods":["艳情","怀人"],"caveat":"这组词系于元丰三年黄州，依据的是年谱，具体月份无法确定；词中有没有寄托作者自己的身世，只能存疑。"},"352320":{"background":"元丰三年，苏轼因乌台诗案出狱，被贬到黄州任团练副使，没有实权。这首是《回文四时闺怨》四首中写冬天的一首。据年谱，先是友人刘攽（字贡父）自创了这种回文体，写好寄给苏轼；苏轼到黄州后仿照这种体式写了四首，寄给老友李常（字公择）。所以这首词首先是朋友之间互相唱和的文字游戏，借此保持书信往来，并不是在写某个具体的女子。","mood":"词借一位女子的口吻，写冬天衣衫单薄、等人不归的怨。闺怨是传统题材，不能直接当作苏轼的自述。不过，他刚因诗文获罪，到黄州后下笔格外谨慎。选这种不碰时事的游戏体与朋友往来，既能维系交情，又不容易被人抓住把柄。词中的等待和冷落，或许也带着一点他初到贬所时的心境，但这只能推测。","lines":[{"line":"欺雪任单衣","note":"大雪压人，她却只穿着单衣，任凭寒冷侵袭。写的是身体的冷，也是无人照看、懒得顾惜自己的冷落。"},{"line":"别时梅子结","note":"回想分别是在梅子结果的初夏，到现在已经入冬，用节令的变化点出等待了多久。"},{"line":"迟开恨不归","note":"梅花开得晚，她并不怪花，怨的是人还没回来。倒过来再读一遍，怨意更深了一层。"}],"moods":["怀人","艳情"],"caveat":"本篇系于元丰三年、寄给李常，依据的是年谱；这组回文词的确切写作时间，各家编年不尽一致。"},"352074":{"background":"元丰三年初，苏轼因乌台诗案被贬到黄州。第二年正月，当地一户姓郭的外来人家照例迎请紫姑神。这是民间正月里请神扶乩的习俗：簸箕当作身子，筷子当作嘴，在灰盘上划字写诗。苏轼去看热闹，“神”请他填一首《少年游》，他就写了这首词来逗她。他另有一篇《子姑神记》，专门记了这件事。","mood":"这首词表面上是戏笔。传说紫姑生前是侍妾，被正妻害死，苏轼就拿她孤单无伴、靠簸箕和筷子写诗来开玩笑。不过“烂文章”“无复似张良”这些话，也很容易让人联想到他自己：刚因为诗文获罪，文章写得再多也没用，更没有机会再替朝廷出主意。玩笑里带着自嘲，语气却轻松，看得出他刚到黄州，已经在试着和眼前的处境相处。","lines":[{"line":"且糠秕吹扬。","note":"簸箕本来是扬谷去糠的农具，苏轼借这层意思，笑神写的诗像随风扬起的糠皮一样轻飘。这是对扶乩把戏善意的调侃。"},{"line":"到处成双君独只，空无数、烂文章。","note":"笑紫姑形单影只，白白写了一大堆诗。“烂文章”出自刚因文字下狱的苏轼之口，听起来也像在说他自己。"},{"line":"一点香檀，谁能借箸，无复似张良。","note":"用张良“借箸”替刘邦出谋划策的典故，正好对上用筷子当嘴的乩具。言外之意，是如今已没有人能像张良那样为国筹划，也暗含自己报国无门。"}],"moods":["自嘲"],"caveat":"本词系年是根据《子姑神记》中“至之明年”一语推定为元丰四年正月；“一点香檀”等句的具体含义，各家注本理解不尽相同。"},"352089":{"background":"元丰三年起，苏轼以黄州团练副使的身份被安置在黄州，没有实际职权。元丰五年正月十七日夜里，他梦见自己乘小船渡江，回头看见栖霞楼上歌乐正热闹，船上的人说是闾丘公显在宴客。闾丘孝终字公显，早年做过黄州知州，栖霞楼就是他在任时所建；这时他已经退休，住在苏州，和苏轼是旧交。苏轼醒来觉得这个梦很奇怪，于是写了这首词，借梦怀念这位故人。","mood":"上片写梦。楼上的笑语和弦歌是别人的热闹，自己只是江上一个回头张望的过客；一觉醒来，只剩空江和月光，前后落差很大。下片转而想象对方：公显辞官归隐苏州，像范蠡带着西施泛舟五湖一样自在，自己却是被安置在这里、行动不由己的贬官。他把这个梦解释成故人惦记自己、特地来看他，用这份人情把眼前的冷清冲淡了。","lines":[{"line":"念故人老大，风流未减，空回首、烟波里。","note":"想到老朋友年纪大了，兴致却不减当年；自己在梦里也只能隔着江上烟水回头遥望，没法靠近。"},{"line":"推枕惘然不见，但空江、月明千里。","note":"推开枕头醒来，热闹全都不见了，只剩空荡的江面和千里月光。谪居的孤寂在这里流露得最直接。"},{"line":"料多情梦里，端来见我，也参差是。","note":"他猜想是重情的故人真的到梦里来看自己了，大概八九不离十。这是一种自我宽慰，口气里也带着一点温情的玩笑。"}],"moods":["怀人","羁旅"],"caveat":"所给编年作元丰四年（1081），但词序明确写的是元丰五年正月十七日，应以词序为准，也就是1082年初；苏轼与闾丘公显早年交往的具体细节，史料记载不多。"},"352075":{"background":"元丰三年初，苏轼因乌台诗案贬到黄州，挂着团练副使的空衔，不能过问公事。第二年端午，黄州知州徐君猷设宴过节，苏轼是座上客，写了这首词送给他。徐君猷是当地长官，本来有看管这位罪官的责任，却待他相当宽厚，常请他饮酒游赏。这首词是节日宴席上的应酬之作，也包含着对主人的感谢。","mood":"词写得很轻松：初夏景色、端午风俗、劝人喝醉，几乎看不出愁苦。这份轻松其来有自。一个刚坐过牢、身份敏感的贬官，能在长官的宴席上放心喝酒，本身就是难得的松弛。称赞徐君猷治下监狱空、官司少，既是席间的客气话，也是对这位肯照顾自己的长官的真心感激。至于他对自身处境的忧惧，词里没有写，在这种场合大概也不便写。","lines":[{"line":"兰条荐浴，菖花酿酒，天气尚清和","note":"写端午风俗：用兰草煮水洗浴，用菖蒲泡酒，天气还清爽。节日气氛平和安稳，看不出贬居生活的紧张。"},{"line":"十分酒、一分歌","note":"酒要喝足，歌唱少一点也无妨。说法随意，透出宾主之间不拘礼节的亲近，也有借醉暂时放下心事的意思。"},{"line":"狱草烟深，讼庭人悄，无吝宴游过","note":"监狱空得长满了草，公堂上没人打官司，称赞徐君猷治理得好，所以大家尽可以放心宴游。这话出自刚出狱一年多的苏轼之口，读来别有意味。"}],"moods":["闲适","怀人"],"caveat":"此词的编年有元丰四年、五年端午两种说法，这里按所给年谱定为元丰四年（1081年）。"},"352084":{"background":"元丰三年苏轼因乌台诗案贬到黄州。这首词其实是一次改写：琴曲《瑶池燕》原本配有一首旧词，苏轼在小序里说，旧词和曲调合不上，曲声又哀怨低咽，于是他照着曲中的情绪重新填成一首闺怨词，寄给住在麻城岐亭的老朋友陈季常，还叮嘱他这支曲子很奇妙，不要随便给别人看。苏轼在去黄州的路上与陈季常重逢，后来两人常有往来，还常以琴曲相赠。","mood":"词里写一个独守空房的女子。落花时节，春愁排解不开，没有人来过问，只能偷偷擦眼泪；她抱起琴弹新曲，也没能解开心里的郁结。闺怨只是借用的题材，苏轼本意是让词句贴合曲子哀怨的声调，所以不能直接当成他的自述。不过，一个刚到黄州、很少有人来往的贬官，偏偏挑了这样一支哀怨的曲子仔细填词，又只寄给一位知己，词里多少也有他自己的寂寞。","lines":[{"line":"无人问。","note":"女子满腹愁闷，却没有一个人来问一句。孤单之外，更难受的是被人冷落，这也接近贬居时门庭冷清的境况。"},{"line":"抱瑶琴、寻出新韵。","note":"她想靠弹琴排遣愁绪，特意找出新的曲调。这一句也像在说苏轼自己为旧曲重新填词的事。"},{"line":"南风未解幽愠。","note":"化用舜作《南风歌》中\"可以解吾民之愠\"一句，意思是连能解人愁怨的南风也化不开心里的郁结，琴声终究没能让人释怀。"}],"moods":["艳情","怀人"],"caveat":"这首词的具体写作年月难以确定，年谱系于元丰四年，用的也是\"或\"字，只能大致认定为黄州时期寄给陈季常的作品。"},"352090":{"background":"元丰三年二月，苏轼因乌台诗案贬到黄州，任团练副使，没有实际职权。到元丰四年秋天，他在黄州已经住了一年多。这首词没有题目和小序，也没有记载写给谁、因为什么事、在什么场合写的。从内容看，像是写给自己的独白：上片写江村的日常生活，下片借神仙的典故回看自己的来历。词中“又经岁”三个字，和他此时在黄州过了一年多的处境正好对得上。","mood":"上片写的是闲：小沟连着长江，渔夫樵夫赶早市，他自己整天闲坐，问自己“了成何事”。这种闲是被迫的，没有公事可做，才会觉得时间白白过去。下片说自己是从天上掉到人间的仙人，旧日同伴还在瑶池喝酒，自己只能抱着琴在月光下独坐。这是在暗示，他从京城的仕途跌下来，心里的话找不到人说。","lines":[{"line":"永昼端居，寸阴虚度，了成何事。","note":"贬官没有实际职事，白天显得特别长。他一边说自己荒废光阴，一边自问这辈子到底做成了什么，带着自嘲，也有些不甘。"},{"line":"但丝莼玉藕，珠粳锦鲤，相留恋、又经岁。","note":"用张翰因思念莼菜、鲈鱼而辞官回乡的典故，说自己被江乡的物产留住，又过了一年。话说得轻松，其实是不能离开的无奈。"},{"line":"抱素琴，独向银蟾影里，此怀难寄。","note":"仙人落到人间，只能独自抱琴对着月亮。和旧日同伴隔得很远，满心的话没有地方寄托，是全词最孤独的地方。"}],"moods":["自嘲","悲慨"],"caveat":"这首词没有题序，写给谁、在什么场合写的都不清楚。编在元丰四年黄州，是根据词中的江村景物和“又经岁”推断出来的，各家的编年不一定相同。"},"352104":{"background":"乌台诗案后，苏轼以黄州团练副使的名义被安置在黄州，挂着官名，却不能过问公事。黄州知州徐君猷（名大受）没有疏远这位贬官，常请他饮酒往来。这年重阳，徐君猷在城中的涵辉楼设宴。苏轼登楼饮酒，看见秋江水落、沙洲露出，就在席间写下这首词，送给主人。这首词本是节日宴席上的应酬之作，苏轼借着赏秋劝酒，也说出了自己贬居时的心事。","mood":"字面上，词是在劝人借酒过节、把万事看开，底下却有一层去不掉的落寞。他用孟嘉落帽的旧事拿自己打趣：风吹不落这顶破帽，人也摆脱不了眼下的处境。“万事到头都是梦”，是他在黄州反复想过以后用来宽慰自己的话。话说得洒脱，紧接着却是“休休”两个字，像是在叫自己别再往下想。结尾惋惜菊花过了节就不再好看，其中也有年近半百、功名落空的迟暮之感。","lines":[{"line":"破帽多情却恋头","note":"反用孟嘉落帽的典故，说破帽舍不得离开他的头。这是苦中作乐，也是自嘲：处境像这顶帽子一样甩不掉。"},{"line":"万事到头都是梦，休休","note":"贬居以后，他对荣辱得失有了新的体会，所以说万事如梦。“休休”既是劝自己放下，也透出心里并没有真正平静。"},{"line":"明日黄花蝶也愁","note":"过了重阳，菊花就要衰败，连蝴蝶都替它发愁。这句劝人趁今天尽兴，也暗含对年华流逝、时机已过的感慨。"}],"moods":["旷达","自嘲"],"caveat":"这首词的写作年份有元丰四年（1081）和元丰五年（1082）两种说法：所给年谱系于四年，参考赏析系于五年，目前不能断定是哪一年的重阳。"},"352076":{"background":"元丰四年（1081年）冬天，苏轼已经在黄州过了将近两年，住在江边的临皋亭。一般流传的词序说：十二月二日，雨后下起小雪，黄州知州徐君猷（徐大受）带着酒来看他，他在酒席上写了三首《浣溪沙》，第二天雪下大了，又写了两首。这一首通常排在第一。徐君猷待这位被贬的官员很宽厚，冒雪送酒上门，苏轼就写下眼前的天气和景色来答谢。","mood":"词里是轻快的，带着一点高兴。久旱的麦田盼到了雨雪，朋友又冒雪来访，所以他看什么都顺眼，连胡子上粘着冰粒也写得很有兴味。这时苏轼是戴罪之身，不能随意离开黄州，也不能签署公事，日子清苦。正因为这样，一场及时的雪、一位肯来喝酒的知州，在他心里分量就格外重。他关心麦子，也是把自己的日子和当地百姓连在了一起。","lines":[{"line":"覆块青青麦未苏。","note":"麦苗盖在土块上，因为缺水还没有返青。他先担心的是庄稼，这场雨雪来得正是时候。"},{"line":"江南云叶暗随车。","note":"云跟着徐知州的车一起来了，是夸客人给黄州带来了雨雪，说得很客气，也透着感激。"},{"line":"归来冰颗乱黏须。","note":"回到家里，冰粒乱糟糟地粘在胡子上。他把自己的狼狈写得很有趣，看得出心情不错。"}],"moods":["闲适","旷达"],"caveat":"所给年谱这个月只记了侄子安节来访，徐君猷携酒、作于酒席这些情节出自词序，年谱里没有提到。这五首的先后次序，以及“归来”是送走客人以后回家还是从外面回来，历来说法不一，目前还不能确定。"},"352078":{"background":"元丰四年冬，苏轼因乌台诗案贬居黄州已近两年。黄州太守徐君猷（名大受）待他很厚。这年十二月二日，雨后下起小雪，徐君猷带着酒来看他。苏轼在席上写了三首《浣溪沙》，第二天酒醒后雪下大了，又写了两首。这一首在这组词里，写的是雪天受到地方长官的照顾，用来答谢徐君猷，说出自己的感激。","mood":"整首词说的是感激，口气却轻松，还带着玩笑。苏轼把自己比作在雪中吃毡的苏武，拿同姓开玩笑，实际上是在说自己的处境：他是戴罪的贬官，身边亲友大多疏远了，太守却肯冒雪来访。他心里感动，但不肯说得太沉重，只用打趣和醉话带过。在困境里还能有说笑的余地，这是他在黄州常有的样子。","lines":[{"line":"雪里餐毡例姓苏。","note":"苏武被扣在匈奴时，在雪地里靠吃毡毛活命。苏轼借两人同姓开玩笑，说姓苏的照例要在雪里受苦，用自嘲来说自己贬居的冷落。"},{"line":"使君载酒为回车。","note":"使君是太守，指徐君猷。他特意掉转车头，带着酒来看一个贬官。苏轼看重的是这份不怕牵连的情意。"},{"line":"醉中还许揽桓须。","note":"借东晋人醉后去拉上司桓温胡须的旧事，说太守为人宽厚，自己喝醉后失了礼数也不会被怪罪。这是带着亲近的答谢。"}],"moods":["自嘲","旷达"],"caveat":"这首词属于十二月二日席上的三首还是次日补写的两首，各家归属不一。“荐士已闻飞鹗表”是说徐君猷曾上表推荐苏轼，还是泛泛称赞他爱惜人才，也没有定论。“揽桓须”的典故出处，这里只说大意，没有核实。"},"352079":{"background":"元丰四年冬，苏轼因“乌台诗案”贬到黄州已近两年，挂着团练副使的虚衔，不能签署公事，生计也很紧。这首词属于一组五首《浣溪沙》。按词前小序，十二月二日雨后下了小雪，黄州知州徐君猷带酒来访，苏轼当席写了三首；第二天酒醒，雪下大了，又写两首，这首是其中之一。前一天还有人陪着喝酒，这一天苏轼独自面对大雪和寒冷。","mood":"前三句写一夜大雪后的景象：山、路、江洲都被雪盖住，看得出他对眼前景色仍有兴致。后三句转到自己身上：腹中空空，衣服打着结，柴是湿的，米也金贵。这些都是贬居黄州时实实在在的窘迫，他却用夸张、调侃的口气说出来。最后一句问谁来陪他一边挨冻一边吟诗，透出前一天宾主散去后的冷清和孤单。全词以自嘲为主，苦中还留着一点诗兴。","lines":[{"line":"空腹有诗衣有结","note":"肚子是空的，诗倒是有；衣服破了只能打结凑合。他把穷困和诗情放在一起，说得有几分自得，也有几分苦涩。"},{"line":"湿薪如桂米如珠","note":"雪天柴火受潮，贵得像桂木，米贵得像珍珠。化用古人“薪贵于桂”的说法，写贬居时柴米紧缺的实情，口气是半开玩笑。"},{"line":"冻吟谁伴撚髭须","note":"冻得发抖，还捻着胡须推敲诗句，却没有人作伴。昨天有太守陪着喝酒，今天只剩自己，孤寂感由此透出来。"}],"moods":["自嘲","旷达"],"caveat":"写作日期和缘由依据的是这组《浣溪沙》的小序（十二月二日徐君猷携酒来访，次日雪大，又作二首），年谱所记侄子苏安节来黄州一事与这首词没有直接关系；首句“积苏”（苏指柴草）具体怎么解，注家说法不完全一致。"},"352080":{"background":"苏轼因乌台诗案贬到黄州，到元丰四年冬已近两年。十二月二日雨后飘起小雪，黄州知州徐君猷带着酒来看他，苏轼在席上写了三首《浣溪沙》。第二天酒醒，雪下大了，他又接着写了两首，这首是五首里的最后一首。五首的首句都押“苏”字，有朋友间斗韵游戏的意思。徐君猷对这位贬谪之人一直照顾。这时冬麦正需要雪水，苏轼酒醒后看见大雪，想到麦田，于是写下这首词。","mood":"上片的高兴是真的：大雪盖住麦田，明年也许有好收成，只要百姓吃得饱，他自己的愁就没有了。只是说这话的人是个不能过问政事的贬官，能做的只有盼望。下片回到前一天的酒席，歌女衣袖翠绿，嘴唇鲜红，满座热闹；他却在寒气里呵着手，拔下白胡须。他四十六岁，仕途中断，前路不明，老去的感觉压在欢喜下面，词里没有直说。","lines":[{"line":"但令人饱我愁无","note":"只要百姓吃得饱，我就没什么可愁的。这是贬官的心愿，他已经没有能力替百姓做什么，只能寄希望于这场雪。"},{"line":"尊前呵手镊霜须","note":"在酒杯前呵手取暖，拔掉白胡须。前面写的是年轻歌女的鲜艳，这里是他自己的衰老，热闹中的冷清全在这个小动作里。"},{"line":"万顷风涛不记苏","note":"多数人解作醉后只依稀听见风雪大作，记不清自己什么时候醒来，接着写第二天酒醒、开门见雪。"}],"moods":["感时","自嘲"],"caveat":"多数注本把这组词系于元丰四年十二月，也有赏析写作元丰五年冬。首句的“苏”，旧注解作苏州田产被风潮冲毁，但有学者指出他当时在苏州并无田产，现在多解作“苏醒”，至今没有定论。"},"352069":{"background":"元丰三年初，苏轼因乌台诗案贬为黄州团练副使，几乎是戴罪闲居。这年五月，他一家搬进长江边的临皋亭。年谱把这首词系于元丰四年春，写的是临皋亭一带的傍晚。苏轼在随笔里说过，亭下江水有一半是峨眉雪水，他吃饭洗浴都用这水。词没有题赠对象，史料也没说为谁而写，看来是他在江边饮酒，碰上一阵急雨又放晴，随手记下的即景之作。","mood":"上片从杯里的酒色想到江水，又想到故乡岷山、峨眉的雪水，思乡是真的。但他不诉回不去的苦，而是把江水当成从家乡流来的酒，借这一点联系安慰自己。下片急雨打乱眼前光景，又被东风吹开，落日重新照亮半边江天。刚经历诗案、前途未卜的人，对这种忽暗忽明格外敏感。结尾停在“一半开”，有释然，也留着几分不全的明亮。","lines":[{"line":"认得岷峨春雪浪，初来。","note":"江上春水涨起，他一眼认出这是故乡岷山、峨眉的雪水刚刚流到这里，像在异乡遇见故人，乡愁里带着亲切。"},{"line":"万顷蒲萄涨渌醅。","note":"借用李白把汉水比作新酿葡萄酒的说法，把满江绿水看成一江美酒，思乡的苦涩被他转成了可以举杯享用的东西。"},{"line":"落照江天一半开。","note":"雨过风起，夕阳从云缝里照出半边江天。天并没有全晴，只开了一半。也可以读作他此时的处境：阴霾没散尽，但已经看到光亮。"}],"moods":["思乡","旷达"],"caveat":"年谱系于元丰四年，但所附的沿途事迹其实是元丰三年初赴黄州途中的事；苏轼元丰三年五月才迁居临皋亭，所以此词只能作于元丰四年春或更晚，具体哪一年并无确切记载，主要依据词中临皋亭江景推定。"},"352106":{"background":"元丰三年（1080）初，苏轼因乌台诗案贬到黄州，只挂着团练副使的空衔，不能过问公事。当时的黄州知州徐大受（字君猷）不怕牵连，常请他喝酒、出游，两人往来很多。徐家有几位侍女歌姬，苏轼在宴席上应主人之请，为其中三人各写了一首《减字木兰花》。这一首写给名叫妩卿的那位，是即席题赠、供大家一笑的小词。","mood":"这首词写得轻快俏皮，通篇都在打趣一个年轻女子的娇态，看不到愁苦。但放回黄州的处境，这份轻松本身就有分量：他刚从狱中出来，身份尴尬，不少旧友不敢再和他通信，现在有一位地方长官把他当座上客，在酒席上随意说笑，这是难得的温暖。经历了因诗获罪，写这类不碰时事的游戏之作，也是一种安全的落笔。","lines":[{"line":"敛黛含颦喜又嗔","note":"写妩卿微皱眉头，似喜似怨，神情变化很快。苏轼看得细，语气是席间旁观者善意的调侃。"},{"line":"徐君乐饮","note":"点出主人徐君猷正喝得高兴。整首词是为主人的宴席助兴，这一句透露了宾主之间的融洽和随意。"},{"line":"笑谑从伊情意恁","note":"说任她说笑打趣，情意就是这样。宴席上不拘礼数，谪居中的苏轼能这样放松，靠的正是主人的宽厚。"}],"moods":["艳情","闲适"],"caveat":"年谱把这首词系于元丰四年，但徐君猷任黄州知州是元丰三年到六年，具体写于哪一年难以确定；“𣨼”是罕见字，一般读作“殢”，解作缠着主人、逗弄宾客，不同版本的文字可能有出入。"},"352107":{"background":"苏轼因“乌台诗案”贬到黄州，挂着团练副使的虚衔，不能签署公事，日子过得清苦。当时的黄州知州徐大受（字君猷）并不避嫌，常常请他喝酒、往来。这首词写于徐家的宴席上，题目说明苏轼为徐君猷的三位侍女各写了一首，这一首写给胜之。年谱还记载他另写过一首《西江月》赠胜之，可见她是徐君猷宠爱的家姬。这是主人请客时的应酬之作，也是对徐君猷照顾的回礼。","mood":"词里大半写胜之跳舞时的样子和舞后的娇态，口气轻松，像席间随口夸赞。真正带出苏轼自己的是最后两句：自称年纪已大、眼睛昏花，还能看得这么仔细。这是自嘲，也透出几分难得的松快。罪臣身份让他处处小心，在知州家的宴席上能放下戒备说几句玩笑话，这本身就说明徐君猷给了他一点安稳和人情暖意。","lines":[{"line":"曲穷力困。笑倚人旁香喘喷。","note":"一曲跳完力气用尽，笑着靠在旁人身上喘气。写的是舞后真实的样子，不是摆好的姿态，看得出席间气氛随意亲近。"},{"line":"老大逢欢。","note":"说自己上了年纪还能碰上这样的欢宴。贬谪之中，有人肯请他赴宴，在他看来已是难得的好事。"},{"line":"昏眼犹能仔细看。","note":"老眼昏花却看得很细，是拿自己开玩笑，好让宾主都笑一笑；也带着一点人老了、境况落魄的自知。"}],"moods":["艳情","自嘲"],"caveat":"这首词的写作年份，年谱定在元丰四年，但宋人只说是苏轼在黄州时赠给徐君猷侍女的作品，具体哪一年很难确定，各家说法不完全一致。"},"352108":{"background":"元丰三年，苏轼因乌台诗案被贬到黄州，任没有实权的团练副使。黄州知州徐君猷（名大受）待他很厚，常请他到家中饮宴。徐家有几位能歌的侍人，苏轼分别为她们各写了一首《减字木兰花》，这首写的是庆姬。这是一首酒席上的应酬小词，本意是称赞歌者，也借此答谢主人的款待。","mood":"词里没有写身世之感，只是轻快地夸庆姬的容貌、性情和歌声，最后停在她捧杯劝酒的一幕。这份轻松也有来由：苏轼刚出狱，在黄州处处小心，连给旧友写信都很克制，徐君猷的宴席是他少有的能放松的场合。夸主人家的侍人，也是领主人的情。词本身就是应酬之作，不必从中硬读出深意。","lines":[{"line":"容态温柔心性慧。","note":"不只夸她长得好，还说她温柔聪慧。这种称许像是对熟识的人说的，可见苏轼常到徐家做客，和这些侍人并不陌生。"},{"line":"重客多情。","note":"“重客”是看重客人，说庆姬待客殷勤。也可以理解为借她称道主人，感谢徐君猷对他这个贬官以礼相待。"},{"line":"满劝金卮玉手擎。","note":"全词收在庆姬双手捧满杯劝酒的一幕。席间亲切热闹，苏轼是受殷勤款待的客人，暂时放下了罪官的拘谨。"}],"moods":["闲适","艳情"],"caveat":"这组赠徐君猷侍人的词具体作于黄州哪一年，各家编年说法不一，年谱系于元丰四年只是其中一说；几位侍人的名字在不同记载里也有出入。"},"352110":{"background":"元丰三年苏轼因乌台诗案贬到黄州，任团练副使，不得签书公事。知州徐大受（字君猷）对这位罪官很宽厚，常请他饮酒游宴，两人交情很好。胜之是徐大受宠爱的侍妾，年纪还小。苏轼在徐家的酒席上写过好几首词送给他家的侍人。这首就是当着众人写给胜之的，用了大量口语和俗语，像是即兴说的笑话，写来让主人和满座客人一乐。","mood":"这首词没有什么深意，主要是轻松的玩笑：夸小姑娘出众，报出她的字和年纪，又借赌骰子的话头逗她。经过诗案死里逃生以后，苏轼在黄州小心说话，正经诗文写得很少。在徐大受的席上他却能放开，写这样俚俗随意的游戏之作。这说明当地长官给了他少有的安心与人情，他在困境中也还留着跟人说笑、凑趣的兴致。","lines":[{"line":"表德元来是胜之","note":"表德就是表字。这句像在席上对众人揭晓：这位出众的姑娘，字叫胜之。语气带点卖关子的俏皮。"},{"line":"海里猴儿奴子是","note":"大概是宋代口语里的戏称，形容小姑娘机灵好动、顽皮可爱。确切意思现在已经说不清，只能看出是亲昵的打趣。"},{"line":"六只骰儿六点儿","note":"六颗骰子都掷出六点，是赌博里最好的彩头。借酒席上的博戏夸她处处占先，劝她别犯傻，只管放手去赌。"}],"moods":["闲适","艳情"],"caveat":"徐大受在黄州的任期约为元丰三年到六年，这首词具体是哪一年写的难以确定，系于元丰四年只是一种说法；“海里猴儿”等俗语的含义历来没有定论。"},"352109":{"background"
