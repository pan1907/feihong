赋《如梦令》","l":["三十三年，漂流江海，万里烟浪云帆。","故人惊怪，憔悴老青衫。","我自疏狂异趣，君何事、奔走尘凡。","流年尽，穷途坐守，船尾冻相衔。","巉巉。","淮浦外，层楼翠壁。","古寺空岩步，携手林间，笑挽攕攕。","莫上孤峰尽处，萦望眼、云海相搀。","家何在，因君问我，归梦绕松杉。"],"lt":["三十三年，漂流江海，萬里煙浪雲帆。","故人驚怪，憔悴老青衫。","我自疏狂異趣，君何事、奔走塵凡。","流年盡，窮途坐守，船尾凍相銜。","巉巉。","淮浦外，層樓翠壁。","古寺空巖步，攜手林間，笑挽攕攕。","莫上孤峯盡處，縈望眼、雲海相攙。","家何在，因君問我，歸夢繞松杉。"],"nc":0},{"id":"352149","y":1084,"m":12,"pl":"盱眙","an":"临淮","sn":"泗州","sf":"淮南东路泗州","pv":"江苏","lat":33.017144,"lng":118.55143,"tu":"水龙吟","ti":"水龙吟 昔谢自然欲过海求师蓬莱，至海中，或谓自然，蓬莱隔弱水三十万里，不可到。天台有司马子微，身居赤城，名在绛阙，可往从之，自然乃还，受道于子微。白日仙去，子微著坐忘论七篇，枢一篇，年百馀，将终，谓弟子曰：吾居玉霄峰，东望蓬莱，尝有真灵降焉，今为东海青童君所召，乃蝉脱而去。其后李太白作大鹏赋云：尝见子微于江陵，谓余有仙风道骨，可与神游八极之表。元丰七年冬余过临淮，而湛然先生梁公在焉，童颜清彻，如二三十许人，然人亦有自少见之者。善吹铁笛，嘹然有穿云裂石之声，乃作水龙吟一首，记子微太白之事，倚其声而歌之","tit":"水龍吟 昔謝自然欲過海求師蓬萊，至海中，或謂自然，蓬萊隔弱水三十萬裏，不可到。天台有司馬子微，身居赤城，名在絳闕，可往從之，自然乃還，受道於子微。白日仙去，子微著坐忘論七篇，樞一篇，年百餘，將終，謂弟子曰：吾居玉霄峯，東望蓬萊，嘗有真靈降焉，今爲東海青童君所召，乃蟬脫而去。其後李太白作大鵬賦雲：嘗見子微於江陵，謂餘有仙風道骨，可與神遊八極之表。元豐七年冬餘過臨淮，而湛然先生梁公在焉，童顏清徹，如二三十許人，然人亦有自少見之者。善吹鐵笛，嘹然有穿雲裂石之聲，乃作水龍吟一首，記子微太白之事，倚其聲而歌之","ev":"在盱眙，赴汝州团练副使任途中。侄千之秋试不利，苏轼简慰之。时侄必强在泗州。","l":["古来云海茫茫，蓬山绛阙知何处。","人间自有，赤城居士，龙蟠凤翥。","清净无为，坐忘遗照，八篇奇语。","向玉霄东望，蓬莱晻霭，有云驾、骖风驭。","行尽九州四海，笑纷纷、落花飞絮。","临江一见，谪仙风采，无言心许。","八表神游，浩然相对，酒酣箕踞。","待垂天赋就，骑鲸路稳，约相将去。"],"lt":["古來雲海茫茫，蓬山絳闕知何處。","人間自有，赤城居士，龍蟠鳳翥。","清淨無爲，坐忘遺照，八篇奇語。","向玉霄東望，蓬萊晻靄，有云駕、驂風馭。","行盡九州四海，笑紛紛、落花飛絮。","臨江一見，謫仙風采，無言心許。","八表神遊，浩然相對，酒酣箕踞。","待垂天賦就，騎鯨路穩，約相將去。"],"nc":0},{"id":"352133","y":1084,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"减字木兰花","ti":"减字木兰花","tit":"減字木蘭花","ev":"在黄冈，将赴汝州团练副使任。苏轼赋《减字木兰花》别黄。（江南游女）","l":["江南游女。","问我何年归得去。","雨细风微。","两足如霜挽纻衣。","江亭夜语。","喜见京华新样舞。","莲步轻飞。","迁客今朝始是归。"],"lt":["江南遊女。","問我何年歸得去。","雨細風微。","兩足如霜挽紵衣。","江亭夜語。","喜見京華新樣舞。","蓮步輕飛。","遷客今朝始是歸。"],"nc":0},{"id":"352139","y":1084,"m":null,"pl":"南京","an":"江宁","sn":"江宁","sf":"江南东路江宁府（金陵）","pv":"江苏","lat":32.064735,"lng":118.802891,"tu":"渔家傲","ti":"渔家傲 金陵赏心亭送王胜之龙图。王守金陵，视事一日。移南郡","tit":"漁家傲 金陵賞心亭送王勝之龍圖。王守金陵，視事一日。移南郡","ev":"在江宁，赴汝州团练副使任途中。与王益柔（胜之）游蒋山，苏轼有诗。王安石有和。益柔移南都，送之赏心亭，赋《渔家傲》赠之，并题于白鹭亭之柱。","l":["千古龙蟠并虎踞。","从公一吊兴亡处。","渺渺斜风吹细雨。","芳草渡。","江南父老留公住。","公驾飞车凌彩雾。","红鸾骖乘青鸾驭。","却讶此洲名白鹭。","非吾侣，翩然欲下还飞去。"],"lt":["千古龍蟠並虎踞。","從公一吊興亡處。","渺渺斜風吹細雨。","芳草渡。","江南父老留公住。","公駕飛車凌彩霧。","紅鸞驂乘青鸞馭。","卻訝此洲名白鷺。","非吾侶，翩然欲下還飛去。"],"nc":0},{"id":"352143","y":1084,"m":null,"pl":"淮安","an":"淮阴","sn":"楚州","sf":"淮南东路楚州","pv":"江苏","lat":33.616272,"lng":119.022429,"tu":"虞美人","ti":"虞美人","tit":"虞美人","ev":"赴汝州团练副使任途中。淮上，苏轼赋《虞美人》别秦观。观有诗赠。（波声拍枕长淮晓）","l":["波声拍枕长淮晓。","隙月窥人小。","无情汴水自东流。","只载一船离恨、向西州。","竹溪花浦曾同醉。","酒味多于泪。","谁教风鉴在尘埃。","酝造一场烦恼、送人来。"],"lt":["波聲拍枕長淮曉。","隙月窺人小。","無情汴水自東流。","只載一船離恨、向西州。","竹溪花浦曾同醉。","酒味多於淚。","誰教風鑑在塵埃。","醞造一場煩惱、送人來。"],"nc":1},{"id":"352144","y":1084,"m":null,"pl":"盱眙","an":"临淮","sn":"泗州","sf":"淮南东路泗州","pv":"江苏","lat":33.017144,"lng":118.55143,"tu":"行香子","ti":"行香子 与泗守过南山晚归作","tit":"行香子 與泗守過南山晚歸作","ev":"赴汝州团练副使任途中。十二月二十日，苏轼自泗州守刘士彦席上回，作《十二时中偈》。在泗，尝与士彦过南山晚归，赋《行香子》《行香子·与泗守过南山晚归作》","l":["北望平川。","野水荒湾。","共寻春、飞步孱颜。","和风弄袖，香雾萦鬟。","正酒酣时，人语笑，白云间。","飞鸿落照，相将归去，澹娟娟、玉宇清闲。","何人无事，宴坐空山。","望长桥上，灯火乱，使君还。"],"lt":["北望平川。","野水荒灣。","共尋春、飛步孱顏。","和風弄袖，香霧縈鬟。","正酒酣時，人語笑，白雲間。","飛鴻落照，相將歸去，澹娟娟、玉宇清閒。","何人無事，宴坐空山。","望長橋上，燈火亂，使君還。"],"nc":0},{"id":"352157","y":1084,"m":null,"pl":"宜兴","an":null,"sn":"宜兴","sf":"常州宜兴（阳羡）","pv":"江苏","lat":31.346071,"lng":119.830069,"tu":"菩萨蛮","ti":"菩萨蛮","tit":"菩薩蠻","ev":"赴汝州团练副使任途中。苏轼买庄田于宜兴，赋《菩萨蛮》。田近张善卷西洞天。以蒋公裕经纪之。先是苏轼欲买田建康，了元（佛印）欲为苏轼买田京口，均未成。或谓买田为熙宁七年事，无据。（买田阳羡吾将老）","l":["买田阳羡吾将老。","从来只为溪山好。","来往一虚舟。","聊从物外游。","有书仍懒著。","且漫歌归去。","筋力不辞诗。","要须风雨时。"],"lt":["買田陽羨吾將老。","從來只爲溪山好。","來往一虛舟。","聊從物外遊。","有書仍懶著。","且漫歌歸去。","筋力不辭詩。","要須風雨時。"],"nc":0},{"id":"352217","y":1084,"m":null,"pl":"仪征","an":"扬子","sn":"真州","sf":"淮南东路真州","pv":"江苏","lat":32.278131,"lng":119.190904,"tu":"南歌子","ti":"南歌子","tit":"南歌子","ev":"在扬子，赴汝州团练副使任途中。苏轼赋《南歌子》","l":["见说东园好，能消北客愁。","虽非吾土且登楼。","行尽江南南岸、此淹留。","短日明枫缬，清霜暗菊毬。","流年回首付东流。","凭仗挽回潘鬓、莫教秋。"],"lt":["見說東園好，能消北客愁。","雖非吾土且登樓。","行盡江南南岸、此淹留。","短日明楓纈，清霜暗菊毬。","流年回首付東流。","憑仗挽回潘鬢、莫教秋。"],"nc":0},{"id":"352232","y":1084,"m":null,"pl":"南京","an":"江宁","sn":"江宁","sf":"江南东路江宁府（金陵）","pv":"江苏","lat":32.064735,"lng":118.802891,"tu":"水龙吟","ti":"水龙吟 雁","tit":"水龍吟 雁","ev":"在江宁，赴汝州团练副使任途中。苏轼赋《水龙吟》","l":["露寒烟冷蒹葭老，天外征鸿寥唳。","银河秋晚，长门灯悄，一声初至。","应念潇湘，岸遥人静，水多菰米。","乍望极平田，徘徊欲下，依前被、风惊起。","须信衡阳万里，有谁家、锦书遥寄。","万重云外，斜行横阵，才疏又缀。","仙掌月明，石头城下，影摇寒水。","念征衣未捣，佳人拂杵，有盈盈泪。"],"lt":["露寒煙冷蒹葭老，天外徵鴻寥唳。","銀河秋晚，長門燈悄，一聲初至。","應念瀟湘，岸遙人靜，水多菰米。","乍望極平田，徘徊欲下，依前被、風驚起。","須信衡陽萬里，有誰家、錦書遙寄。","萬重雲外，斜行橫陣，才疏又綴。","仙掌月明，石頭城下，影搖寒水。","念征衣未搗，佳人拂杵，有盈盈淚。"],"nc":0},{"id":"352248","y":1084,"m":null,"pl":"黄冈","an":null,"sn":"黄州","sf":"淮南西路黄州","pv":"湖北","lat":30.459422,"lng":114.878872,"tu":"菩萨蛮","ti":"菩萨蛮 有寄","tit":"菩薩蠻 有寄","ev":"在黄冈，任黄州团练副使。苏轼赋《菩萨蛮》","l":["城隅静女何人见。","先生日夜歌彤管。","谁识蔡姬贤。","江南顾彦先。","先生那久困。","汤沐须名郡。","惟有谢夫人。","从来是拟伦。"],"lt":["城隅靜女何人見。","先生日夜歌彤管。","誰識蔡姬賢。","江南顧彥先。","先生那久困。","湯沐須名郡。","惟有謝夫人。","從來是擬倫。"],"nc":0},{"id":"352268","y":1084,"m":null,"pl":"阳新","an":"永兴","sn":"兴国军","sf":"江南西路兴国军","pv":"湖北","lat":29.836628,"lng":115.221728,"tu":"阮郎归","ti":"阮郎归 初夏","tit":"阮郎歸 初夏","ev":"赴汝州团练副使任途中。至兴国军，苏轼晤知军杨绘（元素），绘留赵吉。与陈慥、道潜过李翔（仲览）家。赋诗、词。","l":["绿槐高柳咽新蝉。","薰风初入弦。","碧纱窗下水沈烟。","棋声惊昼眠。","微雨过，小荷翻。","榴花开欲然。","玉盆纤手弄清泉。","琼珠碎却圆。"],"lt":["綠槐高柳咽新蟬。","薰風初入弦。","碧紗窗下水沈煙。","棋聲驚晝眠。","微雨過，小荷翻。","榴花開欲然。","玉盆纖手弄清泉。","瓊珠碎卻圓。"],"nc":2},{"id":"352290","y":1084,"m":null,"pl":"南京","an":"江宁","sn":"江宁","sf":"江南东路江宁府（金陵）","pv":"江苏","lat":32.064735,"lng":118.802891,"tu":"临江仙","ti":"临江仙","tit":"臨江仙","ev":"在江宁，赴汝州团练副使任途中。苏轼赋《临江仙》","l":["昨夜渡江何处宿，望中疑是秦淮。","月明谁起笛中哀。","多情王谢女，相逐过江来。","云雨未成还又散，思量好事难谐。","凭陵急桨两相催。","想伊归去后，应似我情怀。"],"lt":["昨夜渡江何處宿，望中疑是秦淮。","月明誰起笛中哀。","多情王謝女，相逐過江來。","雲雨未成還又散，思量好事難諧。","憑陵急槳兩相催。","想伊歸去後，應似我情懷。"],"nc":0},{"id":"352151","y":1085,"m":1,"pl":"宿州","an":"符离","sn":"宿州","sf":"淮南东路宿州","pv":"安徽","lat":33.652034,"lng":116.970454,"tu":"南乡子","ti":"南乡子 宿州上元","tit":"南鄉子 宿州上元","ev":"或在符离，赴汝州团练副使任途中。正月十日，苏轼书《泗州除夜》等七诗，赠妻王闰之。","l":["千骑试春游。","小雨如酥落便收。","能使江东归老客，迟留。","白酒无声滑泻油。","飞火乱星毬。","浅黛横波翠欲流。","不似白云乡外冷，温柔。","此去淮南第一州。"],"lt":["千騎試春遊。","小雨如酥落便收。","能使江東歸老客，遲留。","白酒無聲滑瀉油。","飛火亂星毬。","淺黛橫波翠欲流。","不似白雲鄉外冷，溫柔。","此去淮南第一州。"],"nc":0},{"id":"352138","y":1085,"m":null,"pl":"商丘","an":"宋城","sn":"南京","sf":"南京应天府","pv":"河南","lat":34.420378,"lng":115.662798,"tu":"西江月","ti":"西江月 姑熟再见胜之。次前韵","tit":"西江月 姑熟再見勝之。次前韻","ev":"将赴常州居住。苏轼在南都，张方平以整理文集事相委；方平授《楞伽经》使印施江淮间，授所藏禅月罗汉十六轴使施之；方平谈及内庭文字；晤方平子恕，或赋《西江月》","l":["别梦已随流水，泪巾犹裛香泉。","相如依旧是臞仙。","人在瑶台阆苑。","花雾萦风缥缈，歌珠滴水清圆。","蛾眉新作十分妍。","走马归来便面。"],"lt":["別夢已隨流水，淚巾猶裛香泉。","相如依舊是臞仙。","人在瑤臺閬苑。","花霧縈風縹緲，歌珠滴水清圓。","蛾眉新作十分妍。","走馬歸來便面。"],"nc":0},{"id":"352150","y":1085,"m":null,"pl":"商丘","an":"宋城","sn":"南京","sf":"南京应天府","pv":"河南","lat":34.420378,"lng":115.662798,"tu":"满庭芳","ti":"满庭芳 余谪居黄州五年，将赴临汝，作满庭芳一篇别黄人。既至南郡，蒙恩放归阳羡，复作一篇","tit":"滿庭芳 餘謫居黃州五年，將赴臨汝，作滿庭芳一篇別黃人。既至南郡，蒙恩放歸陽羨，復作一篇","ev":"赴汝州团练副使任途中。正月十九日，苏轼答徐州开元寺僧法明简，报得请居常州，时已至南都。赋《满庭芳》。王巩、黄庭坚作诗庆得请。","l":["归去来兮，清溪无底，上有千仞嵯峨。","画楼东畔，天远夕阳多。","老去君恩未报，空回首、弹铗悲歌。","船头转，长风万里，归马驻平坡。","无何，何处是，银潢尽处，天女停梭。","问何事人间，久戏风波。","顾谓同来稚子，应烂汝、腰下长柯。","青衫破，群仙笑我，千缕挂烟蓑。"],"lt":["歸去來兮，清溪無底，上有千仞嵯峨。","畫樓東畔，天遠夕陽多。","老去君恩未報，空回首、彈鋏悲歌。","船頭轉，長風萬里，歸馬駐平坡。","無何，何處是，銀潢盡處，天女停梭。","問何事人間，久戲風波。","顧謂同來稚子，應爛汝、腰下長柯。","青衫破，羣仙笑我，千縷掛煙蓑。"],"nc":0},{"id":"352158","y":1085,"m":null,"pl":"常州","an":"晋陵","sn":"常州","sf":"两浙路常州（晋陵）","pv":"江苏","lat":31.816791,"lng":119.980142,"tu":"蝶恋花","ti":"蝶恋花 述怀","tit":"蝶戀花 述懷","ev":"将赴登州知州任。苏轼将赴登州，赋《蝶恋花》抒怀。","l":["云水萦回溪上路。","叠叠青山，环绕溪东注。","月白沙汀翘宿鹭。","更无一点尘来处。","溪叟相看私自语。","底事区区，苦要为官去。","尊酒不空田百亩。","归来分得闲中趣。"],"lt":["雲水縈迴溪上路。","疊疊青山，環繞溪東注。","月白沙汀翹宿鷺。","更無一點塵來處。","溪叟相看私自語。","底事區區，苦要爲官去。","尊酒不空田百畝。","歸來分得閒中趣。"],"nc":0},{"id":"352160","y":1085,"m":null,"pl":"涟水","an":null,"sn":"涟水军","sf":"淮南东路涟水军","pv":"江苏","lat":33.787173,"lng":119.267334,"tu":"蝶恋花","ti":"蝶恋花 过涟水军赠赵晦之","tit":"蝶戀花 過漣水軍贈趙晦之","ev":"赴登州知州任途中。苏轼过涟水军，赋《蝶恋花》赠赵昶（晦之）","l":["自古涟漪佳绝地。","绕郭荷花，欲把吴兴比。","倦客尘埃何处洗。","真君堂下寒泉水。","左海门前鱼酒市。","夜半潮来，月下孤舟起。","倾盖相逢拚一醉。","双凫飞去人千里。"],"lt":["自古漣漪佳絕地。","繞郭荷花，欲把吳興比。","倦客塵埃何處洗。","真君堂下寒泉水。","左海門前魚酒市。","夜半潮來，月下孤舟起。","傾蓋相逢拚一醉。","雙鳧飛去人千里。"],"nc":0},{"id":"352302","y":1085,"m":null,"pl":"淮安","an":"淮阴","sn":"楚州","sf":"淮南东路楚州","pv":"江苏","lat":33.616272,"lng":119.022429,"tu":"蝶恋花","ti":"蝶恋花","tit":"蝶戀花","ev":"赴登州知州任途中。苏轼赋《蝶恋花》","l":["昨夜秋风来万里。","月上屏帏，冷透人衣袂。","有客抱衾愁不寐。","那堪玉漏长如岁。","羁舍留连归计未。","梦断魂销，一枕相思泪。","衣带渐宽无别意。","新书报我添憔悴。"],"lt":["昨夜秋風來萬里。","月上屏幃，冷透人衣袂。","有客抱衾愁不寐。","那堪玉漏長如歲。","羈舍留連歸計未。","夢斷魂銷，一枕相思淚。","衣帶漸寬無別意。","新書報我添憔悴。"],"nc":0},{"id":"352121","y":1086,"m":null,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"定风波","ti":"定风波 王定国歌儿曰柔奴。姓宇文氏。眉目娟丽。善应对。家世住京师。定国南迁归。余问柔。广南风土应是不好。柔对曰。此心安处便是吾乡。因为缀词云","tit":"定風波 王定國歌兒曰柔奴。姓宇文氏。眉目娟麗。善應對。家世住京師。定國南遷歸。餘問柔。廣南風土應是不好。柔對曰。此心安處便是吾鄉。因爲綴詞雲","ev":"在开封，任起居舍人。王巩（定国）席上，苏轼赋《定风波》赠其侍儿寓娘。","l":["常羡人间琢玉郎。","天应乞与点酥娘。","自作清歌传皓齿。","风起。","雪飞炎海变清凉。","万里归来年愈少。","微笑。","笑时犹带岭梅香。","试问岭南应不好。","却道。","此心安处是吾乡。"],"lt":["常羨人間琢玉郎。","天應乞與點酥娘。","自作清歌傳皓齒。","風起。","雪飛炎海變清涼。","萬里歸來年愈少。","微笑。","笑時猶帶嶺梅香。","試問嶺南應不好。","卻道。","此心安處是吾鄉。"],"nc":1,"fm":1},{"id":"352164","y":1086,"m":null,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"如梦令","ti":"如梦令 有寄","tit":"如夢令 有寄","ev":"在开封，为翰林学士、知制诰。苏轼赋《如梦令》二首寄黄守杨寀，怀黄州。","l":["为向东坡传语。","人在玉堂深处。","别后有谁来，雪压小桥无路。","归去。","归去。","江上一犁春雨。"],"lt":["爲向東坡傳語。","人在玉堂深處。","別後有誰來，雪壓小橋無路。","歸去。","歸去。","江上一犁春雨。"],"nc":1},{"id":"352165","y":1086,"m":null,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"如梦令","ti":"如梦令 春思","tit":"如夢令 春思","ev":"在开封，为翰林学士、知制诰。苏轼赋《如梦令》二首寄黄守杨寀，怀黄州。","l":["手种堂前桃李。","无限绿阴青子。","帘外百舌儿，惊起五更春睡。","居士。","居士。","莫忘小桥流水。"],"lt":["手種堂前桃李。","無限綠陰青子。","簾外百舌兒，驚起五更春睡。","居士。","居士。","莫忘小橋流水。"],"nc":0},{"id":"352167","y":1087,"m":10,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"行香子","ti":"行香子 茶词","tit":"行香子 茶詞","ev":"在开封，为翰林学士、知制诰兼侍读。苏轼有答李之纯简。","l":["绮席才终。","欢意犹浓。","酒阑时、高兴无穷。","共夸君赐。","初拆臣封。","看分香饼。","黄金缕。","密云龙。","斗赢一水。","功敌千钟。","觉凉生、两腋清风。","暂留红袖。","少却纱笼。","放笙歌散。","庭馆静。","略从容。"],"lt":["綺席才終。","歡意猶濃。","酒闌時、高興無窮。","共誇君賜。","初拆臣封。","看分香餅。","黃金縷。","密雲龍。","鬥贏一水。","功敵千鍾。","覺涼生、兩腋清風。","暫留紅袖。","少卻紗籠。","放笙歌散。","庭館靜。","略從容。"],"nc":0},{"id":"352322","y":1087,"m":10,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"导引","ti":"导引 迎奉神宗皇帝御容赴西京会圣宫应天禅院","tit":"導引 迎奉神宗皇帝御容赴西京會聖宮應天禪院","ev":"在开封，为翰林学士、知制诰兼侍读。苏轼撰《十月朔本殿夫人往永裕陵酌献神宗皇帝表本》","l":["经文纬武，十有九年中。","遗烈震羌戎。","渭桥夹道千君长，犹是建元功。","西瞻温洛与神崧。","莲宇照琼宫。","人间俛仰成今古，流泽自无穷。"],"lt":["經文緯武，十有九年中。","遺烈震羌戎。","渭橋夾道千君長，猶是建元功。","西瞻溫洛與神崧。","蓮宇照瓊宮。","人間俛仰成今古，流澤自無窮。"],"nc":0},{"id":"352233","y":1088,"m":4,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"哨遍","ti":"哨遍 春词","tit":"哨遍 春詞","ev":"在开封，为翰林学士、知制诰兼侍读。苏轼书艾宣画。","l":["睡起画堂，银蒜押帘，珠幕云垂地。","初雨歇，洗出碧罗天，正溶溶养花天气。","一霎晴风回，芳草荣光浮动，卷皱银塘水。","方杏靥匀酥，花须吐绣，园林翠红排比。","见乳燕、捎蝶过繁枝。","忽一线、炉香惹游丝。","昼永人闲，独立斜阳，晚来情味。","便乘兴、携将佳丽。","深入芳菲里。","拨胡琴语，轻拢慢撚总伶俐。","看紧约罗裙，急趣檀板，霓裳入破惊鸿起。","正颦月临眉，醉霞横脸，歌声悠扬云际。","任满头红雨落花飞。","渐𫛛鹊、楼西玉蟾低。","尚徘徊、未尽欢意。","君看今古悠悠，浮幻人间世。","这些百岁，光阴几日，三万六千而已。","醉乡路稳不妨行，但人生、要适情耳。"],"lt":["睡起畫堂，銀蒜押簾，珠幕雲垂地。","初雨歇，洗出碧羅天，正溶溶養花天氣。","一霎晴風回，芳草榮光浮動，卷皺銀塘水。","方杏靨勻酥，花須吐繡，園林翠紅排比。","見乳燕、捎蝶過繁枝。","忽一線、爐香惹遊絲。","晝永人閒，獨立斜陽，晚來情味。","便乘興、攜將佳麗。","深入芳菲裏。","撥胡琴語，輕攏慢撚總伶俐。","看緊約羅裙，急趣檀板，霓裳入破驚鴻起。","正顰月臨眉，醉霞橫臉，歌聲悠揚雲際。","任滿頭紅雨落花飛。","漸鳷鵲、樓西玉蟾低。","尚徘徊、未盡歡意。","君看今古悠悠，浮幻人間世。","這些百歲，光陰幾日，三萬六千而已。","醉鄉路穩不妨行，但人生、要適情耳。"],"nc":0},{"id":"352166","y":1088,"m":9,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"西江月","ti":"西江月 送钱待制穆父","tit":"西江月 送錢待制穆父","ev":"在开封，为翰林学士、知制诰兼侍读。钱勰（穆父）离京师赴知越州任，苏轼有送行诗并有赠物。","l":["莫叹平原落落，且应去鲁迟迟。","与君各记少年时。","须信人生如寄。","白发千茎相送，深杯百罚休辞。","拍浮何用酒为池。","我已为君德醉。"],"lt":["莫嘆平原落落，且應去魯遲遲。","與君各記少年時。","須信人生如寄。","白髮千莖相送，深杯百罰休辭。","拍浮何用酒爲池。","我已爲君德醉。"],"nc":0},{"id":"351972","y":1088,"m":null,"pl":"开封","an":null,"sn":"汴京","sf":"东京开封府","pv":"河南","lat":34.802941,"lng":114.313904,"tu":"蝶恋花","ti":"蝶恋花 代人赠别","tit":"蝶戀花 代人贈別","ev":"在开封，为翰林学士、知制诰兼侍读。苏轼赋《蝶恋花·佳人》","l":["一颗樱桃樊素口。","不爱黄金，只爱人长久。","学画鸦儿犹未就。","眉尖已作伤春皱。","扑蝶西园随伴走。","花落花开，渐解相思瘦。","破镜重圆人在否。","章台折尽青青柳。"],"lt":["一顆櫻桃樊素口。","不愛黃金，只愛人長久。","學畫鴉兒猶未就。","眉尖已作傷春皺。","撲蝶西園隨伴走。","花落花開，漸解相思瘦。","破鏡重圓人在否。","章臺折盡青青柳。"],"nc":0},{"id":"352169","y":1089,"m":9, ":2,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"西江月","ti":"西江月 再用前韵戏曹子方。坐客云瑞香为紫丁香。遂以此曲辨证之","tit":"西江月 再用前韻戲曹子方。坐客雲瑞香爲紫丁香。遂以此曲辨證之","ev":"在钱塘，将回京赴吏部尚书任。苏轼简钱勰（穆父），嘱其过扬州时伸意米黻，求山砚一观。","l":["怪此花枝怨泣，托君诗句名通。","凭将草木记吴风。","继取相如云梦。","点笔袖沾醉墨，谤花面有惭红。","知君却是为情秾。","怕见此花撩动。"],"lt":["怪此花枝怨泣，託君詩句名通。","憑將草木記吳風。","繼取相如雲夢。","點筆袖沾醉墨，謗花面有慚紅。","知君卻是爲情穠。","怕見此花撩動。"],"nc":0},{"id":"352261","y":1091,"m":2,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"减字木兰花","ti":"减字木兰花 雪","tit":"減字木蘭花 雪","ev":"在钱塘，将回京赴吏部尚书任。苏轼有与范祖禹（纯夫）简，提及除吏部尚书事。","l":["云容皓白。","破晓玉英纷似织。","风力无端。","欲学杨花更耐寒。","相如未老。","梁苑犹能陪俊少。","莫惹闲愁。","且折江梅上小楼。"],"lt":["雲容皓白。","破曉玉英紛似織。","風力無端。","欲學楊花更耐寒。","相如未老。","梁苑猶能陪俊少。","莫惹閒愁。","且折江梅上小樓。"],"nc":0},{"id":"352189","y":1091,"m":3,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"虞美人","ti":"虞美人 送马中玉","tit":"虞美人 送馬中玉","ev":"在钱塘，将回京赴翰林学士承旨任。苏轼别杭，马瑊（忠玉、仲玉）、刘季孙（景文）等西湖饯行。瑊赋《木兰花令》及诗赠行，季孙亦赋诗赠行，轼皆有和。","l":["归心正似三春草。","试著莱衣小。","橘怀几日向翁开。","怀祖已嗔文度、不归来。","禅心已断人间爱。","只有平交在。","笑论瓜葛一枰同。","看取灵光新赋、有家风。"],"lt":["歸心正似三春草。","試著萊衣小。","橘懷幾日向翁開。","懷祖已嗔文度、不歸來。","禪心已斷人間愛。","只有平交在。","笑論瓜葛一枰同。","看取靈光新賦、有家風。"],"nc":0},{"id":"352190","y":1091,"m":3,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"临江仙","ti":"临江仙 送钱穆父","tit":"臨江仙 送錢穆父","ev":"在钱塘，将回京赴翰林学士承旨任。苏轼请楚明（明老）继法涌之后主持净慈寺，楚明从之。","l":["一别都门三改火，天涯踏尽红尘。","依然一笑作春温。","无波真古井，有节是秋筠。","惆怅孤帆连夜发，送行淡月微云。","尊前不用翠眉颦。","人生如逆旅，我亦是行人。"],"lt":["一別都門三改火，天涯踏盡紅塵。","依然一笑作春溫。","無波真古井，有節是秋筠。","惆悵孤帆連夜發，送行淡月微雲。","尊前不用翠眉顰。","人生如逆旅，我亦是行人。"],"nc":1,"fm":1},{"id":"352191","y":1091,"m":3,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"八声甘州","ti":"八声甘州 寄参寥子","tit":"八聲甘州 寄參寥子","ev":"在钱塘，将回京赴翰林学士承旨任。苏轼别杭，马瑊（忠玉、仲玉）、刘季孙（景文）等西湖饯行。瑊赋《木兰花令》及诗赠行，季孙亦赋诗赠行，轼皆有和。","l":["有情风、万里卷潮来，无情送潮归。","问钱塘江上，西兴浦口，几度斜晖。","不用思量今古，俯仰昔人非。","谁似东坡老，白首忘机。","记取西湖西畔，正春山好处，空翠烟霏。","算诗人相得，如我与君稀。","约他年、东还海道，愿谢公、雅志莫相违。","西州路，不应回首，为我沾衣。"],"lt":["有情風、萬里卷潮來，無情送潮歸。","問錢塘江上，西興浦口，幾度斜暉。","不用思量今古，俯仰昔人非。","誰似東坡老，白首忘機。","記取西湖西畔，正春山好處，空翠煙霏。","算詩人相得，如我與君稀。","約他年、東還海道，願謝公、雅志莫相違。","西州路，不應回首，爲我沾衣。"],"nc":1,"fm":1},{"id":"352193","y":1091,"m":3,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"西江月","ti":"西江月 杭州交代林子中席上作","tit":"西江月 杭州交代林子中席上作","ev":"回京赴翰林学士承旨知制诰任途中。苏轼至润州。晤交代林希（子中），赋《西江月》赠之；沈括迎见；别张弼（秉道），赋《临江仙》","l":["昨夜扁舟京口，今朝马首长安。","旧官何物对新官。","只有湖山公案。","此景百年几变，个中下语千难。","使君才气卷波澜。","与把新诗判断。"],"lt":["昨夜扁舟京口，今朝馬首長安。","舊官何物對新官。","只有湖山公案。","此景百年幾變，箇中下語千難。","使君才氣卷波瀾。","與把新詩判斷。"],"nc":0},{"id":"352195","y":1091,"m":4,"pl":"镇江","an":"丹徒","sn":"润州","sf":"两浙路润州（京口）","pv":"江苏","lat":32.195688,"lng":119.431494,"tu":"临江仙","ti":"临江仙 辛未离杭至润，别张弼秉道","tit":"臨江仙 辛未離杭至潤，別張弼秉道","ev":"回京赴翰林学士承旨知制诰任途中。苏轼至润州。晤交代林希（子中），赋《西江月》赠之；沈括迎见；别张弼（秉道），赋《临江仙》","l":["我劝髯张归去好，从来自己忘情。","尘心消尽道心平。","江南与塞北，何处不堪行。","俎豆庚桑真过矣，凭君说与南荣。","愿闻吴越报丰登。","君王如有问，结袜赖王生。"],"lt":["我勸髯張歸去好，從來自己忘情。","塵心消盡道心平。","江南與塞北，何處不堪行。","俎豆庚桑真過矣，憑君說與南榮。","願聞吳越報豐登。","君王如有問，結襪賴王生。"],"nc":0},{"id":"352168","y":1091,"m":9,"pl":"湖州","an":"乌程","sn":"湖州","sf":"两浙路湖州（吴兴）","pv":"浙江","lat":30.899015,"lng":120.094566,"tu":"定风波","ti":"定风波 余昔与张子野、刘孝叔、李公择、陈令举、杨元素会于吴兴。时子野作六客词，其卒章云：「见说贤人聚吴分。试问。也应旁有老人星。」凡十五年，再过吴兴，而五人者皆已亡矣。时张仲谋与曹子方、刘景文、苏伯固、张秉道为坐客，仲谋请作后六客词云","tit":"定風波 餘昔與張子野、劉孝叔、李公擇、陳令舉、楊元素會於吳興。時子野作六客詞，其卒章雲：「見說賢人聚吳分。試問。也應旁有老人星。」凡十五年，再過吳興，而五人者皆已亡矣。時張仲謀與曹子方、劉景文、蘇伯固、張秉道爲坐客，仲謀請作後六客詞雲","ev":"回京赴翰林学士承旨知制诰任途中。苏轼与曹辅（子方）、刘季孙（景文）、苏坚（伯固）、张弼（秉道）过吴兴，与州守张询（仲谋）会。应询之请，赋《定风波》，即《后六客词》","l":["月满苕溪照夜堂。","五星一老斗光芒。","十五年间真梦里。","何事。","长庚对月独凄凉。","绿鬓苍颜同一醉。","还是。","六人吟笑水云乡。","宾主谈锋谁得似。","看取。","曹刘今对两苏张。"],"lt":["月滿苕溪照夜堂。","五星一老斗光芒。","十五年間真夢裏。","何事。","長庚對月獨淒涼。","綠鬢蒼顏同一醉。","還是。","六人吟笑水雲鄉。","賓主談鋒誰得似。","看取。","曹劉今對兩蘇張。"],"nc":0},{"id":"352159","y":1091,"m":null,"pl":"扬州","an":"江都","sn":"扬州","sf":"淮南东路扬州","pv":"江苏","lat":32.39986,"lng":119.419107,"tu":"临江仙","ti":"临江仙 夜到扬州席上作","tit":"臨江仙 夜到揚州席上作","ev":"回京赴翰林学士承旨知制诰任途中。夜到扬州，苏轼席上赋《临江仙》▪扬人争望苏轼风采。▪回京赴翰林学士承旨知制诰任途中。苏轼在扬州，上《辞免翰林学士承旨第二状》，不许；或与王存论灾伤。—。","l":["尊酒何人怀李白，草堂遥指江东。","珠帘十里卷香风。","花开花谢，离恨几千重。","轻舸渡江连夜到，一时惊笑衰容。","语音犹自带吴侬。","夜阑对酒，依旧梦魂中。"],"lt":["尊酒何人懷李白，草堂遙指江東。","珠簾十里卷香風。","花開花謝，離恨幾千重。","輕舸渡江連夜到，一時驚笑衰容。","語音猶自帶吳儂。","夜闌對酒，依舊夢魂中。"],"nc":0},{"id":"352181","y":1091,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"渔家傲","ti":"渔家傲 送台守江郎中","tit":"漁家傲 送臺守江郎中","ev":"在钱塘，任杭州知州。正月丁卯（初七日），苏轼与钱勰、江公著（晦叔）、柳雍同访龙井元净（辩才），题名。公著知吉州，轼有送行诗词。","l":["送客归来灯火尽。","西楼淡月凉生晕。","明日潮来无定准。","潮来稳。","舟横渡口重城近。","江水似知孤客恨。","南风为解佳人愠。","莫学时流轻久困。","频寄问。","钱塘江上须忠信。"],"lt":["送客歸來燈火盡。","西樓淡月涼生暈。","明日潮來無定準。","潮來穩。","舟橫渡口重城近。","江水似知孤客恨。","南風爲解佳人慍。","莫學時流輕久困。","頻寄問。","錢塘江上須忠信。"],"nc":0},{"id":"352188","y":1091,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"木兰花令","ti":"木兰花令 次马中玉韵","tit":"木蘭花令 次馬中玉韻","ev":"在钱塘，将回京赴翰林学士承旨任。苏轼别杭，马瑊（忠玉、仲玉）、刘季孙（景文）等西湖饯行。瑊赋《木兰花令》及诗赠行，季孙亦赋诗赠行，轼皆有和。","l":["知君仙骨无寒暑。","千载相逢犹旦暮。","故将别语恼佳人，欲看梨花枝上雨。","落花已逐回风去。","花本无心莺自诉。","明朝归路下塘西，不见莺啼花落处。"],"lt":["知君仙骨無寒暑。","千載相逢猶旦暮。","故將別語惱佳人，欲看梨花枝上雨。","落花已逐迴風去。","花本無心鶯自訴。","明朝歸路下塘西，不見鶯啼花落處。"],"nc":0},{"id":"352192","y":1091,"m":null,"pl":"杭州","an":"钱塘","sn":"杭州","sf":"两浙路杭州（钱塘）","pv":"浙江","lat":30.280059,"lng":120.161693,"tu":"减字木兰花","ti":"减字木兰花 送别","tit":"減字木蘭花 送別","ev":"在钱塘，将回京赴翰林学士承旨任。苏轼赋《减字木兰花》别杭。","l":["天台旧路。","应恨刘郎来又去。","别酒频倾。","忍听阳关第四声。","刘郎未老。","怀恋仙乡重得到。","只恐因循。","不见而今劝酒人。"],"lt":["天台舊路。","應恨劉郎來又去。","別酒頻傾。","忍聽陽關第四聲。","劉郎未老。","懷戀仙鄉重得到。","只恐因循。","不見而今勸酒人。"],"nc":0},{"id":"352197","y":1091,"m":null,"pl":"阜阳","an":"汝阴","sn":"颍州","sf":"京西北路颍州（汝阴）","pv":"安徽","lat":32.895879,"lng":115.821389,"tu":"木兰花令","ti":"木兰花令 次欧公西湖韵","tit":"木蘭花令 次歐公西湖韻","ev":"在汝阴，任颍州知州。苏轼游西湖，赋《木兰花令》，次欧阳修韵怀修。陈师道亦赋。（霜馀已失长淮阔）第九册（词集）第649页此词校注[一]之考证。陈师道词为《木兰花·同东坡用六一韵》，见《后山集》卷二十四。）","l":["霜馀已失长淮阔。","空听潺潺清颍咽。","佳人犹唱醉翁词，四十三年如电抹。","草头秋露流珠滑。","三五盈盈还二八。","与余同是识翁人，惟有西湖波底月。"],"lt":["霜餘已失長淮闊。","空聽潺潺清潁咽。","佳人猶唱醉翁詞，四十三年如電抹。","草頭秋露流珠滑。","三五盈盈還二八。","與餘同是識翁人，惟有西湖波底月。"],"nc":1},{"id":"352200","y" "滕宗谅（子京）降知虢州。先是赵元昊反，宗谅知泾州，御之有功，言者上不实之论，置狱，范仲淹救之，乃有虢州命。苏轼闻宗谅建功，深仰其人，及闻其以功而降，深为之不平。"},{"p":"眉州","t":"苏轼曾梦自身是僧。"},{"p":"眉州","t":"苏轼尝读钱易诗。"}],"1045":[{"p":"眉州","t":"在眉山。苏洵命轼作《夏侯太初论》卷一，仅存数句。）"},{"p":"眉州","t":"母程氏亲授苏轼、苏辙兄弟以书，以气节勉二子；不发宿藏，不残鸟雀，以身教。"},{"p":"眉州","t":"苏轼续从张易简读书。"},{"p":"眉州","t":"苏轼与程建用、杨尧咨、弟辙会学舍中，作《天雨联句》"}],"1047":[{"p":"眉州","t":"苏洵自京归蜀后，以颜太初诗文示轼。"},{"p":"眉州","t":"苏轼得异石。父洵谓为天砚，并刻其受砚处。"}],"1048":[{"p":"眉州","t":"父苏洵居丧及居丧后近十年，不出蜀；轼、辙兄弟亲受教于父。"},{"p":"眉州","t":"父苏洵亦尝命轼、辙兄弟学于刘巨（微之）；从巨学者，尚有家定国（退翁）、家安国（复礼）、家勤国（汉公）兄弟。"},{"p":"眉州","t":"苏轼兄弟亦尝师事乡人史清卿。"},{"p":"眉州","t":"苏轼尝与父洵、弟辙同读富弼（郑公）《使北语录》，因论之。"},{"p":"眉州","t":"苏轼、苏辙读书南轩。父洵名南轩为“来风”。"}],"1049":[{"p":"眉州","t":"苏轼尝梦谒于某公府，觉以告父洵、弟辙。"},{"p":"眉州","t":"在眉山。苏轼约于本岁前后作《却鼠刀铭》"}],"1050":[{"p":"眉州","t":"苏轼尝往来于田间。家中薄有田产。"},{"p":"眉州","t":"苏轼奋厉有当世志。"},{"p":"眉州","t":"苏轼好书画笔砚。尝手抄经史。"},{"p":"眉州","t":"苏轼少知种松，接花木，读医药书。"},{"p":"眉州","t":"苏轼尝习琴。"}],"1052":[{"p":"眉州","t":"五月，苏洵幼女遭夫家（舅程濬、姑宋氏、夫之才）之虐死去。于是苏、程结怨。然女之舅程濬之另二子之元（德孺）、之邵（懿叔），自元祐起，与苏轼兄弟交往颇密。四十二年后，轼与之才亦释怨。","m":5},{"p":"眉州","t":"苏轼始与刘仲达往来于眉山。"}],"1053":[{"p":"眉州","t":"苏轼至是岁，日益壮大，好读史、论史，亦好道。"}],"1054":[{"p":"眉州","t":"十二月甲寅（二十五日），益州布衣张詧为本州助教，詧辞不拜。詧深于扬雄《太玄经》。苏轼尝跋詧之诗。"},{"p":"眉州","t":"苏洵尝诵欧阳修谢表文，命轼拟作。"},{"p":"眉州","t":"苏轼娶王弗为妻。先是轼少时本欲居山林学道，不愿婚宦，然为以苏洵为代表之家族势力所强，不得不改变初衷，而家族亦略予轼择偶以宽容。至是与王弗成婚。"},{"p":"眉州","t":"苏轼与史经臣（彦辅）论历史人物，当为此岁前后事。尝爱经臣所作《思子台赋》"}],"1055":[{"p":"眉州","t":"是岁前后，成都人费孝先来眉山，言青城山老人授以轨甲卦影之术。苏轼当见费孝先。"},{"p":"眉州","t":"是岁，在眉山。苏轼作《正统论》。时已学通经史。"},{"p":"眉州","t":"父苏洵命辙以轼为师。"},{"p":"成都","t":"苏洵尝携苏轼、苏辙至益州（成都），游大圣慈寺中和胜相院，见僧惟度、惟简（宝月）"},{"p":"成都","t":"在成都，苏轼作有《书义·乃言底可绩》"},{"p":"成都","t":"在成都，苏轼作有《书义·堲谗说殄行》"},{"p":"成都","t":"在成都，苏轼作有《书义·视远惟明听德惟聪》"},{"p":"成都","t":"在成都，苏轼作有《书义·终始惟一时乃日新》"},{"p":"成都","t":"在成都，苏轼作有《书义·王省惟岁》"},{"p":"成都","t":"在成都，苏轼作有《书义·作周恭先作周孚先》"},{"p":"成都","t":"在成都，苏轼作有《书义·惟圣罔念作狂惟狂克念作圣》"},{"p":"成都","t":"在成都，苏轼作有《书义·庶言同则绎》"},{"p":"成都","t":"在成都，苏轼作有《书义·唐虞稽古建官惟百夏商官倍亦克用乂》"},{"p":"成都","t":"在成都，苏轼作有《书义·道有升降政由俗革》"},{"p":"成都","t":"在成都，苏轼作有《论语义·观过斯知仁矣》"},{"p":"成都","t":"在成都，苏轼作有《论语义·君使臣以礼》"},{"p":"成都" 《与友人一首》"},{"p":"成都","t":"苏轼往成都，与宗兄惟简（宝月）过往颇多。离成都时，惟简远出相送。"},{"p":"成都","t":"苏轼与王素之子巩（定国）相识，当为是时事。"},{"p":"青神唤鱼池","t":"苏轼尝游猪母泉，与妻兄王愿观鱼。"},{"p":"嘉州","t":"在嘉州，过郭纶，苏轼作诗。辙亦作诗。"},{"p":"嘉州","t":"传苏洵、苏轼、苏辙父子尝于嘉州访逸民程公望。"},{"p":"戎州","t":"苏洵、苏轼、苏辙父子过宜宾，夜泊牛口。轼有诗。"},{"p":"戎州","t":"苏洵、苏轼、苏辙父子至戎州。轼有诗。"},{"p":"戎州","t":"约在戎州。苏洵舟中弹琴，轼有诗。"},{"p":"江安","t":"在泸州。苏洵父子洎南井口，洵老友任孜（遵圣）来，轼有诗。或亦别任伋（师中）"},{"p":"江安","t":"苏轼在淯井监，得蛮布弓衣所织梅尧臣《春雪》诗，至京师后，赠欧阳修。"},{"p":"峡州","t":"或赴江陵途中，苏轼有《上王刑部书》"},{"p":"江陵","t":"是岁，苏轼长子苏迈生。"}],"1060":[{"p":"江陵","t":"正月五日，苏洵、苏轼、苏辙父子发江陵，陆行赴京师。","m":1},{"p":"荆门","t":"正月，发荆门军出陆北行时，苏轼有《浣溪沙》词。（山色横侵蘸晕霞）","m":1},{"p":"汴京","t":"二月十五日，苏洵、苏轼、苏辙父子到京师，赁居西冈一宅子。","m":2},{"p":"汴京","t":"在开封。苏轼有《与杨济甫十首》","m":3},{"p":"汴京","t":"四月乙亥（十七日），江休复（邻几）卒于京师。苏轼尝见休复。","m":4},{"p":"汴京","t":"四月二十五日，梅尧臣（圣俞）卒。苏轼尝爱尧臣《和宋次道紫宸早朝》诗。","m":4},{"p":"汴京","t":"在开封。苏洵父子吊朱亥墓。轼有诗。"},{"p":"汴京","t":"在开封。苏洵父子吊朱亥墓。轼有文。"},{"p":"汴京","t":"自江陵至京师，苏洵、苏轼、苏辙父子三人途中所为诗文又七十三篇，为《南行后集》，现存五十二篇（首）。所存诗文中，苏洵诗六首、苏轼诗文三十八篇（首）、苏辙诗八首。）"},{"p":"汴京","t":"苏轼、苏辙居怀远驿。"},{"p":"汴京","t":"刘巨（微之）寄赠苏轼、苏辙诗。"},{"p":"汴京","t":"苏轼授河南府福昌县主薄，不赴。"},{"p":"汴京","t":"苏轼见伯父涣，涣为言为政之方。"},{"p":"汴京","t":"苏轼访马正卿（梦得）"},{"p":"汴京","t":"欧阳修举苏轼应才识兼茂明于体用科。"},{"p":"汴京","t":"杨畋以苏轼之文五十篇奏之，以荐应制科。"},{"p":"汴京","t":"在开封。苏轼有《进论》二十五篇。"},{"p":"汴京","t":"在开封。苏轼有《策总叙》"}],"1061":[{"p":"汴京","t":"三月癸巳（初十日），王俊民为进士及第第一人。苏轼尝记其轶事。","m":3},{"p":"汴京","t":"五月丁酉（初九日），宋祁卒。苏轼尝评其集。","m":5},{"p":"汴京","t":"八月十七日，命翰林学士吴奎、龙图阁直学士杨畋、权御史中丞王畴、知制诰王安石就秘阁考试制科。奎等上王介、苏轼、苏辙论各六首，合格。其科号贤良方正能直言极谏。","m":8},{"p":"汴京","t":"在开封。八月十七日，命翰林学士吴奎、龙图阁直学士杨畋、权御史中丞王畴、知制诰王安石就秘阁考试制科。苏轼有论六篇。","m":8},{"p":"汴京","t":"在开封。八月乙亥（二十五日）仁宗御崇政殿，试苏轼等。考官为胡宿、沈遘、范镇、司马光、蔡襄。轼进《策》，答《策问》；进《中庸论》等二十五篇。","m":8},{"p":"郑州","t":"赴凤翔签判任途中。十一月十九日，苏轼与弟辙别于郑州之西门。有诗。","m":11},{"p":"长安","t":"赴凤翔签判任途中。苏轼至长安，晤刘敞（原父），敞留剧饮，为述陈元龙答陈季弼语。游石林亭，观敞所蓄唐苑中石，作诗。"},{"p":"渑池","t":"赴凤翔签判任途中。苏轼过渑池，和弟辙渑池怀旧诗。"},{"p":"汴京","t":"苏轼、苏辙继续寓居怀远驿。"},{"p":"汴京","t":"在开封。杨畋进龙图阁直学士、知谏院，苏轼有贺启。"},{"p":"汴京","t":"在开封。净因院大觉怀琏禅师馈苏洵以唐阎立本所画《水官图》。轼有诗。"},{"p":"汴京","t":"苏洵之兄苏涣赴利州路提点刑狱任。轼送行。"},{"p":"汴京","t":"苏轼入制科试三等，王介为四等。轼除大理评事、签书凤翔府判官；知制诰王安石作制。"},{"p":"汴京","t":"在开封。苏轼上《谢制科启》"},{"p":"汴京","t":"苏轼赴凤翔前，经营南园。"},{"p":"汴京","t":"苏轼别陆诜。"},{"p":"汴京","t":"在开封，将赴凤翔签判任。蜀友回乡，苏轼作简。"},{"p":"汴京","t":"苏轼辞父洵离京师赴凤翔府任。同行者有马正卿（梦得）"}],"1065":[{"p":"汴京","t":"二月，苏轼还朝，除判登闻鼓院。","m":2},{"p":"汴京","t":"五月丁亥（二十八日），苏轼妻王弗卒。弗以后封为魏城君、崇德君、通义郡君。","m":5},{"p":"汴京","t":"在开封，为直史馆。七月辛巳（二十三日），吕公弼（宝臣）除枢密副使。苏轼有贺启。","m":7},{"p":"汴京","t":"陈贻序（叔伦）登进士第，贻序为苏轼所知。"},{"p":"汴京","t":"在开封，判登闻鼓院。苏轼有《谢吕龙图三首》"},{"p":"汴京","t":"在开封。学士院试策，苏轼优诏直史馆。此乃以制科特旨命试。有谢启。"},{"p":"汴京","t":"学士院试策，苏轼优诏直史馆。刘攽（贡父）有贺启。"},{"p":"汴京","t":"在开封，为直史馆。苏自之馈苏轼酒，轼作诗谢之。"},{"p":"汴京","t":"在开封，为直史馆。入馆，苏轼作诗。"},{"p":"汴京","t":"在开封，为直史馆。过蔡茂先，苏轼赠诗。"},{"p":"汴京","t":"苏洵尝令轼致恳杜沂（道源）"},{"p":"汴京","t":"大觉禅师怀琏乞归明州，英宗依所乞。苏轼与怀琏别。"},{"p":"汴京","t":"苏轼始识王震。"},{"p":"汴京","t":"雷简夫（太简）卒，苏洵为作墓志铭。轼、辙编集洵集时抽去此文，以简夫无令闻于终。"},{"p":"汴京","t":"苏轼以以往所得某道人方赠单骧，或为此时事。"},{"p":"郑州","t":"苏轼官凤翔（包括往返）、辙侍父居京师期间，有《岐梁唱和诗集》"},{"p":"渭南","t":"至华州，苏轼与胡允文（执中）遇。"},{"p":"陕县","t":"约在陕县。赴京师途中，苏轼与蒲诚之简，求添差防护厢军。"}],"1062":[{"p":"凤翔","t":"在天兴，任签书凤翔府判官。苏轼次韵弟辙除夕见寄。","m":1},{"p":"眉县崇寿院","t":"二月十五日，苏轼经郿县至清秋镇。","m":2},{"p":"眉县崇寿院","t":"二月十八日，苏轼循终南山而西，游崇圣观、大秦寺、延生观、游仙潭，宿中兴寺；晤道士赵宗有。","m":2},{"p":"眉县崇寿院","t":"二月十九日，苏轼归至郿。","m":2},{"p":"凤翔","t":"二月二十日，苏轼回府。","m":2},{"p":"宝鸡","t":"二月十三日，苏轼出城府，赴宝鸡、虢、郿、盩厔四县减决囚禁，暮宿武城镇。","m":2},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。八月乙亥（初一日），苏轼伯父涣卒。轼作祭涣文、挽诗。","m":8},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。苏辙商州推官告下。先是辙以父洵在京师旁无侍子，奏乞养亲三年，不赴商州，诏从之。轼赋诗。","m":10},{"p":"眉县崇寿院","t":"任签书凤翔府判官。旱，苏轼赴郿祷于太白山，作祝文。自太白山早行，至横渠镇，书崇寿院壁。复游延生观玉真堂，题仙游潭中兴寺，至玉女洞、马融石室，过楼观、郿坞，入磻溪，观太公钓石，至石鼻城。有诗，共七首。"},{"p":"扶风","t":"苏轼与陕西转运副使陆诜会于凤翔之扶风。诜在任中尝举苏轼台阁清要任使。"},{"p":"凤翔","t":"苏轼始识董传，因与定交。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。乙卯（初七日），吴奎自翰林学士、权知开封府除枢密副使。轼有贺启。"},{"p":"凤翔","t":"苏轼修南山木栰河运衙规，衙前之困稍纾。"},{"p":"凤翔","t":"六月，苏轼登真兴寺楼，嘱弟辙作赋，辙赋之。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。苏轼作《太白词》迎送太白山神。时诏封太白山神为明应公，修其庙，亲往祀之。作祝文。（并叙）《告封太白山明应公祝文》"},{"p":"凤翔","t":"苏轼时兼凤翔府学教授。"},{"p":"凤翔","t":"岁晚，苏轼怀蜀之风俗，作馈岁、别岁、守岁诗寄弟辙。杨蟠尝有次守岁韵。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。岁晚，苏轼怀蜀之风俗，作馈岁、别岁、守岁诗寄弟辙。"}],"1063":[{"p":"凤翔","t":"三月甲子（二十二日），赐进士、诸科及第等。邵光为进士；苏轼尝称之。","m":3},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。六七月间，虢令赵荐罢，苏轼有诗送行。","m":6},{"p":"眉县崇寿院","t":"在郿县，任签书凤翔府判官。七月二十七日，苏轼自阳平至斜谷，宿于南山蟠龙寺。有诗。","m":7},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。张琥（璪、邃明、叔毅）回京师，苏轼作考辞；苏轼并作《稼说》以送，勉琥务学。第十一册（文集二）第1062页此文校注[一]之考证。）《张琥考辞》第十册卷七五、《钱塘韦先生文集》卷十八《故大资政张公行状》，为节句。）","m":11},{"p":"扶风","t":"任签书凤翔府判官。扶风驿舍闻泣者甚怨，苏轼作诗感叹人间贫富悬殊。时晤杨耆。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。苏辙记岁首乡俗，作二诗寄轼。轼和。"},{"p":"凤翔","t":"任签书凤翔府判官。苏轼回凤翔。游开元寺，记所见吴道子画答辙《画文书普贤》诗。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。苏轼至孔子庙，观石鼓文，尝钩《石鼓文》；过府厅，读诅楚文；游开元寺，观王维、吴道子画；游天柱寺，观杨惠之塑维摩像；泛东湖；登真兴寺阁；游李氏园；吊秦穆公墓：汇为《凤翔八观》诗。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。夏，苏轼有《答许状元启》"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。苏轼上韩琦论场务书，陈衙前之役之害，议以官榷与民。"},{"p":"凤翔","t":"在天兴，任签书凤翔府判官。宋选罢知凤翔府任，陈希亮来代。希亮以严著，有能名，然以乡里长老自视。其始，轼与希亮不甚叶，作《客位假寐》"},{"p":"凤翔","t":"苏轼回凤翔。中元节假不过知府厅，为陈希亮所案，罚铜八斤。"},{"p":"凤翔","t":"苏轼覃恩转大理寺丞。"},{"p":"凤翔","t":"苏轼结交陈希亮子慥（季常），为本年事。"},{"p":"凤翔","t":"欧阳修约于是岁作《鹎鵊词》。苏轼以后尝书之。"},{"p":"凤翔","t":"李士宁至凤翔，言王君不葬其亲事。士宁当晤苏轼。"},{"p":"周至","t":"在盩厔，任签书凤翔府判官。苏轼欲迁南溪会景亭少西，易名曰招隐，作诗。辙次其韵。"},{"p":"周至","t":"任签书凤翔府判官。冬，苏轼再至盩厔，谒上清宫，作《上清词》。弟辙应邀亦赋。"}],"1064":[{"p":"周至","t":"任签书凤翔府判官。正月十三日，苏轼与张惇同游仙游谭，为文记之。时惇与苏旦、安师孟来访。因与惇游楼观、五郡、大秦、延生、仙游。是为三游终南山。惇别去，轼有诗。","m":1},{"p":"凤翔","t":"十一月乙亥（初四日），科陕西户三丁之一，刺以为义勇军。苏轼尝亲行之，然不满其政。","m":11},{"p":"临潼","t":"在临潼。十二月，苏轼赋《华清引》","m":12},{"p":"凤翔","t":"十二月十七日，苏轼罢签书凤翔府节度判官厅公事任。","m":12},{"p":"长安","t":"苏轼离凤翔，赴长安，谒石苍舒（才翁）；应苍舒之请，书字数幅，并跋。"},{"p":"长安","t":"在长安，过陈汉卿家，苏轼首见吴道玄（道子）画佛。"},{"p":"长安","t":"在长安，苏轼为王颐（正父）跋《醉道士图》，和董传留别诗。"},{"p":"临潼","t":"苏轼与陈睦饮于华清宫朝元阁上。"},{"p":"临潼","t":"苏轼游骊山，有诗。"},{"p":"凤翔","t":"秋，夏军攻静边砦。苏轼多诗及边事，有从戎之意。朝廷以王素（仲仪）知渭州，夏军解去。"},{"p":"凤翔","t":"或在天兴，任签书凤翔府判官。苏轼作《石室先生画竹赞》"},{"p":"凤翔","t":"苏轼在凤翔任中，尝得唐吴道玄（道子）所画四菩萨以献父洵。"},{"p":"凤翔","t":"在凤翔，苏轼妻王弗常以慎于行事与交游为戒，尝谏止发地下所藏。"},{"p":"凤翔","t":"在凤翔任上，苏轼尝于终南山下得古器。"},{"p":"凤翔","t":"在凤翔任上，苏轼尝书写楚词一章。"},{"p":"凤翔","t":"苏轼在凤翔，张舜民从游。"},{"p":"凤翔","t":"苏轼磨勘转殿中丞，乃本年罢签书凤翔府节度判官厅公事任前事。"},{"p":"周至","t":"在盩厔，任签书凤翔府判官。司竹监烧苇园，苏轼召都巡检以其徒会猎园下，作诗。"}],"1068":[{"p":"眉州","t":"四月八日，刘敞（原父）卒。苏轼在眉山，有祭文。","m":4},{"p":"眉州","t":"在眉山。六月，苏轼葬其妻王弗于父苏洵、母程夫人之墓侧，遵父洵之遗命也。轼撰墓志铭。","m":6},{"p":"眉州","t":"七月，苏轼、苏辙除丧。轼葬杜氏姑，遵父洵之遗命也。","m":7},{"p":"成都","t":"苏轼至成都。二十八日，与成都学官侯溥会食嘉祐院，观佛牙，作《油水颂》。尝荐王箴（元直）之文于溥。旋回眉山。，乃王闰之弟。）","m":7},{"p":"眉州","t":"在眉山。十月二十六日，苏轼作《四菩萨阁记》，以所得唐吴道玄（道子）所画四菩萨像藏之阁中，并画父苏洵像于其中，以志永久纪念之意。","m":10},{"p":"长安","t":"至长安。十二月二十九日，苏轼与范纯仁（尧夫）、王颐（正甫）及弟辙会于毋清臣家，再跋《醉道士图》","m":12},{"p":"长安","t":"在长安。十二月三十日，苏轼观王颐、石苍舒（才翁）草书，记之。","m":12},{"p":"眉州","t":"苏轼娶王介(君锡）之幼女闰之（季璋）为妻。"},{"p":"眉州","t":"在眉山。苏轼有《与曾子固二首》"},{"p":"眉州","t":"成都永康军迎祥寺钟楼碑，隆州《多心经》，或为苏轼在蜀时所书。"},{"p":"眉州","t":"在眉山。苏轼跋赵云子画。"},{"p":"眉州","t":"在眉山。苏轼书黄筌画雀。"},{"p":"眉州","t":"苏轼将离眉山，与堂兄不疑（子明）别，以坟墓嘱托堂兄不危（子安）及杨济甫照管。"},{"p":"眉州","t":"苏轼离眉山。蔡褒（子华）来送，手种荔树以期归。轼辞别正信和尚（表公），与家安国。遂行。"},{"p":"成都","t":"约在成都，苏轼记汉讲堂。"},{"p":"青神唤鱼池","t":"自居丧至离眉山前，及嘉祐间居丧期间，苏轼常往来青神瑞草桥；与王淮奇（群、子众、庆源）、杨宗文（君素）、蔡褒（子华）游；王箴（元直）亦与游。"},{"p":"凤翔","t":"至凤翔，苏轼晤张舜民。使人问讯董传。"},{"p":"广元","t":"过益昌，苏轼、苏辙晤鲜于侁（子骏），时侁漕利州路。"}],"1069":[{"p":"长安","t":"正月，董传来长安晤苏轼。","m":1},{"p":"长安","t":"正月，苏轼记董传论诗。","m":1},{"p":"汴京","t":"二月庚子（初三日），以王安石为参知政事。约于本月初，苏轼、苏辙抵京师，皆居南园。","m":2},{"p":"汴京","t":"四月，诏议更学校贡举之法，令两制、两省、待制以上、御史台、三司、三馆臣僚各限一月内具议状闻奏。","m":4},{"p":"汴京","t":"六月二十七日，朝廷命举谏官。张方平举李大临与苏轼，未行。","m":6},{"p":"汴京","t":"十月七日，司马光举苏轼等为谏官。未行。","m":10},{"p":"汴京","t":"十一月己巳（初六日），蔡延庆、孙觉并同修起居注；神宗初欲用苏轼，王安石沮之。","m":11},{"p":"汴京","t":"在开封，判官告院权开封府推官。十二月，苏轼上《谏买浙灯状》。神宗纳其言，罢之。","m":12},{"p":"汴京","t":"苏轼议上，神宗即日召见。神宗欲以苏轼修中书条例，王安石以为不宜轻用。"},{"p":"汴京","t":"苏轼以殿中丞、直史馆判官告院权开封府推官。"},{"p":"汴京","t":"苏轼与王克臣（子难）同厅。"},{"p":"汴京","t":"苏轼从赵抃（高斋先生、清献公）游，为本年至明年四月以前事。"},{"p":"汴京","t":"在开封，判官告院权开封府推官。苏轼与王诜往还密切。轼为诜写《莲华经》，有文。"},{"p":"汴京","t":"苏轼送吕希道（景纯）知解州。"},{"p":"汴京","t":"苏轼以俚语戏逢迎时宰之士子。传轼尝作假山诗刺王安石。"},{"p":"汴京","t":"陈师锡为欧阳修《新五代史》作序，苏轼有微词。先是曾巩、苏轼就作序事相推未决，于是师锡为之。苏轼尝与修论《新五代史》"},{"p":"汴京","t":"苏轼与姜潜交游。"},{"p":"汴京","t":"苏轼始识孙立节（介夫），立节不肯继弟辙为条例司属官。"}],"1066":[{"p":"汴京","t":"四月戊申（二十五日），苏轼父洵卒。","m":4},{"p":"峡州","t":"十二月，苏轼、苏辙入峡。","m":12},{"p":"汴京","t":"苏轼直史馆。尝于秘阁见法帖。"},{"p":"汴京","t":"苏轼与范纯礼（彝叟）遇于京师。"},{"p":"汴京","t":"在开封。苏轼直史馆时，曾作《送司勋子才丈赴梓州》诗。"},{"p":"汴京","t":"苏轼尝见韩琦，语及王迥，当为治平在朝时事。"},{"p":"汴京","t":"司马光来吊丧。苏轼、苏辙求光为母程氏铭墓，光从请。"},{"p":"汴京","t":"苏轼辞别姚闢。"},{"p":"汴京","t":"苏轼、苏辙兄弟载父洵之柩归蜀。"},{"p":"江陵","t":"苏轼、苏辙扶丧过江陵。遇刘挚（莘老）"},{"p":"江陵","t":"苏轼道中遇李师中。"},{"p":"泗州","t":"苏轼、苏辙过泗州、龟山、洪泽。"},{"p":"鄂州","t":"苏轼、苏辙过樊口、石首。"}],"1067":[{"p":"云阳","t":"在云安。正月二十日，苏轼、苏辙扶丧过云安下岩。轼有题名。","m":1},{"p":"云阳","t":"在云安。正月，苏轼书杜甫云安《子规》诗。","m":1},{"p":"眉州","t":"在眉山。四月，苏轼、苏辙护父丧还里。轼撰祖父序之行状，因同年邓绾（文约）求曾巩（子固）作墓志铭。","m":4},{"p":"眉州","t":"在眉山。十二月七日，苏轼、苏辙自老翁井还，偶憩大池院。轼题柱。","m":12},{"p":"眉州","t":"苏轼始识赵庾（成伯）"},{"p":"眉州","t":"苏轼致书同年曾巩，荐蜀士黎生、安生。"},{"p":"眉州","t":"在眉山。苏轼作《书温公志文异圹之语》"},{"p":"眉州","t":"在眉山。苏轼有《猪母佛》文。"},{"p":"眉州","t":"在眉山。苏轼有《池鱼自达》文。"},{"p":"眉州","t":"在眉山。苏轼有《与曾子固一首》"},{"p":"眉州","t":"或在眉山。苏轼有《太白山神》文。"},{"p":"眉州","t":"或在眉山。苏轼有《华阴老妪》文。"},{"p":"彭山","t":"十月壬申（二十七日），苏轼、苏辙葬父洵于眉州彭山安镇可龙里——蟇颐山东二十余里老翁泉。称东茔。手植青松营莹。其后于茔侧建广福禅院。"},{"p":"彭山","t":"苏轼、苏辙以父洵与母程氏同葬。"},{"p":"彭山","t":"苏轼、苏辙葬父洵时，豪杰之士助砖。"},{"p":"嘉州","t":"在龙游。苏轼题治易洞磨厓。"},{"p":"戎州","t":"在僰道。苏轼留题寿昌院。"},{"p":"丰都","t":"苏轼、苏辙泊丧舟仙都山下。"}],"1070":[{"p":"汴京","t":"二月壬申（十一日），以司马光为枢密副使，九辞，罢。其罢与光交游苏轼、苏辙兄弟等有涉。","m":2},{"p":"汴京","t":"三月壬子（二十一日），赐叶祖洽进士及第第一。苏轼尝奏欲别定等第，不许。","m":3},{"p":"汴京","t":"在开封，判官告院权开封府推官。送钱藻（纯老）出守婺州，苏轼作诗。","m":3},{"p":"汴京","t":"五月，苏轼中子迨（仲豫、叔寄）生。","m":5},{"p":"汴京","t":"八月五日，侍御史知杂事谢景温诬奏苏轼向丁父忧归蜀，往返多乘舟，载物货，卖私盐等事。盖缘范镇谏苏轼而发。","m":8},{"p":"汴京","t":"八月癸亥（初六日），诏江淮发遣湖北运司体量苏轼居丧服除往复买贩，及天章阁待制李师中供析照验见轼妄冒差借兵夫事实。无所得。","m":8},{"p":"汴京","t":"在开封，判官告院。十二月，苏轼罢权开封府推官，依旧官告院；与堂兄不疑（子明）简，为言不欺（子正）授蓬州宜陇令，迎十六郎之妻及其子彭、寿居于一处。尝奏彭荫补。","m":12},{"p":"汴京","t":"苏轼上奏，论叶祖洽试策有议论乖谬处，乞行黜落。不从。"},{"p":"汴京","t":"陈敏（伯修）为是科进士。敏尝从苏轼游，甚厚。"},{"p":"汴京","t":"在开封，判官告院权开封府推官。安惇失解西归，苏轼有诗送行。"},{"p":"汴京","t":"苏轼尝与王益柔（胜之）共直馆中。"},{"p":"汴京","t":"文同（与可）来官京师，苏轼与会。"},{"p":"汴京","t":"范镇举苏轼为谏官。"},{"p":"汴京","t":"在开封，判官告院权开封府推官。朱寿昌弃官寻母，得之同州，六月癸亥（初四日），诏寿昌赴京师。其秋，寿昌母子至。寿昌以韵语改写梁武帝所作忏，苏轼为作偈。"},{"p":"汴京","t":"与朱寿昌同时有李定者，不服所生母丧，苏轼斥之；有蔡延庆者追服母丧，轼原之。"},{"p":"汴京","t":"九月庚子（十三日），左仆射兼门下侍郎平章事曾公亮罢。苏轼尝责公亮不能救正朝廷。"},{"p":"汴京","t":"苏轼尝与滕元发（达道）相晤，旋别。"},{"p":"汴京","t":"秋间，苏轼侄林（十六郎）卒于京师。"}],"1071":[{"p":"汴京","t":"在开封，为太常博士。春初，文同（与可）自京师赴知陵州任。苏轼有送行诗。孙洙以玉堂大砚赠同，轼为铭。与同偕别净因院长老道臻。","m":1},{"p":"汴京","t":"四月辛巳（二十六日），韩缜（玉汝）罢秦州，以残虐故。苏轼曾作文记之。","m":4},{"p":"汴京","t":"苏轼乞外补。六月，除杭倅，即杭州通判。","m":6},{"p":"汴京","t":"在开封，将赴杭州通判任。六月十七日，苏轼与堂兄不疑（子明）简，报除杭倅事。","m":6},{"p":"怀远","t":"赴杭州通判任途中。十月二日，苏轼将抵涡口，遇风。","m":10},{"p":"汴京","t":"苏轼迁太常博士。"},{"p":"汴京","t":"在开封，或为太常博士。苏轼代人作《洛伊到任谢宰相启》）"},{"p":"汴京","t":"在开封，或为太常博士。胡宗愈（完夫）之母周氏卒，苏轼作挽词。"},{"p":"汴京","t":"在开封，将赴杭州通判任。苏轼次韵弟辙《初到陈州》"},{"p":"汴京","t":"在开封，将赴杭州通判任。刘恕（道原）出监南康军酒，苏轼有诗送行。"},{"p":"汴京","t":"苏轼本年在京师时，与王诜往还密切，赴杭，诜有馈赠。"},{"p":"汴京","t":"苏轼出都，赴陈州。侄林（十六郎）之妻及其子彭、寿随行。"},{"p":"泗州","t":"赴杭州通判任途中。苏轼过临淮，赵庾（成伯）饯别。作《泗州僧伽塔》、《龟山》诗。《龟山》"},{"p":"陈州","t":"张方平有送行诗，劝苏轼以离是非远祸。"},{"p":"陈州","t":"在宛丘，赴杭州通判任途中。熙宁三年（1070）八月丙戌（二十九日），知成都陆诜（介夫）卒。苏轼有挽词。"},{"p":"颍州","t":"赴杭州通判任途中。苏轼颍州别弟辙，有诗。"},{"p":"扬州","t":"赴杭州通判任途中。苏轼抵扬州，与刘攽（贡父）、孙洙（巨源）、刘挚（莘老）会于州守钱公辅（君倚）座上。作《三同舍》诗。首过平山堂下。"},{"p":"杭州","t":"苏轼赴杭途中（离颍州后），赋诗二十首；抵杭后，寄辙二绝。辙次韵九首，和十三首。"}],"1091":[{"p":"杭州","t":"在钱塘，任杭州知州。正月一日，怀琏（大觉禅师）卒。苏轼有祭文。","m":1},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼赋《蝶恋花·同安生日放鱼取金光明经救鱼事》第九册（词集）第555页此词校注[一]之考证。）","m":1},{"p":"杭州","t":"在钱塘，任杭州知州。正月戊寅（十八日），叶温叟（淳老）罢转运副使。苏轼赋《浣溪沙》送之。继任者乃王哲（微之）","m":1},{"p":"杭州","t":"在钱塘，任杭州知州。谢关景仁送红梅栽，苏轼赋诗。唐坰（林父）赴鄂州，轼送诗。","m":1},{"p":"汴京","t":"在开封，将赴颍州知州任。八月十三日，论漱茶之益，苏轼作《漱茶说》","m":8},{"p":"汴京","t":"在开封，将赴颍州知州任。八月十五日，苏轼与甥柳闳（展如）饮酒，论李白、韩愈诗。","m":8},{"p":"汴京","t":"在开封，将赴颍州知州任。苏轼作《感旧诗》留别弟辙。辙次韵。（并叙）第六册（诗集六）第3726页此诗校注[一]之考证。苏辙次韵诗为《次韵子瞻感旧》，见《栾城集·栾城后集》卷一。）","m":8},{"p":"颍州","t":"在汝阴，任颍州知州。九月，苏轼申省论八丈沟利害。先是奉旨令有关官员于颍州会议开八丈沟利害，以初到任难会议，乞见得的确后方举行。从之。","m":9},{"p":"颍州","t":"在汝阴，任颍州知州。十月，苏轼作《德音到州祭诸庙祝文》","m":10},{"p":"汴京","t":"在开封，将赴颍州知州任。得颍，苏轼致简王巩（定国），叙到颍欲做之事，感叹亲友之间动成陷阱。"},{"p":"汴京","t":"在开封，将赴颍州知州任。苏轼尝拟乞许。觊至许斩彭孙，以彭谄上欺下作恶也。"},{"p":"颍州","t":"在汝阴，任颍州知州。苏轼游西湖，赋《木兰花令》，次欧阳修韵怀修。陈师道亦赋。（霜馀已失长淮阔）第九册（词集）第649页此词校注[一]之考证。陈师道词为《木兰花·同东坡用六一韵》，见《后山集》卷二十四。）"},{"p":"颍州","t":"在汝阴，任颍州知州。苏轼送欧阳宪赴官韦城。"},{"p":"颍州","t":"在汝阴，任颍州知州。苏轼到颍未几，公帑已竭，斋厨索然，戏赋诗。"},{"p":"颍州","t":"在汝阴，任颍州知州。欧阳恕赴华州监酒，苏轼有送行诗。"},{"p":"颍州","t":"在汝阴，任颍州知州。王竦朝散赴阙，苏轼作送行诗。"},{"p":"颍州","t":"在汝阴，任颍州知州。刘季孙（景文）得荐知隰州，自杭经高邮赴任，迂道来访，苏轼留十日，去。期间，与景文多有唱和。"},{"p":"扬州","t":"回京赴翰林学士承旨知制诰任途中。夜到扬州，苏轼席上赋《临江仙》"}],"1072":[{"p":"杭州","t":"在钱塘，为杭州通判。三月二十四日，知州沈立出所集《牡丹记》求苏轼作序。轼为作之。","m":3},{"p":"杭州","t":"四月四日，苏轼三子苏过生。","m":4},{"p":"杭州","t":"在钱塘，为杭州通判。八月，沈立（立之）罢杭守，去杭。苏轼有诗。","m":8},{"p":"杭州","t":"十一月，孔延之（长源）罢越州。延之过杭赴京师，与苏轼饮有美堂。","m":11},{"p":"湖州","t":"为杭州通判。苏轼赴湖州途中，作《画鱼歌》第二册（诗集二）第790页此诗校注[一]之考证。）","m":12},{"p":"杭州","t":"正月，苏颂赴知婺州途中经杭州与苏轼同游西湖。颂和轼《腊日游孤山》诗。"},{"p":"杭州","t":"在钱塘，为杭州通判。柳湖春水忽生数尺；二月中，山茶复开千余朵。苏辙作《宛丘二咏》，兄轼有和。"},{"p":"杭州","t":"在钱塘，为杭州通判。姚闢卒，作挽词。"},{"p":"杭州","t":"在钱塘，为杭州通判。三月二十三日，与知州沈立观牡丹吉祥寺。有诗。"},{"p":"杭州","t":"苏嘉侍父颂至婺州后，过杭赴亳掾，苏轼致书亳州知州杨绘（元素）荐之。"},{"p":"杭州","t":"在钱塘，为杭州通判。张吉甫赴闽漕，苏轼有诗送行。"},{"p":"杭州","t":"在钱塘，为杭州通判。沈立邀游湖，苏轼不赴。明日得双莲持献，并作诗。时朝廷已命陈襄知杭州。"},{"p":"杭州","t":"在钱塘，为杭州通判。闰七月庚午（二十三日），欧阳修卒。苏轼闻讣后哭于惠勤之室，为文祭之。并有诗。"},{"p":"杭州","t":"在钱塘，为杭州通判。陈襄到知杭州任。秋，中和堂木芙蓉盛开，襄作诗，苏轼有和。襄辟孙奕为签判。"},{"p":"杭州","t":"在钱塘，为杭州通判。周邠（开祖）之母卒，苏轼作挽词。"},{"p":"杭州","t":"在钱塘，为杭州通判。苏轼将奉转运司檄檄湖州，相度捍堤利害，寄诗孙觉（莘老），诗首次提及黄庭坚；作诗暂别公辅、张次山（希元）、彦远、醇之、吕仲甫（穆仲）。醇之尝劝苏轼戒言语。"},{"p":"杭州","t":"在钱塘，为杭州通判。苏轼送张轩民赴省试，有诗。"},{"p":"杭州","t":"在钱塘，为杭州通判。是岁，苏轼次子迨剃落，元净（辩才）为祝之，因名竺僧；赠元净诗。尝为李生请出家，元净不许。"}],"1073":[{"p":"杭州","t":"在钱塘，为杭州通判。正月初十日，苏轼作《古意》答鲜于侁（子骏）","m":1},{"p":"杭州","t":"在钱塘，为杭州通判。二月二十一日，苏轼与陈襄、苏颂、孙奕、黄灏、曾孝章等游石屋洞，题名。时苏颂罢知婺州，赴知亳州新任经杭。","m":2},{"p":"杭州","t":"在钱塘，为杭州通判。三月，孙觉移知庐州。觉赠苏轼诗，轼次韵寄别。","m":3},{"p":"临安","t":"为杭州通判。至临安。八月二十日，闻里中儿歌《陌上桑》，易其词；宿海会寺，有诗。","m":8},{"p":"杭州","t":"在钱塘，为杭州通判。九月八日，苏轼以病不赴陈襄重九之会，作诗。","m":9},{"p":"杭州","t":"在钱塘，为杭州通判。苏轼贺陈章生子，有诗；章，襄弟。","m":10},{"p":"杭州","t":"在钱塘，为杭州通判。海月（惠辩）卒。苏轼至天竺吊之，作挽诗。","m":10},{"p":"常州","t":"为杭州通判。除夜，苏轼夜宿常州城外，作诗。","m":12},{"p":"杭州","t":"在钱塘，为杭州通判。暮春，苏轼有《占春芳》词。（红杏了）"},{"p":"杭州","t":"在钱塘，为杭州通判。苏轼作《赠别》、《次韵代留别》《次韵代留别》"},{"p":"杭州","t":"在钱塘，为杭州通判。知州陈襄选差僧人子珪等修浚西湖六井及沈公井，苏轼同擘画。春，讫工。苏轼尝有意修浚运河，治运，亦治西湖也。作《钱塘六井记》"},{"p":"杭州","t":"在钱塘，为杭州通判。王淮奇（庆源）应礼部试赴京师，苏轼简约淮奇来杭。"},{"p":"杭州","t":"在钱塘，为杭州通判。苏轼于席上，代人作赠别诗三首。"},{"p":"杭州","t":"在钱塘，为杭州通判。杭州录事杜子方、司户陈珪、司理戚秉道无辜罢官还乡，苏轼送行诗明其无罪。"},{"p":"杭州","t":"在钱塘，为杭州通判。陈襄（述古）过周邠（开祖）夜饮，襄作诗，苏轼次其韵。襄作诗责轼屡不赴会，轼次前韵。"},{"p":"临安","t":"苏轼往诸县提点，赴临安，知县苏舜举接至县界外，为言数日前入州被训狐押出事，讥转运副使王廷（庭）老等不知是非。"},{"p":"睦州","t":"为杭州通判。苏轼示苏颂近作。自此上至熙宁五年二月颂到知婺州任后，轼尝往婺州访颂，途中赋《行香子》。并有《祝英台近》"},{"p":"婺州","t":"苏轼示苏颂近作。自此上至熙宁五年二月颂到知婺州任后，轼尝往婺州访颂，途中赋《行香子》。并有《祝英台近》"}],"1074":[{"p":"丹阳","t":"李师中罢瀛州。五月戊戌（初一日），师中乞召司马光、苏轼、苏辙置左右。贬师中和州团练副使，本州安置，不得签书公事。","m":5},{"p":"杭州","t":"在钱塘，将赴密州知州任。九月初八日，苏轼席上别杨绘（元素），赋《浣溪沙》。时绘已召还翰苑。","m":9},{"p":"杭州","t":"在钱塘，将赴密州知州任。九月初九日，苏轼复赋《浣溪沙》一首别杨绘。","m":9},{"p":"杭州","t":"在钱塘，将赴密州知州任。将离杭州，苏轼有《与李公择十七首》","m":9},{"p":"润州","t":"赴密州知州任途中。十月，至润州。苏轼与孙洙（巨源）、王存（正仲）会多景楼，赋《采桑子》，作《弹筝》诗。","m":10},{"p":"润州","t":"在丹徒，赴密州知州任途中。苏轼与杨绘（元素）别，和绘《菩萨蛮》。过金山，未停，宝觉轻舟追饯。","m":10},{"p":"润州","t":"在丹徒，赴密州知州任途中。苏轼晤许遵（仲涂），赋《减字木兰花》求为郑容、高莹分别脱籍、从良。赋《南歌子》别遵。（郑庄好客）《南歌子·别润守许仲涂》","m":10},{"p":"润州","t":"在丹徒，赴密州知州任途中。苏轼赋《减字木兰花》","m":10},{"p":"润州","t":"在丹徒，赴密州知州任途中。苏轼复赋《诉衷情》，呈杨绘（元素）","m":10},{"p":"润州","t":"在丹徒，赴密州知州任途中。苏轼和杨绘（元素）词，作《南乡子》","m":11},{"p":"楚州","t":"赴密州知州任途中。至楚州，苏轼与孙洙别，赠《更漏子》"},{"p":"润州","t":"在丹徒，为杭州通判。苏轼与柳瑾、刁约游金山。瑾赴舒州灵仙观，有送行诗、词。"},{"p":"杭州","t":"在钱塘，将赴密州知州任。苏轼约于本岁离杭前，书仁宗《济众方》，榜示通会。"},{"p":"杭州","t":"将赴密州知州任。苏轼离杭州，与富道人简。"},{"p":"湖州","t":"赴密州知州任途中。至湖州，苏轼赋《减字木兰花》，贺李常（公择）生子。于李常席上赋《南乡子》《南乡子·席上劝李公择酒》"},{"p":"常州","t":"赴密州知州任途中。苏轼过晋陵，见沈东老之子偕，偕为道回先生（吕洞宾）事。为和回先生诗。尝书“东老庵”、“回仙桥”。"},{"p":"吴江","t":"赴密州知州任途中。苏轼与杨绘、陈舜俞、张先、李常、刘述至松江，夜置酒垂虹亭上；沈强辅作胡琴，轼赋《南乡子》；轼和舜俞词。（裙带石榴红）第九册（词集）第85页此词校注[一]之考证。）《菩萨蛮》"},{"p":"高邮","t":"赴密州知州任途中。苏轼在高邮，晤孙觉（莘老），读秦观（少游）诗词，盛赞之。觉出杜叔元（君懿）所蓄许敬宗砚，轼记之。"}],"1075":[{"p":"密州","t":"在诸城，任密州知州。正月十五日，苏轼赋《蝶恋花》，忆杭州上元之盛。","m":1},{"p":"密州","t":"在诸城，任密州知州。正月二十日，苏轼赋《江神子》，怀亡妻王弗。","m":1},{"p":"密州","t":"在诸城，任密州知州。苏轼与乔叙（禹功）共饮，叙作诗，轼答之。","m":1},{"p":"密州","t":"在诸城，任密州知州。正月，苏轼有《答张主簿一首》","m":1},{"p":"密州","t":"在诸城，任密州知州。苏轼出城送客，不及，乃步至溪上，赋二诗。","m":3},{"p":"密州","t":"在诸城，任密州知州。十一月庚申（初二日），韩琦葬安阳丰安村。苏轼应琦之子忠彦请，作《醉白堂记》","m":11},{"p":"密州","t":"在诸城，任密州知州。刘攽（贡父）见新作歌词，以诗见戏，苏轼次其韵。","m":11},{"p":"密州","t":"在诸城，任密州知州。正月，苏轼与乔叙、段绎唱和《除夕》韵。"},{"p":"密州","t":"在诸城，任密州知州。段绎罢提刑任，苏轼有送行诗。"},{"p":"密州","t":"在诸城，任密州知州。段绎（释之）作诗咏荆林馆，苏轼和之。"},{"p":"密州","t":"在诸城，任密州知州。苏轼作诗，谢郡人田贺二生献花。"},{"p":"密州","t":"在诸城，任密州知州。李昭叙供备燕别湖亭，苏辙次其韵。昭叙移黎阳都监，归洛省亲，作诗送其行。轼有和。"},{"p":"密州","t":"在诸城，任密州知州。顿起来诗，苏轼用赠段绎除夜韵答之。"},{"p":"密州","t":"在诸城，任密州知州。苏轼作孔延之（长源）挽词。"},{"p":"密州","t":"在诸城，任密州知州。六月甲寅（二十四日），韩琦卒。苏轼作祭文。"},{"p":"密州","t":"在诸城，任密州知州。余主簿母卒，作挽词。"},{"p":"密州","t":"在诸城，任密州知州。苏轼作张掞（文裕）挽词。"},{"p":"密州","t":"在诸城，任密州知州。赵昶（晦之）罢诸城令，回海州，苏轼作诗与词送之。"}],"1076":[{"p":"密州","t":"苏轼迁祠部员外郎。","m":1},{"p":"密州","t":"在诸城，任密州知州。苏轼赋《一丛花》","m":1},{"p":"密州","t":"在诸城，任密州知州。文勋摹秦篆，刻《秦琅邪台刻石》，置之超然台上。正月七日，苏轼作《刻秦篆记》","m":1},{"p":"密州","t":"在诸城，任密州知州。苏轼作《殢人娇》戏李清臣（邦直）","m":1},{"p":"密州","t":"在诸城，任密州知州。三月三日，会流杯亭，苏轼赋《满江红》","m":3},{"p":"密州","t":"在诸城，任密州知州。三月四日，苏轼和文同（与可）洋州园池三十首。","m":3},{"p":"密州","t":"在诸城，任密州知州。九月九日，赵庾（成伯）母生日，苏轼作致语口号。","m":9},{"p":"密州","t":"在诸城，任密州知州。登超然台望月，苏轼赋《江城子》第九册（词集）第173页此词校注[一]之考证。）","m":10},{"p":"密州","t":"在诸城，将赴知河中府。十二月，孔宗翰来代。苏轼罢密州，作诗留别。","m":12},{"p":"密州","t":"提举李孝孙尝乞召还苏轼为侍从。"},{"p":"密州","t":"在诸城，任密州知州。正月十三日，苏轼雪中送文勋（安国）还朝，赋《满江红》。轼尝于文勋席上赋《蝶恋花》"},{"p":"密州","t":"在诸城，任密州知州。正月十六日，知青州向经召还。经旋卒。继任者陈荐（彦升）任中举苏轼侍从。荐不久回乡，轼有贺启。"},{"p":"密州","t":"在诸城，任密州知州。提点京东西路刑狱李清臣（邦直）自徐州行部至密州，登超然台，作赋，苏轼刻之石并跋。轼尝写《超然台记》寄清臣。清臣与轼畅叙情怀。"},{"p":"密州","t":"在诸城，任密州知州。寒食后，登超然台，苏轼赋《望江南》"},{"p":"密州","t":"在诸城，任密州知州。春，苏轼有《谢监司启二首》"},{"p":"密州","t":"在诸城，任密州知州。苏轼赋《望江南》"},{"p":"密州","t":"在诸城，任密州知州。闻王介（中甫）卒，苏轼有挽词。"},{"p":"密州","t":"在诸城，任密州知州。苏泳（潜圣）卒，苏轼作挽词。"}],"1077":[{"p":"汴京","t":"在开封，将赴徐州知州任。在京郊范镇东园，苏轼有《下财启》","m":3},{"p":"汴京","t":"在开封，将赴徐州知州任。三月二日，苏轼应王诜约，饮于四照亭，赋《洞仙歌》、《喜长春》","m":3},{"p":"汴京","t":"在开封，将赴徐州知州任。三月三日，范镇（景仁）往西京，苏轼作诗送之。镇作留别诗，次韵答之。","m":3},{"p":"汴京","t":"在开封，将赴徐州知州任。三月二十三日，苏轼与钱藻（纯老）、王汾（彦祖）、孙洙（巨源）、陈侗（成伯）、陈睦（子雍）、胡宗愈（完夫）、王存（正仲）、林希（子中）、王仲修（敏甫）、弟辙同观唐摹《兰亭》禊帖真迹。","m":3},{"p":"汴京","t":"在开封，将赴徐州知州任。苏轼次韵弟辙送蒋夔行。","m":3},{"p":"徐州","t":"在彭城，任徐州知州。京东路提点刑狱李清臣（邦直）沂山求雨有应，作诗。苏轼、苏辙和之。","m":6},{"p":"汴京","t":"在开封，将赴徐州知州任。苏轼为子迈娶妇石氏。二、三月间，在京郊范镇东园，轼有求婚启。"},{"p":"汴京","t":"在开封，将赴徐州知州任。孔舜亮（君亮）赠诗，苏轼和答。"},{"p":"汴京","t":"或在开封，将赴徐州知州任。苏轼作《韩干画马赞》"},{"p":"汴京","t":"在开封，将赴徐州知州任。苏轼与孙洙（巨源）会于王诜（晋卿）园中。苏轼尝赋《满庭芳》"},{"p":"汴京","t":"在开封，将赴徐州知州任。闻任孜（遵圣）讣，苏轼哭以诗。"},{"p":"汴京","t":"在开封，将赴徐州知州任。晤鲁有开（元翰），有开知卫州，苏轼有诗送行。"},{"p":"汴京","t":"在开封，将赴徐州知州任。道士李若之为苏轼子迨布气，轼有文记之。"},{"p":"汴京","t":"在开封，将赴徐州知州任。苏轼首次晤张大亨（嘉父）。别后，与简大亨，以志于存养为望，并论为学。"},{"p":"齐州","t":"赴知河中府途中。在济南，苏轼始晤吴复古（子野），复古为论出世间法。因作《问养生》"},{"p":"徐州","t":"在彭城，任徐州知州。苏轼赋《浣溪沙》送颜复（长道）、梁先（吉老）。复赴阙。（缥缈红妆照浅溪）"},{"p":"徐州","t":"在彭城，任徐州知州。刁约卒，苏轼有诗哭之。"},{"p":"徐州","t":"在彭城，任徐州知州。任钤辖卒，苏轼有祭文。"}],"1078":[{"p":"徐州","t":"在彭城，任徐州知州。闰正月壬辰（十七日），孙固自知开封府除同知枢密院事。苏轼有贺启。","m":1},{"p":"徐州","t":"在彭城，任徐州知州。二月十九日（寒食），李常（公择）赴淮南西路提刑新任，过徐来访苏轼。有诗。","m":2},{"p":"徐州","t":"在彭城，任徐州知州。五月辛巳（初八日），王克臣改知瀛洲。苏轼有贺启。贾昌衡代克臣为京东西路安抚使、兵马巡检、知郓州。昌衡尝奏请朝廷，乞召苏轼为近侍。","m":5},{"p":"徐州","t":"在彭城，任徐州知州。赵（左“山”右“几”）过南都，归觐钱塘，赴永嘉，苏辙有送行诗，轼次韵。","m":7},{"p":"徐州","t":"在彭城，任徐州知州。九月十八日，苏轼简别刘挚。","m":9},{"p":"徐州","t":"在彭城，任徐州知州。九月，刘恕卒。恕弟格（道纯）来，苏轼与鲜于侁（子骏）简，求为格谋一差遣。","m":9},{"p":"徐州","t":"在彭城，任徐州知州。京东西路转运判官李察（公恕）召赴阙，苏轼赋诗、词送行。"},{"p":"徐州","t":"在彭城，任徐州知州。郑仅（彦能）赴大名府户曹，苏轼有送行诗。"},{"p":"徐州","t":"在彭城，任徐州知州。孔宗翰罢京东路提刑后知陕州，苏轼有诗送行。为宗翰赋《虔州八境图八首》"},{"p":"徐州","t":"在彭城，任徐州知州。春旱，苏轼祷雨城东石潭，作青词。作《起伏龙行》。既应，复赴石潭谢雨，道中作《浣溪沙》五首。"},{"p":"徐州","t":"在彭城，任徐州知州。李常（公择）离徐，苏轼赋《蝶恋花》及诗送行。常在徐，游宴甚乐。尝约常饮，坐上赋戴花诗；尝从过云龙张山人。"},{"p":"徐州","t":"在彭城，任徐州知州。秦观入京应举，过徐，首次见苏轼，呈诗，轼次韵。观旋经南都，见弟辙，赴京师。"},{"p":"徐州","t":"在彭城，任徐州知州。胡允文（执中）卒，子公达奉丧归，苏轼为文祭之，并以诗送公达。"},{"p":"徐州","t":"在彭城，任徐州知州。梁交知莫州，苏轼赋诗、词（《浣溪沙》）送行。其继任者或为欧育。"},{"p":"徐州","t":"在彭城，任徐州知州。九月中旬，王巩（定国）离徐州，来南京，苏轼作诗托巩致辙。巩至南京，旋回京师，辙作诗送之。"},{"p":"徐州","t":"在彭城，任徐州知州。闾丘孝终过徐州，苏轼赋《浣溪沙》以赠。（一别姑苏已四年）"},{"p":"徐州","t":"在彭城，任徐州知州。傅裼罢通判，苏轼有送行诗。田叔通代裼。"},{"p":"徐州","t":"在彭城，任徐州知州。苏轼作《阳关词》赠张继愿。"}],"1079":[{"p":"灵璧","t":"在零璧，赴湖州知州任途中。苏轼别弟辙。三月二十七日，至灵壁镇，应张硕之请，作《张氏园亭记》","m":3},{"p":"扬州","t":"在江都，赴湖州知州任途中。第三次过平山堂，苏轼赋《西江月》，怀欧阳修。","m":4},{"p":"吴江","t":"赴湖州知州任途中。苏轼将至湖州，上监司状。","m":4},{"p":"湖州","t":"七月二十八日，中使皇甫遵到湖州勾摄苏轼前来御史台。罢湖州。先是御史中丞李定、御史舒亶、何正臣等言苏轼谤讪朝政，御史台检会送到《钱塘集》，乃诏知谏院张璪及李定推治以闻。","m":7},{"p":"汴京","t":"苏轼八月十八日，赴台狱。","m":8},{"p":"汴京","t":"在开封。十月二十日，太皇太后曹氏卒。苏轼有挽词。曹氏于苏轼有国士之知。","m":10},{"p":"汴京","t":"十二月庚申（二十六日），责授苏轼水部员外郎、黄州团练副使、本州安置、不得签书公事，王诜、苏辙、王巩三人谪降，自张方平以下二十二人罚铜。初，轼下狱，除苏辙外，张方平、范镇等皆上书救之，不报。仁宗之后慈圣光献曹氏及王安礼、吴充尝言于神宗，宜释苏轼。章惇亦救之。至是得释。","m":12},{"p":"汴京","t":"在开封，将赴黄州团练副使任。苏轼出狱，次狱中寄弟辙韵，赋诗二首。","m":12},{"p":"汴京","t":"在开封。苏轼入狱，作二诗授狱卒梁成，以遗弟辙。"},{"p":"泗州","t":"赴湖州知州任途中。苏轼过淮，复赠孙奕兼寄弟辙诗。"},{"p":"泗州","t":"赴湖州知州任途中。苏轼舟中夜起，作诗。"},{"p":"润州","t":"赴湖州知州任途中。苏轼至金山，次旧诗赠宝觉；大风，留二日，有诗。"},{"p":"润州","t":"赴湖州知州任途中。苏轼至京口，吊万松冈刁约墓，为文祭之。"},{"p":"苏州","t":"赴湖州知州任途中。过苏州，苏轼赋《醉落魄·苏州阊门留别》"},{"p":"湖州","t":"在乌程，任湖州知州。刘撝（行甫）自长兴道湖州赴余姚，苏轼有诗送行；五月十三日，饯撝于钱氏园，赠《南歌子》"},{"p":"湖州","t":"就逮。苏轼与妻子诀别，留书与弟辙，处置后事。郡人送者雨泣。陈师锡出饯，王适、王遹兄弟送出郊，仓卒别法言。子迈随行。就逮时，在告，祖无颇权州事。王适兄弟送家人赴南都弟辙处。"},{"p":"吴江","t":"赴湖州知州任途中。苏轼过松江，与关景仁（彦长）、徐安中会于垂虹。道潜、秦观亦会，分韵赋诗。"},{"p":"徐州","t":"在彭城，将赴湖州知州任。苏轼留别田叔通、寇昌朝（元弼）、石夷庚（坦夫）。作《江城子》、《减字木兰花》别徐州。"}],"1080":[{"p":"汴京","t":"正月初一日，苏轼离京师赴黄州。","m":1},{"p":"陈州","t":"赴黄州团练副使任途中。正月十一日，弟辙自南都来陈州相别苏轼。轼有诗。时辙习道有成。","m":1},{"p":"陈州","t":"正月十四日，苏轼与弟辙别。","m":1},{"p":"陈州","t":"赴黄州团练副使任途中。正月十四日，苏轼与与文务光（逸民）携手河堤饮别，并赠以诗。","m":1},{"p":"汝南","t":"赴黄州团练副使任途中。正月十八日，苏轼蔡州道上遇雪。","m":1},{"p":"麻城","t":"赴黄州团练副使任途中。正月二十日，苏轼过麻城春风岭，作《梅花二首》","m":1},{"p":"息县","t":"赴黄州团练副使任途中。苏轼过新息任伋（师中）之居，留诗。"},{"p":"息县","t":"赴黄州团练副使任途中。苏轼过淮。"},{"p":"光山","t":"赴黄州团练副使任途中。苏轼游光山净居寺，有诗。"},{"p":"麻城","t":"赴黄州团练副使任途中。苏轼过麻城万松亭，见熙宁间县令张毅所植松之存者不及十之三四，赋诗抒慨。"},{"p":"麻城","t":"赴黄州团练副使任途中。苏轼赴黄州途中至故县，见道者张先生（憨子），作《张先生》诗及文。（并叙）《张憨子》"},{"p":"麻城","t":"赴黄州团练副使任途中。苏轼至岐亭，见故人陈慥（季常），为慥所藏《朱陈村嫁娶图》题诗。"},{"p":"麻城","t":"赴黄州团练副使任途中。苏轼在岐亭，有诗。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼作《初到黄州》诗。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。约于到黄州之初，苏轼赠陈慥《临江仙》"},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼迁居临皋亭，有诗、文。"},{"p":"黄州","t":"在武昌，任黄州团练副使。苏辙离黄州，轼次辙《舟次磁湖以风浪留二日不得进》诗送行。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。陈轼（君式）罢，苏轼书李陵赠苏武诗送别。"}],"1085":[{"p":"宿州","t":"或在符离，赴汝州团练副使任途中。正月十日，苏轼书《泗州除夜》等七诗，赠妻王闰之。","m":1},{"p":"润州","t":"赴登州知州任途中。七月二十五日，苏轼与杜介相遇于金山，有诗赠之。","m":7},{"p":"扬州","t":"赴登州知州任途中。八月二十七日，苏轼别扬州石塔寺择老（择公、无择、戒公）。有《记石塔长老答问》","m":8},{"p":"扬州","t":"在江都，赴登州知州任途中。八月二十八日，苏轼赠择老诗。","m":8},{"p":"扬州","t":"或在江都，赴登州知州任途中。苏轼作诗赠葛苇、王寂。","m":8},{"p":"楚州","t":"在山阳，赴登州知州任途中。杨杰奉诏与高丽僧统（义天）游钱塘，与苏轼晤于途中，作诗送之。","m":9},{"p":"海州","t":"赴登州知州任途中。苏轼过海州，见高丽亭馆壮丽，讽以诗。","m":10},{"p":"楚州","t":"赴登州知州任途中。苏轼赋《蝶恋花》"},{"p":"楚州","t":"赴登州知州任途中。至楚州。苏轼次韵赠别徐大正（得之），次韵徐积（仲车）"},{"p":"楚州","t":"赴登州知州任途中。苏轼泗上喜见张大亨（嘉父），有诗。轼尝与大亨论诗。"},{"p":"润州","t":"将赴登州知州任。时苏轼来往真州、润州之间。许遵罢润州，赴金陵，轼次遵韵送之。游真州溪阴堂，有诗。"},{"p":"润州","t":"赴登州知州任途中。苏轼送穆珣（东美）知越州，有诗。"},{"p":"润州","t":"或在丹徒，赴登州知州任途中。苏轼有《与子由六首》"},{"p":"润州","t":"在丹徒，赴登州知州任途中。中秋前后，苏轼亦尝登妙高台，应了元（佛印）之请，作诗。醉后游招隐寺，记焦山长老答问。"},{"p":"常州","t":"在武进，将赴登州知州任。苏轼有《与滕达道六十八首》"},{"p":"常州","t":"将赴登州知州任。苏轼将赴登州，赋《蝶恋花》抒怀。"},{"p":"密州","t":"在诸城，赴登州知州任途中。苏轼过常山，父老相迎。轼有诗。"},{"p":"密州","t":"在诸城，赴登州知州任途中。苏轼于常山作诗赠刘镃。"}],"1084":[{"p":"黄州","t":"在黄冈，将赴汝州团练副使任。三月九日，苏轼赠别王齐愈（文甫）","m":3},{"p":"黄州","t":"在黄冈，将赴汝州团练副使任。徐大正（得之）将别苏轼去，苏轼与大正简。","m":3},{"p":"黄州","t":"在黄冈，将赴汝州团练副使任。四月一日，苏轼将自黄移汝，赋《满庭芳》留别雪堂邻里；兴国军守杨绘（元素）令李翔（仲览）来黄，要苏轼道兴国，遂书此词以赠。（归去来兮，吾归何处）","m":4},{"p":"大冶慈湖","t":"赴汝州团练副使任途中。四月十四日，苏轼至慈湖。访吴子上兄弟，获观父洵送其父中复罢犍为令赴阙引，作跋。","m":4},{"p":"大冶慈湖","t":"赴汝州团练副使任途中。在慈湖，苏轼过程氏草堂，与道潜（参寥）、陈慥（龙丘）观瀑布水，有文。晤友人程师德。送行者除慥外，皆止慈湖。","m":4},{"p":"星子","t":"赴汝州团练副使任途中。五月二十三日，苏轼与道潜（参寥）登慧日寺楼观，题名钟上。同日，滕元发除知湖州。","m":5},{"p":"江州","t":"赴汝州团练副使任途中。道潜（参寥）话别九江，作诗。苏轼次韵，约道潜至汝州。","m":6},{"p":"丹阳","t":"在丹阳，赴汝州团练副使任途中。苏颂（子容）母陈氏卒。苏轼作挽词，吊其丧。","m":9},{"p":"泗州","t":"赴汝州团练副使任途中。十二月一日，苏轼抵泗州。谒普照王塔，舍山木一峰供养，作《木峰偈》。时淮水浅冻，乃暂留泗。","m":12},{"p":"泗州","t":"在盱眙，赴汝州团练副使任途中。冬十二月，苏轼赋《水龙吟》第九册（词集）第505页此词校注[一]之考证。）","m":12},{"p":"楚州","t":"赴汝州团练副使任途中。淮上，苏轼赋《虞美人》别秦观。观有诗赠。（波声拍枕长淮晓）"},{"p":"扬州","t":"在江都，赴汝州团练副使任途中。将发竹西，苏轼别无择（择公），有诗。"},{"p":"润州","t":"在丹徒，赴汝州团练副使任途中。八月癸巳（二十六日），赵抃卒。苏轼尝为抃之像作赞。"},{"p":"黄州","t":"在黄冈，将赴汝州团练副使任。将离黄，苏轼友人祖行席上赠营妓李琪诗。"},{"p":"兴国军","t":"赴汝州团练副使任途中。至兴国军，苏轼晤知军杨绘（元素），绘留赵吉。与陈慥、道潜过李翔（仲览）家。赋诗、词。"},{"p":"兴国军","t":"赴汝州团练副使任途中。苏轼离兴国军。苏轼与杨绘（元素）皆浓醉。绘送至石田驿。轼有诗。"},{"p":"筠州","t":"赴汝州团练副使任途中。苏轼离筠州，作诗赠别。辙次韵。临行辙以慎于口舌为戒。"},{"p":"湖口","t":"在湖口，赴汝州团练副使任途中。胡洞微道师专使致简，答之。复与洞微简，报离江州，遇逆风；录二诗寄洞微，嘱善护玉芝。"}],"1081":[{"p":"黄州","t":"在黄冈，任黄州团练副使。正月二十日，苏轼往岐亭，潘丙、古耕道、郭遘送至女王城东禅庄院，有诗。","m":1},{"p":"黄州","t":"正月二十一日，苏轼宿团封镇。","m":1},{"p":"黄州","t":"在黄冈，任黄州团练副使。三月十四日，苏轼与张商英（天觉）简，叙在黄州之会。时商英责监江陵赤岸盐税，经黄赴贬所。","m":3},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼赋闺怨词《瑶池燕》赠陈慥（季常）（飞花成阵）","m":6},{"p":"黄州","t":"在黄冈，任黄州团练副使。九月十五日，海印禅师纪公将赴峨眉，苏轼作偈送行。","m":9},{"p":"黄州","t":"在黄冈，任黄州团练副使。九月二十三日，张方平生日。苏轼以铁拄杖为寿，作诗。","m":9},{"p":"黄州","t":"九月，苏轼堂兄不欺（子正）卒。","m":9},{"p":"黄州","t":"十一月丁酉（十五日），神宗对辅臣于天章阁，议行官制除目。神宗欲除苏轼为著作郎。既而中辍。","m":11},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼雪后到乾明寺，遂宿，作诗。","m":11},{"p":"麻城","t":"任黄州团练副使。李常（公择）按部。苏轼应常之约，赴岐亭陈慥家相会。次韵前所作《岐亭》诗并和陈慥《雪中赏梅》韵。旋回。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼作《太上玄灵北斗本命延生真经注解后序》第八九册第453页。）"},{"p":"黄州","t":"三月二十四日，任伋（师中）卒于遂州守任。伋守泸州，尝受诬，以幸免。苏轼与苏辙于泸事反复致意。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼题赠徐大受（君猷）侍人阎姬。又尝赋《西江月》赠大受宠姬胜之；又作《减字木兰花》赠之。又尝有词赠大受其他侍人。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。章楶（质夫）赋《水龙吟》，约为本年事。苏轼次韵，并寄《菩萨蛮》七夕词二首（“画檐初挂弯弯月”、“风回仙驭云开扇”）与楶。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。王彭（大年）卒。彭子谠（正夫）专人报其父之丧，苏轼简慰之。谠有文名。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。秋，马默（处厚）过黄州赴广南西路转运使任，苏轼作简与宾州王巩（定国），请默顺道致之。"},{"p":"黄州","t":"李廌（方叔）来，苏轼赞其才，勉以节。廌旋别去谋葬亲，苏轼作诗以劝风义者。"},{"p":"武昌","t":"任黄州团练副使。王适（子立）自筠州赴徐州秋举，过黄州，苏轼与适游武昌西山酌菩萨泉以送，作诗。"}],"1082":[{"p":"黄州","t":"在黄冈，任黄州团练副使。正月初三日，苏轼作文祭堂兄不欺（子正）","m":1},{"p":"黄州","t":"在黄冈，任黄州团练副使。二月，苏轼与章惇（子厚）简，叙东坡耕居生活。","m":2},{"p":"黄州","t":"在黄冈，任黄州团练副使。董钺归鄱阳途中来访，苏轼次钺所作《满江红》韵。（忧喜相寻）第九册（词集）第368页此词校注[一]之考证。）","m":3},{"p":"黄州","t":"在黄冈，任黄州团练副使。三月中旬，苏轼书清泉寺词。","m":3},{"p":"黄州","t":"在黄冈，任黄州团练副使。朱寿昌离鄂守任前，苏轼尝寄赠《满江红》第九册（词集）第386-387页此词校注[一]之考证。）","m":6},{"p":"黄州","t":"在黄冈，任黄州团练副使。九月一日，苏轼与堂兄不疑（子明）夫妇简致候，并寄堂兄不欺（子正）奠文，时不欺已大葬。","m":9},{"p":"黄州","t":"十月以后，苏轼自临皋亭迁雪堂。","m":10},{"p":"黄州","t":"在黄冈，任黄州团练副使。约十二月，苏轼作苏舜举（世美）哀词。","m":12},{"p":"黄州","t":"在黄冈，任黄州团练副使。岁末，苏轼作《黄泥坂词》","m":12},{"p":"黄州","t":"在黄冈，任黄州团练副使。王天麟殿直来，言岳鄂间人不愿多举子（即生养子女）事。苏轼乃与鄂守朱寿昌书，建议明立赏罚以变此风，并倡议捐资救助其贫甚不能举子者。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。董钺（义夫、毅夫）归去，苏轼作《哨遍》以送，志思归之意。并寄朱寿昌（康叔）。黄与苏轼甚相得。（为米折腰）第九册（词集）第379页此词校注[一]之考证。）《与朱康叔二十首》"},{"p":"黄州","t":"在黄冈，任黄州团练副使。李常（公择）离舒州任赴京师，苏轼与常简论俭素乃长策。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。曹焕自光州赴筠州，道过黄冈。苏轼有《渔家傲》赠其父光州守曹九章。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。曹焕离黄去筠州，苏轼作诗送之。焕过庐山，以诗示圆通知慎禅师，知慎和之。焕离庐山，知慎送出门，入室而卒。"},{"p":"黄州","t":"是岁前后，刘攽（贡父）贬衡州，攽过黄州晤苏轼，并赋诗。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。杜沂（道源）约卒于本年，苏轼与沂子传（孟坚）简，哀慰之。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。陈忱（伯诚）或卒于本年，苏轼有简慰其弟慥（季常）"},{"p":"蕲水","t":"任黄州团练副使。赴蕲水。苏轼山行夜饮，中夜起行，醉卧小桥畔，题《西江月》于桥柱上。（照野瀰瀰浅浪）"}],"1083":[{"p":"武昌","t":"在武昌，任黄州团练副使。寒食，苏轼与郭遘游寒溪，武昌主簿吴亮（君采）为置酒，乃改白居易《寒食》诗作《玉楼春》词。（乌啼鹊噪昏乔木）","m":3},{"p":"黄州","t":"四月初一日，中书舍人曾巩（子固）卒。时纷传苏轼与巩同日或先后卒，神宗以询蒲传正。范镇以此遣人问讯。","m":4},{"p":"黄州","t":"在黄冈，任黄州团练副使。七月十日，临皋亭借观吴道玄《地狱变相》，苏轼为跋。","m":7},{"p":"黄州","t":"在黄冈，任黄州团练副使。孙鼛自京师赴偃师枉道来访，出父洵之手迹。七月十五日，轼跋而归之。其行，托寄二簟与张方平（安道）","m":7},{"p":"黄州","t":"在黄冈，任黄州团练副使。杨寀（君素）到黄州任。徐大受（君猷）罢黄守，离任，苏轼尝赋《好事近》相赠。","m":8},{"p":"黄州","t":"九月二十七日，苏轼四子遯生。","m":9},{"p":"黄州","t":"十月，误传苏轼被召，贺铸有诗。","m":10},{"p":"黄州","t":"在黄冈，任黄州团练副使。五月一日，张公裕（益孺）卒。苏轼尝跋其《清净经》"},{"p":"黄州","t":"在黄冈，任黄州团练副使。杨世昌离黄。苏轼托世昌致简滕元发（达道）"},{"p":"黄州","t":"在黄冈，任黄州团练副使。夏，苏轼与大别才老简。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。苏轼与陈章简，慰其兄襄（述古）之逝。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。七月丙辰（十三日），罢苏辙兼权筠州州学教授。苏轼有诗、简及之。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。秋，苏轼与大别才老简。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。陈轼（君式）致政，苏轼有简及之。陈轼旋卒，有祭文。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。王巩南迁初归，赋诗。苏轼次其韵。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。王先生送陈慥（季常）往江南，因访苏轼，轼赋《满庭芳》第九册（词集）第437-438页此词校注[一]之考证。）"},{"p":"黄州","t":"在黄冈，任黄州团练副使。邓忠臣（慎思）扶母周氏柩过黄州，苏轼作挽词挽其母。"},{"p":"黄州","t":"在黄冈，任黄州团练副使。徐大受（君猷）卒于道，丧过黄州，苏轼为文祭之，并有挽词。与大受之弟大正（得之）简，商议处置其后事。"}],"1086":[{"p":"汴京","t":"在开封，任起居舍人。二月六日，苏轼撰《集禧观开启祈雪道场青词》","m":2},{"p":"汴京","t":"三月甲戌（十七日），苏轼、苏辙赴实录院御筵。","m":3},{"p":"汴京","t":"在开封，任中书舍人。三月己卯（二十二日），苏轼缴进沈起叙朝散郎监岳庙词头状。诏罢之。","m":3},{"p":"汴京","t":"在开封，任中书舍人。四月六日，王安石卒。苏轼撰《王安石赠太傅制》","m":4},{"p":"汴京","t":"在开封，任中书舍人。四月甲午（七日），马默为司农少卿，范子渊知兖州。苏轼行默制。缴进子渊词头，乞行责词，依。子渊寻知峡州，行制。","m":4},{"p":"汴京","t":"在开封，任中书舍人。四月二十六日，苏轼缴进陈绎知建昌军词头状，诏罢之。","m":4},{"p":"汴京","t":"在开封，任中书舍人。五月甲戌（十八日），苏轼缴进张诚一依旧客省使、提举江州太平观发赴本任词头状，缴进李定落龙图阁直学士、守本官分司南京许于扬州居住词头状。二人皆责。","m":5},{"p":"汴京","t":"在开封，任中书舍人。六月辛亥（二十三日），吕惠卿责授建宁军节度副使本州安置不得签书公事。责词，苏轼撰。","m":6},{"p":"汴京","t":"在开封，任中书舍人。七月癸未（二十八日），苏轼缴进楚建中户部侍郎词头状，诏建中除命勿行。","m":7},{"p":"汴京","t":"八月三日，三省同上司马光所撰《约束州县抑配青苗钱白札子》。苏轼不肯签，台谏亦屡章乞尽罢。","m":8},{"p":"汴京","t":"八月己亥（十四日），以苏轼为皇帝贺辽国生辰使，辞。","m":8},{"p":"汴京","t":"十一月十九日，黄庭坚、张耒、晁补之来访苏轼，获《黄泥坂词》手稿。","m":11},{"p":"汴京","t":"在开封，为翰林学士、知制诰。十二月初一日，苏轼撰《班荆馆赐大辽贺兴龙节人使到阙酒果口宣》","m":12},{"p":"汴京","t":"在开封，任起居舍人。王觌（明叟）赋喜雪诗，苏轼次其韵颂宽狱市。"},{"p":"汴京","t":"在开封，任中书舍人。王巩（定国）将离京师，苏轼送行；巩作诗，轼和之。"},{"p":"汴京","t":"在开封，任中书舍人。王廷老（伯扬）自南都过京师赴虢守任，苏轼有诗送行。"},{"p":"汴京","t":"在开封，为翰林学士、知制诰。林希（子中）有贺启。苏轼有《除翰林学士谢启》"},{"p":"汴京","t":"在开封，为翰林学士、知制诰。李曼（修孺）知果州，苏轼撰制词。"}],"1087":[{"p":"汴京","t":"在开封，为翰林学士、知制诰。正月一日，苏轼撰《赐观文殿学士正议大夫知河南府孙固乞致仕不允诏四首》","m":1},{"p":"汴京","t":"在开封，为翰林学士、知制诰。新正，苏轼与周尹（正孺）倡酬。潘鲠母卒，轼作挽词。玉堂栽花，轼乞花栽，与王诜（晋卿）简。","m":1},{"p":"汴京","t":"正月辛未（十八日），傅尧俞、王岩叟入对，续论苏轼。","m":1},{"p":"汴京","t":"正月丙子（二十三日），令苏轼、傅尧俞、王岩叟、朱光庭各疾速依旧供职。先是欲逐四人，执政以为不可。范纯仁奏苏轼无罪。","m":1},{"p":"汴京","t":"在开封，为翰林学士、知制诰兼侍读。正月，苏轼有《答杨礼先三首》","m":1},{"p":"汴京","t":"在开封，为翰林学士、知制诰。二月一日，苏轼缴进给田募役议札子。","m":2},{"p":"汴京","t":"在开封，为翰林学士、知制诰。三月甲寅（初二日），苏轼撰太皇太后于崇政殿受册手诏。诏改易诏词。","m":3},{"p":"汴京","t":"六月，薛绍彭刻《上清词》于上清太平宫。绍彭寄石刻。","m":6},{"p":"汴京","t":"在开封，为翰林学士、知制诰。七月一日，苏轼撰《赐皇伯祖彭化军节度使高密郡王宗晟生日礼物口宣》","m":7},{"p":"汴京","t":"七月甲子（十五日），苏轼进《坤成节集英殿宴教坊词致语口号》","m":7},{"p":"汴京","t":"八月辛巳（初二日），程颐罢经筵，权同管勾西京国子监。先是谏议大夫孔文仲屡言颐，至是罢；或谓孔文仲之言用苏轼意。苏轼上章乞补外，留中不出。","m":8},{"p":"汴京","t":"在开封，为翰林学士、知制诰。八月，苏轼撰《集英殿秋宴教坊词致语口号》","m":8},{"p":"汴京","t":"九月丁卯（十八日），大宴集英殿。苏轼进教坊词致语口号。","m":9},{"p":"汴京","t":"十二月八日，兴龙节，集英殿宴。其《教坊词致语口号》为苏轼所进。","m":12},{"p":"汴京","t":"在开封，为翰林学士、知制诰。杨孟容（礼先）知广安军，苏轼有诗送之。自谓其诗效黄鲁直体，庭坚（鲁直）赋诗解之。"},{"p":"汴京","t":"在开封，为翰林学士、知制诰。送顾临（子敦）赴河北，苏轼有诗，诗有戏语。辙亦有诗。"},{"p":"汴京","t":"在开封，为翰林学士、知制诰。张舜民倅虢，作诗留别，苏轼次韵。"},{"p":"汴京","t":"是岁，苏轼次孙符（仲虎）生。"}],"1088":[{"p":"汴京","t":"在开封，为翰林学士、知制诰兼侍读。正月四日，苏轼撰《赐中大夫守尚书右丞王存生日诏》","m":1},{"p":"汴京","t":"正月乙丑（十七日），朝廷命苏轼权知贡举，孙觉、孔文仲同知贡举。陈轩（元舆）等五人参详，单锡（君贶）等十五人点检试卷。","m":1},{"p":"汴京","t":"正月丁卯（十九日），侍御史王觌奏，苏轼不宜久在朝，宜与一郡。","m":1},{"p":"汴京","t":"正月二十一日，苏轼领贡举事，入试院。","m":1},{"p":"汴京","t":"二月己卯（初二日），监察御史赵挺之奏苏轼主文禁引《三经新义》","m":2},{"p":"汴京","t":"三月二十一日，孔文仲卒。苏轼抚柩赞其劲直。","m":3},{"p":"汴京","t":"约在开封，为翰林学士、知制诰兼侍读。七月，苏轼有《谢诸秀才启》","m":7},{"p":"汴京","t":"七月癸丑（初九日），辽使来贺坤成节，苏轼馆伴于都亭驿。为内侍都知刘元方赋唐卢鸿《草堂图》","m":7},{"p":"汴京","t":"七月丙寅（二十二日），承议郎、祠部员外郎翟思为殿中侍御史，从苏轼等所请也。","m":7},{"p":"汴京","t":"闰十二月三日，迩英进读《宝训》，苏轼因太宗爱马事以及爱民。","m":12},{"p":"汴京","t":"苏轼约李廌（方叔）夜访话别。"},{"p":"汴京","t":"刘攽（贡父）宿致斋中太一宫，寄诗苏轼、苏辙。"},{"p":"汴京","t":"苏轼为《李观墓道碑》书石，约为范镇卒前事。"},{"p":"汴京","t":"冬，黄庭坚赋《戏答俞清老道人寒夜三首》，苏轼屡哦以为妙。"},{"p":"汴京","t":"是岁，黄庭坚作《苏李画枯木道士赋》、《东坡居士墨戏赋》。苏轼尝与庭坚论文。"},{"p":"汴京","t":"苏轼尝与弟辙饮酒。"},{"p":"汴京","t":"是岁，李公麟（伯时）作《西园雅集图》，绘苏轼等有姓名者十七人雅集西园之状，米黻为之记。"},{"p":"汴京","t":"苏轼欲见晏几道（叔原），几道辞之，或为本年事。"}],"1089":[{"p":"汴京","t":"在开封，将赴杭州知州任。苏轼上笏记。","m":3},{"p":"汴京","t":"三月十八日，中大夫守尚书右丞胡宗愈罢资政殿学士除知陈州。与苏轼有涉。","m":3},{"p":"汴京","t":"在开封，将赴杭州知州任。三月，苏轼作《端砚铭》","m":3},{"p":"汴京","t":"在开封，将赴杭州知州任。四月五日，李廌言范镇卒前数日须眉黑事。苏轼有文记之。","m":4},{"p":"汴京","t":"在开封，将赴杭州知州任。四月十一日，苏轼奏论行遣蔡确札子。不报。","m":4},{"p":"汴京","t":"在开封，将赴杭州知州任。四月二十一日，应范仲淹子纯仁兄弟三人请，苏轼作《范文正公文集叙》","m":4},{"p":"南京","t":"在宋城，赴杭州知州任途中。五月，苏轼上虢州太守启。","m":5},{"p":"楚州","t":"赴杭州知州任途中。过楚州，苏轼晤徐积（仲车），并晤楚州守。六月三日，与积简告别。","m":6},{"p":"汴京","t":"元丰末至离京师赴杭前，苏轼与宗室令穰（大年）有交往。令穰尝学苏轼之画。"},{"p":"汴京","t":"在开封，或将赴杭州知州任。苏轼赋《乌夜啼》"},{"p":"汴京","t":"在开封，将赴杭州知州任。苏轼有《与米元章二十八首》"},{"p":"扬州","t":"或在扬州，赴杭州知州任途中。苏轼有《与米元章二十八首》"},{"p":"苏州","t":"赴杭州知州任途中。过苏州，苏轼有《姑苏舟次》诗。"},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼有《杭州到状》。此状或为与监司者。"},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼与莫君陈饮西湖跳珠轩，有诗。尝与君陈论养生。"},{"p":"秀州","t":"赴杭州知州任途中。苏轼晤弓允（明夫）、钱勰（穆父）之子三郎。"},{"p":"常州","t":"赴杭州知州任途中。夏，或在武进，苏轼有《与米元章二十八首》"},{"p":"常州","t":"赴杭州知州任途中。途次毗陵（常州），有联句。"}],"1090":[{"p":"杭州","t":"正月十九日，范祖禹上劄子，乞早召还苏轼。","m":1},{"p":"杭州","t":"在钱塘，任杭州知州。二月十四日，苏轼奏乞降度牒召人入中斛斗出粜济饥等状。","m":2},{"p":"杭州","t":"在钱塘，任杭州知州。五月初七日，颜复（长道）卒。苏轼有文怀念之。","m":5},{"p":"杭州","t":"在钱塘，任杭州知州。六月丁酉（初四日），黄履知苏州。履来启，轼回启为贺。履到任，复来启，有答。","m":6},{"p":"杭州","t":"在钱塘，任杭州知州。九月，杨杰赴都任礼部员外郎，苏轼有送行诗，杰次韵。","m":9},{"p":"杭州","t":"在钱塘，任杭州知州。十月十八日，苏轼奏进何去非《备论》状，乞除馆职。不报。时去非为徐州州学教授。尝邀去非至杭。","m":10},{"p":"杭州","t":"在钱塘，任杭州知州。除夕，狱空，苏轼赋诗。","m":12},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼与陈师锡（伯修）简，慰其亲之逝。"},{"p":"杭州","t":"在钱塘，任杭州知州。钱蒙仲来杭欲赴举，苏轼次刘季孙赠韵赠之。"},{"p":"杭州","t":"在钱塘，任杭州知州。友人张君赴嘉州，苏轼作诗送其行。"},{"p":"杭州","t":"在钱塘，任杭州知州。秋，苏轼尝赋《点绛唇》赠袁毂。（闲倚胡床）第九册（词集）第588-589页此词校注[一]之考证。）"},{"p":"杭州","t":"在钱塘，任杭州知州。十月二十四日，滕元发（达道）卒。苏轼有挽词。"},{"p":"杭州","t":"在钱塘，任杭州知州。程遵彦（之邵）赴阙，苏轼送诗。"},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼子迨、过解两浙路，赴试春闱。轼有简及之。"},{"p":"杭州","t":"在钱塘，任杭州知州。章衡罢知秀州任，胡深父来知。苏轼与深父简，论优价广籴之利。答深父启。"},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼与胡深父简，以故人周知录兄弟生活相托。"},{"p":"杭州","t":"在钱塘，任杭州知州。苏轼答范祖禹（纯夫）简。时李陶（唐夫）为赴清溪令在杭。陶赴任，有诗送之。"},{"p":"杭州","t":"毛滂（泽民）约于是年罢法曹掾，赋《惜分飞》，苏轼赏其词。"}],"1092":[{"p":"颍州","t":"在汝阴，将赴扬州知州任。苏轼赋《满江红》怀弟辙。","m":2},{"p":"颍州","t":"在汝阴，将赴扬州知州任。或二月，苏轼作《刘沈认屐》文。","m":2},{"p":"泗州","t":"赴扬州知州任途中。三月十二日，苏轼抵泗州，祈雨僧伽塔，作祝文。与弓允（明父）简，遣送人还府，致谢意。","m":3},{"p":"泗州","t":"在泗州，赴扬州知州任途中。苏轼赋《木兰花令》","m":3},{"p":"濠州","t":"赴扬州知州任途中。苏轼舟行经濠州。三月三日，与子迨、过游涂山、荆山，诗记所见。","m":3},{"p":"楚州","t":"赴扬州知州任途中。三月，或在楚州，苏轼有《与蔡朝奉二首》","m":3},{"p":"扬州","t":"在江都，任扬州知州。苏轼赋《浣溪沙》第九册（词集）第670页此词校注[一]之考证。）","m":4},{"p":"扬州","t":"在江都，将回京赴兵部尚书任。苏轼赋《生查子》赠别苏坚（伯固）","m":8},{"p":"汴京","t":"慈化大师卒，道潜作挽词。慈化乃苏轼之友。"},{"p":"颍州","t":"在汝阴，将赴扬州知州任。江淮荆浙等路发运使晁端彦暨诸郡有贺启，苏轼答之。"},{"p":"颍州","t":"在汝阴，将赴扬州知州任。钱勰（穆父）亦以《韩文公庙碑》相请，苏轼答以到扬州当下笔。"},{"p":"颍州","t":"在汝阴，将赴扬州知州任。苏轼离颍，赵令畤（德麟）饯饮，赋诗话别。"},{"p":"寿州","t":"赴扬州知州任途中。苏轼自颍起行，或经寿州，作《寿阳岸下》"},{"p":"濠州","t":"或在濠州，赴扬州知州任途中。晁补之闻苏轼知扬州，以诗相迎，苏轼有和。时补之为扬州通判。"},{"p":"濠州","t":"赴扬州知州任途中。苏轼淮上早发，作诗。"},{"p":"楚州","t":"赴扬州知州任途中。苏轼舟行至楚州。自颍州行至此，沿途常屏去兵卒，访问民间疾苦。晤楚守周豫，豫出舞鬟，赋《南歌子》二首赠之。作《淮阴侯庙碑》。尝题字紫极宫。"},{"p":"扬州","t":"在江都，任扬州知州。秦觏（少章）自京师赴杭州仁和主簿任，途经扬州，出范祖禹（淳甫）送行诗，苏轼为和之。晁补之、朱长文亦有和。"},{"p":"扬州","t":"在江都，任扬州知州。晁端彦（美叔）赴京师，苏轼有送行诗。"}],"1093":[{"p":"汴京","t":"在开封，将赴定州知州任。苏轼别弟辙，九月十四日作诗。轼元祐间，尝喜与辙次子适论政事。","m":9},{"p":"汴京","t":"在开封，将赴定州知州任。九月十五日，苏轼与范祖禹同上《听政札子》，论当今所宜先者，在循太皇太后之法度而谨守之。","m":9},{"p":"汴京","t":"在开封，将赴定州知州任。九月二十六日，朝辞赴定州，苏轼上论事状。","m":9},{"p":"汴京","t":"在开封，将赴定州知州任。苏轼赋《行香子》","m":9},{"p":"汴京","t":"在开封，将赴定州知州任。九月，苏轼有《答开元明座主九首》","m":9},{"p":"汴京","t":"九月二十七日，苏轼离京赴定州。","m":9},{"p":"汴京","t":"赴定州知州任途中。出汴京城，苏轼有《与米元章二十八首》","m":9},{"p":"定州","t":"在安喜，任定州知州。岁暮，苏轼送曾孝广赴京师，有诗。","m":12},{"p":"汴京","t":"在开封，将赴定州知州任。苏轼辟孙敏行（子发）入幕。与敏行及弟辙简及之。"},{"p":"汴京","t":"在开封，将赴定州知州任。苏迨之妇欧阳氏卒。苏轼有祭文，并作《装背罗汉荐欧阳妇疏》、《观音赞》"},{"p":"汴京","t":"在开封，将赴定州知州任。苏轼与圣用弟简，勉其侄十郎官事勿苟简。"},{"p":"汴京","t":"在开封，将赴定州知州任。孙朴（元忠）为其父固亲书《华严经》，苏轼为书其后。"},{"p":"汴京","t":"在开封，将赴定州知州任。苏轼与蒲宗孟（传正）简，以俭、慈为劝。或为本年赴定前事。"},{"p":"汴京","t":"在开封，将赴定州知州任。苏轼有《与王定国四十一首》"},{"p":"安阳","t":"赴定州知州任途中。苏轼过相州，晤运使谢卿材（仲适），送王古（敏仲）使辽，有诗。"},{"p":"定州","t":"在安喜，任定州知州。苏轼有到状。"},{"p":"定州","t":"李之仪（端叔）应辟离京师赴定。"},{"p":"定州","t":"在安喜，任定州知州。苏轼戏为《定州学生砚盖隐语》"}],"1094":[{"p":"定州","t":"在安喜，任定州知州。二月二十日，苏辙生日，兄轼以诗及檀香观音像等为寿。","m":2},{"p":"汴京","t":"赴英州知州任途中。或在陈留，苏轼赋《蝶恋花》","m":4},{"p":"六合","t":"赴英州知州任途中。钟山泉公（法泉、佛慧禅师）卒。五月，或在真州，苏轼与道潜（参寥）简，慰之。","m":5},{"p":"泗州","t":"赴英州知州任途中。苏轼遇任伯雨（德翁）于泗、楚之间，伯雨扶母柩回蜀。因同行。有《师续梦经》"},{"p":"高邮","t":"赴英州知州任途中。过高邮，苏轼寄孙升（君孚）诗。"},{"p":"南京","t":"赴英州知州任途中。苏轼离南都，张元明追饯.轼有简与之。"},{"p":"宿州","t":"苏轼晤晁说之（以道）于符离，论邢居实（惇夫）；别，酒酣歌古《阳关》。赠说之歙砚。"},{"p":"江州","t":"赴惠州途中。在九江，苏轼晤苏坚（伯固）。坚往澧阳，轼赋《归朝欢》别之。（我梦扁舟浮震泽）"},{"p":"太平州","t":"赴英州知州任途中。离金陵，苏轼过慈湖夹，阻风。有诗。有与任伯雨（德翁）简。"},{"p":"江宁","t":"或在江宁，赴英州知州任途中。苏轼忽忆杭州凤凰山下中和堂夏秋间清凉，赋诗。"},{"p":"江宁","t":"在江宁，赴英州知州任途中。苏轼有《答清凉长老一首》"},{"p":"真州","t":"赴英州知州任途中。过仪真，苏轼少留。淮南漕庄公岳（希仲）差卒津送。作简谢公岳并为书《白纻词》"},{"p":"杞县","t":"赴英州知州任途中。苏轼过雍丘，与米黻（元章）简，亟愿与黻晤；赠别马正卿（梦得）"},{"p":"正定","t":"或在真定，赴英州知州任途中。苏轼有《与孙子发七首》"},{"p":"定州","t":"在安喜，任定州知州。李之仪（端叔）送保倅翟安常赴阙，有诗，苏轼次韵，兼寄弟辙。王崇拯还朝过定，赋诗留别，轼次其韵。"},{"p":"定州","t":"在安喜，将赴英州知州任。将行，苏轼谒诸庙辞行，作祝文；醮北岳，作青词：以明心迹。定人谓苏轼在定设施如韩琦。"},{"p":"定州","t":"在安喜，将赴英州知州任。苏轼将南迁，与友人简。时李廌（豸）（方叔）来定州，旋去。"},{"p":"临城","t":"赴英州知州任途中。苏轼经临城，有诗。"}],"1095":[{"p":"惠州","t":"在归善，任宁远军节度副使。正月二日，苏轼作诗寄邓守安。","m":1},{"p":"博罗","t":"任宁远军节度副使。约于三月十四日，苏轼追饯程之才（正辅）于博罗。夜半之才行，轼有二诗。","m":3},{"p":"博罗","t":"以病酒留博罗一日，苏轼晤邓守安。","m":3},{"p":"惠州","t":"三月二日，卓契顺自宜兴徒步抵惠州，致其师苏州定慧寺僧守钦《拟寒山十颂》与长子迈与苏轼之书。传卓契顺亦携了元（佛印）致书。","m":3},{"p":"惠州","t":"三月十九日，苏轼复迁于合江楼之行馆。","m":3},{"p":"惠州","t":"四月八日，佛生日，苏轼画寿星。尝画月梅。","m":4},{"p":"惠州","t":"四月二十三日，黄庭坚到达黔州贬所。苏轼后修简相慰。","m":4},{"p":"惠州","t":"七月十三日，王庠（周彦）、王序（商彦）兄弟万里遣人遗药物相问苏轼，抵惠州。","m":7},{"p":"惠州","t":"在归善，任宁远军节度副使。八月二十七日，苏轼书养生三法——食芡法、胎息法、藏丹砂法，寄弟辙。","m":8},{"p":"惠州","t":"九月壬戌（三十日），监察御史常安民罢。先是安民劝董敦逸勿劾苏轼、苏辙兄弟，至是为敦逸论罢。","m":9},{"p":"惠州","t":"在归善，任宁远军节度副使。法舟、法荣自成都来，过筠见苏辙，赴惠谒苏轼，携辙与程之才（正辅）简。十二月，轼覆之才简。","m":12},{"p":"惠州","t":"正月十日，晁补之自知齐州降通判南京。以在扬州时尝修摘星楼。苏轼以为乃己所累。"},{"p":"惠州","t":"在归善，任宁远军节度副使。苏轼复迁于合江楼之行馆。与南华辩老简，为报之。"},{"p":"惠州","t":"在归善，任宁远军节度副使。苏辙次轼《梳头》韵。轼复次辙《梳头》韵，与辙论养生之理。"},{"p":"惠州","t":"弟辙赋诗，以修无生法为劝。"},{"p":"惠州","t":"在归善，任宁远军节度副使。翟东玉到龙川令任。苏轼与东玉简，求于其友人循州兴宁令欧阳叔向处致地黄。"},{"p":"惠州","t":"与朝云闲坐，苏轼命唱《蝶恋花》。朝云颇伤感，遂罢。"},{"p":"惠州","t":"苏轼于惠州海会院旁陂作放生池，弟辙出十五千足以助。"}],"1096":[{"p":"惠州","t":"在归善，任宁远军节度副使。正月初五日，苏轼与法舟夜坐，谈不二法，应舟之请记之。","m":1},{"p":"惠州","t":"在归善，任宁远军节度副使。二月，程之才（正辅）召还。苏轼以和陶潜《饮酒》二十篇寄之，并荐侯晋叔。有与之才简。","m":2},{"p":"惠州","t":"在归善，任宁远军节度副使。三月六日，苏轼跋柳宗元南迁后所作《南涧》诗。","m":3},{"p":"惠州","t":"在归善，任宁远军节度副使。四月二十日，复迁嘉祐寺，苏轼作诗。","m":4},{"p":"惠州","t":"七月五日，朝云病卒。","m":7},{"p":"惠州","t":"在归善，任宁远军节度副使。八月庚申（初三日），葬朝云于栖禅山寺。苏轼作墓志铭。寺僧为建六如亭。","m":8},{"p":"惠州","t":"在归善，任宁远军节度副使。方子容来知惠，詹范罢。九月九日，苏轼与詹范、方子容及邻翁等登白鹤山强醉，有诗；并作《龙山补亡》。过亦有诗。","m":9},{"p":"惠州","t":"十二月十九日，苏轼生日，过寿诗。南华重辩（辩老）亦有饷。","m":12},{"p":"惠州","t":"在归善，任宁远军节度副使。除夜前两日（十二月二十七日），吴复古以煨芋见啖，苏轼乃记之并论煨芋之法。","m":12},{"p":"惠州","t":"在归善，任宁远军节度副使。新年作诗，苏轼以居惠为乐。"},{"p":"惠州","t":"在归善，任宁远军节度副使。苏轼欲长子迈来广南东路指射差遣，欲次子迨试法赴举。轼复简求程之才（正辅）寄家书与迈。时迈、迨在京师。"},{"p":"惠州","t":"黄庭坚（鲁直）自黔州寄诗与苏轼。"},{"p":"惠州","t":"在归善，任宁远军节度副使。春，朝云生日，苏轼作致语口号。"},{"p":"惠州","t":"在归善，任宁远军节度副使。苏轼和弟辙盆中石菖蒲忽生九花诗。"},{"p":"惠州","t":"在归善，任宁远军节度副使。与文公大夫简，苏轼叙在惠生活。曹辅（子方）惠芽蕉并简，答之。"},{"p":"惠州","t":"在归善，任宁远军节度副使。七月五日，朝云病卒。苏轼有诗、词悼之。"},{"p":"惠州","t":"在归善，任宁远军节度副使。与章楶（质夫）简，苏轼报朝云之逝。楶有简相慰，复答简。"},{"p":"惠州","t":"在归善，任宁远军节度副使。苏轼跋黄庭坚渔父词。"}],"1097":[{"p":"惠州","t":"正月末，苏迈自宜兴挈两房赴惠州，抵赣上。苏过往循州相迎。迈之来，为就仁化令任。","m":1},{"p":"惠州","t":"二月六日，周彦质（文之）罢循州，来访苏轼。","m":2},{"p":"惠州","t":"闰二月甲辰（十九日），苏轼责授琼州别驾，移昌化军安置。","m":2},{"p":"惠州","t":"在归善，任宁远军节度副使。三月，苏迈罢仁化令任；闻弟辙贬讯，苏轼专人简王古（敏仲）乞其详。","m":3},{"p":"广州","t":"赴昌化军（儋州）途中。四月，在广州，苏轼有《与王敏仲十八首》","m":4},{"p":"惠州","t":"在归善，任宁远军节度副使。四月十五日，苏轼赠别长子迈。嘱迈慎言语，节饮食。自写影赠迈，或为此时事。以家累托方子容（南圭）","m":4},{"p":"惠州","t":"四月十七日，苏轼得琼州别驾、昌化军（儋州）安置告命。惠州守方子容携告命来。","m":4},{"p":"惠州","t":"四月十九日，苏轼与子过离惠，与家人痛苦诀别。李思纯之子光道送行。惠人盛赞苏轼浩然之气。","m":4},{"p":"徐闻","t":"赴昌化军（儋州）途中。六月十一日，苏轼和陶潜《止酒》，赠别弟辙，渡海；辙次韵。与弟辙相伴一月中，尝教侄远之诗。","m":6},{"p":"儋州","t":"七月十三日，中书舍人蹇序辰缴蔡肇除太常博士词头，肇改除寺丞。以事涉苏轼、苏辙兄弟。","m":7},{"p":"广州","t":"赴昌化军（儋州）途中。苏轼泊扶胥，闻王古（敏仲）迁袁州。古简来，期于道中相遇，以为不可。有简与古。"},{"p":"惠州","t":"二月庚辰（二十五日），苏辙责授化州别驾、雷州安置。传辙所贬者乃西容州；兄轼与王古（敏仲）简及之。张耒、晁补之亦谪降，秦观自郴州编管移横州编管。"},{"p":"惠州","t":"在归善，将赴昌化军（儋州）。苏轼有《僧伽同行》文。"},{"p":"惠州","t":"或在归善，将赴昌化军（儋州）。与李思纯之子光道别，苏轼作《潜珍阁铭》赠之。尝以手抄《金刚经》置潜珍阁。"},{"p":"梧州","t":"赴昌化军（儋州）途中。苏轼至梧州，闻弟辙尚在藤州，即意追及，作诗示之。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼步月郊行，作《和陶赴假江陵夜行》"},{"p":"儋州","t":"在宜伦，任琼州别驾。军使张中到任，出张逢简，苏轼答逢简。张中为修所僦居之伦江驿馆。"},{"p":"儋州","t":"在宜伦，任琼州别驾。所寓堂后月季再生，苏辙与子远同赋。兄轼、侄过次韵。"}],"1098":[{"p":"儋州","t":"在宜伦，任琼州别驾。正月十五日夜，苏轼子过赴儋守张中召。轼有诗。","m":1},{"p":"儋州","t":"在宜伦，任琼州别驾。二月二十日，苏辙六十岁生日，兄轼以沉香山子寄之，作赋。辙和以答之。","m":2},{"p":"儋州","t":"在宜伦，任琼州别驾。三月三日，上巳日，苏轼携酒寻诸生，独符林在，作诗。","m":3},{"p":"儋州","t":"二月丙申（十七日），诏差河北路转运副使吕升卿、提举荆湖南路常平董必并充广南西、东路察访。三月癸丑（初四日），诏吕升卿差充广南西路察访指挥更不施行。以曾布奏升卿与苏轼、苏辙有切骨之仇，不可遣，乃罢。三月丙辰（初七日），董必由广南东路察访改西路。","m":3},{"p":"儋州","t":"在宜伦，任琼州别驾。三月十五日，苏轼作《众妙堂记》，应何德顺之请也。","m":3},{"p":"儋州","t":"在宜伦，任琼州别驾。三月二十日，闻柳子文（仲远）卒，苏轼为祭之。","m":3},{"p":"儋州","t":"在宜伦，任琼州别驾。六月，苏轼有《广利王召》文。","m":6},{"p":"儋州","t":"在宜伦，任琼州别驾。是月，与进士何旻游城西，苏轼作《处子再生》","m":10},{"p":"儋州","t":"在宜伦，任琼州别驾。除夕，苏轼访吴复古（子野），食烧芋。有诗。","m":12},{"p":"琼山","t":"在琼山，任琼州别驾。传苏轼尝游紫霞洞，赋诗。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼次韵弟辙《浴罢》韵。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏辙第四孙斗老生，轼贺以诗。斗老乃适之子，轼喜适之才类己，尝与之论政事。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼作《和陶使都经钱溪》"},{"p":"儋州","t":"在宜伦，任琼州别驾。吴复古（子野）书报陆惟忠病亡并葬于河源。苏轼撰惟忠墓志铭。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼和陶潜《归去来兮辞》，邀弟辙同作。"},{"p":"儋州","t":"在宜伦，任琼州别驾。屋成，迁居，苏轼有诗。"},{"p":"儋州","t":"在宜伦，任琼州别驾。十月甲午（初十日），责授昭州别驾、化州安置范祖禹（纯夫）卒。苏轼多简慰其子冲（元长）"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼有史评《荆轲卫生》"}],"1099":[{"p":"儋州","t":"在宜伦，任琼州别驾。立春日（正月十二日），苏轼赋《减字木兰花》","m":1},{"p":"儋州","t":"在宜伦，任琼州别驾。正月十三日，广州舶信到，得柴胡等药，苏轼书杜甫之诗及柴胡者，并录卢仝诗。盖以遣懑。","m":1},{"p":"儋州","t":"二月己卯（初六日），程之邵以都大管勾陕西路茶马公事放罢，以为御史邓棐所论。以事涉苏轼、苏辙兄弟也。","m":2},{"p":"儋州","t":"在宜伦，任琼州别驾。二月丙寅（二十四日），苏轼买鲫放于城北沦江之阴。有文叙其事。","m":2},{"p":"儋州","t":"四月丙子（初四日），程节等坐不觉察昌化军使张中周恤苏轼而降授，以董必之奏也。张中贬雷州监司。","m":4},{"p":"儋州","t":"在宜伦，任琼州别驾。四月十五日，苏轼作《十八大阿罗汉颂》。颂缘蜀金水张氏之画而作。","m":4},{"p":"儋州","t":"在宜伦，任琼州别驾。五月五日，苏轼记艾人着灸法。","m":5},{"p":"儋州","t":"在宜伦，任琼州别驾。五月十六日，苏轼书赠游浙僧，嘱到杭后谒元净（辩才）遗像，致意法颖。","m":5},{"p":"儋州","t":"在宜伦，任琼州别驾。五月，苏轼记益智（一种植物）","m":5},{"p":"儋州","t":"在宜伦，任琼州别驾。五月，苏轼作《马眼糯说》","m":5},{"p":"儋州","t":"在宜伦，任琼州别驾。十月十五日，苏轼与姜唐佐（君弼）简，约来饮茶，并谓来早必如诺赴唐佐处早饭。","m":10},{"p":"儋州","t":"在宜伦，任琼州别驾。冬至（十一月初八日），符林、吴翁及诸生携具来饮，子过赋诗怀惠、许二兄，苏轼次韵。","m":11},{"p":"儋州","t":"在宜伦，任琼州别驾。二月二十日，苏辙生日，兄轼以诗及黄子木杖为寿，辙次韵。"},{"p":"儋州","t":"在宜伦，任琼州别驾。春，苏轼赋《踏青游》第九册（词集）第840-841页所示及依据。）"},{"p":"儋州","t":"在宜伦，任琼州别驾。春日，尝独行遍至黎子云、黎威、黎徽、黎先觉之舍，遇符林，黎家儿童口吹葱叶迎送；又尝负大瓢行歌田间，与老妪共语：苏轼有诗。"},{"p":"儋州","t":"在宜伦，任琼州别驾。春末，苏轼作《记松》"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼作《倦夜》诗。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼与范冲（元长）简，续慰其父祖禹之逝。"}],"1100":[{"p":"儋州","t":"在宜伦，任琼州别驾。正月六日，读《后汉书·世祖本纪》，苏轼撰《金谷说》论培植五谷须讲求“卫生之方”。","m":1},{"p":"儋州","t":"在宜伦，任琼州别驾。正月十二日，天门冬酒熟，且漉且尝，大醉，苏轼作诗。同日，哲宗卒，徽宗即位。","m":1},{"p":"儋州","t":"在宜伦，将赴廉州。五月，临行，苏轼留别黎子云（民表）诗，并求新酿一具理。","m":5},{"p":"雷州","t":"六月二十五日，苏轼与秦观别。观自作挽词。","m":6},{"p":"广州","t":"或在南海，赴永州途中。苏轼作《东莞资福堂老柏再生赞》","m":10},{"p":"英州","t":"在真阳，赴永州途中。冯祖仁、南华明老分别自曲江、曹溪遣专人来迎，苏轼答简。"},{"p":"清远","t":"或在清远，赴永州途中。孙鼛（叔静）、谢举廉（民师）报将有玉局观之除，苏轼答简以为厚幸。"},{"p":"广州","t":"赴永州途中。将抵广州，转运使摄知广州事程怀立专使来迎，轼简谢。"},{"p":"广州","t":"赴永州途中。将离广州，苏轼与程怀立简，以新州巢谷旅殡修治、谨护为托。先是闻谷卒，使人呼其子蒙来迎丧，更资其归葬，至广州后，尝言于王进叔。至是复言于怀立，以须其子之至。简别谢举廉（民师）"},{"p":"广州","t":"在南海，赴永州途中。苏轼离广州，孙鼛（叔静）与其子拏舟相送，饯别金刹崇福寺。与李之仪（端叔）、鼛简。"},{"p":"梧州","t":"赴永州途中。抵梧州，范冲（元长）已去，子迈、迨亦未至，贺江水干无舟，苏轼乃改道经广州北归，报冲简；复悼秦观之逝。"},{"p":"藤县江月楼","t":"在镡津，赴永州途中。苏轼书秦观自作挽词后。"},{"p":"容县","t":"赴永州途中。过容南。苏轼与范冲（元长）简，约会于梧州；留梧待惠州人至同溯贺江；时传有移黄之命；悼冲岳父秦观之逝。约为九月十日以前事。"},{"p":"儋州","t":"在宜伦，任琼州别驾。张逢升迁，苏轼致简为贺。"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼作《安期生》诗。（并引）"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼尝作《浊醪有妙理赋》赋，作《志林·论武王》等篇，作《续养生论》《志林·论武王》《志林·论养士》《志林·论秦》《志林·论鲁隐公》《志林·论鲁隐公里克李斯郑小同王允之》《志林·论管仲》《志林·论孔子》《志林·论周东迁》《志林·论范蠡》《志林·论伍子胥》《志林·"},{"p":"儋州","t":"在宜伦，任琼州别驾。苏轼记杭州延寿禅师放生事。"},{"p":"儋州","t":"在宜伦，将赴廉州。苏轼别海南父老赋诗，抒依恋之情，尝有终焉之志。"}],"1101":[{"p":"虔州","t":"二月二十八日，王箴（元直）自蜀远道来访，卒于夔州途中。","m":2},{"p":"太平州","t":"苏轼抵当涂。四月二十四日，郭祥正（功甫）来访轼，呈诗。","m":4},{"p":"太平州","t":"四月二十八日，李仲琬（德华）卒。苏轼尝赞其夫董文和（景仁）为古君子。","m":4},{"p":"真州","t":"在扬子，北归途中。六月，苏轼有《与外生柳闳一首》","m":6},{"p":"常州","t":"七月丁亥（二十八日），苏轼卒。卒前思弟辙。诸子、维琳、钱世雄在侧。遗言葬汝州。","m":7},{"p":"润州","t":"在丹徒，北归途中。命子过往吊苏颂（子容）之逝，苏轼并作功德疏。次日，颂外孙李（左“伸”右“攵”）（季常）及颂诸孙来谢。"},{"p":"润州","t":"在丹徒，北归途中。在金山作水陆，邀米黻，黻以足疾不能至，作诗寄苏轼。《醮上帝青词》约作于此时。"},{"p":"润州","t":"舟赴常州，苏轼坐舱中，千万人随瞻风采。"},{"p":"江州","t":"或在德化，北归途中。晤张兢辰（熙明），苏轼题其永康所居万卷堂，并别山中诸友。"},{"p":"江州","t":"苏轼离庐山，胡洞微负笈相从数百里。"},{"p":"江宁","t":"在江宁，北归途中。得黄寔（师是）寄到弟辙二月二十二日简，苏轼罢居舒州议，决计归许下。欲溯汴至陈留出陆，求舟于程之元（德孺），得之；求挽舟人于寔以济淮汴。欲七月到许下。与钱世雄（济明）、李之仪（端叔）、程之元、黄寔简及其事。时寔为江淮发运副使。李之仪除辇运，轼有简与之。"},{"p":"江宁","t":"北归后，传苏轼尝答人叙迁谪艰苦之因。"},{"p":"江宁","t":"或在江宁，北归途中。杨明（子微）奉其父济甫命自眉山至海外相访，闻苏轼兄弟已北归，乃赴颍昌，并修简致候。答简约七月中见明于颍昌，并以兄弟二人名义谢其父照管坟墓。"},{"p":"真州","t":"在扬子，北归途中。复回真州。苏轼覆弟辙二月二十日简，报将渡江往常州住孙氏宅。此宅乃借得，系出钱世雄（济明）力。与黄寔（师是）简，亦报往常州，并录所作诗呈寔。贺寔除少卿。"},{"p":"真州","t":"将发真州，苏轼别米黻（元章）。既发，乘船赴润州，昏不知人者累日。"},{"p":"虔州","t":"在赣县，北归途中。黄敷言赴广州替谢举廉（民师），苏轼二月间简敷言以未能往别为歉，并附致惠州李念四简。"},{"p":"虔州","t":"在赣县，北归途中。晤父洵之友钟棐（子翼）之子志仁等，苏轼为棐作哀词。"},{"p":"虔州","t":"在赣县，北归途中。苏轼与李之仪（端叔）简。与李廌（方叔）简，丧范祖禹、秦观之逝。与黄寔简叙及闻章惇贬雷州。"}]},"readings":{"352295":{"background":"嘉祐四年（1059）秋，苏轼兄弟为母亲守丧期满。十月，父子三人离开眉山，坐船沿长江东下，过三峡，在江陵过年。1060年正月改走陆路北上，经过荆门去汴京。这是苏轼第二次离蜀，前路是做官，身后是故乡。词里没有写给谁，不像是应酬之作，更像旅途中独自写下的。","mood":"上片写黄昏的山色、静水和寒林里的鸦啼，景色清冷，没有一个人。下片直接说梦里回乡、酒醒后家乡远在天边。二十五岁的苏轼刚走上仕途，心里应当有抱负，可这首词只写离家的空落。母亲去世不久，他又把母亲的坟留在了眉山，这份思乡里也许有更重的东西，不过词里没有明说。","lines":[{"line":"远林屋散尚啼鸦","note":"远处的林子里只有零星几户人家，天快黑了还有乌鸦在叫。旅人此时还在路上，没有落脚的地方，这句的孤单感最浓。"},{"line":"梦到故园多少路，酒醒南望隔天涯","note":"梦里回乡好像不远，醒来才知道隔着天涯。他借酒想把思乡压下去，结果醒来更清楚自己离家有多远。"},{"line":"月明千里照平沙","note":"他把情绪收进一片月光，不再往下说。同一个月亮照着旅途也照着故乡，思念没有说破，余味很长。"}],"moods":["思乡","羁旅"],"caveat":"这首词的作者和编年都有疑问。有的本子把它列为存疑之作，定在1060年过荆门也是后人推测。词里的“湘川”指湖南一带，和荆门的地理不太对得上，所以背景只能作参考。"},"352236":{"background":"治平元年（1064）年底，苏轼在凤翔府签书判官任上三年期满，卸任回汴京，途中经过临潼，登骊山，游览唐代华清宫的旧址。年谱记载他这次游骊山写过诗，这首词大概也写于同一次游览。词题“感旧”说明这是凭吊古迹、有感而作，没有赠送的对象。当时他二十九岁，刚当了一任地方官，第一次亲眼看到了唐玄宗和杨贵妃当年游乐的地方。","mood":"上片写唐玄宗当年的排场，下片写现在的冷落，主要是盛衰无常的感慨。他在凤翔见过扶风驿舍里穷人哭诉，也上书讨论过衙前役给百姓造成的负担，所以在骊山想到前朝因奢靡而败落，心情不只是怀古，多半也带着对治乱的思考。不过词里只是摆出前后对比，没有说破，语气克制，和他后来那种放开胸怀的旷达还不一样。","lines":[{"line":"五家车马如水，珠玑满路旁。","note":"“五家”指杨国忠和杨氏姐妹几家。车马不断，珠宝掉了满路，写出外戚得宠时的豪奢，也暗暗交代了后来祸乱的根源。"},{"line":"翠华一去掩方床。","note":"皇帝的仪仗一走，殿里的床榻就被遮盖起来，再也没人用了。一句话把盛况收束成空寂，转折很突然，冷清的感觉也就格外明显。"},{"line":"至今清夜月，依前过缭墙。","note":"只有月亮还像从前一样照过宫墙。用不变的自然对照已经消失的繁华，感慨藏在平静的景物里，有人认为是化用了刘禹锡《石头城》的写法。"}],"moods":["感时","伤逝"],"caveat":"这首词的编年是根据苏轼罢凤翔任、回京途中经过骊山推定的，词本身没有写明日期；词牌有的版本写作《华胥引》，一般认为《华清引》是对的。"},"352279":{"background":"这首词的写作时间和地点都说不准。年谱把它系在熙宁四年（1071）春，并说苏轼曾经路过洛阳。可是同年记载的其他事都发生在汴京：他在官告院任职，上奏论科举，八月又遭谢景温诬告，之后才请求外放去杭州。他这一年春天是否真去过洛阳，没有可靠的旁证。词的内容很清楚：回忆洛阳一场离别的酒宴，托一位朋友把相思带给在那里结识的女子。","mood":"整首词是温柔的怀念和惋惜：花前烛下的欢聚已经散了，山水相隔，心里的牵挂却放不下。语气含蓄，没有怨气。如果编年可信，此时苏轼正因反对新法被人攻击，处境紧张。但词里完全看不出政事，只写私人感情。不宜把它硬读成政治寄托，它更像忙乱的仕途中一段柔软的私人记忆。","lines":[{"line":"烛下花前，曾醉离歌宴。","note":"想起分别那晚，花前点着烛，听着送别的歌喝醉了。一个“曾”字说明这已是过去的事，回味里带着怅惘。"},{"line":"关山有限情无限。","note":"关山再远也有个尽头，思念却没有尽头。用有限对无限，把舍不得的心情说得直白又克制。"},{"line":"为说相思，目断西楼燕。","note":"托朋友替自己传达相思，自己只能远望西楼的燕子，望到看不见为止。见不到人，只能借别人传话，这份情意因此显得落寞。"}],"moods":["怀人","艳情"],"caveat":"年谱系于熙宁四年春的洛阳，但这一年苏轼的行迹都在汴京，赴杭州时走的是陈州、颍州一路，经过洛阳之说缺少旁证，所以写作年份和怀念对象都存疑。"},"352036":{"background":"熙宁四年，苏轼反对王安石新法，又遭侍御史谢景温诬奏，说他当年护丧回蜀时贩运私盐。朝廷派人查问，没有查到实据，苏轼仍请求外任，得了杭州通判一职。七月离京后，他先到陈州与弟弟苏辙相聚，再一同到颍州，拜见刚退居那里的老师欧阳修，随后兄弟分别。这首词一般认为写于停留颍州期间，写的是一次在荷花间饮酒听歌的游赏，看不出是为哪个具体的人而写。","mood":"上片写满眼的垂杨和荷花，夕阳照着画楼，景色明亮热闹。下片却转到人心里的寂寞，说时间要靠喝酒来打发。这份寂寞有它的来由：苏轼刚在朝中被人诬告，自己选择离开，前途还说不准，眼下又要和弟弟分手南下。这些他都没有直说，只用一个“且来”轻轻带过。表面看很闲适，底下是失意后的自我排解。","lines":[{"line":"天气乍凉人寂寞","note":"初秋天气刚转凉，身边虽然热闹，心里却冷清。这种孤单既来自季节，也和被迫离京、即将与弟弟分别的处境有关。"},{"line":"光阴须得酒消磨","note":"日子长得要靠酒来打发，说明他此时没有施展的机会、心里也空。话说得平淡，透出一点无可奈何。"},{"line":"且来花里听笙歌","note":"“且”是姑且的意思。暂时放下烦恼，到花间听听音乐，这是在宽慰自己，并不是真的把事情忘了。"}],"moods":["闲适","羁旅"],"caveat":"这首词的编年并不确定：有注本把它系于熙宁四年途经颍州时，也有人认为写的是杭州西湖，应当作于通判杭州期间。"},"351984":{"background":"熙宁四年，王安石正推行新法，苏轼多次上书反对，又因叶祖洽殿试名次一事与朝廷意见相左。八月，谢景温诬奏他护丧回蜀时乘船贩运私盐，朝廷派人追查，没有查出实据，但苏轼已难在京城立足，于是自请外任，出为杭州通判。这首词作于南下赴任、途经苏州时。从词意看，大约写于一场有歌伎劝酒的宴席之后，具体为谁而作，史料没有交代。","mood":"上片写醉中情景：有人搀扶着，恍惚间像走进了壶中仙境，快活里带着几分迷离。下片一转，眼前是连到天边的枯草和通往远方的路。他想起范蠡功成之后驾一叶小舟泛游五湖，便问自己能不能也就此一走了之。这种退隐的念头和他刚在朝中遭人诬陷、被迫离京的处境分不开。表面看是酒后的闲情，底下是对官场的厌倦和一点无可奈何。","lines":[{"line":"误入仙家碧玉壶","note":"用壶公“壶中别有天地”的传说，说自己醉后被人扶着，好像误闯进了仙境。“误入”二字透出暂时离开尘世、不去管前程的轻松。"},{"line":"连天衰草","note":"酒醒后看到的景象：深秋的枯草一直铺到天边。这和上片的好风月形成对照，旅途的萧瑟和前路的茫然一下子涌了上来。"},{"line":"便逐鸱夷去得无","note":"鸱夷子皮是范蠡离开越国后用的化名。苏轼借他发问：我能不能也就这样随他而去？这一问半是认真，半是自我宽解。"}],"moods":["羁旅","旷达"],"caveat":"作年作地主要依据年谱和词中“姑苏”“衰草”推定，旁证不多。“下走”“湖南西去道”的确切含义也有不同理解，比如“下走”可能是谦称自己，宜存疑。"},"352238":{"background":"熙宁四年，苏轼反对王安石新法，又被谢景温诬告借护丧之便贩卖私盐。朝廷派人查了，没有查到实据，但他已难在京城立足，于是请求外放，出任杭州通判。赴任途中他经过扬州，在知州钱公辅的宴席上与刘攽、孙洙、刘挚等同道相聚。词里写画堂夜宴上歌女含泪唱歌，可能是这类宴席上的即席之作。究竟为谁而写，史料没有记载。","mood":"这首词表面上只写一位歌女：寒夜里灯快燃尽，她的泪擦了又流，酒没喝完就先掩面，歌声里透着凄清。苏轼始终没有写到自己，只是在旁边看、在旁边体会。当时他刚被挤出朝廷，席上几位朋友也大多因为政见不合而离京，聚会本身就带着离别的意味。把歌女的悲泣理解成他心中郁结的投影，说得通，但这只是推想，词里没有直接说出来。","lines":[{"line":"青花挑欲尽，粉泪裛还垂","note":"灯花一再挑剪，快要燃尽，她的泪沾湿了脂粉，却还在往下流。夜已经很深，伤心还没有停。"},{"line":"未尽一尊先掩泪","note":"一杯酒还没喝完，人已经先掩面落泪。宴席上的热闹压不住积在心里的难过，也让人猜想这或许是一场离别的筵席。"},{"line":"欲知肠断处，梁上暗尘飞","note":"借用古代歌者虞公歌声清哀、震落梁上灰尘的典故，说最叫人断肠的就在她的歌声里，全词的悲伤落在这一声唱上。"}],"moods":["艳情"],"caveat":"年谱里没有提到这首词，把它系于熙宁四年扬州只是推定。苏轼过扬州大约在初冬，与词中“冰合井”的严寒景象是否吻合也难以确定。"},"351967":{"background":"熙宁六年（1073）寒食，苏轼三十八岁，任杭州通判已近两年。他是因为与王安石新法意见不合，才主动请求外放到杭州的。这天天还没亮，他就按公务安排来到西湖边。知州沈立还没到，钱塘、仁和两县的县令已经先到了。这首词就是记下这场官府湖上活动开始前的情景。这天具体是什么事由，题目里没有交代，没法确知。","mood":"前六句写湖上的热闹：船挤满了湖，鼓乐准备停当，下属早早到场，排场讲究。最后两句笔锋一转，说自己又老又病，春天里只想睡觉，于是找了间僧房去躺一会儿。三十八岁就自称老病，带着自嘲的意思。他对官场上的迎来送往并不起劲，和他在新法下做副职、做不成事的处境是相通的。","lines":[{"line":"鼓吹未容迎五马，水云先已漾双凫。","note":"“五马”指太守，“双凫”借汉代王乔的典故指县令。太守还没到，鼓乐没法奏响，两位县令却已经先到湖上，笔调里带着一点轻轻的调侃。"},{"line":"映山黄帽螭头舫，夹岸青烟鹊尾炉。","note":"船夫戴着黄帽，画舫雕着螭头，两岸香炉冒着青烟。场面写得很细，好像他是站在旁边看，自己没有融进这份热闹。"},{"line":"老病逢春只思睡，独求僧榻寄须臾。","note":"他说自己老病，只想睡，一个人去借僧房的床躺一会儿。这是在官场排场里给自己找个清静，有疲倦，也有自嘲。"}],"moods":["自嘲","闲适"],"caveat":"一般系于熙宁六年寒食，两位县令通常认为是钱塘、仁和县令，但姓名和这次活动的具体事由都不清楚。"},"352066":{"background":"熙宁四年（1071），苏轼与王安石在新法问题上意见不合，自请离开京城，出任杭州通判。在杭州任上，他到了湖州，结识了当地文人贾收（字耘老）。贾收没有做官，但苏轼很看重他的诗才，评有美堂诗时曾把他列为第一。这首词写给贾收家中一个名叫双荷叶的年轻侍女，是朋友交往中的赠作，从她的名字生发出来。","mood":"整首词围绕“双”字和“荷叶”做文字游戏，语气轻快，带点调笑。其中也有对这个年少女孩的怜惜，词里把她比作秋天还没到就被采下的荷叶。笔调轻松，和苏轼当时的处境有关：他离开了朝中的争执，来到江南，公务之余和地方文士往来唱和，心情暂时舒展开来。不过这本是酒席边的赠作，不必从中读出深刻的政治寓意。","lines":[{"line":"红心未偶，绿衣偷结。","note":"借荷花、荷叶写少女：花心还没有成对，绿叶却已悄悄长在一起，暗示她年纪尚小就已有所归属，语带调侃。"},{"line":"轻舟短棹先秋折。","note":"荷叶不等秋天就被划船的人采走了，比喻她还没长大就进了贾家，轻快的语调里带着一点惋惜。"},{"line":"烟鬟未上，玉杯微缺。","note":"头发还没梳成成年女子的发髻，说明她还很年少。“玉杯微缺”的具体含义，历来说法不一，大意是完美中带一点小小的缺憾。"}],"moods":["咏物","艳情"],"caveat":"这首词的系年各家说法不完全一致，双荷叶的身份也有“小妓”和“侍妾”两种说法；“玉杯微缺”一句没有定解。"},"351969":{"background":"熙宁年间苏轼因反对新法，自请外任，来杭州做通判。钱塘江潮每年八月最盛，官民都去江边看潮，还有弄潮儿踏浪表演。这首词借江边弄潮少年的口吻来写，写的是一次观潮宴集的热闹场面。词里的“使君”指杭州知州，这一年正值沈立离任、陈襄接任，具体指哪一位已无法确定。这首词应是席间应景之作，供人传唱助兴。","mood":"全词轻快活泼，几乎看不到政治失意的影子。苏轼让弄潮少年自己开口，笑官员喝醉，唱迎神的歌，最后又说要在酒席上唱太守的诗，官民同乐的气氛很浓。在朝廷里受挫以后，杭州的山水和民俗给了他不少宽解。这首词能看出他投入地方生活的那份兴致，也带着一点拿自己这些酒醉官员打趣的味道。","lines":[{"line":"侬是江南踏浪儿。","note":"“侬”是吴地方言里的“我”。苏轼不以官员身份说话，而是替弄潮少年自报家门，语气爽快，透出对当地民风的喜爱。"},{"line":"拍手欲嘲山简醉，齐声争唱浪婆词。","note":"山简是晋代爱喝酒的地方长官。少年们拍手笑话醉醺醺的官员，又齐声唱祭潮神的歌。官员也是被笑的一方，有几分自嘲。"},{"line":"侬欲送潮歌底曲，尊前还唱使君诗。","note":"潮水退了，送潮该唱什么歌？就在酒席前唱太守的诗吧。以宴乐收尾，写出官民同乐的场面，也是对在座长官的客气恭维。"}],"moods":["闲适","自嘲"],"caveat":"这首词的编年各家说法不一，有熙宁五年、六年两说；“使君”究竟指沈立还是陈襄，也无定论。"},"351970":{"background":"熙宁四年，苏轼因反对王安石新法，自请离京，出任杭州通判。通判公务杂，常要到属县办事，富阳一带他这两年去过不止一次。风水洞在杭州去富阳的路上，以洞穴和泉石出名。据年谱，这年八月他是第二次来游，写下了这首词。词没有赠给谁，应是游览时随手写来自娱的。同月知州沈立离任，但没有材料说明此词与这件事有关。","mood":"开头借佛家“四大”的说法打趣：风和水本来到处都有，这里叫“风水洞”又有什么稀奇。接着又说，这洞大概是专门来催我作诗的。中间写幽花和寒藻，又借卢仝饮茶“两腋生风”的典故，说自己清爽自在，用不着羡慕神仙。最后写到日落、露水打湿衣裳，玩够了才回去。苏轼在朝中失意，外放后常从山水和禅理里找宽解，这首词的轻快就和这种心态相合。不过词里几乎看不到苦闷，更像是一次真正放松的出游。","lines":[{"line":"四大从来都遍满，此间风水何疑。","note":"佛家说地、水、火、风四大充满世间，风和水本是平常东西。他拿洞名开玩笑，带出一种随缘看待万物的态度。"},{"line":"借与玉川生两腋，天仙未必相思。","note":"用卢仝饮茶后两腋生清风的典故，说洞里凉风叫人浑身清爽，自觉满足，不必羡慕神仙。这句的确切意思，注家理解不一。"},{"line":"层巅馀落日，草露已沾衣。","note":"山顶只剩夕阳，草上的露水已经打湿衣裳。不知不觉玩到天晚，既尽了兴，也透出几分秋天的凉意。"}],"moods":["闲适","旷达"],"caveat":"本词按年谱系于熙宁六年八月“再游”时所作，有的注本系年可能不同；“天仙未必相思”一句的具体所指，也有不同解释。"},"351962":{"background":"熙宁六年（1073）初春，苏轼因与新法不合离京外任，在杭州做通判已一年多。年谱只记他出城探春，写了这首词。词前没有序，题目“探春”也可能是后人加的，所以看不出是写给谁，也不清楚有没有同游的人。从词里看，这是一次随兴出游后的记录：头一天出东城去看春天来了没有，回来把眼前所见和心里的盼头写成了词。","mood":"整首词轻快、带着期待：冬天还没完全走，他已经在找春天来过的痕迹，草木还没发芽，他就认定春天回来了。通判是知州的副手，事务繁杂，又远离朝廷的争执，这时他倒能把心思放到山水和节令上。这一年他留在杭州的诗文多半写游赏和交往，这首词也是这种从容的表现，看不出明显的牢骚或感伤。","lines":[{"line":"昨日出东城。试探春情。","note":"一开头就交代这是一次专门出城“打听”春天的小出游，“试探”两个字写出好奇和兴致，像去探望一位还没到的老朋友。"},{"line":"槛内群芳芽未吐，早已回春。","note":"栏杆里的花木还没发芽，他却断定春天已经回来了。这是先于眼睛的感觉，透出他对时节变化很敏感，心里也乐观。"},{"line":"料想春光先到处，吹绽梅英。","note":"用想象收尾：春天最先到的地方，梅花大概已经被吹开了。眼前没看到，心里先看到了，期待落在一个具体的画面上。"}],"moods":["闲适"],"caveat":"这首词没有题序，作于熙宁六年是编年者根据内容推定的，写作场合和有没有同游的人都没有记载；有学者怀疑它是否真出自苏轼之手，本文按通行的说法处理。"},"352274":{"background":"这首词的写作缘由，现有材料说不清。年谱把它系在熙宁六年（1073）十月，苏轼当时在杭州任通判，但没有记载为谁而写、因什么事而写。从内容看，它写的是一年一度的赏花：清明、谷雨时节守着花开，一夜之间花被剪下，摆上酒席。前一年春天，他刚陪知州沈立在吉祥寺看过牡丹，还为沈立的《牡丹记》写了序。这首词可能出自类似的宴饮场合，但不能确定。","mood":"词的情绪从盼到伤。上片写他一次次去看花开了没有，比蜂和莺还殷勤。下片写花刚开好就被剪下，他在酒席上对着这些花落泪。他用“白发卢郎”自比，说自己年纪不小了，痴心却没减。这时他三十多岁，在杭州任副职，没多少实权，常把心思寄托在山水花事上。对花开花谢这么敏感，多少带着他对时光流逝、身不由己的感触。","lines":[{"line":"白发卢郎情未已。","note":"借用老来娶妻的卢郎的典故，自嘲年纪大了还对花这样痴情，语气半是自嘲，半是认真。"},{"line":"尊前还对断肠红，人有泪","note":"剪下的花摆在酒席上，看着还很艳丽，可在他眼里，花已经离了枝，所以热闹之中他反倒落泪。"},{"line":"明日酒醒应满地。","note":"想到明天酒醒，这些花就落满一地，眼前的欢宴也就到头了，惋惜里带着一点无可奈何。"}],"moods":["咏物","感时"],"caveat":"年谱系于熙宁六年十月，但词里写的是清明、谷雨时的春花，季节对不上，编年存疑。词的写作对象和具体场合也没有可靠记载。"},"351965":{"background":"熙宁六年（1073）春，三十八岁的苏轼在杭州做通判。他与新法不合，自请外任，到杭州已是第三个年头。这首词是他坐船沿富春江往上游走、经过七里滩时写的。七里滩在今浙江桐庐一带，岸边有东汉隐士严光（字子陵）的钓台。年谱推测，这趟出行是去婺州看望老友苏颂；也有人认为是到属县公干。这首词没有写给哪个人，是路过名胜时随手写下的。","mood":"上片只写行船看景，轻快、清爽。船到严光钓台附近，他想起这段旧事，心思才转到功名上：当皇帝的和不肯做官的，如今都成了过去，只剩一个名字。这份看淡和他当时的处境有关。他离开朝廷，做的是地方副职，抱负施展不开，却也不用卷进京城的是非。于是他把仕途上的不得意，化成“名声终归是空”的自我宽解。不过结尾又回到山色上，说明他并没有沉在失落里。","lines":[{"line":"算当年、虚老严陵。","note":"严光当年推掉官职，在这里钓鱼到老。苏轼说他“白白老去”，语气半是惋惜半是调侃，其实也在掂量自己要不要做官。"},{"line":"君臣一梦，今古空名。","note":"刘秀和严光，一个当皇帝，一个当隐士，到头来都像一场梦。苏轼由此推到古今所有名声，借这个想法放下自己仕途上的得失。"},{"line":"但远山长，云山乱，晓山青。","note":"议论到这里就停了，他把目光转回眼前的山：远处连绵，云里错落，天亮时一片青色。人事会消失，山还在，他心里也安稳了下来。"}],"moods":["旷达","闲适"],"caveat":"写作时间和出行目的有不同说法：通行说法是熙宁六年二月行经七里滩，年谱则把这首词系在往婺州探访苏颂的途中，此行是否真到了婺州，现有材料还不能确定。"},"351966":{"background":"熙宁六年，苏轼在杭州任通判。这期间他曾去婺州看望在那里做知州的苏颂，年谱把这首词放在这趟行程里。“还过钓台路”说明词写在回程上。钓台是东汉严光隐居钓鱼的地方，在富春江上游的桐庐、睦州一带，苏轼正坐船顺江回杭州。词里想念的是谁，史料没有记载。从“襄王”“云雨”这类说法看，大概是途中宴席上认识的一位女子，但这只是推测。","mood":"他前一晚喝多了，身体不舒服，人也没精神，靠在枕头上听着摇橹的声音。回头看，来时的城已经被重重云山和烟树挡住了。离别的惆怅是真实的，但他自己也明白，这段情缘既谈不上有过什么，也说不上有什么将来。这时苏轼在杭州的日子还算从容，到处游览，宴饮也多。这首词写的是一路上转瞬即过的私人心事，看不出政治上的失意。","lines":[{"line":"回首望、孤城何处","note":"船越走越远，回头已经找不到那座城，也就是那个人所在的地方。人离开了，心思还留在那里。"},{"line":"旧恨前欢，心事两无据","note":"以前的遗憾，先前的欢聚，回头想想都抓不住，连自己究竟在惦记什么都说不清楚。"},{"line":"痴心犹自，倩人道、一声传语","note":"明知道再见不到了，还是放不下，只想托人捎一句话过去。他也看出自己这份痴心有点可笑。"}],"moods":["怀人","羁旅"],"caveat":"年谱把这首词系于熙宁六年往返婺州途中，主要根据是词中提到“钓台”这个地名。词中怀念的是谁，史书没有明确记载。"},"351971":{"background":"熙宁六年前后，苏轼因与主持新法的当政者意见不合，请求外放，在杭州任通判，职务是协助知州处理州务。年谱只记下这一年他写了《菩萨蛮》，没有说明为谁、在哪次宴会上写。从内容看，这是一首席间听歌的即兴之作：一位歌妓卷帘出场，在灯下演唱，苏轼当场写词相赠。她的名字和那次宴会的主人都没有可靠记载，不宜推测。","mood":"整首词写的是听歌时被打动的一瞬。歌妓唱得哀怨，眉间带着春愁，苏轼却说不必再唱得这样凄切，因为自己已经先伤心了。这份伤感不全是在应和歌声。他刚过而立之年，从朝廷外放到地方，在官场宴饮里迎来送往，心里有郁结，被一段悲歌勾了出来。不过这首词仍以写歌者为主，不宜把它读成直接诉说身世。","lines":[{"line":"春愁入翠蛾","note":"歌声里的愁绪浮上了歌者的眉头。苏轼看到的不只是她容貌美，还有她唱歌时动了真情。"},{"line":"凄音休怨乱","note":"劝她别再唱这样悲怨缠绵的调子。这是席间对歌者的体贴，也透露出听的人已经受不住了。"},{"line":"我已先肠断","note":"一句话把听歌的人自己写了进去：她还没唱完，我已经先伤心了。可以读作外放生活中积下的心绪被歌声触动。"}],"moods":["艳情"],"caveat":"这首词的具体写作年份和赠送对象都没有确切记载，年谱定在熙宁六年杭州，只是一种编年；题目“歌妓”也可能是后人所加。"},"351979":{"background":"熙宁六年（1073），苏轼因与新法不合，自请外放，在杭州任通判。词前小序交代了来由：友人陈直方的侍妾嵇氏是钱塘人，向他求一首新词，于是写了这首。词中“悯新鳏”一句说明，陈直方新近丧妻。所以这首词既是应歌女之请填写的唱词，也带着对友人丧偶的体贴。至于陈直方的生平，现有材料记载很少。","mood":"上片写嵇氏住在凤凰山下，门外有人勒马看她起舞，笔调轻快。下片转到她陪伴新近丧妻的陈直方，替他擦去余泪。苏轼此时在杭州公务不重，与当地士人往来频繁，常应人之请作诗填词。这首词写得温和体贴，没有自伤身世的意思。他把自己熟悉的钱塘“陌上花”歌谣化进词里，借来安慰朋友。","lines":[{"line":"门外行人，立马看弓弯","note":"“弓弯”是舞姿。路过的人勒住马看她跳舞，从旁人的目光侧面写出嵇氏的美貌和技艺。"},{"line":"悯新鳏。拭馀潸。","note":"陈直方刚刚丧妻，嵇氏怜惜他，替他擦去残留的泪水。这一句点出写词的真实背景，语气克制而体贴。"},{"line":"陌上花开看尽也，闻旧曲，破朱颜","note":"化用吴越王“陌上花开，可缓缓归矣”的典故。春花已经看尽，再听到熟悉的旧曲，她脸上的神情起了变化。“破颜”常指露出笑容，这里也可能理解为伤感动容。"}],"moods":["艳情","伤逝"],"caveat":"本篇编年主要依据小序和杭州地名，学界也有系于熙宁七年的说法。陈直方的身份和生平记载不详；“破朱颜”是破涕为笑还是伤感动容，注家理解不一。"},"351980":{"background":"熙宁六年前后，苏轼在杭州任通判，公务之余常游西湖。这一天同游的是年过八十的老词人张先。雨后两人在湖上，忽然听到水面传来筝声，便以此为题各写一首。据南宋张邦基《墨庄漫录》记载，弹筝的是一位三十多岁的妇人。她说自己早年就仰慕苏轼，特意驾船前来弹曲求词，苏轼当场写下了这一首。","mood":"上片写雨后湖光，调子轻快。下片转入哀怨的筝声，结尾人去峰青，留下淡淡的怅惘。这份情绪并不沉重。苏轼因政见不合离开朝廷，心里的郁结未必消散，但西湖山水、诗友往来和这样偶然的相遇，让他能把心事化成余韵。词里的“哀”，主要是乐声和相逢转眼就过去的感触，不宜硬读成政治上的寄托。","lines":[{"line":"一朵芙蕖，开过尚盈盈。","note":"字面写湖中的晚荷，也暗指弹筝妇人青春已过、风韵还在。语气是欣赏和体贴，并不轻佻。"},{"line":"忽闻江上弄哀筝。","note":"筝声突然打破湖上的宁静，一个“哀”字定下下片的基调。弹的人好像有心事，听的人也被牵动。"},{"line":"人不见，数峰青。","note":"借用钱起写湘灵鼓瑟的名句：曲终船去，只剩青山。相逢短暂、留不住的惆怅都在这里。"}],"moods":["闲适","艳情"],"caveat":"编年一般定在熙宁五至七年杭州任上，具体年份难以确定；献筝求词一事只见于笔记《墨庄漫录》，书中只说座中有两位客人，没有点明张先，只能聊备一说。"},"352278":{"background":"熙宁六年暮春，苏轼在杭州任通判。这一年他因不赞成新法离京外任，已到杭州第三个年头。年谱只记下“暮春有《占春芳》词”，没有说是为谁写的、在什么场合写的。同一个春天，他陪知州沈立到吉祥寺看牡丹，又给沈立编的《牡丹记》写了序，可见当时杭州官员中赏花、宴饮的风气很浓。这首词很可能出自这类花前酒边的场合，但具体吟咏的是什么花、写给谁，现有材料都无法确定。","mood":"词里写的是一种开在桃杏之后的花：繁花已经谢了，它才独自开放，香气出自本身，用不着借助脂粉香料。整首词的语气轻快，带着酒兴，只在结尾担心笛声把花吹落，透出一点惜春的意思。这时苏轼刚到中年，外放的郁闷还在，但杭州的山水和同僚之间的往来让他过得比较舒展。夸赞这种花不随众、自有本色，或许也寄托了他对自己的期许，不过词里并没有直接说出来。","lines":[{"line":"红杏了，夭桃尽，独自占春芳。","note":"桃花杏花都谢了，这种花才开，独自占住暮春。字面上是在夸花，也让人感到一种不赶热闹、在冷清时才露面的姿态。"},{"line":"不比人间兰麝，自然透骨生香。","note":"兰、麝都是熏衣用的香料，这句用来对比。花香是从里面透出来的，不靠外物修饰，看重的是天然本色，这也合乎苏轼一贯的审美。"},{"line":"只忧长笛吹花落，除是宁王。","note":"古代笛曲有《梅花落》，诗文里常说笛声能把花吹落。宁王是唐玄宗的哥哥李宪，擅长吹笛。这句大意是：怕笛声催落花，除非吹笛的是宁王这样的人。在酒席上说出来，带着玩笑的味道，也含着惜花的心意。"}],"moods":["咏物","闲适"],"caveat":"这首词写的究竟是什么花（有人认为是梨花或其他晚春的花），各家说法不一，结句里“宁王”指什么也有不同解释；编年只依据年谱的“暮春”二字，没有其他旁证，写作对象和场合都不清楚。"},"352259":{"background":"熙宁六年冬，苏轼以杭州通判的身份奉命到常州、润州一带赈济灾民，年底还在路上。除夕他住在常州城外，正月初一到了丹阳，是一个人在外地过的年。词题“得书”，说的是这时收到一封书信。从“回纹”这个典故看，写信的应是一位女子，一般认为是家中的妻子王闰之。新年第一天收到家书，他就写了这首小词。","mood":"整首词写的是收到信后的喜悦，又带着离家的冷清。新年本该一家团聚，他却在外面奔波公务，所以抱怨喜鹊没来报信，又羡慕梅花先知道春天来了。一封信反复读，看得出他心里多么挂念家人。这里没有政治上的牢骚，只是一个中年人在旅途中过年，对家的想念。","lines":[{"line":"不会鹊声来报喜。","note":"民间说喜鹊叫是好消息要到。他抱怨喜鹊不懂事，信到了也没先叫一声，嗔怪里带着意外的惊喜。"},{"line":"写尽回纹机上意。","note":"借前秦苏蕙织回文锦寄给丈夫的故事，说信虽然只有一张纸，却写尽了家人的牵挂和情意。"},{"line":"读遍千回与万回。","note":"刚卷起又打开，读了一遍又一遍。在外过年的孤单和对家人的想念，都在这个反复读信的动作里。"}],"moods":["怀人","羁旅"],"caveat":"写信人是谁，词中没有明说。说是妻子王闰之，是根据“回纹”典故推测的。也有人认为这是替女子代言或写给歌妓的作品，目前没有定论。"},"351973":{"background":"熙宁六年冬，苏轼以杭州通判的身份，奉命到常州、润州一带赈济灾荒。除夕他是在常州城外度过的，新年正月仍在润州属县丹阳办事。这时他离开杭州已近两个月，又到了立春时节，想起一年前的正月，知州陈襄（字述古）邀刚病愈的他到城外寻春。陈襄是他的上司，也是他在杭州诗酒往来最多的朋友。这首词是苏轼在差旅途中寄给陈襄的。","mood":"词里是一种淡淡的、却放不下的思念。苏轼年节时独自在外办理赈灾公务，身边没有熟人。和陈襄同游西湖、随处题诗的那段日子，回想起来就格外亲切。他不直接说自己想念杭州，而是说西湖的月、江边的柳、山头的云在惦记他，这样把想回去的心思说得很含蓄。他想念的既是朋友，也是杭州那种还算从容的日子。","lines":[{"line":"故人不见，旧曲重闻。","note":"同游的人不在身边，当时唱过的曲子却又听到了。苏轼从回忆转回眼前，一个人在异乡，有种物是人非的失落。"},{"line":"别来相忆，知是何人。","note":"分别以后还有谁在想念我？他故意这样问一句，心里盼望的其实是陈襄的回应，也透出客居在外的寂寞。"},{"line":"有湖中月，江边柳，陇头云。","note":"他把思念托付给杭州的湖月、江柳和山云，说是景物在想念他。这样写，含蓄地表达了对陈襄的情谊，也说出了他想回杭州的心思。"}],"moods":["怀人","羁旅"],"caveat":"苏轼往常州、润州的事由，是据通行年谱判断为赈济灾荒，词中本身没有提到；“陇头”在辞书中多解作边塞，这里更可能泛指杭州周围的山头；末句有的版本作“知有何人”。"},"352196":{"background":"熙宁六年冬，苏轼以杭州通判的身份奉命到常州、润州一带赈济灾民，第二年春天还在润州丹徒。家人留在杭州，他独自在外，过了清明。年谱记载，他这时收到家乡来信，写了《蝶恋花》，又写《画堂春》寄给弟弟苏辙。这首词具体写给谁，词里没有说明。从“咫尺江山”看，思念的可能是杭州的家人，也可能只是泛指远方的亲人。","mood":"词里写的是客居在外、又逢节令的孤单，和对亲人的牵挂。落花、鸟啼、黄昏、五更的号角，一层层把思念推到失眠和心痛。这时他离开杭州已经几个月，每天的公务是查看灾情、救济饥民，心情本就不轻松。润州离杭州并不远，却见不到面、等不来消息。这种近在眼前却见不着的滋味，有时比远隔千里更难受。整首词没有他常有的自我宽解，情绪一直低到结尾。","lines":[{"line":"客里风光，又过清明节。","note":"清明本该与家人一起扫墓、踏青，他却在外地办赈灾的公事。一个“又”字，带出年复一年漂泊在外的疲倦。"},{"line":"咫尺江山分楚越。","note":"润州和杭州相隔不远，却像古代的楚国和越国一样被山水隔开。离得越近，见不着面越让人难受。"},{"line":"梦破五更心欲折。","note":"梦里刚和亲人相聚，五更天就醒了。醒来发现还是一个人在客中，心痛得像要折断。"}],"moods":["怀人","羁旅"],"caveat":"年谱里“得乡书，赋《蝶恋花》”一条，通常认为指的是另一首《蝶恋花·京口得乡书》（雨后春容清更丽）。这首“春事阑珊芳草歇”是否也写于此时、是否与这封家信有关，并没有确切证据，这里的编年只是一种看法。"},"352253":{"background":"这首词作于何时，说法不一。按所给编年，熙宁七年（1074）三月苏轼在润州丹徒，当时他是杭州通判，因公事离开杭州在外奔走，一路思念钱塘，常写诗寄给知州陈襄。词题只写“即事”，没有交代为谁而写，只能看出是一次江上重游：官船插着旗，有歌者唱曲，众人饮酒作乐。具体是哪次游宴、有哪些同伴，史料没有记载，不能确指。","mood":"这首词表面上是游乐，底下却是对年华老去的在意。“流年”“霜鬓”这些字眼说明，他已经感到岁月在催人老。他的应对办法是不惆怅，在歌声、美酒和温情里把时光留住。这不是真的无忧无虑，而是一个仕途不如意、长年在外的人有意放宽心，拿眼前的欢乐来对抗年岁流逝。","lines":[{"line":"画隼横江喜再游。","note":"画着隼鸟的官旗横在江面，旧地重游，开篇是欣喜的。“再”字说明他对这个地方有感情，也有物是人非的意思。"},{"line":"流年未肯付东流。","note":"不愿让年华像江水一样白白流走。一边看着眼前的江水，一边心里起了不甘，这是全词情绪转折的地方。"},{"line":"挽回霜鬓莫教休。","note":"鬓发已经花白，还想把青春挽留回来，别让兴致就此停下。话说得很硬，里面藏着对衰老的无奈。"}],"moods":["旷达","感时"],"caveat":"编年有疑问：词中写到“黄菊”，应是秋天，和三月不合；“画隼”通常是知州的旗帜，有学者因此认为这首词作于他后来任知州时，比如元祐年间再到杭州，重游之说也更说得通。具体年份和场合目前没有定论。"},"352004":{"background":"熙宁七年七夕，苏轼在杭州通判任上写这首词，送别友人陈令举（陈舜俞）。陈令举曾因不肯推行青苗法被贬，之后一直闲居，常和苏轼一起游玩唱和。这一年苏轼任期快满了，年谱记载他写信给湖州的李常，说自己要去湖州，可见他也在为离开杭州做打算。七夕向来是写牛郎织女离别的日子，他选在这天送朋友，有意不写男女之情，写的是朋友之间的聚散。","mood":"这首词里有舍不得，但他有意不让情绪变得缠绵。上片用王子乔的故事：月下吹箫，举手向众人告别，然后离去。他用这个故事称赞朋友走得洒脱，不像牛郎织女那样难分难舍。下片先说相逢一醉是前缘，是在宽慰朋友；最后问一场风雨过后各人去了哪里，又流露出聚散无定的惆怅。那几年朋友们大多因为和新法不合而分散各地，他自己也快要离开杭州。他表面上很旷达，底下是由不得自己的漂泊感。","lines":[{"line":"缑山仙子，高情云渺，不学痴牛𫘤女。","note":"开头就不走七夕的老套路：拿洒脱离去的仙人比朋友，劝他不必像牛郎织女那样为离别所苦。"},{"line":"凤箫声断月明中，举手谢、时人欲去。","note":"借王子乔月下举手告别的故事，写朋友走得从容，也写出送行的人站在原地看着他离开的心情。"},{"line":"相逢一醉是前缘，风雨散、飘然何处。","note":"先说今天能聚在一起醉一场是缘分，以此宽慰朋友；接着问风雨过后各在何处，说出聚散由不得人的怅惘。"}],"moods":["送别","旷达"],"caveat":"通常把这首词定在熙宁七年七夕、作于杭州。但有赏析认为下片的“客槎”“相逢一醉”指的是同年秋天苏轼离开杭州以后，和陈令举等人在湖州的“六客之会”以及松江夜饮。这些事都发生在七夕之后，和七夕作词的说法时间上对不上，所以下片写的究竟是哪一次同游，目前还不能确定。"},"351996":{"background":"熙宁七年秋，苏轼在杭州通判任上已满三年。弟弟苏辙在齐州做官，他请求调到北方，好离弟弟近些，朝廷就派他去做密州知州。杨元素就是杨绘，和苏轼同是蜀人，也因为和新法不合而外放。这一年他刚接替陈襄任杭州知州，两人共事只有几个月。九月初八，杨绘设宴为苏轼送行。第二天就是重阳，苏轼在席上写了这首词作别。","mood":"按习俗，重阳要登高、饮酒、赏菊，本是开心的日子，这一回却撞上分别，所以词一开头就感叹好日子和开心事自古难得两全。苏轼在杭州住了三年，湖山和朋友都已熟悉，现在却要去北方一个陌生的小州，以后在哪里、什么时候能回来都说不准。词里的凄凉，一半是舍不得眼前的朋友，一半是感慨自己总在各地之间调来调去，定不下来。","lines":[{"line":"良辰乐事古难全。","note":"明天就是重阳，正该登高相聚，自己却要动身离开。佳节和离别碰在一起，他只能说这种事自古就难两全。"},{"line":"璧月琼枝空夜夜，菊花人貌自年年。","note":"杭州的月色和花木每晚照旧，菊花年年照样开，可一旦人走了，这些美景就和自己无关了，景物不变反倒更让人觉得人事难料。"},{"line":"不知来岁与谁看。","note":"明年重阳会在密州，身边是谁、和谁一起赏菊都不知道。这句话既是对杨绘的不舍，也说出了他对前路没有把握。"}],"moods":["送别","感时"],"caveat":"题中的“杨元素”一般认为是杨绘。词里的“危楼”具体是杭州哪座楼，没有确切记载。年谱中“九月八日以病不赴陈襄重九之会”一条，可能是前一年的事，因为陈襄这年已经离开杭州，所以不要和这次饯别混为一谈。"},"351997":{"background":"熙宁七年九月，苏轼在杭州通判任上已满三年，调任密州知州的消息已经确定，不久就要离开。词题“重九旧韵”说明这是重阳前后的作品，沿用了旧作的韵脚，一般认为指他前一年在杭州写的重九词。词中的“君”才情出众，曾在席间当场写出清雅的曲词，但具体是谁，现存材料说不清楚。看得出来，这首词是在一次宴席上，写给这位即将分别的友人的。","mood":"上片赞赏对方的才情，语气轻快；下片转到离别，越写越沉。苏轼即将北上密州，杭州的友人也各有调动，相聚的时间屈指可数。同样是重阳，风景和去年差不多，人却马上要分散了。他没有在词里直说自己仕途上的失意，只写对眼前这位朋友的珍惜和舍不得，以及对何时再见的茫然。","lines":[{"line":"异乡风景却依然","note":"杭州本来是他乡，又到重阳，景物和往年一样。景物照旧，人却要走了，惜别的意思从这里开始出现。"},{"line":"可恨相逢能几日，不知重会是何年","note":"刚刚相聚就要分别，以后什么时候能再见也不知道。这时调任已成定局，这句话说的
